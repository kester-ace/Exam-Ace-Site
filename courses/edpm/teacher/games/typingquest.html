<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><!-- gamesave:start --><script id="gamesave-kit">
/* GameSave: every game remembers its progress on this device, and can start over. Developed by Kester Small
   API (window.GameSave):
     GameSave.id                      this game's id (from <html data-game="…">, else the page name)
     GameSave.register(['key', 'prefix*', /regex/])   storage keys that belong to this game (also caught automatically when set with localStorage.setItem)
     GameSave.persist({ key, get, set, every })       save get() under key (on every save(), every `every` ms, and when the page is hidden); on load call set(saved) once
     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)
     GameSave.onReset(fn)             run fn before the page reloads after a reset
     GameSave.startOver()             ask "Start over?" and, if confirmed, clear this game's saved progress and reload
     GameSave.reset({reload})         clear without asking
   Inside the course the player bar shows "↺ Start over"; on its own page a small "↺ Start over" button appears unless
   <html data-gs-own> says the game already has its own visible reset (which should call GameSave.startOver()). */
(function () {
  if (window.GameSave) return;
  var LS = null; try { LS = window.localStorage; LS.getItem('gs:probe'); } catch (e) { LS = null; }
  var html = document.documentElement;
  var page = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
  var id = html.getAttribute('data-game') || page;
  if (!id || /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(id)) id = (document.title || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'game';
  var REG = 'gs:keys:' + id;
  var SKIP = /^(gs:|ws\.|course\.|nocopy|simsave)/;
  var keys = []; try { keys = JSON.parse((LS && LS.getItem(REG)) || '[]') || []; } catch (e) { keys = []; }
  var patterns = [], hooks = [], persisters = [], rawSet = null;
  function track(k) {
    k = String(k); if (!LS || SKIP.test(k) || keys.indexOf(k) >= 0) return;
    keys.push(k); try { (rawSet || LS.setItem).call(LS, REG, JSON.stringify(keys)); } catch (e) { }
  }
  if (LS) {
    try {
      var proto = Object.getPrototypeOf(LS); rawSet = proto.setItem;
      proto.setItem = function (k, v) { var r = rawSet.apply(this, arguments); if (this === LS) track(k); return r; };
    } catch (e) { rawSet = null; }
  }
  function matches(k) {
    if (keys.indexOf(k) >= 0) return true;
    return patterns.some(function (p) { return p instanceof RegExp ? p.test(k) : (p.slice(-1) === '*' ? k.indexOf(p.slice(0, -1)) === 0 : k === p); });
  }
  function owned() { var out = []; if (!LS) return out; for (var i = 0; i < LS.length; i++) { var k = LS.key(i); if (k && !SKIP.test(k) && matches(k)) out.push(k); } return out; }
  var resetting = false;
  function reset(opt) {
    opt = opt || {}; resetting = true;
    hooks.forEach(function (fn) { try { fn(); } catch (e) { } });
    owned().forEach(function (k) { try { LS.removeItem(k); } catch (e) { } });
    persisters.forEach(function (p) { try { LS.removeItem(p.key); } catch (e) { } });
    try { LS.removeItem(REG); } catch (e) { }
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'gs:reset-done', id: id }, '*'); } catch (e) { }
    if (opt.reload !== false) setTimeout(function () { location.reload(); }, 60);
  }
  function css() {
    if (document.getElementById('gs-css')) return;
    var st = document.createElement('style'); st.id = 'gs-css';
    st.textContent = '.gs-modal{position:fixed;inset:0;z-index:2147483600;display:grid;place-items:center;padding:16px;background:rgba(3,8,24,.62);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}' +
      '.gs-box{max-width:420px;width:100%;background:#0F1E4A;color:#F1F4FF;border:2px solid #F5C542;border-radius:16px;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}' +
      '.gs-box h2{margin:0 0 8px;font-size:1.2rem;color:#FFE38A}.gs-box p{margin:0 0 14px}' +
      '.gs-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}' +
      '.gs-row button{font:700 14px system-ui,sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer;border:2px solid #F5C542}' +
      '.gs-keep{background:transparent;color:#F1F4FF}.gs-go{background:#F5C542;color:#0A1433}' +
      '.gs-row button:focus-visible{outline:3px solid #fff;outline-offset:2px}' +
      '.gs-pill{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483500;font:700 12px/1 system-ui,sans-serif;color:#fff;background:rgba(10,20,51,.85);border:1px solid rgba(245,197,66,.7);border-radius:99px;padding:7px 11px;cursor:pointer;opacity:.6}' +
      '.gs-pill:hover,.gs-pill:focus-visible{opacity:1;background:#F5C542;color:#0A1433}' +
      '.gs-toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:2147483550;background:#0F1E4A;color:#F1F4FF;border:1px solid #F5C542;border-radius:99px;padding:8px 16px;font:700 13px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .4s}' +
      '@media print{.gs-pill,.gs-toast,.gs-modal{display:none!important}}';
    (document.head || document.documentElement).appendChild(st);
  }
  function toast(msg) {
    if (!document.body) return; css();
    var t = document.createElement('div'); t.className = 'gs-toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; }, 2600); setTimeout(function () { t.remove(); }, 3100);
  }
  function startOver() {
    if (!document.body) return reset();
    if (document.querySelector('.gs-modal')) return;
    css();
    var prev = document.activeElement;
    var m = document.createElement('div'); m.className = 'gs-modal';
    m.innerHTML = '<div class="gs-box" role="alertdialog" aria-modal="true" aria-labelledby="gs-t" aria-describedby="gs-d"><h2 id="gs-t">Start this game again?</h2>' +
      '<p id="gs-d">Your saved progress in this game on this device will be cleared and the game will start from the beginning. Work you have already submitted and your course progress are not affected.</p>' +
      '<div class="gs-row"><button type="button" class="gs-keep">Keep my progress</button><button type="button" class="gs-go">↺ Start over</button></div></div>';
    document.body.appendChild(m);
    var keep = m.querySelector('.gs-keep'), go = m.querySelector('.gs-go');
    function close() { m.remove(); document.removeEventListener('keydown', onKey, true); try { prev && prev.focus && prev.focus(); } catch (e) { } }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } if (e.key === 'Tab') { e.preventDefault(); (document.activeElement === keep ? go : keep).focus(); } }
    keep.addEventListener('click', close); go.addEventListener('click', function () { close(); reset(); });
    m.addEventListener('click', function (e) { if (e.target === m) close(); });
    document.addEventListener('keydown', onKey, true); keep.focus();
  }
  function saveAll() {
    if (resetting || !LS) return;
    persisters.forEach(function (p) { try { var v = p.get(); if (v !== undefined) (rawSet || LS.setItem).call(LS, p.key, JSON.stringify({ v: v, at: Date.now() })); } catch (e) { } });
  }
  function persist(o) {
    if (!o || typeof o.get !== 'function') return false;
    var p = { key: o.key || ('gsave.' + id), get: o.get }; persisters.push(p); track(p.key);
    var restored = false;
    if (LS && typeof o.set === 'function') {
      try { var raw = LS.getItem(p.key); if (raw) { var d = JSON.parse(raw); if (d && 'v' in d) { o.set(d.v); restored = true; } } } catch (e) { }
    }
    if (o.every) setInterval(saveAll, Math.max(2000, +o.every || 0));
    if (restored && o.welcome !== false) setTimeout(function () { toast('Welcome back! Your progress was restored.'); }, 400);
    return restored;
  }
  window.addEventListener('pagehide', saveAll);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveAll(); });
  window.addEventListener('message', function (e) { var d = e.data; if (d && d.type === 'gs:reset') { if (d.ask === false) reset(); else startOver(); } });
  function pill() {
    if (window.parent !== window || html.hasAttribute('data-gs-own') || html.hasAttribute('data-gs-none') || !document.body || document.querySelector('.gs-pill')) return;
    css(); var b = document.createElement('button'); b.type = 'button'; b.className = 'gs-pill'; b.textContent = '↺ Start over'; b.title = 'Clear your saved progress in this game and start again';
    b.addEventListener('click', startOver); document.body.appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pill); else pill();
  window.GameSave = {
    id: id,
    register: function (list) { (Array.isArray(list) ? list : [list]).forEach(function (k) { if (k instanceof RegExp || (typeof k === 'string' && k.slice(-1) === '*')) patterns.push(k); else if (k) track(k); }); },
    persist: persist, save: saveAll, onReset: function (fn) { if (typeof fn === 'function') hooks.push(fn); },
    startOver: startOver, reset: reset, keys: owned, toast: toast
  };
})();

</script><!-- gamesave:end -->
<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

<style>
/* Layout: sticky top bar over one scrolling stage. Home = world cards + lab lessons; play = HUD, arena (overlays inside), keyboard below. */
:root{

 --key:#ffffff;--keyline:#a9b9cb;--keyink:#17283a;
 --f-pinky:#f6bccb;--f-ring:#f7d595;--f-mid:#aee0b8;--f-index:#abcdf6;--f-thumb:#d3c3f5;
 --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
 --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
 --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0b1420;--panel:#132131;--panel2:#1b2f45;--ink:#e9f1f9;--muted:#9db0c5;--line:#2a4259;
 --accent:#6aa8ff;--accent-ink:#06182e;--good:#4fd1a1;--bad:#ff8590;--star:#ffc533;
 --key:#1b3048;--keyline:#3a5a7b;--keyink:#e9f1f9;
 --f-pinky:#7b3a4f;--f-ring:#7c5f26;--f-mid:#2f6b43;--f-index:#2e5a94;--f-thumb:#5b4a8f;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0b1420;--panel:#132131;--panel2:#1b2f45;--ink:#e9f1f9;--muted:#9db0c5;--line:#2a4259;
 --accent:#6aa8ff;--accent-ink:#06182e;--good:#4fd1a1;--bad:#ff8590;--star:#ffc533;
 --key:#1b3048;--keyline:#3a5a7b;--keyink:#e9f1f9;
 --f-pinky:#7b3a4f;--f-ring:#7c5f26;--f-mid:#2f6b43;--f-index:#2e5a94;--f-thumb:#5b4a8f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,44px)}h2{font-size:clamp(22px,3.4vw,28px)}h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:6px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--font-display);font-weight:700;font-size:25px}
.brand i{font-style:normal;background:var(--f-index);color:var(--keyink);border:1px solid var(--keyline);border-bottom-width:4px;border-radius:8px;padding:0 9px;font-family:var(--font-mono);font-size:18px;line-height:30px}
.nav{display:flex;gap:6px;flex:1;min-width:0}
.nav button,.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px}
.nav button[aria-current="page"],.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hud-top{display:flex;gap:8px;align-items:center;font-weight:800}
.star{color:var(--star)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
/* hero */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center;margin-top:6px}
.hero p{font-size:18px;color:var(--muted);margin-top:10px;max-width:52ch}
.caps{display:flex;gap:8px;justify-content:center}
.caps b{width:clamp(48px,9vw,74px);height:clamp(52px,10vw,80px);border-radius:12px;border:1px solid var(--keyline);border-bottom-width:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:clamp(22px,4vw,34px);color:var(--keyink)}
.caps b:nth-child(1){background:var(--f-index)}.caps b:nth-child(2){background:var(--f-pinky);transform:translateY(8px)}.caps b:nth-child(3){background:var(--f-ring)}.caps b:nth-child(4){background:var(--f-mid);transform:translateY(8px)}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.goal-i{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.goal-i .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:800}
.goal-i b{display:block}.goal-i span{color:var(--muted);font-size:14px}
/* worlds */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.wcard{position:relative;overflow:hidden;border:0;border-radius:20px;padding:18px;min-height:190px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;background:linear-gradient(145deg,var(--w1),var(--w2));box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .15s}
.wcard:hover{transform:translateY(-3px)}
.wcard .sp{position:absolute;top:10px;right:14px;font-size:62px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.wcard .tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.wcard h3{font-size:26px}.wcard p{font-size:15px;opacity:.95}
.wcard .st{margin-top:6px;font-weight:800;font-size:14px}
.world-jungle{--w1:#0a4a2a;--w2:#1b7a44}.world-underwater{--w1:#07507f;--w2:#0a82b0}.world-space{--w1:#0a0d2e;--w2:#3b2a85}
.world-caribbean{--w1:#066679;--w2:#0a8ea2}.world-dino{--w1:#733510;--w2:#b3561b}.world-robot{--w1:#12244a;--w2:#2b4a8c}
/* world screen */
.whead{border-radius:20px;color:#fff;padding:20px;background:linear-gradient(145deg,var(--w1),var(--w2));display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.whead .sp{font-size:60px}.whead>div{flex:1;min-width:220px}
.whead .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
.whead .chip[aria-pressed="true"]{background:#fff;color:#10202f;border-color:#fff}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lv{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:120px}
.lv:hover:not(:disabled){border-color:var(--accent)}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv .big{font-family:var(--font-display);font-weight:700;font-size:20px}
.lv small{color:var(--muted)}
.stars{font-size:20px;letter-spacing:2px}.stars .off{opacity:.25}
/* play */
.hud{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 2px}
.hud b{font-family:var(--font-display);font-size:20px}
.hud .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-family:var(--font-mono);font-size:14px}
.hearts{color:var(--bad);letter-spacing:2px;font-size:18px}
.prog{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-bottom:8px}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.arena{position:relative;overflow:hidden;border-radius:20px;height:clamp(320px,56vh,460px);color:#fff;user-select:none;border:3px solid rgba(0,0,0,.25)}
.arena.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arena.world-jungle{background:radial-gradient(120% 60% at 50% 110%,#0b5a30 0 40%,transparent 41%),linear-gradient(#2c8f55,#0a3d23)}
.arena.world-underwater{background:radial-gradient(circle at 20% 80%,rgba(255,255,255,.1) 0 3px,transparent 4px),linear-gradient(#0b86b8,#042a52 70%,#021a35)}
.arena.world-space{background:#050818}
.arena.world-space::before{content:"";position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;left:0;top:0;box-shadow:40px 60px #fff,120px 220px #cfe,220px 90px #fff,330px 300px #fcd,410px 40px #fff,520px 180px #dff,610px 330px #fff,700px 70px #cef,790px 250px #fff,880px 120px #fed,960px 360px #fff,90px 380px #fff,300px 150px #bdf,560px 400px #fff,740px 400px #fff,1010px 220px #fff,1100px 80px #cdf,450px 290px #fff,170px 30px #fff,660px 20px #fff}

setF(['Digit3','KeyE','KeyD','KeyC'],'mid','left');
setF(['Digit4','Digit5','KeyR','KeyT','KeyF','KeyG','KeyV','KeyB'],'index','left');
setF(['Digit6','Digit7','KeyY','KeyU','KeyH','KeyJ','KeyN','KeyM'],'index','right');
setF(['Digit8','KeyI','KeyK','Comma'],'mid','right');
setF(['Digit9','KeyO','KeyL','Period'],'ring','right');
setF(['Digit0','Minus','Equal','Backspace','KeyP','BracketLeft','BracketRight','Backslash','Semicolon','Quote','Enter','Slash','ShiftRight','ControlRight'],'pinky','right');
setF(['Space','AltLeft','AltRight'],'thumb','both');
const FNAME={pinky:'pinky',ring:'ring finger',mid:'middle finger',index:'index finger',thumb:'thumb'};
const PUNCT={',':'Comma','.':'Period','-':'Minus',"'":'Quote',';':'Semicolon','/':'Slash','?':'Slash','!':'Digit1',':':'Semicolon','"':'Quote'};
function codeOf(ch){if(ch===' ')return 'Space';if(/[a-z]/i.test(ch))return 'Key'+ch.toUpperCase();if(/[0-9]/.test(ch))return 'Digit'+ch;return PUNCT[ch]||null}
function needsShift(ch){return /[A-Z?!:"]/.test(ch)}
function fingerText(ch){const c=codeOf(ch);if(!c||!FM[c])return '';const f=FM[c];let t=(f.h==='both'?'thumb':f.h+' '+FNAME[f.f]);if(needsShift(ch)){const sh=f.h==='left'?'right':'left';t+=' (hold Shift with your '+sh+' pinky)'}return t}
let KBS=[];
function buildKB(host,opts){
 opts=opts||{};host.innerHTML='';
 const kb=document.createElement('div');kb.className='kb'+(opts.plain?'':' color');
 const map={},rows=[];
 KROWS.forEach((row,ri)=>{const r=document.createElement('div');r.className='kr';rows.push(r);
  row.forEach(a=>{const code=a[0],label=a[1],w=a[2]||1;const k=document.createElement('div');
   k.className='key f-'+(FM[code]?FM[code].f:'x');k.style.flex=w+' 1 0';k.dataset.code=code;
   k.textContent=/^[a-z]$/.test(label)?label.toUpperCase():label;
   if(code==='KeyF'||code==='KeyJ')k.classList.add('bump');map[code]=k;r.appendChild(k)});
  kb.appendChild(r)});
 const w=document.createElement('div');w.className='kbw';w.appendChild(kb);host.appendChild(w);
 const o={el:kb,map:map,rows:rows};KBS.push(o);return o;
}
function setHi(kb,codes){Object.values(kb.map).forEach(k=>k.classList.remove('hi'));(codes||[]).forEach(c=>{if(kb.map[c])kb.map[c].classList.add('hi')})}
function kbPress(code,on){KBS.forEach(kb=>{const k=kb.map[code];if(k)k.classList.toggle('down',on)})}

/* ---------- TYPER (shared by Copy Race and Lab drills) ---------- */
function makeTyper(host,text,o){
 o=o||{};
 host.innerHTML='<div class="passage"></div><div class="hint"></div><div class="stats3"><span class="s-wpm">0 WPM</span><span class="s-acc">100% accuracy</span><span class="s-time">0.0 s</span></div><div class="gamekb tkb"></div>';
 const pass=$('.passage',host),hint=$('.hint',host),kbHost=$('.tkb',host);
 const spans=[];[...text].forEach(ch=>{const s=document.createElement('span');s.className='c';s.textContent=ch;pass.appendChild(s);spans.push(s)});
 const kb=o.kb?buildKB(kbHost):null;if(!o.kb)kbHost.hidden=true;
 let pos=0,errors=0,correct=0,start=0,done=false;
 const timer=setInterval(()=>{if(start&&!done)stats()},200);
 function stats(){const el=start?(performance.now()-start)/1000:0;const wpm=el>1?Math.round(correct/5/(el/60)):0;const acc=Math.round(100*correct/Math.max(1,correct+errors));
  $('.s-wpm',host).textContent=wpm+' WPM';$('.s-acc',host).textContent=acc+'% accuracy';$('.s-time',host).textContent=el.toFixed(1)+' s';return {wpm:wpm,acc:acc,time:el}}
 function mark(){
  spans.forEach((s,i)=>{if(i===pos)s.classList.add('cur')});
  const ch=text[pos];const lbl=ch===' '?'Space':ch;
  hint.innerHTML='Next: <b>'+esc(lbl)+'</b> · '+fingerText(ch);
  if(kb){const codes=[codeOf(ch)];if(needsShift(ch)){const f=FM[codeOf(ch)];codes.push(f&&f.h==='left'?'ShiftRight':'ShiftLeft')}setHi(kb,codes.filter(Boolean))}
  const c=spans[pos];if(c&&c.scrollIntoView&&c.getBoundingClientRect().bottom>innerHeight)c.scrollIntoView({block:'center'});
 }
 keyHandler=e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Escape'){if(o.onEsc)o.onEsc();return}
  if(e.key.length!==1)return;e.preventDefault();if(done)return;
  if(!start)start=performance.now();
  if(e.key===text[pos]){spans[pos].className='c ok';pos++;correct++;S.hits++;sfx.key(Math.floor(pos/8));
   if(pos>=text.length){done=true;clearInterval(timer);if(kb)setHi(kb,[]);hint.textContent='Finished!';const st=stats();save();if(o.onDone)o.onDone({wpm:Math.max(1,Math.round(text.length/5/(st.time/60))),acc:Math.round(100*correct/Math.max(1,correct+errors)),time:st.time,errors:errors});return}
   mark()}
  else{errors++;S.misses++;sfx.miss();const s=spans[pos];s.classList.add('bad');setTimeout(()=>s.classList.remove('bad'),200)}
  stats();
 };
 mark();
 return {destroy(){clearInterval(timer)}};
}

  <div class="hint" id="hint"></div><div class="gamekb" id="gkb"></div></div>`;
 const arena=$('#arena'),toks=$('#toks'),ov=$('#ov'),fx=$('#fx'),hint=$('#hint');
 const kb=S.kb?buildKB($('#gkb')):null;
 const g={state:'ready',dir:W.dir,tokens:[],lock:null,spawned:0,resolved:0,hits:0,miss:0,lives:sp.lives,score:0,combo:0,bestCombo:0,t:0,active:0,charsOK:0,nextSpawn:.6,last:performance.now(),dead:false,
  factAt:[Math.floor(L.n/3),Math.floor(2*L.n/3)],factIdx:0,factPool:shuffle(W.facts),lastWord:''};
 game=g;
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 function show(html,binds){ov.hidden=false;ov.innerHTML=html;(binds||[]).forEach(b=>{const el=$(b[0],ov);if(el)el.addEventListener('click',b[1])})}
 function hide(){ov.innerHTML='';ov.hidden=true}
 function hud(){
  $('#hScore').textContent=g.score+' pts';const m=1+Math.min(4,Math.floor(g.combo/4));$('#hCombo').textContent='x'+m+(g.combo?' · '+g.combo+' in a row':'');
  const w=g.active>3?Math.round(g.charsOK/5/(g.active/60)):0;$('#hWpm').textContent=w+' WPM';
  $('#hLives').textContent='♥'.repeat(Math.max(0,g.lives))+'♡'.repeat(sp.lives-Math.max(0,g.lives));
  $('#pbar').style.width=Math.round(100*g.resolved/L.n)+'%';
 }
 function draw(tk){tk.el.innerHTML='<span class="sp">'+tk.sprite+'</span><span><b class="typed">'+tk.word.slice(0,tk.typed)+'</b>'+tk.word.slice(tk.typed)+'</span>'}
 function place(tk,Wd,Ht){
  const p=tk.p,d=g.dir;let x,y;
  if(d==='down'||d==='up'){
   x=clamp((tk.lane+.5)/tk.nL*Wd,tk.hw+8,Wd-tk.hw-8)+(d==='up'?Math.sin(g.t*1.6+tk.seed)*9:0);
   const a=d==='down'?tk.hh+4:Ht-tk.hh-4,b=d==='down'?Ht-tk.hh-26:tk.hh+26;y=a+(b-a)*p;
  }else{
   y=clamp((tk.lane+.5)/tk.nL*Ht,tk.hh+6,Ht-tk.hh-6)+(d==='right'?Math.sin(g.t*2.2+tk.seed)*5:0);
   const a=d==='right'?tk.hw+6:Wd-tk.hw-6,b=d==='right'?Wd-tk.hw-30:tk.hw+30;x=a+(b-a)*p;
  }
  tk.x=x;tk.y=y;tk.el.style.transform='translate('+Math.round(x-tk.hw)+'px,'+Math.round(y-tk.hh)+'px)';
 }
 function spawn(Wd,Ht){
  const vert=g.dir==='down'||g.dir==='up';const nL=vert?clamp(Math.floor(Wd/190),2,5):clamp(Math.floor(Ht/72),3,5);
  const busy=g.tokens.filter(t=>t.p<.2).map(t=>t.lane);let lanes=[];for(let i=0;i<nL;i++)if(busy.indexOf(i)<0)lanes.push(i);
  const lane=lanes.length?rnd(lanes):Math.floor(Math.random()*nL);
  let word,tries=0;do{word=rnd(pool);tries++}while((word===g.lastWord||g.tokens.some(t=>t.word===word))&&tries<12);g.lastWord=word;
  const el=document.createElement('div');el.className='tok';toks.appendChild(el);
  const tk={word:word,typed:0,p:0,lane:lane,nL:nL,el:el,sprite:rnd(W.items),seed:Math.random()*6.28,hw:0,hh:0,x:0,y:0};
  draw(tk);tk.hw=el.offsetWidth/2;tk.hh=el.offsetHeight/2;g.tokens.push(tk);g.spawned++;place(tk,Wd,Ht);hintUpdate();
 }
 function burst(x,y){for(let i=0;i<7;i++){const s=document.createElement('span');s.className='pt';s.textContent=rnd(W.burst);s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*120-60)+'px');s.style.setProperty('--dy',(Math.random()*120-60)+'px');arena.appendChild(s);setTimeout(()=>s.remove(),720)}}
 function laser(x,y){if(!W.laser)return;const Ht=arena.clientHeight;const ax=34,ay=Ht/2;const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',ax);ln.setAttribute('y1',ay);ln.setAttribute('x2',x);ln.setAttribute('y2',y);ln.setAttribute('stroke',W.laser);ln.setAttribute('stroke-width','5');ln.setAttribute('stroke-linecap','round');fx.appendChild(ln);setTimeout(()=>ln.remove(),160)}
 function shake(){arena.classList.remove('shake');void arena.offsetWidth;arena.classList.add('shake')}
 function hintUpdate(){
  let tk=g.lock;if(!tk&&g.tokens.length)tk=g.tokens.reduce((a,b)=>a.p>b.p?a:b);
  if(!tk){hint.textContent='';if(kb)setHi(kb,[]);return}
  const ch=g.lock?tk.word[tk.typed]:tk.word[0];
  hint.innerHTML=g.lock?'Next key: <b>'+ch.toUpperCase()+'</b> · '+fingerText(ch):'Closest word: <b>'+tk.word+'</b> · start with <b>'+ch.toUpperCase()+'</b> · '+fingerText(ch);

  if(g.resolved>=L.n&&g.tokens.length===0){finish(true);return}
  if(g.factIdx<g.factAt.length&&g.resolved>=g.factAt[g.factIdx]&&g.resolved<L.n){g.factIdx++;showFact()}

 function complete(tk){
  g.tokens.splice(g.tokens.indexOf(tk),1);if(g.lock===tk)g.lock=null;tk.el.remove();
  g.combo++;g.bestCombo=Math.max(g.bestCombo,g.combo);const m=1+Math.min(4,Math.floor(g.combo/4));
  g.score+=Math.round(tk.word.length*10*m*sp.bonus);g.resolved++;burst(tk.x,tk.y);laser(tk.x,tk.y);sfx.word(g.combo);hintUpdate();progress();
 }
 function lose(tk){
  g.tokens.splice(g.tokens.indexOf(tk),1);if(g.lock===tk)g.lock=null;tk.el.remove();
  g.lives--;g.combo=0;g.resolved++;sfx.life();shake();hintUpdate();
  if(g.lives<=0){finish(false);return}progress();
 }
 function typeChar(c){
  let tk=g.lock;
  if(!tk){const c2=g.tokens.filter(t=>t.word[0]===c);if(c2.length){tk=c2.reduce((a,b)=>a.p>b.p?a:b);g.lock=tk;tk.el.classList.add('lock')}}
  if(tk&&tk.word[tk.typed]===c){tk.typed++;g.hits++;S.hits++;g.charsOK++;sfx.key(g.combo);if(tk.typed>=tk.word.length)complete(tk);else{draw(tk);hintUpdate()}}
  else{g.miss++;S.misses++;g.combo=0;sfx.miss();shake();hud()}
  hintUpdate();

 function step(dt){
  const Wd=arena.clientWidth,Ht=arena.clientHeight;g.active+=dt;g.t+=dt;g.nextSpawn-=dt;
  if(g.spawned<L.n&&g.tokens.length===0&&g.nextSpawn>.4)g.nextSpawn=.4;
  if(g.spawned<L.n&&g.nextSpawn<=0){spawn(Wd,Ht);g.nextSpawn=L.gap/sp.m*(.85+Math.random()*.3)}
  const T=L.travel/sp.m;
  g.tokens.slice().forEach(tk=>{if(g.state!=='run')return;tk.p+=dt/T;if(tk.p>=1)lose(tk);else place(tk,Wd,Ht)});
  if(Math.floor(g.active*2)%2===0)hud();

      '<div class="f"><label>Subjects in your plan</label><div class="subs">' + SUBJ_ORDER.map(function (k) { return '<label><input type="checkbox" data-sub="' + k + '"' + (d.plan.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(subjName(k)) + '</label>'; }).join('') + '</div></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn big" data-act="save">Enter the arena</button></div>';
  }
  function viewList() {
    var me = S.me, out = '';
    out += '<div class="me">' + avHTML(me.avatar) + '<div class="grow"><div class="nm">' + esc(me.name) + ' ' + esc(me.flag) + '</div><div class="sub">' + esc(me.cls || 'No class') + ' · ' + me.plan.length + ' subject' + (me.plan.length === 1 ? '' : 's') + '</div></div>' + (me.locked ? '' : '<button class="btn2" data-act="edit">Edit</button>') + '</div>';
    out += '<label>Challenge subject</label><select id="subj">' + me.plan.map(function (k) { return '<option value="' + k + '"' + (k === S.subject ? ' selected' : '') + '>' + esc(subjName(k)) + '</option>'; }).join('') + '</select>';
    var live = S.conn === 'live' || S.conn === 'local';
    var ids = Object.keys(S.players).filter(function (k) { return S.filter === 'all' || (S.players[k].user.cls || '').toLowerCase() === (me.cls || '').toLowerCase(); });
    ids.sort(function (a, b) { var A = S.players[a], B = S.players[b]; return (A.status === 'match') - (B.status === 'match') || A.user.name.localeCompare(B.user.name); });
    out += '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Everyone</button><button class="chip ' + (S.filter === 'class' ? 'on' : '') + '" data-filter="class">My class</button></div>';
    out += '<div class="status"><i class="' + (live ? '' : 'off') + '"></i>' + (live ? ids.length + ' in the arena now · updates every few seconds' : S.conn === 'error' ? 'Can\'t reach the arena. Retrying…' : 'Connecting…') + '</div>';
    if (S.host) out += viewLobby();
    if (S.pendingJoin) out += '<div class="card"><h3>Joining ' + esc(S.pendingJoin.name) + '\'s match…</h3><div class="sub">Hang tight.</div></div>';
    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
