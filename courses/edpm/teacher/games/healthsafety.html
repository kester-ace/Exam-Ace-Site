<!doctype html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Health &amp; Safety Squad</title>
<meta name="description" content="Health and safety in the computerised office. A four-mode game for CSEC EDPM. Kester Small">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
:root{
  --bg:#edf4f3; --paper:#ffffff; --ink:#122a2e; --ink2:#4a5f63; --ink3:#73878a; --line:#d3e2e0; --line2:#bcd2cf;
  --teal:#0e7c78; --teal-d:#075450; --teal-m:#3aa9a3; --teal-l:#d9f1ee;
  --yel:#ffcb2b; --yel-d:#9a6c00; --yel-l:#fff4cf;
  --red:#cf3a30; --red-l:#fde4e1; --green:#1d8048; --green-l:#dcf2e4;
  --display:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(10,40,40,.06),0 8px 22px rgba(10,40,40,.08);
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1a5cff;outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;display:flex;flex-direction:column;max-width:100vw;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);flex:none;position:relative}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:repeating-linear-gradient(-45deg,var(--yel) 0 10px,#1c2a2c 10px 20px);opacity:.9}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 4px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.2px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--yel-l);color:#6b4b00;font-weight:700;font-size:13.5px;white-space:nowrap}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:14px;min-height:36px}
.ibtn:hover{background:var(--teal-l)}
.ibtn svg{width:18px;height:18px}
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.screen{max-width:1060px;margin:0 auto;padding:20px 16px 28px}
footer{flex:none;text-align:center;font-size:12.5px;color:var(--ink2);padding:6px 16px;border-top:1px solid var(--line);background:var(--paper)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.3px;margin:0;line-height:1.15}
h2{font-size:24px}
h2:focus,[tabindex="-1"]:focus{outline:none}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15.5px;cursor:pointer;background:var(--teal);color:#fff;min-height:44px;transition:transform .12s,background .15s}
.btn:hover{background:var(--teal-d)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:#a9bdbb;cursor:not-allowed}
.btn.y{background:var(--yel);color:#2a1e00}
.btn.y:hover{background:#f2b900}
.btn.ghost{background:var(--paper);color:var(--teal-d);border:2px solid var(--teal)}
.btn.ghost:hover{background:var(--teal-l)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--yel-l);border:1px solid #f0d77e;border-radius:12px;padding:10px 12px;font-size:14px;color:#4e3b00}
.note svg{flex:none;width:20px;height:20px;margin-top:1px}

/* HOME */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,#0e7c78,#0a5d63);color:#fff;border-radius:20px;padding:22px 24px;position:relative;overflow:hidden}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.8px}
.hero .sub{margin-top:6px;font-size:16px;color:#d6f3ef}
.hero .lede{margin-top:12px;font-size:15.5px;color:#eefaf8;max-width:52ch}
.hero .stripe{position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,var(--yel) 0 12px,#13302f 12px 24px)}
.hero svg{width:100%;height:auto;max-height:220px}
.kicker{display:inline-block;background:var(--yel);color:#2a1e00;font-weight:800;font-size:12px;letter-spacing:.8px;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin-bottom:10px;font-family:var(--display)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.mode{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px;align-items:start;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--teal-m)}
.mode .ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center}
.mode .ic svg{width:40px;height:40px}
.mode h3{font-size:19px}
.mode .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--teal);margin-bottom:2px}
.mode p{font-size:14.5px;color:var(--ink2);margin-top:4px}
.modes .mode:last-child:nth-child(odd){grid-column:1/-1}
.mode .best{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);font-weight:700}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.homefoot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:16px}

/* CLINIC */
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ghead .meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill.t{background:var(--teal-l);border-color:#b5e0dc;color:var(--teal-d)}
.clinic{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
.pt{padding:16px;display:grid;grid-template-columns:150px 1fr;gap:14px;align-content:start}
.portrait{width:150px;height:165px;border-radius:14px;background:linear-gradient(#cfeae7,#e9f5f3);overflow:hidden;border:1px solid var(--line)}
.portrait svg{width:100%;height:100%;display:block}
.pt .who h3{font-size:19px}
.pt .who .job{font-size:14px;color:var(--ink2)}
.bubble{margin-top:10px;background:#f4f8f8;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px;position:relative}
.bubble::before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.bubble::after{content:"";position:absolute;left:-6px;top:17px;border:7px solid transparent;border-right-color:#f4f8f8;border-left:0}
.bodymap{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#f7fbfa;border:1px dashed var(--line2);border-radius:12px;padding:10px 12px}
.bodymap .figs{display:flex;gap:6px}
.bodymap svg{width:72px;height:156px}
.bodymap .lbl{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.bodymap .area{font-weight:700;font-size:15px;margin-top:2px}
.bm-s{fill:none;stroke:#cadbd9;stroke-linecap:round}
.bm-f{fill:#cadbd9}
.bm-r{fill:transparent}
.bm-r.on{fill:rgba(207,58,48,.55);stroke:#cf3a30;stroke-width:1.5;animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.qa{padding:16px}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.steps span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef3f3;color:var(--ink3)}
.steps span.on{background:var(--teal);color:#fff}
.steps span.done{background:var(--teal-l);color:var(--teal-d)}
.qa h3{margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:15px;font-weight:700;min-height:46px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--teal-m);background:#f5fbfa}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:#eef3f3;display:grid;place-items:center;font-size:13px;color:var(--ink2);font-family:var(--display)}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l)}
.opt[aria-pressed="true"] .k{background:var(--teal);color:#fff}
.opt.ok{border-color:var(--green);background:var(--green-l)}
.opt.ok .k{background:var(--green);color:#fff}
.opt.no{border-color:var(--red);background:var(--red-l)}
.opt.no .k{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.6}
.fb{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--green-l);border:1px solid #a8dcbc}
.fb.no{background:var(--red-l);border:1px solid #f1b7b1}
.fb b{display:block;margin-bottom:2px}
.qa .act{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:13px;color:var(--ink3)}

/* PATROL */
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hud .zone{font-family:var(--display);font-weight:700;font-size:17px}
.lives{display:inline-flex;gap:3px}
.lives svg{width:22px;height:22px}
.tbar{flex:1;min-width:120px;height:12px;border-radius:999px;background:#dbe7e5;overflow:hidden;position:relative}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal),var(--teal-m));border-radius:999px}
.tbar.low i{background:linear-gradient(90deg,var(--red),#ef7a5a)}
.viewport{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff;max-width:820px;margin:0 auto}
.strip{display:flex;transition:transform .7s cubic-bezier(.6,.05,.3,1)}
.zonepane{flex:0 0 100%;min-width:0}
.zonepane svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;outline:none}
.hot .hit{fill:transparent;stroke:transparent;stroke-width:3;rx:10}
.hot:hover .hit{stroke:rgba(14,124,120,.45);stroke-dasharray:8 6}
.hot:focus-visible .hit{stroke:#1a5cff;stroke-width:5;stroke-dasharray:none}
.hot.done{cursor:default}
.hot.miss .hit{stroke:var(--red);stroke-width:4;stroke-dasharray:10 6}
.blink{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.smoke{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-30px);opacity:0}}
.spark{animation:blink .5s steps(2) infinite}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#122a2e;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:700;box-shadow:var(--shadow);max-width:90%;text-align:center;pointer-events:none}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(12,40,42,.55);padding:16px}
.banner .card{padding:18px 20px;max-width:440px;text-align:center}
.banner h3{font-size:22px;margin-bottom:6px}
.banner ul{text-align:left;margin:10px 0 0;padding-left:20px;font-size:14.5px}
.found{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.found span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.found span.ok{background:var(--green-l);border-color:#a8dcbc}
.found span.no{background:var(--red-l);border-color:#f1b7b1}
.modal{position:fixed;inset:0;background:rgba(12,40,42,.6);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:520px;width:100%;padding:18px;max-height:calc(100vh - 32px);overflow:auto}
.cat{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 9px;border-radius:6px;background:var(--yel);color:#2a1e00;margin-bottom:8px}

/* EMERGENCY */
.em{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.em .card{padding:16px}
.scen{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.scen .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--red-l);display:grid;place-items:center}
.scen .ic svg{width:32px;height:32px}
.pool{display:grid;gap:8px}
.ord{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.slot{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px dashed var(--line2);border-radius:12px;min-height:46px;color:var(--ink3);font-size:14.5px}
.slot .n{flex:none;width:26px;height:26px;border-radius:50%;background:#e4eeed;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:13px;color:var(--ink2)}
.slot.filled{border-style:solid;border-color:var(--teal);background:var(--teal-l);color:var(--ink);cursor:pointer;text-align:left;font-weight:700;width:100%}
.slot.filled .n{background:var(--teal);color:#fff}
.slot.ok{border-color:var(--green);background:var(--green-l)}
.slot.ok .n{background:var(--green)}
.slot.no{border-color:var(--red);background:var(--red-l)}
.slot.no .n{background:var(--red)}
.slot .fix{display:block;font-weight:400;font-size:13px;color:var(--ink2);margin-top:2px}
.correct{margin:10px 0 0;padding-left:22px;font-size:14.5px}
.correct li{margin-bottom:6px}

/* TRUE FALSE */
.tf{max-width:720px;margin:0 auto}
.tfcard{padding:22px;text-align:center}
.tfcard .num{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.tfcard .stmt{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.3;margin:12px auto 18px;max-width:30ch;min-height:3.9em;display:flex;align-items:center;justify-content:center}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfb{border:0;border-radius:16px;padding:16px;font-family:var(--display);font-weight:800;font-size:22px;cursor:pointer;min-height:64px;color:#fff;transition:transform .1s,filter .15s}
.tfb:hover:not([disabled]){filter:brightness(1.07)}
.tfb.t{background:var(--green)}
.tfb.f{background:var(--red)}
.tfb small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.85}
.tfb[disabled]{opacity:.45;cursor:default}
.tfb.picked{opacity:1;box-shadow:0 0 0 4px var(--yel)}
.ring{width:56px;height:56px;margin:0 auto}

/* ERGONOMIC OR NOT */
.eg{max-width:640px;margin:0 auto}
.egwrap{display:flex;justify-content:center;overflow:hidden;padding:4px 4px 8px}
.egcard{width:100%;max-width:350px;padding:10px;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .25s ease,opacity .25s ease,border-color .2s;position:relative;border-width:3px}
.egcard.drag{transition:none;cursor:grabbing}
.egcard .tbar{height:8px;margin-bottom:10px}
.egart{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.egart svg{display:block;width:100%;height:auto}
.stamp{position:absolute;top:10px;padding:4px 10px;border-radius:8px;font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.5px;border:3px solid;opacity:0;transition:opacity .12s;background:rgba(255,255,255,.85)}
.stamp.l{right:10px;color:var(--red);transform:rotate(8deg)}
.stamp.r{left:10px;color:var(--green);transform:rotate(-8deg)}
.egcard.lean-l .stamp.l,.egcard.lean-r .stamp.r{opacity:1}
.egcard.okc{border-color:var(--green)}
.egcard.noc{border-color:var(--red)}
.egcap{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25;text-align:center;margin-top:8px;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.egbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px;margin:6px auto 0}
.egb{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;border:0;border-radius:14px;padding:12px;font-family:var(--display);font-weight:800;font-size:17px;color:#fff;cursor:pointer;min-height:60px}
.egb svg{width:20px;height:20px}
.egb small{flex-basis:100%;text-align:center;font-family:var(--body);font-size:12px;font-weight:700;opacity:.85}
.egb.no{background:var(--red)}.egb.yes{background:var(--green)}
.egb:hover:not([disabled]){filter:brightness(1.07)}
.egb[disabled]{opacity:.45;cursor:default}.egb.picked{opacity:1;box-shadow:0 0 0 4px var(--yel)}
.egfb{max-width:560px;margin:10px auto 0}
.egfb .fbrow{display:flex;gap:10px;align-items:center}
.egfb .fbrow .fb{flex:1;margin:0}
@media (max-width:640px){.egfb .fbrow{flex-direction:column;align-items:stretch}.egb{font-size:15px;padding:10px 6px;gap:4px 2px}.egb svg{width:16px;height:16px}}
.streak.hot{background:#fff1e0;border-color:#f6c38a;color:#8a4500}
/* RESULTS */
.res{max-width:820px;margin:0 auto}
.reshead{padding:22px;text-align:center}
.bigstars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.bigstars svg{width:52px;height:52px}
.bigstars svg.pop{transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.score{font-family:var(--display);font-size:40px;font-weight:800;color:var(--teal-d)}
.learn{padding:18px;margin-top:14px}
.learn ul{margin:8px 0 0;padding-left:20px}
.learn li{margin-bottom:6px}
.learn li.miss{color:#8a2a22}
.tally{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.tally .card{padding:12px;text-align:center}
.tally .v{font-family:var(--display);font-weight:800;font-size:24px;color:var(--teal-d)}
.tally .l{font-size:13px;color:var(--ink2);font-weight:700}
.center{text-align:center}

@media (max-width:860px){
  .clinic,.em{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero svg{max-height:170px}
}
@media (max-width:640px){
  .modes{grid-template-columns:1fr}
  .hero{padding:18px 16px 22px}
  .hero h1{font-size:27px}
  .brand{font-size:15px}
  .brand .long{display:none}
  .chip .lbl{display:none}
  .ibtn .lbl{display:none}
  .pt{grid-template-columns:100px 1fr;padding:14px}
  .portrait{width:100px;height:112px}
  .bubble::before,.bubble::after{display:none}
  .bubble{grid-column:1/-1}
  .tfcard .stmt{font-size:20px}
  .zonepane{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .zonepane svg{width:175%;max-width:none}
  .bodymap{grid-template-columns:1fr;justify-items:start}
  .bodymap svg{width:60px;height:130px}
  .panhint{display:block!important}
  .tally{grid-template-columns:repeat(2,1fr)}
  .mode{grid-template-columns:52px 1fr;padding:14px}
  .mode .ic{width:52px;height:52px}
  .mode .ic svg{width:32px;height:32px}
  h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
<!-- gamesave:start --><script id="gamesave-kit">

     GameSave.reset({reload})         clear without asking

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';

  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

/* ---------- CLINIC ---------- */
function clinicStart(){G={mode:'clinic',q:shuffle(CONDS).slice(0,6),i:0,score:0,max:6*25,log:[]};clinicPatient();}
function clinicPatient(){
  const c=G.q[G.i];G.step=0;G.c=c;
  const others=CONDS.filter(x=>x.id!==c.id);
  G.diag=shuffle([c,...shuffle(others).slice(0,3)]);
  G.cause=shuffle([c,...shuffle(others.filter(x=>x.id!==AVOID[c.id])).slice(0,2)]);
  G.prev=shuffle([...c.good.map(t=>({t,ok:true})),...c.bad.map(t=>({t,ok:false}))]);
  G.pick=[];G.pts=0;
  show(`<div class="ghead"><h2>Office Clinic</h2><div class="meta"><span class="pill t">Patient ${G.i+1} of ${G.q.length}</span><span class="pill">Score <b id="sc">${G.score}</b></span></div></div>
   <div class="clinic">
    <section class="card pt" aria-label="Patient notes">
      <div class="portrait">${person(c.p,c.p.n+', '+c.p.job)}</div>
      <div class="who"><h3>${c.p.n}</h3><div class="job">${c.p.job}, Harbourview Trading Ltd</div>
        <div class="bubble"><span class="sr">Patient says: </span>“${c.sym}”</div></div>
      <div class="bodymap">${bodyMap(c.area)}<div><div class="lbl">Where it hurts</div><div class="area">${c.areaText}</div><p class="small" style="margin-top:8px">Nurse Imani Hughes’ notes. Real symptoms should always be checked by a doctor or nurse.</p></div></div>
    </section>
    <section class="card qa" id="qa" aria-live="polite"></section>
   </div>`);
  clinicStep();
}
function clinicStep(){
  const c=G.c,qa=$('#qa');const st=['Diagnose','Cause','Prevent'];
  let h=`<div class="steps">${st.map((s,i)=>`<span class="${i===G.step?'on':i<G.step?'done':''}">${i+1}. ${s}</span>`).join('')}</div>`;
  if(G.step===0){h+=`<h3 id="qh">What is the most likely computer-related condition?</h3><div class="opts" role="group" aria-labelledby="qh">${G.diag.map((d,i)=>`<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${d.name}</span></button>`).join('')}</div>`;}
  else if(G.step===1){h+=`<h3 id="qh">What is the most likely cause?</h3><div class="opts" role="group" aria-labelledby="qh">${G.cause.map((d,i)=>`<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${d.cause}</span></button>`).join('')}</div>`;}
  else{h+=`<h3 id="qh">Prescribe TWO prevention steps for ${c.p.n.split(' ')[0]}</h3><p class="small" style="margin:-4px 0 10px">Select two, then press Prescribe.</p><div class="opts" role="group" aria-labelledby="qh">${G.prev.map((d,i)=>`<button class="opt" aria-pressed="false" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${d.t}</span></button>`).join('')}</div><div class="act"><button class="btn" id="rx" disabled>Prescribe these 2</button><span class="small" id="cnt">0 of 2 selected</span></div>`;}
  h+=`<div id="fbx"></div>`;
  qa.innerHTML=h;
  const opts=$$('.opt',qa);
  if(G.step<2){opts.forEach(b=>b.addEventListener('click',()=>clinicAnswer(+b.dataset.i)));}
  else{opts.forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;const k=G.pick.indexOf(i);if(k>=0)G.pick.splice(k,1);else{if(G.pick.length>=2)G.pick.shift();G.pick.push(i);}sfx.click();opts.forEach(o=>o.setAttribute('aria-pressed',G.pick.includes(+o.dataset.i)?'true':'false'));$('#rx').disabled=G.pick.length!==2;$('#cnt').textContent=G.pick.length+' of 2 selected';}));
    $('#rx').addEventListener('click',clinicPrescribe);}
  if(opts[0])opts[0].focus(G.step?{}:{preventScroll:true});
}
function clinicAnswer(i){
  const c=G.c,qa=$('#qa'),opts=$$('.opt',qa),list=G.step===0?G.diag:G.cause;const ok=list[i].id===c.id;
  opts.forEach((b,j)=>{b.disabled=true;if(list[j].id===c.id)b.classList.add('ok');else if(j===i)b.classList.add('no');else b.classList.add('dim');});
  const pts=G.step===0?10:5;if(ok){G.score+=pts;G.pts+=pts;sfx.ok();}else sfx.no();ck();
  $('#sc').textContent=G.score;
  const msg=G.step===0?(ok?`Correct! The diagnosis is ${c.name}.`:`Not quite. The symptoms point to ${c.name}.`):(ok?'Correct cause!':'Not quite. The most likely cause is:');
  const extra=G.step===0?c.fact:c.cause+'.';
  $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><b>${msg} ${ok?'+'+pts:''}</b>${extra}</div><div class="act"><button class="btn" id="nx">${G.step===0?'Next: find the cause':'Next: prevention'}</button></div>`;
  $('#nx').addEventListener('click',()=>{sfx.click();G.step++;clinicStep();});$('#nx').focus();
}
function clinicPrescribe(){
  const c=G.c,qa=$('#qa'),opts=$$('.opt',qa);let good=0;
  opts.forEach(b=>{const i=+b.dataset.i,d=G.prev[i];b.disabled=true;if(d.ok)b.classList.add('ok');else if(G.pick.includes(i))b.classList.add('no');else b.classList.add('dim');if(G.pick.includes(i)&&d.ok)good++;});
  $('#rx').disabled=true;const pts=good*5;G.score+=pts;G.pts+=pts;$('#sc').textContent=G.score;
  good===2?sfx.ok():sfx.no();
  G.log.push({c,pts:G.pts});ck();
  const lastP=G.i>=G.q.length-1;
  $('#fbx').innerHTML=`<div class="fb ${good===2?'ok':'no'}" role="status"><b>${good===2?'Great prescription! +10':good===1?'One of two correct. +5':'Not this time.'}</b>The best prevention steps: ${c.good.map(t=>t.charAt(0).toLowerCase()+t.slice(1)).join('; and ')}.</div><div class="act"><button class="btn" id="nx">${lastP?'See results':'Next patient'}</button><span class="small">This patient: ${G.pts} / 25</span></div>`;
  $('#nx').addEventListener('click',()=>{sfx.click();if(lastP)finish();else{G.i++;clinicPatient();}});$('#nx').focus();
}

  });
  show(`<div class="ghead"><h2>Safety Patrol</h2><div class="meta"><span class="pill">Score <b id="sc">0</b></span><span class="pill t" id="fcount"></span></div></div>
   <div class="hud"><span class="zone" id="zname"></span><span class="lives" id="lives" role="img"></span><div class="tbar" id="tbar" role="progressbar" aria-label="Time left" aria-valuemin="0" aria-valuemax="100"><i id="tfill"></i></div><span class="pill" id="tsec" aria-hidden="true"></span></div>
   <div class="viewport" id="vp"><div class="strip" id="strip">${panes}</div><div id="ov"></div></div>
   <p class="small center panhint" style="display:none;margin-top:8px"><b>Swipe the office left and right to look around.</b></p><p class="small center" style="margin-top:8px">Tap or press Enter on anything that looks unsafe. Checking a safe object costs 3 seconds.</p>`);
  $$('.hot',main).forEach(g=>{g.addEventListener('click',()=>hotHit(g));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hotHit(g);}});});
  patrolHud();zoneIntro();
}
function zoneHaz(){return HAZ.filter(h=>h.z===G.z);}
function patrolHud(){
  $('#lives').innerHTML=[0,1,2].map(i=>heart(i<G.lives)).join('');$('#lives').setAttribute('aria-label',G.lives+' lives left');
  $('#zname').textContent=`Zone ${G.z+1}/5 · ${ZONES[G.z].name}`;
  const zh=zoneHaz();$('#fcount').textContent=`Hazards found ${zh.filter(h=>G.found[h.id]&&!G.missed.includes(h)).length}/${zh.length}`;$('#sc').textContent=G.score;
}
function setTime(){const p=Math.max(0,G.t/G.tmax*100);$('#tfill').style.width=p+'%';$('#tbar').setAttribute('aria-valuenow',Math.round(p));$('#tbar').classList.toggle('low',G.t<8);$('#tsec').textContent=Math.ceil(G.t)+'s';}
function zoneIntro(){
  const zh=zoneHaz();G.tmax=14+zh.length*9;G.t=G.tmax;setTime();patrolHud();G.paused=true;
  $('#ov').innerHTML=`<div class="banner"><div class="card"><span class="cat">Zone ${G.z+1} of 5</span><h3>${ZONES[G.z].name}</h3><p>Find <b>${zh.length} hazards</b> in ${G.tmax} seconds.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn y" id="go">Start patrol</button></div></div></div>`;
  $('#go').addEventListener('click',()=>{sfx.click();$('#ov').innerHTML='';G.paused=false;const p=$(`.zonepane[data-z="${G.z}"] .hot`,main);if(p)p.focus({preventScroll:true});say(`Zone ${G.z+1}, ${ZONES[G.z].name}. Timer started.`);});
  $('#go').focus({preventScroll:true});
  clearTimers();let lastT=performance.now(),lastTick=0;
  timers.push(setInterval(()=>{const now=performance.now(),dt=(now-lastT)/1000;lastT=now;if(G.paused||$('.modal'))return;G.t-=dt;setTime();if(G.t<5&&Math.ceil(G.t)!==lastTick){lastTick=Math.ceil(G.t);sfx.tick();}if(G.t<=0){zoneTimeout();}},100));
}
function toast(t){const ov=$('#vp');const old=$('.toast',ov);if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;ov.appendChild(d);say(t);setTimeout(()=>d.remove(),1800);}
function hotHit(g){
  if(G.paused||g.classList.contains('done'))return;
  if(g.dataset.d){const [z,i]=g.dataset.d.split('-').map(Number);const d=DECOY.filter(x=>x.z===z)[i];G.t=Math.max(0.1,G.t-3);setTime();sfx.click();toast(d.msg+' (−3 s)');return;}
  const h=HAZ.find(x=>x.id===g.dataset.h);sfx.found();G.paused=true;
  const opts=shuffle(h.opts.map((t,i)=>({t,ok:i===0})));
  openModal(`<span class="cat">${h.cat}</span><h3 id="mh">Hazard spotted: ${h.name}</h3><p class="muted" style="margin:6px 0 12px">What should you do?</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${o.t}</span></button>`).join('')}</div><div id="mfb"></div>`,g);
  $$('.modal .opt').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i,ok=opts[i].ok;$$('.modal .opt').forEach((x,j)=>{x.disabled=true;x.classList.add(opts[j].ok?'ok':j===i?'no':'dim');});
    G.found[h.id]=true;g.classList.add('done');g.setAttribute('aria-label',h.name+(ok?', fixed':', handled incorrectly'));
    if(ok){G.score+=10;G.fixed++;sfx.ok();}else{G.lives--;G.wrong.push(h);sfx.no();}
    const bg=$(`.zonepane[data-z="${h.z}"] .badges`,main);bg.insertAdjacentHTML('beforeend',`<g transform="translate(${h.b[0]},${h.b[1]})"><circle r="15" fill="${ok?'#1d8048':'#cf3a30'}" stroke="#fff" stroke-width="3"/>${ok?'<path d="M-6 0l4 4 8-9" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':'<path d="M-5-5l10 10M5-5l-10 10" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>'}</g>`);
    patrolHud();
    $('#mfb').innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><b>${ok?'Correct action! +10':'Wrong action: you lose a life.'}</b>${h.why}</div><div class="act"><button class="btn" id="mok">${G.lives<=0?'See results':'Continue patrol'}</button></div>`;
    $('#mok').addEventListener('click',()=>{sfx.click();closeModal();afterHazard();});$('#mok').focus();
  }));
}
function afterHazard(){
  if(G.lives<=0){G.paused=true;sfx.lose();patrolEnd('Out of lives!');return;}
  const zh=zoneHaz();
  if(zh.every(h=>G.found[h.id])){G.paused=true;const add=Math.min(10,Math.ceil(G.t/3));G.score+=add;patrolHud();sfx.win();
    zoneDone(`Zone clear!`,`Time bonus: +${add}`,[]);}
  else{G.paused=false;}
}
function zoneTimeout(){
  G.paused=true;sfx.lose();G.lives--;
  const miss=zoneHaz().filter(h=>!G.found[h.id]);miss.forEach(h=>{G.missed.push(h);G.found[h.id]=true;const g=$(`.hot[data-h="${h.id}"]`,main);g.classList.add('miss','done');});
  patrolHud();
  if(G.lives<=0){zoneDone('Time’s up and out of lives!','You missed:',miss,true);}

}
function zoneDone(title,sub,miss,end){
  const zh=zoneHaz();const lastZ=G.z>=ZONES.length-1;
  $('#ov').innerHTML=`<div class="banner"><div class="card" role="alertdialog" aria-labelledby="bt"><h3 id="bt">${title}</h3><p class="muted">${sub}</p>${miss.length?`<ul>${miss.map(h=>`<li><b>${h.name}</b>: ${h.opts[0]}.</li>`).join('')}</ul>`:''}<div class="found">${zh.map(h=>`<span class="${G.wrong.includes(h)||G.missed.includes(h)?'no':'ok'}">${h.name}</span>`).join('')}</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn y" id="nz">${end||lastZ?'See results':'Next zone'}</button></div></div></div>`;
  shout(title);
  $('#nz').addEventListener('click',()=>{sfx.click();if(end||lastZ){patrolEnd(end?'Out of lives!':'Patrol complete!');return;}
    $(`.zonepane[data-z="${G.z}"]`,main).setAttribute('inert','');G.z++;const p=$(`.zonepane[data-z="${G.z}"]`,main);p.removeAttribute('inert');$('#strip').style.transform=`translateX(-${G.z*100}%)`;$('#ov').innerHTML='';
    setTimeout(zoneIntro,RM?0:700);});
  $('#nz').focus({preventScroll:true});
}
function patrolEnd(){clearTimers();HAZ.forEach(h=>{if(!G.found[h.id])G.missed.push(h);});finish();}

/* modal */
let modalReturn=null;
function openModal(inner,ret){closeModal();modalReturn=ret;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="mh">${inner}</div>`;document.body.appendChild(m);
  m.addEventListener('keydown',e=>{if(e.key==='Tab'){const f=$$('button:not([disabled])',m);if(!f.length){e.preventDefault();return;}const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});

/* ---------- EMERGENCY ---------- */
function emergStart(){G={mode:'emerg',q:EMERG.slice(),i:0,score:0,max:EMERG.length*10,log:[]};sfx.alarm();emergScen();}
function emergScen(){
  const s=G.q[G.i];G.s=s;G.placed=[];
  let order=shuffle(s.steps.map((t,i)=>i));let guard=0;while(order.every((v,i)=>v===i)&&guard++<5)order=shuffle(order);G.pool=order;
  show(`<div class="ghead"><h2>Emergency!</h2><div class="meta"><span class="pill t">Scenario ${G.i+1} of ${G.q.length}</span><span class="pill">Score <b id="sc">${G.score}</b></span></div></div>
   <div class="em"><section class="card"><div class="scen"><span class="ic">${EICON[s.ic]}</span><div><h3>${s.title}</h3><p class="muted" style="margin-top:4px">${s.desc}</p></div></div><h3 style="font-size:16px;margin-bottom:8px" id="ph">Steps: tap them in the order you would do them</h3><div class="pool" id="pool" role="group" aria-labelledby="ph"></div></section>
   <section class="card"><h3 style="font-size:16px;margin-bottom:8px" id="oh">Your order</h3><ol class="ord" id="ord" aria-labelledby="oh"></ol><div class="act" style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="chk" disabled>Check order</button><button class="btn ghost" id="clr">Clear</button></div><div id="efb"></div></section></div>`);
  emergDraw();
  $('#chk').addEventListener('click',emergCheck);
  $('#clr').addEventListener('click',()=>{sfx.click();G.placed=[];emergDraw();});
}
function emergDraw(focusPool){
  const s=G.s,pool=$('#pool'),ord=$('#ord');
  const left=G.pool.filter(i=>!G.placed.includes(i));
  pool.innerHTML=left.length?left.map(i=>`<button class="opt" data-i="${i}"><span class="k">+</span><span>${s.steps[i]}</span></button>`).join(''):`<p class="small">All steps placed. Check your order, or tap a step on the right to take it back.</p>`;
  ord.innerHTML=s.steps.map((_,k)=>{const i=G.placed[k];return i===undefined?`<li><div class="slot"><span class="n">${k+1}</span><span>Step ${k+1}</span></div></li>`:`<li><button class="slot filled" data-k="${k}" aria-label="Step ${k+1}: ${esc(s.steps[i])}. Press to remove"><span class="n">${k+1}</span><span>${s.steps[i]}</span></button></li>`;}).join('');
  $$('.opt',pool).forEach(b=>b.addEventListener('click',()=>{sfx.click();G.placed.push(+b.dataset.i);emergDraw(true);}));
  $$('.slot.filled',ord).forEach(b=>b.addEventListener('click',()=>{sfx.click();G.placed.splice(+b.dataset.k,1);emergDraw(true);}));
  $('#chk').disabled=G.placed.length!==s.steps.length;ck();
  if(focusPool){const f=$('.opt',pool)||$('#chk');f.focus({preventScroll:true});}
}
function emergCheck(){
  const s=G.s;let right=0;G.placed.forEach((v,k)=>{if(v===k)right++;});
  const pts=Math.round(10*right/s.steps.length);G.score+=pts;G.log.push({s,pts});ck();$('#sc').textContent=G.score;
  right===s.steps.length?sfx.win():right>=s.steps.length/2?sfx.ok():sfx.no();
  $('#ord').innerHTML=G.placed.map((i,k)=>`<li><div class="slot filled ${i===k?'ok':'no'}"><span class="n">${k+1}</span><span>${s.steps[i]}${i===k?'':`<span class="fix">This should be step ${i+1}.</span>`}</span></div></li>`).join('');
  $('#pool').innerHTML=`<p class="small">Checked. See your results under “Your order”.</p>`;$('#chk').hidden=true;$('#clr').hidden=true;
  const lastS=G.i>=G.q.length-1;
  $('#efb').innerHTML=`<div class="fb ${right===s.steps.length?'ok':'no'}" role="status"><b>${right} of ${s.steps.length} in the right place. +${pts}</b>${s.dont}</div>${right<s.steps.length?`<h3 style="font-size:15px;margin-top:12px">Correct order</h3><ol class="correct">${s.steps.map(t=>`<li>${t}</li>`).join('')}</ol>`:''}<div class="act"><button class="btn" id="nx">${lastS?'See results':'Next emergency'}</button></div>`;
  $('#nx').addEventListener('click',()=>{sfx.click();if(lastS)finish();else{G.i++;emergScen();}});$('#nx').focus();
}

/* ---------- TRUE / FALSE ---------- */
const TF_TIME=10;
function tfStart(){G={mode:'tf',q:shuffle(TF),i:0,score:0,max:TF.length*10,wrongs:[]};tfQ();}
function tfQ(){
  const q=G.q[G.i];G.t=TF_TIME;G.lock=false;
  show(`<div class="tf"><div class="ghead"><h2>True or False</h2><div class="meta"><span class="pill t">${G.i+1} / ${G.q.length}</span><span class="pill">Score <b id="sc">${G.score}</b></span></div></div>
   <section class="card tfcard"><svg class="ring" viewBox="0 0 56 56" role="img" aria-label="Timer"><circle cx="28" cy="28" r="24" fill="none" stroke="#dbe7e5" stroke-width="6"/><circle id="rg" cx="28" cy="28" r="24" fill="none" stroke="#0e7c78" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0" transform="rotate(-90 28 28)"/><text id="rt" x="28" y="33" text-anchor="middle" font-size="16" font-weight="700" font-family="Lexend,sans-serif" fill="#122a2e">${TF_TIME}</text></svg>
   <div class="num">Statement ${G.i+1}</div><p class="stmt" id="stmt">${q[0]}</p>
   <div class="tfbtns"><button class="tfb t" id="bt" aria-describedby="stmt">TRUE<small>Press T</small></button><button class="tfb f" id="bf" aria-describedby="stmt">FALSE<small>Press F</small></button></div><div id="tfb"></div></section></div>`,'#stmt');
  $('#bt').addEventListener('click',()=>tfAns(true));$('#bf').addEventListener('click',()=>tfAns(false));
  let lastT=performance.now(),lastTick=0;
  timers.push(setInterval(()=>{if(G.lock)return;const now=performance.now();G.t-=(now-lastT)/1000;lastT=now;const p=Math.max(0,G.t/TF_TIME);const rg=$('#rg');if(!rg)return;rg.setAttribute('stroke-dashoffset',(150.8*(1-p)).toFixed(1));rg.setAttribute('stroke',G.t<3?'#cf3a30':'#0e7c78');$('#rt').textContent=Math.max(0,Math.ceil(G.t));if(G.t<3.5&&Math.ceil(G.t)!==lastTick){lastTick=Math.ceil(G.t);sfx.tick();}if(G.t<=0)tfAns(null);},100));
}
function tfAns(v){
  if(G.lock)return;G.lock=true;const q=G.q[G.i];const ok=v===q[1];
  $('#bt').disabled=$('#bf').disabled=true;if(v!==null)(v?$('#bt'):$('#bf')).classList.add('picked');

  $('#nx').addEventListener('click',()=>{sfx.click();if(lastQ)finish();else{G.i++;tfQ();}});$('#nx').focus();
}

/* ---------- ERGONOMIC OR NOT ---------- */
const ERGO_TIME=7;
function ergoStart(){G={mode:'ergo',q:shuffle(ERGO),i:0,score:0,right:0,streak:0,bestStreak:0,max:ERGO.length*10+(ERGO.length-2)*2,wrongs:[]};ergoCard();}
function ergoCard(){
  const c=G.q[G.i];G.t=ERGO_TIME;G.lock=false;
  show(`<div class="eg"><div class="ghead"><h2>Ergonomic or Not?</h2><div class="meta"><span class="pill t">Card ${G.i+1} / ${G.q.length}</span><span class="pill streak${G.streak>=3?' hot':''}" id="stk" aria-label="Streak ${G.streak}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-4 0-6 1-8z" fill="#f08a1c"/></svg>Streak <b>${G.streak}</b></span><span class="pill">Score <b id="sc">${G.score}</b></span></div></div>
   <div class="egwrap"><div class="egcard card" id="egc" tabindex="-1" aria-labelledby="egcap"><div class="tbar" id="etbar" role="progressbar" aria-label="Time left" aria-valuemin="0" aria-valuemax="7"><i id="efill" style="width:100%"></i></div>
    <div class="egart"><svg viewBox="0 0 240 160" role="img" aria-label="${esc(c.cap)}">${c.art()}</svg><span class="stamp l" aria-hidden="true">NOT ergonomic</span><span class="stamp r" aria-hidden="true">Ergonomic</span></div>
    <p class="egcap" id="egcap">${c.cap}</p></div></div>
   <div class="egbtns"><button class="egb no" id="bno"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Not ergonomic<small>Left arrow · swipe left</small></button><button class="egb yes" id="byes">Ergonomic<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><small>Right arrow · swipe right</small></button></div>
   <div id="egfb" class="egfb" aria-live="polite"></div></div>`,'#egcap');
  $('#bno').addEventListener('click',()=>ergoAns(false));$('#byes').addEventListener('click',()=>ergoAns(true));
  // swipe
  const card=$('#egc');let sx=null,dx=0,pid=null;
  card.addEventListener('pointerdown',e=>{if(G.lock)return;sx=e.clientX;dx=0;pid=e.pointerId;try{card.setPointerCapture(pid);}catch(_){}card.classList.add('drag');});
  card.addEventListener('pointermove',e=>{if(sx===null||G.lock)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;card.classList.toggle('lean-r',dx>30);card.classList.toggle('lean-l',dx<-30);});
  const end=()=>{if(sx===null)return;card.classList.remove('drag');sx=null;if(Math.abs(dx)>80&&!G.lock){ergoAns(dx>0);}else{card.style.transform='';card.classList.remove('lean-r','lean-l');}};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  let lastT=performance.now(),lastTick=0;
  timers.push(setInterval(()=>{if(G.lock)return;const now=performance.now();G.t-=(now-lastT)/1000;lastT=now;const f=$('#efill');if(!f)return;f.style.width=Math.max(0,G.t/ERGO_TIME*100)+'%';$('#etbar').setAttribute('aria-valuenow',Math.max(0,Math.ceil(G.t)));$('#etbar').classList.toggle('low',G.t<2.5);if(G.t<3&&Math.ceil(G.t)!==lastTick){lastTick=Math.ceil(G.t);sfx.tick();}if(G.t<=0)ergoAns(null);},100));
}
function ergoAns(v){
  if(G.lock)return;G.lock=true;G.ansAt=performance.now();const c=G.q[G.i];const ok=v===c.ok;
  const card=$('#egc');card.classList.remove('drag','lean-l','lean-r');
  if(!RM&&v!==null){card.style.transform=`translateX(${v?140:-140}px) rotate(${v?10:-10}deg)`;card.style.opacity='.0';setTimeout(()=>{card.style.transition='none';card.style.transform='';card.style.opacity='';card.classList.add(ok?'okc':'noc');},260);}else card.classList.add(ok?'okc':'noc');
  $('#bno').disabled=$('#byes').disabled=true;if(v!==null)(v?$('#byes'):$('#bno')).classList.add('picked');
  let pts=0;if(ok){G.right++;G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);pts=10+(G.streak>=3?2:0);G.score+=pts;G.streak>=3&&G.streak%5===0?sfx.win():sfx.ok();}else{G.streak=0;G.wrongs.push(c);sfx.no();}ck();
  $('#sc').textContent=G.score;const st=$('#stk');st.querySelector('b').textContent=G.streak;st.classList.toggle('hot',G.streak>=3);st.setAttribute('aria-label','Streak '+G.streak);
  const lastQ=G.i>=G.q.length-1;
  $('#egfb').innerHTML=`<div class="fbrow"><div class="fb ${ok?'ok':'no'}" role="status"><b>${v===null?'Time’s up! ':''}${ok?`Correct! +${pts}${G.streak>=3?' (streak bonus)':''}`:'Not quite.'} This is ${c.ok?'ERGONOMIC':'NOT ergonomic'}.</b>${c.why}</div><button class="btn" id="nx">${lastQ?'See results':'Next card'}</button></div>`;
  $('#nx').addEventListener('click',()=>{sfx.click();if(lastQ)finish();else{G.i++;ergoCard();}});$('#nx').focus();
}

/* ---------- RESULTS ---------- */
function finish(){
  G.fin=1;clearTimers();closeModal();
  const m=G.mode,M=MODES[m];
  const stars=m==='patrol'?starsFor(m,0,0,G.fixed/HAZ.length):m==='ergo'?starsFor(m,0,0,G.right/ERGO.length):starsFor(m,G.score,G.max);
  const prev=best[m];let isBest=false;
  if(!prev||G.score>prev.score||(G.score===prev.score&&stars>prev.stars)){best[m]={score:G.score,stars:Math.max(stars,prev?prev.stars:0)};isBest=true;}else if(stars>prev.stars){best[m].stars=stars;}
  saveBest();updateTotal();last[m]={score:G.score,stars};
  stars>=2?sfx.win():sfx.lose();
  let bullets=LEARN[m].map(t=>`<li>${t}</li>`).join('');let extra='';
  if(m==='clinic')extra=`<h3 style="margin-top:14px;font-size:16px">Your patients</h3><ul>${G.log.map(l=>`<li class="${l.pts<25?'miss':''}"><b>${l.c.p.n}: ${l.c.name}</b> (${l.pts}/25). ${l.c.fact}</li>`).join('')}</ul>`;

function snapRound(){
  const m=G.mode;if(!m||G.fin)return null;
  const done=m==='clinic'||m==='emerg'?(G.log||[]).length>G.i:!!G.lock;
  if(m==='clinic')return{mode:m,q:G.q.map(c=>c.id),i:G.i,score:G.score-(done?0:(G.pts||0)),log:G.log.map(l=>({id:l.c.id,pts:l.pts})),done};

  if(m==='tf')return{mode:m,q:G.q.map(x=>TF.indexOf(x)),i:G.i,score:G.score,wrongs:G.wrongs.map(x=>TF.indexOf(x)),done};
  if(m==='ergo')return{mode:m,q:G.q.map(x=>ERGO.indexOf(x)),i:G.i,score:G.score,right:G.right,streak:G.streak,bestStreak:G.bestStreak,wrongs:G.wrongs.map(x=>ERGO.indexOf(x)),done};
  return null;
}
function resumeRound(d){
  if(!d||typeof d!=='object')return false;
  const num=x=>typeof x==='number'&&isFinite(x)&&x>=0;
  const idx=(a,n)=>Array.isArray(a)&&a.every(x=>Number.isInteger(x)&&x>=0&&x<n);
  const perm=(a,n)=>idx(a,n)&&a.length===n&&new Set(a).size===n;
  const m=d.mode;
  if(!Number.isInteger(d.i)||d.i<0||!num(d.score))return false;
  const next=f=>{if(d.done){if(G.i>=G.q.length-1){finish();return true;}G.i++;}f();return true;};
  if(m==='clinic'){
    const q=Array.isArray(d.q)?d.q.map(id=>CONDS.find(c=>c.id===id)):[];
    if(q.length!==6||q.some(c=>!c)||d.i>=q.length||!Array.isArray(d.log))return false;
    const log=d.log.map(l=>l&&typeof l==='object'?{c:CONDS.find(c=>c.id===l.id),pts:num(l.pts)?l.pts:0}:null);
    if(log.some(l=>!l||!l.c)||log.length!==d.i+(d.done?1:0))return false;
    G={mode:m,q,i:d.i,score:d.score,max:6*25,log};return next(clinicPatient);
  }
  if(m==='emerg'){
    if(d.i>=EMERG.length||!Array.isArray(d.log))return false;
    const log=d.log.map(l=>l&&Number.isInteger(l.k)&&EMERG[l.k]?{s:EMERG[l.k],pts:num(l.pts)?l.pts:0}:null);
    if(log.some(l=>!l)||log.length!==d.i+(d.done?1:0))return false;
    G={mode:m,q:EMERG.slice(),i:d.i,score:d.score,max:EMERG.length*10,log};
    if(d.done)return next(emergScen);
    emergScen();
    const n=G.s.steps.length;
    if(perm(d.pool,n)&&idx(d.placed,n)&&new Set(d.placed).size===d.placed.length&&d.placed.length<=n){G.pool=d.pool.slice();G.placed=d.placed.slice();emergDraw();}
    return true;
  }
  if(m==='tf'){
    if(!perm(d.q,TF.length)||d.i>=TF.length||!idx(d.wrongs,TF.length))return false;
    G={mode:m,q:d.q.map(k=>TF[k]),i:d.i,score:d.score,max:TF.length*10,wrongs:d.wrongs.map(k=>TF[k])};return next(tfQ);
  }
  if(m==='ergo'){
    if(!perm(d.q,ERGO.length)||d.i>=ERGO.length||!idx(d.wrongs,ERGO.length)||![d.right,d.streak,d.bestStreak].every(num))return false;
    G={mode:m,q:d.q.map(k=>ERGO[k]),i:d.i,score:d.score,right:d.right,streak:d.streak,bestStreak:d.bestStreak,max:ERGO.length*10+(ERGO.length-2)*2,wrongs:d.wrongs.map(k=>ERGO[k])};return next(ergoCard);
  }
  return false;
}
let resumed=false;

}
if(!resumed)home();

</script>

    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
