<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Blueprint drafting table lit by late-afternoon Caribbean sun. One deliberate dark theme. */
:root{
  --bp-deep:#0a2a4d; --bp:#0f3963; --bp-2:#164a7d; --bp-3:#1e5c96;
  --line:rgba(170,212,255,.16); --line-2:rgba(170,212,255,.32);
  --ink:#eef6ff; --muted:#a9c6e6; --dim:#7ea3c9;
  --sun:#f7b548; --sun-2:#ffd58a; --coral:#f2805f; --sea:#46cfc6; --leaf:#62c483;
  --good:#5fd39a; --part:#f7c64f; --bad:#ff7a66;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background-color:var(--bp-deep);
  background-image:
    radial-gradient(1200px 520px at 92% -8%,rgba(247,181,72,.20),transparent 60%),
    radial-gradient(900px 600px at 0% 110%,rgba(70,207,198,.10),transparent 60%),
    linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),
    linear-gradient(rgba(170,212,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(170,212,255,.06) 1px,transparent 1px);
  background-size:auto,auto,100px 100px,100px 100px,20px 20px,20px 20px;
  overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border-bottom:1px solid var(--line-2);padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,2.4vw,1.6rem);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--sun)}
.subt{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
nav.levels{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nbtn{background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:6px;padding:6px 9px;font-size:.88rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.nbtn:hover{background:rgba(255,255,255,.1)}
.nbtn[aria-current="page"]{background:var(--sun);color:#2a1900;border-color:var(--sun)}
.nbtn .k{font-family:var(--mono);font-size:.72rem;opacity:.8}
.mute{width:36px;height:34px;justify-content:center;padding:0}

/* Generic panels */
.panel{background:linear-gradient(180deg,rgba(30,92,150,.38),rgba(15,57,99,.55));border:1px solid var(--line-2);border-radius:10px;padding:14px;position:relative}
.panel.tight{padding:10px 12px}
.tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sea)}
h2{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;line-height:1.05;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0;line-height:1.1}
p{margin:.4em 0}
.muted{color:var(--muted)}
.btn{background:var(--sun);color:#2a1900;border:0;border-radius:7px;padding:9px 16px;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--sun-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
main{flex:1}
main:focus{outline:none}

/* Home */
.home{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end;overflow:hidden}
.hero .fig{width:112px}
.hero h2{font-size:2rem}
.levelcards{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:rgba(10,42,77,.55);border:1px solid var(--line-2);border-radius:10px;padding:12px;width:100%}
.lcard:hover{border-color:var(--sun);background:rgba(30,92,150,.5)}
.lnum{font-family:var(--display);font-weight:700;font-size:2.2rem;color:var(--sun);text-align:center;border:1px dashed var(--line-2);border-radius:8px;line-height:48px}
.lcard b{font-family:var(--display);font-size:1.25rem;font-weight:600;display:block}
.lcard small{color:var(--muted);display:block;font-size:.85rem}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.howto{margin:0;padding-left:1.1em}
.howto li{margin:.25em 0}

/* Client brief */
.brief{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}
.brief .fig{width:92px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:.88rem}
.facts dt{font-family:var(--mono);font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.facts dd{margin:0}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.meter i{width:12px;height:6px;border-radius:2px;background:rgba(255,255,255,.15)}
.meter i.on{background:var(--sun)}
.quote{font-style:italic;color:var(--sun-2);border-left:2px solid var(--sun);padding-left:8px;margin-top:8px;font-size:.9rem}

/* Level 1 */
.l1{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.layouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
.lay{text-align:left;background:rgba(10,42,77,.55);border:1px solid var(--line-2);border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:5px}
.lay:hover{border-color:var(--sea)}
.lay[aria-pressed="true"]{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun) inset;background:rgba(247,181,72,.10)}
.lay.best{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset}
.lay.okay{border-color:var(--part)}
.lay.wrong{border-color:var(--bad)}
.lay b{font-family:var(--display);font-size:1.12rem;font-weight:600}
.lay ul{margin:0;padding:0;list-style:none;font-size:.8rem;line-height:1.3}
.lay li{padding-left:14px;position:relative;margin:2px 0}
.lay li::before{position:absolute;left:0;font-family:var(--mono);font-weight:600}
.lay li.p::before{content:"+";color:var(--good)}
.lay li.m::before{content:"\2212";color:var(--bad)}
.lay svg{width:100%;height:auto;max-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:.86rem;text-align:left}
.chip:hover{background:rgba(255,255,255,.1)}
.chip[aria-pressed="true"]{background:rgba(70,207,198,.2);border-color:var(--sea)}
.chip.ok{border-color:var(--good);background:rgba(95,211,154,.16)}
.chip.no{border-color:var(--bad);background:rgba(255,122,102,.14)}
.chip.missed{border-style:dashed;border-color:var(--good)}
.feedback{border-radius:8px;padding:10px 12px;background:rgba(10,42,77,.7);border:1px solid var(--line-2);font-size:.92rem}
.feedback.good{border-color:var(--good)}
.feedback.mid{border-color:var(--part)}
.feedback.badf{border-color:var(--bad)}
details.compare{border:1px dashed var(--line-2);border-radius:8px;padding:6px 10px}
details.compare summary{cursor:pointer;font-weight:600;color:var(--sea)}
.tblwrap{overflow-x:auto;margin-top:8px}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:.82rem}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.cmp th{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
.dots{display:inline-flex;gap:2px;margin-right:4px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots i.on{background:var(--sea)}
.progress{font-family:var(--mono);font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.pips{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.pips i{width:18px;height:5px;border-radius:2px;background:rgba(255,255,255,.15)}
.pips i.done{background:var(--sea)}
.pips i.cur{background:var(--sun)}

/* Level 2 */
.l2{display:grid;grid-template-columns:196px minmax(0,1fr) 288px;gap:12px;align-items:start}
.btabs{display:flex;flex-wrap:wrap;gap:6px}
.btab{background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:6px;padding:5px 10px;font-size:.84rem;text-align:left}
.btab[aria-pressed="true"]{border-color:var(--sun);background:rgba(247,181,72,.14)}
.btab small{display:block;font-family:var(--mono);font-size:.66rem;color:var(--muted)}
.palette{display:grid;grid-template-columns:1fr;gap:4px;max-height:600px;overflow:auto;padding-right:2px}
.pitem{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;text-align:left;background:rgba(10,42,77,.6);border:1px solid var(--line);border-radius:7px;padding:4px 6px;touch-action:manipulation}
.pitem:hover{border-color:var(--sea)}
.pitem[aria-pressed="true"]{border-color:var(--sun);background:rgba(247,181,72,.15)}
.pitem svg{width:34px;height:28px}
.pitem .nm{font-size:.8rem;font-weight:600;line-height:1.1}
.pitem .cs{display:block;font-family:var(--mono);font-size:.64rem;color:var(--muted);font-weight:400}
.pitem .ct{font-family:var(--mono);font-size:.68rem;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.08)}
.pitem .ct.met{background:rgba(95,211,154,.25);color:#cff5e1}
.pitem .ct.need{background:rgba(247,181,72,.22);color:var(--sun-2)}
.planwrap{position:relative}
#plan{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;background:rgba(6,30,56,.55)}
#plan:focus{outline:none}
#plan:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.tool{background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:6px;padding:5px 9px;font-size:.82rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.tool:hover{background:rgba(255,255,255,.12)}
.tool[aria-pressed="true"]{background:var(--sea);color:#032b2a;border-color:var(--sea)}
.tool:disabled{opacity:.4;cursor:not-allowed}
.status{font-size:.84rem;color:var(--muted);min-height:1.3em}
.status b{color:var(--sun-2)}
.scorebox{display:flex;align-items:center;gap:12px}
.ring{width:66px;height:66px;flex:none}
.rules{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:470px;overflow:auto}
.rule{width:100%;display:grid;grid-template-columns:20px 1fr;gap:7px;text-align:left;background:rgba(10,42,77,.6);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:.8rem;line-height:1.3}
.rule:hover,.rule[aria-pressed="true"]{border-color:var(--sun)}
.rule b{display:block;font-size:.84rem}
.rule .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;margin-top:1px}
.rule.pass .ic{background:var(--good);color:#032b18}
.rule.part .ic{background:var(--part);color:#2a1d00}
.rule.fail .ic{background:var(--bad);color:#2b0700}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.74rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.keyhelp{font-size:.74rem;color:var(--dim);font-family:var(--mono);margin-top:4px}

/* Level 3 */
.l3{display:grid;gap:12px}
.deck{display:grid;place-items:center;min-height:150px}
.card{width:min(460px,100%);background:#f6eedd;color:#1b2a3a;border-radius:10px;padding:18px 20px;box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08);position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.card .tag{color:#9a5b12}
.card p{font-size:1.15rem;font-weight:600;margin:.3em 0 0;line-height:1.3}
.card.drag{cursor:grabbing;box-shadow:0 18px 36px rgba(0,0,0,.45)}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bin{border:2px dashed var(--line-2);border-radius:10px;background:rgba(10,42,77,.55);padding:10px;text-align:left;min-height:150px;display:flex;flex-direction:column;gap:6px}
.bin:hover,.bin.over{border-color:var(--sun);background:rgba(247,181,72,.10)}
.bin h3{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bin h3 .k{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted)}
.bin .mini{font-size:.74rem;line-height:1.25;border-radius:5px;padding:4px 6px;background:rgba(255,255,255,.07);border-left:3px solid var(--good)}
.bin .mini.x{border-left-color:var(--bad)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(3,15,30,.72);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.mbox{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,#1a5288,#0f3963);border:1px solid var(--line-2);border-radius:12px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.bigstars{display:flex;gap:8px;justify-content:center;margin:8px 0}
.bigstars svg{width:52px;height:52px}
.bigstars svg.on{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.rlist{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px;font-size:.85rem}
.rlist li{padding-left:22px;position:relative}
.rlist li::before{position:absolute;left:0;top:0;font-weight:700}
.rlist li.pass::before{content:"\2713";color:var(--good)}
.rlist li.part::before{content:"\25D0";color:var(--part)}
.rlist li.fail::before{content:"\2717";color:var(--bad)}

/* Footer title block */
footer.tb{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;border:1px solid var(--line-2);border-radius:6px;font-family:var(--mono);font-size:.7rem;color:var(--muted);overflow:hidden}
footer.tb div{padding:6px 10px;border-left:1px solid var(--line-2)}
footer.tb div:first-child{border-left:0;color:var(--ink);font-family:var(--body);font-size:.85rem;font-weight:600}
footer.tb span{display:block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

.fadein{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}

@media (max-width:1000px){
  .l2{grid-template-columns:1fr 280px}
  .l2 .pcol{grid-column:1 / -1;order:3}
  .palette{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:none}
}
@media (max-width:820px){
  .home{grid-template-columns:1fr}
  .l1{grid-template-columns:1fr}
  .l2{grid-template-columns:1fr}
  .l2 .pcol{order:2}
  .l2 .rcol{order:3}
  .rules{max-height:none}
}
@media (max-width:560px){
  .wrap{padding:10px 12px 16px}
  .hero{grid-template-columns:1fr}
  .hero .fig{display:none}
  .bins{grid-template-columns:1fr}
  .bin{min-height:0}
  .bins .bin .minis{display:none}
  footer.tb{grid-template-columns:1fr 1fr}
  footer.tb div:first-child{grid-column:1 / -1}
  footer.tb div:nth-child(3){border-left:1px solid var(--line-2)}
  footer.tb div:nth-child(2),footer.tb div:nth-child(3){border-top:1px solid var(--line-2)}
  footer.tb div:nth-child(4){display:none}
  .palette{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand svg{display:none}
  .brief{grid-template-columns:56px 1fr}
  .brief .fig{width:56px}
  nav.levels{width:100%}
  .nbtn{padding:6px 8px;font-size:.82rem}
  .nbtn .lbl{display:none}
}

/* Level 4 */
.l4{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
.scenecol{position:sticky;top:8px}
.scene{width:100%;height:auto;display:block;margin-top:6px;border-radius:8px;background:rgba(6,30,56,.55)}
.notes{margin:4px 0 0;padding-left:1.4em;font-size:.84rem;line-height:1.35}
.notes li{margin:2px 0}
.notes li::marker{font-family:var(--display);font-weight:700;color:var(--sun-2)}
.crits{display:flex;flex-direction:column;gap:6px}
.crit{margin:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px 8px;background:rgba(10,42,77,.55);min-width:0}
.crit legend{padding:0;float:left;width:100%;margin-bottom:5px}
.crit legend b{font-size:.9rem}
.crit legend small{display:block;color:var(--muted);font-size:.76rem;line-height:1.25}
.seg{display:flex;gap:4px;clear:both}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.seg span{display:block;text-align:center;border:1px solid var(--line-2);border-radius:6px;padding:5px 4px;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.04)}
.seg input:focus-visible+span{outline:3px solid var(--sun);outline-offset:1px}
.seg .r-g input:checked+span{background:var(--good);color:#032b18;border-color:var(--good)}
.seg .r-n input:checked+span{background:var(--part);color:#2a1d00;border-color:var(--part)}
.seg .r-p input:checked+span{background:var(--bad);color:#2b0700;border-color:var(--bad)}
.seg input:disabled{cursor:default}
.cmt{width:100%;margin-top:5px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:inherit;font-size:.82rem;padding:5px 7px}
.cmt:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.cmt::placeholder{color:var(--dim)}
.crit.agree{border-color:var(--good)}
.crit.close{border-color:var(--part);background:rgba(247,198,79,.08)}
.crit.clash{border-color:var(--bad);background:rgba(255,122,102,.12);box-shadow:0 0 0 1px var(--bad) inset}
.expert{margin-top:6px;font-size:.8rem;line-height:1.35;border-top:1px dashed var(--line-2);padding-top:5px}
.eb{display:inline-block;border-radius:4px;padding:0 6px;font-weight:700;margin-right:5px;font-size:.74rem}
.eb.r-g{background:var(--good);color:#032b18}.eb.r-n{background:var(--part);color:#2a1d00}.eb.r-p{background:var(--bad);color:#2b0700}
.dis{color:var(--bad);font-weight:700;margin-right:5px}.agr{color:var(--good);font-weight:700;margin-right:5px}
#printarea{display:none}
@media (max-width:820px){.l4{grid-template-columns:1fr}.scenecol{position:static}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#000!important}
  body{background-image:none!important}
  .wrap,.modal,#live{display:none!important}
  #printarea{display:block!important}
.pf{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;font-size:10.5pt;line-height:1.3;max-width:190mm;margin:0 auto}
.pf h1{font-size:17pt;margin:0 0 2px}.pf .sub{font-size:9pt;color:#333;margin-bottom:8px}

     GameSave.persist({ key, get, set, every })       save get() under key (on every save(), every `every` ms, and when the page is hidden); on load call set(saved) once
     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)
     GameSave.onReset(fn)             run fn before the page reloads after a reset

     GameSave.reset({reload})         clear without asking

      '.gs-box{max-width:420px;width:100%;background:#0F1E4A;color:#F1F4FF;border:2px solid #F5C542;border-radius:16px;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}' +

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

<!-- simsave:start --><script id="simsave-kit">
/* SimSave kit v1: lets students save what they make in the simulators as real files.
   Word (.docx), Excel (.xlsx), CSV, PDF, JPG, PNG, SVG, HTML and TXT, written in the browser with no server.
   Files go through the course's download route (parent.offerFile) when the simulator runs inside the course,
   or a normal browser download when the page is opened on its own. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.SimSave) return;

   if(!exits.length)issues.push("no emergency exit has been placed");
   exits.forEach(e=>{const s=exitSide(e.x,e.y);const [dx,dy]=[[0,-1],[-1,0],[0,-1],[1,0]][s];const ix=e.x+dx,iy=e.y+dy;const o=occ.get(ix+","+iy);if(o&&o.t!=="exit"){bad.push(o.id);issues.push("the emergency exit is blocked")}});
   let unreach=0;anchors.forEach(([it,cells])=>{const kd=best(cells,dD);const ke=dE?best(cells,dE):1;if(kd<0||(dE&&ke<0)){unreach++;bad.push(it.id)}});
   if(unreach)issues.push(`${unreach} work area${unreach>1?"s":""} cannot reach ${dE?"both exits":"the door"}`);
   let near=false;exits.forEach(e=>{if(minMan([[e.x,e.y]],DOOR)<6)near=true});
   const s=issues.length?0:near?1:2;
   res.walk={s,msg:issues.length?`Problem: ${issues.join("; ")}.`:near?"Routes are clear, but the emergency exit is too close to the main door. A fire could block both.":"Every worker has a clear route to the main door and to the emergency exit.",bad}}
  // reception
  {const bad=[];let s=0,msg;
   if(!recs.length)msg="No reception counter yet. Visitors should be greeted as soon as they enter.";
   else{const d=Math.min(...recs.map(r=>minMan(cellsOf(r),DOOR)));const wd=waits.length?Math.max(...waits.map(w=>Math.min(...recs.map(r=>minCheb(cellsOf(w),cellsOf(r)))))):99;
     if(d<=3&&wd<=3){s=2;msg="Reception is the first thing visitors meet, with seating beside it."}
     else if(d<=3){s=1;msg=waits.length?"Reception is well placed, but move the waiting chairs closer to it.":"Reception is well placed; add waiting chairs beside it.";waits.forEach(w=>bad.push(w.id))}
     else{s=d<=5?1:0;msg=`Reception is ${d} m from the door. Visitors would wander through the work area first.`;recs.forEach(r=>bad.push(r.id))}}
   res.recep={s,msg,bad}}
  // confidential
  {const bad=[];records.forEach(r=>{const dc=minMan(cellsOf(r),DOOR);const nw=waits.some(w=>minCheb(cellsOf(w),cellsOf(r))<=2)||recs.some(rc=>minCheb(frontCells(rc),cellsOf(r))<=1);if(dc<6||nw)bad.push(r.id)});
   const n=records.length;res.conf={s:!n?0:bad.length===0?2:bad.length<=Math.floor(n/3)?1:0,msg:!n?"No filing cabinets, safe or server placed yet.":bad.length?`${bad.length} of ${n} records/security items sit in or beside the public area. Visitors could see or reach them.`:"Records, safe and server are all well away from visitors.",bad}}
  // copier
  const workers=[...desks.map(d=>ctr(d)),...offices.map(o=>{const c=officeDoor(o);return [c[0]+.5,c[1]+.5]})];
  {let s=0,msg,bad=[];if(!copiers.length)msg="No photocopier placed.";else if(!workers.length)msg="Place the workstations first, then position the copier for them.";
   else{const cp=ctr(copiers[0]);const avg=workers.reduce((a,[x,y])=>a+Math.abs(x-cp[0])+Math.abs(y-cp[1]),0)/workers.length;
     s=avg<=6.5?2:avg<=9?1:0;msg=`Average walk to the copier: ${avg.toFixed(1)} m. ${s===2?"Nicely central.":"Move it nearer the middle of the desks."}`;if(s<2)bad.push(copiers[0].id)}
   res.copy={s,msg,bad}}
  // ergo
  {const bad=[];let glare=0,stool=0;desks.forEach(d=>{let b=false;if(d.r%2===0){glare++;b=true}if(d.t==="wsb"){stool++;b=true}if(b)bad.push(d.id)});
   const n=desks.length;const s=!n?0:bad.length===0?2:bad.length<=n/2?1:0;
   const parts=[];if(glare)parts.push(`${glare} desk${glare>1?"s face":" faces"} towards or away from the windows (glare on screens and eyes)`);if(stool)parts.push(`${stool} fixed stool${stool>1?"s":""} cannot be adjusted for correct posture`);
   res.ergo={s,msg:!n?"No workstations yet.":parts.length?parts.join("; ")+". Tip: select a desk and press Rotate.":"All desks sit at right angles to the windows with adjustable ergonomic chairs.",bad}}
  // power
  {const pw=items.filter(i=>CAT[i.t].power);const bad=pw.filter(it=>minCheb(cellsOf(it),POWER)>1).map(i=>i.id);
   res.power={s:!pw.length?0:!bad.length?2:bad.length<=Math.max(1,pw.length/4)?1:0,msg:!pw.length?"No powered equipment yet.":bad.length?`${bad.length} powered item${bad.length>1?"s are":" is"} too far from a socket; extension cables would trail across the floor.`:"Every powered item sits beside a power point.",bad}}
  // flow
  {let s=0,msg;const proc=[...desks,...offices];
   if(!recs.length||!proc.length||!records.length)msg="Needs reception, processing desks and records before the workflow can be judged.";
   else{const a=Math.min(...recs.map(r=>dDoor(...ctr(r))));const b=proc.reduce((t,i)=>t+dDoor(...ctr(i)),0)/proc.length;const fr=items.filter(i=>i.t==="filing"||i.t==="safe");const c=fr.length?fr.reduce((t,i)=>t+dDoor(...ctr(i)),0)/fr.length:0;
     const ok1=a<b,ok2=c>b;s=ok1&&ok2?2:(ok1||ok2)?1:0;
     msg=s===2?"Documents move in a logical line: reception → processing → records.":!ok1?"The processing desks are closer to the door than reception.":"Records are nearer the door than the processing desks; files would travel backwards."}
   res.flow={s,msg,bad:[]}}
  // space
  {const bad=[];desks.forEach(d=>{const cc=clearanceCells(d);if(cc.some(([x,y])=>!inRoom(x,y)||blocked[y*COLS+x]))bad.push(d.id)});
   let used=0;blocked.forEach(b=>{if(b)used++});const free=1-used/(COLS*ROWS);
   const n=desks.length;let s=2,msg="Every chair can be pushed back, and there is plenty of free floor.";
   if(!n){s=0;msg="No workstations yet."}
   else if(bad.length||free<.4){s=(bad.length<=n/4&&free>=.35)?1:0;msg=(bad.length?`${bad.length} chair${bad.length>1?"s have":" has"} no room behind to push back. `:"")+(free<.4?`Only ${Math.round(free*100)}% of the floor is free; the office is over-crowded.`:"")}
   res.space={s,msg,bad}}
  // safety
  {const fa=by("firstaid").length,ex=by("ext");const ends=[...DOOR,...exits.map(e=>[e.x,e.y])];const nearExit=ex.some(e=>minMan([[e.x,e.y]],ends)<=3);
   const s=(fa?1:0)+(nearExit?1:0);const parts=[];if(!fa)parts.push("add a first-aid kit");if(!ex.length)parts.push("add fire extinguishers");else if(!nearExit)parts.push("move an extinguisher beside the door or exit");
   res.safety={s,msg:s===2?"First-aid kit in place; an extinguisher sits on the escape route.":`To do: ${parts.join("; ")}.`,bad:nearExit?[]:ex.map(e=>e.id)}}
  // budget
  {const tot=items.reduce((a,i)=>a+CAT[i.t].cost,0);const s=tot<=B.budget?2:tot<=B.budget*1.1?1:0;
   res.budget={s,msg:`Spent US$${tot.toLocaleString("en-GB")} of US$${B.budget.toLocaleString("en-GB")}.${s<2?" Over budget: remove extras or choose cheaper options.":""}`,bad:[],tot}}
  // heat
  const heat=new Array(COLS*ROWS).fill(0);
  anchors.forEach(([it,cells])=>{const kd=best(cells,dD);if(kd>=0)trace(dD,kd).forEach(k=>heat[k]+=1);if(dE){const ke=best(cells,dE);if(ke>=0)trace(dE,ke).forEach(k=>heat[k]+=.5)}});

  let pts=0;RULES.forEach(([k])=>pts+=res[k].s);
  return {res,pct:Math.round(pts/(RULES.length*2)*100),heat,dD};
}

function itemSVG(it,extra){

function drawCursor(){const svg=document.getElementById("plan");if(!svg)return;const g=svg.querySelector("#g-cur");
  const focused=document.activeElement===svg;let s="";
  if(L2.arm&&L2.ghost){const {x,y,ok}=L2.ghost;const [w,h]=footprint(L2.arm,L2.armR||0);const c=CAT[L2.arm];
    const it={id:-1,t:L2.arm,x,y,r:L2.armR||0};
    s+=`<g opacity=".6">${itemSVG(it)}</g><rect x="${x*C}" y="${y*C}" width="${w*C}" height="${h*C}" fill="${ok?"rgba(95,211,154,.15)":"rgba(255,122,102,.22)"}" stroke="${ok?"#5fd39a":"#ff7a66"}" stroke-width="2" rx="3"/>`;}

function cellFromEvent(e){const svg=document.getElementById("plan");const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return null;const p=pt.matrixTransform(m.inverse());return {x:Math.floor(p.x/C),y:Math.floor(p.y/C),fx:p.x/C,fy:p.y/C,inside:p.x>=0&&p.y>=0&&p.x<COLS*C&&p.y<ROWS*C}}
function armOrigin(t,cx,cy,r){const [w,h]=footprint(t,r||0);return {x:Math.max(0,Math.min(COLS-w,cx-Math.floor((w-1)/2))),y:Math.max(0,Math.min(ROWS-h,cy-Math.floor((h-1)/2)))}}
function autoR(t,x,y){
  // sensible default orientation
  if(t==="ws"||t==="wsb")return 1;
  if(t==="reception")return 2;

function placeArmed(cx,cy){

  const need=BRIEFS[L2.b].need[t==="wsb"?"ws":t]||0;const have=t==="ws"||t==="wsb"?plan().filter(i=>i.t==="ws"||i.t==="wsb").length:plan().filter(i=>i.t===t).length;
  if(need&&have>=need){L2.arm=null;L2.ghost=null;L2.sel=it.id;status(`Placed <b>${CAT[t].name}</b> (${have}/${need}, brief met). Selected: drag, rotate or remove it.`)}

function rotateSel(){const it=plan().find(i=>i.id===L2.sel);if(!it)return;if(it.t==="exit")return;
  const nr=(it.r+1)%4;const [w,h]=footprint(it.t,nr);const tries=[[it.x,it.y],[it.x-(w-1),it.y],[it.x,it.y-(h-1)],[Math.min(it.x,COLS-w),Math.min(it.y,ROWS-h)]];
  for(const [x,y] of tries){if(!canPlace(it.t,x,y,nr,it.id)){it.x=x;it.y=y;it.r=nr;storeDraft();SFX.move();refresh();const dir=["up (facing the windows)","right","down (back to the windows)","left"][nr];
      status(it.t==="ws"||it.t==="wsb"?`Worker now faces <b>${dir}</b>.${nr%2?" Good: right angles to the windows.":" Glare risk."}`:`Rotated <b>${CAT[it.t].name}</b>.`);say(`Rotated. Facing ${dir}.`);return}}
  SFX.err();status("<b>No room to rotate here.</b> Move it first.");say("No room to rotate here.");}
function deleteSel(){const p=plan();const i=p.findIndex(x=>x.id===L2.sel);if(i<0)return;const t=p[i].t;p.splice(i,1);L2.sel=null;storeDraft();SFX.del();refresh();status(`Removed <b>${CAT[t].name}</b>.`);say(`${CAT[t].name} removed.`);document.getElementById("plan").focus()}
function selectItem(it){L2.sel=it?it.id:null;L2.arm=null;L2.ghost=null;if(it){status(`<b>${CAT[it.t].name}</b>: ${CAT[it.t].tip}`);say(`${CAT[it.t].name} selected. Arrow keys move it, R rotates, Delete removes.`)}else status("");refresh()}

function bindPlan(){

  });

function onPlanKey(e){

    if(it&&!L2.arm){const nx=it.x+mv[0],ny=it.y+mv[1];const why=canPlace(it.t,nx,ny,it.r,it.id);if(!why){it.x=nx;it.y=ny;L2.cur={x:nx,y:ny};storeDraft();SFX.move();refresh();say(`Column ${nx+1}, row ${ny+1}.`)}else{SFX.err();say(why)}return}
    L2.cur={x:Math.max(0,Math.min(COLS-1,L2.cur.x+mv[0])),y:Math.max(0,Math.min(ROWS-1,L2.cur.y+mv[1]))};
    if(L2.arm){const r=autoR(L2.arm,L2.cur.x,L2.cur.y);const o=armOrigin(L2.arm,L2.cur.x,L2.cur.y,r);L2.ghost={x:o.x,y:o.y,ok:!canPlace(L2.arm,o.x,o.y,r)};drawGhostR(r)}else drawCursor();
    const here=itemAt(L2.cur.x,L2.cur.y);say(`Column ${L2.cur.x+1}, row ${L2.cur.y+1}${here?", "+CAT[here.t].name:""}.`);return}
  if(k==="Enter"||k===" "){e.preventDefault();if(L2.arm){placeArmed(L2.cur.x,L2.cur.y);return}const h=itemAt(L2.cur.x,L2.cur.y);if(h){selectItem(h)}else selectItem(null);return}

document.addEventListener("pointermove",e=>{const d=L2.palDrag;if(!d)return;if(!d.active&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>6){d.active=true;L2.arm=d.t;L2.sel=null;refresh()}

/* ---------------- Level 3 ---------------- */
let L3=null;
function newL3(){const order=CARDS.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}L3={order,i:0,score:0,placed:{open:[],cell:[],both:[]},answered:false}}

  </div>`;

    cardEl.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);cardEl.style.pointerEvents="";app.querySelectorAll(".bin").forEach(b=>b.classList.toggle("over",!!el&&b.contains(el)))});

    const bin=el&&el.closest?el.closest("[data-bin]"):null;app.querySelectorAll(".bin").forEach(b=>b.classList.remove("over"));cardEl.style.transform="";if(moved&&bin)answerL3(bin.dataset.bin)};

function answerL3(k){
  if(L3.answered)return;L3.answered=true;const idx=L3.order[L3.i],card=CARDS[idx];const ok=k===card[1];

function rotPt(it,lx,ly){const c=CAT[it.t];const W=c.w,H=c.h;const [w,h]=footprint(it.t,it.r);const cx=it.x+w/2,cy=it.y+h/2;const dx=lx-W/2,dy=ly-H/2;const a=it.r*Math.PI/2;return [cx+dx*Math.cos(a)-dy*Math.sin(a),cy+dx*Math.sin(a)+dy*Math.cos(a)]}
function topPerson(x,y,col,dir){const a=[0,90,180,270][dir||0];return `<g transform="translate(${x*C} ${y*C}) rotate(${a})" aria-hidden="true"><ellipse cx="0" cy="3" rx="11" ry="6" fill="${col}" stroke="#0a2a4d" stroke-width="1"/><circle cx="0" cy="1" r="5.6" fill="#5a3723" stroke="#0a2a4d" stroke-width="1"/><path d="M-4.5 -0.5a4.6 4.6 0 0 1 9 0" fill="#1b120d"/></g>`}

  <marker id="sa-${sc.id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2805f"/></marker></defs>
  <rect width="${W}" height="${H}" fill="${sc.floor}"/><rect width="${W}" height="${H}" fill="url(#sg-${sc.id})"/><rect width="${W}" height="${H}" fill="url(#ss-${sc.id})"/>
  <path d="M0 -14 ${[...Array(sc.cols)].map(()=>`q${C/4} -6 ${C/2} 0t${C/2} 0`).join(" ")}" fill="none" stroke="#46cfc6" stroke-width="1.3" opacity=".7"/>

    if(e.k==="cable")s+=`<path d="M${e.pts.map(p=>p.map(v=>(v*C).toFixed(0)).join(" ")).join(" L")}" fill="none" stroke="#f7b548" stroke-width="2.6" stroke-linejoin="round"/><circle cx="${e.pts[e.pts.length-1][0]*C}" cy="${e.pts[e.pts.length-1][1]*C}" r="3.5" fill="#f7b548"/>`;

    if(e.k==="fan"){const x=e.x*C,y=e.y*C;s+=`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="${S}" stroke-width="1"/>`;for(let k=0;k<3;k++)s+=`<ellipse cx="${x}" cy="${y-6}" rx="3.5" ry="6" fill="#cfe4f7" transform="rotate(${k*120} ${x} ${y})"/>`}
    if(e.k==="noise"){const x=e.x*C,y=e.y*C;for(let k=1;k<=3;k++)s+=`<path d="M${x+k*6} ${y-k*6}a${k*8} ${k*8} 0 0 1 0 ${k*12}" fill="none" stroke="#f2805f" stroke-width="1.8" opacity="${1.1-k*.25}"/>`}
    if(e.k==="wall"){s+=`<polyline points="${e.pts.map(p=>p.map(v=>v*C).join(",")).join(" ")}" fill="none" stroke="${S}" stroke-width="4"/>`;if(e.lab)s+=`<text x="${e.lx*C}" y="${e.ly*C}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#ffd58a">${e.lab}</text>`}
    if(e.k==="label")s+=`<text x="${e.x*C}" y="${e.y*C}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" letter-spacing="1" fill="#a9c6e6">${e.t}</text>`;
    if(e.k==="bench"){const x=e.x*C,y=e.y*C,h=e.h*C;s+=`<rect x="${x}" y="${y}" width="${C}" height="${h}" fill="rgba(238,246,255,.10)" stroke="${S}" stroke-width="1.5"/><path d="M${x+C/2} ${y}V${y+h}" stroke="${S}" stroke-width=".8" stroke-dasharray="3 3"/>`;
      for(let k=0;k<4;k++){const yy=y+C*(0.75+k*1.45);s+=`<rect x="${x+4}" y="${yy-6}" width="10" height="12" fill="#46cfc6" opacity=".8"/><rect x="${x+C-14}" y="${yy-6}" width="10" height="12" fill="#46cfc6" opacity=".8"/>`;
        s+=topPerson(e.x-0.32,yy/C,"#9cc6ea",1)+topPerson(e.x+1.32,yy/C,"#f2805f",3)}}
    if(e.k==="lockers"){for(let k=0;k<e.w*2;k++)s+=`<rect x="${e.x*C+k*C/2+2}" y="${e.y*C+6}" width="${C/2-4}" height="${C-12}" fill="rgba(247,181,72,.2)" stroke="${S}" stroke-width="1"/><circle cx="${e.x*C+k*C/2+C/4}" cy="${e.y*C+C/2}" r="1.6" fill="#f7b548"/>`}
    if(e.k==="art")e.ys.forEach(y=>{s+=`<rect x="5" y="${y*C}" width="6" height="${C*.7}" fill="#f2805f" stroke="${S}"/>`});
    if(e.k==="open")s+=`<g transform="translate(${e.x*C} ${e.y*C})"><path d="M2 -8H${3*C-2}" stroke="#ff7a66" stroke-width="2" stroke-dasharray="5 3"/><text x="${1.5*C}" y="-11" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#ff7a66">UNLOCKED</text></g>`;
  });
  sc.people.forEach(([x,y,c,d])=>{s+=topPerson(x,y,c,d)});
  sc.callouts.forEach(([n,x,y])=>{s+=`<g aria-hidden="true"><circle cx="${x*C}" cy="${y*C}" r="11" fill="#ffd58a" stroke="#0a2a4d" stroke-width="2"/><text x="${x*C}" y="${y*C+4.5}" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="14" fill="#2a1900">${n}</text></g>`});
  return s+`</svg>`;
}

let L4={sc:0,ans:{},done:{}};

function pctStars(p){return p>=85?3:p>=65?2:p>=45?1:0}
function renderL4(){

function scoreL4(sc){const A=L4.ans[sc.id];let pts=0,agree=0;CRIT.forEach(([k])=>{const d=Math.abs(RV[A.r[k]]-RV[sc.expert[k][0]]);pts+=2-d;if(!d)agree++});return {pts,agree,p:Math.round(pts/(CRIT.length*2)*100)}}
function showVerdict(sc,first){
  const r=scoreL4(sc);const st=pctStars(r.p);

function submitL4(sc){

   <p style="text-align:center;font-size:1.2rem"><b>${r.p}%</b> ${nb?'<span class="tag" style="color:var(--sun)">New best!</span>':`<span class="muted">(best ${save.l4[sc.id].p}%)</span>`}</p>

   <ol style="padding-left:1.2em;font-size:.9rem">${sc.recs.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <p class="muted" style="font-size:.85rem">Level 4 average across all four offices: ${l4Avg()}%.</p>
   <div class="row"><button class="btn ghost" data-m="close">See side-by-side</button><button class="btn" data-m="l4next">${esc(SCENES[L4.next].name)} →</button><button class="btn ghost" data-m="home">Home</button><button class="btn ghost" data-m="sssubmit">📤 Submit my work</button></div>`,st);
}

/* ---------------- Saved progress (GameSave) ----------------
   Best scores, sound and the Level 2 floor-plan drafts: 'edpm-office-architect-v1'.
   The level you were on and the round in progress (Level 1 clients, Level 2 brief, Level 3 cards, Level 4 ratings): 'edpm.officedesigner.save'.
   Start over clears both. */
(function(){
  if(!window.GameSave)return;
  const SKEY="edpm.officedesigner.save";
  GameSave.register([KEY,SKEY]);
  const isInt=(n,a,b)=>Number.isInteger(n)&&n>=a&&n<=b, arr=a=>Array.isArray(a)?a:[], num=v=>typeof v==="number"&&isFinite(v)?v:0, ob=v=>v&&typeof v==="object"&&!Array.isArray(v)?v:null;
  /* only finished answers are kept: an answered client or card moves on; an answered last one is asked again */
  function packL1(){let i=L1.i,score=L1.score;const log=L1.log.slice();
    if(L1.done){if(i<CLIENTS.length-1)i++;else{const l=log.pop();score-=l?l[1]:0}}
    return {i,score,log}}
  function unpackL1(s){if(!s||!isInt(s.i,0,CLIENTS.length-1)||!Array.isArray(s.log))return null;
    const log=s.log.filter(x=>Array.isArray(x)&&typeof x[0]==="string"&&typeof x[1]==="number");if(log.length!==s.i||log.length!==s.log.length)return null;
    return {i:s.i,score:num(s.score),pick:null,reasons:new Set(),done:false,log}}
  function packL3(){if(!L3)return null;let i=L3.i,score=L3.score;const placed={open:L3.placed.open.slice(),cell:L3.placed.cell.slice(),both:L3.placed.both.slice()};
    if(L3.answered){if(i<CARDS.length-1)i++;else{const card=CARDS[L3.order[i]],p=placed[card[1]],last=p[p.length-1];if(last&&last[0]===L3.order[i]){p.pop();if(last[1])score--}}}
    return {order:L3.order,i,score,placed}}
  function unpackL3(s){if(!s||!Array.isArray(s.order)||s.order.length!==CARDS.length||s.order.slice().sort((a,b)=>a-b).join()!==CARDS.map((_,k)=>k).join()||!isInt(s.i,0,CARDS.length-1))return null;
    const placed={};for(const k of ["open","cell","both"])placed[k]=arr(s.placed&&s.placed[k]).filter(x=>Array.isArray(x)&&isInt(x[0],0,CARDS.length-1)).map(x=>[x[0],!!x[1]]);
    return {order:s.order,i:s.i,score:num(s.score),placed,answered:false}}
  function unpackL4(s){if(!s||!isInt(s.sc,0,SCENES.length-1))return null;const ans={},done={};
    SCENES.forEach(sc=>{const a=ob(s.ans&&s.ans[sc.id]);if(a)ans[sc.id]={r:ob(a.r)||{},c:ob(a.c)||{}};if(s.done&&s.done[sc.id]===true)done[sc.id]=true});
    return {sc:s.sc,ans,done}}
  GameSave.persist({key:SKEY,welcome:false,every:5000,
    get:()=>({v:1,screen,L1:packL1(),L2b:L2.b,L3:packL3(),L4:{sc:L4.sc,ans:L4.ans,done:L4.done}}),
    set:sv=>{
      if(!sv||sv.v!==1)return;
      try{const a=unpackL1(sv.L1);if(a)L1=a}catch(e){}
      if(isInt(sv.L2b,0,BRIEFS.length-1))L2.b=sv.L2b;
      try{const c=unpackL3(sv.L3);if(c)L3=c}catch(e){}
      try{const d=unpackL4(sv.L4);if(d)L4=d}catch(e){}
      if(["l1","l2","l3","l4"].includes(sv.screen)){try{go(sv.screen)}catch(e){go("home")}}
      const any=save.l1||save.l3||Object.keys(save.l2||{}).length||Object.keys(save.l4||{}).length||L1.i||(L3&&L3.i)||Object.keys(L4.done).length||Object.values(save.drafts||{}).some(d=>Array.isArray(d)&&d.length);
      if(any)setTimeout(()=>GameSave.toast("Welcome back! Your progress was restored."),400);
    }});
  const later=()=>setTimeout(()=>GameSave.save(),0);
  document.addEventListener("click",later);document.addEventListener("pointerup",later);document.addEventListener("keyup",later);
})();
})();
