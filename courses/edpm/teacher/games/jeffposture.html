<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>It's Giving Jeff</title>
<meta name="description" content="It's Giving Jeff: fix Jeff's posture and ergonomics in seven levels. CSEC EDPM. Kester Small">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
:root{
  --bg:#f3f6fb; --paper:#fff; --line:#e1e7f0; --line2:#cfd8e5;
  --ink:#172333; --ink2:#4f5d70; --ink3:#7c8899;
  --brand:#4f5bf5; --brand2:#e9ebff; --mint:#14b38a; --mint2:#dcf6ee; --sun:#ffc93c; --sun2:#fff4d1; --coral:#ff6b5a; --coral2:#ffe5e1;
  --g:#1c9a57; --g2:#def5e7; --a:#c97a00; --a2:#fff0d1; --r:#d93a2b; --r2:#fde2df;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --rad:14px; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.07);
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden;max-width:100vw}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:2px;cursor:pointer;text-align:left;min-width:0}
.brand .logo{width:32px;height:32px;flex:none;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.3px;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.ibtn:hover{background:var(--bg)}
.ibtn svg{width:18px;height:18px}
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}
footer{flex:none;text-align:center;font-size:12.5px;color:var(--ink2);padding:5px 16px;border-top:1px solid var(--line);background:var(--paper)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.3px;margin:0}
.screen{max-width:1100px;margin:0 auto;padding:14px 16px 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;font-size:16px;min-height:44px}
.btn:hover{filter:brightness(1.07)}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line2)}
.btn.mint{background:var(--mint)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow)}
/* title */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:center;min-height:100%}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:.98;letter-spacing:-1.5px}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero .sub{font-weight:700;color:var(--ink2);margin:10px 0 14px}
.hero p{margin:0 0 14px;max-width:46ch;color:var(--ink2)}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px}
.hero .jeffbox{background:linear-gradient(180deg,#e7f1ff,#f7fbff);border-radius:24px;border:1px solid var(--line);aspect-ratio:1/1.05;max-height:480px;width:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.hero .jeffbox svg{width:100%;height:100%}
.hero .hi{position:absolute;top:14px;left:14px;max-width:min(240px,46%);background:#fff;border-radius:16px;padding:10px 13px;font-weight:700;box-shadow:var(--shadow);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.chips li{background:var(--brand2);color:#2f37b8;border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
/* menu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.lvcard{text-align:left;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--paper);border-radius:var(--rad);box-shadow:var(--shadow)}
.lvcard:hover{border-color:var(--brand)}
.lvcard .k{font-size:12.5px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.6px}
.lvcard b{font-family:var(--display);font-size:19px}
.lvcard span{color:var(--ink2);font-size:14px}
.stars{color:#e3a600;letter-spacing:2px;font-size:17px}
.stars .off{color:#cfd6e0}
/* play */
.play{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;height:100%;max-width:1180px;margin:0 auto;padding:10px 14px}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.stagebar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.stagebar .lvn{font-size:12.5px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.6px}
.stagebar h2{font-size:22px;line-height:1.1}
.stagebar .sb{display:flex;gap:6px;margin-left:auto}
.scene{position:relative;flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow)}
.scene>svg{display:block;width:100%;height:100%}
.howto{font-size:13px;color:var(--ink2);margin:6px 2px 0}
.bubble{position:absolute;max-width:min(290px,72%);background:#fff;border:2px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.3;box-shadow:0 4px 0 rgba(23,35,51,.12);z-index:3;pointer-events:none;transition:left .25s,top .25s}
.bubble::after{content:"";position:absolute;bottom:-9px;left:var(--tail,30px);width:14px;height:14px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble.pop{animation:bpop .3s ease}
@keyframes bpop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.banner{flex:none;margin-top:8px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);border:3px solid var(--g);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.banner h3{font-size:22px;color:var(--g)}
.banner .stars{font-size:24px}
.banner p{margin:0;color:var(--ink2);flex:1;min-width:160px;font-size:14.5px}
@media (min-width:861px){.banner{animation:bpop .35s ease}}
.panel{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;padding-bottom:6px}
.panel .card{padding:11px 12px}
.panel h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.panel h3 .count{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:800;background:var(--bg);border-radius:999px;padding:2px 9px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.rule{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:13.5px;padding:4px 6px;border-radius:8px;line-height:1.25}
.rule .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.rule .rv{font-weight:700;font-size:12.5px;text-align:right;white-space:nowrap}
.rule.s-g .dot{background:var(--g)} .rule.s-g .rv{color:var(--g)}
.rule.s-a .dot{background:var(--a)} .rule.s-a .rv{color:var(--a)}
.rule.s-r .dot{background:var(--r)} .rule.s-r .rv{color:var(--r)}
.rule.hint{background:var(--sun2);outline:2px solid var(--sun)}
.ctl{padding:5px 0;border-top:1px dashed var(--line)}
.ctl:first-of-type{border-top:0}
.ctl label,.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.ctl output{font-weight:800;color:var(--brand)}
.ctl .row{display:flex;align-items:center;gap:6px}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--brand);height:28px}
.step{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--paper);cursor:pointer;font-weight:800;flex:none;line-height:1}
.tog{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:700;font-size:14px;min-height:40px}
.tog[aria-pressed=true]{background:var(--mint2);border-color:var(--mint);color:#08664d}
.tog .sw{width:34px;height:20px;border-radius:999px;background:#cfd6e0;position:relative;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed=true] .sw{background:var(--mint)}
.tog[aria-pressed=true] .sw::after{left:16px}
fieldset.rad{border:0;margin:0;padding:0}
fieldset.rad legend{font-size:13.5px;font-weight:600;padding:0;margin-bottom:4px}
.radopts{display:flex;flex-wrap:wrap;gap:5px}
.radopts label{display:flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:10px;padding:6px 9px;font-size:13.5px;font-weight:600;cursor:pointer;background:#fff}
.radopts label:has(input:checked){background:var(--brand2);border-color:var(--brand)}
.radopts input{accent-color:var(--brand);margin:0}
.ctl.dis{opacity:.5}
.note{font-size:12.5px;color:var(--ink2);margin:4px 0 0}
/* svg handles */
.hdl{cursor:grab;outline:none;touch-action:none}
.hdl .hit{fill:transparent}
.hdl .ring{fill:#fff;stroke-width:3.2}
.hdl.s-g .ring{stroke:var(--g)} .hdl.s-a .ring{stroke:var(--a)} .hdl.s-r .ring{stroke:var(--r)}
.hdl .core{pointer-events:none}
.hdl.s-g .core{fill:var(--g)} .hdl.s-a .core{fill:var(--a)} .hdl.s-r .core{fill:var(--r)}
.hdl .foc{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-dasharray:4 3;opacity:0}
.hdl:focus .foc,.hdl.drag .foc{opacity:1}
.hdl.hint .ring{animation:pulse 1s ease-in-out infinite}
.hdl.lock{cursor:not-allowed;opacity:.55}
@keyframes pulse{50%{stroke-width:8}}
.tag rect{fill:#fff;stroke-width:1.4}
.tag text{font-family:var(--body);font-weight:800}
.tag.t-g rect{stroke:var(--g)} .tag.t-g text{fill:#137a43}
.tag.t-a rect{stroke:var(--a)} .tag.t-a text{fill:#9a5d00}
.tag.t-r rect{stroke:var(--r)} .tag.t-r text{fill:#b52a1d}
.tag.t-n rect{stroke:#8aa0b8} .tag.t-n text{fill:#3f526a}
/* timeline */
.tlwrap{flex:none;margin-top:8px}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:11px;padding:6px 9px;cursor:grab;font-weight:700;font-size:13.5px;touch-action:none;min-height:40px}
.pal svg{width:24px;height:24px;flex:none}
.pal[aria-pressed=true]{background:var(--brand2);border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.slots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.slot{width:100%;min-height:62px;border:1.5px dashed var(--line2);background:#fff;border-radius:10px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.slot .tm{font-size:11px;color:var(--ink3)}
.slot svg{width:24px;height:24px}
.slot.full{border-style:solid;border-color:var(--mint);background:var(--mint2);color:#07604a}
.slot.now{box-shadow:0 0 0 3px var(--sun)}
.slot.over{border-color:var(--brand);background:var(--brand2)}
.slot.lunchz .tm{color:#b46a00}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--brand);border-radius:10px;padding:5px 8px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
/* between */
.between{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.between .card{padding:16px}
.hbar{margin:10px 0}
.hbar .lab{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px}
.hbar .trk{height:16px;border-radius:999px;background:#e8edf4;overflow:hidden;margin-top:4px}
.hbar .fil{height:100%;border-radius:999px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ba figure{margin:0;background:#f6f9fd;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ba figure svg{display:block;width:100%;height:auto}
.ba figcaption{font-size:12.5px;font-weight:800;text-align:center;padding:4px;letter-spacing:.4px;text-transform:uppercase}
.ba .bef figcaption{color:var(--r)} .ba .aft figcaption{color:var(--g)}
.habit{background:var(--sun2);border:1px solid #f3dc97;border-radius:12px;padding:12px;margin:10px 0}
.habit h4{margin:0 0 4px;font-family:var(--display);font-size:16px}
.habit p{margin:0}
.doc{font-size:13.5px;background:#eef7ff;border:1px solid #cfe5fb;border-radius:12px;padding:10px 12px}
/* recap */
.booth{max-width:880px;margin:0 auto;background:#fff;border-radius:22px;border:1px solid var(--line);box-shadow:0 10px 40px rgba(20,30,60,.12);padding:18px;position:relative}
.booth h2{font-size:28px}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;background:#172333;padding:12px;border-radius:16px}
.strip figure{margin:0;background:#fff;border-radius:10px;padding:8px 8px 4px}
.strip svg{display:block;width:100%;height:auto;border-radius:6px}
.strip figcaption{text-align:center;font-family:var(--display);font-weight:800;padding:4px 0 2px}
.badge{position:absolute;right:18px;top:12px;transform:rotate(8deg);width:120px}
.lvrows{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.lvrows button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700;text-align:left}
.lvrows button[aria-current=true]{border-color:var(--brand);background:var(--brand2)}
/* quiz */
.quiz{max-width:700px;margin:0 auto}
.quiz .card{padding:18px}
.qopts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.qopt{text-align:left;border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:600;font-size:15.5px}
.qopt:hover:not(:disabled){border-color:var(--brand)}
.qopt.right{background:var(--g2);border-color:var(--g)}
.qopt.wrong{background:var(--r2);border-color:var(--r)}
.qopt:disabled{cursor:default}
.prog{height:8px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:8px 0 12px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}
.fb{border-radius:12px;padding:10px 12px;margin-bottom:12px}
.fb.ok{background:var(--g2)} .fb.no{background:var(--r2)}
@media (max-width:860px){
  .play{display:block;height:auto;padding:10px 12px}
  .scene{flex:none}
  .scene>svg{height:auto}
  .panel{overflow:visible;margin-top:10px}
  .hero{grid-template-columns:1fr}
  .hero .jeffbox{max-height:340px;aspect-ratio:auto;height:340px}
  .between{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:520px){
  .brand small{display:none}
  .ibtn .tx{display:none}
  .stagebar h2{font-size:19px}
  .bubble{font-size:13.5px;padding:6px 10px}
  .strip{grid-template-columns:1fr 1fr;gap:8px;padding:8px}
  .badge{width:84px;right:8px;top:8px}
  .booth h2{font-size:22px;padding-right:80px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

function sceneSvg(n,S,face,cls=''){

}

/* ---------- play ---------- */
function ctrlById(L,id){return L.controls.find(c=>c.id===id);}
function fmtVal(c,v){if(c.type==='toggle')return v?'On':'Off';return (c.step<1?(+v).toFixed(1).replace(/\.0$/,''):v)+(c.unit||'');}
function startLevel(n){

function buildControls(){
  const L=cur.L,S=cur.S;
  const grpEl={body:$('#cgBody'),eq:$('#cgEq')};
  L.controls.forEach(c=>{
    const d=document.createElement('div');d.className='ctl';d.dataset.c=c.id;
    if(c.type==='toggle'){d.innerHTML=`<button class="tog" id="c-${c.id}" aria-pressed="false"><span>${esc(c.label)}</span><span class="sw" aria-hidden="true"></span></button>`;
      d.querySelector('button').onclick=()=>{if(!enabled(c))return;S[c.id]=!S[c.id];update();};}
    else if(c.type==='radio'){d.innerHTML=`<fieldset class="rad"><legend>${esc(c.label)}</legend><div class="radopts">${c.opts.map(o=>`<label><input type="radio" name="r-${c.id}" value="${o[0]}">${esc(o[1])}</label>`).join('')}</div></fieldset>`;
      d.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{if(inp.checked){S[c.id]=inp.value;update();}});}
    else{d.innerHTML=`<label for="c-${c.id}"><span>${esc(c.label)}</span><output id="o-${c.id}"></output></label><div class="row"><button class="step" data-d="-1" aria-label="Decrease ${esc(c.label)}">−</button><input type="range" id="c-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}"><button class="step" data-d="1" aria-label="Increase ${esc(c.label)}">+</button></div>`;
      const inp=d.querySelector('input');inp.oninput=()=>{S[c.id]=+inp.value;update();};
      d.querySelectorAll('.step').forEach(b=>b.onclick=()=>{if(!enabled(c))return;S[c.id]=clamp(+(S[c.id]+c.step*b.dataset.d).toFixed(2),c.min,c.max);update();});}
    grpEl[c.grp].appendChild(d);
  });
  ['body','eq'].forEach(k=>{if(grpEl[k].children.length<2)grpEl[k].hidden=true;});
}
function enabled(c){return !c.en||c.en(cur.S);}
function syncControls(){
  const L=cur.L,S=cur.S;
  L.controls.forEach(c=>{const d=main.querySelector(`.ctl[data-c="${c.id}"]`);if(!d)return;const en=enabled(c);d.classList.toggle('dis',!en);

function okState(L,x){

    const n=d.level.n,L=LV[n-1];
    if(d.level.passed&&session[n]){showBetween(n);return true;}

}

      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
