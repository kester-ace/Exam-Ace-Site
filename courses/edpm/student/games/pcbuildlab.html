<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Build Lab</title>
<meta name="description" content="Computer types, data entry devices and components · EDPM. A steady-hand PC assembly game with a device gallery, sorting games, a tech museum and a quiz. Kester Small">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
:root{
  --bp:#0c2034; --bp2:#123049; --gridc:rgba(150,200,245,.06); --gridc2:rgba(150,200,245,.12);
  --paper:#f7f2e7; --paper2:#ece4d3; --line:#d8ccb4; --ink:#16212b; --ink2:#46535f; --ink3:#6d7a86;
  --steel:#222930; --steel2:#2e373f; --steel3:#3d4852; --hi:#e9f1f8; --hi2:#a9bccd;
  --amber:#ffb547; --amber2:#f29a1d; --amberInk:#6b4000; --copper:#c8743a;
  --ok:#1f8f59; --ok2:#d9f2e4; --bad:#c9312f; --bad2:#fbe1df; --blue:#2577c9; --blue2:#dcebfa;
  --violet:#6a4cc9; --violet2:#ebe5fb; --teal:#0f7f80; --teal2:#d6efed; --grey2:#e4e7ea;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --shadow:0 10px 28px rgba(0,0,0,.32),0 2px 4px rgba(0,0,0,.18);
  color-scheme:dark;
}
body{
  background-color:var(--bp); color:var(--hi); font-family:var(--body); font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  background-image:
    radial-gradient(900px 560px at 10% -10%, rgba(255,184,92,.30), rgba(255,184,92,0) 70%),
    linear-gradient(var(--gridc2) 1px, transparent 1px), linear-gradient(90deg, var(--gridc2) 1px, transparent 1px),
    linear-gradient(var(--gridc) 1px, transparent 1px), linear-gradient(90deg, var(--gridc) 1px, transparent 1px);
  background-size:auto, 120px 120px, 120px 120px, 24px 24px, 24px 24px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;display:flex;flex-direction:column;max-width:100vw;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:linear-gradient(#2b333b,#1b2127);border-bottom:1px solid #070a0d;box-shadow:0 2px 10px rgba(0,0,0,.35);flex:none;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:2px;color:#fff;text-align:left}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;display:block;line-height:1.05}
.brand small{display:block;font-size:12px;color:var(--hi2);letter-spacing:.2px}
.spacer{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #3e4954;background:linear-gradient(#36414b,#262e36);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;color:var(--hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ibtn:hover{filter:brightness(1.15)}
.ibtn svg{width:18px;height:18px}
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.screen{max-width:1100px;margin:0 auto;padding:16px 16px 28px}
footer{flex:none;text-align:center;font-size:12.5px;color:var(--hi2);padding:6px 16px;border-top:1px solid #070a0d;background:#151a1f}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.2px}
h2{font-size:25px;line-height:1.15;color:#fff}
h2:focus{outline:none}
.kicker{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber)}
.lede{color:var(--hi2);margin:4px 0 0;max-width:760px}
.shead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.shead .spacer{min-width:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 17px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.3px;background:linear-gradient(#ffc766,#f3a32a);color:#2a1800;box-shadow:0 2px 0 #a8650a,inset 0 1px 0 #ffe3ad;transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.steel{background:linear-gradient(#3b4651,#28313a);color:var(--hi);box-shadow:0 2px 0 #10151a,inset 0 1px 0 rgba(255,255,255,.1)}
.btn.ink{background:linear-gradient(#2e3b47,#1d262f);color:#fff;box-shadow:0 2px 0 #0b0f13}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.sheet{background:var(--paper);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--grey2);color:#2c3640}
.k-in{background:var(--ok2);color:#0f5c37}.k-out{background:var(--violet2);color:#45309a}.k-sto{background:var(--blue2);color:#174d85}
.k-proc{background:#ffefd2;color:#7a4700}.k-sup{background:#e6e9ec;color:#38434d}.k-core{background:var(--teal2);color:#0b5a5b}.k-pow{background:var(--bad2);color:#8d1f1d}
.k-man{background:#dff0ff;color:#0f4f8a}.k-dir{background:#ffe9c7;color:#7a4300}.k-io{background:#efe3ff;color:#4f2a99}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:18px;height:18px}
.seg{display:inline-flex;background:#d9cfbd;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13.5px;color:#3a4550}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.tab{border:1px solid #3e4954;background:linear-gradient(#33404b,#242c34);color:var(--hi);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:linear-gradient(#ffc766,#f3a32a);color:#2a1800;border-color:#c98216}
.tab .cnt{font-family:var(--mono);font-size:11.5px;opacity:.75;margin-left:4px}

/* HOME */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:center;margin:4px 0 18px}
.hero h1{font-size:46px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hero h1 span{color:var(--amber)}
.hero p{color:var(--hi2);margin:10px 0 0;font-size:16.5px;max-width:540px}
.hero .heroart{background:radial-gradient(circle at 30% 20%,rgba(255,196,110,.35),transparent 60%),#24525f;border-radius:18px;border:2px solid #173c46;box-shadow:var(--shadow);padding:8px;position:relative;overflow:hidden}
.hero .heroart > svg{display:block;width:100%;height:auto}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;padding:14px;border-radius:var(--r);background:var(--paper);color:var(--ink);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--mc,#ffb547)}
.mode .micon{width:84px;height:62px;flex:none;border-radius:10px;background:#dfe8ef;border:1px solid #c6d3de;display:grid;place-items:center;overflow:hidden}
.mode .micon svg{width:80px;height:58px}
.mode h3{font-size:18px;line-height:1.15}
.mode .num{font-family:var(--mono);font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:1px}
.mode p{margin:4px 0 6px;font-size:14px;color:var(--ink2)}
.mode .best{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mode.feature{grid-column:span 2;background:linear-gradient(135deg,#fff7e6,#f7f2e7)}
.mode.feature .micon{width:120px;height:86px}
.mode.feature .micon svg{width:116px;height:82px}

/* LEARN */
.intro{padding:12px 14px;margin-bottom:14px;font-size:15px}
.intro p{margin:0}
.progressline{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--hi2);margin:0 0 10px}
.pbar{flex:1;max-width:260px;height:8px;border-radius:9px;background:#0a1826;border:1px solid #2b4a66;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb547,#ffd27a);width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dcard{display:flex;flex-direction:column;overflow:hidden}
.dcard .art{background-color:#dfe8ef;background-image:linear-gradient(rgba(40,90,140,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(40,90,140,.08) 1px,transparent 1px);background-size:12px 12px;border-bottom:1px solid #c9d5df;padding:8px;display:grid;place-items:center;position:relative}
.dcard .art > svg{width:100%;max-width:230px;height:auto;aspect-ratio:160/110}
.dcard .art .corner{position:absolute;left:8px;top:7px;font-family:var(--mono);font-size:10.5px;color:#56708a;letter-spacing:1px}
.dbody{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.dbody h3{font-size:18px;line-height:1.15}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.dbody p{margin:0;font-size:14.5px}
.dbody .eg{color:var(--ink2)}
.dbody .eg b{color:var(--ink)}
.dyk{align-self:flex-start;margin-top:auto;border:1.5px dashed #c98216;background:#fff6e2;color:#6b4000;border-radius:9px;padding:5px 10px;font-weight:700;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.dyk[aria-expanded="true"]{border-style:solid;background:#ffe9bd}
.dyk svg{width:16px;height:16px}
.fact{background:#fff3d6;border-left:4px solid var(--amber2);padding:8px 10px;border-radius:0 8px 8px 0;font-size:14px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;margin:2px 0}
.specs dt{font-weight:700;color:var(--ink2)}
.specs dd{margin:0}
.meters{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.meter{display:flex;align-items:center;gap:4px}
.meter i{display:inline-flex;gap:2px}
.meter i b{width:9px;height:9px;border-radius:2px;background:#d7cdb9}
.meter i b.on{background:var(--amber2)}

/* SORT */
.playhud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hudbox{background:#0a1826;border:1px solid #2b4a66;border-radius:10px;padding:5px 10px;font-family:var(--mono);font-size:13px;color:var(--hi)}
.hudbox b{color:var(--amber)}
.beltzone{padding:12px;margin-bottom:12px}
.belt{position:relative;height:178px;border-radius:12px;background:#1a1f24;overflow:hidden;border:2px solid #0d1013;box-shadow:inset 0 6px 14px rgba(0,0,0,.5)}
.belt .surface{position:absolute;left:18px;right:18px;top:132px;height:30px;border-radius:15px;background:repeating-linear-gradient(90deg,#2b3239 0 14px,#20262c 14px 28px);box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
.belt.moving .surface{animation:beltmove 1s linear infinite}
@keyframes beltmove{to{background-position:28px 0}}
.belt .roller{position:absolute;top:130px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d7dde2,#7d868f 60%,#454d55);border:2px solid #111}
.belt .roller.l{left:4px}.belt .roller.r{right:4px}
.belt .edge{position:absolute;right:0;top:0;bottom:0;width:46px;background:repeating-linear-gradient(45deg,#ffb547 0 10px,#1a1f24 10px 20px);opacity:.55}
.belt .timer{position:absolute;left:12px;right:12px;top:8px;height:6px;border-radius:6px;background:#0a0d10}
.belt .timer i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff6b5b,#ffb547);width:100%}
.bcard{position:absolute;top:22px;left:0;width:230px;height:108px;background:var(--paper);color:var(--ink);border-radius:11px;box-shadow:0 8px 16px rgba(0,0,0,.45);display:flex;gap:8px;padding:8px;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2}
.bcard.dragging{cursor:grabbing;box-shadow:0 16px 30px rgba(0,0,0,.55);z-index:20}
.bcard svg{width:78px;height:56px;flex:none;background:#dfe8ef;border-radius:7px}
.bcard .t{font-size:13.5px;line-height:1.25}
.bcard .t b{display:block;font-family:var(--display);font-size:15px;margin-bottom:2px}
.bcard.fly{transition:transform .45s ease-in,opacity .45s;opacity:0}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border:0;border-radius:14px;padding:14px 12px 16px;min-height:96px;color:#fff;text-align:center;position:relative;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);font-family:var(--display)}
.bin b{display:block;font-size:22px;letter-spacing:1px}
.bin span{display:block;font-family:var(--body);font-size:13.5px;opacity:.92}
.bin kbd{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.25);padding:1px 6px;border-radius:5px;margin-top:4px;display:inline-block}
.bin.man{background:linear-gradient(#3d8fd6,#1f5f9e)}
.bin.dir{background:linear-gradient(#f2a43a,#c26f0c)}
.bin.hot{outline:4px solid #fff;outline-offset:-4px}
.fb{margin-top:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fb .ftxt{flex:1;min-width:220px}
.fb h3{font-size:18px}
.fb.good h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p{margin:4px 0 0;font-size:14.5px}

/* JOB + QUIZ */
.qcard{padding:16px 18px;max-width:880px}
.qcard .scn{font-size:18px;font-weight:700;margin:6px 0 12px;line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-weight:700;font-size:15px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:#c98216;background:#fffaf0}
.opt svg{width:64px;height:44px;flex:none;background:#dfe8ef;border-radius:6px}
.opt .ltr{font-family:var(--mono);width:26px;height:26px;border-radius:7px;background:var(--paper2);display:grid;place-items:center;flex:none;font-size:13px}
.opt.right{border-color:var(--ok);background:var(--ok2)}
.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15px}
.explain.good{background:var(--ok2);border-left:4px solid var(--ok)}
.explain.bad{background:var(--bad2);border-left:4px solid var(--bad)}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qtop .spacer{min-width:4px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:3px;background:#d7cdb9}
.dots i.r{background:var(--ok)}.dots i.w{background:var(--bad)}.dots i.c{outline:2px solid var(--amber2)}

/* BUILD */
.buildgrid{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:14px;align-items:start}
.stagewrap{position:relative;border-radius:14px;padding:6px;background:linear-gradient(#56616c,#2c343c);box-shadow:var(--shadow)}
.stagewrap svg#stage{display:block;width:100%;height:auto;aspect-ratio:1000/620;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;background:#24525f}
.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stagebar h3{font-size:17px;color:#fff}
.stagebar .hint{font-size:13.5px;color:var(--hi2)}
.flash{position:absolute;inset:6px;border-radius:10px;pointer-events:none;background:rgba(230,40,40,.0);transition:background .35s}
.flash.on{background:rgba(230,40,40,.38);transition:none}
.shake{animation:shake .32s linear}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bpanel{padding:12px;display:flex;flex-direction:column;gap:10px}
.bpanel h3{font-size:15px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--ink2)}
.brow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.leds{display:inline-flex;gap:5px;align-items:center}
.leds i{width:14px;height:14px;border-radius:50%;background:#c9d0d6;border:2px solid #9aa3ac;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.leds i.on{background:radial-gradient(circle at 35% 35%,#ff9a8a,#e02b2b 60%);border-color:#8d1414;box-shadow:0 0 8px rgba(255,60,60,.7)}
.scorebox{font-family:var(--mono);font-weight:700;font-size:15px}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.titem{display:flex;align-items:center;gap:6px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 6px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.15;min-height:44px}
.titem svg{width:40px;height:28px;flex:none;background:#dfe8ef;border-radius:5px}
.titem .st{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.titem[aria-pressed="true"]{border-color:var(--amber2);background:#fff4dc;box-shadow:0 0 0 2px rgba(242,154,29,.3)}
.titem.done{background:var(--ok2);border-color:#9fd4b6;color:#245c3f}
.titem.locked{opacity:.62;background:#f1ede4}
.notes{background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;min-height:72px}
.notes .chip{white-space:normal;line-height:1.25}
.notes h4{margin:4px 0 3px;font-family:var(--display);font-size:16px}
.notes p{margin:3px 0 0}
.notes .pts{font-family:var(--mono);font-weight:700;color:var(--ok)}
.slotpick{display:flex;flex-direction:column;gap:5px}
.slotpick .sl{display:flex;flex-wrap:wrap;gap:5px}
.slotpick button{border:1.5px solid #8a96a1;background:#eef2f5;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;color:var(--ink)}
.slotpick button:hover{background:#fff4dc;border-color:#c98216}
.toggle{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.toggle input{width:18px;height:18px;margin:1px 0 0;accent-color:#c98216;flex:none}
.finish{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 2px 0 #a8650a,0 0 0 6px rgba(255,181,71,.35)}}
.celebrate{position:absolute;inset:6px;border-radius:10px;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.celebrate .cel{background:rgba(8,20,32,.82);border:2px solid var(--amber);border-radius:16px;padding:14px 22px;text-align:center;box-shadow:0 0 40px rgba(255,181,71,.5);animation:pop .5s ease-out}
.celebrate .cel b{display:block;font-family:var(--display);font-size:38px;color:var(--amber);letter-spacing:3px;text-shadow:0 0 18px rgba(255,181,71,.8)}
.celebrate .cel span{color:#fff;font-size:15px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(560px) rotate(720deg);opacity:.2}}
#stage .c-shadow,#stage .c-edge,#stage .c-hi,#stage .c-chan,#stage .c-guide{fill:none;stroke-linejoin:round;stroke-linecap:round}
#stage .c-shadow{stroke:#000;opacity:.28}
#stage .c-edge{stroke:#7f8a95}
#stage .c-hi{stroke:#dbe2e8}
#stage .c-chan{stroke:#10161b;opacity:.9}
#stage .c-guide{stroke:#ffb547;stroke-width:1.6;stroke-dasharray:6 9;opacity:.45}
#stage #corrG.buzz .c-edge,#stage #corrG.buzz .c-hi{stroke:#ff3b3b}
#stage .c-target{fill:rgba(255,181,71,.22);stroke:#ffb547;stroke-width:3;animation:tpulse 1.1s ease-in-out infinite}

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

 {id:'manual',label:'Manual entry',intro:'<b>Manual data entry</b> means a person enters the data by hand, by typing, pointing, tapping, drawing or speaking into an input device. It is flexible, but it is slower than direct entry, and typing slips (transcription errors) can creep in. Chapter 1 lists all of these as <i>input devices</i>; the touchscreen works as both input and output.'},

 if(id==='learn'){const n=(Store.d.facts||[]).length,t=allCards().length;return `<span>${n} / ${t} facts discovered</span>`}

function renderHome(){const s=$('#scr-home');
 s.innerHTML=`<div class="hero"><div><div class="kicker">CSEC EDPM · Section I · Fundamentals of Computing</div><h1 id="h-home">PC <span>Build</span> Lab</h1><p>Computer types, data entry devices and components · EDPM. Learn the devices, sort them, choose the right computer, then pick up the tweezers and build a PC with a steady hand.</p></div><div class="heroart" aria-hidden="true">${heroArt()}</div></div>
 <h2 class="sr">Choose a mode</h2><div class="modes">${MODES.map(m=>`<button class="mode${m.feature?' feature':''}" style="--mc:${m.c}" data-go="${m.id}"><span class="micon">${svgArt(m.art)}</span><span><span class="num">MODE ${m.n}</span><h3>${m.t}</h3><p>${m.p}</p><span class="best">${bestLine(m.id)}</span></span></button>`).join('')}</div>`;
 $$('[data-go]',s).forEach(b=>b.addEventListener('click',()=>{Snd.click();show(b.dataset.go)}))}
function heroArt(){return `<svg viewBox="0 0 320 190"><rect width="320" height="190" fill="url(#pMat)"/><svg x="40" y="18" width="230" height="158" viewBox="0 0 160 110">${ART.motherboard()}</svg><g transform="translate(150 70)"><svg x="-30" y="-22" width="44" height="32" viewBox="0 0 160 110">${ART.cpu()}</svg>${tweezers()}</g><path d="M106 76 q20 -40 46 -12" stroke="#ffb547" stroke-width="2" stroke-dasharray="5 6" fill="none"/></svg>`}
function tweezers(){return `<g transform="rotate(-48)" class="twz"><path d="M2 -1.6 L104 -10 L104 -4.5 L2 0Z" fill="url(#gMetal)" stroke="#5f6870" stroke-width=".8"/><path d="M2 1.6 L104 10 L104 4.5 L2 0Z" fill="url(#gMetal)" stroke="#5f6870" stroke-width=".8"/><path d="M104 -10 Q118 0 104 10" fill="#c9d0d6" stroke="#5f6870" stroke-width=".8"/><path d="M62 -6 L80 -7.5 M62 6 L80 7.5 M66 -6.3 L66 -4 M72 -6.8 L72 -4.4 M66 6.3 L66 4 M72 6.8 L72 4.4" stroke="#7d868f" stroke-width="1.2"/></g>`}

/* ============ LEARN ============ */
let learnTab='manual';
function allCards(){return Object.values(CARDS).flat()}
function renderLearn(tab){if(tab)learnTab=tab;const s=$('#scr-learn');const facts=new Set(Store.d.facts||[]);const total=allCards().length;
 const T=TABS.find(t=>t.id===learnTab);
 s.innerHTML=`<div class="shead"><div><div class="kicker">Mode 01 · Gallery</div><h2 id="h-learn">Learn the devices</h2></div></div>
 <div class="progressline"><span>Facts discovered: <b id="factN">${facts.size}</b> / ${total}</span><span class="pbar"><i style="width:${facts.size/total*100}%"></i></span></div>
 <div class="tabs" role="tablist" aria-label="Device groups">${TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-controls="lpanel" aria-selected="${t.id===learnTab}" tabindex="${t.id===learnTab?0:-1}" data-tab="${t.id}">${t.label}<span class="cnt">${CARDS[t.id].length}</span></button>`).join('')}</div>
 <div id="lpanel" role="tabpanel" aria-labelledby="tab-${learnTab}"><div class="intro sheet"><p>${T.intro}</p></div><div class="grid">${CARDS[learnTab].map(c=>cardHTML(c,facts.has(c.id))).join('')}</div></div>`;
 const tabs=$$('[data-tab]',s);tabs.forEach((b,i)=>{b.addEventListener('click',()=>{Snd.click();renderLearn(b.dataset.tab);$('#tab-'+b.dataset.tab).focus()});b.addEventListener('keydown',e=>{let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;if(j!=null){e.preventDefault();renderLearn(tabs[j].dataset.tab);$('#tab-'+tabs[j].dataset.tab).focus()}})});
 $$('.dyk',s).forEach(b=>b.addEventListener('click',()=>{const f=$('#fact-'+b.dataset.id);const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));f.hidden=!open;if(open){Snd.tick();const set=new Set(Store.d.facts||[]);if(!set.has(b.dataset.id)){set.add(b.dataset.id);Store.d.facts=[...set];Store.save();const n=set.size;$('#factN').textContent=n;$('.pbar i',s).style.width=(n/total*100)+'%';const st=n>=total?3:n>=total*2/3?2:n>=total/3?1:0;Store.best('learn',n,st);if(n===total)announce('Brilliant! You have discovered every fact in the gallery.')}}}))}
function meter(label,n){let s=`<span class="meter">${label}<i aria-label="${n} out of 5">`;for(let i=0;i<5;i++)s+=`<b class="${i<n?'on':''}"></b>`;return s+'</i></span>'}
function cardHTML(c,seen){const tags=(c.tags||[]).map(t=>`<span class="chip ${CH[t][1]}">${CH[t][0]}</span>`).join('');
 const body=c.uses?`<div class="tags"><span class="chip k-core">${c.cat}</span></div><dl class="specs"><dt>Uses</dt><dd>${c.uses}</dd><dt>Size</dt><dd>${c.size}</dd><dt>Speed</dt><dd>${c.speed}</dd><dt>Cost</dt><dd>${c.cost}</dd></dl><div class="meters">${meter('Size',c.m[0])}${meter('Speed',c.m[1])}${meter('Cost',c.m[2])}</div><p class="eg"><b>Caribbean workplace:</b> ${c.eg}</p>`
 :`<div class="tags">${tags}</div><p>${c.what}</p><p class="eg"><b>Example:</b> ${c.eg}</p>`;
 return `<article class="dcard sheet"><div class="art"><span class="corner">FIG. ${c.id.toUpperCase().slice(0,8)}</span>${svgArt(c.art,'Drawing of '+c.name.replace(/\(.*\)/,''))}</div><div class="dbody"><h3>${c.name}</h3>${body}<button class="dyk" data-id="${c.id}" aria-expanded="false" aria-controls="fact-${c.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1.3 1.6 1.4 2.5h5.2c.1-.9.6-1.7 1.4-2.5A6 6 0 0 0 12 3z"/></svg>Did you know?${seen?' <span aria-label="already discovered">✓</span>':''}</button><p class="fact" id="fact-${c.id}" hidden>${c.fact}</p></div></article>`}

/* ============ MANUAL OR DIRECT (conveyor) ============ */
const S={deck:[],i:0,score:0,right:0,pos:0,dur:9000,run:false,raf:0,last:0,drag:null,res:[],streak:0};
function renderSortIntro(){const s=$('#scr-sort');stopSort();
 s.innerHTML=`<div class="shead"><div><div class="kicker">Mode 02 · Conveyor sort</div><h2 id="h-sort">Manual or Direct?</h2><p class="lede">Each card describes how data is entered. Drag it into the right bin, tap a bin, or press <kbd>←</kbd>/<kbd>M</kbd> for Manual and <kbd>→</kbd>/<kbd>D</kbd> for Direct, before it reaches the end of the belt. The belt speeds up!</p></div><div class="spacer"></div><div class="playhud" id="sortHud"></div></div>
 <div class="beltzone sheet"><div class="belt" id="belt"><div class="timer"><i id="sortTimer"></i></div><div class="surface"></div><div class="roller l"></div><div class="roller r"></div><div class="edge"></div><div class="bcard" id="bcard" role="group" aria-roledescription="draggable card" hidden></div><div id="beltStart" style="position:absolute;inset:0;display:grid;place-items:center"><button class="btn" id="sortGo">Start the belt</button></div></div></div>
 <div class="bins"><button class="bin man" data-bin="manual" aria-label="Manual data entry bin"><b>MANUAL</b><span>A person enters the data by hand</span><kbd>← or M</kbd></button><button class="bin dir" data-bin="direct" aria-label="Direct data entry bin"><b>DIRECT</b><span>Captured straight from the source</span><kbd>→ or D</kbd></button></div>
 <div class="fb sheet" id="sortFb" hidden aria-live="polite"></div>`;
 sortHud();$('#sortGo').addEventListener('click',sortStart);
 $$('.bin',s).forEach(b=>b.addEventListener('click',()=>{if(S.run)sortAnswer(b.dataset.bin)}));
 const card=$('#bcard');card.addEventListener('pointerdown',sortDown);card.addEventListener('pointermove',sortMove);card.addEventListener('pointerup',sortUp);card.addEventListener('pointercancel',sortUp)}
function sortHud(){const h=$('#sortHud');if(h)h.innerHTML=`<span class="hudbox">Card <b>${Math.min(S.i+1,S.deck.length||16)}</b>/${S.deck.length||16}</span><span class="hudbox">Score <b>${S.score}</b></span><span class="hudbox">Streak <b>${S.streak}</b></span>`}
function sortStart(){Snd.click();const m=shuffle(SORT.filter(c=>c.ans==='manual')).slice(0,8),d=shuffle(SORT.filter(c=>c.ans==='direct')).slice(0,8);S.deck=shuffle(m.concat(d));S.i=0;S.score=0;S.right=0;S.res=[];S.streak=0;$('#beltStart').hidden=true;sortNext()}
function sortNext(){$('#sortFb').hidden=true;if(S.i>=S.deck.length)return sortEnd();const c=S.deck[S.i];S.dur=Math.max(5200,9600-S.i*290);S.pos=0;const el=$('#bcard');el.hidden=false;el.className='bcard';el.style.transform='';el.innerHTML=`${svgArt(c.art)}<div class="t"><b>${c.name}</b>${c.scene}</div>`;el.setAttribute('aria-label',c.name+'. '+c.scene);sortHud();sortLayout();$('#belt').classList.toggle('moving',!reduced());S.run=true;S.last=performance.now();cancelAnimationFrame(S.raf);S.raf=requestAnimationFrame(sortTick);announce('Card '+(S.i+1)+': '+c.scene+' Manual or direct?');
 const b=$('.bin.man');if(document.activeElement&&document.activeElement.classList.contains('btn'))b.focus()}
function sortTick(t){if(!S.run)return;const dt=Math.min(100,t-S.last);S.last=t;S.pos+=dt/S.dur;sortLayout();if(S.pos>=1){S.pos=1;sortAnswer(null);return}S.raf=requestAnimationFrame(sortTick)}
function sortLayout(){const belt=$('#belt'),el=$('#bcard');if(!belt||!el)return;const W=belt.clientWidth,cw=el.offsetWidth;$('#sortTimer').style.width=((1-S.pos)*100)+'%';if(S.drag)return;const x=reduced()?(W-cw)/2:12+S.pos*(W-cw-24);el.style.left=x+'px'}
function sortDown(e){if(!S.run)return;const el=$('#bcard');S.drag={x:e.clientX,y:e.clientY,id:e.pointerId};el.setPointerCapture(e.pointerId);el.classList.add('dragging');e.preventDefault()}
function sortMove(e){if(!S.drag||e.pointerId!==S.drag.id)return;const el=$('#bcard');el.style.transform=`translate(${e.clientX-S.drag.x}px,${e.clientY-S.drag.y}px) rotate(${Math.max(-8,Math.min(8,(e.clientX-S.drag.x)/20))}deg)`;$$('.bin').forEach(b=>{const r=b.getBoundingClientRect();b.classList.toggle('hot',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)})}
function sortUp(e){if(!S.drag)return;const el=$('#bcard');S.drag=null;el.classList.remove('dragging');let hit=null;$$('.bin').forEach(b=>{const r=b.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)hit=b.dataset.bin;b.classList.remove('hot')});if(hit&&S.run)sortAnswer(hit);else{el.style.transform='';sortLayout()}}
function sortAnswer(choice){S.run=false;cancelAnimationFrame(S.raf);$('#belt').classList.remove('moving');const c=S.deck[S.i];const ok=choice===c.ans;let pts=0;
 if(ok){pts=100+Math.round((1-S.pos)*50)+Math.min(S.streak,5)*10;S.streak++;S.right++;Snd.good()}else{S.streak=0;choice?Snd.bad():Snd.buzz()}
 S.score+=pts;S.res.push({c,ok,choice});const el=$('#bcard');const bin=$(`.bin[data-bin="${c.ans}"]`);
 if(!reduced()&&choice){const r=el.getBoundingClientRect(),br=$(`.bin[data-bin="${choice}"]`).getBoundingClientRect();el.classList.add('fly');el.style.transform=`translate(${br.left+br.width/2-r.left-r.width/2}px,${br.top-r.top}px) scale(.4)`}else if(!choice&&!reduced()){el.classList.add('fly');el.style.transform='translate(60px,120px) rotate(30deg)'}else el.hidden=true;
 const lbl=c.ans==='manual'?'Manual data entry':'Direct data entry';const fb=$('#sortFb');fb.className='fb sheet '+(ok?'good':'bad');fb.hidden=false;
 fb.innerHTML=`<div class="ftxt"><h3>${ok?'Correct: '+lbl:choice?'Not quite. This is '+lbl:'Too slow! It fell off the belt. This is '+lbl}</h3><p>${c.why}</p>${ok?`<p class="pts" style="font-family:var(--mono);font-weight:700;color:var(--ok)">+${pts} pts</p>`:''}</div><button class="btn" id="sortNextBtn">${S.i+1>=S.deck.length?'See results':'Next card'}</button>`;
 sortHud();$('#sortNextBtn').addEventListener('click',()=>{Snd.click();S.i++;sortNext()});$('#sortNextBtn').focus({preventScroll:false})}
function sortEnd(){$('#bcard').hidden=true;const n=S.deck.length,st=starsFor(S.right/n);const isNew=Store.best('sort',S.score,st);const miss=S.res.filter(r=>!r.ok);
 openModal({kicker:'Conveyor complete',title:`${S.right} of ${n} sorted correctly`,stars:st,score:S.score,isNew,body:miss.length?`<ul class="rev">${miss.map(r=>`<li><b>${r.c.name}</b> is ${r.c.ans==='manual'?'manual':'direct'} entry.</li>`).join('')}</ul>`:'<p>A perfect sort!</p>',actions:[{label:'Play again',primary:true,fn:()=>{renderSortIntro();sortStart()}},{label:'Lab menu',fn:()=>show('home')}]});$('#beltStart').hidden=false}
function stopSort(){S.run=false;cancelAnimationFrame(S.raf)}
leaveHooks.sort=stopSort;
document.addEventListener('keydown',e=>{if(current!=='sort'||!S.run||!$('#modal').hidden)return;const k=e.key.toLowerCase();if(k==='arrowleft'||k==='m'){e.preventDefault();sortAnswer('manual')}else if(k==='arrowright'||k==='d'){e.preventDefault();sortAnswer('direct')}});
window.addEventListener('resize',()=>{if(current==='sort')sortLayout()});

/* ============ WHICH COMPUTER FOR THE JOB ============ */
const J={deck:[],i:0,score:0,right:0,marks:[]};
function renderJobIntro(){J.deck=shuffle(JOBS.slice()).slice(0,10);J.i=0;J.score=0;J.right=0;J.marks=[];renderJob()}
function renderJob(){const s=$('#scr-job');const q=J.deck[J.i];const opts=shuffle([q.a].concat(q.d));
 s.innerHTML=`<div class="shead"><div><div class="kicker">Mode 03 · Scenario cards</div><h2 id="h-job">Which computer for the job?</h2></div><div class="spacer"></div><div class="playhud"><span class="hudbox">Job <b>${J.i+1}</b>/${J.deck.length}</span><span class="hudbox">Score <b>${J.score}</b></span></div></div>
 <div class="qcard sheet"><div class="qtop"><span class="chip k-core">Scenario ${J.i+1}</span><span class="spacer" style="flex:1"></span><span class="dots" aria-hidden="true">${J.deck.map((x,i)=>`<i class="${J.marks[i]===true?'r':J.marks[i]===false?'w':''} ${i===J.i?'c':''}"></i>`).join('')}</span></div><p class="scn">${q.s}</p><div class="opts" role="group" aria-label="Choose a type of computer">${opts.map((o,i)=>`<button class="opt" data-o="${o}"><span class="ltr">${'ABCD'[i]}</span>${svgArt(TYPE_ART[o])}<span>${TYPE_NAMES[o]}</span></button>`).join('')}</div><div id="jobEx"></div></div>`;
 $$('.opt',s).forEach(b=>b.addEventListener('click',()=>jobAnswer(b.dataset.o)))}
function jobAnswer(o){const q=J.deck[J.i];const ok=o===q.a;J.marks[J.i]=ok;if(ok){J.right++;J.score+=100;Snd.good()}else Snd.bad();
 $$('#scr-job .opt').forEach(b=>{b.disabled=true;if(b.dataset.o===q.a)b.classList.add('right');else if(b.dataset.o===o)b.classList.add('wrong')});
 const last=J.i+1>=J.deck.length;$('#jobEx').innerHTML=`<div class="explain ${ok?'good':'bad'}"><b>${ok?'Right job, right computer!':'Not the best fit. The answer is: '+TYPE_NAMES[q.a]+'.'}</b> ${q.why}</div><div style="margin-top:10px"><button class="btn" id="jobNext">${last?'See results':'Next job'}</button></div>`;
 announce((ok?'Correct. ':'Incorrect. ')+q.why);$('#jobNext').focus();$('#jobNext').addEventListener('click',()=>{Snd.click();if(last)jobEnd();else{J.i++;renderJob()}})}
function jobEnd(){const st=starsFor(J.right/J.deck.length);const isNew=Store.best('job',J.score,st);openModal({kicker:'All jobs assigned',title:`${J.right} of ${J.deck.length} correct`,stars:st,score:J.score,isNew,actions:[{label:'Play again',primary:true,fn:renderJobIntro},{label:'Lab menu',fn:()=>show('home')}]})}

/* ============ FINAL QUIZ ============ */
const Q={deck:[],i:0,score:0,right:0,marks:[]};
function renderQuizIntro(){Q.deck=QUIZ.slice(0,15).concat(QUIZ.slice(15)).map(q=>({...q,opts:shuffle([q.a].concat(q.d))}));shuffle(Q.deck);Q.i=0;Q.score=0;Q.right=0;Q.marks=[];renderQuiz()}
function renderQuiz(){const s=$('#scr-quiz');const q=Q.deck[Q.i];
 s.innerHTML=`<div class="shead"><div><div class="kicker">Mode 06 · Final check</div><h2 id="h-quiz">Final quiz</h2></div><div class="spacer"></div><div class="playhud"><span class="hudbox">Question <b>${Q.i+1}</b>/${Q.deck.length}</span><span class="hudbox">Score <b>${Q.score}</b></span></div></div>
 <div class="qcard sheet"><div class="qtop"><span class="chip ${q.q.startsWith('Museum')?'k-sup':'k-proc'}">${q.q.startsWith('Museum')?'Tech Museum':'Mixed'}</span><span class="spacer" style="flex:1"></span><span class="dots" aria-hidden="true">${Q.deck.map((x,i)=>`<i class="${Q.marks[i]===true?'r':Q.marks[i]===false?'w':''} ${i===Q.i?'c':''}"></i>`).join('')}</span></div><p class="scn">${q.q.replace(/^Museum: /,'')}</p><div class="opts" role="group" aria-label="Answers">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div><div id="quizEx"></div></div>`;

<script>
"use strict";

function dSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;const x=ax+t*dx-px,y=ay+t*dy-py;return Math.sqrt(x*x+y*y)}
function dPath(x,y,p){let m=1e9;for(let i=0;i<p.length-1;i++){const d=dSeg(x,y,p[i][0],p[i][1],p[i+1][0],p[i+1][1]);if(d<m)m=d}return m}

function buildHelp(){openModal({kicker:'How to play',title:'Steady hands!',body:`<ol class="rev" style="color:var(--ink)"><li>Choose a part from the <b>Parts tray</b>. A metal channel appears from the PICK-UP pad to its slot.</li><li>Press on the <b>tweezers tip</b> and drag it along the channel to the glowing slot.</li><li>Touch a metal edge and you get a <b>buzz and a strike</b>. Three strikes stop the build.</li><li>Order matters: the motherboard goes in before the CPU and RAM, the CPU before its cooler, and mains power is plugged in last.</li><li>Prefer not to drag? Turn on <b>Click-to-place mode</b>, or use the keyboard: Tab to a part, press Enter, then choose its slot.</li></ol>`,actions:[{label:'Got it',primary:true}]})}
function startStage(i,silent){B.stage=i;B.placed=new Set();for(let j=0;j<i;j++)STAGES[j].parts.forEach(p=>B.placed.add(p));B.strikes=0;B.score=0;B.active=null;B.drag=null;B.busy=false;B.closed=false;B.powered=false;B.done=false;B.trail=[];

function availableSlots(){if(stage().scene==='rear')return Object.keys(REAR_SLOTS).filter(k=>!(k==='hdmiGpu'&&B.placed.has('monitor'))&&!(k==='audioGreen'&&B.placed.has('speakers'))&&!(k==='power'&&B.placed.has('power'))).map(k=>({key:k,name:REAR_SLOTS[k].name,r:REAR_SLOTS[k].r}));

function renderSlotPicker(){const sp=$('#slotpick');const show=!!B.active&&(B.assist||B.kbd)&&!B.done;sp.hidden=!show;if(!show)return;$('.sl',sp).innerHTML=availableSlots().map(s=>`<button data-slot="${s.key}">${s.name}</button>`).join('');$$('.sl button',sp).forEach(b=>b.addEventListener('click',()=>chooseSlot(b.dataset.slot)))}

  function avHTML(a, cls) { a = a || '🦁'; return '<div class="av ' + (cls || '') + '">' + (/^(https?:|data:image)/.test(a) ? '<img alt="" src="' + esc(a) + '">' : esc(a)) + '</div>'; }
  var rq = 0; function renderSoon() { if (rq) return; rq = setTimeout(function () { rq = 0; render(); }, 120); }

  var draft = null;
  function viewSetup() {
    var d = draft || (draft = Object.assign({ name: '', cls: '', avatar: '🦁', flag: '🇸🇽', plan: [CFG.gameSubject] }, ls('ea_arena_profile') || {}));
    return '<div class="card"><h3>Set up your arena card</h3>' +
      '<div class="f"><label>Name or alias</label><input id="f-name" maxlength="20" value="' + esc(d.name) + '" placeholder="e.g. Kai_IT"></div>' +
      '<div class="f"><label>Class</label><input id="f-cls" maxlength="10" value="' + esc(d.cls) + '" placeholder="e.g. L6, 5A"></div>' +
      '<div class="f"><label>Avatar</label><div class="grid">' + AVATARS.map(function (a) { return '<button data-av="' + a + '" class="' + (a === d.avatar ? 'on' : '') + '">' + a + '</button>'; }).join('') + '</div></div>' +
      '<div class="f"><label>Flag</label><select id="f-flag">' + FLAGS.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === d.flag ? ' selected' : '') + '>' + f[0] + '  ' + esc(f[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label>Subjects in your plan</label><div class="subs">' + SUBJ_ORDER.map(function (k) { return '<label><input type="checkbox" data-sub="' + k + '"' + (d.plan.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(subjName(k)) + '</label>'; }).join('') + '</div></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn big" data-act="save">Enter the arena</button></div>';
  }
  function viewList() {
    var me = S.me, out = '';
    out += '<div class="me">' + avHTML(me.avatar) + '<div class="grow"><div class="nm">' + esc(me.name) + ' ' + esc(me.flag) + '</div><div class="sub">' + esc(me.cls || 'No class') + ' · ' + me.plan.length + ' subject' + (me.plan.length === 1 ? '' : 's') + '</div></div>' + (me.locked ? '' : '<button class="btn2" data-act="edit">Edit</button>') + '</div>';
    out += '<label>Challenge subject</label><select id="subj">' + me.plan.map(function (k) { return '<option value="' + k + '"' + (k === S.subject ? ' selected' : '') + '>' + esc(subjName(k)) + '</option>'; }).join('') + '</select>';
    var live = S.conn === 'live' || S.conn === 'local';
    var ids = Object.keys(S.players).filter(function (k) { return S.filter === 'all' || (S.players[k].user.cls || '').toLowerCase() === (me.cls || '').toLowerCase(); });
    ids.sort(function (a, b) { var A = S.players[a], B = S.players[b]; return (A.status === 'match') - (B.status === 'match') || A.user.name.localeCompare(B.user.name); });
    out += '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Everyone</button><button class="chip ' + (S.filter === 'class' ? 'on' : '') + '" data-filter="class">My class</button></div>';
    out += '<div class="status"><i class="' + (live ? '' : 'off') + '"></i>' + (live ? ids.length + ' in the arena now · updates every few seconds' : S.conn === 'error' ? 'Can\'t reach the arena. Retrying…' : 'Connecting…') + '</div>';
    if (S.host) out += viewLobby();
    if (S.pendingJoin) out += '<div class="card"><h3>Joining ' + esc(S.pendingJoin.name) + '\'s match…</h3><div class="sub">Hang tight.</div></div>';
    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each · 15 minutes max.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();
