<!doctype html>
<html lang="en" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabulation Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Lilita+One&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one-screen game shell. Top bar + centred stage; each world recolours the page through --bg1/--bg2/--acc/--acc2.
   Single deliberate look (dark game worlds, light "paper" cards and an Excel-like grid), so no light/dark switch. */
:root{
  --bg1:#0c2233; --bg2:#14404f; --acc:#ffcf3f; --acc2:#5fe1d0;
  --ink:#16212b; --ink2:#4a5866; --paper:#fffaf0; --paper2:#f3ecd9; --rule:#e2d6b8;
  --good:#1f9d55; --bad:#d64545; --warn:#e8a317;
  --text:#f6f8fb; --muted:#c3cfda; --glass:rgba(8,14,22,.42); --glass2:rgba(255,255,255,.08);
  --xl:#217346; --xlsel:#dcefe2; --gridline:#d6dce2; --head:#eef1f4; --headInk:#45525f;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg1);background-image:radial-gradient(120% 80% at 80% 0%,var(--bg2) 0%,transparent 60%),linear-gradient(170deg,var(--bg1),var(--bg2));
  background-attachment:fixed;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;transition:background .6s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--glass);backdrop-filter:blur(6px);border-bottom:1px solid var(--glass2)}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:var(--text);padding:0}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--acc);color:var(--ink);font-style:normal;font-size:15px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--glass2);border:1px solid rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.chip svg{width:16px;height:16px}
main{flex:1;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.3px;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--ink);border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.big{font-size:20px;padding:14px 28px;font-family:var(--display);font-weight:400;letter-spacing:.5px}
.btn.alt{background:var(--acc2)}
.ghost{background:transparent;color:var(--text);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 14px;font-weight:600}
.ghost.sm{padding:5px 10px;font-size:14px}
.ghost.dark{color:var(--ink);border-color:var(--ink2)}
.paper{background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--acc)}
.paper .eyebrow{color:var(--ink2)}
.muted{color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.18);border-radius:4px;padding:1px 5px;margin-left:6px}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}

/* Title */
.title{display:grid;gap:22px;justify-items:center;text-align:center;padding-top:10px}
.logo{display:grid;grid-template-columns:30px repeat(10,minmax(0,46px));background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35);max-width:100%}
.logo span{border-right:1px solid var(--gridline);border-bottom:1px solid var(--gridline);display:grid;place-items:center;color:var(--headInk);font:600 11px/1 Arial,sans-serif;height:22px;background:var(--head)}
.logo b{display:grid;place-items:center;aspect-ratio:1;font-family:var(--display);font-weight:400;font-size:clamp(20px,5.5vw,34px);color:var(--xl);border-right:1px solid var(--gridline);border-bottom:1px solid var(--gridline)}
.logo b.on{background:var(--xlsel);outline:2.5px solid var(--xl);outline-offset:-2.5px}
.logo .rh{height:auto}
.subtitle{font-family:var(--display);font-size:clamp(22px,4vw,30px);color:var(--acc)}
.setup{width:min(520px,100%);padding:20px;display:grid;gap:14px;text-align:left}
.setup label{font-weight:800;font-size:14px;display:block;margin-bottom:4px}
.field{width:100%;border:2px solid var(--rule);border-radius:10px;padding:10px 12px;font:600 16px var(--body);color:var(--ink);background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:2px solid var(--rule);background:#fff;color:var(--ink);border-radius:10px;padding:8px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg small{display:block;font-weight:600;font-size:11px;opacity:.75}
.credit{font-size:13px;color:var(--muted)}

/* Map */
.maphead{display:flex;flex-wrap:wrap;align-items:end;gap:12px;justify-content:space-between;margin-bottom:16px}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.wcard{position:relative;text-align:left;border:0;border-radius:18px;padding:16px;min-height:170px;color:#fff;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .15s}
.wcard:hover:not([disabled]){transform:translateY(-3px)}
.wcard .num{position:absolute;right:12px;top:6px;font-family:var(--display);font-size:54px;opacity:.18;line-height:1}
.wcard svg.ico{width:40px;height:40px}
.wcard h3{font-size:22px}
.wcard p{font-size:14px;opacity:.9}
.wcard .stars{margin-top:auto}
.wcard[disabled]{cursor:not-allowed;filter:grayscale(.75) brightness(.7)}
.lock{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;background:rgba(0,0,0,.25);font-size:14px;letter-spacing:.05em}

/* World */
.whead{display:grid;gap:8px;margin-bottom:18px}
.whead h1{font-size:clamp(30px,6vw,46px)}
.story{max-width:65ch;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.lvl{padding:16px;display:grid;gap:8px;align-content:start}
.lvl .tag{justify-self:start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--paper2);border-radius:999px;padding:2px 10px;color:var(--ink2)}
.lvl h3{font-size:22px}
.lvl .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.lvl.locked{opacity:.55}
.bar-actions{display:flex;flex-wrap:wrap;gap:10px}

/* Concept cards */
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{padding:14px 16px;display:grid;gap:6px;align-content:start;border-top:5px solid var(--acc)}
.ccard h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.ccard p{font-size:15px}
.ccard .ex{font-family:var(--mono);font-size:12.5px;background:var(--paper2);border-radius:8px;padding:6px 8px;color:var(--ink)}
.ccard svg{max-width:100%;height:auto}
.brief{padding:20px;display:grid;gap:14px}
.brief .scen{font-size:17px;max-width:65ch}
.how{background:var(--paper2);border-radius:12px;padding:10px 14px;font-size:15px}
.tip{display:flex;gap:10px;align-items:flex-start;background:#173042;color:#eaf6ff;border-radius:12px;padding:10px 14px;font-size:15px}
.tip b{color:var(--acc)}

/* HUD */
.stage{display:grid;gap:12px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--glass);border:1px solid var(--glass2);border-radius:14px;padding:8px 12px}
.hud-t{display:grid;line-height:1.15;min-width:0;flex:1}
.hud-t small{color:var(--muted);font-size:12px}
.hud-t strong{font-family:var(--display);font-weight:400;font-size:19px}
.hud-r{display:flex;align-items:center;gap:14px}
.hud-s{display:grid;text-align:right;line-height:1.1}
.hud-s small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.hud-s b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;color:var(--acc)}
.combo{font-weight:800;color:var(--acc2);min-width:6ch;text-align:right}
.combo.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}
.hearts{display:flex;gap:3px}
.hearts svg{width:22px;height:22px}
.hud2{display:flex;align-items:center;gap:12px}
.prog{font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted)}
.tbar{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--acc2);transform-origin:left;border-radius:99px}
.tbar.low i{background:var(--bad)}
.stage.hurt{animation:hurt .35s}
@keyframes hurt{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fb{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .4s,transform .4s}
.fb.ok{background:#e7f7ec;color:#0f4d29;border-left:6px solid var(--good)}
.fb.no{background:#fdeceb;color:#6b1717;border-left:6px solid var(--bad)}
.fb.out{opacity:0;transform:translate(-50%,10px)}

/* Blaster */
.qbox{padding:12px 16px;display:grid;gap:2px}
.qnum{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.qtext{font-size:clamp(17px,2.4vw,21px);font-weight:700}
.arena{position:relative;height:clamp(340px,52vh,520px);border-radius:18px;overflow:hidden;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.12);cursor:crosshair;touch-action:manipulation}
.zone{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--acc);transform:translate(-50%,-50%) scale(1);opacity:.45;pointer-events:none;box-shadow:0 0 0 2000px rgba(214,69,69,.0);transition:box-shadow .3s}
.arena.closing .zone{box-shadow:0 0 0 2000px rgba(214,69,69,.14)}
.tg{position:absolute;left:0;top:0;max-width:min(230px,44%);padding:10px 14px;border:0;font-weight:700;font-size:15px;line-height:1.2;color:var(--ink);background:var(--paper);border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);text-align:left;will-change:transform}
.tg kbd{margin:0 6px 0 0;background:var(--ink);color:var(--paper)}
.t-reef .tg{border-radius:999px;background:radial-gradient(circle at 30% 25%,#fff,#d9fbff 60%,#a6ecf5);padding:14px 18px}
.t-volcano .tg{border-radius:40% 30% 45% 25%/35% 45% 30% 40%;background:linear-gradient(#ffe2b8,#ffc078)}
.t-space .tg{border-radius:38% 52% 44% 48%/50% 40% 54% 42%;background:linear-gradient(135deg,#e7e1ff,#b9aef0)}
.t-cloud .tg{background:#fff7e0;border-radius:18px 18px 18px 4px}
.t-market .tg{background:linear-gradient(#fff0f6,#ffd6e7);border-radius:16px}
.tg.miss{background:#5c6670;color:#d0d6dc;text-decoration:line-through;opacity:.65}
.tg.hit{animation:pop .45s forwards}
.tg.reveal{outline:4px solid var(--good)}
@keyframes pop{40%{transform:var(--tf) scale(1.25)}100%{transform:var(--tf) scale(0);opacity:0}}
.shot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--acc);pointer-events:none;animation:shot .4s forwards}
@keyframes shot{to{transform:scale(1.8);opacity:0}}
.burst{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc);pointer-events:none}

/* True/False dash */
.track{position:relative;height:190px;border-radius:18px;overflow:hidden;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.12)}
.gate{position:absolute;left:0;top:0;bottom:0;width:64px;background:repeating-linear-gradient(45deg,var(--acc) 0 12px,var(--ink) 12px 24px);opacity:.85;display:grid;place-items:center}
.gate span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);color:#fff;text-shadow:0 2px 4px #000;letter-spacing:.2em}
.tcard{position:absolute;left:0;top:22px;width:min(440px,calc(100% - 96px));background:var(--paper);color:var(--ink);border-radius:16px;padding:16px 18px;font-size:clamp(16px,2.3vw,19px);font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tcard.fly{transition:transform .5s ease-in,opacity .5s;opacity:0}
.tcard.crash{background:#ffd9d6}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfb{border:0;border-radius:16px;padding:18px;font-family:var(--display);font-size:26px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.tfb.t{background:var(--good)}
.tfb.f{background:var(--bad)}
.tfb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}

/* Buckets */
.bkt-item{padding:22px;text-align:center;font-size:clamp(18px,2.6vw,22px);font-weight:800;min-height:120px;display:grid;place-items:center;gap:10px;animation:drop .35s}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.bkt-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bkt{border:3px dashed rgba(255,255,255,.55);background:var(--glass);color:var(--text);border-radius:18px;padding:22px 12px;font-family:var(--display);font-size:22px}
.bkt:hover{border-color:var(--acc)}

/* Match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mbtn{border:2px solid transparent;background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font-size:15px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mbtn.term{font-family:var(--display);font-weight:400;font-size:18px}
.mbtn.on{border-color:var(--acc);background:#fff6d6}
.mbtn.done{background:#d8f3e0;color:#245c37;opacity:.6;box-shadow:none}
.mbtn.wrong{animation:hurt .35s;background:#ffd9d6}

/* Sheet */
.task{padding:12px 16px;display:grid;gap:8px}
.tlabel{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tprompt{font-size:clamp(16px,2.2vw,19px);font-weight:700;max-width:70ch}
.ansrow{display:flex;gap:8px;flex-wrap:wrap}
.ans{flex:1;min-width:160px;border:2px solid var(--rule);border-radius:10px;padding:9px 12px;font:700 16px var(--mono);color:var(--ink);background:#fff;text-transform:uppercase}
.sheethost{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);color:#111}
.fxrow{display:flex;align-items:center;gap:6px;padding:6px;background:#f7f8f9;border-bottom:1px solid var(--gridline)}
.namebox{width:86px;flex:none;border:1px solid #b9c2cb;border-radius:4px;padding:5px 6px;font:600 13px var(--mono);color:#111;background:#fff;text-transform:uppercase}
.fxl{font:italic 700 14px Georgia,serif;color:#5d6873;padding:0 4px}
.fxbar{flex:1;min-width:0;border:1px solid #b9c2cb;border-radius:4px;padding:5px 8px;font:500 14px var(--mono);color:#111;background:#fff}
.fxbar[readonly],.namebox[readonly]{background:#fbfbfc}
.tick{border:0;background:var(--xl);color:#fff;border-radius:4px;width:34px;height:30px;font-weight:800;font-size:16px}
.gridwrap{overflow:auto;max-height:min(62vh,560px);-webkit-user-select:none;user-select:none}
.grid{border-collapse:collapse;table-layout:fixed;font:13px/1.2 Calibri,"Segoe UI",Arial,sans-serif;color:#111}
.grid th{background:var(--head);color:var(--headInk);font-weight:600;font-size:12px;border:1px solid #c8d0d8;height:22px;text-align:center;cursor:pointer}
.grid th.corner{cursor:default}
.grid th.hsel{background:#cde6d5;color:var(--xl);border-bottom-color:var(--xl)}
.grid td{border:1px solid var(--gridline);height:24px;padding:0 5px;white-space:nowrap;overflow:visible;position:relative;cursor:cell;touch-action:none;background:#fff}
.grid td.sel{background:var(--xlsel)}
.grid td.act{outline:2px solid var(--xl);outline-offset:-2px;background:#fff}
.grid td.act::after{content:"";position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--xl);border:1px solid #fff;z-index:2}
.grid td.target{box-shadow:inset 0 0 0 2px var(--warn)}
.grid td.flash{animation:flash 1.1s infinite}
@keyframes flash{50%{background:#ffe58a}}
.grid td.filled{animation:filled 1s}
@keyframes filled{0%{background:#b8f0c8}}
.grid .rot{display:inline-block;transform:rotate(-45deg);transform-origin:center}
.ribbon{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#f3f5f7;border-bottom:1px solid var(--gridline)}
.rb{border:1px solid #c5ced7;background:#fff;color:#1d2833;border-radius:6px;padding:6px 10px;font:600 13px "Segoe UI",Arial,sans-serif;display:inline-flex;gap:6px;align-items:center}
.rb:hover{border-color:var(--xl);background:#eef8f1}
.rb.glow{border-color:var(--warn);box-shadow:0 0 0 3px #ffe08a}
.rb b{font-family:Georgia,serif}
.note{background:repeating-linear-gradient(#fffef7 0 29px,#c9dcef 29px 30px);border-radius:12px;padding:8px 16px 10px;color:#1b2f7a;font-family:var(--hand);font-size:24px;line-height:30px;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:rotate(-.4deg)}
.note small{display:block;font-family:var(--body);font-size:12px;color:var(--ink2);line-height:1.4;letter-spacing:.08em;text-transform:uppercase;font-weight:800}

/* Order */
.order{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.slots{list-style:none;margin:0;padding:12px;display:grid;gap:6px;min-height:120px;counter-reset:s}
.slots li{counter-increment:s;background:#d8f3e0;color:#1d4f2f;border-radius:10px;padding:8px 10px;font-weight:700;display:flex;gap:8px;animation:drop .25s}
.slots li::before{content:counter(s);font-family:var(--display);color:var(--good)}
.slots .empty{background:transparent;border:2px dashed var(--rule);color:var(--ink2);font-weight:600}
.slots .empty::before{content:none}
.pool{display:grid;gap:8px;align-content:start}

/* Results */
.res{padding:24px;display:grid;gap:16px;justify-items:center;text-align:center}
.res h1{font-size:clamp(32px,6vw,48px)}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:58px;height:58px}
.bigstars svg.on{animation:starin .5s backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.stat{background:var(--paper2);border-radius:12px;padding:8px 14px;display:grid;min-width:96px}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:800}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.dyk{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));z-index:15;background:linear-gradient(160deg,#0f7c78,#08343c);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.45);border:2px solid #ffe066;animation:slidein .6s cubic-bezier(.2,.9,.3,1.2) backwards;display:grid;gap:6px}
@keyframes slidein{from{transform:translateX(120%)}}
.dyk .eyebrow{color:#ffe066}
.dyk h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.dyk p{font-size:15px}
.dyk .row{display:flex;gap:8px;justify-content:flex-end}
.dyk button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
.review{width:100%;text-align:left;display:grid;gap:8px}
.review details{background:var(--paper2);border-radius:10px;padding:8px 12px}
.review summary{cursor:pointer;font-weight:700}
.ritem{border-top:1px solid var(--rule);padding:6px 0;font-size:14px}
.ritem .ok{color:var(--good);font-weight:800}
.ritem .no{color:var(--bad);font-weight:800}
.topics{width:100%;display:grid;gap:6px;text-align:left}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.tmeter{height:10px;background:var(--paper2);border-radius:99px;overflow:hidden}
.tmeter i{display:block;height:100%;background:var(--good)}

/* Exam */
.exam{padding:20px;display:grid;gap:14px}
.ehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font:700 18px var(--mono);background:var(--ink);color:var(--paper);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--rule);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:600;display:flex;gap:10px}
.opt b{font-family:var(--display);font-weight:400;color:var(--ink2)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff6d6}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--rule)}
.dots i.d{background:var(--ink2)}
.dots i.c{background:var(--acc);outline:2px solid var(--ink)}
.mini .gridwrap{max-height:none}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:grid;place-items:center;padding:16px}
.modal .paper{width:min(460px,100%);padding:20px;display:grid;gap:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.switch input{width:22px;height:22px}

@media (max-width:620px){
  .match{grid-template-columns:1fr}
  .hud-t strong{font-size:16px}
  .brand span{display:none}
  .tfb{font-size:22px;padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

 const sc=h("b",{},"0"),cb=h("span",{class:"combo"}),hearts=h("span",{class:"hearts","aria-label":"lives"}),pr=h("span",{class:"prog"}),tb=h("div",{class:"tbar"},h("i"));

 const api={st,
  good(base=100){st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);st.score+=Math.round(base*(1+Math.min(st.combo-1,4)*.25)*spd());sc.textContent=st.score;cb.textContent=st.combo>1?"Combo ×"+st.combo:"";cb.classList.remove("bump");void cb.offsetWidth;cb.classList.add("bump");beep("good")},

function gameBlaster(stage,ctx){const qs=shuffle(ctx.level.data).slice(0,10);const hud=Hud(stage,ctx,{total:qs.length,lives:3});
 const qbox=h("div",{class:"paper qbox"});const zone=h("div",{class:"zone"});const arena=h("div",{class:"arena t-"+ctx.world.id},zone);stage.append(qbox,arena);

  qbox.innerHTML="";qbox.append(h("div",{class:"qnum"},`Target ${i+1} of ${qs.length}`),h("div",{class:"qtext"},q.q));
  arena.querySelectorAll(".tg,.shot,.burst").forEach(x=>x.remove());const W=arena.clientWidth,H=arena.clientHeight;
  const order=shuffle(q.opts.map((_,k)=>k));const sp=(42+i*4)*spd()*(RM?.25:1);
  T=order.map((k,n)=>{const el=h("button",{class:"tg"},h("kbd",{},n+1),q.opts[k]);arena.append(el);const bw=el.offsetWidth,bh=el.offsetHeight;
   const qx=n%2,qy=n>>1;const x=qx*W/2+Math.random()*Math.max(4,W/2-bw-4),y=qy*H/2+Math.random()*Math.max(4,H/2-bh-4);const ang=Math.random()*6.28;
   const t={el,k,x:Math.min(x,W-bw),y:Math.min(y,H-bh),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,bw,bh,dead:false};el.onclick=e=>shoot(t,e);return t});
  let last=performance.now();cancelAnimationFrame(raf);
  const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const W2=arena.clientWidth,H2=arena.clientHeight;
   for(const t of T){if(t.dead)continue;t.x+=t.vx*dt;t.y+=t.vy*dt;if(t.x<0){t.x=0;t.vx*=-1}if(t.x>W2-t.bw){t.x=W2-t.bw;t.vx*=-1}if(t.y<0){t.y=0;t.vy*=-1}if(t.y>H2-t.bh){t.y=H2-t.bh;t.vy*=-1}
    const tf=`translate(${t.x}px,${t.y}px)`;t.el.style.setProperty("--tf",tf);t.el.style.transform=tf}
   raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
  timer=countdown(16/spd(),f=>{hud.time(f);zone.style.transform=`translate(-50%,-50%) scale(${.3+.7*f})`;arena.classList.toggle("closing",f<.3)},()=>{if(busy)return;busy=true;hud.bad();reveal();feedback(false,`Answer: ${q.opts[q.a]}. ${q.why}`,"Zone closed! ");i++;later(next,2300)})}

 function reveal(){const q=qs[i];T.forEach(t=>{if(t.k===q.a)t.el.classList.add("reveal")})}

 if(kind==="pie"){let a=-Math.PI/2,p="";[.45,.3,.25].forEach((s,k)=>{const b=a+s*6.283;const x1=110+45*Math.cos(a),y1=55+45*Math.sin(a),x2=110+45*Math.cos(b),y2=55+45*Math.sin(b);p+=`<path d="M110 55L${x1.toFixed(1)} ${y1.toFixed(1)}A45 45 0 ${s>.5?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}z" fill="${C[k]}"/>`;a=b});return`<svg viewBox="0 0 220 110" role="img" aria-label="Pie chart example">${p}</svg>`}
 if(kind==="bar"){return`<svg viewBox="0 0 220 110" role="img" aria-label="Bar chart example"><line x1="30" y1="6" x2="30" y2="104" stroke="#8a8f94"/>${v.map((n,k)=>`<rect x="31" y="${8+k*19}" width="${n*1.8}" height="13" fill="${C[1]}"/>`).join("")}</svg>`}
 if(kind==="line"){const pts=[30,55,45,75,60,90,80,70].map((n,k)=>`${14+k*28},${100-n}`).join(" ");return`<svg viewBox="0 0 220 110" role="img" aria-label="Line chart example"><line x1="10" y1="102" x2="215" y2="102" stroke="#8a8f94"/><polyline points="${pts}" fill="none" stroke="${C[3]}" stroke-width="3"/>${pts.split(" ").map(p=>`<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="3" fill="${C[3]}"/>`).join("")}</svg>`}
 return`<svg viewBox="0 0 220 110" role="img" aria-label="Column chart example"><line x1="10" y1="102" x2="215" y2="102" stroke="#8a8f94"/>${v.map((n,k)=>`<rect x="${22+k*40}" y="${102-n}" width="26" height="${n}" fill="${C[0]}"/>`).join("")}</svg>`}

/* ---------- Settings ---------- */
function openSettings(){document.querySelectorAll(".modal").forEach(x=>x.remove());
 const tch=h("input",{type:"checkbox",id:"tch"});tch.checked=S.teacher;const snd=h("input",{type:"checkbox",id:"snd"});snd.checked=S.sound;
 const nm=h("input",{class:"field",id:"nm",value:S.name,maxlength:"30",autocomplete:"off"});
 const seg=h("div",{class:"seg"},Object.entries(SPD).map(([k,v])=>h("button",{"aria-pressed":String(S.speed===k),onclick(e){S.speed=k;seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false"));e.currentTarget.setAttribute("aria-pressed","true")}},v.label)));
 let armed=false;const reset=h("button",{class:"ghost dark",onclick(){if(window.GameSave){GameSave.startOver();return}if(!armed){armed=true;reset.textContent="Tap again to erase all stars";return}S.progress={};save();updateChips();m.remove();go(showMap)}},"Reset progress");
 const m=h("div",{class:"modal",onclick(e){if(e.target===m)close()}},h("div",{class:"paper",role:"dialog","aria-label":"Settings"},h("h2",{},"Settings"),
  h("div",{},h("label",{for:"nm",style:"font-weight:800;font-size:14px"},"Player name"),nm),h("div",{},h("div",{style:"font-weight:800;font-size:14px;margin-bottom:4px"},"Speed"),seg),
  h("label",{class:"switch",for:"snd"},"Sound effects",snd),
  h("div",{class:"bar-actions"},h("button",{class:"btn",onclick:close},"Done"),reset)));
 function close(){S.name=nm.value.trim();S.sound=snd.checked;S.teacher=false;save();updateChips();m.remove();const cur=main.dataset.screen;if(cur==="map")go(showMap)}
 document.body.append(m)}
$("#setbtn").addEventListener("click",openSettings);
$("#home").addEventListener("click",()=>go(S.name||totalStars()?showMap:showTitle));
const _showMap=showMap;showMap=function(){main.dataset.screen="map";if(S.lastWorld!=null){S.lastWorld=null;save()}_showMap()};
updateChips();
{const lw=S.lastWorld;if(Number.isInteger(lw)&&WORLDS[lw]&&worldOpen(lw))go(()=>showWorld(lw));else go(totalStars()?showMap:showTitle)}
if(window.GameSave&&totalStars())setTimeout(()=>GameSave.toast("Welcome back! Your stars and progress were restored."),400);
</script>
