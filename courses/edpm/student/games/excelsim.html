    { t: 'On the <b>Log</b> sheet, <b>Freeze Top Row</b> (View ▸ Freeze Panes).', ok: K => (K.sh('Log').freeze.r === 1) || 'Row 1 of the Log sheet is not frozen.', hint: ['Freeze Panes is on the View tab.', 'View ▸ Freeze Panes ▸ Freeze Top Row.'], show: { tab: 'view', cmd: 'freeze' } },
    { t: '<b>Hide</b> column C (Donor Type).', ok: K => K.sh('Log').hidC.has(2) || 'Column C is not hidden.', hint: ['Right-click the column heading.', 'Right-click the C heading ▸ Hide.'], show: { el: '#grid th.ch[data-c="2"]' } },
    { t: '<b>AutoFit</b> column B so the longest district name fits exactly.', ok: K => Math.abs(K.colW('B', 'Log') - autoFitWidth(K.sh('Log'), 1)) <= 3 || 'Column B is not AutoFitted yet.', hint: ['Double-click the right border of the B heading.', 'Or select column B ▸ Home ▸ Format ▸ AutoFit Column Width.'], show: { tab: 'home', cmd: 'cellsformat' } }
  ] },
{ id: 'l2-sheets', lvl: 2, title: 'Term Two Link-up', obj: 'Section III · advanced spreadsheet features: linking worksheets', wb: () => { const w = wbGrades({ term2: true }); w.sheets[0].ensure(2, 9).v = 'Term 2'; w.sheets[0].ensure(2, 9).s = JSON.parse(JSON.stringify(BOLD_HEAD)); w.recalc(null); return w; }, file: 'Form 4 EDPM Grade Book',
  brief: 'Term 2 averages are on <b>Sheet2</b>. Give the sheet a proper name and <b>link</b> its averages into the Marks sheet so they update automatically.',
  steps: [
    { t: 'Rename <b>Sheet2</b> to <b>Term 2</b> (double-click the tab).', ok: K => !!K.sh('Term 2') || 'There is no sheet called Term 2 yet.', hint: ['Sheet tabs are at the bottom-left.', 'Double-click the Sheet2 tab, type Term 2, press Enter (or right-click ▸ Rename).'], show: { el: '.stab[data-i="1"]' } },
    { t: 'Give the <b>Term 2</b> tab a <b>colour</b>.', ok: K => (K.sh('Term 2') && !!K.sh('Term 2').tab) || 'The Term 2 tab has no colour.', hint: ['Right-click the tab.', 'Right-click Term 2 ▸ Tab Colour ▸ choose a colour.'], show: { el: '.stab[data-i="1"]' } },
    { t: 'On <b>Marks</b>, in <code>J4</code> link to Jamal Peterson\'s Term 2 average: <code>=\'Term 2\'!C4</code>.', ok: K => (/^='TERM2'!C4$/.test(K.f('J4', 'Marks')) && K.v('J4', 'Marks') === 85) || "J4 should be ='Term 2'!C4.", hint: ['Type = then click the Term 2 tab and click C4, then press Enter.', "In J4 type ='Term 2'!C4 and press Enter."], show: { cell: 'J4' } },
    { t: 'Fill <code>J4</code> down to <code>J15</code>.', ok: K => colFormula(K, 'J', 4, 15, { sheet: 'Marks', must: ["'TERM2'!C"], exp: r => TERM2[K.text('B' + r, 'Marks')] }), hint: ['Cross-sheet references fill just like normal ones.', 'Select J4 on Marks and drag the fill handle to J15.'], show: { cell: 'J4' } }
  ] },
{ id: 'l2-text', lvl: 2, title: 'Student Usernames', obj: 'Section III · spreadsheets: joining text & TODAY', wb: () => { const w = wbGrades(); const s = w.sheets[0]; s.ensure(2, 9).v = 'Username'; s.ensure(2, 9).s = JSON.parse(JSON.stringify(BOLD_HEAD)); s.colW[9] = 140; s.ensure(0, 8).v = 'Printed:'; w.recalc(null); return w; }, file: 'Form 4 EDPM Grade Book',
  brief: 'The computer lab needs a login for each student: <b>firstname.surname</b> in lower case, e.g. <code>jamal.peterson</code>. Join text with <code>&amp;</code> or <b>CONCAT</b>, and stamp today\'s date on the sheet.',
  steps: [
    { t: 'In <code>J4</code> build the username: <code>=LOWER(C4&amp;"."&amp;B4)</code> (or use CONCAT).', ok: K => ((/&|CONCAT/.test(K.f('J4'))) && K.v('J4') === 'jamal.peterson') || 'J4 should show jamal.peterson using & or CONCAT.', hint: ['& joins text. Put the full stop in quotes: "."', 'Type =LOWER(C4&"."&B4) in J4.'], show: { cell: 'J4' } },
    { t: 'Fill down to <code>J15</code>.', ok: K => colFormula(K, 'J', 4, 15, { exp: r => (K.text('C' + r) + '.' + K.text('B' + r)).toLowerCase() }), hint: ['Fill handle.', 'Select J4 and drag down to J15.'], show: { cell: 'J4' } },
    { t: 'In <code>J1</code> enter <code>=TODAY()</code> to show the date the sheet is printed.', ok: K => (/TODAY\(\)/.test(K.f('J1')) && /date/.test(K.nf('J1').t)) || 'J1 should contain =TODAY() shown as a date.', hint: ['TODAY has empty brackets.', 'Click J1 and type =TODAY() then Enter.'], show: { cell: 'J1' } }
  ] },
/* ---------------- LEVEL 3 ---------------- */
{ id: 'e-ruled', lvl: 2, title: 'Ruled Tabulation: CSEC Passes', obj: 'Section IV · tabulation: oblique & vertical headings (SBA sample 1)', wb: () => wbResults(), file: 'Ruled Tabulation - CSEC Passes',
  brief: 'SBA sample 1: the Guidance Department at Mahoe Grove High School in Mandeville, Jamaica, wants a <b>ruled tabulation</b> of CSEC passes (Grades I to III) for the last three years. Give it a merged main heading, each year over its own columns, <b>slanted</b> and <b>vertical</b> column headings, subjects sorted A to Z, a total column, a harmonious colour scheme and full ruling.',
  steps: [
    { t: '<b>Merge & Centre</b> the main heading across <code>A1:H1</code> and make it <b>bold</b>.', ok: K => (ED.merged(K, 'A1:H1') && K.s('A1').h === 'center' && !!K.s('A1').b) || 'A1:H1 must be merged and centred, and the heading bold.', hint: ['Select all eight columns of row 1 first.', 'Select A1:H1 ▸ Home ▸ Merge & Centre, then Bold (Ctrl+B).'], show: { tab: 'home', cmd: 'merge' } },
    { t: 'Put each year over its two columns: <b>Merge & Centre</b> <code>B3:C3</code>, <code>D3:E3</code> and <code>F3:G3</code> (multiple columnar headings).', ok: K => { const miss = ['B3:C3', 'D3:E3', 'F3:G3'].filter(g => !ED.merged(K, g) || K.s(g.slice(0, 2)).h !== 'center'); return !miss.length || 'Merge and centre: ' + miss.join(', ') + '.'; }, hint: ['One year sits over its Entries and Passes columns.', 'Select B3:C3 ▸ Merge & Centre; then D3:E3; then F3:G3.'], show: { tab: 'home', cmd: 'merge' } },
    { t: 'Merge <code>A3:A4</code> (Subject) and <code>H3:H4</code> (Total Passes), so each heading covers both heading rows.', ok: K => { const miss = ['A3:A4', 'H3:H4'].filter(g => !ED.merged(K, g)); return !miss.length || 'Merge: ' + miss.join(' and ') + '.'; }, hint: ['Select the two cells one above the other, then merge.', 'Select A3:A4 ▸ Merge & Centre; then H3:H4 ▸ Merge & Centre.'], show: { tab: 'home', cmd: 'merge' } },
    { t: 'Slant the six sub-headings <code>B4:G4</code> (Entries, Passes …) to <b>45°</b>: Home ▸ Orientation ▸ <b>Angle Counterclockwise</b>.', ok: K => { const bad = ['B4', 'C4', 'D4', 'E4', 'F4', 'G4'].filter(a => ED.rot(K, a) !== 45); return !bad.length || 'Not slanted at 45° yet: ' + bad.join(', ') + '.'; }, hint: ['Orientation is the slanted “ab” button in the Alignment group.', 'Select B4:G4 ▸ Home ▸ Orientation ▾ ▸ Angle Counterclockwise.'], show: { tab: 'home', cmd: 'textorient' } },
    { t: 'Make the <b>Total Passes</b> heading vertical: click it, then Home ▸ Orientation ▸ <b>Rotate Text Up</b> (90°).', ok: K => [90, 255].includes(ED.rot(K, 'H3')) || 'Total Passes (H3) should be turned to 90° with Rotate Text Up (or set to Vertical Text).', hint: ['Vertical headings save space over narrow columns.', 'Click H3 ▸ Home ▸ Orientation ▾ ▸ Rotate Text Up.'], show: { tab: 'home', cmd: 'textorient' } },
    { t: 'Sort the subjects <b>A to Z</b>: select only the data rows <code>A5:H12</code> (not the headings), then Sort A to Z.', ok: K => { const names = K.rows(5, 12).map(r => K.text('A' + r)); if (!ED.sortedAZ(names)) return 'The subjects in A5:A12 are not in A to Z order yet.'; for (let r = 5; r <= 12; r++) { const s = RESULTS.find(x => x[0] === K.text('A' + r)); if (!s) return 'A subject is missing from row ' + r + '.'; for (let j = 1; j <= 6; j++) if (K.v(XL.colName(j) + r) !== s[j]) return `Row ${r}: the figures for ${s[0]} were separated from the subject. Undo (Ctrl+Z) and sort the whole block A5:H12.`; } return true; }, hint: ['With two heading rows, select just the data block so the headings stay where they are.', 'Drag from A5 to H12 ▸ Home ▸ Sort & Filter ▸ Sort A to Z.'], show: { cell: 'A5:H12' } },
    { t: 'In <code>H5:H12</code> add each subject’s passes for the three years with a formula (for example <code>=C5+E5+G5</code>) and fill down.', ok: K => { for (let r = 5; r <= 12; r++) { const a = 'H' + r; if (!K.isF(a)) return a + ' needs a formula (start with =).'; const s = RESULTS.find(x => x[0] === K.text('A' + r)); const e = s ? s[2] + s[4] + s[6] : NaN; if (!K.near(K.v(a), e)) return `${a} shows ${fmtV(K.v(a))} but should be ${e}: add only the three Passes columns.`; } return true; }, hint: ['Add the Passes columns only: C, E and G.', 'Click H5, type =C5+E5+G5 and press Enter, then drag the fill handle down to H12.'], show: { cell: 'H5' } },
    { t: 'Shade the two heading rows <code>A3:H4</code> with <b>one light fill colour</b> and make them <b>bold</b> (a harmonious colour scheme).', ok: K => { const cells = ['A3', 'B3', 'D3', 'F3', 'H3', 'B4', 'C4', 'D4', 'E4', 'F4', 'G4']; const f = (K.s('A3').fill || '').toUpperCase(); if (!f || f === '#FFFFFF') return 'Shade the heading rows A3:H4 with a fill colour.'; if (cells.some(a => (K.s(a).fill || '').toUpperCase() !== f)) return 'Use the same fill colour across all of A3:H4.'; if (!ED.light(f)) return 'Choose a lighter tint so the headings stay easy to read.'; return cells.every(a => K.s(a).b) || 'Make the headings in A3:H4 bold.'; }, hint: ['Pick one of the light tints in the Fill Colour palette.', 'Select A3:H4 ▸ Home ▸ Fill Colour ▾ ▸ a light tint (for example Blue, Lighter 80%) ▸ Bold.'], show: { tab: 'home', cmd: 'fillcolor' } },
    { t: 'Rule the table: <b>All Borders</b> on <code>A3:H12</code>.', ok: K => { const a = ED.allBorders(K, 'A3:H12'); return !a || a + ' is missing a border.'; }, hint: ['A ruled tabulation has every line drawn.', 'Select A3:H12 ▸ Home ▸ Borders ▾ ▸ All Borders.'], show: { tab: 'home', cmd: 'borders' } }
  ] },
{ id: 'e-invoice', lvl: 2, title: 'Invoice for Island Hardware', obj: 'Section VI · financial documents: invoice (SBA sample 2)', wb: () => wbInvoice(), file: 'Invoice - Island Hardware',
  brief: 'SBA sample 2 (financial document): Island Hardware & Paint N.V. in Kralendijk, Bonaire, is invoicing Rincon Community Centre for paint and supplies. Lay out the heading, slant the column headings, calculate every amount, sort the items and finish the totals with currency, borders and a double rule under the total due.',
  steps: [
    { t: '<b>Merge & Centre</b> the three heading lines across columns A to D (<code>A1:D1</code>, <code>A2:D2</code>, <code>A3:D3</code>) and make the business name and INVOICE <b>bold</b>.', ok: K => { const bad = ED.heading3(K, 'D'); if (bad.length) return 'Merge and centre: ' + bad.join(', ') + '.'; return (K.s('A1').b && K.s('A3').b) || 'Make ISLAND HARDWARE & PAINT N.V. and INVOICE bold.'; }, hint: ['Merge each line on its own, or select A1:D3 and use Merge Across, then Centre.', 'Select A1:D1 ▸ Merge & Centre; repeat for A2:D2 and A3:D3; then bold A1 and A3.'], show: { tab: 'home', cmd: 'merge' } },
    { t: 'Make the column headings <code>A8:D8</code> <b>bold</b> and slant them to <b>45°</b> (Home ▸ Orientation ▸ Angle Counterclockwise).', ok: K => { const c = ['A8', 'B8', 'C8', 'D8']; if (c.some(a => !K.s(a).b)) return 'Make all four column headings bold.'; const bad = c.filter(a => ED.rot(K, a) !== 45); return !bad.length || 'Slant to 45°: ' + bad.join(', ') + '.'; }, hint: ['Oblique (slanted) headings are a mark in the financial document.', 'Select A8:D8 ▸ Bold ▸ Home ▸ Orientation ▾ ▸ Angle Counterclockwise.'], show: { tab: 'home', cmd: 'textorient' } },
    { t: 'In <code>D9:D14</code> work out each Amount = Qty × Unit Price (for example <code>=A9*C9</code>) and fill down.', ok: K => colFormula(K, 'D', 9, 14, { exp: r => { const it = INV.find(x => x[1] === K.text('B' + r)); return it ? it[0] * it[2] : NaN; } }), hint: ['Multiply the quantity by the unit price in the same row.', 'Click D9, type =A9*C9, press Enter and fill down to D14.'], show: { cell: 'D9' } },
    { t: 'Sort the items by <b>Description</b> from A to Z, keeping each row together.', ok: K => { const names = K.rows(9, 14).map(r => K.text('B' + r)); if (!ED.sortedAZ(names)) return 'The descriptions in B9:B14 are not in A to Z order yet.'; for (let r = 9; r <= 14; r++) { const it = INV.find(x => x[1] === K.text('B' + r)); if (!it) return 'An item is missing from row ' + r + '.'; if (K.v('A' + r) !== it[0] || K.v('C' + r) !== it[2]) return `Row ${r}: the quantity or price for “${it[1]}” was separated from it. Undo and sort the whole list.`; } return true; }, hint: ['Click one description, then Sort A to Z: Excel sorts the whole list and keeps the heading row.', 'Click B10 ▸ Home ▸ Sort & Filter ▸ Sort A to Z.'], show: { tab: 'home', cmd: 'sortfilter' } },
    { t: 'In <code>D16</code> find the <b>Subtotal</b> with <code>=SUM(D9:D14)</code>.', ok: K => ED.fx(K, 'D16', /SUM\(D9:D14\)/, 1761.49), hint: ['AutoSum (Σ) writes the SUM for you; check the range is D9:D14.', 'Click D16, type =SUM(D9:D14) and press Enter.'], show: { cell: 'D16' } },
    { t: 'In <code>D17</code> calculate the 8% ABB sales tax on the subtotal (for example <code>=D16*8%</code>) and in <code>D18</code> the <b>Total Due</b> (<code>=D16+D17</code>).', ok: K => { const a = ED.fx(K, 'D17', /D16/, 140.9192, 0.006); if (a !== true) return a; return ED.fx(K, 'D18', /D16/, 1902.4092, 0.006); }, hint: ['Use cell references, not the numbers themselves.', 'D17: =D16*8% (or =D16*0.08); D18: =D16+D17.'], show: { cell: 'D17' } },
    { t: 'Format the prices and amounts (<code>C9:D14</code> and <code>D16:D18</code>) as <b>Currency $</b> (US dollars) with <b>2 decimal places</b>.', ok: K => { const cells = []; for (let r = 9; r <= 14; r++) cells.push('C' + r, 'D' + r); cells.push('D16', 'D17', 'D18'); const bad = ED.money(K, cells, '$'); return !bad || bad + ' is not Currency $ with 2 decimal places.'; }, hint: ['Ctrl+1 opens Format Cells.', 'Select C9:D14, hold Ctrl and select D16:D18 ▸ Ctrl+1 ▸ Currency ▸ Symbol $ ▸ 2 decimal places (or Home ▸ Accounting ▾ ▸ $ English (United States)).'], show: { tab: 'home', cmd: 'accounting' } },
    { t: 'Rule the item table with <b>All Borders</b> (<code>A8:D14</code>) and put a <b>Bottom Double Border</b> under the Total Due (<code>D18</code>).', ok: K => { const a = ED.allBorders(K, 'A8:D14'); if (a) return a + ' is missing a border.'; return ['double', 'thick'].includes(K.bord('D18', 'b')) || 'Add a Bottom Double Border under D18.'; }, hint: ['Both are in the Borders ▾ list.', 'Select A8:D14 ▸ Borders ▾ ▸ All Borders; click D18 ▸ Borders ▾ ▸ Bottom Double Border.'], show: { tab: 'home', cmd: 'borders' } }
  ] },
{ id: 'e-research', lvl: 2, title: 'Research Findings Chart', obj: 'Section IV · charts from tabulated data (SBA research paper and presentation)', wb: () => wbSurvey(), file: 'Research Findings - Survey',
  brief: 'For your EDPM research paper you surveyed 40 small businesses in New Amsterdam, Guyana. Total the replies, work out each method’s share, sort the methods from most to least popular and chart the findings for your presentation (SBA sample 7).',
  steps: [
    { t: 'In <code>B11</code> total the replies with <code>=SUM(B5:B9)</code>.', ok: K => ED.fx(K, 'B11', /SUM\(B5:B9\)/, 40), hint: ['AutoSum (Σ) is quickest.', 'Click B11, type =SUM(B5:B9) and press Enter.'], show: { cell: 'B11' } },
    { t: 'In <code>C5:C9</code> work out each method’s share of the total, using an <b>absolute</b> reference to the total (for example <code>=B5/$B$11</code>), and fill down.', ok: K => colFormula(K, 'C', 5, 9, { must: [/\$B\$11/], mustMsg: a => a + ' must divide by $B$11 (press F4 to add the $ signs).', exp: r => { const s = SURVEY.find(x => x[0] === K.text('A' + r)); return s ? s[1] / 40 : NaN; } }), hint: ['The total must stay fixed as you fill down.', 'C5: =B5/$B$11, then fill down to C9.'], show: { cell: 'C5' } },
    { t: 'Format <code>C5:C9</code> as <b>Percentage</b> with <b>1 decimal place</b>.', ok: K => { const bad = nfIs(K, 'C5:C9', nf => nf.t === 'percent' && nf.dp === 1); return !bad || bad + ' is not a percentage with 1 decimal place.'; }, hint: ['Percent Style is %, then Increase Decimal once.', 'Select C5:C9 ▸ Home ▸ % ▸ Increase Decimal (or Ctrl+1 ▸ Percentage ▸ 1).'], show: { tab: 'home', cmd: 'nf-percent' } },
    { t: 'Sort the methods from <b>most to fewest</b> businesses (largest to smallest), keeping each row together.', ok: K => { const v = K.rows(5, 9).map(r => K.v('B' + r)); if (!v.every((x, i) => i === 0 || v[i - 1] >= x)) return 'B5:B9 is not in largest-to-smallest order yet.'; for (let r = 5; r <= 9; r++) { const s = SURVEY.find(x => x[0] === K.text('A' + r)); if (!s || s[1] !== K.v('B' + r)) return 'Row ' + r + ': a method was separated from its count. Undo and sort the whole list.'; } return true; }, hint: ['Click one number in the Businesses column, then sort Z to A (largest first).', 'Click B6 ▸ Home ▸ Sort & Filter ▸ Sort Z to A (Largest to Smallest).'], show: { tab: 'home', cmd: 'sortfilter' } },
    { t: 'Select <code>A4:B9</code> and insert a <b>2-D Pie</b> chart.', ok: K => K.charts().some(x => x.ch.type === 'pie' && (K.chartCovers(x.ch, 'Findings', 'B5:B9') || K.chartCovers(x.ch, 'Findings', 'C5:C9')) && chartCats(x.ch).length === 5) || 'Insert a pie chart of the five methods (A4:B9).', hint: ['A pie chart shows parts of a whole.', 'Select A4:B9 ▸ Insert ▸ Pie ▸ 2-D Pie.'], show: { tab: 'insert', cmd: 'chartpie' } },
    { t: 'Give the chart the title <b>Main Method Used to Contact Customers</b>.', ok: K => K.charts().some(x => x.ch.type === 'pie' && x.ch.showTitle !== false && /contact/i.test(x.ch.title || '')) || 'The chart title should be Main Method Used to Contact Customers.', hint: ['Double-click the chart title to type.', 'Click the chart, double-click its title, type Main Method Used to Contact Customers and press Enter.'], show: { tab: 'chartformat', cmd: 'ctitle' } },
    { t: 'Show <b>data labels</b> as <b>percentages</b> on the pie.', ok: K => K.charts().some(x => x.ch.type === 'pie' && x.ch.labels === 'percent') || 'Turn on percentage data labels.', hint: ['Chart Design ▸ Add Chart Element ▸ Data Labels.', 'Click the chart ▸ Chart Design ▸ Add Chart Element ▸ Data Labels ▸ Show Percentages.'], show: { tab: 'chartdesign', cmd: 'addelement' } }
  ] },{ id: 'l3-gradebook', lvl: 3, title: 'Complete the Grade Book', obj: 'Section III · advanced spreadsheet features: VLOOKUP across sheets', timer: 900, wb: () => wbGrades(), file: 'Form 4 EDPM Grade Book',
  brief: '<b>Task sheet.</b> Form 4B\'s grade book is incomplete. Using the Marks worksheet, complete the following. Grades: 0–39 F, 40–49 E, 50–59 D, 60–69 C, 70–79 B, 80+ A.',
  steps: [
    { t: '(a) Insert a new worksheet named <b>Grades</b>.', ok: K => !!K.sh('Grades') || 'Add a sheet named Grades.', hint: ['Use the ⊕ next to the sheet tabs.', 'Click + beside the tabs, then double-click the new tab and rename it Grades.'], show: { el: '.sadd' } },
    { t: '(b) On <b>Grades</b>, enter the table in <code>A1:B7</code>: headings <b>Mark</b>, <b>Grade</b>, then 0 F, 40 E, 50 D, 60 C, 70 B, 80 A (lowest mark first).', ok: K => { if (!K.sh('Grades')) return 'Create the Grades sheet first.'; const exp = [[0, 'F'], [40, 'E'], [50, 'D'], [60, 'C'], [70, 'B'], [80, 'A']]; for (let i = 0; i < 6; i++) { if (K.v('A' + (i + 2), 'Grades') !== exp[i][0] || K.text('B' + (i + 2), 'Grades').toUpperCase() !== exp[i][1]) return 'Row ' + (i + 2) + ' on Grades should be ' + exp[i][0] + ' and ' + exp[i][1] + '.'; } return true; }, hint: ['An approximate VLOOKUP needs the marks sorted lowest to highest.', 'A1 Mark, B1 Grade, A2 0, B2 F, A3 40, B3 E, A4 50, B4 D, A5 60, B5 C, A6 70, B6 B, A7 80, B7 A.'], show: { el: '.stabs' } },
    { t: '(c) On <b>Marks</b>, in <code>G4:G15</code> calculate the average rounded to <b>1 decimal place</b> using <b>ROUND</b> and <b>AVERAGE</b>.', ok: K => colFormula(K, 'G', 4, 15, { sheet: 'Marks', must: ['ROUND(', 'AVERAGE('], mustMsg: a => a + ' must use both ROUND and AVERAGE.', exp: r => XL.roundHalf((K.v('D' + r, 'Marks') + K.v('E' + r, 'Marks') + K.v('F' + r, 'Marks')) / 3, 1) }), hint: ['Nest AVERAGE inside ROUND.', 'G4: =ROUND(AVERAGE(D4:F4),1) then fill down.'], show: { cell: 'G4' } },
    { t: '(d) In <code>H4:H15</code> use <b>VLOOKUP</b> with an <b>absolute</b> reference to the Grades table to show each grade.', ok: K => colFormula(K, 'H', 4, 15, { sheet: 'Marks', must: ['VLOOKUP(', 'GRADES!$A$', ], mustMsg: a => a + ' must use VLOOKUP with Grades!$A$… (absolute).', exp: r => gradeOf(K.v('G' + r, 'Marks')) }), hint: ['The table_array is on another sheet: Grades!$A$2:$B$7.', 'H4: =VLOOKUP(G4,Grades!$A$2:$B$7,2,TRUE) then fill down.'], show: { tab: 'formulas', cmd: 'fn-lookup' } },
    { t: '(e) In <code>I4:I15</code> rank each student by average (1 = highest).', ok: K => colFormula(K, 'I', 4, 15, { sheet: 'Marks', must: [/RANK/], mustMsg: a => a + ' should use RANK or RANK.EQ.', exp: r => { const me = K.v('G' + r, 'Marks'); return 1 + K.rows(4, 15).filter(x => K.v('G' + x, 'Marks') > me).length; } }), hint: ['Remember the $ signs on the list.', 'I4: =RANK.EQ(G4,$G$4:$G$15) then fill down.'], show: { cell: 'I4' } }
  ] },
{ id: 'l3-summary', lvl: 3, title: 'Relief Summary Across Sheets', obj: 'Section III · advanced spreadsheet features: linking worksheets', timer: 900, wb: () => wbMonths(), sheet: 'Summary', file: 'Relief Fund Q3',
  brief: '<b>Task sheet.</b> The fund keeps one worksheet per month (<b>Jul</b>, <b>Aug</b>, <b>Sep</b>). Build the <b>Summary</b> sheet with formulas that LINK to the month sheets, so any correction flows through automatically.',
  steps: [
    { t: '(a) On each month sheet, total the amounts in <code>B11</code> with SUM.', ok: K => { for (const m of ['Jul', 'Aug', 'Sep']) if (!/SUM\(B4:B10\)/.test(K.f('B11', m))) return m + '!B11 should be =SUM(B4:B10).'; return true; }, hint: ['Do it once per sheet (or group them, if you know how).', 'On Jul click B11 ▸ AutoSum ▸ Enter. Repeat on Aug and Sep.'], show: { tab: 'home', cmd: 'autosum' } },
    { t: '(b) On <b>Summary</b>, fill <code>B4:D10</code> with links to each month\'s amounts (e.g. <code>B4</code> = <code>=Jul!B4</code>, <code>C4</code> = <code>=Aug!B4</code>).', ok: K => { for (let r = 4; r <= 10; r++) for (const [c, m] of [['B', 'JUL'], ['C', 'AUG'], ['D', 'SEP']]) { const f = K.f(c + r, 'Summary'); if (!f.includes(m + '!')) return c + r + ' should link to ' + m[0] + m.slice(1).toLowerCase() + '!B' + r + '.'; const exp = DONATIONS[r - 4][{ B: 0, C: 1, D: 2 }[c]]; if (K.v(c + r, 'Summary') !== exp) return c + r + ' shows the wrong amount.'; } return true; }, hint: ['Type = then click the month tab and the cell, then Enter. Fill down.', 'B4: =Jul!B4, C4: =Aug!B4, D4: =Sep!B4, then select B4:D4 and fill down to row 10.'], show: { cell: 'B4' } },
    { t: '(c) In <code>E4:E10</code> total each district across the three months.', ok: K => colFormula(K, 'E', 4, 10, { sheet: 'Summary', exp: r => DONATIONS[r - 4][0] + DONATIONS[r - 4][1] + DONATIONS[r - 4][2] }), hint: ['SUM across the row.', 'E4: =SUM(B4:D4), fill down.'], show: { cell: 'E4' } },
    { t: '(d) In <code>B11:E11</code> show the grand totals. B11:D11 must <b>link</b> to the month totals (e.g. <code>=Jul!B11</code>).', ok: K => { for (const [c, m] of [['B', 'JUL'], ['C', 'AUG'], ['D', 'SEP']]) if (!K.f(c + '11', 'Summary').includes(m + '!B11')) return c + '11 should be =' + m[0] + m.slice(1).toLowerCase() + '!B11.'; const tot = DONATIONS.reduce((t, d) => t + d[0] + d[1] + d[2], 0); return (K.isF('E11', 'Summary') && K.near(K.v('E11', 'Summary'), tot)) || 'E11 should total everything (' + tot + ').'; }, hint: ['A 3-D link points to a cell on another sheet.', 'B11: =Jul!B11, C11: =Aug!B11, D11: =Sep!B11, E11: =SUM(B11:D11).'], show: { cell: 'B11' } },
    { t: '(e) Format <code>B4:E11</code> on Summary as Currency or Accounting with the <b>EC$</b> symbol.', ok: K => { const bad = nfIs(K, 'B4:E11', nf => (nf.t === 'currency' || nf.t === 'accounting') && nf.sym === 'EC$', 'Summary'); return !bad || bad + ' is not formatted in EC$.'; }, hint: ['Select the whole block first.', 'Select B4:E11 ▸ Home ▸ Accounting ▾ ▸ EC$.'], show: { tab: 'home', cmd: 'accounting' } }
  ] },
{ id: 'l3-cf', lvl: 3, title: 'Failure Alert', obj: 'Section IV · tabulation: conditional formatting & page setup', timer: 600, wb: () => wbGrades({ avg: true, grade: 'if' }), file: 'Form 4 EDPM Grade Book',
  brief: '<b>Task sheet.</b> The Head of Department wants failing averages to stand out on the printed report and the class statistics shown underneath.',
  steps: [
    { t: '(a) Apply conditional formatting to <code>G4:G15</code>: <b>Less Than 50</b> ▸ <b>Light Red Fill with Dark Red Text</b>.', ok: K => K.sh().cf.some(c => c.type === 'lt' && +c.v1 === 50 && c.style === 'lightRed' && c.c1 === 6 && c.c2 === 6 && c.r1 <= 3 && c.r2 >= 14) || 'Add a Less Than 50 rule with Light Red Fill with Dark Red Text to G4:G15.', hint: ['Home ▸ Conditional Formatting ▸ Highlight Cells Rules.', 'Select G4:G15 ▸ Conditional Formatting ▸ Highlight Cells Rules ▸ Less Than… ▸ 50 ▸ Light Red Fill with Dark Red Text ▸ OK.'], show: { tab: 'home', cmd: 'cf' } },
    { t: '(b) Add a second rule: averages <b>Greater Than 80</b> ▸ <b>Green Fill with Dark Green Text</b>.', ok: K => K.sh().cf.some(c => c.type === 'gt' && +c.v1 === 80 && c.style === 'green' && c.c1 === 6) || 'Add a Greater Than 80 green rule to G4:G15.', hint: ['Same menu, different rule.', 'Select G4:G15 ▸ Conditional Formatting ▸ Highlight Cells Rules ▸ Greater Than… ▸ 80 ▸ Green Fill with Dark Green Text.'], show: { tab: 'home', cmd: 'cf' } },
    { t: '(c) In <code>G17</code> count the failures (average below 50) with <b>COUNTIF</b>.', ok: K => (/COUNTIF\(G4:G15,"<50"\)/.test(K.f('G17')) && K.v('G17') === 3) || 'G17 should be =COUNTIF(G4:G15,"<50").', hint: ['The criteria needs quotes: "<50".', 'G17: =COUNTIF(G4:G15,"<50").'], show: { cell: 'G17' } },
    { t: '(d) In <code>G18</code> show the class average rounded to 1 decimal place.', ok: K => (/ROUND\(AVERAGE\(G4:G15\),1\)/.test(K.f('G18'))) || 'G18 should be =ROUND(AVERAGE(G4:G15),1).', hint: ['Nest AVERAGE inside ROUND.', 'G18: =ROUND(AVERAGE(G4:G15),1).'], show: { cell: 'G18' } },
    { t: '(e) Set the page to <b>Landscape</b> and turn on <b>Print Gridlines</b> (Page Layout tab).', ok: K => (K.sh().page.orient === 'landscape' && K.sh().page.grid) || 'Set Landscape orientation and tick Gridlines ▸ Print.', hint: ['Orientation and Sheet Options are on Page Layout.', 'Page Layout ▸ Orientation ▸ Landscape; Page Layout ▸ Sheet Options ▸ Gridlines ▸ Print.'], show: { tab: 'pagelayout', cmd: 'orient' } }
  ] },
{ id: 'l3-pie', lvl: 3, title: 'Donations Pie on Its Own Sheet', obj: 'Section IV · charts: pie chart on its own sheet', timer: 600, wb: () => wbHurricane({ totals: true, colTotals: true }), file: 'Hurricane Relief Donations',
  brief: '<b>Task sheet.</b> Produce a pie chart showing each district\'s share of the TOTAL donations (column F), on its own chart sheet, ready to print for the Relief Fund board.',
  steps: [
    { t: '(a) Select <code>A3:A10</code>, hold <b>Ctrl</b> and select <code>F3:F10</code>, then insert a <b>2-D Pie</b> chart.', ok: K => K.charts().some(x => x.ch.type === 'pie' && K.chartCovers(x.ch, 'Donations', 'F4:F10') && chartCats(x.ch).length === 7 && /castries/i.test(chartCats(x.ch)[0])) || 'Insert a pie chart using the district names (A3:A10) and totals (F3:F10).', hint: ['Ctrl lets you select two separate ranges.', 'Drag A3:A10, hold Ctrl and drag F3:F10 ▸ Insert ▸ Pie ▸ 2-D Pie.'], show: { tab: 'insert', cmd: 'chartpie' } },
    { t: '(b) Title the chart <b>Share of Hurricane Relief Donations</b>.', ok: K => K.charts().some(x => x.ch.type === 'pie' && /share/i.test(x.ch.title || '') && x.ch.showTitle !== false) || 'Give the pie the title Share of Hurricane Relief Donations.', hint: ['Double-click the title on the chart.', 'Click the title, select the text, type Share of Hurricane Relief Donations.'], show: { tab: 'chartformat', cmd: 'ctitle' } },
    { t: '(c) Show <b>data labels</b> as <b>percentages</b>.', ok: K => K.charts().some(x => x.ch.type === 'pie' && x.ch.labels === 'percent') || 'Turn on percentage data labels.', hint: ['Chart Design ▸ Add Chart Element ▸ Data Labels.', 'Add Chart Element ▸ Data Labels ▸ Percentage (or Quick Layout ▸ Layout with %).'], show: { tab: 'chartdesign', cmd: 'addelement' } },
    { t: '(d) Place the legend on the <b>Right</b>.', ok: K => K.charts().some(x => x.ch.type === 'pie' && x.ch.legend === 'right') || 'Set Legend ▸ Right.', hint: ['Legend is under Add Chart Element.', 'Add Chart Element ▸ Legend ▸ Right.'], show: { tab: 'chartdesign', cmd: 'addelement' } },
    { t: '(e) <b>Move</b> the chart to a <b>new sheet</b> named <b>Donations Chart</b>.', ok: K => { const s = K.sh('Donations Chart'); return (s && s.kind === 'chart' && s.chart && s.chart.type === 'pie') || 'Move the chart to a new sheet called Donations Chart.'; }, hint: ['Chart Design ▸ Move Chart (far right).', 'Click the chart ▸ Chart Design ▸ Move Chart ▸ New sheet: Donations Chart ▸ OK.'], show: { tab: 'chartdesign', cmd: 'movechart' } }
  ] },
{ id: 'l3-pivot', lvl: 3, title: 'Section Sales PivotTable', obj: 'Section III · advanced spreadsheet features: PivotTable', timer: 600, wb: () => wbCarnival({ revenue: true }), file: 'Carnival Costume Sales',
  brief: '<b>Task sheet.</b> The band leader wants revenue summarised by <b>Section</b> — without typing a single SUMIF. Build a <b>PivotTable</b>.',
  steps: [
    { t: '(a) Click inside the data and insert a <b>PivotTable</b> on a <b>New Worksheet</b> from <code>Sales!A4:E16</code>.', ok: K => wb.sheets.some(s => s.pivots.some(p => p.src.r1 === 3 && p.src.r2 >= 15 && p.src.c1 === 0 && p.src.c2 >= 4)) || 'Insert a PivotTable from A4:E16 on a new sheet.', hint: ['Insert ▸ PivotTable.', 'Click A5 ▸ Insert ▸ PivotTable ▸ check the range is Sales!$A$4:$E$16 ▸ New Worksheet ▸ OK.'], show: { tab: 'insert', cmd: 'pivot' } },
    { t: '(b) Put <b>Section</b> in <b>Rows</b> and <b>Revenue (Cg)</b> in <b>Values</b> (Sum).', ok: K => wb.sheets.some(s => s.pivots.some(p => p.rows[0] && /section/i.test(p.rows[0]) && p.vals.some(v => /revenue/i.test(v.f) && v.fn === 'sum'))) || 'Rows: Section; Values: Sum of Revenue (Cg).', hint: ['Tick the fields in the PivotTable Fields pane.', 'Tick Section (goes to Rows) and Revenue (Cg) (goes to Values as Sum).'], show: { el: '.pivotpane' } },
    { t: '(c) Add <b>Average of Unit Price (Cg)</b> as a second value.', ok: K => wb.sheets.some(s => s.pivots.some(p => p.vals.some(v => /unit price/i.test(v.f) && v.fn === 'average'))) || 'Add Unit Price (Cg) to Values and set it to Average.', hint: ['Tick Unit Price, then change its summary using Value Field Settings.', 'Tick Unit Price (Cg) ▸ click its ▾ in Values ▸ Value Field Settings… ▸ Average ▸ OK.'], show: { el: '.pivotpane' } },
    { t: '(d) Rename the PivotTable\'s sheet <b>Section Summary</b>.', ok: K => { const s = K.sh('Section Summary'); return (s && s.pivots.length > 0) || 'Rename the PivotTable sheet to Section Summary.'; }, hint: ['Double-click the sheet tab.', 'Double-click the new sheet\'s tab, type Section Summary, Enter.'], show: { el: '.stabs' } }
  ] },
{ id: 'l3-advfilter', lvl: 3, title: 'Big Donors in Castries', obj: 'Section III · spreadsheets: Advanced Filter with a criteria range', timer: 720, wb: () => wbHurricane({ log: true }), sheet: 'Log', file: 'Hurricane Relief Donations',
  brief: '<b>Task sheet.</b> Extract every <b>Castries</b> donation of <b>1000 or more</b> into a separate list, using a <b>criteria range</b> and Data ▸ <b>Advanced</b>. (This is the method examiners expect for "extract records meeting two criteria".)',
  steps: [
    { t: '(a) On <b>Log</b>, build the criteria range in <code>F1:G2</code>: headings <b>District</b> and <b>Amount (EC$)</b> (exactly as in the list), with <b>Castries</b> and <b>&gt;=1000</b> under them.', ok: K => (K.text('F1', 'Log') === 'District' && K.text('G1', 'Log') === 'Amount (EC$)' && /^castries$/i.test(K.text('F2', 'Log')) && K.text('G2', 'Log').replace(/\s/g, '') === '>=1000') || 'F1:G2 should read District | Amount (EC$) / Castries | >=1000.', hint: ['Copy the headings so they match exactly (Ctrl+C, Ctrl+V).', "Copy B1 to F1 and D1 to G1. In F2 type Castries, in G2 type >=1000."], show: { cell: 'F1' } },
    { t: '(b) Click in the list and use <b>Data ▸ Advanced</b>: List range <code>$A$1:$D$31</code>, Criteria range <code>$F$1:$G$2</code>, <b>Copy to another location</b> <code>$I$1</code>.', ok: K => { const s = K.sh('Log'); const exp = LOG.filter(l => l[1] === 'Castries' && l[3] >= 1000); if (K.text('I1', 'Log') !== 'Date' || K.text('J1', 'Log') !== 'District') return 'The headings should be copied to I1:L1.'; for (let i = 0; i < exp.length; i++) { if (K.v('L' + (i + 2), 'Log') !== exp[i][3]) return 'Row ' + (i + 2) + ' of the extract is wrong.'; } return (K.v('L' + (exp.length + 2), 'Log') === null) || 'The extract contains extra records.'; }, hint: ['Advanced is in Data ▸ Sort & Filter.', 'Click A2 ▸ Data ▸ Advanced ▸ Copy to another location ▸ List range $A$1:$D$31 ▸ Criteria range $F$1:$G$2 ▸ Copy to $I$1 ▸ OK.'], show: { tab: 'data', cmd: 'advanced' } },
    { t: '(c) In <code>F4</code> count these records with <b>COUNTIFS</b> (District = Castries and Amount ≥ 1000).', ok: K => (/^=COUNTIFS\(/.test(K.f('F4', 'Log')) && K.v('F4', 'Log') === LOG.filter(l => l[1] === 'Castries' && l[3] >= 1000).length) || 'F4 should use COUNTIFS (District = Castries and Amount >= 1000).', hint: ['COUNTIFS takes range, criteria, range, criteria.', 'F4: =COUNTIFS(B2:B31,"Castries",D2:D31,">=1000").'], show: { cell: 'F4' } }
  ] },
{ id: 'l3-stock', lvl: 3, title: 'Front Street Stock Report', obj: 'Section IV · advanced tabulation: formulae, functions & absolute references', timer: 900, wb: () => wbStock(), file: 'Front Street Electronics Stock',
  brief: '<b>Task sheet.</b> Complete the stock report for Front Street Electronics. Use cell references and the tax rate in <code>B2</code> — do not type numbers into formulas.',
  steps: [
    { t: '(a) <code>D5:D14</code> Selling Price = Cost × (1 + Markup %).', ok: K => colFormula(K, 'D', 5, 14, { must: [/\(1\+C\d+\)|\(C\d+\+1\)/], mustMsg: a => a + ' should use brackets: =B5*(1+C5).', exp: r => STOCK[r - 5][1] * (1 + STOCK[r - 5][2]) }), hint: ['Brackets make the addition happen first.', 'D5: =B5*(1+C5), fill down.'], show: { cell: 'D5' } },
    { t: '(b) <code>E5:E14</code> Tax = Selling Price × the rate in B2 (absolute).', ok: K => colFormula(K, 'E', 5, 14, { must: [/\$B\$2|TAXRATE/], mustMsg: a => a + ' must refer to $B$2.', exp: r => K.v('D' + r) * K.v('B2') }), hint: ['F4 makes B2 absolute.', 'E5: =D5*$B$2, fill down.'], show: { cell: 'E5' } },
    { t: '(c) <code>F5:F14</code> Price incl. Tax, rounded to 2 decimal places with <b>ROUND</b>.', ok: K => colFormula(K, 'F', 5, 14, { must: ['ROUND('], exp: r => XL.roundHalf(K.v('D' + r) + K.v('E' + r), 2) }), hint: ['ROUND(number, 2).', 'F5: =ROUND(D5+E5,2), fill down.'], show: { cell: 'F5' } },
    { t: '(d) <code>I5:I14</code> Status: <b>Reorder</b> if In Stock ≤ Reorder Level, otherwise <b>OK</b>.', ok: K => colFormula(K, 'I', 5, 14, { must: ['IF('], exp: r => STOCK[r - 5][3] <= STOCK[r - 5][4] ? 'Reorder' : 'OK' }), hint: ['Compare G with H using <=.', 'I5: =IF(G5<=H5,"Reorder","OK"), fill down.'], show: { cell: 'I5' } },
    { t: '(e) Format <code>D5:F14</code> as Currency <b>$</b> with 2 decimal places.', ok: K => { const bad = nfIs(K, 'D5:F14', nf => (nf.t === 'currency' || nf.t === 'accounting') && nf.sym === '$' && nf.dp === 2); return !bad || bad + ' is not $ with 2 decimals.'; }, hint: ['Format Cells ▸ Currency.', 'Select D5:F14 ▸ Ctrl+1 ▸ Currency ▸ Symbol $ ▸ 2 decimal places.'], show: { tab: 'home', cmd: 'numfmt' } },
    { t: '(f) In <code>F16</code> the highest price incl. tax (MAX); in <code>F17</code> the average (AVERAGE).', ok: K => (/MAX\(F5:F14\)/.test(K.f('F16')) && /AVERAGE\(F5:F14\)/.test(K.f('F17'))) || 'F16 =MAX(F5:F14), F17 =AVERAGE(F5:F14).', hint: ['Two separate functions.', 'F16: =MAX(F5:F14); F17: =AVERAGE(F5:F14).'], show: { cell: 'F16' } }
  ] },
{ id: 'l3-cruise', lvl: 3, title: 'Cruise Season Analysis', obj: 'Section IV · charts: % of total, IF & line chart', timer: 900, wb: () => wbCruise(), file: 'Cruise Arrivals 2025',
  brief: '<b>Task sheet.</b> The cruise port wants to know which months are <b>peak season</b>. Complete the analysis and chart passengers through the year.',
  steps: [
    { t: '(a) <code>D4:D15</code> Avg per Ship = Passengers ÷ Ships, rounded to 0 decimal places.', ok: K => colFormula(K, 'D', 4, 15, { must: ['ROUND('], exp: r => XL.roundHalf(CRUISE[r - 4][2] / CRUISE[r - 4][1], 0) }), hint: ['ROUND(C4/B4,0).', 'D4: =ROUND(C4/B4,0), fill down.'], show: { cell: 'D4' } },
    { t: '(b) In row 16 total Ships (<code>B16</code>) and Passengers (<code>C16</code>).', ok: K => (/SUM\(B4:B15\)/.test(K.f('B16')) && /SUM\(C4:C15\)/.test(K.f('C16'))) || 'B16 =SUM(B4:B15) and C16 =SUM(C4:C15).', hint: ['AutoSum.', 'B16: =SUM(B4:B15), C16: =SUM(C4:C15).'], show: { cell: 'B16' } },

  let charts = (sh.charts || []).slice();
  if (!used && !charts.length) { toast('This sheet is empty. Type some data first, then save it as a PDF.'); return null; }
  const land = pg.orient === 'landscape', S = 2;
  const CW = Math.round(((land ? 11 : 8.5) - 1.4) * 96), CH = Math.round(((land ? 8.5 : 11) - 1.5) * 96);
  let g;
  if (pg.area) { g = Object.assign({}, pg.area); charts = charts.filter(ch => ch.x >= sheetX(g.c1) && ch.x < sheetX(g.c2 + 1) && ch.y >= sheetY(g.r1) && ch.y < sheetY(g.r2 + 1)); }
  else {
    g = used ? { r1: 0, c1: 0, r2: used.r2, c2: used.c2 } : { r1: 0, c1: 0, r2: 0, c2: 0 };
    sh.merges.forEach(m => { if (m.r1 <= g.r2 && m.c1 <= g.c2) { g.r2 = Math.max(g.r2, m.r2); g.c2 = Math.max(g.c2, m.c2); } });
    for (const ch of charts) { let c = 0; while (c < COLS - 1 && sheetX(c + 1) < ch.x + ch.w) c++; let r = 0; while (r < ROWS - 1 && sheetY(r + 1) < ch.y + ch.h) r++; g.r2 = Math.max(g.r2, r); g.c2 = Math.max(g.c2, c); }
    for (const x of sh.cells.values()) {
      if (x.r > g.r2 || x.c > g.c2 || sh.hidR.has(x.r) || (view.showFormulas && x.f != null)) continue;
      const s = x.s || {}; if (s.wrap || s.rot || (s.h && s.h !== 'left') || sh.mergeAt(x.r, x.c)) continue;
      const fv = displayInfo(sh, x.r, x.c).fv; if (fv.num || fv.bool || fv.err || !fv.text) continue;
      const end = sheetX(x.c) + textW(String(fv.text), s) + 6; let c = x.c;
      while (c < COLS - 1 && sheetX(c + 1) < end && sh.isEmpty(x.r, c + 1) && !sh.mergeAt(x.r, c + 1)) c++;
      if (c > g.c2) g.c2 = Math.min(c, g.c2 + 12);
    }
  }
  const rows = [], cols = [];
  for (let r = g.r1; r <= g.r2; r++) if (!sh.hidR.has(r) && !sh.fltR.has(r)) rows.push(r);
  for (let c = g.c1; c <= g.c2; c++) if (!sh.hidC.has(c)) cols.push(c);
  const widths = ssPrintWidths(sh, cols), hw = pg.heads ? SS_HW : 0;
  let groups = [];
  if (pg.fit) groups = [cols];
  else { let cur = [], w = hw; for (const c of cols) { if (cur.length && w + widths[c] > CW) { groups.push(cur); cur = []; w = hw; } cur.push(c); w += widths[c]; } if (cur.length) groups.push(cur); }
  if (!groups.length) groups = [cols];
  const x0 = sheetX(g.c1), y0 = sheetY(g.r1), pages = [];
  const host = document.createElement('div'); host.setAttribute('aria-hidden', 'true');
  host.style.cssText = 'position:fixed;left:-12000px;top:0;z-index:-1;pointer-events:none;background:#fff';
  document.body.appendChild(host);
  try {
    let gx0 = 0;
    for (const grp of groups) {
      const gw = grp.reduce((a, c) => a + widths[c], 0);
      const el = document.createElement('div'); el.style.cssText = 'position:relative;display:inline-block;vertical-align:top;background:#fff';
      el.innerHTML = ssPrintTable(sh, rows, grp, widths, pg); host.appendChild(el);
      const tb = el.querySelector('table'), top = el.getBoundingClientRect().top;
      const cuts = [...tb.rows].map(tr => tr.getBoundingClientRect().bottom - top);
      const headH = pg.heads && cuts.length ? cuts[0] : 0;
      let W = tb.offsetWidth, H = tb.offsetHeight;
      for (const ch of charts) {
        const cx = ch.x - x0, cy = ch.y - y0;
        if (!pg.fit && !(cx >= gx0 && cx < gx0 + gw)) continue;
        const d = document.createElement('div'); const L = hw + cx - gx0, T = headH + cy;
        d.style.cssText = 'position:absolute;left:' + L + 'px;top:' + T + 'px;width:' + ch.w + 'px;height:' + ch.h + 'px';
        d.innerHTML = chartSVG(ch, ch.w, ch.h); el.appendChild(d);
        W = Math.max(W, L + ch.w); H = Math.max(H, T + ch.h);
      }
      el.style.width = W + 'px'; el.style.height = H + 'px';
      const cv = await SimSave.domToCanvas(el, { scale: S, bg: '#ffffff' });
      if (pg.fit) {
        const k = Math.min(1, CW / W, CH / H), p = ssPage(CW, CH, S);
        p.getContext('2d').drawImage(cv, 0, 0, cv.width, cv.height, 0, 0, Math.round(W * k * S), Math.round(H * k * S)); pages.push(p);
      } else {
        let y = 0;
        while (y < H - 1) {
          const off = y > 0 && headH ? headH : 0, avail = CH - off;
          let end = Math.min(H, y + avail);
          if (end < H) { const c2 = cuts.filter(v => v > y + 1 && v <= end).pop(); if (c2 && c2 > y + avail * 0.3) end = c2; }
          const p = ssPage(CW, CH, S), x = p.getContext('2d');
          if (off) x.drawImage(cv, 0, 0, cv.width, Math.round(headH * S), 0, 0, cv.width, Math.round(headH * S));
          const sy = Math.round(y * S), sh2 = Math.max(1, Math.min(cv.height - sy, Math.round((end - y) * S)));
          if (sh2 > 0) x.drawImage(cv, 0, sy, cv.width, sh2, 0, Math.round(off * S), cv.width, sh2);
          pages.push(p); y = end;
        }
      }
      gx0 += gw; el.remove();
    }
  } finally { host.remove(); }
  return SimSave.pdfFromCanvases(pages, { size: 'Letter', landscape: land, margin: 50.4, top: true, title });
}
/* File ▸ Save a Copy (also Export ▸ Create PDF/XPS, Export ▸ Change File Type and Print ▸ Microsoft Print to PDF) */
function ssSaveCopy(only) {
  if (ed) commitEdit();
  const grid = !!ws && ws.kind === 'grid', pg = (grid && ws.page) || {};
  const base = fileName || 'Book1', n = wb.sheets.length;
  const pdfNote = grid ? 'The active sheet "' + ws.name + '" as it prints: ' + (pg.orient === 'landscape' ? 'landscape' : 'portrait') + (pg.fit ? ', fit on one page' : '') + (pg.grid ? ', gridlines' : '') + (pg.heads ? ', row and column headings' : '') + ' · .pdf' : 'The chart on this chart sheet · .pdf';
  let formats = [
    { ext: 'xlsx', label: 'Excel Workbook (.xlsx)', note: 'Opens in Excel: all ' + n + ' sheet' + (n === 1 ? '' : 's') + ', with your values and formulas · .xlsx', make: async () => ssXlsxBlob() },
    { ext: 'csv', label: 'CSV (Comma delimited)', note: 'Values only, active sheet "' + (ws ? ws.name : '') + '" · .csv', make: async () => ssCsvBlob() },
    { ext: 'pdf', label: 'PDF', note: pdfNote, make: () => ssSheetPdf() }
  ];
  if (!grid) formats = formats.filter(f => f.ext !== 'csv');
  if (only) formats = formats.filter(f => f.ext === only);
  SimSave.dialog({ title: only === 'pdf' ? 'Create PDF' : only === 'xlsx' ? 'Download Excel Workbook' : 'Save a Copy', name: only === 'pdf' ? base + '_' + (ws ? ws.name : '') : base, sub: 'Download a real copy to your device to keep, print or hand in.', formats });
  ev('savecopy');
}
async function ssChartImg(ch, W, H) { try { const cv = await ssChartCanvas(ch, W, H); return '<p><img alt="' + esc(ch.title || 'Chart') + '" width="' + W + '" height="' + H + '" src="' + cv.toDataURL('image/png') + '"></p>'; } catch (e) { return ''; } }
/* the student's workbook for a Submit: every sheet (first 60 rows × 14 columns), its formulas and its charts */
async function ssWorkHTML() {
  let h = '';
  for (const sh of wb.sheets) {
    if (sh.kind !== 'grid') { if (sh.chart) h += '<h2>Chart sheet: ' + esc(sh.name) + '</h2>' + await ssChartImg(sh.chart, 600, 400); continue; }
    const g = sh.used(); if (!g && !sh.charts.length) continue;
    if (g) {
      const r2 = Math.min(g.r2, 59), c2 = Math.min(g.c2, 13);
      h += '<h2>Worksheet: ' + esc(sh.name) + '</h2><table><tr><th></th>';
      for (let c = 0; c <= c2; c++) h += '<th style="text-align:center">' + XL.colName(c) + '</th>';
      h += '</tr>';
      for (let r = 0; r <= r2; r++) {
        h += '<tr><th>' + (r + 1) + '</th>';
        for (let c = 0; c <= c2; c++) { const x = sh.get(r, c), f = XL.formatValue(wb.getValue(sh, r, c), x && x.s && x.s.nf), t = esc(((f.sym ? f.sym + ' ' : '') + f.text).trim()); h += '<td' + (f.num ? ' style="text-align:right"' : '') + '>' + (x && x.s && x.s.b && t ? '<b>' + t + '</b>' : t) + '</td>'; }
        h += '</tr>';
      }
      h += '</table>';
      if (g.r2 > r2 || g.c2 > c2) h += '<p><i>Only the first 60 rows and 14 columns are shown here. Save a copy of the workbook to hand in all of it.</i></p>';
      const fx = [...sh.cells.values()].filter(x => x.f != null).sort((a, b) => a.r - b.r || a.c - b.c);
      if (fx.length) {
        h += '<h3>Formulas in ' + esc(sh.name) + '</h3><table><tr><th>Cell</th><th>Formula</th><th>Shows</th></tr>' + fx.slice(0, 80).map(x => { const f = XL.formatValue(wb.getValue(sh, x.r, x.c), x.s && x.s.nf); return '<tr><td>' + ssA1(x.r, x.c) + '</td><td>' + esc(x.f) + '</td><td>' + esc(((f.sym ? f.sym + ' ' : '') + f.text).trim()) + '</td></tr>'; }).join('') + '</table>';
        if (fx.length > 80) h += '<p><i>…and ' + (fx.length - 80) + ' more formulas.</i></p>';
      }
    }
    for (const ch of sh.charts) h += '<h3>Chart: ' + esc(ch.title || 'Chart') + '</h3>' + await ssChartImg(ch, Math.min(600, ch.w || 480), Math.round(Math.min(600, ch.w || 480) * (ch.h || 288) / (ch.w || 480)));
  }
  return h;
}
/* "Submit my work" on the mission-complete panel */
async function ssSubmit() {
  if (!mission || !mission.completed) return;
  if (ed) commitEdit();
  const m = mission.m, res = mission.result || {}, btn = E('mSubmit');
  if (btn) btn.disabled = true;
  try {
    let h = '<p><b>Excel Lab mission:</b> ' + esc(m.title) + '<br><b>Objective:</b> ' + esc(m.obj) + '<br><b>Result:</b> ' + res.stars + ' of 3 stars · +' + res.xp + ' XP</p>';
    h += '<h2>Steps completed</h2><ol>' + m.steps.map((s, k) => '<li>' + s.t + (mission.done[k] ? ' ✓' : '') + '</li>').join('') + '</ol>';
    h += await ssWorkHTML();
    SimSave.submit({ title: m.title, html: h, score: res.stars, max: 3 });
  } catch (e) { console.warn(e); toast('Sorry, your work could not be gathered. Use File ▸ Save a Copy instead.'); }
  finally { if (btn) btn.disabled = false; }
}

/* "Submit my work" in free practice: hand in an open task the teacher set (task title + optional note + the workbook) */
function ssHasWork() { return !!wb && wb.sheets.some(sh => sh.kind !== 'grid' ? !!sh.chart : (!!sh.used() || sh.charts.length > 0)); }
function ssPracticeSubmit() {
  if (ed) commitEdit();
  if (!ssHasWork()) { dialog({ title: 'Submit my work', body: '<p>Add something to your workbook first, then submit.</p>', buttons: [{ label: 'OK', pri: true }] }); return; }
  dialog({ title: 'Submit my work', width: 460,
    body: '<label class="f" for="psTask">What task is this for?</label><input type="text" id="psTask" value="Free practice · Excel Lab" placeholder="e.g. Paper 02 Question 3 spreadsheet" style="width:100%">' +
      '<label class="f" for="psNote" style="margin-top:10px">Note to my teacher (optional)</label><textarea id="psNote" rows="3" style="width:100%;font:inherit" placeholder="e.g. I used COUNTIF for part (c)."></textarea>' +
      '<p class="note">Your teacher receives every sheet of <b>' + esc(fileName || 'Book1') + '</b> with its formulas and charts.</p>',
    onOpen: d => setTimeout(() => { const t = q(d, '#psTask'); if (t) { t.focus(); t.select(); } }, 30),
    buttons: [{ label: '📤 Submit', pri: true, fn: d => { const t = q(d, '#psTask').value.trim() || 'Free practice · Excel Lab', n = q(d, '#psNote').value.trim(); setTimeout(() => ssPracticeSend(t, n), 10); } }, { label: 'Cancel' }] });
}
async function ssPracticeSend(title, note) {
  try {
    let h = '<p><b>Task:</b> ' + esc(title) + '<br><b>Tool:</b> Excel Lab · free practice<br><b>Workbook:</b> ' + esc(fileName || 'Book1') + '.xlsx (' + wb.sheets.length + ' sheet' + (wb.sheets.length === 1 ? '' : 's') + ')<br><b>Date:</b> ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + '</p>';
    if (note) h += '<p><b>Note to my teacher:</b> ' + esc(note).replace(/\n/g, '<br>') + '</p>';
    h += await ssWorkHTML();
    ev('practicesubmit');
    SimSave.submit({ title, html: h });
  } catch (e) { console.warn(e); toast('Sorry, your work could not be gathered. Use File ▸ Save a Copy instead.'); }
}

/* ===== boot ===== */
function initCourse() {
  loadProgress();
  E('dialDown').onclick = () => dial(-1); E('dialUp').onclick = () => dial(1);
  $$('.soundBtn').forEach(b => { b.textContent = soundIcon(); b.onclick = toggleSound; });
  E('courseMenuBtn').onclick = () => openMenu([{ label: '🏠 Home', fn: () => confirmLeave(showStart) }, { label: '🎯 Missions (this level)', fn: () => confirmLeave(() => showLevel(curLevel)) }, { label: '🧪 Free practice', fn: () => confirmLeave(() => startFree()) }, { sep: true }, { label: '❓ How to play', fn: showHowTo }, { label: '⌨️ Quick reference', fn: showQuickRef }, { label: '🏅 Badges & progress', fn: showProgress }, { label: 'ℹ️ About', fn: showAbout }], E('courseMenuBtn'));
  E('winClose').onclick = () => confirmLeave(showStart);
  E('qatSave').innerHTML = IC.save; E('qatUndo').innerHTML = IC.undo; E('qatRedo').innerHTML = IC.redo;
  E('qatSave').onclick = () => run('save'); E('qatUndo').onclick = undo; E('qatRedo').onclick = redo;
  E('searchBtn').onclick = () => toast('Tip: use the ☰ Menu ▸ Quick reference to find any command.');
  E('smallBanner').querySelector('button').onclick = () => E('smallBanner').classList.remove('show');
  if (innerWidth < 600) E('smallBanner').classList.add('show');
  const P = new URLSearchParams(location.search);
  const mid = P.get('mission'), lv = P.get('level'), md = P.get('mode');
  let sv = null; if (window.GameSave) { GameSave.register([STORE, XL_SESSION]); GameSave.persist({ key: XL_SESSION, welcome: false, every: 5000, get: xlSessionGet, set: v => { sv = v; } });
    GameSave.onReset(() => { try { const u = new URLSearchParams(location.search); u.delete('mission'); u.delete('mode'); const qs = u.toString(); history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) { } }); }
  const resume = () => { if (!xlRestore(sv)) return false; setTimeout(() => { try { GameSave.toast('Welcome back! Your work was restored.'); } catch (e) { } }, 400); return true; };
  if (mid && MISSIONS.some(m => m.id === mid)) { if (!(sv && sv.mission && sv.mission.id === mid && resume())) startMission(mid); }
  else if (md === 'free') { if (!(sv && !sv.mission && resume())) startFree(); }
  else if (lv && /^[123]$/.test(lv)) showLevel(+lv);
  else if (!(sv && resume())) showStart();
}
window.addEventListener('DOMContentLoaded', () => { initApp(); initRibbon(); initCharts(); initCourse(); });
