<!doctype html>
<html lang="en" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Cell by Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a spreadsheet workbook — level map on the left like sheet tabs turned sideways, the exercise as the active sheet. */
:root{
  --paper:#f5f8f3; --card:#ffffff; --ink:#18233a; --muted:#5b6678;
  --grid:#d6ded3; --hdr:#e8eee6;
  --sel:#14794c; --sel-soft:#dcefe4;
  --sun:#ffcd3c; --sun-soft:#fff3c7;
  --sky:#2d66cc; --sky-soft:#e1eafb;
  --coral:#d9472f; --coral-soft:#fde4dd;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111814; --card:#18211c; --ink:#e7efe9; --muted:#9fb0a6;
  --grid:#2c3a32; --hdr:#1f2a24;
  --sel:#43c185; --sel-soft:#1d3a2b;
  --sun:#ffd45a; --sun-soft:#3a3218;
  --sky:#7aa6f5; --sky-soft:#1c2a45;
  --coral:#ff7b63; --coral-soft:#3d1f19; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111814; --card:#18211c; --ink:#e7efe9; --muted:#9fb0a6;
  --grid:#2c3a32; --hdr:#1f2a24;
  --sel:#43c185; --sel-soft:#1d3a2b;
  --sun:#ffd45a; --sun-soft:#3a3218;
  --sky:#7aa6f5; --sky-soft:#1c2a45;
  --coral:#ff7b63; --coral-soft:#3d1f19; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:96px 28px;background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
code,.mono{font-family:var(--mono)}

.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Header styled as a formula bar */
.top{background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;box-shadow:0 2px 0 var(--grid)}
.brandbar{display:flex;align-items:stretch;gap:0;flex:1 1 360px;min-width:0;border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.brandbar .nb{font-family:var(--mono);font-size:.85rem;padding:8px 12px;background:var(--hdr);border-right:1px solid var(--grid);display:flex;align-items:center}
.brandbar .fxl{font-family:var(--mono);font-style:italic;color:var(--muted);padding:8px 10px;border-right:1px solid var(--grid);display:flex;align-items:center}
.brandbar h1{font-size:clamp(1.5rem,4vw,2.1rem);padding:4px 14px;display:flex;align-items:center;gap:10px;min-width:0}
.brandbar h1 small{font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px;min-width:200px;flex:0 1 260px}
.prog-label{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.prog-track{height:12px;border-radius:99px;background:var(--hdr);border:1px solid var(--grid);overflow:hidden}
.prog-fill{height:100%;background:var(--sel);border-radius:99px;transition:width .5s}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Level map */
.map{background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.map{position:static}}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-head{display:flex;align-items:center;gap:10px}
.lvl-chip{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;border:2px solid var(--ink);color:#18233a;flex:none}
.lvl-title{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1}
.lvl-sub{font-size:.78rem;color:var(--muted)}
.lvl.locked .lvl-chip{background:var(--hdr)!important;color:var(--muted);border-color:var(--grid)}
.lvl.locked .lvl-title{color:var(--muted)}
.exlist{list-style:none;margin:4px 0 0;padding:0 0 0 14px;border-left:2px dashed var(--grid);margin-left:16px;display:flex;flex-direction:column;gap:4px}
.exbtn{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:8px;font-size:.9rem}
.exbtn:hover:not(:disabled){background:var(--hdr)}
.exbtn:disabled{color:var(--muted);cursor:not-allowed}
.exbtn.cur{border-color:var(--sel);background:var(--sel-soft);font-weight:600}
.exbtn .ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.72rem;font-family:var(--mono);border:1px solid var(--grid);background:var(--paper);flex:none}
.exbtn.done .ico{background:var(--sel);border-color:var(--sel);color:var(--card)}

/* Exercise card */
.ex{background:var(--card);border:1px solid var(--grid);border-radius:16px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:18px;min-width:0}
.ex-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-start}
.ex-head > div{flex:1 1 300px;min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0 0 4px}
.ex h2{font-size:clamp(1.7rem,4vw,2.3rem)}
.concept{margin:6px 0 0;font-size:1.02rem;max-width:60ch}
.concept b{background:var(--sun-soft);padding:0 4px;border-radius:4px}
.story{margin:0;padding:12px 14px;border-radius:10px;background:var(--sky-soft);font-size:.95rem;max-width:72ch}

/* Dial */
.dial{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:99px;padding:6px 16px 6px 6px;background:var(--card);flex:none}
.knob{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,var(--card),var(--hdr));position:relative;flex:none}
.knob::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px dotted var(--grid)}
.knob i{position:absolute;left:50%;top:5px;width:4px;height:16px;margin-left:-2px;border-radius:3px;background:var(--coral);transform-origin:50% 17px;transform:rotate(40deg);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.dial[aria-checked="true"] .knob i{transform:rotate(-40deg);background:var(--sel)}
.dial-txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.dial-txt b{font-family:var(--display);font-size:1.05rem}
.dial-txt span{font-size:.75rem;color:var(--muted)}

.ask{font-size:1.08rem;margin:0;max-width:65ch}
.ask b{font-family:var(--mono);font-weight:700;background:var(--sun-soft);padding:0 4px;border-radius:4px}

/* Spreadsheet */
.xl{border:1px solid var(--grid);border-radius:10px;overflow:hidden;background:var(--card)}
.xl-bar{display:flex;align-items:stretch;border-bottom:1px solid var(--grid);background:var(--hdr)}
.xl-bar .namebox{font-family:var(--mono);font-size:.85rem;padding:8px 10px;min-width:58px;border-right:1px solid var(--grid);background:var(--card);display:flex;align-items:center}
.xl-bar .fx{font-family:var(--mono);font-style:italic;color:var(--muted);padding:8px 10px;border-right:1px solid var(--grid);display:flex;align-items:center}
.xl-bar input{flex:1;min-width:0;border:0;background:var(--card);color:var(--ink);font-family:var(--mono);font-size:1rem;padding:8px 10px}
.xl-bar input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--sel)}
.xl-bar input[readonly]{color:var(--muted)}
.xl-scroll{overflow-x:auto}
.xl table{border-collapse:collapse;font-size:.92rem;min-width:100%}
.xl th{background:var(--hdr);color:var(--muted);font-weight:500;font-size:.78rem;border:1px solid var(--grid);padding:3px 6px;font-family:var(--mono)}
.xl th.rh{width:34px}
.xl th.on{background:var(--sel-soft);color:var(--sel);font-weight:700}
.xl td{border:1px solid var(--grid);padding:6px 10px;min-width:96px;height:34px;white-space:nowrap;position:relative;font-variant-numeric:tabular-nums}
.xl td.num{text-align:right}
.xl td.hd{font-weight:600}
.xl td.tgt{background:var(--sun-soft);outline:2px dashed var(--sun);outline-offset:-3px;font-family:var(--mono)}
.xl td.hl{background:var(--sun-soft)}
.xl td.sel{outline:3px solid var(--sel);outline-offset:-3px;z-index:1}
.xl td.ok{background:var(--sel-soft);outline:2px solid var(--sel);outline-offset:-3px;font-weight:700}
.xl.clicky td{cursor:pointer}
.xl.clicky td:hover{background:var(--hdr)}
.xl.pointy td:not(.tgt){cursor:copy}
.xl-tip{font-size:.8rem;color:var(--muted);padding:6px 10px;border-top:1px solid var(--grid);background:var(--hdr)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:2px solid var(--grid);background:var(--card);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:.95rem;overflow-wrap:anywhere}
.choice[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft)}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);border-radius:10px;padding:10px 20px;font-weight:600;background:var(--card);box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--sel);color:var(--card);border-color:var(--sel);box-shadow:0 3px 0 color-mix(in srgb,var(--sel) 60%,#000)}
.btn.sun{background:var(--sun);color:#18233a}
.btn.ghost{box-shadow:none;border-width:1px;border-color:var(--grid);font-weight:500}
.next{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

.fb{border-radius:10px;padding:12px 14px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb.good{background:var(--sel-soft);border:1px solid var(--sel)}
.fb.bad{background:var(--coral-soft);border:1px solid var(--coral)}
.fb .tag{font-family:var(--display);font-weight:800;font-size:1.05rem;flex:none}
.fb.good .tag{color:var(--sel)} .fb.bad .tag{color:var(--coral)}
.fb .hint{display:block;margin-top:4px;color:var(--muted)}

/* Step self-check */
.steps{border:1px solid var(--grid);border-radius:12px;overflow:hidden}
.steps h3{font-size:1.15rem;padding:12px 14px;background:var(--hdr);border-bottom:1px solid var(--grid)}
.steps h3 span{display:block;font-family:var(--body);font-size:.82rem;font-weight:400;color:var(--muted);margin-top:2px}
.steps ol{list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-bottom:1px solid var(--grid)}
.steps li:last-child{border-bottom:0}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--card);font-size:.8rem;font-weight:600;flex:none}
.steps .st{flex:1 1 200px;min-width:0}
.steps .st code{background:var(--hdr);padding:1px 5px;border-radius:4px;font-size:.88em}
.yn{display:flex;gap:6px}
.yn button{border:1.5px solid var(--grid);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.85rem}
.yn button.y[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--card)}
.yn button.n2[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--card)}

/* Dial-down zone */
.easy{border:2px dashed var(--sel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;background:color-mix(in srgb,var(--sel-soft) 45%,var(--card))}
.easy h3{font-size:1.35rem}
.bites{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.bites li{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:10px 12px;font-size:.92rem;display:flex;gap:10px}
.bites li b{font-family:var(--display);font-size:1.3rem;line-height:1;color:var(--sel)}

/* Modals */
.modal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:18px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 var(--ink)}
.sheet h2{font-size:1.8rem}
.sheet .lead{margin:0;font-size:1.02rem}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--grid)}
.dots i.on{background:var(--sel)}
.tut-say{font-size:1.05rem;margin:0}
.caret{display:inline-block;width:2px;height:1em;background:var(--sel);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Celebration */
.win{text-align:center;align-items:center}
.win .stars{display:flex;gap:8px;justify-content:center}
.win .stars svg{width:48px;height:48px}
.win p{max-width:46ch;margin:0 auto}

.foot{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);padding:4px 2px}
.foot label{display:flex;gap:8px;align-items:center;cursor:pointer}
.foot button{background:none;border:1px solid var(--grid);border-radius:8px;padding:5px 10px;font-size:.85rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  }
  function saveAll() {
    if (resetting || !LS) return;

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

/* ---------- State ---------- */
const KEY='cellbycell-v1';
let state={done:{},cur:'b1',teacher:false,easyNext:false};

/* saved progress (this device): finished exercises, the current exercise and a half-typed answer. Start over clears it. */
if(!state.done||typeof state.done!=='object'||Array.isArray(state.done)) state.done={};
if(typeof state.cur!=='string') state.cur='b1';
if(state.draft&&(typeof state.draft!=='object'||typeof state.draft.id!=='string'||typeof state.draft.v!=='string')) state.draft=null;
if(window.GameSave) GameSave.register([KEY]);
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };
const idxOf=id=>ALL.findIndex(e=>e.id===id);
const unlocked=e=>idxOf(e.id)===0||!!state.done[ALL[idxOf(e.id)-1].id]||!!state.done[e.id];
const levelUnlocked=L=>unlocked(L.ex[0]);
let view={};

/* ---------- Rendering ---------- */
const $=s=>document.querySelector(s);
const ICON_LOCK='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M4 5V3.5a2 2 0 0 1 4 0V5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
function renderMap(){
  const n=Object.keys(state.done).filter(k=>ALL.some(e=>e.id===k)).length;
  $('#progTxt').textContent=`${n} / ${ALL.length}`; $('#progFill').style.width=(n/ALL.length*100)+'%';
  $('#map').innerHTML=LEVELS.map((L,li)=>{
    const lu=levelUnlocked(L), dn=L.ex.filter(e=>state.done[e.id]).length;
    return `<section class="lvl ${lu?'':'locked'}"><div class="lvl-head"><span class="lvl-chip" style="background:${L.color}">${li+1}</span><div><div class="lvl-title">${L.name}</div><div class="lvl-sub">${lu?`${dn} of ${L.ex.length} done`:'Finish level '+li+' to unlock'}</div></div></div>
    <ol class="exlist">${L.ex.map((e,ei)=>{ const u=unlocked(e), d=state.done[e.id];
      return `<li><button type="button" class="exbtn ${d?'done':''} ${state.cur===e.id?'cur':''}" data-go="${e.id}" ${u?'':'disabled'}><span class="ico">${d?'✓':u?ei+1:ICON_LOCK}</span>${e.title}</button></li>`; }).join('')}</ol></section>`;

}
function go(id){ state.cur=id; save(); renderMap(); renderEx(); $('#main').scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }

function renderEx(){
  const ex=ALL[idxOf(state.cur)]||ALL[0]; const L=LEVELS[ex.li];
  view={ex,wrong:0,solved:!!state.done[ex.id],mode:state.easyNext?'easy':'full',steps:{}};
  state.easyNext=false; save();
  const main=$('#main');
  main.innerHTML=`<article class="ex">
    <header class="ex-head">
      <div><p class="eyebrow">${L.name} · Exercise ${ex.ei+1} of ${L.ex.length}</p><h2>${ex.title}</h2><p class="concept">${ex.concept}</p></div>
      <button class="dial" id="dial" type="button" role="switch" aria-checked="false" aria-label="Break it down into smaller steps">
        <span class="knob"><i></i></span><span class="dial-txt"><b id="dialLbl">Full challenge</b><span>Turn to break it down</span></span></button>
    </header>
    <p class="story">${ex.story}</p>
    <section class="easy" id="easyZone" hidden></section>
    <section id="fullZone" style="display:flex;flex-direction:column;gap:16px"></section>
  </article>`;
  $('#dial').onclick=()=>setMode(view.mode==='full'?'easy':'full');
  buildFull(); setMode(view.mode,true);
}
function buildFull(){
  const ex=view.ex, z=$('#fullZone'); z.innerHTML='';
  if(view.solved){
    const t=buildTask(z,ex.task,'main-'+ex.id,()=>{});
    if(ex.task.type==='click') t.sheet.wrap.querySelector(`td[data-a="${ex.task.sol}"]`).classList.add('ok');
    else if(ex.task.type!=='choice'){ t.sheet.input.value=ex.task.type==='value'?String(ex.task.sol):ex.task.sol; t.sheet.showResult(evaluate(String(ex.task.type==='value'?ex.task.sol:ex.task.sol),getter(ex.task))); }
    t.sheet.lock(); z.querySelector('.actions').hidden=true;
    const fb=document.createElement('div'); z.appendChild(fb); feedback(fb,true,'You already finished this one. Nice work!');
    addSteps(z,true); addNext(z); return;
  }
  const mainT=buildTask(z,ex.task,'main-'+ex.id,(r,fb)=>{
    if(r.ok){
      view.solved=true; state.done[ex.id]=true; if(state.draft&&state.draft.id===ex.id) state.draft=null; save(); renderMap();

  const inp=mainT&&mainT.sheet&&mainT.sheet.input;
  if(inp&&!inp.readOnly&&(ex.task.type==='formula'||ex.task.type==='value')){
    if(state.draft&&state.draft.id===ex.id&&state.draft.v){ inp.value=state.draft.v; const tc=mainT.sheet.wrap.querySelector(`td[data-a="${ex.task.target}"]`); if(tc) tc.textContent=state.draft.v; }
    let dt=null; const keep=()=>{ clearTimeout(dt); dt=setTimeout(()=>{ if(view.ex!==ex||view.solved) return; state.draft=inp.value.trim()?{id:ex.id,v:inp.value}:null; save(); },400); };
    inp.addEventListener('input',keep); mainT.sheet.wrap.addEventListener('mouseup',keep);

function addSteps(z,right){
  const ex=view.ex; let box=z.querySelector('.steps');
  if(!box){ box=document.createElement('div'); box.className='steps'; z.appendChild(box); }
  box.innerHTML=`<h3>${right?'Did you do each step yourself?':'Which step went wrong?'}<span>${right?'Tap Yes for each step you got right. Tap No and a mini tutorial will show you how.':'Go through each step. Tap No on any step you are not sure about and a mini tutorial will open.'}</span></h3>

  box.querySelectorAll('.y').forEach(b=>b.onclick=()=>{ view.steps[b.dataset.s]='y'; addSteps(z,right); });
  box.querySelectorAll('.n2').forEach(b=>b.onclick=()=>{ view.steps[b.dataset.s]='n'; addSteps(z,right); openTutorial(ex,+b.dataset.s); });

function addNext(z){
  if(z.querySelector('.nextrow')) return;

  row.innerHTML=`<button class="btn go next" type="button">${last?`Finish ${L.name}`:'Next exercise'} →</button>`;

function setMode(m,initial){

/* ---------- Mini tutorial ---------- */
let tut={ex:null,step:0,frame:0,timer:null};
function openTutorial(ex,i){ tut={ex,step:i,frame:0,timer:null}; $('#tut').hidden=false; drawTut(); $('#tutNext').focus(); }
function drawTut(){
  clearInterval(tut.timer);
  const s=tut.ex.steps[tut.step], frames=3, f=tut.frame;
  $('#tutTitle').innerHTML=`Step ${tut.step+1}: ${s.t}`;
  $('#tutDots').innerHTML=Array.from({length:frames},(_,i)=>`<i class="${i===f?'on':''}"></i>`).join('');
  const body=$('#tutBody'); body.innerHTML='';
  if(f===0){ body.innerHTML=`<p class="tut-say"><b>What this step means:</b> ${s.how}</p>`; }
  if(f===1){
    body.innerHTML=`<p class="tut-say"><b>Watch:</b> ${s.bar?'see it typed into the formula bar.':'see where it is on the sheet.'}</p>`;

    if(s.bar){
      const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let k=0;
      if(reduce) sh.setBar(s.bar); else tut.timer=setInterval(()=>{ k++; sh.setBar(s.bar.slice(0,k)); if(k>=s.bar.length) clearInterval(tut.timer); },140);
    } else sh.setBar('');
  }
  if(f===2){ body.innerHTML=`<p class="tut-say"><b>Your turn.</b> Close this, then try step ${tut.step+1} again in the sheet: <span class="st">${s.t}</span>.</p>`; }
  $('#tutBack').style.visibility=f===0?'hidden':'visible';
  $('#tutNext').textContent=f===frames-1?'Got it, let me try':'Next';
}
$('#tutNext').onclick=()=>{ if(tut.frame<2){tut.frame++;drawTut();} else { clearInterval(tut.timer); $('#tut').hidden=true; document.querySelector('#fullZone input:not([readonly])')?.focus(); } };
$('#tutBack').onclick=()=>{ if(tut.frame>0){tut.frame--;drawTut();} };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#tut').hidden){clearInterval(tut.timer);$('#tut').hidden=true;} } });

  if(window.GameSave){ GameSave.startOver(); return; }
