.foot-nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

  /* Clickable prototype as a .zip: one web page per screen (index.html is screen 1), linked the way the prototype is. */
  function protoZip() {
    var pr = S.stage === 7, w = WF(), s = w.set, keep = w.sel; w.sel = null;

        files.push({ name: file(si), data: '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + esc(name) + ': ' + esc(sc.name) + '</title>\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n<h1>' + esc(name) + '</h1>\n' + nav + '\n<div class="phone"><div class="notch"></div><div class="scr t' + s.text + (s.contrast === 'high' ? ' hc' : '') + '">' + (scr || '<p style="color:#6a7598">Empty screen.</p>') + '</div></div>\n<div class="cap">' + (si + 1) + '. ' + esc(sc.name) + '</div>\n<p class="small">Clickable prototype: tap the linked buttons, cards, lists or the tab bar.</p>\n</body>\n</html>\n' });

    } finally { w.sel = keep; }
    return SimSave.zip(files);
  }

  /* ---------- Render ---------- */
  var VIEWS = [stage0, stage1, stage2, stage3, stage4, stage5, stage6, stage7];
  function render(focusMain) {
    if (!S.brief && S.stage !== 7) S.stage = 0;
    var ae = document.activeElement, fk = ae && ae.getAttribute && ae.getAttribute('data-act') ? [ae.getAttribute('data-act'), ae.getAttribute('data-arg')] : null;

  }
  window.addEventListener('resize', function () { if (S.stage === 1) drawLines(); });

  /* ---------- Events ---------- */
  function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return false; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; return true; }
  function chipTap(id) {
    if (U.linkMode) {
      if (!S.eco.place[id]) { say('Place this player on the map before connecting it.'); U.linkA = null; return; }

      var k = relKey(U.linkA, id);

      U.linkA = null; checkEcoDone(); return;

    U.selP = U.selP === id ? null : id;
  }
  function placeP(id, z) {
    if (z) S.eco.place[id] = z; else { delete S.eco.place[id]; S.eco.links = S.eco.links.filter(function (l) { return l[0] !== id && l[1] !== id; }); }
    U.selP = null; checkEcoDone(); say(pname(id) + (z ? ' placed in ' + zoneName(z) : ' returned to tray'));
  }
  function checkEcoDone() {
    if (!S.eco.checked) return;
    var right = PLAYERS.filter(function (p) { var z = S.eco.place[p.id]; return z && (z === p.z || z === p.alt); }).length;
    var strong = S.eco.links.filter(function (l) { return REL[relKey(l[0], l[1])]; }).length;
    if (right === 10 && strong >= 5) S.done[1] = true; else delete S.done[1];
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    var act = t.getAttribute('data-act'), arg = t.getAttribute('data-arg'), w = WF(), focusMain = false; if (act !== 'prsubmit') U.prMsg = 0;
    switch (act) {
      case 'go': S.stage = Number(arg); U.selP = null; U.linkA = null; focusMain = true; break;
      case 'reset':
        if (window.GameSave) { GameSave.startOver(); return; }
        if (t.getAttribute('data-confirm') !== '1') { t.setAttribute('data-confirm', '1'); t.textContent = 'Tap again to erase all'; setTimeout(function () { t.removeAttribute('data-confirm'); t.textContent = 'Start over'; }, 3000); return; }
        S = fresh(); U = { selP: null, linkMode: false, linkA: null, pendingBrief: null, shock: '' }; try { localStorage.removeItem(KEY); } catch (er) { } t.textContent = 'Start over'; t.removeAttribute('data-confirm'); focusMain = true; break;
      case 'brief':
        if (S.brief === arg) { S.stage = 1; focusMain = true; break; }
        if (S.brief && hasProgress()) { U.pendingBrief = arg; break; }
        initBrief(arg); focusMain = true; break;
      case 'briefyes': initBrief(U.pendingBrief); U.pendingBrief = null; focusMain = true; break;
      case 'briefno': U.pendingBrief = null; break;
      case 'chip': chipTap(arg); break;
      case 'place': if (U.selP) placeP(U.selP, arg); break;
      case 'totray': if (U.selP) placeP(U.selP, null); break;
      case 'linkmode': U.linkMode = !U.linkMode; U.linkA = null; U.selP = null; break;
      case 'unlink': S.eco.links.splice(Number(arg), 1); checkEcoDone(); break;
      case 'ecocheck': S.eco.checked = true; checkEcoDone(); say('Ecosystem checked.'); break;
      case 'purpose': S.concept.purpose = Number(arg); break;
      case 'persona': var pi = Number(arg), ps = S.concept.personas, ix = ps.indexOf(pi);
        if (ix > -1) ps.splice(ix, 1); else { if (ps.length >= 2) ps.shift(); ps.push(pi); } break;
      case 'feature': var fs = S.concept.features, fi = fs.indexOf(arg);
        if (fi > -1) fs.splice(fi, 1); else if (fs.length < 3) fs.push(arg); else say('You already have three features. Remove one first.'); break;
      case 'platform': S.concept.platform = arg; break;
      case 'conceptfb': S.concept.fbShown = true; break;
      case 'wfscreen': w.cur = Number(arg); w.sel = null; break;
      case 'wfadd':
        var sc = w.screens[w.cur];

        var nc = { t: arg, label: '' };
        if (arg === 'button') { nc.label = 'Open'; nc.big = false; nc.link = ''; }
        if (arg === 'card' || arg === 'list') nc.link = '';
        if (arg === 'image') nc.alt = '';
        var tabAt = -1; sc.comps.forEach(function (c, i) { if (c.t === 'tabs') tabAt = i; });
        if (arg === 'tabs' && tabAt > -1) { say('This screen already has a tab bar.'); break; }
        if (arg !== 'tabs' && tabAt > -1 && tabAt === sc.comps.length - 1) { sc.comps.splice(tabAt, 0, nc); w.sel = tabAt; }
        else { sc.comps.push(nc); w.sel = sc.comps.length - 1; }
        say(arg + ' added'); break;
      case 'wfsel': w.sel = w.sel === Number(arg) ? null : Number(arg); break;
      case 'wfup': if (w.sel !== null && move(w.screens[w.cur].comps, w.sel, -1)) w.sel--; break;
      case 'wfdown': if (w.sel !== null && move(w.screens[w.cur].comps, w.sel, 1)) w.sel++; break;
      case 'wfdel': if (w.sel !== null) { w.screens[w.cur].comps.splice(w.sel, 1); w.sel = null; } break;
      case 'proto': w.proto = !w.proto; w.pcur = w.cur; break;
      case 'pgo': if (w.proto) { w.pcur = Number(arg); say('Now on ' + w.screens[w.pcur].name); } else { w.cur = Number(arg); } break;
      case 'audit': w.audited = true; say('UX audit complete.'); break;
      case 'glyph': S.aso.glyph = arg; break;
      case 'shotup': move(S.aso.order, Number(arg), -1); break;
      case 'shotdown': move(S.aso.order, Number(arg), 1); break;
      case 'asoscore': S.aso.scored = true; say('Listing scored.'); break;
      case 'model': S.money.model = arg; var mm = model(arg); S.money.val = mm.slider ? mm.slider.def : null; break;
      case 'channel': var ch = S.money.channels, ci = ch.indexOf(arg); if (ci > -1) ch.splice(ci, 1); else ch.push(arg); break;
      case 'seq': var sq = S.money.seq, si = sq.indexOf(Number(arg)); if (si > -1) sq.splice(si); else sq.push(Number(arg)); break;
      case 'seqreset': S.money.seq = []; break;

      case 'prdel': if (w.screens.length > 1) { var dc = w.cur; w.screens.splice(dc, 1); w.screens.forEach(function (sc) { sc.comps.forEach(function (c) { if (c.link !== undefined && c.link !== '') { var L = Number(c.link); c.link = L === dc ? '' : L > dc ? L - 1 : L; } }); }); w.cur = Math.min(dc, w.screens.length - 1); w.pcur = 0; w.sel = null; say('Screen deleted'); } break;
      case 'prclear': if (t.getAttribute('data-confirm') !== '1') { t.setAttribute('data-confirm', '1'); t.textContent = 'Tap again to clear'; setTimeout(function () { t.removeAttribute('data-confirm'); t.textContent = 'Start a blank wireframe'; }, 3000); return; } S.pr = null; prInit(); U.prSub = false; U.prMsg = 0; say('Blank wireframe ready'); break;
      case 'prsubmit': if (prEmpty()) { U.prMsg = 1; U.prSub = false; say('Add something to your design first, then submit.'); } else { U.prMsg = 0; U.prSub = true; U.focusTask = true; } break;
      case 'prcancel': U.prSub = false; break;
      case 'prgo': var tk = ($('#prTask') || {}).value, nt = ($('#prNote') || {}).value; U.prSub = false; U.prTask = null; U.prNote = ''; practiceSend((tk || '').trim() || PR_DEF, (nt || '').trim()); break;
      case 'prsave': saveCopyWf(); return;
      case 'download': download(); return;
      case 'savecopy': saveCopyPitch(); return;
      case 'savewf': saveCopyWf(); return;
      case 'submit': submitWork(); return;
      case 'print': try { window.print(); } catch (er) { } return;
      default: return;
    }
    render(focusMain);
  });

  document.addEventListener('input', function (e) {
    var t = e.target, k = t.getAttribute('data-in'); if (!k) return;
    var w = WF(), arg = t.getAttribute('data-arg'), comp = w.screens && w.sel !== null ? w.screens[w.cur].comps[w.sel] : null;
    switch (k) {
      case 'aso':
        S.aso[arg] = t.value;
        var c = $('#c-' + arg); if (c) { c.textContent = t.value.length + (arg === 'desc' ? '' : '/' + (arg === 'kw' ? 100 : 30)); c.classList.toggle('over', arg !== 'desc' && t.value.length > (arg === 'kw' ? 100 : 30)); }

        if (S.aso.scored) $('#asoRes').innerHTML = asoResHTML();
        renderSteps(); save(); return;
      case 'mval':
        S.money.val = Number(t.value); save();
        var y = window.scrollY; $('#simBox').innerHTML = simHTML(); var r = $('#mval'); if (r) r.focus({ preventScroll: true }); window.scrollTo(0, y); return;
      case 'prname': prInit(); S.pr.name = t.value; save(); return;
      case 'prtask': U.prTask = t.value; return;
      case 'prnote': U.prNote = t.value; return;
      case 'clabel': if (comp) { comp.label = t.value; save(); refreshPhone(); } return;
      case 'calt': if (comp) { comp.alt = t.value; save(); refreshPhone(); } return;
      case 'scname': w.screens[w.cur].name = t.value || ('Screen ' + (w.cur + 1)); save(); refreshPhone(); return;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, k = t.getAttribute('data-in'); if (!k) return;
    var w = WF(), arg = t.getAttribute('data-arg'), comp = w.screens && w.sel !== null ? w.screens[w.cur].comps[w.sel] : null;
    switch (k) {
      case 'shock': U.shock = t.value; break;

      case 'clink': if (comp) comp.link = t.value === '' ? '' : Number(t.value); break;
      case 'cbig': if (comp) comp.big = t.checked; break;

      default: return;
    }
    if (k === 'scname' || k === 'clabel' || k === 'calt') { render(); return; }
    var id = t.id, da = t.getAttribute('data-arg');
    render();
    var back = id ? document.getElementById(id) : document.querySelector('[data-in="' + k + '"]' + (da ? '[data-arg="' + da + '"]' : ''));
    if (back) back.focus({ preventScroll: true });
  });
  function refreshPhone() {
    var w = WF(), scr = $('.scr'); if (!scr) return;
    var si = w.cur;
    scr.innerHTML = w.screens[si].comps.map(function (c, i) { return compHTML(c, i, si, false); }).join('');
    var tabs = document.querySelectorAll('.scr-tabs .btn');
    tabs.forEach(function (b, k) { b.textContent = (k + 1) + '. ' + w.screens[k].name; });
  }

  /* Drag and drop (mouse) for ecosystem chips; tap remains the main method */
  document.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('[data-chip]'); if (!c) return;

  });

  document.addEventListener('drop', function (e) {
    var z = e.target.closest && e.target.closest('[data-zone]'); if (!z || !U.drag) return;
    e.preventDefault(); placeP(U.drag, z.getAttribute('data-zone') || null); U.drag = null; render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (U.selP || U.linkA)) { U.selP = null; U.linkA = null; render(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'prTask') { e.preventDefault(); var g = $('[data-act="prgo"]'); if (g) g.click(); }
    if (e.key === 'Escape' && U.prSub && !(e.target && e.target.tagName === 'SELECT')) { U.prSub = false; render(); var sb = $('[data-act="prsubmit"]'); if (sb) sb.focus(); }
  });

  render();
})();
