<!DOCTYPE html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figma Lab · CAPE Digital Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13265e;--gold:#F5C542;--gold2:#ffd970;--ink:#EAF0FF;--muted:#AFC0EA;
  --ok:#3ddc97;--bad:#ff8a8a;
  --disp:"Bricolage Grotesque","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;
  --ui:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui);background:var(--navy);font-size:12px;color:#222}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #4c9aff;outline-offset:1px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ============ START SCREEN ============ */
#start{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#1d3a8f55,transparent),linear-gradient(160deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);z-index:50}
#start .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
.brandrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.appicon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;flex:none}
.appicon svg{display:block}
#start h1{font-family:var(--disp);font-size:clamp(34px,5vw,58px);margin:14px 0 6px;line-height:1.02;letter-spacing:-.01em}
#start h1 span{color:var(--gold)}
#start .pitch{font-size:18px;max-width:760px;color:#d7e1ff;margin:0 0 14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.objs li{border:1px solid #2c4590;background:#0d1d50;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#cfdcff}
.objs li b{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{position:relative;text-align:left;border:1px solid #2b4391;background:linear-gradient(180deg,#10225c,#0b1844);border-radius:18px;padding:20px 18px 18px;color:var(--ink);cursor:pointer;font-family:var(--body);transition:transform .15s,border-color .15s;min-height:190px}
.lvcard:hover,.lvcard:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.lvcard .em{font-size:30px}
.lvcard h2{font-family:var(--disp);margin:6px 0 4px;font-size:22px}
.lvcard p{margin:0 0 12px;color:#c4d2fb;font-size:14.5px}
.lvcard .bar{height:8px;border-radius:9px;background:#203a86;overflow:hidden}
.lvcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);width:0}
.lvcard .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#b8c8f5}
.startbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.gbtn{border:1px solid #33509f;background:#0f2160;color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.gbtn:hover{border-color:var(--gold)}
.gbtn[disabled]{opacity:.45;cursor:default}
.gbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.xpline{display:flex;gap:18px;align-items:center;margin:4px 0 18px;color:#cfdcff;font-size:14px;flex-wrap:wrap}
.xpline b{color:var(--gold);font-family:var(--disp);font-size:20px}
.credit{margin-top:28px;color:#8fa3d8;font-size:12.5px;line-height:1.5}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.mcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0e1f58;border:1px solid #2a428e;border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;font-family:var(--body)}
.mcard:hover,.mcard:focus-visible{border-color:var(--gold)}
.mcard .num{flex:none;width:34px;height:34px;border-radius:10px;background:#1b3277;display:grid;place-items:center;font:700 15px var(--disp);color:var(--gold)}
.mcard .done{background:var(--gold);color:#1b1500}
.mcard h3{margin:0 0 3px;font:700 15.5px var(--body)}
.mcard .ob{display:block;font-size:12px;color:#9fb4ec}
.mcard .bp{display:block;font-size:13px;color:#c9d6fb;margin-top:4px}
.mcard .st{margin-left:auto;font-size:14px;white-space:nowrap;color:var(--gold)}
.backlink{background:none;border:0;color:var(--gold);font:600 14px var(--body);cursor:pointer;padding:6px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.badge{border:1px solid #2a428e;border-radius:14px;padding:12px;text-align:center;background:#0e1f58;color:#c9d6fb;font-size:13px}
.badge .bi{font-size:28px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--gold);color:#fff}
.badge.on .bi{filter:none;opacity:1}
.badge b{display:block;margin:4px 0 2px;color:inherit}
.lvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}

/* ============ COURSE BAR ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#coursebar{flex:none;height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);border-bottom:1px solid #1d2f6a;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#coursebar::-webkit-scrollbar{display:none}
#coursebar .cbtn{flex:none;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:9px;padding:5px 10px;cursor:pointer;font:600 13px var(--body);white-space:nowrap}
#coursebar .cbtn:hover{border-color:var(--gold)}
#coursebar .cbtn[aria-pressed=true]{background:var(--gold);color:#1b1500}
#coursebar .ctitle{flex:1;min-width:120px;font:700 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#coursebar .ctitle small{font:400 12px var(--body);color:var(--muted);margin-left:6px}
#coursebar .xp{flex:none;color:var(--gold);font:700 14px var(--disp);white-space:nowrap}
.dial{flex:none;display:flex;border:1px solid #2c4590;border-radius:9px;overflow:hidden}
.dial button{border:0;background:#0f2160;color:var(--ink);padding:5px 9px;cursor:pointer;font:600 12.5px var(--body);white-space:nowrap}
.dial button:hover{background:#1a2f75}
.dial .lv{padding:5px 9px;background:#071237;color:var(--gold);font:700 12.5px var(--body);white-space:nowrap}
#appmain{flex:1;display:flex;min-height:0;position:relative}
#appwin{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ======= MISSION PANEL ======= */
#mission{flex:none;width:340px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0B1A46,#060D26);color:var(--ink);font-family:var(--body);border-left:1px solid #1e3170;min-height:0;transition:width .2s}
#mission.collapsed{width:38px}
#mission.collapsed .mbody,#mission.collapsed .mhead h2,#mission.collapsed .mhead .mob,#mission.collapsed .mfoot{display:none}
.mhead{padding:10px 12px 8px;border-bottom:1px solid #1f3474;display:flex;gap:8px;align-items:flex-start}
.mhead h2{margin:0;font:700 17px/1.2 var(--disp)}
.mhead .mob{font-size:12px;color:var(--gold);margin-bottom:2px}
.mhead .colbtn{flex:none;margin-left:auto;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:7px;width:26px;height:26px;cursor:pointer}
.mbody{flex:1;overflow:auto;padding:10px 12px 16px}
.brief{background:#0f2160;border:1px solid #233d86;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:#dfe7ff}
.brief .unit{display:block;margin-top:6px;font-size:12px;color:var(--gold)}
.steps{list-style:none;margin:12px 0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-radius:9px;font-size:14px;line-height:1.35}
.steps li .sn{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #3b57a6;display:grid;place-items:center;font:700 12px var(--disp);color:#b8c8f5}
.steps li.ok .sn{background:var(--ok);border-color:var(--ok);color:#03311d}
.steps li.ok .st{color:#a9f0cf}
.steps li.cur{background:#132a6c}
.steps li .st{flex:1;min-width:0}
.steps li .st small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.steps li .fb{display:block;margin-top:4px;font-size:12.5px;color:#ffd1d1}
.steps li.ok .fb{display:none}
.steps li .qz{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.steps li .qz label{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:#dfe7ff;cursor:pointer;background:#0b1a4a;border:1px solid #233d86;border-radius:8px;padding:5px 7px}
.steps li .qz input{margin-top:2px;accent-color:var(--gold)}
.mbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mbtn{border:1px solid #2f4b9c;background:#10235f;color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font:600 13.5px var(--body)}
.mbtn:hover{border-color:var(--gold)}
.mbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.mbtn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #f5c54266}}
.hintbox{margin-top:10px;background:#1a1a3a;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#fff3c4}
.mtimer{font:700 13px var(--disp);color:var(--gold);margin-left:8px;align-self:center}
.complete{text-align:center;padding:12px 6px}
.complete .stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.complete h3{font:800 22px var(--disp);margin:4px 0}
.complete p{font-size:14px}
.mfoot{padding:8px 12px;border-top:1px solid #1f3474;font-size:11.5px;color:#8fa3d8;line-height:1.4}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #F5C542!important;outline-offset:1px;position:relative;z-index:30}
@keyframes pulse{50%{outline-color:#ff8b00;box-shadow:0 0 0 6px #f5c54255}}
#drawerBtn{display:none}

/* ======= MENUS / DIALOGS / TOAST (themed by the app) ======= */
.menu{position:fixed;z-index:300;background:var(--mbg,#fff);color:var(--mfg,#222);border:1px solid var(--mline,#ccc);border-radius:8px;box-shadow:0 10px 30px #0004;padding:4px;min-width:200px;max-height:80vh;overflow:auto;font:12.5px var(--ui)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;min-height:28px;color:inherit}
.menu .mi:hover,.menu .mi:focus{background:var(--mhover,#e8f0fe);outline:none}
.menu .mi[aria-disabled=true]{opacity:.45;pointer-events:none}
.menu .mi .mic{width:18px;display:grid;place-items:center;flex:none}
.menu .mi .kb{margin-left:auto;opacity:.6;padding-left:18px;font-size:11.5px}
.menu .mi .sub{margin-left:auto;font-size:10px;padding-left:12px;opacity:.7}
.menu .mi[aria-checked=true] .mic::before{content:"✓"}
.menu .sep{height:1px;background:var(--mline,#ddd);margin:4px 2px}
.menu .mh{padding:6px 10px 2px;font-weight:600;opacity:.7;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
#dlgLayer{position:fixed;inset:0;z-index:250;pointer-events:none}
.dlgback{position:fixed;inset:0;background:#00000052;pointer-events:auto}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--dbg,#fff);color:var(--dfg,#222);border-radius:10px;box-shadow:0 18px 50px #0006;border:1px solid var(--dline,#bbb);min-width:min(300px,94vw);max-width:min(96vw,880px);max-height:92vh;display:flex;flex-direction:column;pointer-events:auto;font:13px var(--ui)}
.dlg .dh{display:flex;align-items:center;padding:12px 12px 6px 16px;font-size:14.5px;font-weight:650}
.dlg .dh span{flex:1}
.dlg .dh button{border:0;background:transparent;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px;color:inherit}
.dlg .dh button:hover{background:var(--dhover,#eee)}
.dlg .db{padding:6px 16px 10px;overflow:auto;line-height:1.5}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--dline,#eee);align-items:center;flex-wrap:wrap}
.dlg .df .left{margin-right:auto}
.dbtn{border:1px solid var(--dline,#bbb);background:var(--dbtn,#fff);color:inherit;border-radius:6px;padding:6px 14px;cursor:pointer;font:600 12.5px var(--ui)}
.dbtn:hover{filter:brightness(.96)}
.dbtn.pri{background:var(--dacc,#0d6efd);border-color:var(--dacc,#0d6efd);color:#fff}
.dlg label.f{display:block;margin:8px 0 3px;font-weight:600}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{font:12.5px var(--ui);border:1px solid var(--dline,#bbb);border-radius:5px;padding:4px 7px;height:30px;background:var(--dinput,#fff);color:inherit}
.dlg textarea{height:auto;width:100%}
.dlg table.dt{border-collapse:collapse;font-size:12.5px;width:100%;margin:4px 0 12px}
.dlg table.dt th,.dlg table.dt td{border:1px solid var(--dline,#ddd);padding:4px 7px;text-align:left;vertical-align:top}
.dlg table.dt th{background:var(--dhover,#f3f3f3);position:sticky;top:0}
.dlg h4{margin:12px 0 6px;font-size:13.5px}
.dlg .flist{display:flex;flex-direction:column;gap:6px}
.dlg .fitem{display:flex;gap:10px;align-items:center;border:1px solid var(--dline,#ddd);border-radius:8px;padding:8px 10px;background:var(--dbtn,#fff)}
.dlg .fitem b{display:block}
.dlg .fitem small{opacity:.7}
.dlg .fitem .sp{flex:1;min-width:0}
.dlg .fitem button{flex:none}
.expview{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.expview .pv{flex:1 1 260px;min-height:120px;max-height:52vh;overflow:auto;border:1px solid var(--dline,#ddd);border-radius:8px;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 50%/16px 16px;display:grid;place-items:center;padding:8px}
.expview .pv img{max-width:100%;max-height:48vh;display:block}
.expview .info{flex:1 1 220px;font-size:12.5px;line-height:1.55}
.expview .info code{font-size:11.5px}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:#242424;color:#fff;padding:9px 16px;border-radius:8px;z-index:400;font:13px var(--ui);box-shadow:0 6px 20px #0004;max-width:90vw;text-align:center}
.toast.gold{background:var(--navy2);color:var(--ink);border:1px solid var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;width:100%;height:100%}
.narrow-banner{position:fixed;left:8px;right:8px;top:8px;z-index:600;background:var(--gold);color:#1b1500;border-radius:10px;padding:8px 12px;font:600 13px var(--body);display:flex;gap:8px;align-items:center}
.narrow-banner button{margin-left:auto;border:0;background:#1b1500;color:var(--gold);border-radius:6px;padding:4px 8px;cursor:pointer}

/* ======= LEARN TOUR ======= */
#tour{position:fixed;inset:0;z-index:350;pointer-events:none}
#tour .ring{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px #000a;outline:3px solid var(--gold);transition:all .25s;pointer-events:none}
#tour .ring.none{left:50%!important;top:50%!important;width:0!important;height:0!important}
#tour .card{position:fixed;width:min(340px,92vw);background:var(--navy2);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;font:14px/1.5 var(--body);pointer-events:auto;box-shadow:0 12px 40px #0008}
#tour .card h3{margin:0 0 4px;font:700 17px var(--disp);color:var(--gold)}
#tour .card p{margin:0 0 10px}
#tour .card .tb{display:flex;gap:6px;align-items:center}
#tour .card .tb span{margin-right:auto;font-size:12px;color:var(--muted)}

@media (max-width:1100px){#mission{width:300px}}
@media (max-width:900px){
  #mission{position:absolute;right:0;top:0;bottom:0;z-index:90;width:min(340px,92vw);box-shadow:none;transform:translateX(100%);transition:transform .2s,visibility .2s;visibility:hidden}
  #mission.open{transform:none;box-shadow:-10px 0 30px #0006;visibility:visible}
  #mission.collapsed{width:min(340px,92vw)}
  #mission.collapsed .mbody,#mission.collapsed .mhead h2,#mission.collapsed .mhead .mob,#mission.collapsed .mfoot{display:block}
  #drawerBtn{display:inline-block;position:sticky;right:0;z-index:2;box-shadow:-12px 0 10px var(--navy2),12px 0 0 var(--navy2)}
  .levels{grid-template-columns:1fr}
}
@media (max-width:600px){
  #start .wrap{padding:20px 16px 32px}
  #start .pitch{font-size:16px}
  .mlist{grid-template-columns:1fr}
  #coursebar .ctitle small{display:none}
  .dial button .t{display:none}
}
@media print{body *{visibility:hidden}}

/* ============ Figma Lab interface (original look; follows light / dark) ============ */
html[data-theme=light]{--fx-panel:#ffffff;--fx-panel2:#f5f5f5;--fx-line:#e6e6e6;--fx-text:#1e1e1e;--fx-text2:#6f6f6f;--fx-hover:#f0f0f0;--fx-sel:#e2f1ff;--fx-sel2:#bfe0ff;--fx-acc:#0d99ff;--fx-acc2:#0a7fd6;--fx-comp:#8a38f5;--fx-input:#f5f5f5;--fx-tb:#ffffff;--fx-tbline:#e0e0e0;--fx-shadow:0 2px 14px #0000002a;
  --mbg:#1e1e1e;--mfg:#fff;--mline:#383838;--mhover:#0d99ff;--dbg:#fff;--dfg:#1e1e1e;--dline:#dcdcdc;--dhover:#f0f0f0;--dbtn:#fff;--dacc:#0d99ff;--dinput:#fff}
html[data-theme=dark]{--fx-panel:#2c2c2c;--fx-panel2:#383838;--fx-line:#444444;--fx-text:#f0f0f0;--fx-text2:#a8a8a8;--fx-hover:#383838;--fx-sel:#0d3a5e;--fx-sel2:#14507f;--fx-acc:#0d99ff;--fx-acc2:#3aaeff;--fx-comp:#b98cff;--fx-input:#383838;--fx-tb:#2c2c2c;--fx-tbline:#444;--fx-shadow:0 2px 14px #00000080;
  --mbg:#1e1e1e;--mfg:#fff;--mline:#383838;--mhover:#0d99ff;--dbg:#2c2c2c;--dfg:#f0f0f0;--dline:#4a4a4a;--dhover:#383838;--dbtn:#383838;--dacc:#0d99ff;--dinput:#383838}
#fx{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--fx-panel);color:var(--fx-text);font:11.5px/1.35 var(--ui);user-select:none;-webkit-user-select:none}
#fx button{cursor:pointer}
#fx input,#fx select,#fx textarea{user-select:text;-webkit-user-select:text}
.ic{width:20px;height:20px;display:block;flex:none}
.ic16{width:16px;height:16px}
/* top bar */
#fxTop{flex:none;height:44px;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--fx-line);background:var(--fx-panel)}
.tbtn{border:0;background:transparent;color:inherit;height:32px;min-width:32px;border-radius:6px;display:inline-grid;place-items:center;padding:0 6px;font:600 11.5px var(--ui);white-space:nowrap}
.tbtn:hover{background:var(--fx-hover)}
.tbtn[aria-pressed=true]{background:var(--fx-sel);color:var(--fx-acc2)}
.tbtn[disabled]{opacity:.4;cursor:default}
.tbtn.wide-ic,#shareBtn{display:inline-flex;gap:5px;align-items:center}
.tbtn.pri{background:var(--fx-acc);color:#fff;padding:0 12px}
.tbtn.pri:hover{background:var(--fx-acc2)}
#fxName{display:flex;align-items:center;gap:4px;min-width:0;flex:1;font-weight:600}
#fxName .crumb{color:var(--fx-text2);font-weight:500;white-space:nowrap}
#fxName input{border:1px solid transparent;background:transparent;font:600 12.5px var(--ui);color:inherit;border-radius:5px;padding:4px 6px;min-width:60px;max-width:280px;width:100%}
#fxName input:hover{border-color:var(--fx-line)}
#fxName input:focus{border-color:var(--fx-acc);outline:none;background:var(--fx-panel)}
#fxName .saved{font-weight:500;color:var(--fx-text2);white-space:nowrap;font-size:11px}

function gsGet(){
  if($('#app').hidden||!LAB.snapshot)return Store.raw('session')?{v:1,view:'start'}:undefined;
  let doc;try{doc=LAB.snapshot()}catch(e){return undefined}
  if(typeof doc!=='string')return undefined;
  const o={v:1,view:M?'mission':'free',doc,ev:EV||{},dirty:!!LAB.dirty};
  if(M)o.M={id:M.m.id,hints:M.hints,shows:M.shows,fails:M.fails,done:!!M.done,stars:M.stars||0,gain:M.gain||0,hintText:M.hintText||'',hintStep:M.hintStep,hintK:M.hintK,ans:M.ans||{}};

function gsInit(){
  if(!window.GameSave)return null;let R=null;
  GameSave.persist({key:Store.k('session'),welcome:false,every:5000,get:gsGet,set:d=>{
    if(!d||d.v!==1||typeof d.doc!=='string'||!LAB.validDoc(JSON.parse(d.doc)))throw 0;

function gsResume(R,mi,mode,file,lv,q){
  if(lv||q.get('tour'))return false;
  if(R.view==='mission'){if((mi&&mi!==R.M.id)||mode)return false}
  else if(mi||(file&&file!==R.file))return false;

    if(R.view==='mission')startMission(R.M.id);else startFree(R.file&&LAB.starters.find(s=>s.id===R.file)?R.file:'blank');

function mk(type,p={}){
  const n={id:uid('n'),type,name:'',x:0,y:0,w:100,h:100,visible:true,locked:false,opacity:1,fills:[],stroke:null,radius:0,effects:[],cons:{h:'L',v:'T'},react:[],exp:[]};

function walk(list,fn,par,depth=0){if(!list)return;for(const n of list){if(fn(n,par,depth)===false)continue;if(n.children)walk(n.children,fn,n,depth+1)}}

/* ===================== mission check helpers ===================== */
const nk=s=>String(s||'').toLowerCase().replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();
function allNodes(){const out=[];for(const pg of D.pages)walk(pg.children,n=>{out.push(n)});return out}
function pageAll(pg){const out=[];walk((pg||PG).children,n=>{out.push(n)});return out}
function frameNamed(name,pg){return (pg||PG).children.find(n=>FRAMEISH.has(n.type)&&nk(n.name)===nk(name))||null}
function framesLike(re,pg){return (pg||PG).children.filter(n=>FRAMEISH.has(n.type)&&re.test(nk(n.name)))}
function descOf(f,virt){const out=[];if(!f)return out;const w=l=>{for(const n of l){out.push(n);w(virt?kidsOf(n):(n.children||[]))}};w(virt?kidsOf(f):(f.children||[]));return out}
function inFrame(f,name,types){return descOf(f).filter(n=>nk(n.name)===nk(name)&&(!types||types.includes(n.type)))[0]||null}
function fillsOf(n){return (n.type==='INSTANCE'?(vis(n).fills||[]):(n.fills||[])).filter(p=>p.on!==false)}
function solidHex(n){const p=fillsOf(n).filter(q=>q.t==='solid').slice(-1)[0];return p?p.c:null}
function hasImage(n){return fillsOf(n).some(p=>p.t==='image')}
function textCol(t){const p=(t.fills||[]).find(q=>q.on!==false&&q.t==='solid');return p?p.c:'#000000'}
function textsIn(f){return descOf(f,true).filter(n=>n.type==='TEXT'&&n.visible!==false)}
function bgBehind(t,root){const order=[];const w=n=>{order.push(n);for(const k of kidsOf(n))if(k.visible!==false)w(k)};w(root);const i=order.indexOf(t);const cx=t.x+t.w/2,cy=t.y+t.h/2;let bg=null;
  for(let j=0;j<i;j++){const n=order[j];if(n.type==='TEXT'||n.type==='LINE'||n.type==='GROUP')continue;if(cx<n.x||cx>n.x+n.w||cy<n.y||cy>n.y+n.h)continue;const ps=fillsOf(n);if(!ps.length)continue;const p=ps[ps.length-1];if(p.t==='image'){bg='image';continue}if((p.o==null?1:p.o)*(n.opacity==null?1:n.opacity)>=.5)bg=p.c}return bg||'#FFFFFF'}
function readable(f){const bad=[];for(const t of textsIn(f)){if(!String(t.text||'').trim())continue;if(t.font.size<12){bad.push('“'+t.name+'” is smaller than 12 px');continue}const bg=bgBehind(t,f);if(bg!=='image'&&contrast(textCol(t),bg)<4.5)bad.push('“'+t.name+'” has contrast '+contrast(textCol(t),bg).toFixed(1)+':1')}return bad}
const isPhone=f=>f&&f.w>=320&&f.w<=480&&f.h>=560;
const near=(a,b,t)=>Math.abs(a-b)<=(t==null?1:t);
function hexNear(a,b,tol){if(!a||!b)return false;const x=hexToRgb(a),y=hexToRgb(b);return Math.abs(x[0]-y[0])+Math.abs(x[1]-y[1])+Math.abs(x[2]-y[2])<=(tol||12)}
function reactsIn(f){return descOf(f,true).filter(n=>(n.react||[]).length)}
function navsFrom(f){const out=[];for(const n of reactsIn(f))for(const r of n.react){if(r.act==='nav'&&r.to)out.push({n,r,to:byId(r.to)})}return out}
function hasBack(f){return reactsIn(f).some(n=>n.react.some(r=>r.act==='back'))}
function compSets(pg){return pageAll(pg).filter(n=>n.type==='COMPONENT_SET')}
function rel(n,f){return {x:n.x-f.x,y:n.y-f.y}}

  {t:'Give the <b>Hero image</b> a picture fill (Assets ▸ Pictures, or the Image tab in the colour picker).',c:()=>{const n=byName1('Hero image');return (n&&hasImage(n))||'Hero image still has a flat colour fill.'},h:['Select Hero image, open the Assets tab on the left and click a picture.','Or click the Fill swatch and choose the Image tab.'],show:['#tabAssets','#lp [data-sec=pictures]']},
  {t:'Colour the <b>Order button</b> sunshine yellow <b>#F5C542</b> and keep its label readable (contrast at least 4.5:1).',c:()=>{const b=byName1('Order button');if(!b)return false;if(!hexNear(solidHex(b),'#F5C542',6))return 'Fill the Order button frame with F5C542.';const t=descOf(b).find(n=>n.type==='TEXT');const c=t?contrast(textCol(t),solidHex(b)):0;return c>=4.5||('Label contrast is only '+c.toFixed(1)+':1. Use a dark label colour on yellow.')},h:['Click the button’s frame (its edge, or in Layers) and set its fill.','White text on yellow is hard to read. Keep the label dark, for example #13262B.'],show:['#rp [data-sec=fill]']}],
 wrap:'A mock-up is a static, high-fidelity picture of the screen: real colours, type and images. Contrast of 4.5:1 keeps text readable on a phone in bright Caribbean sun.'},
{id:'tidy-layers',level:1,title:'Tidy up the layers',unit:'U2 · M1U5',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U5 Image manipulation: layers, selections and masks',file:'FBSS_Poster',doc:stSurf,
 brief:'The poster file for <b>Frigate Bay Surf School</b> in St. Kitts is messy: unnamed layers, an old banner, a logo in loose pieces and a headline hidden behind the photo. Tidy it before the client sees it.',
 steps:[
  {t:'Rename the background rectangle (Rectangle 7) to <b>Background</b> and <b>lock</b> it.',c:()=>{const n=byName1('Background');if(!n)return 'Rename Rectangle 7 to Background.';return n.locked||'Lock it with the padlock icon in the Layers panel.'},h:['In the Layers panel, double-click “Rectangle 7” and type Background.','Hover the layer row and click the padlock.'],show:['#layers .lr .acts']},
  {t:'Hide the <b>Old banner</b> layer (eye icon).',c:()=>{const n=byName1('Old banner');return (n&&n.visible===false)||'Old banner is still visible.'},h:['Hover the Old banner row in Layers and click the eye.'],show:['#layers']},
  {t:'Group the yellow circle and the <b>FBSS</b> text (Ctrl+G) and name the group <b>Logo</b>.',c:()=>{const g=allNodes().find(n=>n.type==='GROUP'&&nk(n.name)==='logo');if(!g)return 'No group called Logo yet.';return (g.children.some(k=>k.type==='ELLIPSE')&&g.children.some(k=>k.type==='TEXT'&&nk(k.text)==='fbss'))||'The Logo group must hold the circle and the FBSS text.'},h:['Click the circle, Shift+click the FBSS text, press '+MOD+'+G.','Rename the new group Logo.'],show:['#layers']},
  {t:'Move the <b>Headline</b> above the <b>Beach photo</b> in the layer order so it can be read.',c:()=>{const h=byName1('Headline'),p=byName1('Beach photo');if(!h||!p)return false;const par=parentOf(h);if(par!==parentOf(p))return 'Keep both layers in the poster frame.';const L=par.children;return L.indexOf(h)>L.indexOf(p)||'Headline is still under the photo.'},h:['Higher in the Layers list = in front. Drag Headline above Beach photo.','Or select Headline and press '+MOD+'+Shift+] (Bring to front).'],show:['#layers']}],
 wrap:'Named, grouped and locked layers make a file easy to hand over. Layer order works like a stack of paper: higher in the list means in front.'},
{id:'photo-card',level:1,title:'Picture card with a shadow',unit:'U2 · M1U9',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U9 Trends in visual and interactive design; M1U2B composition',file:'SpiceIsle_Tours',doc:stTours,
 brief:'<b>Spice Isle Tours</b> in Grenada wants a tour card for its app: a rounded photo with a soft shadow and a caption.',
 steps:[
  {t:'Draw a rectangle at least <b>300 × 180</b> inside Tours and name it <b>Tour photo</b>.',c:()=>{const f=frameNamed('Tours');const n=f&&descOf(f).find(x=>nk(x.name)==='tour photo');return (n&&n.w>=300&&n.h>=180)||'Need a layer called Tour photo, at least 300 × 180, inside Tours.'},h:['Press R and drag inside Tours. Type the size in W and H.','Rename it Tour photo.'],show:['#tb [data-tool=rect]','#rp [data-sec=pos]']},
  {t:'Give Tour photo an <b>image fill</b>.',c:()=>{const n=byName1('Tour photo');return (n&&hasImage(n))||'No picture fill yet.'},h:['Assets ▸ Pictures ▸ click a picture while Tour photo is selected.'],show:['#tabAssets']},
  {t:'Round its corners to <b>16</b>.',c:()=>{const n=byName1('Tour photo');return (n&&n.radius===16)||'Set the corner radius box to 16.'},h:['Design panel ▸ the corner radius box (curved corner icon) ▸ 16.'],show:['#rp [data-k=radius]']},
  {t:'Add a <b>Drop shadow</b> effect.',c:()=>{const n=byName1('Tour photo');return (n&&(n.effects||[]).some(e=>e.t==='drop'&&e.on!==false))||'No drop shadow yet.'},h:['Effects ▸ + adds a drop shadow.'],show:['#rp [data-act=addEffect]']},
  {t:'Add a caption under the photo that mentions <b>Grenada</b>.',c:()=>{const f=frameNamed('Tours'),n=byName1('Tour photo');if(!f||!n)return false;return descOf(f).some(t=>t.type==='TEXT'&&nk(t.text).includes('grenada')&&t.y>=n.y+n.h-4)||'Add a text below the photo that includes the word Grenada.'},h:['Press T and click just under the photo. Example: Grand Etang rainforest walk, Grenada.'],show:['#tb [data-tool=text]']}],
 wrap:'Rounded corners and soft shadows are common UI trends: they separate a card from the background and suggest it can be tapped.'},
{id:'peer-feedback',level:1,title:'Collect peer feedback',unit:'U2 · M1U7',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U7 Interactive digital media for collaboration; M3U6 testing and feedback',file:'LoloGo_Home_hifi',doc:stLoloHifi,
 brief:'Before the next SBA check-in, share the <b>LoloGo</b> home screen so classmates can comment, then work through the feedback.',
 steps:[
  {t:'Open <b>Share</b> and set the link to <b>Can comment</b>.',c:()=>D.share==='comment'||'Share ▸ Can comment ▸ Save sharing setting.',h:['The Share button is in the top bar.'],show:['#shareBtn']},
  {t:'Add <b>two comments</b> on different parts of the screen (Comment tool, C).',c:()=>{const c=PG.comments;if(c.length<2)return 'Comments so far: '+c.length+' of 2.';return c.some((a,i)=>c.some((b,j)=>j>i&&Math.hypot(a.x-b.x,a.y-b.y)>40))||'Place the two pins on different parts of the screen.'},h:['Press C, click the screen, type your comment, then Post.','Example: “Is the Order ahead button big enough to tap?”'],show:['#tb [data-tool=comment]']},
  {t:'<b>Reply</b> to one comment.',c:()=>PG.comments.some(c=>c.thread.length>=2)||'Open a pin and write a reply.',h:['Click a numbered pin, type in Reply and press the Reply button.'],show:['#pins .pin']},
  {t:'<b>Resolve</b> one comment once it is dealt with.',c:()=>PG.comments.some(c=>c.res)||'No resolved comments yet.',h:['Open a pin and click Resolve.'],show:['#pins .pin']}],
 wrap:'Comments keep feedback attached to the exact spot on the design, so the whole team can see what changed and why. That is good evidence of collaboration for your SBA.'},
{id:'auto-rows',level:2,title:'Auto layout route list',unit:'U2 · M2U3',unitLong:'CAPE Digital Media Unit 2 · Module 2 · M2U3 Step by step: a clickable wireframe (auto layout)',file:'BusTimes_Routes',doc:stRows,
 brief:'The three route rows on <b>Bus Times</b> were placed by hand and the spacing is uneven. Use <b>auto layout</b> so every row reflows neatly when a route name gets longer.',
 steps:[
  {t:'Select the icon, route name and time of <b>row 1</b> and press <b>Shift+A</b> (horizontal auto layout).',c:()=>rowFrames().some(r=>r.t==='route 1')||'Wrap row 1 (icon + Route 1 text + time) in a horizontal auto layout frame.',h:['Drag a selection box around the three items of row 1, then press Shift+A.','Check the Design panel: Auto layout direction should be the right-pointing arrow.'],show:['#rp [data-sec=layout]']},
  {t:'Set that row’s <b>gap to 16</b> and <b>padding to 12</b> on every side.',c:()=>{const r=rowFrames().find(r=>r.t==='route 1');if(!r)return false;const L=r.f.layout;return (L.gap===16&&L.pl===12&&L.pr===12&&L.pt===12&&L.pb===12)||'Gap '+L.gap+', padding '+[L.pt,L.pr,L.pb,L.pl].join('/')+'. Need gap 16 and padding 12.'},h:['In Auto layout, the box with the two bars is the gap. ↔ and ↕ are the padding.'],show:['#rp [data-k=gap]','#rp [data-k=padH]']},
  {t:'Do the same for <b>rows 2 and 3</b>.',c:()=>{const R=rowFrames();const ok=['route 1','route 2','route 3'].filter(k=>R.some(r=>r.t===k&&r.f.layout.gap===16&&r.f.layout.pl===12&&r.f.layout.pt===12&&r.f.layout.pr===12&&r.f.layout.pb===12));return ok.length===3||('Rows ready: '+ok.length+' of 3.')},h:['Repeat: select the three items, Shift+A, gap 16, padding 12.'],show:['#rp [data-sec=layout]']},
  {t:'Select the three rows and press <b>Shift+A</b> again to stack them vertically with a <b>gap of 8</b>. Name it <b>Route list</b>.',c:()=>{const l=allNodes().find(n=>nk(n.name)==='route list');if(!l)return 'No layer called Route list.';if(!(l.layout&&l.layout.mode==='V'))return 'Route list needs vertical auto layout.';if(l.layout.gap!==8)return 'Set the Route list gap to 8.';const R=rowFrames();return R.filter(r=>parentOf(r.f)===l).length>=3||'All three rows must be inside Route list.'},h:['Shift+click the three row frames in Layers, then Shift+A.','Rename the new frame Route list and set its gap to 8.'],show:['#rp [data-sec=layout]','#layers']}],
 wrap:'Auto layout turns spacing into a rule (gap, padding, direction). Change a label and the row resizes; add a row and the list grows, always on the same spacing.'},
{id:'button-variants',level:2,title:'Button component with variants',unit:'U2 · M2U3',unitLong:'CAPE Digital Media Unit 2 · Module 2 · M2U3 Prototypes (components and instances); M3U6',file:'LoloGo_UI',doc:stButton,
 brief:'<b>LoloGo</b> needs one Order button that every screen reuses, with a <b>Default</b> and a <b>Pressed</b> look. Build it as a component with variants and use it on the Menu screen.',
 steps:[
  {t:'Turn the <b>Button</b> frame into a <b>component</b> (Ctrl+Alt+K).',c:()=>allNodes().some(n=>n.type==='COMPONENT')||'Select the Button frame and press '+MOD+'+Alt+K.',h:['Click the Button frame’s name above it on the canvas, then '+MOD+'+Alt+K, or the Create component button in the Design panel.'],show:['#rp [data-act=mkcomp]']},
  {t:'Click <b>Add variant</b> so Button has two variants.',c:()=>{const s=btnSet();return (s&&s.children.filter(k=>k.type==='COMPONENT').length>=2)||'Need a component set with 2 variants.'},h:['With the component selected, click + Add variant in the Design panel.'],show:['#rp [data-act=addvariant]']},
  {t:'Rename the property to <b>State</b> with values <b>Default</b> and <b>Pressed</b>.',c:()=>{const s=btnSet();if(!s)return false;const p=setProps(s);const k=Object.keys(p).find(x=>nk(x)==='state');if(!k)return 'Rename the property to State (select the set).';const v=p[k].map(nk);return (v.includes('default')&&v.includes('pressed'))||'Values now: '+p[k].join(', ')+'. Need Default and Pressed.'},h:['Select the component set (dashed purple box) and rename Property 1 to State.','Select each variant and type its value: Default, Pressed.'],show:['#rp [data-sec=head]']},
  {t:'Make the <b>Pressed</b> variant darker than Default.',c:()=>{const s=btnSet();if(!s)return false;const d=s.children.find(c=>nk(parseVariant(c.name).State||parseVariant(c.name).state||'')==='default'),p=s.children.find(c=>nk(parseVariant(c.name).State||parseVariant(c.name).state||'')==='pressed');if(!d||!p)return 'Name the variants first.';const a=solidHex(d),b=solidHex(p);return (a&&b&&lumOf(b)<lumOf(a)-.01)||'Give Pressed a darker fill, for example #B8321F.'},h:['Select the Pressed variant and change its fill to a darker red, such as B8321F.'],show:['#rp [data-sec=fill]']},
  {t:'Place an <b>instance</b> of Button in <b>Menu screen</b> and change its text to <b>Add to order</b>.',c:()=>{const m=frameNamed('Menu screen');const s=btnSet();if(!m||!s)return false;const ins=descOf(m).filter(n=>n.type==='INSTANCE'&&s.children.some(c=>c.id===n.comp));if(!ins.length)return 'Drag Button from Assets into Menu screen.';return ins.some(i=>textsIn(i).some(t=>nk(t.text)==='add to order'))||'Double-click the instance’s label and type Add to order.'},h:['Assets tab ▸ drag Button onto the Menu screen.','Double-click the label inside the instance to change only that copy’s text.'],show:['#tabAssets','#lp [data-sec=components]']}],
 wrap:'A main component is the master; instances are copies that update when the master changes. Variants keep related states (Default, Pressed, Disabled) together in one set.'},
{id:'styles',level:2,title:'Colour and text styles',unit:'U2 · M1U1',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U1 Planning designs: style guides; M1U2 colour',file:'LoloGo_StyleGuide',doc:stStyles,
 brief:'Turn the <b>LoloGo</b> style guide into real <b>styles</b>: four brand colours (sea teal, sunshine, flame, sand) and two text styles, then use them on the Home screen.',
 steps:[
  {t:'Create <b>colour styles</b> for all four brand colours.',c:()=>{const need=[PAL.teal,PAL.sun,PAL.flame,PAL.sand];const have=need.filter(h=>D.styles.colors.some(s=>hexNear(s.c,h,4)));return have.length===4||('Colour styles made: '+have.length+' of 4.')},h:['Select a swatch, click the four-dot style button in Fill ▸ Create style from this colour.','Name them Sea teal, Sunshine, Flame and Sand.'],show:['#rp [data-act=fstyles]']},
  {t:'Create two <b>text styles</b>: one from the 32 px Bold heading, one from the 16 px body text.',c:()=>{const T=D.styles.texts;const h=T.some(s=>s.size>=28&&s.weight>=700),b=T.some(s=>s.size>=14&&s.size<=18&&s.weight<=500);return (h&&b)||('Still needed: '+[!h&&'a heading style',!b&&'a body style'].filter(Boolean).join(' and ')+'.')},h:['Select the Heading sample text ▸ Text section ▸ four-dot button ▸ Create style.'],show:['#rp [data-act=tstyles]']},
  {t:'Apply the <b>sea teal</b> colour style to the <b>Header</b> in Home.',c:()=>{const h=frameNamed('Home');const n=h&&inFrame(h,'Header');if(!n)return false;const p=(n.fills||[])[0];const s=p&&p.style&&colorStyle(p.style);return (s&&hexNear(s.c,PAL.teal,4))||'Header must use the sea teal style (not just the same hex).'},h:['Select Header ▸ Fill four-dot button ▸ pick your sea teal style.'],show:['#rp [data-act=fstyles]']},
  {t:'Apply the <b>heading</b> text style to the <b>Title</b> text in Home.',c:()=>{const h=frameNamed('Home');const n=h&&inFrame(h,'Title');if(!n)return false;const s=n.tstyle&&textStyle(n.tstyle);return (s&&s.size>=28)||'Title must use your heading text style.'},h:['Select Title ▸ Text section four-dot button ▸ choose your heading style.'],show:['#rp [data-act=tstyles]']},
  {t:'What is the main benefit of colour styles?',q:{options:['Change the style once and every layer using it updates','They make the file smaller','They stop other people editing the colours'],correct:0}}],
 wrap:'Styles are the digital version of a style guide. They keep colours and type consistent and let you rebrand a whole app by editing one style.'},
{id:'click-through',level:2,title:'Click-through prototype',unit:'U2 · M3U6',unitLong:'CAPE Digital Media Unit 2 · Module 3 · M3U6 User flows and clickable prototypes',file:'JohnnyCake_Prototype',doc:stJohnny,
 brief:'Link the three <b>Johnny Cake Counter</b> screens (Home → Menu → Order) so testers can tap through the order flow on a phone before any code is written.',
 steps:[
  {t:'Prototype tab: connect <b>Order now button</b> on Home to <b>Menu</b> (On click → Navigate to).',c:()=>navOK('Home','Order now button','Menu')||'Order now button needs On click → Navigate to Menu.',h:['Click the Prototype tab on the right. Select the Order now button and drag the round + handle onto the Menu frame.','Or click + in Interactions and choose Menu as the destination.'],show:['#tabProto','#rp [data-act=addInteraction]']},
  {t:'Connect the <b>Johnny cakes row</b> on Menu to <b>Order</b> with <b>Smart animate</b> or <b>Move in</b>.',c:()=>{const f=frameNamed('Menu'),o=frameNamed('Order');const n=f&&inFrame(f,'Johnny cakes row');if(!n||!o)return false;const r=(n.react||[]).find(r=>r.act==='nav'&&r.to===o.id);if(!r)return 'Link the row to Order first.';return ['smart','movein','slidein','push'].includes(r.anim)||'Change the animation from Instant to Smart animate or Move in.'},h:['Select the row (click its edge, or in Layers), then add an interaction.','Click the interaction to open it and change Animation.'],show:['#rp [data-sec=interactions]']},
  {t:'Make both <b>Back button</b>s go back (On click → <b>Back</b>).',c:()=>{const a=frameNamed('Menu'),b=frameNamed('Order');const ok=[a,b].filter(f=>f&&descOf(f).some(n=>nk(n.name)==='back button'&&(n.react||[]).some(r=>r.act==='back')));return ok.length===2||('Back buttons done: '+ok.length+' of 2.')},h:['Select a Back button ▸ + in Interactions ▸ Action: Back.'],show:['#rp [data-sec=interactions]']},
  {t:'Set <b>Home</b> as the <b>flow starting point</b>.',c:()=>{const h=frameNamed('Home');return (h&&PG.flows.some(f=>f.start===h.id))||'Select Home ▸ Prototype tab ▸ Flow starting point ▸ +.'},h:['Click the Home frame’s name to select it, then + in Flow starting point.'],show:['#rp [data-sec=flowstart]']},
  {t:'Press <b>Present ▶</b> and tap through to the <b>Order</b> screen.',c:()=>((EV.pvisit||[]).map(nk).includes('order')&&(EV.pnav||0)>=2)||'Present, then tap Order now and the Johnny cakes row.',h:['The ▶ button is in the top bar. Close with Esc.'],show:['#presentBtn']}],
 wrap:'A clickable prototype lets people try the user flow before anything is coded. Fixing a dead end now costs minutes; fixing it in a finished app costs days.'},
{id:'constraints',level:2,title:'Constraints for different screens',unit:'U2 · M3U5',unitLong:'CAPE Digital Media Unit 2 · Module 3 · M3U5 Screen size, resolution and touch',file:'BeachReport_Barbados',doc:stBeach,
 brief:'The <b>Barbados Beach Report</b> screen was designed for a small phone. Set <b>constraints</b> so it adapts when the frame becomes a tablet.',
 steps:[
  {t:'<b>Top bar</b>: Left &amp; right, Top.',c:()=>consIs('Top bar','LR','T'),h:['Select Top bar ▸ Constraints ▸ Horizontal: Left & right.'],show:['#rp [data-sec=cons]']},
  {t:'<b>Logo</b>: Centre (horizontal).',c:()=>consIs('Logo','C',null),h:['Select Logo ▸ Horizontal: Centre.'],show:['#rp [data-sec=cons]']},
  {t:'<b>Report card</b>: Left &amp; right and Top &amp; bottom, so it stretches.',c:()=>consIs('Report card','LR','TB'),h:['Both selects: Left & right, Top & bottom.'],show:['#rp [data-sec=cons]']},
  {t:'<b>Tab bar</b>: Left &amp; right, Bottom. <b>Share button</b>: Right, Bottom.',c:()=>{const a=consIs('Tab bar','LR','B'),b=consIs('Share button','R','B');return a===true&&b===true||(a!==true?a:b)},h:['Tab bar: Left & right + Bottom. Share button: Right + Bottom.'],show:['#rp [data-sec=cons]']},
  {t:'Resize the <b>Beach report</b> frame to a tablet size (700 px wide or more) and check everything stays in place.',c:()=>{const f=frameNamed('Beach report');if(!f)return false;if(f.w<700)return 'Frame is '+Math.round(f.w)+' px wide. Make it 700 or more (try the iPad mini preset).';const t=inFrame(f,'Top bar'),b=inFrame(f,'Tab bar'),s=inFrame(f,'Share button');const ok=t&&near(t.w,f.w,1)&&b&&near(b.y+b.h,f.y+f.h,1)&&s&&near(f.x+f.w-(s.x+s.w),16,1);return ok||'Something did not stretch or pin correctly — check the constraints, then resize again.'},h:['Select the frame, then use the size preset menu in the Design panel, or type W 834 and H 1194.'],show:['#rp [data-k=preset]','#rp [data-k=w]']}],
 wrap:'Constraints say what each layer is pinned to when its frame changes size. They are how one design survives different screen sizes.'},
{id:'home-screen',level:3,title:'Mobile home screen for a Cayman Islands app',unit:'U2 · M3U5–M3U6',unitLong:'CAPE Digital Media Unit 2 · Module 3 · M3U5 Mobile user experience and M3U6 tools; Module 1 · M1U2B composition',file:'HopCayman_Home',doc:stBlank,time:900,
 brief:'Design the Home screen for <b>Hop Cayman</b>, an app for events across the Cayman Islands (George Town, West Bay, Cayman Brac). Start from a blank file. The client wants a clear header, a hero picture, three event cards and a bottom navigation bar that can be reused on every screen.',
 steps:[
  {t:'A phone-sized frame named <b>Home</b>.',c:()=>{const f=frameNamed('Home');return (f&&isPhone(f))||'Need a phone frame (320–480 px wide) named Home.'},h:['Frame tool ▸ phone preset ▸ rename to Home.']},
  {t:'The app name <b>Hop Cayman</b> as text at least 24 px.',c:()=>{const f=frameNamed('Home');return (f&&textsIn(f).some(t=>nk(t.text).includes('hop cayman')&&t.font.size>=24))||'Add Hop Cayman text, 24 px or larger, inside Home.'},h:['Text tool, then set the size in the Text section.']},
  {t:'A <b>hero image</b> with rounded corners (radius 8 or more).',c:()=>{const f=frameNamed('Home');return (f&&descOf(f).some(n=>hasImage(n)&&(n.radius||0)>=8))||'Need a picture-filled layer with corner radius 8+.'},h:['Rectangle ▸ image fill ▸ corner radius.']},
  {t:'At least <b>three event cards</b> in a <b>vertical auto layout</b> whose gap is a multiple of 8.',c:()=>{const f=frameNamed('Home');const l=f&&descOf(f).find(n=>n.layout&&n.layout.mode==='V'&&n.children.filter(k=>k.visible!==false).length>=3);if(!l)return 'Stack three cards with vertical auto layout (Shift+A).';return (l.layout.gap%8===0&&l.layout.gap>0)||'Use an 8-point gap: 8, 16 or 24.'},h:['Make one card, duplicate it twice, select all three and press Shift+A.']},
  {t:'A bottom <b>navigation bar</b> that is an <b>instance</b> of a component.',c:()=>{const f=frameNamed('Home');return (f&&descOf(f).some(n=>n.type==='INSTANCE'&&n.y+n.h>=f.y+f.h-100))||'Make the nav bar a component (on the canvas beside Home), then place an instance at the bottom of Home.'},h:['Build the nav bar outside Home, '+MOD+'+Alt+K, then drag an instance from Assets into Home.']},
  {t:'Every text is at least <b>12 px</b> with contrast of at least <b>4.5:1</b>.',c:()=>{const f=frameNamed('Home');if(!f)return false;const b=readable(f);return !b.length||b.slice(0,2).join('; ')},h:['Light text needs a dark background, and the other way round.']}],
 wrap:'Hierarchy (big app name), spacing on an 8-point grid, reusable components and strong contrast are what make a home screen feel professional and usable outdoors.'},
{id:'lofi-hifi',level:3,title:'Hi-fi from a lo-fi wireframe',unit:'U1 · M3U2',unitLong:'CAPE Digital Media Unit 1 · Module 3 · M3U2 Wireframes, mock-ups and prototypes; Unit 2 · M2U3',file:'LoloGo_Home',doc:stLoloWire,time:900,
 brief:'This is the grey <b>LoloGo</b> wireframe from the case study. Build the hi-fi mock-up beside it with the island palette — sea teal #0B5D6B, sunshine #FFC23C, flame #E5482F, sand #FFF6E6 — keeping the same layout.',
 steps:[
  {t:'Duplicate the wireframe (Ctrl+D) and rename the copy <b>Home – hi-fi</b>.',c:()=>{const h=hifi();return (h&&descOf(h).length>=6)||'Need a top-level frame whose name includes hi-fi, made from the wireframe.'},h:['Select the wireframe frame, '+MOD+'+D, then rename the copy.']},
  {t:'Rename the original frame so it is labelled <b>Low-Fidelity Wireframe</b>.',c:()=>PG.children.some(n=>FRAMEISH.has(n.type)&&/low.?fidelity/.test(nk(n.name))&&!/hi.?fi/.test(nk(n.name)))||'Rename the grey frame, for example Home – Low-Fidelity Wireframe.',h:['The course says to label deliverables “Low-Fidelity Wireframe”.']},
  {t:'Keep the <b>same layout</b>: Header, Search, Image box, the three Lolo cards and Button stay in the same places (within 24 px).',c:()=>{const h=hifi();const w=PG.children.find(n=>FRAMEISH.has(n.type)&&n!==h&&descOf(n).some(k=>nk(k.name)==='image box'));if(!h||!w)return false;const names=['header','search','image box','lolo card 1','lolo card 2','lolo card 3','button'];let ok=0;for(const nm of names){const a=descOf(w).find(k=>nk(k.name)===nm),b=descOf(h).find(k=>nk(k.name)===nm);if(a&&b&&near(rel(a,w).x,rel(b,h).x,24)&&near(rel(a,w).y,rel(b,h).y,24))ok++}return ok>=6||('Blocks still in place: '+ok+' of 7. Keep the layer names and positions.')},h:["Duplicating keeps every layer in place. Change fills and text; do not drag the blocks around."]},
  {t:'Use the palette: at least <b>three</b> of the four LoloGo colours, and no grey left on the Header or the cards.',c:()=>{const h=hifi();if(!h)return false;const cols=new Set(descOf(h,true).concat([h]).flatMap(n=>fillsOf(n).filter(p=>p.t==='solid').map(p=>p.c)));const used=[PAL.teal,PAL.sun,PAL.flame,PAL.sand].filter(c=>[...cols].some(x=>hexNear(x,c,4)));if(used.length<3)return 'Palette colours used: '+used.length+' of 3.';const grey=descOf(h).filter(n=>/^(header|lolo card \d)$/.test(nk(n.name))&&fillsOf(n).some(p=>p.t==='solid'&&isGrey(p.c)&&lumOf(p.c)<.9));return !grey.length||'Still grey: '+grey.map(n=>n.name).join(', ')+'.'},h:["Header → sea teal, cards → sand, button → sunshine. Type the hex codes in Fill."]},
  {t:'Real content: the <b>Image box</b> has a picture and no text says “Lorem ipsum” or “Button”.',c:()=>{const h=hifi();if(!h)return false;const ib=descOf(h).find(n=>nk(n.name)==='image box');if(!ib||!hasImage(ib))return 'Give Image box a picture fill.';const bad=textsIn(h).filter(t=>/lorem|^button$/.test(nk(t.text)));return !bad.length||'Replace placeholder text: '+bad.map(t=>'“'+t.text+'”').join(', ')+'.'},h:["Select Image box ▸ Assets ▸ Pictures (Food). Select each placeholder text and type real words."]},
  {t:'Every text in the hi-fi is at least 12 px with contrast of at least 4.5:1.',c:()=>{const h=hifi();if(!h)return false;const b=readable(h);return !b.length||b.slice(0,2).join('; ')},h:["Dark text on light fills, white text on sea teal. White on flame is only 4.2:1, so avoid it."]}],
 wrap:'Fidelity is how close a design is to the final product. Keeping the wireframe’s structure while adding colour, type and imagery shows the examiner a clear lo-fi → hi-fi process.'},
{id:'ferry-proto',level:3,title:'Four-screen ferry booking prototype',unit:'U2 · M2U3',unitLong:'CAPE Digital Media Unit 2 · Module 2 · M2U3 Four types of prototype (high-fidelity user prototype); M3U6 user flows',file:'BayHopper_Ferry',doc:()=>stFerry(false),time:900,
 brief:'Island Pulse Media is testing the <b>Bay Hopper</b> ferry app (Basseterre, St. Kitts ↔ Charlestown, Nevis) with real passengers. Turn the four screens into a high-fidelity user prototype with no dead ends.',
 steps:[
  {t:'Set <b>Timetable</b> as a flow starting point named <b>Book a ferry</b>.',c:()=>{const t=frameNamed('Timetable');return (t&&PG.flows.some(f=>f.start===t.id&&nk(f.name).includes('book')))||'Add a flow starting point on Timetable and name it Book a ferry.'},h:["Select Timetable (click its name above the frame) ▸ Prototype tab ▸ Flow starting point ▸ +. Rename the flow."]},
  {t:'Link the screens in order: <b>Timetable → Choose trip → Pay → Confirmed</b>, each by tapping something on the screen.',c:()=>{const seq=['Timetable','Choose trip','Pay','Confirmed'].map(n=>frameNamed(n));if(seq.some(x=>!x))return 'Keep the four frame names.';for(let i=0;i<3;i++){if(!navsFrom(seq[i]).some(x=>x.to===seq[i+1]))return seq[i].name+' does not link to '+seq[i+1].name+' yet.'}return true},h:["Select Book 10:30 button ▸ + in Interactions ▸ Destination: Choose trip. Then Continue → Pay and Pay now → Confirmed."]},
  {t:'No dead ends: <b>Choose trip</b> and <b>Pay</b> have a <b>Back</b> action, and <b>Confirmed</b> has a way out.',c:()=>{const c=frameNamed('Choose trip'),p=frameNamed('Pay'),q=frameNamed('Confirmed');if(!c||!p||!q)return false;if(!hasBack(c))return 'Choose trip needs a Back.';if(!hasBack(p))return 'Pay needs a Back.';return (reactsIn(q).length>0)||'Confirmed needs an interaction (for example Done → Timetable).'},h:["Back buttons: Action ▸ Back. Done button: Navigate to Timetable."]},
  {t:'Use <b>Smart animate</b> on at least one link and <b>Move in</b>, <b>Slide in</b> or <b>Push</b> on another.',c:()=>{const all=PG.children.flatMap(f=>navsFrom(f));const sm=all.some(x=>x.r.anim==='smart'),mv=all.some(x=>['movein','slidein','push'].includes(x.r.anim));return (sm&&mv)||('Still needed: '+[!sm&&'Smart animate',!mv&&'Move in / Slide in / Push'].filter(Boolean).join(' and ')+'.')},h:["Click an interaction to open it, then change Animation."]},
  {t:'<b>Present</b> the flow, reach <b>Confirmed</b>, then come back to the start (Back or Done).',c:()=>{const v=(EV.pvisit||[]).map(nk);const i=v.indexOf('confirmed');return (i>=0&&(v.slice(i+1).includes('timetable')||(EV.back||0)>=1))||'Present ▸ book a trip ▸ reach Confirmed ▸ go back.'},h:["Press ▶, tap through to Confirmed, then tap Done or a Back button."]}],
 wrap:'A high-fidelity user prototype looks real, so stakeholders and testers react to it like the finished app. Testing it on passengers finds missing paths (like the return trip) cheaply.'},
{id:'responsive',level:3,title:'Responsive frames: phone, tablet, desktop',unit:'U2 · M3U5',unitLong:'CAPE Digital Media Unit 2 · Module 3 · M3U5 Screen size, resolution and touch; Module 2 · M2U3',file:'AntiguaSailingWeek_Landing',doc:stSailing,time:900,
 brief:'<b>Antigua Sailing Week</b> needs its landing page on a phone, a tablet and a desktop. Reuse the Mobile design so all three sizes share one layout.',
 steps:[
  {t:'Three top-level frames named <b>Mobile</b>, <b>Tablet</b> and <b>Desktop</b>.',c:()=>{const m=['Mobile','Tablet','Desktop'].filter(n=>!frameNamed(n));return !m.length||('Missing: '+m.join(', ')+'.')},h:["Select Mobile and press Ctrl+D twice. Rename the copies Tablet and Desktop."]},
  {t:'Sizes: Mobile 320–480 px wide, Tablet 700–1100 px, Desktop 1200 px or more.',c:()=>{const a=frameNamed('Mobile'),b=frameNamed('Tablet'),c=frameNamed('Desktop');if(!a||!b||!c)return false;const m=[];if(!(a.w>=320&&a.w<=480))m.push('Mobile');if(!(b.w>=700&&b.w<=1100))m.push('Tablet');if(!(c.w>=1200))m.push('Desktop');return !m.length||('Check the width of: '+m.join(', ')+'.')},h:["Type the width in W: 834 for Tablet, 1440 for Desktop."]},
  {t:'In each frame the <b>Header</b> runs the full width.',c:()=>{const bad=['Mobile','Tablet','Desktop'].filter(n=>{const f=frameNamed(n);const h=f&&inFrame(f,'Header');return !(h&&near(h.x,f.x,1)&&near(h.w,f.w,2))});return !bad.length||('Header not full width in: '+bad.join(', ')+'. Try the Left & right constraint.')},h:["Before duplicating, set the Header’s horizontal constraint to Left & right, then resize the frames."]},
  {t:'The <b>Register button</b> stays inside each frame and is at least 44 px tall.',c:()=>{const bad=['Mobile','Tablet','Desktop'].filter(n=>{const f=frameNamed(n);const b=f&&inFrame(f,'Register button');return !(b&&b.h>=44&&b.x>=f.x&&b.y>=f.y&&b.x+b.w<=f.x+f.w+.5&&b.y+b.h<=f.y+f.h+.5)});return !bad.length||('Check Register button in: '+bad.join(', ')+'.')},h:["Give the button the Left & right constraint too, and keep its height 44 or more."]},
  {t:'The <b>Headline</b> is bigger on Desktop than on Mobile.',c:()=>{const a=frameNamed('Mobile'),c=frameNamed('Desktop');const x=a&&inFrame(a,'Headline'),y=c&&inFrame(c,'Headline');return (x&&y&&y.font.size>x.font.size)||'Increase the Desktop headline size.'},h:["Select the Desktop headline and raise its font size, for example to 56."]}],
 wrap:'Responsive design keeps one layout but adapts sizes, columns and type to each screen. Constraints and auto layout do most of the work for you.'},
{id:'design-system',level:3,title:'Mini design system',unit:'U2 · M1U1',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U1 style guides; M2U3 components; Unit 1 · M3U6 visual communication',file:'KalinagoTrail_DesignSystem',doc:stKalinago,time:1200,

  {t:'<b>Export</b> the Button set as <b>PNG at 2x</b> or more.',c:()=>(EV.exports||[]).some(e=>e.fmt==='PNG'&&e.scale>=2&&D.pages.some(pg=>compSets(pg).some(s=>s.name===e.node)))||'Select the component set ▸ Export ▸ + ▸ 2x PNG ▸ Export.',h:["Select the component set ▸ Export ▸ + ▸ 2x ▸ Export."]}],

function rowFrames(){const out=[];for(const n of pageAll()){if(n.type==='FRAME'&&n.layout&&n.layout.mode==='H'){const t=n.children.find(k=>k.type==='TEXT'&&/route \d/.test(nk(k.text)));if(t&&n.children.some(k=>k.type==='ELLIPSE'))out.push({f:n,t:nk(t.text).match(/route \d/)[0]})}}return out}
function btnSet(){return allNodes().find(n=>n.type==='COMPONENT_SET'&&n.children.filter(k=>k.type==='COMPONENT').length>=2)||null}
function navOK(frame,node,to){const f=frameNamed(frame),t=frameNamed(to);const n=f&&inFrame(f,node);return !!(n&&t&&(n.react||[]).some(r=>r.act==='nav'&&r.to===t.id))}
function consIs(name,h,v){const n=byName1(name);if(!n)return 'Cannot find '+name+'.';const c=n.cons||{};const lab={L:'Left',R:'Right',LR:'Left & right',C:'Centre',S:'Scale',T:'Top',B:'Bottom',TB:'Top & bottom'};if(h&&c.h!==h)return name+': horizontal is '+lab[c.h||'L']+', needs '+lab[h]+'.';if(v&&c.v!==v)return name+': vertical is '+lab[c.v||'T']+', needs '+lab[v]+'.';return true}

function quickRefHTML(){const k=MOD;return `
<h4>Tools</h4><table class="dt"><tr><th>Tool</th><th>Key</th><th>What it does</th></tr>
<tr><td>Move</td><td>V</td><td>Select, move and resize layers. Click a frame’s name to select the frame.</td></tr>
<tr><td>Hand</td><td>H or hold Space</td><td>Pan around the canvas.</td></tr>
<tr><td>Frame</td><td>F (or A)</td><td>A screen or container. Choose phone, tablet or desktop presets.</td></tr>
<tr><td>Rectangle · Ellipse · Line · Arrow</td><td>R · O · L · Shift+L</td><td>Basic shapes. Hold Shift for squares, circles and 45° lines.</td></tr>
<tr><td>Text</td><td>T</td><td>Click for auto-width text, drag for a fixed-width box. Esc to finish.</td></tr>
<tr><td>Place image</td><td>${k}+Shift+K</td><td>Add a picture. Any shape can also have an image fill.</td></tr>
<tr><td>Comment</td><td>C</td><td>Drop a feedback pin on the design.</td></tr></table>
<h4>Shortcuts</h4><table class="dt"><tr><th>Action</th><th>Keys</th></tr>
<tr><td>Undo / redo</td><td>${k}+Z / ${k}+Shift+Z</td></tr><tr><td>Duplicate</td><td>${k}+D (or Alt+drag)</td></tr><tr><td>Copy / paste</td><td>${k}+C / ${k}+V</td></tr>
<tr><td>Group / ungroup</td><td>${k}+G / ${k}+Shift+G</td></tr><tr><td>Frame selection</td><td>${k}+Alt+G</td></tr>
<tr><td>Auto layout</td><td>Shift+A</td></tr><tr><td>Create component</td><td>${k}+Alt+K</td></tr><tr><td>Detach instance</td><td>${k}+Alt+B</td></tr>
<tr><td>Bring forward / to front</td><td>${k}+] / ${k}+Shift+]</td></tr><tr><td>Send backward / to back</td><td>${k}+[ / ${k}+Shift+[</td></tr>
<tr><td>Align left · centre · right</td><td>Alt+A · Alt+H · Alt+D</td></tr><tr><td>Align top · middle · bottom</td><td>Alt+W · Alt+V · Alt+S</td></tr><tr><td>Distribute</td><td>Alt+Shift+H / Alt+Shift+V</td></tr>
<tr><td>Show / hide · lock</td><td>${k}+Shift+H · ${k}+Shift+L</td></tr><tr><td>Rename layer</td><td>${k}+R (or double-click in Layers)</td></tr>
<tr><td>Select parent / children</td><td>Shift+Enter / Enter</td></tr><tr><td>Deep select</td><td>${k}+click, or double-click</td></tr><tr><td>Nudge</td><td>Arrow keys (Shift = 10 px)</td></tr>
<tr><td>Zoom to fit / selection / 100%</td><td>Shift+1 / Shift+2 / Shift+0</td></tr><tr><td>Zoom in / out</td><td>${k}+= / ${k}+−, or ${k}+scroll</td></tr>
<tr><td>Present</td><td>${k}+Alt+Enter</td></tr><tr><td>Save to this browser / export</td><td>${k}+S / ${k}+Shift+E</td></tr></table>
<h4>Key terms (CAPE Digital Media)</h4><table class="dt">
<tr><td><b>Wireframe</b></td><td>Low-fidelity skeleton of a screen: boxes, lines, greys. Focus on layout, structure and user flow.</td></tr>
<tr><td><b>Mock-up</b></td><td>High-fidelity, static picture of the screen with real colours, type and images. Not clickable.</td></tr>
<tr><td><b>Prototype</b></td><td>A model people can click or tap to test the idea. Low-fidelity user prototypes test the workflow; high-fidelity ones look real.</td></tr>
<tr><td><b>Fidelity</b></td><td>How close a design is to the final product: lo-fi → mid-fi → hi-fi.</td></tr>
<tr><td><b>Frame</b></td><td>A screen or container. Frames can clip their content and hold auto layout.</td></tr>
<tr><td><b>Auto layout</b></td><td>Rules for direction, gap and padding so items reflow automatically.</td></tr>
<tr><td><b>Component / instance</b></td><td>A reusable master and its linked copies. Edit the main component and every instance updates.</td></tr>
<tr><td><b>Variant</b></td><td>One state of a component (Default, Pressed, Disabled) kept together in a component set.</td></tr>
<tr><td><b>Constraints</b></td><td>What a layer is pinned to (left, right, centre, scale) when its frame is resized.</td></tr>
<tr><td><b>Style</b></td><td>A saved colour or text setting. Change it once and everything using it updates. The working version of a style guide.</td></tr>
<tr><td><b>Interaction</b></td><td>Trigger + action + animation, for example On tap → Navigate to Menu, Smart animate.</td></tr>
<tr><td><b>Flow starting point</b></td><td>The first screen testers see when you Present.</td></tr>
<tr><td><b>User flow</b></td><td>The steps a user takes to finish one task, such as ordering johnny cakes.</td></tr>
<tr><td><b>Contrast</b></td><td>Aim for at least 4.5:1 for body text so people can read it on a phone outdoors.</td></tr>
<tr><td><b>Touch target</b></td><td>Make buttons at least 44–48 px tall so a thumb can hit them.</td></tr></table>
<p style="font-size:12px;opacity:.75">Exam tip: Paper 02 has no Internet, so learn the vocabulary and be ready to describe these steps or draw the wireframe on paper.</p>`}

      '<div class="f"><label>Class</label><input id="f-cls" maxlength="10" value="' + esc(d.cls) + '" placeholder="e.g. L6, 5A"></div>' +
      '<div class="f"><label>Avatar</label><div class="grid">' + AVATARS.map(function (a) { return '<button data-av="' + a + '" class="' + (a === d.avatar ? 'on' : '') + '">' + a + '</button>'; }).join('') + '</div></div>' +
      '<div class="f"><label>Flag</label><select id="f-flag">' + FLAGS.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === d.flag ? ' selected' : '') + '>' + f[0] + '  ' + esc(f[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label>Subjects in your plan</label><div class="subs">' + SUBJ_ORDER.map(function (k) { return '<label><input type="checkbox" data-sub="' + k + '"' + (d.plan.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(subjName(k)) + '</label>'; }).join('') + '</div></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn big" data-act="save">Enter the arena</button></div>';
  }
  function viewList() {
    var me = S.me, out = '';
    out += '<div class="me">' + avHTML(me.avatar) + '<div class="grow"><div class="nm">' + esc(me.name) + ' ' + esc(me.flag) + '</div><div class="sub">' + esc(me.cls || 'No class') + ' · ' + me.plan.length + ' subject' + (me.plan.length === 1 ? '' : 's') + '</div></div>' + (me.locked ? '' : '<button class="btn2" data-act="edit">Edit</button>') + '</div>';
    out += '<label>Challenge subject</label><select id="subj">' + me.plan.map(function (k) { return '<option value="' + k + '"' + (k === S.subject ? ' selected' : '') + '>' + esc(subjName(k)) + '</option>'; }).join('') + '</select>';
    var live = S.conn === 'live' || S.conn === 'local';
    var ids = Object.keys(S.players).filter(function (k) { return S.filter === 'all' || (S.players[k].user.cls || '').toLowerCase() === (me.cls || '').toLowerCase(); });
    ids.sort(function (a, b) { var A = S.players[a], B = S.players[b]; return (A.status === 'match') - (B.status === 'match') || A.user.name.localeCompare(B.user.name); });
    out += '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Everyone</button><button class="chip ' + (S.filter === 'class' ? 'on' : '') + '" data-filter="class">My class</button></div>';
    out += '<div class="status"><i class="' + (live ? '' : 'off') + '"></i>' + (live ? ids.length + ' in the arena now · updates every few seconds' : S.conn === 'error' ? 'Can\'t reach the arena. Retrying…' : 'Connecting…') + '</div>';
    if (S.host) out += viewLobby();
    if (S.pendingJoin) out += '<div class="card"><h3>Joining ' + esc(S.pendingJoin.name) + '\'s match…</h3><div class="sub">Hang tight.</div></div>';
    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
