<!DOCTYPE html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XMind Lab · CAPE Digital Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13265e;--gold:#F5C542;--gold2:#ffd970;--ink:#EAF0FF;--muted:#AFC0EA;
  --ok:#3ddc97;--bad:#ff8a8a;
  --disp:"Bricolage Grotesque","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  /* app chrome (light) */
  --c-bg:#f3f4f7;--c-panel:#ffffff;--c-panel2:#f7f8fa;--c-line:#d9dce3;--c-line2:#e8eaef;--c-text:#1f2430;--c-text2:#5b6272;
  --c-hover:#e9edf5;--c-press:#dde4f2;--c-field:#ffffff;--c-shadow:0 10px 30px #0b1a4626;--c-desk:#d7dae1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --c-bg:#1b1e25;--c-panel:#23272f;--c-panel2:#2a2f39;--c-line:#3a404c;--c-line2:#323743;--c-text:#e8ebf2;--c-text2:#a8b0c0;
    --c-hover:#323846;--c-press:#3b4354;--c-field:#1b1e25;--c-shadow:0 10px 30px #0008;--c-desk:#14161b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-bg:#1b1e25;--c-panel:#23272f;--c-panel2:#2a2f39;--c-line:#3a404c;--c-line2:#323743;--c-text:#e8ebf2;--c-text2:#a8b0c0;
  --c-hover:#323846;--c-press:#3b4354;--c-field:#1b1e25;--c-shadow:0 10px 30px #0008;--c-desk:#14161b;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;max-width:100vw}
body{font-family:var(--ui);color:var(--c-text);background:var(--navy);font-size:13px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #4c8dff;outline-offset:1px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
kbd{font:600 11.5px var(--ui);background:#eef1f7;border:1px solid #c9cfdc;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:#1f2430;white-space:nowrap}

/* ============ START SCREEN ============ */
#start{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#1d3a8f55,transparent),linear-gradient(160deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);z-index:50}
#start .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
.brandrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.brandrow b{color:var(--gold)}
.brandrow .sp{flex:1}
.appicon{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;flex:none}
.appicon svg{display:block}
#start h1{font-family:var(--disp);font-size:clamp(34px,5vw,58px);margin:14px 0 6px;line-height:1.02;letter-spacing:-.01em}
#start h1 span{color:var(--gold)}
#start .pitch{font-size:18px;max-width:760px;color:#d7e1ff;margin:0 0 14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.objs li{border:1px solid #2c4590;background:#0d1d50;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#cfdcff}
.objs li b{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{position:relative;text-align:left;border:1px solid #2b4391;background:linear-gradient(180deg,#10225c,#0b1844);border-radius:18px;padding:20px 18px 18px;color:var(--ink);cursor:pointer;font-family:var(--body);transition:transform .15s,border-color .15s;min-height:190px}
.lvcard:hover,.lvcard:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.lvcard .em{font-size:30px}
.lvcard h2{font-family:var(--disp);margin:6px 0 4px;font-size:22px}
.lvcard p{margin:0 0 12px;color:#c4d2fb;font-size:14.5px}
.lvcard .bar{height:8px;border-radius:9px;background:#203a86;overflow:hidden}
.lvcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);width:0}
.lvcard .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#b8c8f5}
.startbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.gbtn{border:1px solid #33509f;background:#0f2160;color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.gbtn:hover{border-color:var(--gold)}
.gbtn:disabled{opacity:.45;cursor:default}
.gbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.xpline{display:flex;gap:18px;align-items:center;margin:4px 0 18px;color:#cfdcff;font-size:14px;flex-wrap:wrap}
.xpline b{color:var(--gold);font-family:var(--disp);font-size:20px}
.credit{margin-top:28px;color:#8fa3d8;font-size:12.5px;border-top:1px solid #1d2f6a;padding-top:14px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.credit button{background:none;border:0;color:#cfdcff;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:#0e1f58;border:1px solid #2a428e;border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;font-family:var(--body);min-height:150px}
.mcard:hover,.mcard:focus-visible{border-color:var(--gold)}
.mcard .num{font:700 11.5px var(--body);letter-spacing:.06em;color:var(--gold)}
.mcard h3{margin:0;font:700 16.5px var(--body)}
.mcard .ob{font-size:12px;color:#9fb4ec}
.mcard p{margin:2px 0 0;font-size:13.5px;color:#cfdcff;line-height:1.35}
.mcard .st{margin-top:auto;font-size:14px;color:var(--gold);letter-spacing:2px}
.backlink{background:none;border:0;color:var(--gold);font:600 14px var(--body);cursor:pointer;padding:6px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.badge{border:1px solid #2a428e;border-radius:14px;padding:12px;text-align:center;background:#0e1f58;color:#c9d6fb;font-size:13px}
.badge .bi{font-size:28px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--gold);color:#fff}
.badge.on .bi{filter:none;opacity:1}
.badge b{display:block;margin:4px 0 2px;color:inherit}
.lvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.starter{border:1px solid #2a428e;background:#0e1f58;border-radius:14px;padding:12px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--body)}
.starter:hover,.starter:focus-visible{border-color:var(--gold)}
.starter b{display:block;font-size:15px;margin-bottom:3px}
.starter small{color:#9fb4ec;font-size:12.5px}
.sechead{font:700 20px var(--disp);margin:28px 0 4px}

/* ============ COURSE BAR ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#coursebar{flex:none;height:42px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);border-bottom:1px solid #1d2f6a;overflow:hidden}
#coursebar .cbtn{flex:none;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:9px;padding:5px 9px;cursor:pointer;font:600 13px var(--body);white-space:nowrap;min-height:30px}
#coursebar .cbtn:hover{border-color:var(--gold)}
#coursebar .cbtn[aria-pressed=true]{background:var(--gold);color:#1b1500}
#coursebar .ctitle{flex:1;min-width:60px;font:700 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
#coursebar .ctitle small{font:400 12px var(--body);color:var(--muted)}
#coursebar .xp{flex:none;color:var(--gold);font:700 14px var(--disp);white-space:nowrap}
.dial{flex:none;display:flex;border:1px solid #2c4590;border-radius:9px;overflow:hidden}
.dial button{border:0;background:#0f2160;color:var(--ink);padding:5px 9px;cursor:pointer;font:600 12.5px var(--body);white-space:nowrap}
.dial button:hover{background:#1a2f75}
.dial button:disabled{opacity:.4;cursor:default}
.dial .lv{padding:5px 9px;background:#071237;color:var(--gold);font:700 12.5px var(--body);white-space:nowrap;display:flex;align-items:center}
#appmain{flex:1;display:flex;min-height:0;position:relative}
#appwin{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--c-bg);color:var(--c-text)}
.cb-lbl{display:inline}

/* ======= MISSION PANEL ======= */
#mission{flex:none;width:330px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0B1A46,#060D26);color:var(--ink);font-family:var(--body);border-left:3px solid var(--gold);min-height:0;transition:width .2s}
#mission.collapsed{width:40px}
#mission.collapsed .mbody,#mission.collapsed .mhead .mtt,#mission.collapsed .mfoot,#mission.collapsed .mbar{display:none}
.mhead{padding:10px 12px 8px;border-bottom:1px solid #1f3474;display:flex;gap:8px;align-items:flex-start}
.mhead h2{margin:0;font:700 17px/1.2 var(--disp)}
.mhead .mob{font-size:12px;color:var(--gold);margin-bottom:2px}
.mhead .colbtn{flex:none;margin-left:auto;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:7px;width:28px;height:28px;cursor:pointer}
.mbody{flex:1;overflow:auto;padding:10px 12px 16px}
.brief{background:#0f2160;border:1px solid #233d86;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:#dfe7ff}
.brief b{color:#fff}
.tagline{font-size:12px;color:#9fb4ec;margin:8px 0 0}
.steps{list-style:none;margin:12px 0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-radius:9px;font-size:14px;line-height:1.35}
.steps li .sn{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #3b57a6;display:grid;place-items:center;font:700 12px var(--disp);color:#b8c8f5}
.steps li.ok .sn{background:var(--ok);border-color:var(--ok);color:#03311d}
.steps li.ok .st{color:#a9f0cf}
.steps li.cur{background:#132a6c;outline:1px solid #2c4590}
.steps li .fb{display:block;margin-top:4px;font-size:12.5px;color:#ffd1d1}
.steps li.ok .fb{display:none}
.mbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid #1f3474}
.mbtn{border:1px solid #2f4b9c;background:#10235f;color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font:600 13.5px var(--body);min-height:34px}
.mbtn:hover{border-color:var(--gold)}
.mbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.mbtn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #f5c54266}}
.hintbox{margin-top:10px;background:#1a1a3a;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#fff3c4}
.mtimer{font:700 13px var(--disp);color:var(--gold);margin-left:8px;align-self:center}
.complete{text-align:center;padding:12px 6px}
.complete .stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.complete h3{font:800 22px var(--disp);margin:4px 0}
.complete p{color:#c4d2fb}
.mfoot{padding:8px 12px;border-top:1px solid #1f3474;font-size:11.5px;color:#8fa3d8}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #F5C542!important;outline-offset:1px;position:relative;z-index:30}
@keyframes pulse{50%{outline-color:#ff8b00;box-shadow:0 0 0 6px #f5c54255}}
#drawerBtn{display:none}

/* ======= MENUS / DIALOGS / TOAST ======= */
.menu{position:fixed;z-index:300;background:var(--c-panel);border:1px solid var(--c-line);border-radius:8px;box-shadow:var(--c-shadow);padding:4px;min-width:200px;max-height:80vh;overflow:auto;font:13px var(--ui);color:var(--c-text)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;min-height:30px}
.menu .mi:hover,.menu .mi:focus{background:var(--c-hover);outline:none}
.menu .mi[aria-disabled=true]{opacity:.45}
.menu .mi .mic{width:20px;display:grid;place-items:center;flex:none}
.menu .mi .kb{margin-left:auto;color:var(--c-text2);padding-left:18px;font-size:11.5px}
.menu .mi .sub{margin-left:auto;font-size:10px;padding-left:12px}
.menu .sep{height:1px;background:var(--c-line2);margin:4px 2px}
.menu .mh{padding:6px 10px 2px;font-weight:700;color:var(--c-text2);font-size:11.5px}
#dlgLayer{position:fixed;inset:0;z-index:250;pointer-events:none}
.dlgback{position:fixed;inset:0;background:#00000040;pointer-events:auto}
.dlg{position:fixed;background:var(--c-panel);color:var(--c-text);border-radius:10px;box-shadow:0 18px 50px #0006;border:1px solid var(--c-line);min-width:min(300px,94vw);max-width:min(96vw,860px);max-height:92vh;display:flex;flex-direction:column;pointer-events:auto;font:13px var(--ui)}
.dlg .dh{display:flex;align-items:center;padding:10px 10px 6px 16px;font-size:15px;font-weight:700;cursor:move;user-select:none;touch-action:none}
.dlg .dh span{flex:1}
.dlg .dh button{border:0;background:transparent;width:30px;height:30px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--c-text)}
.dlg .dh button:hover{background:#e81123;color:#fff}
.dlg .db{padding:6px 16px 12px;overflow:auto;line-height:1.45}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--c-line2);align-items:center;flex-wrap:wrap}
.dlg label.f{display:block;margin:8px 0 3px;font-weight:700}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{font:13px var(--ui);border:1px solid var(--c-line);border-radius:5px;padding:5px 7px;min-height:30px;background:var(--c-field);color:var(--c-text);width:100%}
.dlg textarea{min-height:90px;resize:vertical}
.pbtn{border:1px solid var(--c-line);background:var(--c-panel2);color:var(--c-text);border-radius:7px;padding:6px 14px;cursor:pointer;font:600 13px var(--ui);min-height:32px}
.pbtn:hover{background:var(--c-hover)}
.pbtn.pri{background:#2563eb;border-color:#2563eb;color:#fff}
.pbtn.pri:hover{background:#1d4fd8}
.pbtn.danger{color:#c62828}
table.qref{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:10px}
table.qref th,table.qref td{border:1px solid var(--c-line);padding:5px 8px;text-align:left;vertical-align:top}
table.qref th{background:var(--c-panel2)}
.qtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px;border-bottom:1px solid var(--c-line)}
.qtabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 12px;border-radius:6px 6px 0 0;cursor:pointer;font-weight:600;color:var(--c-text2)}
.qtabs button[aria-selected=true]{border-color:var(--c-line);background:var(--c-panel);color:var(--c-text);margin-bottom:-1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:9px;z-index:400;font:13.5px var(--ui);box-shadow:0 6px 20px #0004;max-width:min(90vw,560px);text-align:center}
.toast.gold{background:var(--navy2);color:var(--ink);border:1px solid var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;width:100vw;height:100vh}
.narrow-banner{position:fixed;left:8px;right:8px;top:48px;z-index:600;background:var(--gold);color:#1b1500;border-radius:10px;padding:8px 12px;font:600 13px var(--body);display:flex;gap:8px;align-items:center}
.narrow-banner button{margin-left:auto;border:0;background:#1b1500;color:var(--gold);border-radius:6px;padding:4px 10px;cursor:pointer}
.expimg{display:block;max-width:100%;max-height:46vh;margin:8px auto;border:1px solid var(--c-line);background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px}
.exptxt{width:100%;min-height:160px;font:12px ui-monospace,Consolas,monospace!important}
.note{color:var(--c-text2);font-size:12px}

/* ======= TOUR ======= */
#tour{position:fixed;inset:0;z-index:450}
#tour .ring{position:fixed;border-radius:10px;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px #050b2299;transition:all .25s;pointer-events:none}
#tour .bubble{position:fixed;width:min(340px,92vw);background:var(--navy2);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;font:14px/1.45 var(--body);box-shadow:0 14px 40px #0008}
#tour .bubble h3{margin:0 0 6px;font:800 18px var(--disp);color:var(--gold)}
#tour .bubble p{margin:0 0 10px}
#tour .tnav{display:flex;gap:6px;align-items:center}
#tour .tnav .cnt{margin-right:auto;font-size:12px;color:var(--muted)}

@media (max-width:1100px){#mission{width:290px}}
@media (max-width:900px){
  #mission{position:absolute;right:0;top:0;bottom:0;z-index:120;width:min(340px,92vw);box-shadow:-10px 0 30px #0006;transform:translateX(105%);transition:transform .2s}
  #mission.open{transform:none}
  #mission.collapsed{width:min(340px,92vw)}
  #mission.collapsed .mbody,#mission.collapsed .mhead .mtt,#mission.collapsed .mfoot,#mission.collapsed .mbar{display:flex}
  #mission.collapsed .mbody{display:block}
  #drawerBtn{display:inline-block}
  .levels{grid-template-columns:1fr}
}
@media (max-width:700px){
  .cb-lbl{display:none}
  #coursebar .ctitle small{display:none}
  #coursebar .xp{display:none}
  #coursebar{gap:4px;padding:0 5px}
  #coursebar .cbtn{padding:5px 7px}
  .dial button{padding:5px 6px}
  .dial .lv{padding:5px 6px}
  #start .wrap{padding:18px 16px 30px}
  #start .pitch{font-size:16px}
  .mlist{grid-template-columns:1fr}
}
@media print{body *{visibility:hidden}}

/* ============ XMIND LAB WINDOW ============ */
:root{--accT:#0b7f82;--acc:#0b7f82;--acc2:#086467;--accl:#e1f3f3}
:root[data-theme="dark"]{--accT:#6fd9db;--accl:#163c3d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accT:#6fd9db;--accl:#163c3d}}
#appwin{font-family:var(--ui);font-size:13px}
#xm-menubar{flex:none;height:40px;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--c-panel);border-bottom:1px solid var(--c-line);min-width:0}
.xm-logo{width:26px;height:26px;flex:none;margin-right:6px;display:grid;place-items:center}
.xm-mb{border:0;background:transparent;border-radius:6px;padding:6px 9px;cursor:pointer;color:var(--c-text);font-weight:600;flex:none}
.xm-mb:hover,.xm-mb[aria-expanded=true]{background:var(--c-hover)}
.xm-title{flex:1;min-width:40px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c-text2);padding:0 8px}
.xm-title b{color:var(--c-text)}
.xm-title small{margin-left:6px;font-size:11.5px;padding:1px 6px;border-radius:9px;background:var(--c-panel2);border:1px solid var(--c-line)}
.xm-export{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--acc);color:#fff;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer;min-height:30px}
.xm-export:hover{background:var(--acc2)}
#xm-toolbar{flex:none;min-height:54px;display:flex;align-items:center;gap:2px;padding:3px 8px;background:var(--c-panel2);border-bottom:1px solid var(--c-line);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tb{flex:none;border:1px solid transparent;background:transparent;border-radius:7px;min-width:34px;height:34px;padding:0 6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--c-text)}

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

function gsGet(){

/* ===================== XMind Lab · layout for every structure ===================== */
const LVS={root:[22,true,22,14,250],main:[16,true,14,9,220],sub:[14,false,9,5,200],float:[15,true,13,8,220],sum:[15,true,13,8,200]};
const lvOf=k=>k==='root'?'root':k==='main'?'main':k==='float'?'float':k==='sum'?'sum':'sub';
const childKind=k=>k==='root'?'main':k==='float'||k==='fsub'?'fsub':k==='sum'||k==='ssub'?'ssub':'sub';

function metrics(t,kind,struct){const lv=lvOf(kind);const b=LVS[lv];const st=t.st||{};const size=st.size||b[0];const bold=st.bold!=null?!!st.bold:b[1];const padX=b[2],padY=b[3];
  const lines=wrapT(t.t===''?' ':t.t,b[4],size,bold);const txW=Math.max(size*.6,...lines.map(l=>tw(l,size,bold)));
  const ms=Math.round(Math.min(20,size*1.05+1));const nm=(t.mk||[]).length;const mkW=nm?nm*(ms+4):0;const noteW=t.note?ms+2:0;
  let shape=st.shape||(lv==='sub'&&!['org','matrix','timeline'].includes(struct)?'line':'round');if(shape==='line'&&st.fill)shape='round';

    add:(t,kind,depth,x,y,m,col,side)=>{const n=Object.assign({id:t.id,t,kind,depth,x:Math.round(x),y:Math.round(y),col,side},m);ctx.N.set(t.id,n);return n},

  if(st==='map'||st==='logic')layMap(s,ctx,st==='map');else if(st==='org')layOrg(s,ctx);else if(st==='tree')layTree(s,ctx);else if(st==='timeline')layTimeline(s,ctx);else if(st==='fishbone')layFish(s,ctx);else if(st==='matrix')layMatrix(s,ctx);else layMap(s,ctx,true);

/* ---- horizontal trees: mind map (balanced) and logic chart ---- */
function hMeasure(t,kind,depth,ctx){const m=ctx.m(t,kind);const ks=kidsOf(t);if(!ks.length){ctx.sh.set(t.id,m.H);return m.H}const gap=depth===0?22:depth===1?12:7;let sum=0;ks.forEach((c,i)=>{sum+=hMeasure(c,childKind(kind),depth+1,ctx)+(i?gap:0)});ctx.kt.set(t.id,sum);const v=Math.max(m.H,sum);ctx.sh.set(t.id,v);return v}
function hPlace(t,kind,depth,x,yTop,dir,col,ctx){const m=ctx.m(t,kind);const shh=ctx.sh.get(t.id);const y=yTop+(shh-m.H)/2;const n=ctx.add(t,kind,depth,dir>0?x:x-m.w,y,m,col,dir);const ks=kidsOf(t);if(!ks.length)return n;
  const gap=depth===0?22:depth===1?12:7;let cy=yTop+(shh-ctx.kt.get(t.id))/2;const hg=depth===0?56:depth===1?36:26;const cx=dir>0?n.x+m.w+hg:n.x-hg;
  ks.forEach((c,i)=>{const cc=kind==='root'?ctx.col(i):col;const cn=hPlace(c,childKind(kind),depth+1,cx,cy,dir,cc,ctx);ctx.E.push(hEdge(n,cn,dir,cc));cy+=ctx.sh.get(c.id)+gap});return n}
function anch(n,dir,out){if(n.kind==='root'&&out)return {x:n.x+n.w/2,y:n.y+n.h/2};const right=out?dir>0:dir<0;return {x:right?n.x+n.w:n.x,y:n.shape==='line'?n.y+n.h:n.y+n.h/2}}
function hEdge(p,c,dir,col){const a=anch(p,dir,true),b=anch(c,dir,false);const dx=b.x-a.x;return {d:`M${a.x} ${a.y}C${a.x+dx*.55} ${a.y} ${b.x-dx*.45} ${b.y} ${b.x} ${b.y}`,col,w:p.kind==='root'?2.6:p.depth===1?1.8:1.4}}
function layMap(s,ctx,balanced){const r=s.root;const m=ctx.m(r,'root');const ks=kidsOf(r);ks.forEach(c=>hMeasure(c,'main',1,ctx));
  const n=ctx.add(r,'root',0,-m.w/2,-m.h/2,m,ctx.th.rootF,1);const half=Math.ceil(ks.length/2);
  const right=balanced?ks.slice(0,half):ks,left=balanced?ks.slice(half).reverse():[];
  const side=(list,dir)=>{const gap=22;const tot=list.reduce((a,c,i)=>a+ctx.sh.get(c.id)+(i?gap:0),0);let cy=-tot/2;const cx=dir>0?n.x+m.w+56:n.x-56;list.forEach(c=>{const i=ks.indexOf(c);const col=ctx.col(i);const cn=hPlace(c,'main',1,cx,cy,dir,col,ctx);ctx.E.push(hEdge(n,cn,dir,col));cy+=ctx.sh.get(c.id)+gap})};
  side(right,1);side(left,-1)}
/* ---- org chart (top-down) ---- */
function vMeasure(t,kind,ctx){const m=ctx.m(t,kind);const ks=kidsOf(t);if(!ks.length){ctx.sw.set(t.id,m.w);return m.w}const gap=kind==='root'?30:16;let sum=0;ks.forEach((c,i)=>{sum+=vMeasure(c,childKind(kind),ctx)+(i?gap:0)});ctx.kt.set(t.id,sum);const w=Math.max(m.w,sum);ctx.sw.set(t.id,w);return w}
function vPlace(t,kind,depth,xL,y,col,ctx){const m=ctx.m(t,kind);const sw=ctx.sw.get(t.id);const n=ctx.add(t,kind,depth,xL+(sw-m.w)/2,y,m,col,1);const ks=kidsOf(t);if(!ks.length)return n;const gap=kind==='root'?30:16;let cx=xL+(sw-ctx.kt.get(t.id))/2;const cy=y+m.H+(depth===0?48:36);
  ks.forEach((c,i)=>{const cc=kind==='root'?ctx.col(i):col;const cn=vPlace(c,childKind(kind),depth+1,cx,cy,cc,ctx);const px=n.x+n.w/2,py=n.y+n.H,qx=cn.x+cn.w/2,qy=cn.y,my=Math.round(py+(qy-py)/2);ctx.E.push({d:`M${px} ${py}V${my}H${qx}V${qy}`,col:cc,w:depth===0?2.2:1.5});cx+=ctx.sw.get(c.id)+gap});return n}
function layOrg(s,ctx){const r=s.root;const m=ctx.m(r,'root');const sw=vMeasure(r,'root',ctx);vPlace(r,'root',0,-sw/2,-m.h/2,ctx.th.rootF,ctx)}
/* ---- tree chart (indented) ---- */
function treeMeasure(t,kind,ctx){const m=ctx.m(t,kind);let h=m.H,w=m.w;const ind=kind==='root'?36:26;for(const c of kidsOf(t)){const r=treeMeasure(c,childKind(kind),ctx);h+=10+r.h;w=Math.max(w,ind+r.w)}const v={w,h};ctx.tm.set(t.id,v);return v}
function treePlace(t,kind,depth,x,y,col,ctx){const m=ctx.m(t,kind);const n=ctx.add(t,kind,depth,x,y,m,col,1);let cy=y+m.H+10;const ind=kind==='root'?36:26;
  kidsOf(t).forEach((c,i)=>{const cc=kind==='root'?ctx.col(i):col;const cn=treePlace(c,childKind(kind),depth+1,x+ind,cy,cc,ctx);const px=n.x+Math.min(kind==='root'?22:14,n.w/2),py=n.y+n.H,qy=cn.shape==='line'?cn.y+cn.h:cn.y+cn.h/2;ctx.E.push({d:`M${px} ${py}V${qy-6}Q${px} ${qy} ${px+6} ${qy}H${cn.x}`,col:cc,w:depth===0?2:1.4});cy+=ctx.tm.get(c.id).h+10});return n}
function layTree(s,ctx){const r=s.root;const m=ctx.m(r,'root');treeMeasure(r,'root',ctx);treePlace(r,'root',0,-m.w/2,-m.h/2,ctx.th.rootF,ctx)}
/* ---- timeline (horizontal) ---- */
function layTimeline(s,ctx){const r=s.root;const m=ctx.m(r,'root');const n=ctx.add(r,'root',0,-m.w,-m.h/2,m,ctx.th.rootF,1);let x=n.x+m.w+60;const ks=kidsOf(r);
  ks.forEach((c,i)=>{const col=ctx.col(i);const mm=ctx.m(c,'main');const sub=kidsOf(c);const sz=sub.map(k=>treeMeasure(k,'sub',ctx));const colW=Math.max(mm.w,mm.w/2+16+Math.max(0,...sz.map(z=>z.w)));
    const cn=ctx.add(c,'main',1,x,-mm.h/2,mm,col,1);const up=i%2===1;const tot=sz.reduce((a,z)=>a+z.h+10,0)-10;const px=cn.x+mm.w/2;let cy=up?cn.y-30-tot:cn.y+mm.H+30;
    sub.forEach((k,j)=>{const kn=treePlace(k,'sub',2,px+16,cy,col,ctx);const qy=kn.shape==='line'?kn.y+kn.h:kn.y+kn.h/2;const py=up?cn.y:cn.y+cn.H;ctx.E.push({d:`M${px} ${py}V${qy}H${kn.x}`,col,w:1.5});cy+=sz[j].h+10});
    ctx.deco.push(`<circle cx="${px}" cy="${up?cn.y-6:cn.y+cn.H+6}" r="0" fill="${col}"/>`);x+=colW+48});
  const x2=Math.max(x-20,n.x+m.w+80);ctx.deco.unshift(`<path d="M${n.x+m.w} 0H${x2}" stroke="${ctx.th.line}" stroke-width="4" stroke-linecap="round"/><path d="M${x2+14} 0l-16-9v18z" fill="${ctx.th.line}"/>`);ctx.ext.push([n.x,-20,x2+20,20])}
/* ---- fishbone (cause and effect, head on the right) ---- */
function layFish(s,ctx){const r=s.root;const m=ctx.m(r,'root');const head=ctx.add(r,'root',0,0,-m.h/2,m,ctx.th.rootF,-1);const ks=kidsOf(r);const SL=.55;let attach=-56,minX=-60;const pairs=[];for(let i=0;i<ks.length;i+=2)pairs.push(ks.slice(i,i+2));
  pairs.forEach((pair,k)=>{const cats=pair.map((c,j)=>{const cm=ctx.m(c,'main');const causes=kidsOf(c).map(z=>{const zm=ctx.m(z,'sub');const subs=kidsOf(z).map(q=>({q,qm:ctx.m(q,'sub')}));return {z,zm,subs,sh:zm.H+subs.reduce((a,b)=>a+b.qm.H+5,0)}});let d=30;causes.forEach(cs=>{cs.d=d;d+=cs.sh+12});return {c,cm,causes,Lb:Math.max(76,d+14),top:j===0}});
    const over=Math.max(0,...cats.map(ct=>ct.cm.w/2-ct.Lb*SL+14));if(k>0)attach=minX-34-over;let left=attach;
    cats.forEach((ct,j)=>{const col=ctx.col(k*2+j);const sg=ct.top?-1:1;const ex=attach-ct.Lb*SL,ey=sg*ct.Lb;const cn=ctx.add(ct.c,'main',1,ex-ct.cm.w/2,ct.top?ey-ct.cm.H:ey,ct.cm,col,-1);
      ctx.E.push({d:`M${attach} 0L${ex} ${ey}`,col,w:2.2});left=Math.min(left,cn.x);
      ct.causes.forEach(cs=>{const yTop=ct.top?-(cs.d+cs.sh):cs.d;const yc=cs.zm.shape==='line'?yTop+cs.zm.h:yTop+cs.zm.h/2;const bx=attach-Math.abs(yc)*SL;const zx=bx-10-cs.zm.w;const zn=ctx.add(cs.z,'sub',2,zx,yTop,cs.zm,col,-1);ctx.E.push({d:`M${zx+cs.zm.w} ${yc}L${bx} ${yc}`,col,w:1.5});left=Math.min(left,zx);
        let qy=yTop+cs.zm.H+5;cs.subs.forEach(({q,qm})=>{const qx=zx+cs.zm.w-16-qm.w;const qn=ctx.add(q,'sub',3,qx,qy,qm,col,-1);const ay=qm.shape==='line'?qy+qm.h:qy+qm.h/2;ctx.E.push({d:`M${zx+cs.zm.w-8} ${yc}V${ay}H${qx+qm.w}`,col,w:1.2});left=Math.min(left,qx);qy+=qm.H+5;
          /* deeper levels stay folded into a count so the fish stays readable */});
      })});minX=left});
  const tail=minX-24;ctx.deco.push(`<path d="M${tail} 0H${head.x}" stroke="${ctx.th.line}" stroke-width="4" stroke-linecap="round"/><path d="M${tail} 0l-22-16v32z" fill="${ctx.th.line}"/>`);ctx.ext.push([tail-26,-20,0,20])}
/* ---- matrix (rows are main topics, columns are subtopic positions) ---- */
function layMatrix(s,ctx){const r=s.root;const rm=ctx.m(r,'root');const ks=kidsOf(r);const cols=(s.cols||[]).map(x=>norm(x)).filter((x,i,a)=>i<a.length);const nC=Math.max(cols.length,1,...ks.map(c=>kidsOf(c).length));
  const cell=(c,j)=>{const z=kidsOf(c)[j];return z?treeMeasure(z,'sub',ctx):{w:0,h:0}};
  const c0=Math.max(rm.w,...ks.map(c=>ctx.m(c,'main').w))+28;const cw=[];for(let j=0;j<nC;j++)cw[j]=Math.max(120,cols[j]?tw(cols[j],14,true)+28:0,...ks.map(c=>cell(c,j).w+26));
  const h0=Math.max(rm.h,30)+24;const rh=ks.map(c=>Math.max(ctx.m(c,'main').H,...Array.from({length:nC},(_,j)=>cell(c,j).h))+26);
  const x0=-c0/2,y0=-h0/2;const W=c0+cw.reduce((a,b)=>a+b,0),H=h0+rh.reduce((a,b)=>a+b,0);const th=ctx.th;
  let g=`<rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="${th.bg}" stroke="${th.line}" stroke-width="1.5" rx="6"/><rect x="${x0}" y="${y0}" width="${W}" height="${h0}" fill="${th.lab}"/><rect x="${x0}" y="${y0}" width="${c0}" height="${H}" fill="${th.lab}" opacity=".6"/>`;
  let cx=x0+c0;for(let j=0;j<nC;j++){g+=`<path d="M${cx} ${y0}V${y0+H}" stroke="${th.line}" stroke-opacity=".35"/>`;if(cols[j])g+=`<text x="${cx+cw[j]/2}" y="${y0+h0/2+5}" text-anchor="middle" font-family="${XF}" font-size="14" font-weight="600" fill="${th.mainT}">${esc(cols[j])}</text>`;cx+=cw[j]}
  let yy=y0+h0;rh.forEach(h=>{g+=`<path d="M${x0} ${yy}H${x0+W}" stroke="${th.line}" stroke-opacity=".35"/>`;yy+=h});ctx.deco.push(g);ctx.ext.push([x0,y0,x0+W,y0+H]);
  ctx.add(r,'root',0,x0+(c0-rm.w)/2,y0+(h0-rm.h)/2,rm,th.rootF,1);
  let y=y0+h0;ks.forEach((c,i)=>{const col=ctx.col(i);const mm=ctx.m(c,'main');ctx.add(c,'main',1,x0+(c0-mm.w)/2,y+(rh[i]-mm.H)/2,mm,col,1);let cx=x0+c0;kidsOf(c).forEach((z,j)=>{treePlace(z,'sub',2,cx+13,y+13,col,ctx);cx+=cw[j]});y+=rh[i]})}
/* ---- boundaries and summaries ---- */
function subBox(ids,ctx){let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;const s=ctx.s;for(const id of ids){const t=tById(id,s);if(!t)continue;for(const x of walk(t,null,0,'x')){const n=ctx.N.get(x.t.id);if(!n)continue;x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+n.w);y2=Math.max(y2,n.y+n.H)}}return isFinite(x1)?{x1,y1,x2,y2}:null}
function layExtras(s,ctx){const th=ctx.th;
  for(const sm of s.sums){const ids=sm.ids.filter(id=>ctx.N.has(id));if(!ids.length||!sm.topic)continue;const b=subBox(ids,ctx);const n0=ctx.N.get(ids[0]);const col=n0.col||th.line;const mode=s.struct==='org'?'down':n0.side<0&&s.struct!=='fishbone'?'left':'right';const m=ctx.m(sm.topic,'sum');hMeasure(sm.topic,'sum',1,ctx);const shh=ctx.sh.get(sm.topic.id);let d;
    if(mode==='down'){const y=b.y2+8,mx=(b.x1+b.x2)/2;d=`M${b.x1} ${y}Q${b.x1} ${y+10} ${b.x1+10} ${y+10}H${mx-8}Q${mx} ${y+10} ${mx} ${y+20}Q${mx} ${y+10} ${mx+8} ${y+10}H${b.x2-10}Q${b.x2} ${y+10} ${b.x2} ${y}`;hPlace(sm.topic,'sum',1,mx-m.w/2,y+30,1,col,ctx)}
    else{const dir=mode==='left'?-1:1;const x=dir>0?b.x2+8:b.x1-8,my=(b.y1+b.y2)/2;const k=dir*10;d=`M${x} ${b.y1}Q${x+k} ${b.y1} ${x+k} ${b.y1+10}V${my-8}Q${x+k} ${my} ${x+2*k} ${my}Q${x+k} ${my} ${x+k} ${my+8}V${b.y2-10}Q${x+k} ${b.y2} ${x} ${b.y2}`;hPlace(sm.topic,'sum',1,x+dir*28,my-shh/2,dir,col,ctx)}
    ctx.sumG.push({id:sm.id,d,col});const sn=ctx.N.get(sm.topic.id);if(sn)sn.sumId=sm.id}
  for(const bd of s.bnds){const ids=bd.ids.filter(id=>ctx.N.has(id));if(!ids.length)continue;const b=subBox(ids,ctx);const n0=ctx.N.get(ids[0]);const pad=9,lh=bd.lab?24:0;ctx.bndG.push({id:bd.id,x:b.x1-pad,y:b.y1-pad-lh,w:b.x2-b.x1+pad*2,h:b.y2-b.y1+pad*2+lh,lab:bd.lab||'',col:n0.col||th.bnd})}}

/* ===================== XMind Lab · drawing the map as SVG ===================== */
function topicSVG(n,th,o){const t=n.t;const st=t.st||{};let fill='none',stroke=n.col||th.line,txt=th.subT,sw=1.5;const lv=n.lv;
  if(lv==='root'){fill=th.rootF;stroke=th.rootF;txt=th.rootT}
  else if(lv==='main'||lv==='sum'){fill=mix(n.col||th.line,th.bg,.82);txt=th.mainT;sw=1.8}
  else if(lv==='float'){fill=th.floatF;stroke=th.floatS;txt=th.mainT}
  else if(n.shape!=='line'){fill=mix(n.col||th.line,th.bg,.9)}
  if(st.fill&&FILLS[st.fill]){fill=FILLS[st.fill];txt=lum(fill)<.45?'#ffffff':'#1b2433'}
  const w=n.w,h=n.h;let sh='';
  switch(n.shape){case 'rect':sh=`<rect width="${w}" height="${h}" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;break;
   case 'capsule':sh=`<rect width="${w}" height="${h}" rx="${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;break;
   case 'ellipse':sh=`<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;break;
   case 'line':sh=`<rect width="${w}" height="${h}" fill="${th.bg}" fill-opacity="0"/><path d="M0 ${h}H${w}" stroke="${stroke}" stroke-width="${n.depth<=2?2:1.6}" stroke-linecap="round"/>`;break;
   case 'none':sh=`<rect width="${w}" height="${h}" fill="${fill==='none'?th.bg:fill}" fill-opacity="${fill==='none'?0:1}"/>`;break;
   default:sh=`<rect width="${w}" height="${h}" rx="${lv==='root'?12:Math.min(8,h/2.4)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`}
  let mk='';(t.mk||[]).forEach((m,i)=>{mk+=`<g transform="translate(${n.padX+i*(n.ms+4)} ${(h-n.ms)/2})">${mkSVG(m,n.ms)}</g>`});
  const top=(h-n.lines.length*n.lineH)/2;let tx='';n.lines.forEach((L,i)=>{tx+=`<text x="${n.padX+n.mkW}" y="${(top+i*n.lineH+n.lineH*.5+n.size*.36).toFixed(1)}" font-family="${XF}" font-size="${n.size}"${n.bold?' font-weight="600"':''} fill="${txt}">${esc(L)}</text>`});
  let note='';if(t.note){const s=n.ms*.8,x=w-n.padX-s+1,y=(h-s)/2;note=`<g transform="translate(${x} ${y})"><rect width="${s*.8}" height="${s}" rx="1.5" fill="#fff8d6" stroke="#c69300" stroke-width="1"/><path d="M${s*.18} ${s*.32}H${s*.62}M${s*.18} ${s*.52}H${s*.62}M${s*.18} ${s*.72}H${s*.48}" stroke="#c69300" stroke-width="1"/></g>`}
  let lab='';if(t.lab){const L=t.lab.length>36?t.lab.slice(0,35)+'…':t.lab;const lw=tw(L,11,false)+16;lab=`<g transform="translate(${Math.max(0,(n.shape==='line'?0:(w-lw)/2))} ${h+4})"><rect width="${lw}" height="17" rx="8.5" fill="${th.lab}"/><text x="8" y="12.4" font-family="${XF}" font-size="11" fill="${th.labT}">${esc(L)}</text></g>`}
  return `<g class="tp" data-id="${t.id}" transform="translate(${n.x} ${n.y})">${sh}${mk}${tx}${note}${lab}</g>`}
function knobPos(n,struct){if(struct==='org')return {x:n.x+n.w/2,y:n.y+n.H+9};if(n.side<0)return {x:n.x-9,y:n.shape==='line'?n.y+n.h:n.y+n.h/2};return {x:n.x+n.w+9,y:n.shape==='line'?n.y+n.h:n.y+n.h/2}}
function hiddenKids(n,L){return n.t.ch.length&&!n.t.ch.some(c=>L.N.has(c.id))}
function countDesc(t){let k=-1;for(const x of walk(t,null,0,'x'))k++;return k}
function knobSVG(n,L,open){const p=knobPos(n,L.struct);const col=n.col||L.th.line;if(open)return `<g data-knob="${n.id}" class="knob"><circle cx="${p.x}" cy="${p.y}" r="8" fill="${L.th.bg}" stroke="${col}" stroke-width="1.5"/><path d="M${p.x-4} ${p.y}H${p.x+4}" stroke="${col}" stroke-width="1.8"/></g>`;const c=countDesc(n.t);return `<g data-knob="${n.id}" class="knob"><circle cx="${p.x}" cy="${p.y}" r="${c>9?10:8.5}" fill="${col}"/><text x="${p.x}" y="${p.y+3.8}" text-anchor="middle" font-family="${XF}" font-size="10.5" font-weight="700" fill="#fff">${c}</text></g>`}
function clipBox(n,tx,ty){const cx=n.x+n.w/2,cy=n.y+n.h/2;const dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return {x:cx,y:cy};const sx=Math.abs(dx)/(n.w/2+3),sy=Math.abs(dy)/(n.h/2+3);const k=1/Math.max(sx,sy);return {x:cx+dx*k,y:cy+dy*k}}
function relGeom(r,L){const A=L.N.get(r.from),B=L.N.get(r.to);if(!A||!B)return null;const ca={x:A.x+A.w/2,y:A.y+A.h/2},cb={x:B.x+B.w/2,y:B.y+B.h/2};const p1=clipBox(A,cb.x,cb.y),p2=clipBox(B,ca.x,ca.y);const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.max(1,Math.hypot(dx,dy));const k=(r.k==null?.22:r.k)*len;const nx=-dy/len,ny=dx/len;
  const c1={x:p1.x+dx*.25+nx*k,y:p1.y+dy*.25+ny*k},c2={x:p2.x-dx*.25+nx*k,y:p2.y-dy*.25+ny*k};const mid={x:.125*p1.x+.375*c1.x+.375*c2.x+.125*p2.x,y:.125*p1.y+.375*c1.y+.375*c2.y+.125*p2.y};const f=v=>v.toFixed(1);
  return {d:`M${f(p1.x)} ${f(p1.y)}C${f(c1.x)} ${f(c1.y)} ${f(c2.x)} ${f(c2.y)} ${f(p2.x)} ${f(p2.y)}`,mid,p2,c2}}
function relSVG(r,L,o){const g=relGeom(r,L);if(!g)return '';const th=L.th;const ang=Math.atan2(g.p2.y-g.c2.y,g.p2.x-g.c2.x);const a1=ang+Math.PI*.82,a2=ang-Math.PI*.82,al=11;
  const head=`<path d="M${g.p2.x.toFixed(1)} ${g.p2.y.toFixed(1)}L${(g.p2.x+al*Math.cos(a1)).toFixed(1)} ${(g.p2.y+al*Math.sin(a1)).toFixed(1)}L${(g.p2.x+al*Math.cos(a2)).toFixed(1)} ${(g.p2.y+al*Math.sin(a2)).toFixed(1)}z" fill="${th.rel}"/>`;

function ssPage(cv,title,foot){const s=Math.max(1,cv.width/1400),m=Math.round(28*s),th=title?Math.round(40*s):0,fh=foot?Math.round(30*s):0;const c=document.createElement('canvas');c.width=Math.max(cv.width+2*m,Math.round(640*s));c.height=cv.height+2*m+th+fh;const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.textBaseline='top';if(title){x.fillStyle='#111111';x.font='bold '+Math.round(22*s)+'px Arial,sans-serif';x.fillText(title,m,m)}x.drawImage(cv,Math.round((c.width-cv.width)/2),m+th);if(foot){x.fillStyle='#666666';x.font=Math.round(13*s)+'px Arial,sans-serif';x.fillText(foot,m,m+th+cv.height+Math.round(10*s))}return c}
function ssMap(x,k){const r=exportSVG(x);return SimSave.svgToCanvas(r.svg,k||2,r.bg)}
function ssTree(t){return {title:t.t,note:[t.note||'',t.lab?'Label: '+t.lab:''].filter(Boolean).join('\n'),children:(t.ch||[]).map(ssTree)}}
function saveCopy(){closeEdit();closeMenus();const s=sh(),n=D.sheets.length;
  SimSave.dialog({title:'Export a copy',name:fileBase()+(n>1?'-'+lc(s.name).replace(/\W+/g,'-'):''),sub:'The XMind file and the pictures are of the sheet “'+s.name+'”. The PDF has '+(n>1?'all '+n+' sheets, one per page':'this mind map')+'.',formats:[
    {ext:'xmind',label:'XMind file',note:'Opens in XMind: topics, subtopics and notes · .xmind',make:async()=>SimSave.xmind(ssTree(s.root),s.name)},
    {ext:'png',label:'PNG picture',note:'This mind map, sharp 2× · .png',make:async()=>{const b=await SimSave.png(await ssMap(s,2));S.ev.exported='png';schedCheck();return b}},
    {ext:'jpg',label:'JPG picture',note:'This mind map, smaller file · .jpg',make:async()=>SimSave.jpg(await ssMap(s,2))},
    {ext:'pdf',label:'PDF document',note:(n>1?'All '+n+' sheets, one per page':'This mind map')+' · .pdf',make:async()=>{const pages=[];for(let i=0;i<n;i++){const x=D.sheets[i];pages.push(ssPage(await ssMap(x,2),x.name+': '+String(x.root.t).replace(/\n/g,' '),(D.name||'Mind map')+(n>1?' · sheet '+(i+1)+' of '+n:'')))}return SimSave.pdfFromCanvases(pages,{size:'Letter',margin:24,title:D.name||'Mind map'})}},
    {ext:'md',label:'Markdown outline',note:'This mind map as an indented list, with notes and labels · .md',make:async()=>{S.ev.exported='md';schedCheck();return new Blob([mdOf(s)],{type:'text/markdown'})}},
    {ext:'txt',label:'Plain text outline',note:'Paste into Word or Google Docs · .txt',make:async()=>{S.ev.exported='txt';schedCheck();return new Blob([mdOf(s).replace(/^# /,'').replace(/^## /gm,'').replace(/^(\s*)- /gm,'$1• ').replace(/^(\s*)> /gm,'$1Note: ')],{type:'text/plain'})}},
    {ext:'svg',label:'SVG picture',note:'This mind map as a vector picture: stays sharp at any size · .svg',make:async()=>{S.ev.exported='svg';schedCheck();return new Blob([exportSVG(s).svg],{type:'image/svg+xml'})}}]});ssGuard()}
async function submitWork(){closeEdit();const m=M&&M.m,r=(M&&M.result)||{},s=sh();let img='';
  try{const x=exportSVG(s);const cv=await SimSave.svgToCanvas(x.svg,Math.min(1.5,1400/x.w),x.bg);img=`<p><img alt="Mind map: ${esc(s.root.t)}" src="${cv.toDataURL('image/jpeg',.9)}" style="max-width:100%;max-height:820px;border:1px solid #cccccc"></p>`}catch(e){}
  const ul=t=>t.ch.length?'<ul>'+t.ch.map(c=>`<li>${esc(c.t)}${c.note?' <i>('+esc(c.note)+')</i>':''}${ul(c)}</li>`).join('')+'</ul>':'';
  SimSave.submit({title:m?m.title:'XMind Lab mind map',html:`<h2>What I made</h2><p>Mind map: <b>${esc(s.root.t)}</b> · ${countT(s)} topics · sheet “${esc(s.name)}”</p>${img}<h3>Outline</h3><p><b>${esc(s.root.t)}</b></p>${ul(s.root)}${m?`<h2>Mission: ${esc(m.title)}</h2><ol>${m.steps.map(x=>'<li>'+x.t+'</li>').join('')}</ol>`:''}`,score:M&&M.done?r.stars:undefined,max:3});ssGuard()}

  if(name==='view')return [{label:'Mind map view',checked:S.view==='map',onClick:()=>setView('map')},{label:'Outline view',checked:S.view==='outline',onClick:()=>setView('outline')},{sep:true},{label:'Structure',sub:structItems},{label:'Theme',sub:themeItems},{label:'Rainbow branches',checked:!!sh().rainbow,onClick:()=>change(()=>{sh().rainbow=!sh().rainbow})},{sep:true},{label:'Zoom in',kb:'Ctrl+=',onClick:()=>zoomStep(1)},{label:'Zoom out',kb:'Ctrl+-',onClick:()=>zoomStep(-1)},{label:'Actual size',kb:'Ctrl+0',onClick:()=>setZoom(1)},{label:'Fit map',onClick:zoomFit},{sep:true},{label:'Collapse all branches',onClick:()=>change(()=>{for(const m of sh().root.ch)if(m.ch.length)m.col=true})},{label:'Expand all branches',onClick:()=>change(()=>{for(const x of allT())x.t.col=false})},{sep:true},{label:'Format panel',checked:!$('#xm-panel').classList.contains('closed'),onClick:()=>togglePanel()}];
  if(name==='help')return [{label:'Quick reference',kb:'F1',onClick:quickRef},{label:'Take the Learn tour',onClick:()=>startTour(true)},{label:'How to play',onClick:howToPlay},{sep:true},{label:'About '+APP.name,onClick:about}];return []}
function cmd(n){const i=selOne();switch(n){
  case 'undo':return undo();case 'redo':return redo();
  case 'topic':if(!i){toast('Select a topic first (click it, or press Home for the central topic).');return}return addSibling(i.t.id);
  case 'subtopic':if(!i){toast('Select a topic first (click it, or press Home for the central topic).');return}return addChild(i.t.id);
  case 'rel':return startRel();case 'summary':return addSummary();case 'boundary':return addBoundary();
  case 'floating':{const c=viewCenter();return addFloatingAt(c.x+120,c.y+100)}
  case 'marker':if($('#xm-panel').classList.contains('closed'))togglePanel(true);S.panel='markers';return renderPanel();
  case 'label':if(!i){toast('Select a topic first.');return}return focusField('#xp-label');
  case 'note':return openNotes();
  case 'structure':{const b=$('#xm-toolbar [data-cmd="structure"]');return showMenu(b,structItems(),{kbd:true})}
  case 'theme':{const b=$('#xm-toolbar [data-cmd="theme"]');return showMenu(b,themeItems(),{kbd:true})}
  case 'outline':return setView(S.view==='outline'?'map':'outline');
  case 'zoomin':return zoomStep(1);case 'zoomout':return zoomStep(-1);case 'zoom100':return setZoom(1);case 'zoomfit':return zoomFit();
  case 'panel':return togglePanel();case 'export':return exportMenu();}}

{id:'audience',level:2,title:'Audience analysis',unit:'Unit 2 · Module 1 · Target audience and market analysis',
 brief:'<b>Cou-Cou Cam</b> is a new YouTube cooking channel made by sixth-formers in Bridgetown, Barbados. Before filming, map the <b>target audience</b>: who they are, what they value, how they behave online and what they need.',
 setup:()=>doc('Cou-Cou Cam audience',T('Cou-Cou Cam audience',[M_('Demographics',['Age 15–24'])])),
 steps:[

  {t:'Each of the four has at least <b>2 subtopics</b>.',c:()=>[/demograph/i,/psychograph/i,/behavio/i,/need/i].every(re=>X.kids(X.main(re)).length>=2)||'Give every one of the four two real subtopics.'},
  {t:'A <b>boundary</b> around Demographics and Psychographics titled <b>Who they are</b>.',c:()=>{const a=X.main(/demograph/i),b=X.main(/psychograph/i);return (a&&b&&sh().bnds.some(x=>x.ids.includes(a.id)&&x.ids.includes(b.id)&&/who/i.test(x.lab)))||'Select both (Shift+click), add a Boundary (Ctrl+B) and type its title.'},h:['Shift+click Demographics and Psychographics ▸ Boundary ▸ type “Who they are” ▸ Enter.'],show:[TB('boundary')]},

  {t:'A <b>note</b> on the central topic describing your main persona (12+ words).',c:()=>X.words(X.root().note)>=12||'The central topic needs a 12-word persona note.',h:['e.g. “Shanice, 17, Christ Church, watches recipe Shorts after school, wants cheap meals she can cook alone.”'],show:[TB('note')]},
 ]},
{id:'content-plan',level:2,title:'Website content plan',unit:'Unit 2 · Module 2 · Content development for online publishing (Taste of Castries)',

 setup:()=>doc('Taste of Castries content plan',T('Taste of Castries website',[M_('Restaurants',['Castries','Rodney Bay','Gros Islet'])]),{theme:'caribbean'}),
 steps:[

  {t:'At least <b>3 pages</b> have 2 or more content items.',c:()=>X.mains().filter(m=>X.kids(m).length>=2).length>=3||'Add content items under more pages.'},
  {t:'Switch to the <b>Tree Chart</b> structure.',c:()=>sh().struct==='tree'||'Structure is '+SNAME(sh().struct)+'.',show:[TB('structure'),'[data-struct="tree"]']},

{id:'concept-map',level:2,title:'Concept map with linking words',unit:'Unit 2 · Module 2 · Prototypes using design principles (concept maps)',
 brief:'Keisha at <b>Island Pulse Media</b> is planning a Trinidad and Tobago Carnival website. A mind map lists ideas; a <b>concept map</b> shows how they connect — every arrow carries <b>linking words</b> such as “includes”, “needs” or “leads to”.',
 setup:()=>{const d=doc('Carnival concept map',T('Carnival',[M_('J’ouvert',['Steel pan','Mud and paint']),M_('Parade of the Bands',['Costumes','Mas bands']),M_('Safety tips',['Water','Meeting point']),M_('Local food',['Doubles','Corn soup'])]));const v=T('Visitors');v.fx=420;v.fy=-220;d.sheets[0].fl.push(v);return d},
 steps:[
  {t:'Draw at least <b>3 relationships</b> (Ctrl+R, then click the other topic).',c:()=>sh().rels.length>=3||sh().rels.length+' of 3 relationships.',h:['Select a topic ▸ Relationship ▸ click the topic to connect to.'],show:[TB('rel')]},
  {t:'Every relationship carries <b>linking words</b>.',c:()=>(sh().rels.length>0&&sh().rels.every(r=>X.words(r.lab)>=1))||'Some arrows have no words. Double-click an arrow to label it.',h:['Read each arrow as a sentence: “Parade of the Bands needs Water”.']},
  {t:'At least one relationship <b>crosses branches</b> (e.g. Costumes → Local food).',c:()=>sh().rels.some(r=>{const a=mainOf(r.from),b=mainOf(r.to);return a&&b&&a!==b})||'Connect two topics that sit on different branches.'},
  {t:'Connect the floating topic <b>Visitors</b> to the map with a relationship.',c:()=>{const v=X.fl(/visitor/i);return (v&&sh().rels.some(r=>r.from===v.id||r.to===v.id))||'Visitors is not connected yet.'},get show(){const v=X.fl(/visitor/i);return v?[X.sel(v.id)]:[]}},
  {t:'Drag <b>Water</b> onto <b>Parade of the Bands</b> so it becomes one of its subtopics.',c:()=>{const g=X.main(/parade of the bands/i);return (g&&g.ch.some(c=>/water/i.test(c.t)))||'Water is not under Parade of the Bands yet.'},h:['Press on Water, drag it over Parade of the Bands (it glows green) and let go.'],get show(){const w=X.all().find(t=>/^water$/i.test(norm(t.t)));return w?[X.sel(w.id)]:[]}},
 ]},
{id:'fishbone',level:2,title:'Fishbone of causes',unit:'Unit 1 · Module 3 · The creative process applied to Caribbean problems (problem analysis)',
 brief:'Few students at <b>Mahoe Grove High School</b> in Paramaribo, Suriname, borrow books from the school library. Before designing a solution, find the <b>causes</b>. A fishbone (cause-and-effect) diagram puts the problem at the head and the categories of causes on the bones.',

  {t:'Mark the most likely root cause with <b>Priority 1</b>.',c:()=>X.deep().some(t=>t.mk.includes('p1'))||'Put Priority 1 on a cause (not a category).',show:['[data-mk="p1"]']},
  {t:'Mark a cause you will check with a survey with the <b>Question</b> marker.',c:()=>X.all().some(t=>t.mk.includes('question'))||'No Question marker yet.',show:['[data-mk="question"]']},
 ]},
{id:'timeline',level:2,title:'Production timeline',unit:'Unit 1 · Module 3 · Pre-production skills and techniques (schedules)',
 brief:'The <b>Great Salt Pond Heritage Trust</b> in Sint Maarten wants a 3-minute documentary about the salt pickers of Great Salt Pond. Plan the production on a <b>timeline</b>: phases in order, the week for each, and the tasks inside them.',

  {t:'At least <b>8 tasks</b> across the phases (2+ phases have tasks).',c:()=>{const k=X.mains().map(m=>X.kids(m).length);return (k.reduce((a,b)=>a+b,0)>=8&&k.filter(x=>x>0).length>=2)||k.reduce((a,b)=>a+b,0)+' of 8 tasks.'}},
  {t:'Mark the first phase <b>Done</b> and the second <b>Started</b> (25%, 50% or 75%).',c:()=>{const m=X.mains();return (m[0]&&m[0].mk.includes('t100')&&m[1]&&m[1].mk.some(x=>/^t(25|50|75)$/.test(x)))||'Use Task progress markers on the first two phases.'},show:['[data-mk="t100"]']},

{id:'pest',level:3,time:900,title:'PEST plus culture analysis',unit:'Unit 1 · Module 2 · Challenges and opportunities in the digital media industry (PEST plus culture)',

  {t:'Each of the five has at least <b>2 factors</b>.',c:()=>[/politic/i,/econom/i,/social/i,/technolog/i,/cultur/i].every(re=>X.kids(X.main(re)).length>=2)||'Every heading needs two factors.'},

  {t:'At least one idea under every letter.',c:()=>(X.mains().length>=7&&X.mains().every(m=>X.kids(m).length>=1))||'Some letters have no ideas yet.'},
  {t:'Star the two best ideas (Stars ▸ yellow).',c:()=>X.deep().filter(t=>t.mk.includes('syellow')).length>=2||'Star two ideas (not headings) with the yellow star.'},

  {t:'Each option has <b>4 scores</b> as subtopics (e.g. 3/5), in column order.',c:()=>(X.mains().length>=3&&X.mains().every(m=>m.ch.filter(c=>/\d/.test(c.t)).length>=4))||'Each row needs four scores with numbers.'},

function psImg(cap,src){return `<h3>${esc(cap)}</h3><p><img alt="${esc(cap)}" src="${src}" style="max-width:100%;max-height:820px;border:1px solid #cccccc"></p>`}

      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
