<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IT Careers World · VR · CAPE IT Unit 1</title>
<style>
:root{--navy:#0B1A46;--gold:#F5C542;--ink:#F1F4FF;--muted:#AEB9DD}
html,body{margin:0;height:100%;background:#0A1433;color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block}
#hud{position:fixed;left:12px;top:12px;width:min(470px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(8,16,44,.92);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);box-sizing:border-box}
#hud[data-tone=ok]{border-color:#5FD38D}#hud[data-tone=bad]{border-color:#FF7A6B}
#hud-room{font-size:.72rem;color:var(--muted);margin-bottom:2px}
#hud-eyebrow{color:var(--gold);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
#hud-title{font:800 1.05rem/1.25 "Bricolage Grotesque","Segoe UI",sans-serif;margin:4px 0}
#hud-body{font-size:.86rem;line-height:1.45;color:#DCE3FF;white-space:pre-line}
#hud-opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}#hud-opts:empty{display:none}
.opt{text-align:left;font:400 .88rem/1.35 "Atkinson Hyperlegible",Verdana,sans-serif;border-radius:12px;padding:8px 12px;border:2px solid rgba(245,197,66,.6);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer}
.opt b{color:var(--gold);margin-right:4px}.opt.ok{border-color:#5FD38D;background:rgba(95,211,141,.18)}.opt.bad{border-color:#FF7A6B;background:rgba(255,122,107,.15)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:800 .86rem "Bricolage Grotesque","Segoe UI",sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;border:2px solid var(--gold);background:transparent;color:var(--ink)}
button.go{background:var(--gold);color:var(--navy)}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#score{margin-left:auto;font-size:.8rem;color:var(--muted)}
#tools{position:fixed;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:45vw}
#tools button{background:rgba(8,16,44,.9)}#tools button.vr{background:var(--gold);color:var(--navy)}
#help{position:fixed;right:12px;bottom:12px;font-size:.75rem;color:var(--muted);background:rgba(8,16,44,.8);padding:6px 10px;border-radius:10px;max-width:50vw;text-align:right}
#cross{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid rgba(245,197,66,.8);border-radius:50%;pointer-events:none}
@media (max-width:640px){#hud{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:52vh}#hud-body{font-size:.8rem}#help{display:none}#tools{top:8px;right:8px;left:8px;max-width:none;justify-content:center}#tools button{padding:6px 10px;font-size:.78rem}}
</style></head><body>
<div id="stage" aria-label="3D IT careers world"></div><div id="cross" aria-hidden="true"></div>

<div class="row"><button type="button" id="hud-next" class="go" hidden></button><span id="score">Score <b id="hud-score"></b></span></div></section>
<div id="tools"><button type="button" id="btn-lobby" hidden>◂ Lobby</button><button type="button" id="btn-q"></button><button type="button" id="btn-tilt">📱 Tilt to look</button><button type="button" id="btn-vr" class="vr" hidden>🥽 Enter VR</button></div>
<div id="help">Drag to look · click the floor or use W A S D to move · click things to select them</div>

  function avHTML(a, cls) { a = a || '🦁'; return '<div class="av ' + (cls || '') + '">' + (/^(https?:|data:image)/.test(a) ? '<img alt="" src="' + esc(a) + '">' : esc(a)) + '</div>'; }
