<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR Hardware Bench · CAPE IT Unit 1</title>
<style>
:root{--navy:#0B1A46;--gold:#F5C542;--ink:#F1F4FF;--muted:#AEB9DD}
html,body{margin:0;height:100%;background:#0A1433;color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.in-ar{background:transparent}
#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block}
#overlay{position:fixed;inset:0;pointer-events:none}#overlay>*{pointer-events:auto}
#hud{position:absolute;left:12px;top:12px;max-width:min(440px,calc(100vw - 24px));background:rgba(8,16,44,.9);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#hud[data-tone=ok]{border-color:#5FD38D}#hud[data-tone=bad]{border-color:#FF7A6B}
#hud-eyebrow{color:var(--gold);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
#hud-title{font:800 1.05rem/1.25 "Bricolage Grotesque","Segoe UI",sans-serif;margin:4px 0}
#hud-body{font-size:.86rem;line-height:1.45;color:#DCE3FF;white-space:pre-line}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:800 .86rem "Bricolage Grotesque","Segoe UI",sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;border:2px solid var(--gold);background:rgba(8,16,44,.9);color:var(--ink)}
button.go{background:var(--gold);color:var(--navy)}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#modes{position:absolute;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
#ar-note{position:absolute;right:12px;bottom:12px;font-size:.75rem;color:var(--muted);background:rgba(8,16,44,.85);padding:6px 10px;border-radius:10px;max-width:min(320px,70vw)}
#ar-tip{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(8,16,44,.9);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:.9rem;max-width:86vw;text-align:center}
#ar-bar{position:absolute;left:0;right:0;bottom:16px;display:none;justify-content:center;gap:8px}
body.in-ar #ar-bar{display:flex}body.in-ar #modes .not-ar{display:none}
@media (max-width:600px){#hud{top:auto;bottom:12px;left:8px;right:8px;max-width:none}#modes{top:8px;right:8px;left:8px;max-width:none;justify-content:center}#ar-note{bottom:auto;top:56px;left:8px;right:8px;max-width:none}body.in-ar #hud{bottom:70px}#ar-tip{bottom:auto;top:60px}}
</style></head><body>
