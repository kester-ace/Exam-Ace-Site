<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Lab</title>
<meta name="description" content="Printers and 3D printing game for Information Technology Unit 1. Kester Small">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
:root{
  --bg:#f3eee5; --paper:#fffdf9; --line:#e3d9c8; --line2:#d3c5ad;
  --peg:#d8b98e; --peg2:#c49f70; --hole:#a8845a;
  --ink:#1d2430; --ink2:#4f5a66; --ink3:#7a8590;
  --hot:#ff6a1f; --hot2:#ffe3d3; --hotd:#c24a0c;
  --teal:#0e7c86; --teal2:#d9f1f2; --teald:#075a62;
  --sun:#f2b632; --sun2:#fff2cf;
  --good:#1f8a4c; --good2:#dcf3e5; --bad:#c3342b; --bad2:#fbe1de; --warn:#b86a00; --warn2:#fff0d6;
  --steel:#3b414b; --steel2:#596170;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(50,35,10,.07),0 8px 22px rgba(50,35,10,.08);
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;display:flex;flex-direction:column;max-width:100vw;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:7px 14px;flex:none;color:#fff;
  background:#252a31 radial-gradient(circle at 9px 9px,rgba(255,255,255,.07) 2px,transparent 2.6px) 0 0/18px 18px;border-bottom:3px solid var(--hot)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 4px;cursor:pointer;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.2px;color:#fff}
.brand svg{width:30px;height:30px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:0;color:#cfd5dc;font-weight:700;font-size:14px;padding:7px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab[aria-current="page"]{background:rgba(255,106,31,.18);color:#ffb38a}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--sun2);color:#7a4b00;font-weight:800;font-size:13.5px;white-space:nowrap}
.chip svg{width:15px;height:15px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:6px 9px;cursor:pointer;font-weight:700;font-size:14px}
.ibtn:hover{background:rgba(255,255,255,.14)}
.ibtn svg{width:18px;height:18px}
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.screen{max-width:1080px;margin:0 auto;padding:18px 16px 30px}
footer{flex:none;text-align:center;font-size:12.5px;color:var(--ink2);padding:6px 16px;border-top:1px solid var(--line);background:var(--paper)}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.3px;margin:0}
h2{font-size:27px;line-height:1.12}
h3{font-size:19px;line-height:1.2}
h1:focus,h2:focus{outline:none}
p{margin:0 0 10px}
.kicker{font-weight:800;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--hotd)}
.muted{color:var(--ink2)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:16px;cursor:pointer;background:var(--hot);color:#fff;box-shadow:0 2px 0 var(--hotd);transition:transform .12s,filter .12s;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.teal{background:var(--teal);box-shadow:0 2px 0 var(--teald)}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line2);box-shadow:0 2px 0 var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:18px;height:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.head p{margin:4px 0 0;max-width:66ch}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:18px;height:18px}
.stars.big svg{width:34px;height:34px}
.st-on{fill:var(--sun);stroke:#b97f00}
.st-off{fill:#e9e1d2;stroke:#cdbfa6}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.2px}
.p-imp{background:#e7e1fb;color:#4a2fa3}
.p-non{background:var(--teal2);color:var(--teald)}
.p-3d{background:var(--hot2);color:var(--hotd)}
.feedback{border-radius:12px;padding:12px 14px;margin-top:12px;border:1px solid}
.feedback.ok{background:var(--good2);border-color:#a8dcbd}
.feedback.no{background:var(--bad2);border-color:#f0b4ae}
.feedback.info{background:var(--teal2);border-color:#a9dadd}
.feedback b.v{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center}
.hero h1{font-size:50px;line-height:1;margin:8px 0 6px}
.hero .sub{font-weight:700;color:var(--ink2);margin:0 0 14px}
.def{border-left:4px solid var(--hot);background:var(--paper);padding:10px 14px;border-radius:0 12px 12px 0;margin:0 0 16px;box-shadow:var(--shadow)}
.def small{display:block;color:var(--ink3);font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.hero .art{border-radius:20px;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow)}
.hero .art svg{display:block;width:100%;height:auto}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
.mode{display:flex;flex-direction:column;gap:5px;text-align:left;padding:14px;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--hot)}
.mode .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--hot2)}
.mode .ic svg{width:26px;height:26px}
.mode b{font-family:var(--display);font-size:17.5px;line-height:1.15}
.mode span.d{font-size:13.5px;color:var(--ink2);flex:1}
.mode.main{border-color:var(--hot);background:linear-gradient(180deg,#fff6ef,var(--paper))}

/* ---------- illustrations ---------- */
.illo{background:#f7f2ea radial-gradient(circle at 10px 10px,rgba(120,90,50,.13) 2px,transparent 2.6px) 0 0/20px 20px;border-radius:12px;border:1px solid var(--line)}
.illo svg{display:block;width:100%;height:auto}
.illo text{font-family:var(--body)}
.a-feed{animation:feed 1.6s linear infinite}
@keyframes feed{to{transform:translateY(var(--fy,-24px))}}
.a-feedx{animation:feedx 2.4s linear infinite}
@keyframes feedx{from{transform:translateX(0)}to{transform:translateX(var(--dx,200px))}}
.a-slide{animation:slide 2.4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx,120px))}}
.a-spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.a-pin{animation:pin .24s linear infinite}
@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.a-ham{animation:ham .2s ease-in-out infinite}
@keyframes ham{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.a-drop{animation:drop .36s linear infinite}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(8px);opacity:0}}
.a-glow{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.a-flick{animation:flick .16s steps(2) infinite}
@keyframes flick{50%{opacity:.25}}
.a-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 7s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
.a-rev{animation:rev 3.6s steps(9) infinite}
@keyframes rev{from{transform:translateX(0)}to{transform:translateX(var(--dx,130px))}}
.a-out{animation:out 2.6s ease-in infinite}
@keyframes out{0%{transform:translateY(-34px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.a-l1,.a-l2,.a-l3,.a-l4{animation:6s linear infinite;opacity:0}
.a-l1{animation-name:l1}.a-l2{animation-name:l2}.a-l3{animation-name:l3}.a-l4{animation-name:l4}
@keyframes l1{0%{opacity:0}12%,100%{opacity:1}}
@keyframes l2{0%,25%{opacity:0}37%,100%{opacity:1}}
@keyframes l3{0%,50%{opacity:0}62%,100%{opacity:1}}
@keyframes l4{0%,75%{opacity:0}87%,100%{opacity:.55}}
.illo.paused *{animation-play-state:paused!important}

/* ---------- showroom ---------- */
.intro2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.intro2 .card{padding:12px 14px}
.intro2 h3{font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fbtn{border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.show{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;text-align:left;padding:7px 9px;border:1px solid var(--line);background:var(--paper);border-radius:12px;cursor:pointer;font-weight:700;font-size:14.5px}
.pitem .th{width:54px;flex:none;border-radius:8px;overflow:hidden;background:#f7f2ea}
.pitem .th svg{display:block;width:100%;height:auto}
.pitem small{display:block;font-weight:600;color:var(--ink3);font-size:12px}
.pitem[aria-selected="true"]{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot2)}
.pitem .seen{margin-left:auto;width:16px;height:16px;flex:none}
.detail{padding:16px}
.dtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.dgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.how{margin:8px 0 0;padding-left:20px}
.how li{margin-bottom:4px}
.meters{display:grid;gap:7px}
.meter{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:start;font-size:14px}
.meter b{font-size:13px;color:var(--ink2);padding-top:1px}
.dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:-2px}
.dots i{width:11px;height:11px;border-radius:3px;background:#e7dfd0}
.dots i.on{background:var(--teal)}
.dots.n i.on{background:var(--hot)}
.local{margin-top:12px;background:var(--sun2);border:1px solid #f0d58f;border-radius:12px;padding:10px 12px;font-size:14.5px}
.local b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7a4b00}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:14px}
.pc ul{margin:4px 0 0;padding-left:18px}
.pc h4{font-size:14px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.term{border:1px dashed var(--teal);background:var(--teal2);color:var(--teald);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13.5px;cursor:pointer}
.term[aria-expanded="true"]{background:var(--teal);color:#fff;border-style:solid}
.gloss{margin-top:16px;padding:14px 16px}
.tdef{margin-top:10px;font-size:15px;min-height:1.4em}
.tablewrap{position:relative;overflow-x:auto;margin-top:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
table.cmp{border-collapse:collapse;width:100%;min-width:860px;font-size:13.5px}
.cmp th,.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{background:#252a31;color:#fff;font-size:12.5px;letter-spacing:.4px}
.cmp tbody th{font-weight:800;white-space:nowrap}
.cmp tr:nth-child(even) td,.cmp tr:nth-child(even) th{background:#faf6ef}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.show>*,.studio>*,.dgrid>*,.case>*,.hero>*,.intro2>*{min-width:0}
.cmp .pill{white-space:nowrap}
@media (min-width:761px){.studio>div:first-child{position:sticky;top:8px}}

/* ---------- jobs / quiz ---------- */
.qwrap{max-width:820px;margin:0 auto}
.progress{height:8px;background:#e8dfcf;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--hot);width:0;transition:width .3s}
.scen{padding:18px}
.scen .where{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--teald);background:var(--teal2);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.scen .where svg{width:14px;height:14px}
.scen p.q{font-size:18.5px;font-weight:600;margin:0 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:2px solid var(--line);background:var(--paper);border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;min-height:56px}
.opt:hover:not([disabled]){border-color:var(--hot)}
.opt .th{width:58px;flex:none;border-radius:8px;overflow:hidden;background:#f7f2ea}
.opt .th svg{display:block;width:100%;height:auto}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:#efe7d9;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink2)}
.opt.right{border-color:var(--good);background:var(--good2)}
.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.opt[disabled]{cursor:default}
.endcard{text-align:center;padding:26px 18px}
.endcard h2{margin:6px 0}
.endcard .big{font-family:var(--display);font-size:46px;font-weight:800;color:var(--hotd)}

/* ---------- studio ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pipe{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.pstep{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:800;font-size:13px;cursor:pointer;text-align:left;position:relative}
.pstep .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#ece3d4;color:var(--ink2);font-size:12px}
.pstep.done .n{background:var(--good);color:#fff}
.pstep.on{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot2)}
.pstep.on .n{background:var(--hot);color:#fff}
.pinfo{font-size:14.5px;margin:-6px 0 14px;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.studio{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.bay{position:relative;border-radius:16px;overflow:hidden;border:1px solid #1b1f25;
  background:#2b3038 radial-gradient(circle at 11px 11px,rgba(0,0,0,.35) 2.4px,transparent 3px) 0 0/22px 22px;box-shadow:var(--shadow)}
.bay canvas{display:block;width:100%;height:auto}
.hud{position:absolute;left:10px;top:10px;max-width:calc(100% - 96px);display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.hud span{background:rgba(20,23,28,.78);color:#e8edf2;border:1px solid rgba(255,255,255,.12);font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:7px}
.hud span.hot{color:#ffb38a}
.bayctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.bayctl .btn{background:rgba(20,23,28,.85);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.bprog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08)}
.bprog i{display:block;height:100%;width:0;background:var(--hot)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.panel{padding:16px}
.panel h3{margin-bottom:6px}
.models{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mcard{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer}
.mcard b{font-size:15px}
.mcard span{font-size:12.5px;color:var(--ink2)}
.mcard[aria-pressed="true"]{border-color:var(--hot);background:#fff6ef}
.mcard .bs{margin-top:2px}
.mats{display:grid;gap:8px;margin-top:8px}
.mat{display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;font-size:13.5px}
.mat[aria-pressed="true"]{border-color:var(--hot);background:#fff6ef}
.mat .sp{width:34px;height:34px}
.mat b{font-size:15.5px}
.mat .pros{color:var(--good)} .mat .cons{color:var(--bad)}
.swatches{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--hot)}
.set{margin-bottom:12px}
.set label{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14.5px}
.set label output{font-family:var(--mono);font-size:13.5px;color:var(--hotd);background:var(--hot2);padding:1px 7px;border-radius:6px}
.set .tr{font-size:12.8px;color:var(--ink2);margin-top:2px}
input[type=range]{width:100%;accent-color:var(--hot);margin:6px 0 0;height:22px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--paper);cursor:pointer;font-weight:800;font-size:14px;text-align:left}
.tog .sw2{flex:none;width:38px;height:22px;border-radius:99px;background:#d9cfbf;position:relative;transition:background .15s}
.tog .sw2::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-checked="true"] .sw2{background:var(--good)}
.tog[aria-checked="true"] .sw2::after{left:19px}
.est{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px}
.est div{background:#f6f1e8;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.est small{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.est b{font-family:var(--mono);font-size:14px}
.bars{display:grid;gap:6px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:132px 1fr 42px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.bar .t{height:9px;background:#ece3d4;border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;transition:width .25s}
.bar em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right}
pre.gcode{background:#1b1f25;color:#c8f0c8;font-family:var(--mono);font-size:12px;line-height:1.5;padding:10px 12px;border-radius:10px;max-height:190px;overflow:auto;margin:8px 0 12px;white-space:pre}
pre.gcode .c{color:#8a96a3}
.slice{display:block;width:100%;max-width:200px;height:auto;border-radius:10px;background:#20252c}
.slicebox{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:12.8px;color:var(--ink2)}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.result h3{font-size:22px}
.outcome{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.outcome .badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.outcome .badge svg{width:28px;height:28px}
.b-ok{background:var(--good2);color:var(--good)} .b-bad{background:var(--bad2);color:var(--bad)} .b-warn{background:var(--warn2);color:var(--warn)}
.why{background:#f6f1e8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:8px 0}
.why b{display:block}
.post{display:grid;gap:6px;margin:8px 0}
.post button{display:flex;gap:8px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--paper);cursor:pointer;font-weight:700;font-size:14px}
.post button[aria-pressed="true"]{background:var(--good2);border-color:#a8dcbd}
.post button .cb{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center}
.post button[aria-pressed="true"] .cb{background:var(--good);border-color:var(--good)}
.post button .cb svg{width:14px;height:14px;opacity:0}
.post button[aria-pressed="true"] .cb svg{opacity:1}
.loadtest{border-radius:12px;background:#f7f2ea;border:1px solid var(--line);margin:8px 0}
.loadtest svg{display:block;width:100%;height:auto}
.lt-w{animation:ltw 1.2s ease-in forwards}
@keyframes ltw{from{transform:translateY(-40px)}to{transform:translateY(0)}}
.lt-snap{animation:snap .5s 1.2s ease-in forwards}
@keyframes snap{to{transform:rotate(38deg) translate(10px,30px)}}
.lt-crack{opacity:0;animation:crk .1s 1.15s forwards}
@keyframes crk{to{opacity:1}}
.learn{display:grid;gap:14px}
.steps6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.s6{padding:12px 14px}
.s6 .n{font-family:var(--mono);font-weight:700;color:var(--hotd);font-size:13px}
.s6 b{display:block;font-family:var(--display);font-size:17px;margin:2px 0 4px}
.s6 p{font-size:14px;margin:0}
.uses{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.use{padding:12px}
.use .ic{width:38px;height:38px;border-radius:10px;background:var(--teal2);display:grid;place-items:center;margin-bottom:6px}
.use .ic svg{width:24px;height:24px}
.use b{display:block;font-size:15px}
.use p{font-size:13.5px;margin:2px 0 0}
.limits{columns:2;column-gap:22px;margin:6px 0 0;padding-left:20px;font-size:14.5px}
.limits li{margin-bottom:5px;break-inside:avoid}

/* ---------- troubleshooter ---------- */
.tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ticket{display:flex;gap:10px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow);cursor:pointer}
.ticket:hover{border-color:var(--hot)}
.ticket .th{width:70px;flex:none;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ticket .th svg{display:block;width:100%;height:auto}
.ticket b{display:block;font-size:15px}
.ticket span{font-size:13px;color:var(--ink2)}
.ticket>span:last-child>span{display:block}
.ticket .stt{margin-top:4px;font-weight:800;font-size:12.5px}
.case{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:16px}
.case .print{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.case .print svg{display:block;width:100%;height:auto}
.memo{font-size:15px;background:var(--sun2);border:1px solid #f0d58f;border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.inspect{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ins{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:14px}
.ins svg{width:18px;height:18px}
.ins[aria-pressed="true"]{background:#252a31;color:#fff;border-color:#252a31}
.clues{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
.clues li{font-size:14.5px;padding:8px 10px;border-radius:10px;background:#f6f1e8;border-left:4px solid var(--ink3)}
.clues li.key{border-left-color:var(--hot);background:#fff4ec}
.clues li b{margin-right:4px}
.dx{display:grid;gap:8px}
.dx .opt{min-height:0;font-weight:600}

@media (max-width:900px){
  .modes{grid-template-columns:repeat(2,1fr)}
  .mode.main{grid-column:1/-1}
  .uses{grid-template-columns:repeat(2,1fr)}
  .steps6{grid-template-columns:repeat(2,1fr)}
  .tickets{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .tabs{display:none}
  .hero{grid-template-columns:1fr;gap:14px}
  .hero h1{font-size:40px}
  .hero .art{order:-1}
  .intro2,.dgrid,.pc,.opts,.studio,.case,.toggles{grid-template-columns:1fr}
  .show{grid-template-columns:1fr}
  .plist{flex-direction:row;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
  .pitem{flex:none;width:170px;scroll-snap-align:start}
  .est{grid-template-columns:1fr 1fr}
  .limits{columns:1}
  .tickets{grid-template-columns:1fr}
  .case .print{max-width:150px}
  .hud span{font-size:10.5px;padding:2px 6px}
  .hud span:nth-child(4){display:none}
  footer{font-size:11px;padding:4px 10px}
  h2{font-size:23px}
  .pstep{flex:1 1 30%;padding:6px 7px;font-size:12px}
  .pstep .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scen p.q{font-size:17px}
}
@media (max-width:420px){
  .modes{grid-template-columns:1fr}
  .uses,.steps6{grid-template-columns:1fr}
  .brand span{font-size:17px}
  .models{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .a-l1,.a-l2,.a-l3{opacity:1}.a-l4{opacity:0}
  .a-draw{stroke-dashoffset:0}
  .a-rev{display:none}
}

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

  const root=$('#s-quiz');
  if(QZ.i>=QZ.order.length){const s=QZ.score,st=s>=11?3:s>=8?2:s>=5?1:0;const imp=award('quiz',st,s);
    root.innerHTML=`<div class="qwrap"><div class="card endcard"><div class="kicker">Mode 5 · Results</div><h2 id="h-quiz">Quiz complete</h2><div class="big">${s} / 12</div>${stars(st,3,1)}<p style="margin-top:10px">${st===3?'Outstanding! You know your printers.':st>=2?'Well done. A little review and you will have full marks.':'Keep going: revisit the showroom and the 3D Print Studio, then try again.'}${imp?' <b>New best!</b>':''}</p><div class="row" style="justify-content:center"><button class="btn" id="qAgain">${IC.redo} Try again</button><button class="btn alt" data-go="home">Home</button></div></div></div>`;
    $('#qAgain').onclick=()=>{RENDER.quiz();$('#h-quiz').focus()};st>=2?Snd.win():Snd.fail();return}
  const q=QZ.order[QZ.i];QZ.answered=false;
  root.innerHTML=`<div class="qwrap"><div class="head"><div><div class="kicker">Mode 5 · Test yourself</div><h2 id="h-quiz">Quiz</h2></div><div class="small"><b>Question ${QZ.i+1} of 12</b> · Score ${QZ.score}</div></div>
  <div class="progress" aria-hidden="true"><i style="width:${QZ.i/12*100}%"></i></div>
  <div class="card scen"><p class="q" id="qq">${q.q}</p><div class="opts" role="group" aria-labelledby="qq">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k" aria-hidden="true">${k+1}</span><span>${t}</span></button>`).join('')}</div><div id="qfb" aria-live="polite"></div></div>
  <p class="small muted" style="text-align:center;margin-top:8px">Tip: press keys 1–4 to answer.</p></div>`;
  $$('#s-quiz .opt').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.k));
}
function answerQuiz(k){
  if(QZ.answered)return;QZ.answered=true;const q=QZ.order[QZ.i],ok=k===q.a;if(ok)QZ.score++;
  $$('#s-quiz .opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.a)b.classList.add('right');else if(kk===k)b.classList.add('wrong')});
  $('#qfb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b class="v">${ok?'Correct!':'Not quite.'}</b>${q.e}</div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="qNext">${QZ.i===11?'See results':'Next question'} ${IC.arrow}</button></div>`;
  ok?Snd.good():Snd.bad();
  $('#qNext').onclick=()=>{QZ.i++;drawQuiz();const h=$('#h-quiz');h.setAttribute('tabindex','-1');h.focus({preventScroll:true})};
  $('#qNext').focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{

/* ---------- voxel models ---------- */
function buildModel(id,ini){

      const lx=x-sx;if(lx<0||lx>=w)return false;const li=Math.floor(lx/4),cx=lx%4;if(cx===3)return false;const gy=y-1;if(gy<0||gy>4)return false;return GLYPH[L[li]][gy*3+cx]==='1'}}

      if(z<=5){const r=5.6-((Math.floor((a+Math.PI)/(2*Math.PI)*14)%2)?.75:0);return d<=r}
      if(d<=3.4)return true;return z===6&&Math.abs(dx)<=.6&&dy<0&&d<=4.8}}
  else if(id==='turtle'){nx=16;ny=15;nz=7;f=(x,y,z)=>{const X=x+.5-8,Y=y+.5-6.5;const e=(rx,ry)=>X*X/(rx*rx)+Y*Y/(ry*ry)<=1;
      const fl=(cx,cy,rx,ry,an)=>{const c=Math.cos(an),s=Math.sin(an);const u=(X-cx)*c+(Y-cy)*s,v=-(X-cx)*s+(Y-cy)*c;return u*u/(rx*rx)+v*v/(ry*ry)<=1};
      if(z<=1)return e(3.4,4);
      if(z===2)return e(5,5.6)||Math.hypot(X,Y-6.2)<=1.5||fl(5.4,2.6,2.6,1.05,.5)||fl(-5.4,2.6,2.6,1.05,-.5)||fl(3.9,-4.5,1.7,.85,-.6)||fl(-3.9,-4.5,1.7,.85,.6);

  return{nx,ny,nz,g};
}
const gi=(m,x,y,z)=>(x<0||y<0||z<0||x>=m.nx||y>=m.ny||z>=m.nz)?0:m.g[x+m.nx*(y+m.ny*z)];
function overhangs(m){const o=new Uint8Array(m.g.length);let n=0;
  for(let z=1;z<m.nz;z++)for(let y=0;y<m.ny;y++)for(let x=0;x<m.nx;x++){if(!gi(m,x,y,z))continue;let sup=false;
    for(let dy=-1;dy<=1&&!sup;dy++)for(let dx=-1;dx<=1;dx++)if(gi(m,x+dx,y+dy,z-1)===1){sup=true;break}
    if(!sup){o[x+m.nx*(y+m.ny*z)]=1;n++}}

/* builds the print job: model + support cells, in print order */

/* ---------- estimates and outcome ---------- */
function refSettings(id){const M=MODELS[id];return{model:id,mat:id==='bracket'?'PETG':'PLA',lh:M.lhI,infill:{stand:20,key:15,knob:30,turtle:12,bracket:40}[id],speed:60,sup:M.needSup,temp:210,encl:false}}
function estimate(S){
  const M=MODELS[S.model],m=MATS[S.mat];
  const supF=S.sup?(M.needSup?.12:.02):0;
  const vol=M.vol*(M.shell+(1-M.shell)*S.infill/100)+M.vol*supF*.5;
  const flow=S.lh*.45*S.speed;
  const layers=Math.max(1,Math.round(M.h/S.lh));
  const time=vol*1000/(flow*.45)+layers*5+240;
  const grams=vol*m.dens;
  let q=100;q-=Math.max(0,S.lh-M.lhI)*M.detail;q-=Math.max(0,S.speed-70)*.4;
  if(S.temp<m.tLo||S.temp>m.tHi)q-=8;if(S.sup)q-=M.needSup?4:3;
  if(S.mat==='TPU'&&S.model!=='key')q-=10;
  q=clamp(q,5,100);
  let str=m.str*(.35+.65*Math.min(1,S.infill/50))*(S.temp<m.tLo?.75:1)*(S.lh>.28?.95:1);
  str=clamp(str,0,100);
  return{vol,flow,layers,time,grams,q,str,len:vol*1000/2.405/1000};
}
function issues(S){
  const m=MATS[S.mat],M=MODELS[S.model],E=estimate(S),out=[];
  const maxF=m.maxFlow*(S.temp>=m.tLo?1:.7);
  if(S.mat==='TPU'&&S.speed>35)out.push({id:'jam',sev:'fail',t:'Filament jam',w:`TPU is soft and rubbery. At ${S.speed} mm/s the extruder pushed it too hard, so it buckled and tangled inside the extruder, and plastic stopped coming out of the nozzle.`,f:'Print flexible TPU slowly, at about 20–30 mm/s.'});
  if(S.temp<m.tMin)out.push({id:'cold',sev:'fail',t:'Under-extrusion: nozzle too cold',w:`${S.temp} °C is too cold for ${m.name} (it needs about ${m.tLo}–${m.tHi} °C). The plastic did not melt properly, so too little came out and the layers did not bond. The part is gappy and weak.`,f:`Raise the nozzle temperature into the ${m.tLo}–${m.tHi} °C range.`});
  else if(E.flow>maxF)out.push({id:'flow',sev:'fail',t:'Under-extrusion: printing too fast',w:`Thick ${S.lh.toFixed(2)} mm layers at ${S.speed} mm/s need ${E.flow.toFixed(1)} mm³ of plastic every second, but the hot end can only melt about ${maxF.toFixed(0)} mm³/s of ${m.name}. The lines came out thin and gappy.`,f:'Slow down or use thinner layers so the hot end can keep up.'});

  if(S.mat==='ABS'&&!S.encl)out.push({id:'warp',sev:'fail',t:'Warping',w:'ABS shrinks a lot as it cools. In the open air the lower layers cooled unevenly, so the corners curled up off the bed and the layers began to crack apart.',f:'Print ABS inside an enclosure (and with a hot bed, about 100 °C) to keep the air warm and still, or choose PLA or PETG.'});
  if(S.model==='bracket'&&(S.infill<25||S.mat==='TPU'||E.str<45))out.push({id:'weak',sev:'fail',t:'Weak part: the bracket snapped',w:S.mat==='TPU'?'TPU is flexible, so the bracket bent and dropped the shelf as soon as books were added.':`With only ${S.infill}% infill, the bracket was mostly hollow inside. Under the weight of the books it cracked and snapped.`,f:'For load-bearing parts, use at least 30–40% infill and a strong, rigid material such as PETG or ABS.'});
  if(S.temp>m.tStr)out.push({id:'string',sev:'defect',t:'Stringing',w:`At ${S.temp} °C, ${m.name} is too runny. It oozed out of the nozzle during every travel move, leaving thin hairs ("strings") between the parts of the print.`,f:`Lower the temperature to about ${m.tLo}–${m.tHi} °C. (Retraction settings also help.)`});

}
function scoreRun(S){
  const M=MODELS[S.model],E=estimate(S),R=estimate(refSettings(S.model));
  const req={stand:30,knob:40,bracket:55}[S.model]||0;
  const fit=req?clamp(E.str/req,0,1)*100:E.q;
  const QS=50*(M.func?(.6*E.q+.4*fit):E.q)/100;
  const TS=25*Math.min(1,R.time/E.time);
  const MS=25*Math.min(1,R.grams/E.grams);

/* ---------- rendering ---------- */
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function shade(rgb,f,mix,mf){let r=rgb[0],g=rgb[1],b=rgb[2];if(mix){r=r+(mix[0]-r)*mf;g=g+(mix[1]-g)*mf;b=b+(mix[2]-b)*mf}return`rgb(${Math.round(clamp(r*f,0,255))},${Math.round(clamp(g*f,0,255))},${Math.round(clamp(b*f,0,255))})`}
const HOT=[255,140,60];
const BAY={cv:null,ctx:null,W:600,H:420,s:12,ox:0,oy:0,dpr:1,job:null};
const PL=20;

/* ---------- print run ---------- */
let PR=null,RAF=0;
function stopPrint(silent){if(RAF)cancelAnimationFrame(RAF);RAF=0;Snd.stopHum();if(PR&&!PR.finished&&silent){PR=null}}
function startPrint(){
  stopPrint();const J=BAY.job;const S=snap();const iss=issues(S);const prim=iss.length?iss[0].id:null;
  const E=estimate(S);
  PR={job:J,S,iss,primary:prim,done:0,dep:J.path.length,end:J.path.length,mult:1,strings:[],spag:[],last:0,lastZ:-1,warp:0,log:[],finished:false,t:performance.now(),E};
  if(prim==='jam'){PR.dep=Math.floor(J.path.length*.38);PR.end=Math.min(J.path.length-1,PR.dep+Math.round(J.path.length/J.m.nz*1.4))}
  if(prim==='spaghetti')PR.failAt=J.path.findIndex(c=>!c.ok);
  PR.dur=RM?1.6:clamp(6+E.time/3600*1.1,7,15);
  PR.hasString=iss.some(i=>i.id==='string');
  Snd.startHum();
  ST.result=null;drawStep();
  RAF=requestAnimationFrame(tick);
}
function logEv(t){if(!PR)return;PR.log.push(t);const L=$('#prLog');if(L){L.insertAdjacentHTML('beforeend',`<li>${t}</li>`)}}
function tick(now){
  if(!PR)return;const J=PR.job,dt=clamp((now-PR.t)/1000,0,.05);PR.t=now;
  advance(Math.min(PR.end,PR.done+dt/PR.dur*J.path.length*PR.mult));
  hud();drawBay();
  if(PR.done>=PR.end-1e-6){finishPrint();return}
  RAF=requestAnimationFrame(tick);
}
function advance(to){
  const J=PR.job,total=J.path.length;const prev=PR.done;PR.done=to;
  const a=Math.floor(prev),b=Math.floor(PR.done);
  for(let i=Math.max(1,a+1);i<=b&&i<total;i++){
    const p=J.path[i-1],q=J.path[i];
    if(q.z!==PR.lastZ){PR.lastZ=q.z;Snd.tick();const lay=Math.round(q.z/J.m.nz*PR.E.layers)+1;
      if(PR.primary==='spaghetti'&&!PR.saidS&&i>=PR.failAt){PR.saidS=1;logEv(`Layer ${lay}: plastic is drooping into thin air!`)}
      if(PR.primary==='warp'&&!PR.saidW&&q.z>=1){PR.saidW=1;logEv(`Layer ${lay}: the corners are starting to lift off the bed.`)}
      if((PR.primary==='cold'||PR.primary==='flow')&&!PR.saidU){PR.saidU=1;logEv(`Layer ${lay}: the lines look thin and gappy.`)}}
    const adj=Math.abs(p.x-q.x)+Math.abs(p.y-q.y)<=1&&p.z===q.z;
    if(!adj&&(PR.hasString)&&PR.strings.length<180&&i<PR.dep){PR.strings.push({a:p,b:q});if(!PR.saidSt&&PR.strings.length>4){PR.saidSt=1;logEv('Thin hairs of plastic are stretching between the parts.')}}
    if(!adj){Snd.humFreq(520)}else Snd.humFreq(220+PR.S.speed*2.2+((q.x+q.y)%3)*12);
    if(PR.primary==='spaghetti'&&i>=PR.failAt&&PR.spag.length<300){
      if(!q.ok||Math.random()<.22){const pts=[];let x=q.x+.5,y=q.y+.5,z=q.z+1;pts.push([x,y,z]);const n=6+Math.floor(Math.random()*8);
        for(let k=0;k<n;k++){x+=Math.random()*1.6-.8;y+=Math.random()*1.6-.8;z=Math.max(.15,z-Math.random()*.7);pts.push([x,y,z])}PR.spag.push(pts)}}

}
function hud(){
  const H=$('#hud');if(!H||!PR)return;const J=PR.job,f=PR.done/J.path.length;const i=Math.min(Math.floor(PR.done),J.path.length-1);
  const lay=Math.min(PR.E.layers,Math.max(1,Math.round((J.path[i].z+ (J.path[i].z<J.m.nz-1?0:1))/J.m.nz*PR.E.layers)+1));
  const tN=PR.S.temp+(RM?0:Math.round(Math.sin(performance.now()/400)*1.2));
  H.innerHTML=`<span>Layer ${Math.min(lay,PR.E.layers)} / ${PR.E.layers}</span><span>${fmtT(PR.E.time*Math.min(1,f))} / ${fmtT(PR.E.time)}</span><span class="hot">Nozzle ${tN} °C</span><span>Bed ${MATS[PR.S.mat].bed} °C</span>`;
  const b=$('#bprog i');if(b)b.style.width=(Math.min(1,PR.done/PR.end)*100)+'%';
}
function finishPrint(){
  if(RAF)cancelAnimationFrame(RAF);RAF=0;Snd.stopHum();PR.finished=true;
  const S=PR.S,iss=PR.iss,prim=iss[0];const sc=scoreRun(S);
  let st=0,kind='ok';
  if(prim&&prim.sev==='fail'){kind='fail';st=0}
  else{st=sc.total>=90?3:sc.total>=75?2:1;if(prim&&prim.sev==='defect'){kind='defect';st=Math.min(st,1)}}
  const score=kind==='fail'?Math.round(sc.total*.25):kind==='defect'?Math.round(sc.total*.7):sc.total;
  ST.result={kind,st,score,sc,iss,S};
  const key=S.model;if(st>(MSTARS[key]||0)){MSTARS[key]=st;store.set('mstars',MSTARS)}
  const bestM=Math.max(0,...Object.values(MSTARS));const imp=award('studio',bestM,score);ST.result.newBest=imp||score>=(BESTSCORE['m_'+key]||0)&&score>0;
  if(score>(BESTSCORE['m_'+key]||0)){BESTSCORE['m_'+key]=score;store.set('bestScore',BESTSCORE)}
  ST.post=new Set();
  kind==='fail'?Snd.fail():st>=2?Snd.win():Snd.good();
  say(kind==='fail'?`Print failed: ${prim.t}`:`Print finished. Score ${score}. ${st} stars.`);

  const r=$('#resTitle');if(r){r.setAttribute('tabindex','-1');r.focus({preventScroll:true})}
}

}

}

function drawSlice(){
  const cv=$('#slc');if(!cv||!BAY.job)return;const c=cv.getContext('2d'),m=BAY.job.m;const z=Math.min(m.nz-1,Math.max(0,Math.floor(m.nz/2)-(ST.model==='key'?1:0)));
  const W=200,cs=Math.floor(176/Math.max(m.nx,m.ny)),ox=(W-cs*m.nx)/2,oy=(W-cs*m.ny)/2;c.clearRect(0,0,W,W);
  const col=ST.colour,inside=[];
  for(let y=0;y<m.ny;y++)for(let x=0;x<m.nx;x++){if(!gi(m,x,y,z))continue;const edge=!gi(m,x+1,y,z)||!gi(m,x-1,y,z)||!gi(m,x,y+1,z)||!gi(m,x,y-1,z);if(edge){c.fillStyle=col;c.fillRect(ox+x*cs,oy+y*cs,cs,cs)}else inside.push([x,y])}
  c.save();c.beginPath();inside.forEach(([x,y])=>c.rect(ox+x*cs,oy+y*cs,cs,cs));c.fillStyle='#2f353e';c.fill();c.clip();
  if(ST.infill>0){const sp=Math.max(2.2,cs*2.4*(20/ST.infill));c.strokeStyle=col;c.lineWidth=Math.max(1.2,cs*.22);c.beginPath();for(let d=-W;d<W*2;d+=sp){c.moveTo(d,0);c.lineTo(d+W,W);c.moveTo(d+W,0);c.lineTo(d,W)}c.stroke()}
  c.restore();
  $('#slcT').innerHTML=`<b>Slice preview</b><br>Layer ${Math.round(z/m.nz*estimate(snap()).layers)+1}: solid walls around the edge, ${ST.infill}% grid infill inside.${ST.infill===0?' (Hollow!)':''}`;
}
function gcode(){
  const S=snap(),m=MATS[S.mat],E=estimate(S),F=S.speed*60,lh=S.lh;const e=(len,l)=>(len*l*.45/2.405).toFixed(3);
  const C=t=>`<span class="c">${t}</span>`;
  return [C(`; Print Lab slicer: ${S.model}.stl → ${S.model}.gcode`),C(`; ${E.layers} layers · layer height ${lh.toFixed(2)} mm · infill ${S.infill}% · supports ${S.sup?'on':'off'}`),C(`; estimated time ${fmtT(E.time)} · filament ${E.grams.toFixed(0)} g (${E.len.toFixed(1)} m)`),
  `M140 S${m.bed} ${C('; set bed temperature')}`,`M104 S${S.temp} ${C('; set nozzle temperature')}`,`G28 ${C('; home all axes')}`,`M190 S${m.bed} ${C('; wait for the bed')}`,`M109 S${S.temp} ${C('; wait for the nozzle')}`,`G92 E0 ${C('; reset extruder')}`,
  C(';LAYER:0'),`G1 Z${lh.toFixed(2)} F600 ${C('; first layer height')}`,`G0 X60.0 Y60.0 F6000 ${C('; travel (no plastic)')}`,`G1 X100.0 Y60.0 E${e(40,lh)} F${F} ${C('; extrude a line')}`,`G1 X100.0 Y100.0 E${e(80,lh)} F${F}`,`G1 X60.0 Y100.0 E${e(120,lh)} F${F}`,
  C(';LAYER:1'),`M106 S${m.fan} ${C(`; part-cooling fan ${Math.round(m.fan/255*100)}%`)}`,`G1 Z${(2*lh).toFixed(2)} F600`,C(`; … ${E.layers-2} more layers …`),`M104 S0 ${C('; nozzle heater off')}`,`M140 S0 ${C('; bed heater off')}`,`M107 ${C('; fan off')}`,`M84 ${C('; motors off')}`].join('\n');
}

    '.subs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.subs label{text-transform:none;letter-spacing:0;font-size:12px;color:#eaf0ff;font-weight:600;display:flex;gap:6px;align-items:center;background:#ffffff0d;padding:7px;border-radius:9px;margin:0}.subs input{width:auto}' +
    '.f{margin-bottom:12px}.err{color:#ffab95;font-size:12px;margin-top:-6px;margin-bottom:10px}.foot{font-size:10.5px;color:#7f8db8;text-align:center;padding:8px;border-top:1px solid #ffffff12}';

  function avHTML(a, cls) { a = a || '🦁'; return '<div class="av ' + (cls || '') + '">' + (/^(https?:|data:image)/.test(a) ? '<img alt="" src="' + esc(a) + '">' : esc(a)) + '</div>'; }
  var rq = 0; function renderSoon() { if (rq) return; rq = setTimeout(function () { rq = 0; render(); }, 120); }

  var draft = null;
  function viewSetup() {
    var d = draft || (draft = Object.assign({ name: '', cls: '', avatar: '🦁', flag: '🇸🇽', plan: [CFG.gameSubject] }, ls('ea_arena_profile') || {}));
    return '<div class="card"><h3>Set up your arena card</h3>' +
      '<div class="f"><label>Name or alias</label><input id="f-name" maxlength="20" value="' + esc(d.name) + '" placeholder="e.g. Kai_IT"></div>' +
      '<div class="f"><label>Class</label><input id="f-cls" maxlength="10" value="' + esc(d.cls) + '" placeholder="e.g. L6, 5A"></div>' +
      '<div class="f"><label>Avatar</label><div class="grid">' + AVATARS.map(function (a) { return '<button data-av="' + a + '" class="' + (a === d.avatar ? 'on' : '') + '">' + a + '</button>'; }).join('') + '</div></div>' +
      '<div class="f"><label>Flag</label><select id="f-flag">' + FLAGS.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === d.flag ? ' selected' : '') + '>' + f[0] + '  ' + esc(f[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label>Subjects in your plan</label><div class="subs">' + SUBJ_ORDER.map(function (k) { return '<label><input type="checkbox" data-sub="' + k + '"' + (d.plan.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(subjName(k)) + '</label>'; }).join('') + '</div></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn big" data-act="save">Enter the arena</button></div>';
  }
  function viewList() {
    var me = S.me, out = '';
    out += '<div class="me">' + avHTML(me.avatar) + '<div class="grow"><div class="nm">' + esc(me.name) + ' ' + esc(me.flag) + '</div><div class="sub">' + esc(me.cls || 'No class') + ' · ' + me.plan.length + ' subject' + (me.plan.length === 1 ? '' : 's') + '</div></div>' + (me.locked ? '' : '<button class="btn2" data-act="edit">Edit</button>') + '</div>';
    out += '<label>Challenge subject</label><select id="subj">' + me.plan.map(function (k) { return '<option value="' + k + '"' + (k === S.subject ? ' selected' : '') + '>' + esc(subjName(k)) + '</option>'; }).join('') + '</select>';
    var live = S.conn === 'live' || S.conn === 'local';
    var ids = Object.keys(S.players).filter(function (k) { return S.filter === 'all' || (S.players[k].user.cls || '').toLowerCase() === (me.cls || '').toLowerCase(); });
    ids.sort(function (a, b) { var A = S.players[a], B = S.players[b]; return (A.status === 'match') - (B.status === 'match') || A.user.name.localeCompare(B.user.name); });
    out += '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Everyone</button><button class="chip ' + (S.filter === 'class' ? 'on' : '') + '" data-filter="class">My class</button></div>';
    out += '<div class="status"><i class="' + (live ? '' : 'off') + '"></i>' + (live ? ids.length + ' in the arena now · updates every few seconds' : S.conn === 'error' ? 'Can\'t reach the arena. Retrying…' : 'Connecting…') + '</div>';
    if (S.host) out += viewLobby();
    if (S.pendingJoin) out += '<div class="card"><h3>Joining ' + esc(S.pendingJoin.name) + '\'s match…</h3><div class="sub">Hang tight.</div></div>';
    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
