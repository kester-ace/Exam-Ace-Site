<!DOCTYPE html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illustrator Lab · CAPE Digital Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13265e;--gold:#F5C542;--gold2:#ffd970;--ink:#EAF0FF;--muted:#AFC0EA;
  --ok:#3ddc97;--bad:#ff8a8a;
  --disp:"Bricolage Grotesque","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;
  --ui:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui);background:var(--navy);font-size:12px;color:#222}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #4c9aff;outline-offset:1px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ============ START SCREEN ============ */
#start{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#1d3a8f55,transparent),linear-gradient(160deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);z-index:50}
#start .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
.brandrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.appicon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;flex:none}
.appicon svg{display:block}
#start h1{font-family:var(--disp);font-size:clamp(34px,5vw,58px);margin:14px 0 6px;line-height:1.02;letter-spacing:-.01em}
#start h1 span{color:var(--gold)}
#start .pitch{font-size:18px;max-width:760px;color:#d7e1ff;margin:0 0 14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.objs li{border:1px solid #2c4590;background:#0d1d50;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#cfdcff}
.objs li b{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{position:relative;text-align:left;border:1px solid #2b4391;background:linear-gradient(180deg,#10225c,#0b1844);border-radius:18px;padding:20px 18px 18px;color:var(--ink);cursor:pointer;font-family:var(--body);transition:transform .15s,border-color .15s;min-height:190px}
.lvcard:hover,.lvcard:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.lvcard .em{font-size:30px}
.lvcard h2{font-family:var(--disp);margin:6px 0 4px;font-size:22px}
.lvcard p{margin:0 0 12px;color:#c4d2fb;font-size:14.5px}
.lvcard .bar{height:8px;border-radius:9px;background:#203a86;overflow:hidden}
.lvcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);width:0}
.lvcard .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#b8c8f5}
.startbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.gbtn{border:1px solid #33509f;background:#0f2160;color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.gbtn:hover{border-color:var(--gold)}
.gbtn[disabled]{opacity:.45;cursor:default}
.gbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.xpline{display:flex;gap:18px;align-items:center;margin:4px 0 18px;color:#cfdcff;font-size:14px;flex-wrap:wrap}
.xpline b{color:var(--gold);font-family:var(--disp);font-size:20px}
.credit{margin-top:28px;color:#8fa3d8;font-size:12.5px;line-height:1.5}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.mcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0e1f58;border:1px solid #2a428e;border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;font-family:var(--body)}
.mcard:hover,.mcard:focus-visible{border-color:var(--gold)}
.mcard .num{flex:none;width:34px;height:34px;border-radius:10px;background:#1b3277;display:grid;place-items:center;font:700 15px var(--disp);color:var(--gold)}
.mcard .done{background:var(--gold);color:#1b1500}
.mcard h3{margin:0 0 3px;font:700 15.5px var(--body)}
.mcard .ob{display:block;font-size:12px;color:#9fb4ec}
.mcard .bp{display:block;font-size:13px;color:#c9d6fb;margin-top:4px}
.mcard .st{margin-left:auto;font-size:14px;white-space:nowrap;color:var(--gold)}
.backlink{background:none;border:0;color:var(--gold);font:600 14px var(--body);cursor:pointer;padding:6px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.badge{border:1px solid #2a428e;border-radius:14px;padding:12px;text-align:center;background:#0e1f58;color:#c9d6fb;font-size:13px}
.badge .bi{font-size:28px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--gold);color:#fff}
.badge.on .bi{filter:none;opacity:1}
.badge b{display:block;margin:4px 0 2px;color:inherit}
.lvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}

/* ============ COURSE BAR ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#coursebar{flex:none;height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);border-bottom:1px solid #1d2f6a;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#coursebar::-webkit-scrollbar{display:none}
#coursebar .cbtn{flex:none;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:9px;padding:5px 10px;cursor:pointer;font:600 13px var(--body);white-space:nowrap}
#coursebar .cbtn:hover{border-color:var(--gold)}
#coursebar .cbtn[aria-pressed=true]{background:var(--gold);color:#1b1500}
#coursebar .ctitle{flex:1;min-width:120px;font:700 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#coursebar .ctitle small{font:400 12px var(--body);color:var(--muted);margin-left:6px}
#coursebar .xp{flex:none;color:var(--gold);font:700 14px var(--disp);white-space:nowrap}
.dial{flex:none;display:flex;border:1px solid #2c4590;border-radius:9px;overflow:hidden}
.dial button{border:0;background:#0f2160;color:var(--ink);padding:5px 9px;cursor:pointer;font:600 12.5px var(--body);white-space:nowrap}
.dial button:hover{background:#1a2f75}
.dial .lv{padding:5px 9px;background:#071237;color:var(--gold);font:700 12.5px var(--body);white-space:nowrap}
#appmain{flex:1;display:flex;min-height:0;position:relative}
#appwin{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ======= MISSION PANEL ======= */
#mission{flex:none;width:340px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0B1A46,#060D26);color:var(--ink);font-family:var(--body);border-left:1px solid #1e3170;min-height:0;transition:width .2s}
#mission.collapsed{width:38px}
#mission.collapsed .mbody,#mission.collapsed .mhead h2,#mission.collapsed .mhead .mob,#mission.collapsed .mfoot{display:none}
.mhead{padding:10px 12px 8px;border-bottom:1px solid #1f3474;display:flex;gap:8px;align-items:flex-start}
.mhead h2{margin:0;font:700 17px/1.2 var(--disp)}
.mhead .mob{font-size:12px;color:var(--gold);margin-bottom:2px}
.mhead .colbtn{flex:none;margin-left:auto;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:7px;width:26px;height:26px;cursor:pointer}
.mbody{flex:1;overflow:auto;padding:10px 12px 16px}
.brief{background:#0f2160;border:1px solid #233d86;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:#dfe7ff}
.brief .unit{display:block;margin-top:6px;font-size:12px;color:var(--gold)}
.steps{list-style:none;margin:12px 0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-radius:9px;font-size:14px;line-height:1.35}
.steps li .sn{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #3b57a6;display:grid;place-items:center;font:700 12px var(--disp);color:#b8c8f5}
.steps li.ok .sn{background:var(--ok);border-color:var(--ok);color:#03311d}
.steps li.ok .st{color:#a9f0cf}
.steps li.cur{background:#132a6c}
.steps li .st{flex:1;min-width:0}
.steps li .st small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.steps li .fb{display:block;margin-top:4px;font-size:12.5px;color:#ffd1d1}
.steps li.ok .fb{display:none}
.steps li .qz{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.steps li .qz label{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:#dfe7ff;cursor:pointer;background:#0b1a4a;border:1px solid #233d86;border-radius:8px;padding:5px 7px}
.steps li .qz input{margin-top:2px;accent-color:var(--gold)}
.mbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mbtn{border:1px solid #2f4b9c;background:#10235f;color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font:600 13.5px var(--body)}
.mbtn:hover{border-color:var(--gold)}
.mbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.mbtn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #f5c54266}}
.hintbox{margin-top:10px;background:#1a1a3a;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#fff3c4}
.mtimer{font:700 13px var(--disp);color:var(--gold);margin-left:8px;align-self:center}
.complete{text-align:center;padding:12px 6px}
.complete .stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.complete h3{font:800 22px var(--disp);margin:4px 0}
.complete p{font-size:14px}
.mfoot{padding:8px 12px;border-top:1px solid #1f3474;font-size:11.5px;color:#8fa3d8;line-height:1.4}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #F5C542!important;outline-offset:1px;position:relative;z-index:30}
@keyframes pulse{50%{outline-color:#ff8b00;box-shadow:0 0 0 6px #f5c54255}}
#drawerBtn{display:none}

/* ======= MENUS / DIALOGS / TOAST (themed by the app) ======= */
.menu{position:fixed;z-index:300;background:var(--mbg,#fff);color:var(--mfg,#222);border:1px solid var(--mline,#ccc);border-radius:8px;box-shadow:0 10px 30px #0004;padding:4px;min-width:200px;max-height:80vh;overflow:auto;font:12.5px var(--ui)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;min-height:28px;color:inherit}
.menu .mi:hover,.menu .mi:focus{background:var(--mhover,#e8f0fe);outline:none}
.menu .mi[aria-disabled=true]{opacity:.45;pointer-events:none}
.menu .mi .mic{width:18px;display:grid;place-items:center;flex:none}
.menu .mi .kb{margin-left:auto;opacity:.6;padding-left:18px;font-size:11.5px}
.menu .mi .sub{margin-left:auto;font-size:10px;padding-left:12px;opacity:.7}
.menu .mi[aria-checked=true] .mic::before{content:"✓"}
.menu .sep{height:1px;background:var(--mline,#ddd);margin:4px 2px}
.menu .mh{padding:6px 10px 2px;font-weight:600;opacity:.7;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
#dlgLayer{position:fixed;inset:0;z-index:250;pointer-events:none}
.dlgback{position:fixed;inset:0;background:#00000052;pointer-events:auto}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--dbg,#fff);color:var(--dfg,#222);border-radius:10px;box-shadow:0 18px 50px #0006;border:1px solid var(--dline,#bbb);min-width:min(300px,94vw);max-width:min(96vw,880px);max-height:92vh;display:flex;flex-direction:column;pointer-events:auto;font:13px var(--ui)}
.dlg .dh{display:flex;align-items:center;padding:12px 12px 6px 16px;font-size:14.5px;font-weight:650}
.dlg .dh span{flex:1}
.dlg .dh button{border:0;background:transparent;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px;color:inherit}
.dlg .dh button:hover{background:var(--dhover,#eee)}
.dlg .db{padding:6px 16px 10px;overflow:auto;line-height:1.5}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--dline,#eee);align-items:center;flex-wrap:wrap}
.dlg .df .left{margin-right:auto}
.dbtn{border:1px solid var(--dline,#bbb);background:var(--dbtn,#fff);color:inherit;border-radius:6px;padding:6px 14px;cursor:pointer;font:600 12.5px var(--ui)}
.dbtn:hover{filter:brightness(.96)}
.dbtn.pri{background:var(--dacc,#0d6efd);border-color:var(--dacc,#0d6efd);color:#fff}
.dlg label.f{display:block;margin:8px 0 3px;font-weight:600}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{font:12.5px var(--ui);border:1px solid var(--dline,#bbb);border-radius:5px;padding:4px 7px;height:30px;background:var(--dinput,#fff);color:inherit}
.dlg textarea{height:auto;width:100%}
.dlg table.dt{border-collapse:collapse;font-size:12.5px;width:100%;margin:4px 0 12px}
.dlg table.dt th,.dlg table.dt td{border:1px solid var(--dline,#ddd);padding:4px 7px;text-align:left;vertical-align:top}
.dlg table.dt th{background:var(--dhover,#f3f3f3);position:sticky;top:0}
.dlg h4{margin:12px 0 6px;font-size:13.5px}
.dlg .flist{display:flex;flex-direction:column;gap:6px}
.dlg .fitem{display:flex;gap:10px;align-items:center;border:1px solid var(--dline,#ddd);border-radius:8px;padding:8px 10px;background:var(--dbtn,#fff)}
.dlg .fitem b{display:block}
.dlg .fitem small{opacity:.7}
.dlg .fitem .sp{flex:1;min-width:0}
.dlg .fitem button{flex:none}
.expview{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.expview .pv{flex:1 1 260px;min-height:120px;max-height:52vh;overflow:auto;border:1px solid var(--dline,#ddd);border-radius:8px;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 50%/16px 16px;display:grid;place-items:center;padding:8px}
.expview .pv img{max-width:100%;max-height:48vh;display:block}
.expview .info{flex:1 1 220px;font-size:12.5px;line-height:1.55}
.expview .info code{font-size:11.5px}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:#242424;color:#fff;padding:9px 16px;border-radius:8px;z-index:400;font:13px var(--ui);box-shadow:0 6px 20px #0004;max-width:90vw;text-align:center}
.toast.gold{background:var(--navy2);color:var(--ink);border:1px solid var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;width:100%;height:100%}
.narrow-banner{position:fixed;left:8px;right:8px;top:8px;z-index:600;background:var(--gold);color:#1b1500;border-radius:10px;padding:8px 12px;font:600 13px var(--body);display:flex;gap:8px;align-items:center}
.narrow-banner button{margin-left:auto;border:0;background:#1b1500;color:var(--gold);border-radius:6px;padding:4px 8px;cursor:pointer}

/* ======= LEARN TOUR ======= */
#tour{position:fixed;inset:0;z-index:350;pointer-events:none}
#tour .ring{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px #000a;outline:3px solid var(--gold);transition:all .25s;pointer-events:none}
#tour .ring.none{left:50%!important;top:50%!important;width:0!important;height:0!important}
#tour .card{position:fixed;width:min(340px,92vw);background:var(--navy2);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;font:14px/1.5 var(--body);pointer-events:auto;box-shadow:0 12px 40px #0008}
#tour .card h3{margin:0 0 4px;font:700 17px var(--disp);color:var(--gold)}
#tour .card p{margin:0 0 10px}
#tour .card .tb{display:flex;gap:6px;align-items:center}
#tour .card .tb span{margin-right:auto;font-size:12px;color:var(--muted)}

@media (max-width:1100px){#mission{width:300px}}
@media (max-width:900px){
  #mission{position:absolute;right:0;top:0;bottom:0;z-index:90;width:min(340px,92vw);box-shadow:none;transform:translateX(100%);transition:transform .2s,visibility .2s;visibility:hidden}
  #mission.open{transform:none;box-shadow:-10px 0 30px #0006;visibility:visible}
  #mission.collapsed{width:min(340px,92vw)}
  #mission.collapsed .mbody,#mission.collapsed .mhead h2,#mission.collapsed .mhead .mob,#mission.collapsed .mfoot{display:block}
  #drawerBtn{display:inline-block;position:sticky;right:0;z-index:2;box-shadow:-12px 0 10px var(--navy2),12px 0 0 var(--navy2)}
  .levels{grid-template-columns:1fr}
}
@media (max-width:600px){
  #start .wrap{padding:20px 16px 32px}
  #start .pitch{font-size:16px}
  .mlist{grid-template-columns:1fr}
  #coursebar .ctitle small{display:none}
  .dial button .t{display:none}
}
@media print{body *{visibility:hidden}}

/* ============ Illustrator Lab interface (original look; follows light / dark) ============ */
html[data-theme=light]{--ai-bg:#EDEDED;--ai-bar:#E4E4E4;--ai-panel:#F4F4F4;--ai-line:#CFCFCF;--ai-text:#1F1F1F;--ai-text2:#5F5F5F;--ai-hover:#DCE5F7;--ai-sel:#CADBFA;--ai-paste:#D6D6D6;--ai-input:#FFFFFF;--ai-acc:#2D7FF9;
  --mbg:#FFFFFF;--mfg:#1F1F1F;--mline:#C8C8C8;--mhover:#DCE5F7;--dbg:#F7F7F7;--dfg:#1F1F1F;--dline:#CFCFCF;--dhover:#E8E8E8;--dbtn:#FFFFFF;--dacc:#2D7FF9;--dinput:#FFFFFF}
html[data-theme=dark]{--ai-bg:#323232;--ai-bar:#262626;--ai-panel:#383838;--ai-line:#4B4B4B;--ai-text:#EBEBEB;--ai-text2:#A9A9A9;--ai-hover:#474747;--ai-sel:#2D4A78;--ai-paste:#555555;--ai-input:#2A2A2A;--ai-acc:#4C93FF;
  --mbg:#323232;--mfg:#EBEBEB;--mline:#4B4B4B;--mhover:#2D7FF9;--dbg:#383838;--dfg:#EBEBEB;--dline:#4B4B4B;--dhover:#474747;--dbtn:#454545;--dacc:#2D7FF9;--dinput:#2A2A2A}
#ai{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--ai-bg);color:var(--ai-text);font:12px/1.35 var(--ui);user-select:none;-webkit-user-select:none}
#ai button{cursor:pointer;color:inherit;font-family:inherit}
#ai input,#ai select,#ai textarea{user-select:text;-webkit-user-select:text}
.ic{width:20px;height:20px;display:block;flex:none}.ic16{width:16px;height:16px;display:block;flex:none}
#aiMenu{flex:none;height:30px;display:flex;align-items:center;gap:1px;padding:0 6px;background:var(--ai-bar);border-bottom:1px solid var(--ai-line);overflow-x:auto;scrollbar-width:none}
#aiMenu::-webkit-scrollbar{display:none}
#aiMenu .mark{display:inline-grid;margin-right:6px}
#aiMenu .sp{flex:1}
.mbar{border:0;background:transparent;padding:4px 9px;border-radius:4px;font:500 12.5px var(--ui);white-space:nowrap}
.mbar:hover,.mbar:focus-visible{background:var(--ai-hover)}
.mbar.drw{display:none;align-items:center;gap:4px}
#aiCtrl{flex:none;height:38px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--ai-panel);border-bottom:1px solid var(--ai-line);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
#aiCtrl::-webkit-scrollbar{display:none}
#aiCtrl .clab{font-weight:600}#aiCtrl .clab.muted,.muted{color:var(--ai-text2);font-weight:500}
#aiCtrl .sp,.arow .sp{flex:1}
.csep{width:1px;height:20px;background:var(--ai-line)}
.cbtn2{border:1px solid var(--ai-line);background:var(--ai-input);border-radius:5px;height:28px;min-width:30px;padding:0 8px;display:inline-grid;place-items:center;font:600 12px var(--ui)}
.cbtn2:hover{border-color:var(--ai-acc)}
.anf{display:inline-flex;align-items:center;gap:3px;height:26px;border:1px solid var(--ai-line);background:var(--ai-input);border-radius:4px;padding:0 5px;flex:none}
.anf:focus-within{border-color:var(--ai-acc)}

/* ===================== check helpers ===================== */
const nkA=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function objNamed(n){return allObjs().find(o=>nkA(o.name)===nkA(n))||null}
function abNamed(n){return D.artboards.find(a=>nkA(a.name)===nkA(n))||null}
function onAB(o,a){const b=objBounds(o);return !!(b&&b.x+b.w/2>=a.x&&b.x+b.w/2<=a.x+a.w&&b.y+b.h/2>=a.y&&b.y+b.h/2<=a.y+a.h)}
function insideAB(o,a,inset){const b=strokeBounds(o);inset=inset||0;return !!(b&&b.x>=a.x+inset-.05&&b.y>=a.y+inset-.05&&b.x+b.w<=a.x+a.w-inset+.05&&b.y+b.h<=a.y+a.h-inset+.05)}
function artLeaves(){return leafObjs(D.layers.filter(L=>!L.template).flatMap(L=>L.children)).filter(o=>effVisible(o))}
function artPaths(){return artLeaves().filter(o=>o.type==='path')}
const fillHex=o=>o&&o.fill&&o.fill.t==='solid'?o.fill.c:null;
const strokeHex=o=>o&&o.stroke&&o.stroke.paint&&o.stroke.paint.t==='solid'?o.stroke.paint.c:null;
const anchorsOfP=o=>o.subpaths.flatMap(sp=>sp.pts);
function hasAnchorNear(o,x,y,tol){return anchorsOfP(o).some(a=>Math.hypot(a.x-x,a.y-y)<=tol)}
function isCircle(o){const b=objBounds(o);return o.type==='path'&&b&&Math.abs(b.w-b.h)<=1.5&&(o.live&&o.live.k==='ellipse'||anchorCount(o)===4&&o.subpaths[0].pts.every(hasIn))}
function curveDist(tpl,o){const T=flattenSub(tpl.subpaths[0],2);const P=o.subpaths.map(sp=>flattenSub(Object.assign({},sp),2));let sum=0,mx=0;for(const p of T){let best=Infinity;for(const poly of P)for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const d=ptSegD(p,a,b);if(d<best)best=d}sum+=best;mx=Math.max(mx,best)}return {mean:sum/T.length,max:mx}}
function textsArt(){return artLeaves().filter(o=>o.type==='text')}
function bgBehindA(t){const order=artLeaves();const i=order.indexOf(t);const b=objBounds(t);const cx=b.x+b.w/2,cy=b.y+b.h/2;let bg='#FFFFFF';for(let j=0;j<i;j++){const o=order[j];if(o.type!=='path'||!o.fill)continue;const ob=objBounds(o);if(cx<ob.x||cx>ob.x+ob.w||cy<ob.y||cy>ob.y+ob.h)continue;if(!inRings(ringsOf(o,3),cx,cy))continue;bg=o.fill.t==='solid'?o.fill.c:o.fill.stops[Math.floor(o.fill.stops.length/2)].c}return bg}
function groupColours(kindTest){return D.groups.filter(g=>kindTest(g.kind)).map(g=>({g,cols:D.swatches.filter(s=>s.group===g.id).map(s=>s.c)}))}
function abObjs(a){return artLeaves().filter(o=>onAB(o,a))}
function abColours(a){const s=new Set();for(const o of abObjs(a)){const f=fillHex(o);if(f)s.add(f);const k=strokeHex(o);if(k)s.add(k);if(o.fill&&o.fill.t==='grad')o.fill.stops.forEach(x=>s.add(x.c))}return [...s]}

{id:'shapes-sticker',level:1,title:'Shapes for a café sticker',unit:'U2 · M1U2',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U2 Elements of visual design (shape, line, colour)',file:'NutmegCafe_Sticker',doc:stSticker,

  {t:'Even spacing between repeated icons mainly creates…',q:{options:['emphasis on one icon','rhythm and unity','strong contrast'],correct:1}}],
 wrap:'Alignment and even spacing make a layout feel organised. The Align panel is exact; dragging by eye rarely is.'},
{id:'pen-curves',level:2,title:'Pen tool: tracing curves',unit:'U1 · M1U3',unitLong:'CAPE Digital Media Unit 1 · Module 1 · M1U3 Digital art; Unit 2 · M1U2 line and shape',file:'Leaf_Trace',doc:stLeaf,
 brief:'A Dominica eco-lodge wants a simple <b>leaf</b> mark. Trace the guide with smooth <b>Bézier curves</b>: click and <b>drag</b> to pull out direction handles.',
 steps:[
  {t:'Trace the leaf outline as one <b>closed</b> path with curved segments and no more than <b>6</b> anchor points.',c:()=>{const tpl=objNamed('Leaf guide');const c=artPaths().filter(o=>o.subpaths.length===1&&o.subpaths[0].closed&&anchorCount(o)<=6&&o.subpaths[0].pts.some(a=>hasIn(a)||hasOut(a)));if(!c.length)return 'Need a closed path, 6 points or fewer, with curves (drag when you click).';const best=c.map(o=>curveDist(tpl,o)).sort((a,b)=>a.mean-b.mean)[0];return (best.mean<=5&&best.max<=14)||('Close, but it strays from the guide (average '+best.mean.toFixed(1)+' pt off). Adjust the handles with the white arrow.')},h:['Press P. Press on the stem point and drag towards the upper curve, release. Press on the tip and drag, then click the stem again to close.','Fix the shape afterwards with Direct Selection (A): drag the round handle ends.'],show:['#aiTools [data-tool=pen]']},
  {t:'Fill the leaf with <b>Palm</b> green and give it <b>no stroke</b>.',c:()=>artPaths().some(o=>o.subpaths[0].closed&&fillHex(o)===SW('Palm')&&!(o.stroke&&o.stroke.paint))||'Fill Palm, stroke None.',h:['Select the leaf. Fill box ▸ Palm. Stroke box ▸ None (/).'],show:['#apFill','#apStroke']},
  {t:'Draw the <b>midrib</b>: an open, curved path from the stem to the tip.',c:()=>{const g=objNamed('Midrib guide');const s=g.subpaths[0].pts[0],e=g.subpaths[0].pts[1];return artPaths().some(o=>!o.subpaths[0].closed&&anchorCount(o)<=4&&o.subpaths[0].pts.some(a=>hasIn(a)||hasOut(a))&&hasAnchorNear(o,s.x,s.y,10)&&hasAnchorNear(o,e.x,e.y,10))||'Need an open curved path from the stem end to the tip.'},h:['Pen: press at the stem and drag a little, then press at the tip, then Enter.']},
  {t:'Stroke the midrib <b>3 pt</b> with <b>round caps</b>.',c:()=>artPaths().some(o=>!o.subpaths[0].closed&&o.stroke&&o.stroke.w>=3&&o.stroke.cap==='round')||'Use the Stroke panel: weight 3, Cap: Round.',h:['Window ▸ Stroke, or the Stroke panel icon on the right.'],show:['#aiDock [data-dock=strokeP]']}],
 wrap:'Direction handles control the curve: longer handles bend more. Good vector art uses as few anchor points as possible.'},
{id:'icon-grid',level:2,title:'Icon set on a pixel grid',unit:'U2 · M3U5',unitLong:'CAPE Digital Media Unit 2 · Module 3 · M3U5 Mobile user experience (icons and screens); Unit 1 · M3U8 export settings',file:'Caribbean_Icon_Set',doc:stIconGrid,time:900,
 brief:'Design four matching <b>48 × 48</b> icons (ferry, sun, palm, phone) for a travel app in The Bahamas. Keep a 2 pt margin and one stroke style so they look like a family.',
 steps:[
  {t:'Draw at least one path on <b>every</b> artboard.',c:()=>{const miss=D.artboards.filter(a=>!artPaths().some(o=>onAB(o,a)));return !miss.length||('Still empty: '+miss.map(a=>a.name).join(', ')+'.')},h:['Zoom in ('+MOD+'+=) and use the Pen, Line, Ellipse or Rectangle tools. Snap to Grid is on, so points land on whole points.']},
  {t:'Keep a <b>2 pt</b> safe margin: nothing touches the artboard edges.',c:()=>{const bad=D.artboards.filter(a=>artPaths().some(o=>onAB(o,a)&&!insideAB(o,a,2)));return !bad.length||('Too close to the edge on: '+bad.map(a=>a.name).join(', ')+'.')},h:['Remember the stroke counts: a 2 pt stroke sticks out 1 pt each side.']},
  {t:'Every icon stroke is <b>2 pt</b> with <b>round caps</b> and <b>round corners</b>.',c:()=>{const ps=artPaths().filter(o=>D.artboards.some(a=>onAB(o,a)));const bad=ps.filter(o=>!(o.stroke&&o.stroke.paint&&Math.abs(o.stroke.w-2)<.01&&o.stroke.cap==='round'&&o.stroke.join==='round'));return (ps.length&&!bad.length)||(bad.length+' path(s) have a different stroke.')},h:['Select everything ('+MOD+'+A), then Stroke panel: 2 pt, Round cap, Round corner.'],show:['#aiDock [data-dock=strokeP]']},
  {t:'<b>Export for Screens</b>: every icon as PNG at <b>1x</b> and <b>2x</b>, and as <b>SVG</b>.',c:()=>{const E=EV.exports||[];const miss=D.artboards.filter(a=>!(E.some(e=>e.ab===a.name&&e.fmt==='PNG'&&e.scale===1)&&E.some(e=>e.ab===a.name&&e.fmt==='PNG'&&e.scale===2)&&E.some(e=>e.ab===a.name&&e.fmt==='SVG')));return !miss.length||('Missing exports for: '+miss.map(a=>a.name).join(', ')+'.')},h:['File ▸ Export for Screens ('+MOD+'+Alt+E). The default list already has 1x PNG, 2x PNG and SVG.']}],
 wrap:'Icons in a set share a grid, a margin (keyline) and one stroke style. Exporting 1x and 2x PNG plus SVG covers ordinary screens, sharp phone screens and the web.'},
{id:'pathfinder-logo',level:2,title:'Caribbean logo with Pathfinder',unit:'U2 · M1U2',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U2 Elements of visual design; Unit 1 · M1U3 vector art',file:'SunsetFerry_Logo',doc:stPFLogo,
 brief:'<b>Sunset Ferry Co.</b> runs boats between Tortola and Virgin Gorda in the British Virgin Islands. Combine simple shapes into a logo with the <b>Pathfinder</b> panel.',
 steps:[
  {t:'<b>Unite</b> the boat <b>Hull</b> and <b>Cabin</b> into one shape.',c:()=>artPaths().some(o=>o.pf==='unite')||'Select Hull and Cabin, then Pathfinder ▸ Unite.',h:['Select the hull, Shift+click the cabin, then click Unite in Pathfinder.'],show:['#aiDock [data-dock=pathfinder]']},
  {t:'Use <b>Minus Front</b> to cut the white <b>Wave stripe</b> out of the <b>Sun</b>.',c:()=>artPaths().some(o=>o.pf==='minusFront'&&o.subpaths.length>=2)||'Select the sun and the stripe on top of it, then Minus Front.',h:['Minus Front removes the front shape from the one behind it. The sun should split into two parts.']},
  {t:'Use <b>Intersect</b> on the <b>Window square</b> and <b>Window circle</b> to make a porthole shape.',c:()=>artPaths().some(o=>o.pf==='intersect')||'Select both window shapes, then Intersect.',h:['Intersect keeps only the area where the shapes overlap.']},
  {t:'Add the business name <b>Sunset Ferry Co.</b> as type.',c:()=>textsArt().some(t=>nkA(t.text).includes('sunset ferry'))||'Add text with the Type tool.',h:['Press T, click under the boat and type the name.']},
  {t:'Why are logos built as vector shapes?',q:{options:['They scale to any size without losing quality','They always make smaller photos','They cannot be edited by anyone else'],correct:0}}],
 wrap:'Pathfinder builds complex marks from simple shapes. Results stay as clean vector paths, so the logo works from a business card to the side of a ferry.'},
{id:'colour-schemes',level:2,title:'Colour scheme variations',unit:'U2 · M1U2',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U2 Colour harmony rules',file:'IslandHop_Logo_Colours',doc:stSchemes,
 brief:'The client for <b>Island Hop</b> (Trinidad and Tobago) wants to compare colour schemes. Build harmony groups with the <b>Colour Guide</b> and recolour copies of the logo.',
 steps:[
  {t:'In the <b>Colour Guide</b>, save an <b>Analogous</b> colour group to Swatches.',c:()=>D.groups.some(g=>g.kind==='analogous')||'Colour Guide ▸ Analogous ▸ Save colour group.',h:['Select the orange sun first so it becomes the base colour, then open the Colour Guide panel.'],show:['#aiDock [data-dock=guide]']},
  {t:'Save a second group with a <b>different</b> rule (Complementary, Split complementary, Triadic or Tetradic).',c:()=>D.groups.some(g=>['complementary','split','triadic','tetradic'].includes(g.kind))||'Change the harmony rule and save again.',h:['Pick a rule from the Harmony rule list, then Save colour group.'],show:['#aiDock [data-dock=guide]']},
  {t:'<b>Duplicate</b> the Original artboard twice (Artboards panel ▸ Duplicate with artwork).',c:()=>D.artboards.length>=3||'Need at least 3 artboards.',h:['Artboards panel ▸ Duplicate with artwork. Do it twice.'],show:['#aiDock [data-dock=artboards]']},
  {t:'<b>Recolour</b> one copy with the analogous group and another with your second group.',c:()=>{const an=groupColours(k=>k==='analogous').flatMap(x=>x.cols),ot=groupColours(k=>['complementary','split','triadic','tetradic'].includes(k)).flatMap(x=>x.cols);const abs=D.artboards.slice(1);const ok=g=>abs.some(a=>{const c=abColours(a);return c.length>=2&&c.every(x=>g.includes(x))});const a=ok(an),b=ok(ot);return (a&&b)||('Still needed: '+[!a&&'a copy in the analogous colours',!b&&'a copy in the second group’s colours'].filter(Boolean).join(' and ')+'.')},h:['Select everything on one copy, then Edit ▸ Edit Colours ▸ Recolour Artwork (or Recolour in Properties) and choose the group.'],show:['#aiDock [data-act=qRecolour]']},
  {t:'Make a <b>one-colour</b> (black and white) version on another artboard, for cheap single-ink printing.',c:()=>D.artboards.some(a=>{const o=abObjs(a);const c=abColours(a);return o.length&&c.length&&c.every(x=>x==='#000000'||x==='#FFFFFF')})||'Need an artboard where everything is black or white.',h:['Duplicate the Original again, select its artwork and Recolour ▸ One colour: black and white.']}],
 wrap:'Harmony rules pick colours by their positions on the colour wheel. Showing a client variations, including a one-colour version, proves the logo works everywhere.'},
{id:'gradient-sunset',level:2,title:'Gradients and dashed strokes',unit:'U2 · M1U2',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U2 Tints, shades, tones and gradients',file:'Maho_Sunset',doc:stSunset,
 brief:'Make a <b>Maho Beach</b> sunset scene for a Sint Maarten plane-spotting poster: a gradient sky, a glowing sun and a dashed flight path.',
 steps:[
  {t:'Give the <b>Sky</b> a <b>linear</b> gradient from orange at the bottom to pink at the top (angle about <b>90°</b>).',c:()=>{const s=objNamed('Sky');const g=s&&s.fill;return (g&&g.t==='grad'&&g.kind==='linear'&&g.stops.length>=2&&Math.abs(((g.angle||0)%360+360)%360-90)<=30)||'Sky needs a linear gradient at about 90°.'},h:['Select Sky, open the Gradient panel, choose Linear, set the angle to 90 and colour the stops.'],show:['#aiDock [data-dock=gradient]']},
  {t:'Add a <b>third</b> colour stop to the sky gradient.',c:()=>{const s=objNamed('Sky');return (s&&s.fill&&s.fill.t==='grad'&&s.fill.stops.length>=3)||'Click Add stop in the Gradient panel.'},h:['Gradient panel ▸ Add stop, then pick its colour.']},
  {t:'Give the <b>Sun</b> a <b>radial</b> gradient: light in the centre, darker at the edge.',c:()=>{const s=objNamed('Sun');const g=s&&s.fill;return (g&&g.t==='grad'&&g.kind==='radial'&&lumOf(g.stops[0].c)>lumOf(g.stops[g.stops.length-1].c))||'Sun needs a radial gradient, lighter in the middle.'},h:['Radial gradients spread out from the centre. Stop 1 (left) is the centre colour.']},
  {t:'Make the <b>Flight path</b> a <b>3 pt dashed</b> line with <b>round caps</b>.',c:()=>{const f=objNamed('Flight path');return (f&&f.stroke&&f.stroke.w>=3&&f.stroke.dash&&f.stroke.dash.length&&f.stroke.cap==='round')||'Stroke panel: 3 pt, Round cap, Dashed line.'},h:['Select the thin curved line, then use the Stroke panel.'],show:['#aiDock [data-dock=strokeP]']}],
 wrap:'Gradients suggest light and depth. Avoid heavy JPEG compression on gradients: it causes visible banding, so export PNG or SVG.'},
{id:'type-poster',level:3,title:'Type poster',unit:'U1 · M3U6',unitLong:'CAPE Digital Media Unit 1 · Module 3 · M3U6 Visual communication: colour, typography and layout',file:'StKitts_MusicFest_Poster',doc:stPoster,time:900,
 brief:'Design an A4 type poster for the <b>St. Kitts Music Festival</b> in Basseterre. Use type as the main design element: clear hierarchy, a curved line of type and no more than two fonts.',
 steps:[
  {t:'A headline at least <b>72 pt</b>.',c:()=>textsArt().some(t=>t.font.size>=72)||'Make the biggest text 72 pt or more.',h:["Type tool (T) ▸ click ▸ type ▸ set Size in the Character section."]},
  {t:'At least <b>three</b> different type sizes for hierarchy, the largest at least 2.5 × the smallest.',c:()=>{const s=[...new Set(textsArt().map(t=>Math.round(t.font.size)))];return (s.length>=3&&Math.max(...s)>=2.5*Math.min(...s))||('Sizes used: '+(s.join(', ')||'none')+'.')},h:["Use sizes that are clearly different, for example 96, 36 and 14."]},
  {t:'A line of type on a <b>curved path</b> (Type on a Path tool).',c:()=>textsArt().some(t=>t.mode==='path'&&String(t.text).trim())||'Draw a curve or circle, then click it with Type on a Path.',h:["Draw a circle or curve, pick Type on a Path (under the Type tool), click the path and type."]},
  {t:'No more than <b>two</b> font families.',c:()=>{const f=new Set(textsArt().map(t=>t.font.family));return (f.size>=1&&f.size<=2)||('Fonts used: '+[...f].join(', ')+'.')},h:["Check the font family of each text in Character."]},
  {t:'Everything stays <b>inside the artboard</b>, and every text has contrast of at least <b>4.5:1</b> with what is behind it.',c:()=>{const a=D.artboards[0];const out=artLeaves().filter(o=>!insideAB(o,a));if(out.length)return out.length+' object(s) cross the artboard edge.';const bad=textsArt().filter(t=>contrast(fillHex(t)||'#000000',bgBehindA(t))<4.5);return !bad.length||('Low contrast: '+bad.map(t=>'“'+String(t.text).slice(0,18)+'”').join(', ')+'.')},h:["Dark type on a light background (or the reverse). Keep everything inside the white artboard."]}],
 wrap:'Typographic hierarchy (size, weight, colour, position) tells readers what to see first. Two fonts are usually enough; contrast keeps it readable from across the street.'},
{id:'print-web',level:3,title:'Logo files for print and web',unit:'U1 · M3U8',unitLong:'CAPE Digital Media Unit 1 · Module 3 · M3U8 Compression, file formats and export settings; Unit 2 · M1U2 RGB and CMYK',file:'BayBreeze_Logo',doc:stBayBreeze,time:900,
 brief:'<b>Bay Breeze Rentals</b> in Antigua needs logo files for its website and for a printed vinyl banner. Prepare the right file for each job.',
 steps:[
  {t:'<b>Web:</b> export the logo as <b>SVG</b>.',c:()=>(EV.exports||[]).some(e=>e.fmt==='SVG')||'File ▸ Export As ▸ SVG.',h:["File ▸ Export As ▸ Format: SVG."]},
  {t:'<b>Web:</b> export a <b>PNG at 2x</b> with a <b>transparent</b> background.',c:()=>(EV.exports||[]).some(e=>e.fmt==='PNG'&&e.scale>=2&&e.transparent)||'Export As ▸ PNG ▸ 2x (144 ppi) ▸ Transparent.',h:["Export As ▸ PNG ▸ Resolution 2x (144 ppi) ▸ Background: Transparent."]},
  {t:'<b>Print prep:</b> turn all type into <b>outlines</b>.',c:()=>textCount()===0&&artPaths().some(o=>o.outlined)||'Select the type and use Type ▸ Create Outlines ('+MOD+'+Shift+O).',h:["Select all (Ctrl+A) ▸ Type ▸ Create Outlines (Ctrl+Shift+O)."]},
  {t:'<b>Print prep:</b> switch the document to <b>CMYK</b> colour mode.',c:()=>D.mode==='CMYK'||'File ▸ Document Colour Mode ▸ CMYK (or Properties ▸ Colour mode).',h:["With nothing selected: Properties ▸ Colour mode ▸ CMYK."]},
  {t:'<b>Print:</b> save a <b>PDF</b> (Press quality, CMYK) with <b>3 mm bleed</b>.',c:()=>(EV.exports||[]).some(e=>e.fmt==='PDF'&&e.cmyk&&e.bleed>=3&&e.texts===0)||'File ▸ Save as PDF for print ▸ Press quality ▸ 3 mm bleed (after outlining the type).',h:["File ▸ Save as PDF for print ▸ Press quality ▸ 3 mm bleed."]},
  {t:'The print shop asks for the logo for a 3-metre vinyl banner. Which file do you send?',q:{options:['The 1x PNG from the website','The CMYK PDF with outlined type','A JPEG screenshot of the logo'],correct:1}}],
 wrap:'Screens use RGB; printing presses use CMYK inks. SVG and PNG suit the web; a CMYK PDF with outlined type and bleed is what printers expect.'},
{id:'image-trace',level:3,title:'Image Trace a hand sketch',unit:'U1 · M1U3',unitLong:'CAPE Digital Media Unit 1 · Module 1 · M1U3 Digital art: digitised artwork and vector art',file:'Hibiscus_Trace',doc:stTrace,time:900,
 brief:'A Jamaican florist sketched a <b>hibiscus</b> on paper and scanned it. Turn the pixels into clean, editable <b>vector</b> paths for a logo.',
 steps:[
  {t:'Trace the sketch with <b>Image Trace</b> (try the <b>Black and white logo</b> preset).',c:()=>allObjs().some(o=>o.type==='trace'||o.traced)||'Select the sketch, open Image Trace and click Trace.',h:["Select the sketch ▸ Image Trace panel ▸ preset Black and white logo ▸ Trace."]},
  {t:'<b>Expand</b> the tracing into ordinary paths.',c:()=>(!allObjs().some(o=>o.type==='trace')&&artPaths().some(o=>o.traced))||'Click Expand.',h:["Click Expand in the Image Trace panel or in Quick actions."]},
  {t:'<b>Simplify</b> the traced paths so they have at least <b>25%</b> fewer anchor points.',c:()=>{const s=EV.simplify;return (s&&s.after<=s.before*.75&&artPaths().some(o=>o.traced&&o.simplified))||'Select the traced artwork, Object ▸ Path ▸ Simplify and drag the slider right.'},h:["With the traced group selected: Quick actions ▸ Simplify ▸ drag the slider well to the right."]},
  {t:'Recolour the flower with the <b>Hibiscus</b> swatch.',c:()=>artPaths().some(o=>o.traced&&fillHex(o)===SW('Hibiscus'))||'Select the traced paths and click the Hibiscus swatch.',h:["Fill box ▸ Swatches ▸ Hibiscus."]},
  {t:'No placed images are left in the file.',c:()=>!allObjs().some(o=>o.type==='image')||'Delete any leftover placed image.',h:["Expand removes the image. If one is left, select it and press Delete."]}],
 wrap:'Image Trace turns pixels into vector paths. Simplifying afterwards removes lumpy extra points, which makes the logo smoother and easier to edit, cut or embroider.'},
{id:'sail-badge',level:3,title:'Sailing week badge',unit:'U2 · M1U2',unitLong:'CAPE Digital Media Unit 2 · Module 1 · M1U2 Elements of visual design; Unit 1 · M1U3 vector art',file:'SailingWeek_Badge',doc:stBadge,time:900,
 brief:'Make a badge for <b>Antigua Sailing Week</b>: a star cut out of the circle, a symmetrical sail and the event name around the edge.',
 steps:[
  {t:'Cut the <b>Star</b> out of the <b>Badge circle</b> with <b>Minus Front</b>.',c:()=>artPaths().some(o=>o.pf==='minusFront'&&o.subpaths.length>=2)||'Select the circle and the star, then Pathfinder ▸ Minus Front.',h:["Select Badge circle and Star (Shift+click) ▸ Pathfinder ▸ Minus Front."]},
  {t:'<b>Reflect</b> a copy of the <b>Sail half</b> to make the other half (Reflect tool O with Alt, or Object ▸ Transform ▸ Reflect ▸ Copy).',c:()=>artPaths().some(o=>o.ref==='reflect'||o.fromRef)||'Make a reflected copy of the sail half.',h:["Select Sail half ▸ Reflect tool (O) ▸ click on the sail’s straight edge to set the origin ▸ press Enter ▸ Copy."]},
  {t:'<b>Unite</b> the two sail halves into one sail.',c:()=>artPaths().some(o=>o.pf==='unite')||'Select both halves, then Unite.',h:["Select both halves (Shift+click in Layers) ▸ Pathfinder ▸ Unite."]},
  {t:'Put <b>ANTIGUA SAILING WEEK</b> on the circular path around the badge.',c:()=>textsArt().some(t=>t.mode==='path'&&nkA(t.text).includes('antigua sailing week'))||'Use the Type on a Path tool on the thin grey Text circle.',h:["Type on a Path tool ▸ click the thin grey circle ▸ type the words."]},
  {t:'Everything stays inside the artboard.',c:()=>{const a=D.artboards[0];return !artLeaves().filter(o=>o.type!=='text'||o.mode!=='path').some(o=>!insideAB(o,a))||'Something crosses the artboard edge.'},h:["Move or resize anything that crosses the artboard edge."]}],
 wrap:'Reflecting a copy guarantees perfect symmetry, and Minus Front creates a real hole (a compound path), so the background shows through wherever the badge is used.'},
{id:'clean-file',level:3,title:'Prepare a clean file',unit:'U1 · M3U8',unitLong:'CAPE Digital Media Unit 1 · Module 3 · M3U8 Publishing: file preparation and export',file:'ReefSafe_Flyer',doc:stClean,time:900,
 brief:'A classmate’s <b>Reef-safe sunscreen</b> flyer (Belize) has hidden problems that will cause trouble at the print shop. Find and fix them.',
 steps:[
  {t:'Inspect the artwork in <b>Outline view</b> (Ctrl+Y).',c:()=>(EV.outline||0)>=1||'View ▸ Outline ('+MOD+'+Y).',h:["View ▸ Outline (Ctrl+Y), look, then Ctrl+Y again for Preview."]},
  {t:'Remove <b>stray points</b> and <b>empty text</b> objects (Object ▸ Path ▸ Clean Up).',c:()=>{const st=allObjs().filter(o=>o.type==='path'&&anchorCount(o)<=1).length,et=allObjs().filter(o=>o.type==='text'&&!String(o.text).trim()).length;return (!st&&!et)||(st+' stray point(s) and '+et+' empty text object(s) left.')},h:["Object ▸ Path ▸ Clean Up."]},
  {t:'<b>Close</b> the open <b>Wave</b> path (Join, Ctrl+J).',c:()=>{const w=objNamed('Wave');return (w&&w.subpaths.every(sp=>sp.closed))||'Select Wave and press '+MOD+'+J.'},h:["Select Wave in the Layers panel ▸ Ctrl+J."]},
  {t:'Delete the duplicate <b>Sun copy</b> stacked on top of the Sun.',c:()=>{const suns=artPaths().filter(o=>{const b=objBounds(o);return Math.abs(b.x-140)<1&&Math.abs(b.y-60)<1&&Math.abs(b.w-120)<1});return suns.length===1||'There are still '+suns.length+' suns stacked together.'},h:["Select Sun copy in the Layers panel ▸ Delete."]},
  {t:'Delete artwork left on the <b>pasteboard</b> outside the artboard.',c:()=>{const a=D.artboards[0];const out=artLeaves().filter(o=>{const b=objBounds(o);return b&&(b.x>=a.x+a.w||b.y>=a.y+a.h||b.x+b.w<=a.x||b.y+b.h<=a.y)});return !out.length||(out.length+' object(s) still off the artboard.')},h:["Zoom out (Ctrl+Alt+0). Select the coral rectangle beside the artboard ▸ Delete."]},
  {t:'<b>Save</b> the clean file to this browser.',c:()=>(EV.saved||0)>=1||'File ▸ Save to this browser ('+MOD+'+S).',h:["File ▸ Save to this browser (Ctrl+S)."]}],
 wrap:'Outline view shows what Preview hides: stray points, stacked duplicates and open paths. Clean files print correctly and are easier for the next designer to edit.'}
];
/* ===================== app definition ===================== */
const ASTARTERS=[{id:'blank',name:'Blank Letter document',icon:'⬜',desc:'One Letter-size artboard (612 × 792 pt), RGB.',make:stBlankA},{id:'card',name:'Business card',icon:'💳',desc:'Front and back artboards at 252 × 144 pt.',make:stCard},{id:'icons',name:'Icon grid (4 × 48 pt)',icon:'🔲',desc:'Four icon artboards with Snap to Grid switched on.',make:stIconGrid},{id:'poster',name:'A4 poster',icon:'🖼️',desc:'A blank A4 artboard (595 × 842 pt) for type and layout.',make:stPoster},{id:'trace',name:'Sketch to trace',icon:'🌺',desc:'A scanned hibiscus sketch ready for Image Trace.',make:stTrace},{id:'logo',name:'Bay Breeze logo',icon:'⛵',desc:'A finished logo with live type to study and export.',make:stBayBreeze}];
const ATOUR=[
  {sel:'#aiMenu',title:'Menu bar',text:'File (save, export, colour mode), Edit, Object (transform, path, compound path, image trace), Type (create outlines), View (outline view, grid) and Window (all panels).'},
  {sel:'#aiCtrl',title:'Control bar',text:'Quick Fill, Stroke, opacity and position for the selection. Undo, redo and Export are on the right.'},

<tr><td>Selection (black arrow)</td><td>V</td><td>Select, move, scale and rotate whole objects. Alt+drag copies.</td></tr>

<tr><td>Add / Delete Anchor Point</td><td>+ / −</td><td>Add a point on a segment, or remove one.</td></tr>

<tr><td>Pencil</td><td>N</td><td>Draw freehand; the path is smoothed into curves.</td></tr>
<tr><td>Type / Type on a Path</td><td>T</td><td>Click for point type, drag for area type, click a path to type along it.</td></tr>

<tr><td>Rotate · Reflect · Scale</td><td>R · O · S</td><td>Click to set the origin, then drag. Enter opens the exact dialog with a Copy button.</td></tr>
<tr><td>Eyedropper</td><td>I</td><td>Copy colour and stroke from another object.</td></tr>
<tr><td>Artboard</td><td>Shift+O</td><td>Move, resize, add and name artboards.</td></tr>
<tr><td>Hand · Zoom</td><td>H (or Space) · Z</td><td>Move around; click or drag to zoom (Alt zooms out).</td></tr></table>

<h4>Key terms (CAPE Digital Media)</h4><table class="dt">
<tr><td><b>Vector vs raster</b></td><td>Vectors are paths described by maths: they scale to any size. Raster images are grids of pixels and blur when enlarged.</td></tr>
<tr><td><b>Anchor point · direction handle</b></td><td>Points along a path; handles set how curved the segments are.</td></tr>
<tr><td><b>Open / closed path · compound path</b></td><td>Open paths have two ends; closed paths join up. A compound path combines shapes so overlaps become holes.</td></tr>
<tr><td><b>Fill · stroke</b></td><td>The colour inside a shape and the line along its path (weight, caps, corners, dashes).</td></tr>
<tr><td><b>Swatch · colour group · harmony</b></td><td>Saved colours; groups built from rules such as analogous, complementary or triadic.</td></tr>
<tr><td><b>Gradient</b></td><td>A smooth blend between colour stops: linear or radial.</td></tr>
<tr><td><b>Pathfinder</b></td><td>Unite, Minus Front, Intersect, Exclude, Divide: build new shapes from overlapping ones.</td></tr>
<tr><td><b>Artboard</b></td><td>The printable or exportable page. One document can hold many artboards.</td></tr>
<tr><td><b>Image Trace · Simplify</b></td><td>Convert pixels to vector paths; reduce extra anchor points.</td></tr>
<tr><td><b>Point type · area type · type on a path</b></td><td>Single lines, wrapped paragraphs in a box, and type that follows a curve.</td></tr>
<tr><td><b>Leading · tracking</b></td><td>Space between lines; space across a whole word or line.</td></tr>
<tr><td><b>RGB · CMYK</b></td><td>Light for screens; cyan, magenta, yellow and black inks for print. Some bright RGB colours cannot be printed.</td></tr>
<tr><td><b>Outlines · bleed</b></td><td>Turn type into shapes so fonts cannot go missing; extend artwork 3 mm past the trim edge so nothing white shows after cutting.</td></tr>
<tr><td><b>SVG · PNG · PDF</b></td><td>SVG: vector for the web. PNG: lossless pixels with transparency. PDF: the usual file for printers.</td></tr></table>
<p style="font-size:12px;opacity:.75">Exam tip: in Paper 02 you may use a free vector app such as Inkscape. The same ideas apply: paths, nodes, fills and strokes, Path ▸ Union/Difference, and Save As PDF/SVG.</p>`}

      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
