<!DOCTYPE html>
<html lang="en" data-gs-own>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photoshop Lab · CAPE Digital Media</title>
<meta name="description" content="Practice photo editor: layers, masks, adjustment layers, healing, compositing and export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13265e;--gold:#F5C542;--gold2:#ffd970;--ink:#EAF0FF;--muted:#AFC0EA;
  --ok:#3ddc97;--bad:#ff8a8a;
  --disp:"Bricolage Grotesque","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  /* app chrome (light) */
  --c-bg:#f3f4f7;--c-panel:#ffffff;--c-panel2:#f7f8fa;--c-line:#d9dce3;--c-line2:#e8eaef;--c-text:#1f2430;--c-text2:#5b6272;
  --c-hover:#e9edf5;--c-press:#dde4f2;--c-field:#ffffff;--c-shadow:0 10px 30px #0b1a4626;--c-desk:#d7dae1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --c-bg:#1b1e25;--c-panel:#23272f;--c-panel2:#2a2f39;--c-line:#3a404c;--c-line2:#323743;--c-text:#e8ebf2;--c-text2:#a8b0c0;
    --c-hover:#323846;--c-press:#3b4354;--c-field:#1b1e25;--c-shadow:0 10px 30px #0008;--c-desk:#14161b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-bg:#1b1e25;--c-panel:#23272f;--c-panel2:#2a2f39;--c-line:#3a404c;--c-line2:#323743;--c-text:#e8ebf2;--c-text2:#a8b0c0;
  --c-hover:#323846;--c-press:#3b4354;--c-field:#1b1e25;--c-shadow:0 10px 30px #0008;--c-desk:#14161b;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;max-width:100vw}
body{font-family:var(--ui);color:var(--c-text);background:var(--navy);font-size:13px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #4c8dff;outline-offset:1px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
kbd{font:600 11.5px var(--ui);background:#eef1f7;border:1px solid #c9cfdc;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:#1f2430;white-space:nowrap}

/* ============ START SCREEN ============ */
#start{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#1d3a8f55,transparent),linear-gradient(160deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);z-index:50}
#start .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
.brandrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.brandrow b{color:var(--gold)}
.brandrow .sp{flex:1}
.appicon{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;flex:none}
.appicon svg{display:block}
#start h1{font-family:var(--disp);font-size:clamp(34px,5vw,58px);margin:14px 0 6px;line-height:1.02;letter-spacing:-.01em}
#start h1 span{color:var(--gold)}
#start .pitch{font-size:18px;max-width:760px;color:#d7e1ff;margin:0 0 14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.objs li{border:1px solid #2c4590;background:#0d1d50;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#cfdcff}
.objs li b{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{position:relative;text-align:left;border:1px solid #2b4391;background:linear-gradient(180deg,#10225c,#0b1844);border-radius:18px;padding:20px 18px 18px;color:var(--ink);cursor:pointer;font-family:var(--body);transition:transform .15s,border-color .15s;min-height:190px}
.lvcard:hover,.lvcard:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.lvcard .em{font-size:30px}
.lvcard h2{font-family:var(--disp);margin:6px 0 4px;font-size:22px}
.lvcard p{margin:0 0 12px;color:#c4d2fb;font-size:14.5px}
.lvcard .bar{height:8px;border-radius:9px;background:#203a86;overflow:hidden}
.lvcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);width:0}
.lvcard .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#b8c8f5}
.startbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.gbtn{border:1px solid #33509f;background:#0f2160;color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.gbtn:hover{border-color:var(--gold)}
.gbtn:disabled{opacity:.45;cursor:default}
.gbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.xpline{display:flex;gap:18px;align-items:center;margin:4px 0 18px;color:#cfdcff;font-size:14px;flex-wrap:wrap}
.xpline b{color:var(--gold);font-family:var(--disp);font-size:20px}
.credit{margin-top:28px;color:#8fa3d8;font-size:12.5px;border-top:1px solid #1d2f6a;padding-top:14px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.credit button{background:none;border:0;color:#cfdcff;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:#0e1f58;border:1px solid #2a428e;border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;font-family:var(--body);min-height:150px}
.mcard:hover,.mcard:focus-visible{border-color:var(--gold)}
.mcard .num{font:700 11.5px var(--body);letter-spacing:.06em;color:var(--gold)}
.mcard h3{margin:0;font:700 16.5px var(--body)}
.mcard .ob{font-size:12px;color:#9fb4ec}
.mcard p{margin:2px 0 0;font-size:13.5px;color:#cfdcff;line-height:1.35}
.mcard .st{margin-top:auto;font-size:14px;color:var(--gold);letter-spacing:2px}
.backlink{background:none;border:0;color:var(--gold);font:600 14px var(--body);cursor:pointer;padding:6px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.badge{border:1px solid #2a428e;border-radius:14px;padding:12px;text-align:center;background:#0e1f58;color:#c9d6fb;font-size:13px}
.badge .bi{font-size:28px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--gold);color:#fff}
.badge.on .bi{filter:none;opacity:1}
.badge b{display:block;margin:4px 0 2px;color:inherit}
.lvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.starter{border:1px solid #2a428e;background:#0e1f58;border-radius:14px;padding:12px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--body)}
.starter:hover,.starter:focus-visible{border-color:var(--gold)}
.starter b{display:block;font-size:15px;margin-bottom:3px}
.starter small{color:#9fb4ec;font-size:12.5px}
.sechead{font:700 20px var(--disp);margin:28px 0 4px}

/* ============ COURSE BAR ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#coursebar{flex:none;height:42px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);border-bottom:1px solid #1d2f6a;overflow:hidden}
#coursebar .cbtn{flex:none;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:9px;padding:5px 9px;cursor:pointer;font:600 13px var(--body);white-space:nowrap;min-height:30px}
#coursebar .cbtn:hover{border-color:var(--gold)}
#coursebar .cbtn[aria-pressed=true]{background:var(--gold);color:#1b1500}
#coursebar .ctitle{flex:1;min-width:60px;font:700 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
#coursebar .ctitle small{font:400 12px var(--body);color:var(--muted)}
#coursebar .xp{flex:none;color:var(--gold);font:700 14px var(--disp);white-space:nowrap}
.dial{flex:none;display:flex;border:1px solid #2c4590;border-radius:9px;overflow:hidden}
.dial button{border:0;background:#0f2160;color:var(--ink);padding:5px 9px;cursor:pointer;font:600 12.5px var(--body);white-space:nowrap}
.dial button:hover{background:#1a2f75}
.dial button:disabled{opacity:.4;cursor:default}
.dial .lv{padding:5px 9px;background:#071237;color:var(--gold);font:700 12.5px var(--body);white-space:nowrap;display:flex;align-items:center}
#appmain{flex:1;display:flex;min-height:0;position:relative}
#appwin{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--c-bg);color:var(--c-text)}
.cb-lbl{display:inline}

/* ======= MISSION PANEL ======= */
#mission{flex:none;width:330px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0B1A46,#060D26);color:var(--ink);font-family:var(--body);border-left:3px solid var(--gold);min-height:0;transition:width .2s}
#mission.collapsed{width:40px}
#mission.collapsed .mbody,#mission.collapsed .mhead .mtt,#mission.collapsed .mfoot,#mission.collapsed .mbar{display:none}
.mhead{padding:10px 12px 8px;border-bottom:1px solid #1f3474;display:flex;gap:8px;align-items:flex-start}
.mhead h2{margin:0;font:700 17px/1.2 var(--disp)}
.mhead .mob{font-size:12px;color:var(--gold);margin-bottom:2px}
.mhead .colbtn{flex:none;margin-left:auto;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:7px;width:28px;height:28px;cursor:pointer}
.mbody{flex:1;overflow:auto;padding:10px 12px 16px}
.brief{background:#0f2160;border:1px solid #233d86;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:#dfe7ff}
.brief b{color:#fff}
.tagline{font-size:12px;color:#9fb4ec;margin:8px 0 0}
.steps{list-style:none;margin:12px 0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-radius:9px;font-size:14px;line-height:1.35}
.steps li .sn{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #3b57a6;display:grid;place-items:center;font:700 12px var(--disp);color:#b8c8f5}
.steps li.ok .sn{background:var(--ok);border-color:var(--ok);color:#03311d}
.steps li.ok .st{color:#a9f0cf}
.steps li.cur{background:#132a6c;outline:1px solid #2c4590}
.steps li .fb{display:block;margin-top:4px;font-size:12.5px;color:#ffd1d1}
.steps li.ok .fb{display:none}
.mbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid #1f3474}
.mbtn{border:1px solid #2f4b9c;background:#10235f;color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font:600 13.5px var(--body);min-height:34px}
.mbtn:hover{border-color:var(--gold)}
.mbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.mbtn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #f5c54266}}
.hintbox{margin-top:10px;background:#1a1a3a;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#fff3c4}
.mtimer{font:700 13px var(--disp);color:var(--gold);margin-left:8px;align-self:center}
.complete{text-align:center;padding:12px 6px}
.complete .stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.complete h3{font:800 22px var(--disp);margin:4px 0}
.complete p{color:#c4d2fb}
.mfoot{padding:8px 12px;border-top:1px solid #1f3474;font-size:11.5px;color:#8fa3d8}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #F5C542!important;outline-offset:1px;position:relative;z-index:30}
@keyframes pulse{50%{outline-color:#ff8b00;box-shadow:0 0 0 6px #f5c54255}}
#drawerBtn{display:none}

/* ======= MENUS / DIALOGS / TOAST ======= */
.menu{position:fixed;z-index:300;background:var(--c-panel);border:1px solid var(--c-line);border-radius:8px;box-shadow:var(--c-shadow);padding:4px;min-width:200px;max-height:80vh;overflow:auto;font:13px var(--ui);color:var(--c-text)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;min-height:30px}
.menu .mi:hover,.menu .mi:focus{background:var(--c-hover);outline:none}
.menu .mi[aria-disabled=true]{opacity:.45}
.menu .mi .mic{width:20px;display:grid;place-items:center;flex:none}
.menu .mi .kb{margin-left:auto;color:var(--c-text2);padding-left:18px;font-size:11.5px}
.menu .mi .sub{margin-left:auto;font-size:10px;padding-left:12px}
.menu .sep{height:1px;background:var(--c-line2);margin:4px 2px}
.menu .mh{padding:6px 10px 2px;font-weight:700;color:var(--c-text2);font-size:11.5px}
#dlgLayer{position:fixed;inset:0;z-index:250;pointer-events:none}
.dlgback{position:fixed;inset:0;background:#00000040;pointer-events:auto}
.dlg{position:fixed;background:var(--c-panel);color:var(--c-text);border-radius:10px;box-shadow:0 18px 50px #0006;border:1px solid var(--c-line);min-width:min(300px,94vw);max-width:min(96vw,860px);max-height:92vh;display:flex;flex-direction:column;pointer-events:auto;font:13px var(--ui)}
.dlg .dh{display:flex;align-items:center;padding:10px 10px 6px 16px;font-size:15px;font-weight:700;cursor:move;user-select:none;touch-action:none}
.dlg .dh span{flex:1}
.dlg .dh button{border:0;background:transparent;width:30px;height:30px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--c-text)}
.dlg .dh button:hover{background:#e81123;color:#fff}
.dlg .db{padding:6px 16px 12px;overflow:auto;line-height:1.45}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--c-line2);align-items:center;flex-wrap:wrap}
.dlg label.f{display:block;margin:8px 0 3px;font-weight:700}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{font:13px var(--ui);border:1px solid var(--c-line);border-radius:5px;padding:5px 7px;min-height:30px;background:var(--c-field);color:var(--c-text);width:100%}
.dlg textarea{min-height:90px;resize:vertical}
.pbtn{border:1px solid var(--c-line);background:var(--c-panel2);color:var(--c-text);border-radius:7px;padding:6px 14px;cursor:pointer;font:600 13px var(--ui);min-height:32px}
.pbtn:hover{background:var(--c-hover)}
.pbtn.pri{background:#2563eb;border-color:#2563eb;color:#fff}
.pbtn.pri:hover{background:#1d4fd8}
.pbtn.danger{color:#c62828}
table.qref{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:10px}
table.qref th,table.qref td{border:1px solid var(--c-line);padding:5px 8px;text-align:left;vertical-align:top}
table.qref th{background:var(--c-panel2)}
.qtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px;border-bottom:1px solid var(--c-line)}
.qtabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 12px;border-radius:6px 6px 0 0;cursor:pointer;font-weight:600;color:var(--c-text2)}
.qtabs button[aria-selected=true]{border-color:var(--c-line);background:var(--c-panel);color:var(--c-text);margin-bottom:-1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:9px;z-index:400;font:13.5px var(--ui);box-shadow:0 6px 20px #0004;max-width:min(90vw,560px);text-align:center}
.toast.gold{background:var(--navy2);color:var(--ink);border:1px solid var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;width:100vw;height:100vh}
.narrow-banner{position:fixed;left:8px;right:8px;top:48px;z-index:600;background:var(--gold);color:#1b1500;border-radius:10px;padding:8px 12px;font:600 13px var(--body);display:flex;gap:8px;align-items:center}
.narrow-banner button{margin-left:auto;border:0;background:#1b1500;color:var(--gold);border-radius:6px;padding:4px 10px;cursor:pointer}
.expimg{display:block;max-width:100%;max-height:46vh;margin:8px auto;border:1px solid var(--c-line);background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px}
.exptxt{width:100%;min-height:160px;font:12px ui-monospace,Consolas,monospace!important}
.note{color:var(--c-text2);font-size:12px}

/* ======= TOUR ======= */
#tour{position:fixed;inset:0;z-index:450}
#tour .ring{position:fixed;border-radius:10px;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px #050b2299;transition:all .25s;pointer-events:none}
#tour .bubble{position:fixed;width:min(340px,92vw);background:var(--navy2);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;font:14px/1.45 var(--body);box-shadow:0 14px 40px #0008}
#tour .bubble h3{margin:0 0 6px;font:800 18px var(--disp);color:var(--gold)}
#tour .bubble p{margin:0 0 10px}
#tour .tnav{display:flex;gap:6px;align-items:center}
#tour .tnav .cnt{margin-right:auto;font-size:12px;color:var(--muted)}

@media (max-width:1100px){#mission{width:290px}}
@media (max-width:900px){
  #mission{position:absolute;right:0;top:0;bottom:0;z-index:120;width:min(340px,92vw);box-shadow:-10px 0 30px #0006;transform:translateX(105%);transition:transform .2s}
  #mission.open{transform:none}
  #mission.collapsed{width:min(340px,92vw)}
  #mission.collapsed .mbody,#mission.collapsed .mhead .mtt,#mission.collapsed .mfoot,#mission.collapsed .mbar{display:flex}
  #mission.collapsed .mbody{display:block}
  #drawerBtn{display:inline-block}
  .levels{grid-template-columns:1fr}
}
@media (max-width:700px){
  .cb-lbl{display:none}
  #coursebar .ctitle small{display:none}
  #coursebar .xp{display:none}
  #coursebar{gap:4px;padding:0 5px}
  #coursebar .cbtn{padding:5px 7px}
  .dial button{padding:5px 6px}
  .dial .lv{padding:5px 6px}
  #start .wrap{padding:18px 16px 30px}
  #start .pitch{font-size:16px}
  .mlist{grid-template-columns:1fr}
}
@media print{body *{visibility:hidden}}

/* ===================== Photoshop Lab · app window ===================== */
:root{--ps-bar:#e4e5e8;--ps-panel:#eef0f2;--ps-line:#c9ccd2;--ps-desk:#b9bcc2;--ps-hi:#2f7bff;--ps-row:#dfe3ea;--ps-sel:#c9dafc;--ps-field:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ps-bar:#2a2c30;--ps-panel:#323438;--ps-line:#1d1e21;--ps-desk:#26272a;--ps-row:#3a3d42;--ps-sel:#2c4a7f;--ps-field:#25272b}}
:root[data-theme="dark"]{--ps-bar:#2a2c30;--ps-panel:#323438;--ps-line:#1d1e21;--ps-desk:#26272a;--ps-row:#3a3d42;--ps-sel:#2c4a7f;--ps-field:#25272b}
#appwin.ps{background:var(--ps-panel);color:var(--c-text);font:12.5px var(--ui)}
.ps svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ps-title{flex:none;height:30px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--ps-bar);border-bottom:1px solid var(--ps-line);min-width:0}
.ps-title .pst{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;min-width:0}
.ps-title .sp{flex:1}
.tbtn{display:none;align-items:center;gap:5px;border:1px solid var(--ps-line);background:var(--ps-panel);border-radius:6px;padding:3px 8px;cursor:pointer;color:inherit;min-height:26px}
.ps-menubar{flex:none;display:flex;gap:1px;padding:0 6px;height:30px;align-items:center;background:var(--ps-bar);border-bottom:1px solid var(--ps-line);overflow-x:auto;scrollbar-width:none}
.ps-menubar::-webkit-scrollbar{display:none}
.mbar-btn{border:0;background:none;padding:4px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;color:inherit;min-height:26px}

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

  if(q.get('theme')&&/^(light|dark|auto)$/.test(q.get('theme'))){PREFS.theme=q.get('theme')}
  applyTheme();
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(PREFS.theme==='auto')applyTheme()})}catch(e){}
  APP.init();renderCourseBar();
  if(innerWidth<600){const b=el('div',{class:'narrow-banner',role:'status'},'📱 Best on a laptop or tablet in landscape — panels open as drawers on phones.',el('button',{onclick:()=>b.remove()},'OK'));document.body.append(b);setTimeout(()=>b.remove(),9000)}
  addEventListener('keydown',e=>{if(e.key==='F1'){e.preventDefault();quickRef()}});
  addEventListener('resize',()=>{closeMenus();APP.layout&&!$('#app').hidden&&APP.layout()});
  const lv=q.get('level'),mi=q.get('mission'),mode=q.get('mode'),st=q.get('starter');
  if(mi&&missionById(mi))startMission(mi);else if(mode==='free'||st)startFree(st&&APP.STARTERS.find(x=>x.id===st)?st:null);else if(lv&&/^[123]$/.test(lv))showStart('level'+lv);else showStart('home');
}

/* ===================== Photo Lab common: pixels, curves, histograms, healing, files ===================== */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}

/* ---------- photos: decoded once, upscaled to their master size with a light film grain ---------- */
const PIMG={};
function preloadPhotos(){return Promise.all(Object.keys(PHOTOS).map(k=>new Promise(res=>{const i=new Image();i.onload=()=>{PIMG[k]=i;res()};i.onerror=()=>res();i.src=PHOTOS[k].src})))}
function photoCanvas(key,w,h,grain){
  const P=PHOTOS[key];w=w||P.w;h=h||P.h;const c=mkCanvas(w,h),x=g2d(c);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  if(PIMG[key])x.drawImage(PIMG[key],0,0,w,h);else{x.fillStyle='#777';x.fillRect(0,0,w,h)}
  if(grain!==0){const id=x.getImageData(0,0,w,h),d=id.data,r=mulberry(key.length*7919+w);const a=grain||3.2;for(let i=0;i<d.length;i+=4){const n=(r()+r()-1)*a;d[i]=d[i]+n;d[i+1]=d[i+1]+n;d[i+2]=d[i+2]+n}x.putImageData(id,0,0)}

/* ---------- blur / sharpen (3-pass box ≈ gaussian; alpha-aware) ---------- */
function boxPass(src,dst,w,h,r,horiz){
  const iarr=1/(r+r+1);
  const outer=horiz?h:w,inner=horiz?w:h,step=horiz?4:w*4,lineStep=horiz?w*4:4;
  for(let o=0;o<outer;o++){
    const base=o*lineStep;
    for(let ch=0;ch<4;ch++){
      const first=src[base+ch],last=src[base+(inner-1)*step+ch];let v=(r+1)*first;
      for(let j=0;j<r;j++)v+=src[base+Math.min(j,inner-1)*step+ch];
      for(let i=0;i<inner;i++){
        v+=(i+r<inner?src[base+(i+r)*step+ch]:last)-(i-r-1>=0?src[base+(i-r-1)*step+ch]:first);
        dst[base+i*step+ch]=v*iarr;
      }
    }
  }
}
function blurData(d,w,h,sigma){ /* d: Uint8ClampedArray RGBA; returns new Float32Array blurred (premultiplied handled) */

/* ---------- histogram ---------- */
function histOf(id,step){step=step||1;const d=id.data,r=new Uint32Array(256),g=new Uint32Array(256),b=new Uint32Array(256),l=new Uint32Array(256);let n=0;
  for(let i=0;i<d.length;i+=4*step){if(d[i+3]<128)continue;r[d[i]]++;g[d[i+1]]++;b[d[i+2]]++;l[Math.round(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])]++;n++}
  return {r,g,b,l,n}}
function histPct(arr,n,p){let acc=0;const t=n*p;for(let i=0;i<256;i++){acc+=arr[i];if(acc>=t)return i}return 255}
function histMean(arr,n){let s=0;for(let i=0;i<256;i++)s+=arr[i]*i;return n?s/n:0}
function drawHist(cv,H,opt){opt=opt||{};const x=cv.getContext('2d'),w=cv.width,h=cv.height;x.clearRect(0,0,w,h);x.fillStyle=opt.bg||'#1d1f24';x.fillRect(0,0,w,h);if(!H||!H.n)return;
  const chans=opt.mono?[['l','#cfd3da']]:[['r','#ff3b3b'],['g','#2bd42b'],['b','#3b6bff']];let mx=1;for(const [k] of chans)for(let i=2;i<254;i++)mx=Math.max(mx,H[k][i]);

  for(const [k,col] of chans){x.beginPath();x.moveTo(0,h);for(let i=0;i<256;i++){const v=Math.min(1,H[k][i]/mx);x.lineTo(i/255*w,h-v*(h-4))}x.lineTo(w,h);x.closePath();x.fillStyle=col;x.globalAlpha=opt.mono?.85:.6;x.fill()}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
  if(opt.clip){const lo=H.l[0]+H.r[0]*0+0,hi=H.l[255];x.fillStyle=lo/H.n>0.002?'#5aa9ff':'#555';x.beginPath();x.moveTo(3,3);x.lineTo(13,3);x.lineTo(3,13);x.fill();x.fillStyle=hi/H.n>0.002?'#ffffff':'#555';x.beginPath();x.moveTo(w-3,3);x.lineTo(w-13,3);x.lineTo(w-3,13);x.fill()}}

/* ---------- curves: monotone cubic through points (0..255) ---------- */
function curveLUT(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]);const lut=new Uint8ClampedArray(256);const n=p.length;
  if(n<2){for(let i=0;i<256;i++)lut[i]=i;return lut}
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),dl=[],m=new Array(n);
  for(let i=0;i<n-1;i++)dl.push((ys[i+1]-ys[i])/Math.max(1e-6,xs[i+1]-xs[i]));
  m[0]=dl[0];m[n-1]=dl[n-2];for(let i=1;i<n-1;i++)m[i]=dl[i-1]*dl[i]<=0?0:(dl[i-1]+dl[i])/2;
  for(let i=0;i<n-1;i++){if(dl[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/dl[i],b=m[i+1]/dl[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*dl[i];m[i+1]=t*b*dl[i]}}
  for(let v=0;v<256;v++){
    if(v<=xs[0]){lut[v]=ys[0];continue}if(v>=xs[n-1]){lut[v]=ys[n-1];continue}
    let k=0;while(k<n-2&&v>xs[k+1])k++;const hh=xs[k+1]-xs[k],t=(v-xs[k])/hh,t2=t*t,t3=t2*t;
    lut[v]=Math.round((2*t3-3*t2+1)*ys[k]+(t3-2*t2+t)*hh*m[k]+(-2*t3+3*t2)*ys[k+1]+(t3-t2)*hh*m[k+1]);
  }

}
/* curve editor widget: o={size, get()->points, set(points), commit(), hist()->{arr,n}|null, color} */
function curveEditor(o){
  const S=o.size||236,cv=el('canvas',{class:'curvecv',width:S,height:S,tabindex:'0','aria-label':(o.label||'Curve')+'. Drag points; click to add; Delete removes the selected point; arrow keys move it.',role:'img'});
  let sel=-1,drag=-1;const pad=6,span=S-pad*2;
  const toPx=p=>[pad+p[0]/255*span,pad+(1-p[1]/255)*span],toV=(x,y)=>[clamp(Math.round((x-pad)/span*255),0,255),clamp(Math.round((1-(y-pad)/span)*255),0,255)];
  function draw(){const x=cv.getContext('2d');const dk=isDark();x.fillStyle=dk?'#1b1d22':'#fbfbfc';x.fillRect(0,0,S,S);
    const H=o.hist&&o.hist();if(H&&H.n){let mx=1;for(let i=2;i<254;i++)mx=Math.max(mx,H.arr[i]);x.fillStyle=dk?'#3a3f4a':'#d9dde4';x.beginPath();x.moveTo(pad,pad+span);for(let i=0;i<256;i++)x.lineTo(pad+i/255*span,pad+span-Math.min(1,H.arr[i]/mx)*span*.9);x.lineTo(pad+span,pad+span);x.fill()}
    x.strokeStyle=dk?'#3b404b':'#d3d7de';x.lineWidth=1;for(let i=0;i<=4;i++){const q=pad+i*span/4+.5;x.beginPath();x.moveTo(q,pad);x.lineTo(q,pad+span);x.moveTo(pad,q);x.lineTo(pad+span,q);x.stroke()}
    x.strokeStyle=dk?'#555':'#bbb';x.setLineDash([3,3]);x.beginPath();x.moveTo(pad,pad+span);x.lineTo(pad+span,pad);x.stroke();x.setLineDash([]);
    const pts=o.get(),lut=curveLUT(pts);x.strokeStyle=o.color||(dk?'#e6e6e6':'#222');x.lineWidth=2;x.beginPath();for(let i=0;i<256;i++){const [px,py]=toPx([i,lut[i]]);i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();
    pts.forEach((p,i)=>{const [px,py]=toPx(p);x.fillStyle=i===sel?(o.color||'#2f7bff'):(dk?'#1b1d22':'#fff');x.strokeStyle=o.color||(dk?'#eee':'#222');x.lineWidth=1.5;x.beginPath();x.rect(px-4,py-4,8,8);x.fill();x.stroke()})}
  function near(x,y){const pts=o.get();let b=-1,bd=100;pts.forEach((p,i)=>{const [px,py]=toPx(p);const d=(px-x)**2+(py-y)**2;if(d<bd){bd=d;b=i}});return b}
  function place(i,v){const pts=o.get().map(p=>p.slice());const lo=i>0?pts[i-1][0]+1:0,hi=i<pts.length-1?pts[i+1][0]-1:255;pts[i]=[clamp(v[0],lo,hi),v[1]];o.set(pts);draw()}
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*S/r.width,y=(e.clientY-r.top)*S/r.height;let i=near(x,y);
    if(i<0){const v=toV(x,y);const pts=o.get().map(p=>p.slice());if(pts.length>=14)return;pts.push(v);pts.sort((a,b)=>a[0]-b[0]);if(pts.some((p,k)=>k&&p[0]===pts[k-1][0]))return;o.set(pts);i=pts.findIndex(p=>p[0]===v[0]&&p[1]===v[1])}
    sel=drag=i;draw();cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(drag<0)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*S/r.width,y=(e.clientY-r.top)*S/r.height;const pts=o.get();
    if(pts.length>2&&drag>0&&drag<pts.length-1&&(y<-20||y>S+20)){pts.splice(drag,1);o.set(pts.map(p=>p.slice()));drag=-1;sel=-1;draw();return}
    place(drag,toV(x,y))});
  const up=()=>{if(drag>=0||true){drag=-1;o.commit&&o.commit()}};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('dblclick',e=>{const r=cv.getBoundingClientRect();const i=near((e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height);const pts=o.get();if(i>0&&i<pts.length-1){pts.splice(i,1);o.set(pts.map(p=>p.slice()));sel=-1;draw();o.commit&&o.commit()}});
  cv.addEventListener('keydown',e=>{const pts=o.get();if(e.key==='+'||e.key==='='){sel=(sel+1)%pts.length;draw();e.preventDefault()}else if(e.key==='-'){sel=(sel-1+pts.length)%pts.length;draw();e.preventDefault()}
    else if(sel>=0&&/^Arrow/.test(e.key)){const st=e.shiftKey?10:1;const p=pts[sel].slice();if(e.key==='ArrowUp')p[1]=clamp(p[1]+st,0,255);if(e.key==='ArrowDown')p[1]=clamp(p[1]-st,0,255);if(e.key==='ArrowLeft')p[0]-=st;if(e.key==='ArrowRight')p[0]+=st;place(sel,p);o.commit&&o.commit();e.preventDefault();e.stopPropagation()}
    else if(sel>0&&sel<pts.length-1&&(e.key==='Delete'||e.key==='Backspace')){pts.splice(sel,1);o.set(pts.map(p=>p.slice()));sel=-1;draw();o.commit&&o.commit();e.preventDefault();e.stopPropagation()}});
  cv.redraw=draw;draw();return cv;

/* ---------- colour helpers ---------- */
function hexToRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return [n>>16&255,n>>8&255,n&255]}

function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h/=6}return [h,s,l]}

/* colour temperature (kelvin) -> linear RGB normalised to green */
function kelvinRGB(T){const t=T/100;let r,g,b;r=t<=66?255:329.698727446*Math.pow(t-60,-0.1332047592);g=t<=66?99.4708025861*Math.log(t)-161.1195681661:288.1221695283*Math.pow(t-60,-0.0755148492);b=t>=66?255:t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307;

/* ---------- healing: copy texture from the best nearby area and match colour at the edges ---------- */
/* S: RGBA data of the source (w x h). box {x,y,w,h}. mask Float32Array(box.w*box.h) 0..1. opt.off [dx,dy] to force a source.

function healRegion(S,w,h,box,mask,opt){
  opt=opt||{};const bw=box.w,bh=box.h;

    for(let dy=-3;dy<=3&&!nearIn;dy++)for(let dx=-3;dx<=3;dx++){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=bw||yy>=bh)continue;if(inside[yy*bw+xx]){nearIn=true;if(Math.abs(dx)<=1&&Math.abs(dy)<=1)adj=true;break}}
    if(nearIn)ring.push(i);if(adj)edge.push(i)}

    for(const f of [1.05,1.35,1.8,2.4])for(let a=0;a<20;a++){const ang=a/20*Math.PI*2+f;const dx=Math.round(Math.cos(ang)*R*f),dy=Math.round(Math.sin(ang)*R*f);

      let inner=0,ic=0;for(let k=0;k<bw*bh;k+=7){if(!inside[k])continue;const x=box.x+k%bw+dx,y=box.y+(k/bw|0)+dy;const q=at(x,y);inner+=(S[q]+S[q+1]+S[q+2]);ic++}
      s=s/Math.max(1,cnt)*(1+0.02*f);if(s<best){best=s;off=[dx,dy]}}
    if(!off)off=[bw,0]}

  /* boundary differences, sampled */
  const B=[];const stepE=Math.max(1,Math.floor(edge.length/48));
  for(let k=0;k<edge.length;k+=stepE){const i=edge[k],x=i%bw,y=i/bw|0;const p=at(box.x+x,box.y+y),q=at(sx(box.x+x+dx),sy(box.y+y+dy));B.push([x,y,S[p]-S[q],S[p+1]-S[q+1],S[p+2]-S[q+2]])}

  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){const i=y*bw+x,o=i*4;const m=mask[i];if(m<=0){out[o+3]=0;continue}

    if(ws>0){cr/=ws;cg/=ws;cb/=ws}
    const q=at(sx(box.x+x+dx),sy(box.y+y+dy));out[o]=S[q]+cr;out[o+1]=S[q+1]+cg;out[o+2]=S[q+2]+cb;out[o+3]=Math.round(m*255)}
  return {off,data:out};
}

/* ---------- layer commands ---------- */
function newLayer(name){if(!D)return;const L=newPx(name||('Layer '+(D.layers.filter(l=>l.kind==='px').length)),D.w,D.h);const i=D.act?LIDX(D.act)+1:D.layers.length;D.layers.splice(i,0,L);D.act=L.id;commit('New Layer',null,'＋')}
function dupLayer(){const L=AL();if(!L)return;let N;
  if(D.sel&&L.kind==='px'){const c=mkCanvas(D.w,D.h),x=g2d(c);x.drawImage(L.cv,L.x,L.y);x.globalCompositeOperation='destination-in';x.drawImage(D.sel,0,0);N=newPx('Layer '+(D.layers.length),D.w,D.h,{cv:c});commit0(N,'Layer Via Copy');return}
  N=Object.assign({},L,{id:nid(),name:L.name+(L.bg?' copy':' copy'),bg:false,text:cp(L.text),adj:cp(L.adj),fx:cp(L.fx)});if(L.kind==='px'){N.cv=cloneCanvas(L.cv)}if(L.mask)N.mask=cloneCanvas(L.mask);if(L.bg)N.name='Background copy';commit0(N,'Duplicate Layer')}
function commit0(N,label){const i=LIDX(D.act)+1;D.layers.splice(i,0,N);D.act=N.id;commit(label,null,'⧉')}
function deleteLayer(){const L=AL();if(!L)return;if(D.layers.length<=1){toast('A document needs at least one layer.');return}const i=LIDX(L.id);D.layers.splice(i,1);D.act=(D.layers[Math.max(0,i-1)]||D.layers[0]).id;commit('Delete Layer',null,'🗑')}
function renameLayer(L){inputBox('Rename layer','Layer name',L.name,v=>{L.name=v.slice(0,40);commit('Rename Layer',null,'✎')})}
function arrange(steps){const L=AL();if(!L)return;const i=LIDX(L.id);let j=clamp(i+steps,0,D.layers.length-1);if(D.layers[0].bg&&j===0&&!L.bg)j=1;if(L.bg){toast('The Background layer stays at the bottom. Unlock it first.');return}if(j===i)return;D.layers.splice(i,1);D.layers.splice(j,0,L);commit('Arrange Layer',null,'⇅')}
function addMask(mode){const L=AL();if(!L)return;if(L.kind==='px'&&L.bg)ensureNotBg(L,'so it can have a mask');if(L.mask){toast('This layer already has a mask — click its thumbnail to paint on it.');return}
  mode=mode||(D.sel?'revealSel':'revealAll');if((mode==='revealSel'||mode==='hideSel')&&!D.sel){toast('Make a selection first.');return}
  L.mask=mode==='revealAll'?newMask(L,true):mode==='hideAll'?newMask(L,false):selAsLayerMask(L,mode==='hideSel');L.maskOn=true;L.editMask=true;if(mode!=='revealAll'&&mode!=='hideAll'){D.sel=null;antsDirty=true}
  commit('Add Layer Mask',null,'◑');toast('Layer mask added — black hides, white reveals.')}
function invertMask(){const L=AL();if(!L||!L.mask)return;const m=newMask(L,true),x=g2d(m);x.globalCompositeOperation='destination-out';x.drawImage(L.mask,0,0);L.mask=m;commit('Invert Mask',null,'◑')}
function deleteMask(apply){const L=AL();if(!L||!L.mask)return;if(apply&&L.kind==='px'){const n=cloneCanvas(L.cv),x=g2d(n);x.globalCompositeOperation='destination-in';x.drawImage(L.mask,0,0);L.cv=n}L.mask=null;L.editMask=false;commit(apply?'Apply Layer Mask':'Delete Layer Mask',null,'◑')}
function rasterize(){const L=AL();if(!L||L.kind!=='text')return;const c=cloneCanvas(textRaster(L));Object.assign(L,{kind:'px',cv:c,x:0,y:0,text:null});commit('Rasterize Type',null,'▦')}
function mergeDown(){const L=AL();const i=LIDX(L&&L.id);if(!L||i<=0){toast('There is no layer below to merge into.');return}const B=D.layers[i-1];if(B.kind!=='px'){toast('Merge Down needs a pixel layer underneath.');return}
  const n=mkCanvas(D.w,D.h),x=g2d(n);x.drawImage(B.mask&&B.maskOn?layerContent(B).c:B.cv,B.x,B.y);
  if(L.kind==='adj'){const id=x.getImageData(0,0,D.w,D.h);const o=new Uint8ClampedArray(id.data);applyAdjData(id.data,L.adj);if(L.mask||L.op<1){const m=L.mask&&L.maskOn?getID((()=>{const t=mkCanvas(D.w,D.h);g2d(t).drawImage(L.mask,0,0);return t})()).data:null;for(let k=0;k<id.data.length;k+=4){const a=(m?m[k+3]/255:1)*L.op;for(let c=0;c<3;c++)id.data[k+c]=o[k+c]+(id.data[k+c]-o[k+c])*a}}x.putImageData(id,0,0)}
  else{const r=layerContent(L);drawFX(x,L,r,'under');x.globalAlpha=L.op;x.globalCompositeOperation=L.blend==='normal'?'source-over':L.blend;x.drawImage(r.c,r.x,r.y)}
  if(B.pm)B.pm=mMul(B.pm,mTr(-B.x,-B.y));B.cv=n;B.x=0;B.y=0;B.mask=null;D.layers.splice(i,1);D.act=B.id;commit('Merge Down',null,'⤓')}
function flatten(visibleOnly){const c=flattenCanvas();if(!visibleOnly){const bg=mkCanvas(D.w,D.h),x=g2d(bg);x.fillStyle=BG==='#ffffff'?'#ffffff':'#ffffff';x.fillRect(0,0,D.w,D.h);x.drawImage(c,0,0);const L=newPxLayer0('Background',bg,true);D.layers=[L];D.act=L.id;commit('Flatten Image',null,'▤')}
  else{const L=newPx('Merged',D.w,D.h,{cv:c});D.layers.push(L);D.act=L.id;commit('Merge Visible (stamp)',null,'▤')}}
function selInverse(){if(!D.sel){toast('There is no selection to invert. Make one first.');return}setSel(invertSel(D.sel),'Select Inverse')}
function clearSelection(){const L=AL();if(!D.sel||!L){toast('Make a selection first, then press Delete to clear it.');return}if(L.kind!=='px'){toast('Pick a pixel layer to clear.');return}
  const n=cloneCanvas(L.cv),x=g2d(n);if(L.bg){x.save();const t=mkCanvas(n.width,n.height),tx=g2d(t);tx.fillStyle=BG;tx.fillRect(0,0,t.width,t.height);tx.globalCompositeOperation='destination-in';tx.drawImage(D.sel,-L.x,-L.y);x.drawImage(t,0,0);x.restore()}else{x.globalCompositeOperation='destination-out';x.drawImage(D.sel,-L.x,-L.y)}L.cv=n;commit('Clear',null,'⌫')}
function nudge(dx,dy){const L=AL();if(!L||L.kind==='adj')return;if(L.kind==='px'&&L.bg){toast('The Background layer is locked.');return}if(L.kind==='px'){L.x+=dx;L.y+=dy}else{L.text.x+=dx;L.text.y+=dy}commit('Nudge',null,'✥')}

function psKey(e){if(!D||$('#app').hidden||dlgStack.length||openMenus.length||$('#tour:not([hidden])'))return;if(isTyping(e)&&!(e.target===$('#psOver')))return;
  const k=e.key,ctrl=e.ctrlKey||e.metaKey,sh=e.shiftKey,alt=e.altKey,K=k.length===1?k.toUpperCase():k;
  const go=fn=>{e.preventDefault();fn()};
  if(ctrl){
    if(K==='Z')return go(()=>sh?redo():(alt?undo():undo()));if(K==='Y')return go(redo);
    if(alt&&!sh&&(K==='S'||e.code==='KeyS'))return go(saveCopyDlg);if(K==='S')return go(()=>sh?saveAsDlg():saveDoc());if(K==='O')return go(()=>openDlg('open'));if(K==='N'&&sh&&!alt)return go(()=>newLayer());if(K==='N')return go(newDocDlg);
    if(K==='J')return go(dupLayer);if(K==='E'&&sh)return go(()=>flatten(true));if(K==='E')return go(mergeDown);if(K==='T')return go(startTransform);
    if(K==='A')return go(()=>{const c=selNew(),x=g2d(c);x.fillRect(0,0,D.w,D.h);setSel(c,'Select All')});if(K==='D')return go(()=>setSel(null,'Deselect'));if(K==='I'&&sh)return go(selInverse);if(K==='I'&&alt)return go(imageSizeDlg);if(K==='I')return go(()=>adjDlg('invert'));
    if(K==='C'&&alt)return go(canvasSizeDlg);if(K==='L'&&sh)return go(()=>autoTone(false));if(K==='B'&&sh)return go(()=>autoTone(true));if(K==='L')return go(()=>adjDlg('levels'));if(K==='M')return go(()=>adjDlg('curves'));if(K==='U')return go(()=>adjDlg('huesat'));if(K==='B')return go(()=>adjDlg('colorbal'));
    if(K==='W'&&sh&&alt)return go(exportDlg);if(K==='0')return go(fitView);if(K==='1')return go(()=>zoomTo(1));if(k==='='||k==='+')return go(()=>zoomStep(1));if(k==='-')return go(()=>zoomStep(-1));
    if(k===']')return go(()=>arrange(1));if(k==='[')return go(()=>arrange(-1));
    if(K==='C'){if(D.sel)return go(copySel);}if(K==='V')return go(pasteSel);if(K==='X'&&D.sel)return go(()=>{copySel();clearSelection()});
    return}
  if(k==='F5'&&sh)return go(fillDlg);if(k==='F6'&&sh)return go(featherDlg);if(k==='F7')return go(()=>togglePanels());
  if(k==='Enter'){if(TF)return go(commitTransform);if(CROP&&TOOL==='crop')return go(commitCrop)}
  if(k==='Escape'){if(TF)return go(cancelTransform);if(CROP&&TOOL==='crop')return go(()=>{cancelCrop(true);startCrop()});if(PICK){PICK=null;return go(()=>toast('Cancelled.'))}}
  if((k==='Delete'||k==='Backspace')&&!alt)return go(clearSelection);
  if(k==='Backspace'&&alt)return go(()=>quickFill(FG));
  if(k===' '){if(!SPACE){SPACE=true;$('#psOver').style.cursor='grab'}e.preventDefault();return}
  if(/^Arrow/.test(k)&&TOOL==='move'){const st=sh?10:1;return go(()=>nudge(k==='ArrowLeft'?-st:k==='ArrowRight'?st:0,k==='ArrowUp'?-st:k==='ArrowDown'?st:0))}
  if(k==='['||k===']'){return go(()=>{if(sh)OPT.hard=clamp(OPT.hard+(k===']'?25:-25),0,100);else OPT.size=clamp(Math.round(OPT.size*(k===']'?1.25:0.8)+(k===']'?1:-1)),1,600);renderOpts();requestDraw(false)})}
  if(K==='D')return go(defColours);if(K==='X')return go(swapColours);
  const t=TOOLS.filter(x=>x.k===K);if(t.length&&!alt){return go(()=>{if(t.length>1&&sh){const i=t.findIndex(x=>x.id===TOOL);setTool(t[(i+1)%t.length].id)}else setTool(t.some(x=>x.id===TOOL)?TOOL:t[0].id)})}}
addEventListener('keyup',e=>{if(e.key===' '&&SPACE){SPACE=false;const o=$('#psOver');if(o)o.style.cursor=''}});

/* Layered .psd: one PSD layer per Photoshop Lab layer (name, position, opacity, visibility; masks and layer styles baked in).
   A .psd written here cannot hold live adjustment layers or blend modes, so each one is saved as a merged "applied" layer above
   (hidden if the adjustment layer was hidden). Each layer is cropped to its pixels, as Photoshop stores it. */
function psTrim(c,x,y){const w=c.width,h=c.height;let d;try{d=g2d(c).getImageData(0,0,w,h).data}catch(e){return {c,x,y}}
  let x0=w,y0=h,x1=-1,y1=-1;for(let j=0;j<h;j++){const r=j*w*4;for(let i=0;i<w;i++)if(d[r+i*4+3]){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}}
  if(x1<0)return {c:mkCanvas(1,1),x:0,y:0};if(!x0&&!y0&&x1===w-1&&y1===h-1)return {c,x,y};
  const t=mkCanvas(x1-x0+1,y1-y0+1);g2d(t).drawImage(c,-x0,-y0);return {c:t,x:x+x0,y:y+y0}}
function psdBlob(){if(compDirty)renderComp();const out=[],all=D.layers;
  const stamp=i=>{D.layers=all.slice(0,i+1);try{renderComp()}finally{D.layers=all}return cloneCanvas(COMP)};
  const add=(name,c,x,y,o)=>{const t=psTrim(c,Math.round(x),Math.round(y));out.push(Object.assign({name,canvas:t.c,left:t.x,top:t.y},o||{}))};
  try{for(let i=0;i<all.length;i++){const L=all[i];
    if(L.kind==='adj'){const v=L.vis;let s;L.vis=true;try{s=stamp(i)}finally{L.vis=v}add(L.name+' (adjustment applied)',s,0,0,{hidden:!v});continue}
    const r=layerContent(L);if(!r)continue;let c=r.c,x=r.x,y=r.y;
    if(L.fx){const t=mkCanvas(D.w,D.h),tx=g2d(t);drawFX(tx,Object.assign({},L,{op:1}),r,'under');tx.drawImage(r.c,r.x,r.y);c=t;x=0;y=0}
    add(L.name,c,x,y,{opacity:L.op,hidden:!L.vis});
    if(L.vis&&L.blend&&L.blend!=='normal')add(L.name+' ('+L.blend+' blend applied)',stamp(i),0,0)}}
  finally{D.layers=all;compDirty=true;renderComp()}
  if(!out.length)out.push({name:'Background',canvas:flattenCanvas()});
  return SimSave.psd(out,D.w,D.h)}

/* ===================== Photoshop Lab · missions, reference, app glue ===================== */
/* ---------- check helpers ---------- */
const CK={
  bg:()=>D.layers.find(l=>l.bg)||null,
  px:()=>D.layers.filter(l=>l.kind==='px'),
  adj:t=>D.layers.filter(l=>l.kind==='adj'&&l.vis&&(!t||(Array.isArray(t)?t.includes(l.adj.t):l.adj.t===t))),
  texts:()=>D.layers.filter(l=>l.kind==='text'&&l.vis),
  textHas:re=>D.layers.find(l=>l.kind==='text'&&l.vis&&re.test(norm(l.text.s))),
  d:(px,py)=>photoToDoc(px,py),
  inDoc:(x,y,m)=>x>=(m||0)&&y>=(m||0)&&x<D.w-(m||0)&&y<D.h-(m||0),
  at:(px,py,r)=>{const [x,y]=photoToDoc(px,py);return avgAt(Math.round(x),Math.round(y),Math.max(1,Math.round(r/docScale())))},
  ring:(px,py,r)=>{const s=[0,0,0];const n=12;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const v=CK.at(px+Math.cos(a)*r,py+Math.sin(a)*r,Math.max(2,r*0.15));s[0]+=v[0];s[1]+=v[1];s[2]+=v[2]}return s.map(v=>v/n)},
  L:c=>lum(c[0],c[1],c[2]),chroma:c=>Math.max(...c)-Math.min(...c),
  stats:()=>{const H=histOf(compData(),3);return {mean:histMean(H.l,H.n),lo:histPct(H.l,H.n,.01),hi:histPct(H.l,H.n,.99),H}},
  std:()=>{const d=compData().data;let s=0,s2=0,n=0;for(let i=0;i<d.length;i+=4*7){const l=lum(d[i],d[i+1],d[i+2]);s+=l;s2+=l*l;n++}const m=s/n;return Math.sqrt(Math.max(0,s2/n-m*m))},
  exp:pred=>EXPORTS.filter(e=>M&&e.at>=M.start).find(pred),
  saved:()=>SAVES.some(s=>M&&s.at>=M.start),
  sum:c=>{const d=getID(c).data;let s=0;for(let i=0;i<d.length;i+=37)s=(s+d[i]*(i%251+1))%1e9;return s},
  bgSame:()=>{const b=CK.bg();return !!b&&M.bgSum!=null&&b.cv.width===M.bgW&&CK.sum(b.cv)===M.bgSum},
  effAlpha:(L,x,y)=>{const r=layerContent(L);if(!r)return 0;const lx=Math.round(x-r.x),ly=Math.round(y-r.y);if(lx<0||ly<0||lx>=r.c.width||ly>=r.c.height)return 0;return g2d(r.c).getImageData(lx,ly,1,1).data[3]/255},
  inside:L=>{if(!L)return false;const b=textBounds(L.text);return b.x>=-2&&b.y>=-2&&b.x+b.w<=D.w+2&&b.y+b.h<=D.h+2},
  hist:re=>HIST.list.slice(1,HIST.i+1).some(h=>re.test(h.label)),
  spots:()=>{const S=PHOTOS.shells.spots;let ok=0;for(const [x,y,r] of S){const [dx,dy]=photoToDoc(x,y);if(!CK.inDoc(dx,dy)){ok++;continue}const c=CK.L(CK.at(x,y,r*0.45)),g=CK.L(CK.ring(x,y,r*2.6));if(c/g>0.94)ok++}return ok},
  cap:()=>{const [x,y,r]=PHOTOS.shells.cap;const c=CK.at(x,y,r*0.6),g=CK.ring(x,y,r*1.8);return Math.abs(CK.L(c)-CK.L(g))<14&&(c[0]-(c[1]+c[2])/2)<(g[0]-(g[1]+g[2])/2)+14},

function startDoc(key,name){const d=docFromPhoto(key,name||fileNameFor(key));loadDoc(d);const b=CK.bg();M.bgSum=CK.sum(b.cv);M.bgW=b.cv.width;const s=CK.stats();M.mean0=s.mean;M.std0=CK.std();setTool('move')}
const H=(...h)=>h;
/* ---------- missions ---------- */
const PSM=[
 {id:'ps1',level:1,title:'Protect the original',unit:'Unit 2 · Module 2 · Unit 5 — protect the original; non-destructive editing',
  brief:'Island Pulse Media, a regional agency, is retouching a beach photo for a visitor kiosk on Front Street in <b>Philipsburg, Sint Maarten</b>. Professionals never edit the original: <b>duplicate it, work on the copy, and keep a layered master</b>.',
  start(){startDoc('shells')},

   {t:'Duplicate the <b>Background</b> layer (Layer ▸ Duplicate Layer or <kbd>Ctrl</kbd>+<kbd>J</kbd>).',c:()=>D.layers.some(l=>l.kind==='px'&&!l.bg&&l.cv.width===D.w)||'No copy of the photo yet.',h:H('Look in the Layers panel: you need two photo layers.','Press Ctrl+J, or click Layer ▸ Duplicate Layer.'),show:['[data-menu="Layer"]','#lyList']},
   {t:'Rename the copy <b>Retouch</b> (double-click its name).',c:()=>D.layers.some(l=>l.kind==='px'&&!l.bg&&/^retouch$/i.test(norm(l.name)))||'Name the copy exactly “Retouch”.',h:H('Double-click the layer name in the Layers panel.','Or use Layer ▸ Rename Layer… and type Retouch.'),show:['#lyList .lyr.sel .lname','[data-menu="Layer"]']},
   {t:'Hide the original <b>Background</b> layer (click its 👁 eye).',c:()=>{const b=CK.bg();return (b&&!b.vis)||'The Background is still visible.'},h:H('Each layer row starts with an eye icon.','Click the eye on the Background row so it turns off.'),show:['#lyList .lyr:last-child .eye']},
   {t:'Save the layered master in this browser (File ▸ Save, <kbd>Ctrl</kbd>+<kbd>S</kbd>).',c:()=>CK.saved()||'Not saved yet.',h:H('A layered master keeps every layer so you can edit later.','Press Ctrl+S and give it a name such as beach-shells_v1.'),show:['[data-menu="File"]']}]},
 {id:'ps2',level:1,title:'Dust off the beach',unit:'Unit 1 · Module 3 · Unit 7 — retouch dust spots with the healing brush',
  brief:'Sensor dust left soft dark specks on the sand around the shells. A beach bar on <b>Grace Bay, Providenciales</b> in the Turks and Caicos wants a clean menu photo. Use the <b>Spot Healing Brush</b> (<kbd>J</kbd>): paint over each speck and let go.',
  start(){startDoc('shells');OPT.size=48;OPT.healAll=true},
  steps:[
   {t:'Choose the <b>Spot Healing Brush</b> (J) and set its size a little bigger than a speck (about 40–60 px).',c:()=>TOOL==='heal'&&OPT.size>=20||'Pick the Spot Healing Brush.',h:H('It looks like a sticking plaster in the toolbar.','Press J, then type a size in the options bar.'),show:['[data-tool="heal"]']},
   {t:'Remove at least <b>3</b> of the 6 dark specks.',c:()=>{const n=CK.spots();return n>=3||`${n} of 6 specks removed so far.`},h:H('Zoom in (Ctrl +) to see the soft dark dots in the sand.','Click or brush over a speck. Use [ and ] to change the brush size.'),show:['[data-tool="heal"]','#psOver']},
   {t:'Remove <b>all 6</b> specks.',c:()=>{const n=CK.spots();return n>=6||`${n} of 6 specks removed.`},h:H('Check the top half of the picture: some specks are small.','Use the Hand tool (H) or the scroll wheel to move around.'),show:['#psOver']},
   {t:'Check the <b>History</b> panel: you can step back if a fix looks wrong.',c:()=>CK.hist(/Spot Healing/)||'Use the healing brush first.',h:H('Every brush stroke is a history state.'),show:['#psHistory']}]},
 {id:'ps3',level:1,title:'Lift a dark sunset with Levels',unit:'Unit 1 · Module 3 · Unit 7 — exposure, levels and the histogram',
  brief:'The Grand Anse sunset for a beachfront café website in Grenada came out too dark: the <b>histogram</b> is squashed to the left. Add a <b>Levels adjustment layer</b> (non-destructive) and drag the white point to where the data ends.',
  start(){startDoc('sunset')},
  steps:[
   {t:'Add a <b>Levels</b> adjustment layer (Layers panel ◐ button, or Layer ▸ New Adjustment Layer ▸ Levels).',c:()=>CK.adj('levels').length>0||'No Levels adjustment layer yet.',h:H('Adjustment layers sit above the photo and can be changed later.','Click the half-filled circle at the bottom of the Layers panel and choose Levels.'),show:['[data-fb="adj"]','[data-menu="Layer"]']},
   {t:'In Properties, move the <b>White input</b> down to where the histogram ends (about 150–200).',c:()=>{const L=CK.adj('levels')[0];return (L&&L.adj.rgb.w<=215&&L.adj.rgb.w>=110)||'Set White input between 110 and 215.'},h:H('The histogram shows almost nothing on the right — the photo has no bright tones.','Drag “White input” left until it meets the end of the histogram mountain.'),show:['#psProps']},
   {t:'Make the picture brighter overall: mean brightness above <b>95</b> (see the Histogram panel).',c:()=>{const s=CK.stats();return s.mean>95||`Mean is ${s.mean.toFixed(0)}.`},h:H('Raise the Midtones (gamma) slider to about 1.2–1.5 if it is still dark.'),show:['#psProps','#psHist']},
   {t:'Keep it non-destructive: the Background pixels must be unchanged.',c:()=>CK.bgSame()||'The Background was edited directly. Undo and use an adjustment layer.',h:H('Image ▸ Adjustments changes pixels for ever; adjustment layers do not.'),show:['#lyList']}]},
 {id:'ps4',level:1,title:'Square for the feed',unit:'Unit 1 · Module 3 · Unit 8 — export sizes for platforms; Unit 1 · Module 3 · Unit 4 — framing',
  brief:'The <b>Castries Saturday Market</b> page in Saint Lucia needs a square Instagram post: <b>1080 × 1080 px</b>. Crop with a fixed size so the stalls stay in the frame.',
  start(){startDoc('market')},
  steps:[
   {t:'Choose the <b>Crop</b> tool (C).',c:()=>TOOL==='crop'||CK.done4()||'Pick the Crop tool.',h:H('It looks like two overlapping L shapes.'),show:['[data-tool="crop"]']},
   {t:'In the options bar choose <b>W x H x Resolution</b> and type <b>1080</b> × <b>1080</b> (or pick 1 : 1).',c:()=>CK.done4()||(OPT.ratio==='1:1'||(OPT.ratio==='wh'&&+OPT.rw===1080&&+OPT.rh===1080))||'Set the crop to 1080 × 1080.',h:H('The ratio menu is at the left of the options bar.','Pick “W x H x Resolution”, then type 1080 in both boxes.'),show:['#cropRatio']},
   {t:'Keep the fruit stalls inside the box and press <b>Enter</b> (or ✓) to crop.',c:()=>{if(D.w!==1080||D.h!==1080)return `The picture is ${D.w} × ${D.h} px. It must be 1080 × 1080.`;const [x0,y0]=mApply(D.map,0,0),[x1,y1]=mApply(D.map,D.w,D.h);return (y0<=560&&y1>=830&&x1-x0>=700)||'Some stalls were cut off — keep the whole stall row.'},h:H('Drag inside the box to move it, then press Enter.','If you typed 1080 × 1080 the result is resized automatically.'),show:['#cropOK']},
   {t:'Export it as a JPG (File ▸ Export ▸ Export As).',c:()=>!!CK.exp(e=>e.fmt==='jpg'&&e.w===1080&&e.h===1080)||'No 1080 × 1080 JPG exported yet.',h:H('File ▸ Export ▸ Export As…, Format JPG, quality about 80.'),show:['[data-menu="File"]']}]},
 {id:'ps5',level:1,title:'Words on a photo',unit:'Unit 2 · Module 2 · Unit 5 — adding text to images',
  brief:'Add the title <b>“Castries Saturday Market”</b> to the market photo on its own <b>type layer</b>, big enough to read on a phone, with a soft <b>drop shadow</b> so it stands out.',
  start(){startDoc('market')},
  steps:[
   {t:'Use the <b>Type</b> tool (T): click the photo and type <b>Castries Saturday Market</b>.',c:()=>!!CK.textHas(/castries saturday market/i)||'No type layer with that title yet.',h:H('Press T, click near the top of the photo and type.','Press Ctrl+Enter or click ✓ Commit when you finish.'),show:['[data-tool="text"]']},
   {t:'Make the text at least <b>80 px</b> tall and keep it inside the picture.',c:()=>{const L=CK.textHas(/saturday market/i);if(!L)return 'Add the title first.';const b=textBounds(L.text);return (L.text.size>=80&&b.x>=-2&&b.y>=-2&&b.x+b.w<=D.w+2&&b.y+b.h<=D.h+2)||'Bigger (80 px or more) and fully inside the frame. Use the Move tool to reposition.'},h:H('With the type layer selected, change Size in the options bar.','Use the Move tool (V) to drag it so nothing is cut off.'),show:['#txSize','[data-tool="move"]']},
   {t:'Add a <b>Drop Shadow</b> (fx button ▸ Drop Shadow).',c:()=>{const L=CK.textHas(/saturday market/i);return (L&&L.fx&&L.fx.shadow&&L.fx.shadow.on)||'No drop shadow on the title yet.'},h:H('The fx button is at the bottom of the Layers panel.','Or Layer ▸ Layer Style ▸ Drop Shadow…'),show:['[data-fb="fx"]']},
   {t:'Export the finished post as a JPG.',c:()=>!!CK.exp(e=>e.fmt==='jpg')||'Not exported yet.',h:H('File ▸ Export ▸ Export As…'),show:['[data-menu="File"]']}]},
 {id:'ps6',level:2,title:'Screen it brighter',unit:'Unit 1 · Module 3 · Unit 5 — layers and blend modes',
  brief:'The market photo is flat and a little dark. A classic trick: duplicate the layer and set the copy to <b>Screen</b> (lightens). Then add a contrast boost with <b>Soft Light</b> or <b>Overlay</b>. Multiply would darken instead.',
  start(){startDoc('market')},
  steps:[
   {t:'Duplicate the photo layer (<kbd>Ctrl</kbd>+<kbd>J</kbd>).',c:()=>CK.px().filter(l=>!l.bg).length>=1||'Duplicate the Background.',h:H('Ctrl+J copies the selected layer.'),show:['[data-menu="Layer"]']},
   {t:'Set the copy’s blend mode to <b>Screen</b> and its opacity between <b>30%</b> and <b>80%</b>.',c:()=>D.layers.some(l=>l.kind==='px'&&l.vis&&l.blend==='screen'&&l.op>=0.3&&l.op<=0.8)||'Need a visible copy in Screen at 30–80% opacity.',h:H('The blend-mode list is at the top of the Layers panel (it says Normal).','Pick Screen, then type an opacity such as 50.'),show:['#lyBlend','#lyOp']},
   {t:'Add another copy set to <b>Soft Light</b> or <b>Overlay</b> for contrast.',c:()=>D.layers.some(l=>l.kind==='px'&&l.vis&&(l.blend==='soft-light'||l.blend==='overlay'))||'No Soft Light or Overlay layer yet.',h:H('Select the Background, press Ctrl+J again and change the new copy’s blend mode.'),show:['#lyBlend']},
   {t:'Result: brighter than the original by at least 10 levels of mean brightness.',c:()=>{const s=CK.stats();return s.mean>=M.mean0+10||`Mean ${s.mean.toFixed(0)} (started at ${M.mean0.toFixed(0)}).`},h:H('Raise the Screen layer’s opacity.'),show:['#lyOp','#psHist']}]},
 {id:'ps7',level:2,title:'Cool the tungsten cast',unit:'Unit 2 · Module 2 · Unit 5 — colour correction; Unit 1 · Module 3 · Unit 4 — white balance',
  brief:'<b>Chez Corail</b> in <b>English Harbour, Antigua</b> shot its dinner plate under warm bulbs: everything is orange. The napkin and plate should look <b>neutral white</b>. Use a <b>Curves</b> or <b>Levels</b> adjustment layer and its 🎯 <b>Set gray point</b> button on the napkin (Photo Filter: Cooling and Color Balance work too).',
  start(){startDoc('indoor')},
  steps:[
   {t:'Add a colour-correcting <b>adjustment layer</b> (Curves, Levels, Color Balance or Photo Filter).',c:()=>CK.adj(['curves','levels','colorbal','photofilter']).length>0||'No suitable adjustment layer yet.',h:H('Layers panel ◐ button ▸ Curves is the professional choice.'),show:['[data-fb="adj"]']},
   {t:'Make the napkin neutral: its red and blue should be within about <b>20</b> levels.',c:()=>{const N=PHOTOS.indoor.neutral;const c=N.map(([x0,y0,x1,y1])=>CK.at((x0+x1)/2,(y0+y1)/2,14)).reduce((a,b)=>a.map((v,i)=>v+b[i]/N.length),[0,0,0]);const ch=Math.abs(c[0]-c[2]);return ch<=20||`Napkin is R ${c[0].toFixed(0)} G ${c[1].toFixed(0)} B ${c[2].toFixed(0)} — still too ${c[0]>c[2]?'orange':'blue'}.`},h:H('In Curves or Levels, click 🎯 Set gray point, then click the folded napkin at the lower left.','Or lower Red and raise Blue with Color Balance (midtones).'),show:['#grayPick','#psProps']},
   {t:'Keep it bright: the napkin should stay light (brightness above <b>150</b>).',c:()=>{const N=PHOTOS.indoor.neutral[0];const c=CK.at((N[0]+N[2])/2,(N[1]+N[3])/2,14);return CK.L(c)>150||`Napkin brightness is ${CK.L(c).toFixed(0)}.`},h:H('If it went grey, raise the curve or the Levels midtones.'),show:['#psProps']},
   {t:'Non-destructive: the Background pixels are unchanged.',c:()=>CK.bgSame()||'The Background was changed directly — undo and use an adjustment layer.',h:H('Use Layer ▸ New Adjustment Layer, not Image ▸ Adjustments.'),show:['#lyList']}]},
 {id:'ps8',level:2,title:'Curves for contrast',unit:'Unit 1 · Module 3 · Unit 7 — curves and contrast',
  brief:'A <b>Bridgetown, Barbados</b> juice bar wants its fruit photo to look fresh and punchy for the menu board. Add a <b>Curves</b> adjustment layer with a gentle <b>S-curve</b>: darker shadows, brighter highlights.',
  start(){startDoc('fruit')},
  steps:[
   {t:'Add a <b>Curves</b> adjustment layer.',c:()=>CK.adj('curves').length>0||'No Curves layer yet.',h:H('Layers panel ◐ ▸ Curves… (or Layer ▸ New Adjustment Layer ▸ Curves).'),show:['[data-fb="adj"]']},
   {t:'Make an <b>S-curve</b> on RGB: pull a point near the shadows <b>down</b> and a point near the highlights <b>up</b>.',c:()=>{const L=CK.adj('curves')[0];if(!L)return 'Add Curves first.';const lut=curveLUT(L.adj.rgb);return (lut[64]<=58&&lut[192]>=198)||`At input 64 the curve gives ${lut[64]} (needs ≤ 58); at 192 it gives ${lut[192]} (needs ≥ 198).`},h:H('Click the curve at about ¼ of the way and drag down a little; click at ¾ and drag up.','Or pick the preset “Increase Contrast (S-curve)”.'),show:['#psProps']},
   {t:'Contrast has increased by at least <b>8%</b> (spread of tones).',c:()=>{const s=CK.std();return s>=M.std0*1.08||`Tone spread is ${(s/M.std0*100-100).toFixed(0)}% higher — aim for 8% or more.`},h:H('Make the S a bit stronger.'),show:['#psProps']},
   {t:'Do not clip: fewer than <b>3%</b> of pixels pure black or pure white.',c:()=>{const H2=histOf(compData(),3).l;const n=H2.reduce((a,b)=>a+b,0);const c=(H2[0]+H2[255])/n*100;return c<3||`${c.toFixed(1)}% of pixels are clipped.`},h:H('Your S-curve is too steep: soften it.'),show:['#psHist']}]},
 {id:'ps9',level:2,title:'Magic Wand cut-out',unit:'Unit 2 · Module 1 · Unit 5 — selections and layer masks',
  brief:'<b>Mama Gee’s</b> pepper sauce, a family business in <b>San Fernando, Trinidad</b>, needs a product picture with <b>no background</b> for its online shop. Select the plain backdrop with the <b>Magic Wand</b>, invert, and hide the backdrop with a <b>layer mask</b> (not the eraser). Export a <b>PNG</b> so the transparency is kept.',
  start(){startDoc('product');OPT.tol=32;OPT.contig=true},
  steps:[
   {t:'Use the <b>Magic Wand</b> (W) to select the grey backdrop (Shift+click to add more of it).',c:()=>{if(!D.sel&&!CK.m9())return 'No selection yet.';if(CK.m9())return true;const B=PHOTOS.product.backdrop;const n=B.filter(([x,y])=>{const [dx,dy]=photoToDoc(x,y);return CK.inDoc(dx,dy)&&g2d(D.sel).getImageData(dx|0,dy|0,1,1).data[3]>127}).length;return n>=4||`The selection covers ${n} of 6 test points on the backdrop.`},h:H('Click the backdrop near a corner. Tolerance 32 is a good start.','Hold Shift and click the lower part of the backdrop to add it.'),show:['[data-tool="wand"]']},
   {t:'Invert the selection so the <b>bottle</b> is selected (Select ▸ Inverse, <kbd>Shift</kbd>+<kbd>Ctrl</kbd>+<kbd>I</kbd>).',c:()=>{if(CK.m9())return true;if(!D.sel)return 'Select the backdrop first.';const [x,y]=photoToDoc(450,800);return g2d(D.sel).getImageData(x|0,y|0,1,1).data[3]>127||'The bottle is not selected yet.'},h:H('Select ▸ Inverse swaps what is selected.'),show:['[data-menu="Select"]']},
   {t:'Add a <b>layer mask</b> (mask button in the Layers panel) so the backdrop disappears.',c:()=>CK.m9()||'The backdrop is still visible (or the bottle is hidden).',h:H('With the bottle selected, click the mask button (rectangle with a circle).','White on the mask shows the bottle; black hides the backdrop.'),show:['[data-fb="mask"]']},
   {t:'Export a <b>PNG</b> with transparency.',c:()=>!!CK.exp(e=>e.fmt==='png'&&e.transp&&e.alpha>0.3)||'No transparent PNG exported yet.',h:H('File ▸ Export ▸ Quick Export as PNG, or Export As… ▸ PNG with Transparency ticked.','JPG cannot store transparency.'),show:['[data-menu="File"]']}]},
 {id:'ps10',level:2,title:'Web copy and print copy',unit:'Unit 1 · Module 3 · Unit 7 — pixels, resolution and PPI; Unit 1 · Module 3 · Unit 8 — export settings',
  brief:'A farmers’ cooperative in <b>St. Elizabeth, Jamaica</b> wants this photo as a <b>6 × 4 in print</b> for its calendar and as a <b>web image 1200 px wide under 300 KB</b>. Print needs 300 ppi; the web only cares about pixels.',
  start(){startDoc('fruit')},
  steps:[
   {t:'Image ▸ Image Size: set the resolution to <b>300 ppi</b> with <b>Resample OFF</b> so it prints at 6 × 4 in.',c:()=>(D.ppi===300&&D.w===1800&&D.h===1200)||`Now ${D.w} × ${D.h} px at ${D.ppi} ppi (${(D.w/D.ppi).toFixed(1)} × ${(D.h/D.ppi).toFixed(1)} in).`,h:H('Untick Resample first so the pixels do not change.','Then type 300 in Resolution: the print size becomes 6 × 4 in.'),show:['[data-menu="Image"]']},
   {t:'Export the <b>print</b> copy: JPG at full size (1800 × 1200) with quality <b>90 or more</b>.',c:()=>!!CK.exp(e=>e.fmt==='jpg'&&e.w===1800&&e.h===1200&&e.q>=90)||'No full-size high-quality JPG yet.',h:H('File ▸ Export ▸ Export As…, JPG, quality 90–100, size 1800 × 1200.'),show:['[data-menu="File"]']},
   {t:'Export the <b>web</b> copy: JPG <b>1200 px</b> wide and <b>under 300 KB</b>.',c:()=>!!CK.exp(e=>e.fmt==='jpg'&&e.w===1200&&e.bytes<300*1024)||'No 1200 px JPG under 300 KB yet.',h:H('In Export As, type 1200 in Width; the height follows.','Lower the quality (about 70–80) until the size readout is under 300 KB.'),show:['[data-menu="File"]']},
   {t:'Keep the master unchanged: the document is still <b>1800 × 1200 px</b>.',c:()=>(D.w===1800&&D.h===1200)||'The master was resized — exports should be made from a full-size master.',h:H('Use Export As to make smaller copies instead of resizing the master.'),show:['[data-menu="Image"]']}]},
 {id:'ps11',level:3,title:'Pepper sauce sunset poster',unit:'Unit 2 · Module 1 · Unit 5 — compositing step by step',time:900,
  brief:'Make a <b>composite</b> poster for Mama Gee’s stall at Carnival in Port of Spain: place the <b>pepper sauce</b> photo on the <b>sunset beach photo</b>, mask out its backdrop, scale it onto the beach, add a shadow and the headline <b>“Feel the Island Fire”</b>. Save the layered master, then export a JPG.',
  start(){startDoc('sunset','sauce-poster.jpg')},
  steps:[
   {t:'Place the pepper sauce photo as a new layer (File ▸ Place Embedded…).',c:()=>!!CK.placed()||'Place the pepper sauce photo first.',h:H('File ▸ Place Embedded… ▸ Pepper sauce studio shot.'),show:['[data-menu="File"]']},
   {t:'Hide its grey backdrop with a <b>layer mask</b> (the bottle stays visible).',c:()=>CK.m11mask()},
   {t:'Scale it down (Free Transform) so the bottle stands on the sand in the lower part of the poster.',c:()=>CK.m11place()},
   {t:'Give the bottle a <b>Drop Shadow</b>.',c:()=>{const L=CK.placed();return (L&&L.fx&&L.fx.shadow&&L.fx.shadow.on)||'No drop shadow on the bottle layer.'}},
   {t:'Add the headline <b>Feel the Island Fire</b> on a type layer, fully inside the poster.',c:()=>{const L=CK.textHas(/feel the island fire/i);return L?(CK.inside(L)||'Part of the headline is outside the poster — make it smaller or move it.'):'No headline yet.'}},
   {t:'Save the layered master and export a JPG at least 1200 px wide.',c:()=>(CK.saved()&&!!CK.exp(e=>e.fmt==='jpg'&&e.w>=1200))||(CK.saved()?'Export the JPG.':'Save first (Ctrl+S).')}].map(s=>Object.assign(s,{h:s.h||H('Follow the compositing order: place, mask, scale, shadow, text, save, export.','Use the Magic Wand on the backdrop, Select ▸ Inverse, then the mask button.'),show:s.show||['[data-menu="File"]']}))},
 {id:'ps12',level:3,title:'Taste of English Harbour',unit:'Unit 2 · Module 2 · Unit 5 — practical task 1: crop, correct, text, export',time:900,
  brief:'Practical task: Zara at <b>Island Pulse Media</b> needs Chez Corail’s dinner photo as an <b>Instagram portrait post</b>: crop to <b>1080 × 1350</b>, remove the orange cast, brighten, add <b>“Taste of English Harbour”</b>, and export a JPG <b>under 400 KB</b>.',
  start(){startDoc('indoor','taste-english-harbour.jpg')},
  steps:[
   {t:'Crop to exactly <b>1080 × 1350 px</b> (4 : 5) with the plate in the frame.',c:()=>{if(D.w!==1080||D.h!==1350)return `Now ${D.w} × ${D.h} px.`;const [x,y]=photoToDoc(640,1000);return CK.inDoc(x,y)||'The plate was cropped out.'}},
   {t:'Remove the orange cast: white napkin or plate rim within about <b>20</b> levels between red and blue.',c:()=>CK.m12neutral()},
   {t:'Brighten: average brightness up by at least <b>8</b> levels.',c:()=>{const s=CK.stats();return s.mean>=M.mean0+8||`Mean ${s.mean.toFixed(0)} (was ${M.mean0.toFixed(0)}).`}},
   {t:'Add the text <b>Taste of English Harbour</b> fully inside the frame (white works well, with a shadow).',c:()=>{const L=CK.textHas(/taste of english harbou?r/i);return L?(CK.inside(L)||'Part of the text is cut off — make it smaller or move it.'):'No text yet.'}},
   {t:'Export a JPG <b>1080 × 1350</b> under <b>400 KB</b>.',c:()=>!!CK.exp(e=>e.fmt==='jpg'&&e.w===1080&&e.h===1350&&e.bytes<400*1024)||'No 1080 × 1350 JPG under 400 KB yet.'}].map(s=>Object.assign(s,{h:H('Crop tool ▸ W x H x Resolution 1080 × 1350; Curves gray point on the napkin; Type tool; File ▸ Export As.'),show:['[data-tool="crop"]']}))},
 {id:'ps13',level:3,title:'Brochure clean-up',unit:'Unit 1 · Module 3 · Unit 7 — retouching distractions, sharpening last',time:900,
  brief:'A dive shop in <b>Shoal Bay, Anguilla</b> wants the shells photo for its brochure. Work <b>non-destructively</b>: retouch on a separate empty layer, remove every dust speck <b>and</b> the red bottle cap, then sharpen lightly at the end and export.',
  start(){startDoc('shells','shoal-bay-shells.jpg')},
  steps:[
   {t:'Add a new empty layer named <b>Retouch</b> above the Background.',c:()=>D.layers.some(l=>l.kind==='px'&&!l.bg&&/^retouch$/i.test(norm(l.name)))||'No layer called Retouch yet.'},
   {t:'Remove all 6 dust specks (Spot Healing Brush with <b>Sample All Layers</b> on the Retouch layer).',c:()=>{const n=CK.spots();return n>=6||`${n} of 6 removed.`}},
