<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Value Chain Tycoon</title>
<meta name="description" content="Value Chain Tycoon: a digital media value chain game for CAPE Digital Media Unit 1, Module 2. Kester Small">
<style>
/* Value Chain Tycoon: a Caribbean market ledger. Deep sea header, sand paper panels, gold coin accents. One light theme by design. */
:root{
  --bg:#f4eee1; --paper:#fffdf8; --paper2:#fbf6ea; --ink:#13262d; --muted:#53656b; --line:#e0d5bd; --line2:#cfc2a4;
  --sea:#0b4552; --sea2:#0f6475; --sea3:#13809a; --foam:#d9eef0;
  --coral:#d9513a; --gold:#e0a325; --goldhi:#f6cf6a; --good:#1c7f45; --goodbg:#e3f4e8; --bad:#b8352a; --badbg:#fbe7e3;
  --focus:#ffb703;
  --s0:#7f4cc4; --s1:#d55a2f; --s2:#b9850f; --s3:#2a7fbd; --s4:#c43d74; --s5:#178f78; --s6:#3f8a25; --s7:#55657f;
  --r-platform:#2a7fbd; --r-distributor:#6d55c9; --r-payment:#c98a0b; --r-marketing:#c43d74; --r-production:#d55a2f; --r-creator:#1c7f45;
  --sans:ui-rounded,"SF Pro Rounded","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --radius:14px; --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 18px -10px rgba(19,38,45,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(circle at 12% -10%,rgba(19,128,154,.10),transparent 40%),radial-gradient(circle at 100% 0,rgba(224,163,37,.12),transparent 35%);
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.skip{position:absolute;left:8px;top:-60px;background:var(--gold);color:#000;padding:8px 12px;border-radius:8px;z-index:50;font-weight:700}
.skip:focus{top:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* Header */
header.top{background:linear-gradient(180deg,var(--sea),#08353f);color:#fff;border-bottom:3px solid var(--gold)}
.brandrow{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.brandrow svg{flex:none}
.brand h1{font-family:var(--display);font-weight:800;letter-spacing:-.01em;margin:0;font-size:clamp(1.35rem,3.6vw,2rem);line-height:1.05}
.brand h1 span{color:var(--goldhi)}
.brand p{margin:3px 0 0;font-size:.85rem;color:#cfe6ea}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding:0 0 0;margin:0 -4px;-webkit-overflow-scrolling:touch}
nav.tabs button{flex:none;background:transparent;border:0;color:#d4ecef;padding:10px 12px 11px;font-weight:700;font-size:.92rem;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav.tabs button[aria-current="page"]{background:var(--bg);color:var(--sea)}
nav.tabs .tick{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--goldhi)}
main{padding:20px 0 30px}
.view[hidden]{display:none}
.view{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h2{font-family:var(--display);font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.08rem;margin:0 0 6px;line-height:1.25}
p{margin:0 0 10px}
.lede{color:var(--muted);max-width:68ch;margin-bottom:14px}
.eyebrow{display:inline-block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--sea2);margin-bottom:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:12px;border:2px solid var(--sea);background:var(--sea);color:#fff;font-weight:800;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--sea2);border-color:var(--sea2)}
.btn.ghost{background:transparent;color:var(--sea)}
.btn.ghost:hover{background:var(--foam)}
.btn.gold{background:var(--gold);border-color:#b98210;color:#1d1503}
.btn.gold:hover{background:var(--goldhi)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:800;background:var(--foam);color:var(--sea)}
.illus{display:inline-block;background:#fff3cf;border:1px dashed #c99a24;color:#6b4a00;border-radius:8px;font-size:.78rem;font-weight:700;padding:2px 8px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.credit{font-size:.85rem;color:var(--muted);font-style:italic}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px;flex:none}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.fb{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;border:1px solid var(--line)}
.fb.ok{background:var(--goodbg);border-color:#9ccfae;color:#114d2b}
.fb.no{background:var(--badbg);border-color:#e9aaa0;color:#7a2017}
.fb.info{background:var(--foam);border-color:#a9d3d9;color:#0b4552}
.fb.toast{position:sticky;bottom:10px;z-index:4;box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.tip{border-left:4px solid var(--gold);background:#fff8e4;padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0 0;font-size:.95rem}

/* Home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(1.6rem,4.4vw,2.5rem)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:120px;position:relative}
.tile:hover{border-color:var(--sea3);transform:translateY(-1px)}
.tile .num{font-family:var(--mono);font-size:.75rem;color:var(--sea2);font-weight:700}
.tile strong{font-size:1.05rem}
.tile span.d{font-size:.88rem;color:var(--muted)}
.tile .done{position:absolute;top:12px;right:12px}

/* Chain SVG */
.chainsvg{display:block;width:100%;height:auto}
.chainsvg .node{cursor:default}
.chainsvg .node[role="button"]{cursor:pointer}
.chainsvg .node[role="button"]:hover rect.box,.chainsvg .node[aria-pressed="true"] rect.box{stroke-width:4}
.chainsvg .node:focus{outline:none}
.chainsvg .node:focus-visible rect.box{stroke:var(--focus);stroke-width:5}
.only-wide{display:block}.only-tall{display:none}
@media (max-width:640px){.only-wide{display:none}.only-tall{display:block}}

/* Learn */
.learnnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);background:var(--paper);font-weight:800;font-size:.8rem;color:var(--muted);padding:0}
.dots button[aria-current="step"]{background:var(--sea);border-color:var(--sea);color:#fff}
.stagepanel{border-radius:12px;border:2px solid var(--line);padding:14px;margin-top:12px;background:var(--paper2)}
.stagetable td:first-child{font-weight:800;white-space:nowrap}
@media (max-width:640px){
  .stack thead{display:none}
  .stack tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:var(--paper)}
  .stack td{display:block;border:0;padding:3px 0}
  .stack td[data-h]::before{content:attr(data-h) ": ";font-weight:800;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
  .stagetable td:first-child{white-space:normal}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line2);background:#fff;padding:3px 10px;font-size:.84rem;font-weight:600}
.actor{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.actor .ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.minibar{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line2);margin:6px 0 4px}
.minibar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800;white-space:nowrap;overflow:hidden}

/* Chain builder */
.prodgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.prodgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.prodgrid{grid-template-columns:minmax(0,1fr)}}
.prodbtn{text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:12px;display:flex;gap:10px;align-items:flex-start;min-height:72px}
.prodbtn:hover{border-color:var(--sea3)}
.prodbtn[aria-pressed="true"]{border-color:var(--sea);background:var(--foam)}
.prodbtn .em{font-size:1.6rem;line-height:1}
.prodbtn small{display:block;color:var(--muted);font-size:.8rem}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.steps span{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:999px;background:#ece4d1;color:var(--muted)}
.steps span.on{background:var(--sea);color:#fff}
.steps span.ok{background:var(--goodbg);color:var(--good)}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px dashed var(--line2);border-radius:14px;background:var(--paper2);min-height:64px}
.pool:empty::after{content:"All placed.";color:var(--muted);font-weight:700}
.dcard{border:2px solid var(--line2);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;font-size:.92rem;line-height:1.35;max-width:100%;box-shadow:0 2px 0 var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pool .dcard{flex:1 1 230px}
.pool.tokens .dcard{flex:0 1 auto;font-weight:700}
.dcard:hover{border-color:var(--sea3)}
.dcard[aria-pressed="true"]{border-color:var(--sea);background:var(--foam);box-shadow:0 0 0 3px rgba(15,100,117,.25)}
.dcard.dragging{opacity:.35}
.dragghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-2deg);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);max-width:280px;opacity:.95}
.slots{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:s}
@media (max-width:860px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.slots{grid-template-columns:minmax(0,1fr)}.slot{min-height:60px}.zone{min-height:72px}}
.slot{width:100%;min-height:96px;border:2px dashed var(--line2);border-radius:14px;background:var(--paper);padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.slot .n{font-family:var(--mono);font-weight:800;font-size:.78rem;color:var(--muted)}
.slot.filled{border-style:solid;background:#fff}
.slot.filled .sname{font-weight:800}
.slot.filled .stext{font-size:.85rem;color:var(--muted)}
.slot.hot,.zone.hot{border-color:var(--sea);background:var(--foam)}
.slot.ready,.zone.ready{border-color:var(--sea3)}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:860px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.zones{grid-template-columns:minmax(0,1fr)}}
.zone{border:2px solid var(--line2);border-radius:14px;background:var(--paper);padding:10px;text-align:left;min-height:110px;display:flex;flex-direction:column;gap:6px;width:100%}
.zone .zh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.92rem}
.zone .placed{display:flex;flex-wrap:wrap;gap:4px}
.zone .placed span{font-size:.78rem;background:var(--goodbg);color:#114d2b;border-radius:8px;padding:2px 8px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}

/* Tycoon */
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:640px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--sea);color:#fff;border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#bfe0e5;font-weight:700}
.stat.neg b{color:#ffb4a6}
.qtrack{display:flex;gap:6px;margin:0 0 12px}
.qtrack span{flex:1;height:8px;border-radius:4px;background:#e2d8c1}
.qtrack span.on{background:var(--gold)}
.qtrack span.done{background:var(--sea3)}
.decision{border-left:6px solid var(--c,#888)}
.decision .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.decision .dh .snum{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.8rem;flex:none}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{position:relative;display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);border-radius:12px;padding:10px 12px 10px 38px;background:#fff;cursor:pointer;min-height:64px}
.opt input{position:absolute;left:12px;top:13px;width:18px;height:18px;accent-color:var(--sea);margin:0}
.opt:hover{border-color:var(--sea3)}
.opt:has(input:checked){border-color:var(--sea);background:var(--foam)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.opt:has(input:disabled){opacity:.5;cursor:not-allowed}
.opt b{font-size:.94rem;line-height:1.25}
.opt .fx{font-family:var(--mono);font-size:.76rem;color:var(--sea2);font-weight:700}
.opt .od{font-size:.82rem;color:var(--muted);line-height:1.35}
.releasebar{position:sticky;bottom:0;z-index:5;margin-top:14px;background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;box-shadow:0 -8px 20px -14px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modalback{position:fixed;inset:0;background:rgba(6,30,36,.6);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);border-radius:18px;max-width:560px;width:100%;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);border-top:8px solid var(--c,#888);max-height:calc(100vh - 32px);overflow:auto}
.modal .evopts{display:grid;gap:8px;margin-top:12px}
.modal .evopts .btn{justify-content:flex-start;text-align:left;width:100%}
.ledger td,.ledger th{padding:6px 6px;font-size:.9rem}
.ledger tr.lt td{border-bottom:0;padding-bottom:0}.ledger tr.how td{padding-top:0}
@media (max-width:640px){.ledger th,.ledger td{font-size:.74rem;padding:5px 3px}.ledger td.num,.ledger th.num{white-space:normal}}
.ledger tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.formula{font-family:var(--mono);font-size:.82rem;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.splitwrap{max-width:480px}
.badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--goldhi),var(--gold) 55%,#a87510);color:#2a1d00;text-align:center;font-weight:900;font-family:var(--display);box-shadow:0 0 0 6px #fff3cf,0 0 0 8px #c99a24,0 14px 30px -12px rgba(0,0,0,.5);padding:14px;line-height:1.1}
.badge small{font-weight:700;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.endtop{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.evlog{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.evlog li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:.9rem}

/* Compare */
.cmpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:380px){.cmpgrid{gap:6px}}
.chaincol{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.chaincol h3{font-size:.98rem}
.flow{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:0}
.flow li{position:relative;border:2px solid var(--line2);border-radius:10px;padding:6px 8px;background:#fff;font-size:.86rem;font-weight:700;line-height:1.25;margin-bottom:14px;transition:opacity .4s,transform .4s,background .4s}
.flow li::after{content:"";position:absolute;left:50%;bottom:-14px;width:2px;height:12px;background:var(--line2)}
.flow li:last-child{margin-bottom:0}
.flow li:last-child::after{display:none}
.flow li small{display:block;font-weight:600;color:var(--muted);font-size:.74rem}
.flow li .tag{display:inline-block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:6px;margin-top:3px;font-weight:800}
.flow li.removed{opacity:.55;background:#f1ece2;border-style:dashed}
.flow li.removed .nm{text-decoration:line-through}
.flow li.removed .tag{background:#f3d5cf;color:#7a2017}
.flow li.newmid{border-color:var(--coral);background:#fff3ef}
.flow li.newmid .tag{background:var(--coral);color:#fff}
.flow li.tool{border-color:var(--s5);background:#eaf7f3}
.flow li.tool .tag{background:var(--s5);color:#fff}
.flow li.direct{border-color:var(--good);background:var(--goodbg)}
.flow li.direct .tag{background:var(--good);color:#fff}
.flow li.enter{animation:pop .45s}
.yearbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.year{font-family:var(--display);font-weight:900;font-size:2.4rem;color:var(--sea);line-height:1}
input[type=range]{width:100%;accent-color:var(--sea);height:32px}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-family:var(--mono)}
.keepmeter{height:16px;border-radius:8px;background:#e7dfcd;overflow:hidden;margin-top:4px}
.keepmeter span{display:block;height:100%;background:var(--good);transition:width .4s}

/* Quiz */
.qopts{display:grid;gap:8px;margin-top:10px}
.qopt{text-align:left;border:2px solid var(--line);border-radius:12px;background:#fff;padding:11px 14px;min-height:48px;font-weight:600}
.qopt:hover:not([disabled]){border-color:var(--sea3)}
.qopt.right{border-color:var(--good);background:var(--goodbg)}
.qopt.wrong{border-color:var(--bad);background:var(--badbg)}
.qopt[disabled]{cursor:default}
.qprog{height:8px;border-radius:4px;background:#e2d8c1;overflow:hidden;margin:8px 0 12px}
.qprog span{display:block;height:100%;background:var(--gold)}

/* Sheet */

     GameSave.persist({ key, get, set, every })       save get() under key (on every save(), every `every` ms, and when the page is hidden); on load call set(saved) once
     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)
     GameSave.onReset(fn)             run fn before the page reloads after a reset
     GameSave.startOver()             ask "Start over?" and, if confirmed, clear this game's saved progress and reload
     GameSave.reset({reload})         clear without asking

   <html data-gs-own> says the game already has its own visible reset (which should call GameSave.startOver()). */

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

<script>
(function(){
'use strict';
/* ================= Utilities ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtInt = n => Math.round(n).toLocaleString('en-GB');
const usd = (n, dp) => { const neg = n < 0; const v = Math.abs(n); const d = dp != null ? dp : (v < 100 ? 2 : 0);
  return (neg ? '−' : '') + 'US$' + v.toLocaleString('en-GB',{minimumFractionDigits:d, maximumFractionDigits:d}); };
const cost$ = n => n ? usd(n,0) : 'free';
const pct = x => Math.round(x*100) + '%';
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let liveT;
function say(msg){ const l = $('#live'); l.textContent = ''; clearTimeout(liveT); liveT = setTimeout(()=>{ l.textContent = msg; }, 40); }
function wrapText(t, max){ const words = String(t).split(/\s+/); const lines=[]; let cur='';
  for (const w of words){ if ((cur+' '+w).trim().length > max && cur){ lines.push(cur); cur = w; } else cur = (cur+' '+w).trim(); }
  if (cur) lines.push(cur); return lines; }

/* ================= Persistence ================= */
const KEY = 'vct:v1';
if (window.GameSave) GameSave.register(['vct:*']);
let S = { view:'home', learn:0, cb:{}, quizBest:null, run:null, lastRun:null, sheet:{name:'',cls:'',date:'',r1:'',r2:''}, compareYear:1990, seen:{} };
try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); if (o && typeof o === 'object') S = Object.assign(S, o); } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ================= Content: stages ================= */
const STAGES = [
  {id:'concept', n:'Concept and ideation', short:'Concept', aspect:'Creation', col:'var(--s0)', hex:'#7f4cc4',
   about:'having the idea and planning who it is for',
   value:'Turns a spark into an idea with a clear audience, angle and format. The intellectual property (IP) is born here, so originality is value.',
   actors:['Creators','Writers and songwriters','Researchers'], ex:'Lady Salt plans a road-march tune for Trinidad Carnival, aimed at the J’ouvert crowd.'},
  {id:'production', n:'Creation and production', short:'Production', aspect:'Creation', col:'var(--s1)', hex:'#d55a2f',
   about:'making the raw content: recording, filming, writing, drawing or coding',
   value:'Turns the idea into a real asset. Skill, time and equipment raise its quality, and quality decides how far it will travel.',

  {id:'post', n:'Post-production and packaging', short:'Packaging', aspect:'Packaging', col:'var(--s2)', hex:'#b9850f',

  {id:'distribution', n:'Distribution', short:'Distribution', aspect:'Distribution', col:'var(--s3)', hex:'#2a7fbd',

  {id:'marketing', n:'Marketing and promotion', short:'Marketing', aspect:'Distribution', col:'var(--s4)', hex:'#c43d74',
   about:'helping people discover it',

  {id:'consumption', n:'Consumption and engagement', short:'Consumption', aspect:'Consumption', col:'var(--s5)', hex:'#178f78',

/* ================= Chain SVG ================= */
function chainSVG(opts){

    const W=1000, H = notes ? 400 : 330, bw=210, bh = notes ? 140 : 110, gx=245, y1=30, y2 = notes ? 230 : 190, x0=40;

      const nl = wrapText(s.n, 17);
      nl.forEach((ln,k)=>{ out += `<text x="${p.x+50}" y="${p.y+34+k*20}" font-size="17" font-weight="800" fill="#13262d" font-family="system-ui,sans-serif">${esc(ln)}</text>`; });
      if (notes && notes[i]){ const ls = wrapText(notes[i], 26).slice(0,4); ls.forEach((ln,k)=>{ out += `<text x="${p.x+14}" y="${p.y+76+k*17}" font-size="14" fill="#53656b" font-family="system-ui,sans-serif">${esc(ln)}</text>`; }); }

  } else {

    out += `<defs><marker id="${id}a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#53656b"/></marker></defs>`;

      out += `<g class="node"${nodeAttrs(i)}><rect class="box" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="12" fill="#fff" stroke="${s.hex}" stroke-width="2.5"/>`+
        `<rect x="${x}" y="${y}" width="7" height="${bh}" rx="3" fill="${s.hex}"/>`+

        `<text x="${x+50}" y="${y+(notes?31:bh/2-2)}" font-size="14.5" font-weight="800" fill="#13262d" font-family="system-ui,sans-serif">${esc(s.n)}</text>`;
      if (notes && notes[i]){ wrapText(notes[i], 38).slice(0,3).forEach((ln,k)=>{ out += `<text x="${x+16}" y="${y+54+k*16}" font-size="13" fill="#53656b" font-family="system-ui,sans-serif">${esc(ln)}</text>`; }); }

/* ================= Value split ================= */
const RECIP = [
  {k:'platform', n:'Platform', d:'stores, streaming and video platforms, ad networks, broadcasters', col:'#2a7fbd'},
  {k:'distributor', n:'Distributor & agents', d:'distributors, aggregators, publishers, sales agents, collecting societies, hosting', col:'#6d55c9'},
  {k:'payment', n:'Payment provider', d:'card, wallet and mobile-money processing fees', col:'#c98a0b'},
  {k:'marketing', n:'Marketing & research', d:'influencers, paid ads, press, audience research', col:'#c43d74'},
  {k:'production', n:'Production costs', d:'kit, crew, packaging, supplies for merch', col:'#d55a2f'},
  {k:'creator', n:'Creator keeps', d:'profit left for the creator', col:'#1c7f45'}
];
function splitCents(L){
  if (!L || L.gross <= 0) return null;
  const out = {}; let sum = 0;
  RECIP.forEach(r=>{ if (r.k === 'creator') return; const c = Math.round(L[r.k] / L.gross * 100); out[r.k] = c; sum += c; });
  out.creator = 100 - sum;
  return out;
}
function splitSVG(L, title){
  const c = splitCents(L);
  if (!c) return `<p class="fb info">No money came in, so there is nothing to split. The creator paid ${usd((L&&L.costs)||0)} in costs.</p>`;
  const W=400, rowH=38, top=86, H = top + RECIP.length*rowH + (c.creator<0?52:34), lx=8, bx=176, bw=172;
  const id='vs'+Math.random().toString(36).slice(2,7);
  let s = `<svg class="chainsvg vsplit" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${id}t ${id}d" data-cents='${JSON.stringify(c)}'><title id="${id}t">${esc(title||'Value split of every US$1')}</title>`+
    `<desc id="${id}d">${RECIP.map(r=>r.n+' '+c[r.k]+' cents').join(', ')}. Total 100 cents.</desc>`;
  s += `<text x="${lx}" y="20" font-size="15" font-weight="800" fill="#13262d" font-family="system-ui,sans-serif">Of every US$1 that fans and advertisers pay…</text>`;
  // stacked strip
  const sx=lx, sw=W-16, sy=32, sh=30;
  if (c.creator >= 0){
    let x = sx; RECIP.forEach(r=>{ const w = sw * c[r.k]/100; if (w<=0) return;
      s += `<rect x="${x}" y="${sy}" width="${w}" height="${sh}" fill="${r.col}"/>`; if (w>24) s += `<text x="${x+w/2}" y="${sy+20}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">${c[r.k]}¢</text>`; x += w; });
    s += `<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="6" fill="none" stroke="#13262d" stroke-width="1.5"/>`;
  } else {
    const tot = 100 - c.creator; let x = sx; RECIP.forEach(r=>{ if (r.k==='creator') return; const w = sw * c[r.k]/tot; if (w<=0) return;
      s += `<rect x="${x}" y="${sy}" width="${w}" height="${sh}" fill="${r.col}"/>`; x += w; });
    const one = sw*100/tot; s += `<line x1="${sx+one}" y1="${sy-4}" x2="${sx+one}" y2="${sy+sh+4}" stroke="#b8352a" stroke-width="3"/><text x="${Math.min(sx+one+4, W-120)}" y="${sy+sh+16}" font-size="12" font-weight="800" fill="#b8352a" font-family="system-ui,sans-serif">US$1 earned ends here</text>`;
  }
  s += `<text x="${lx}" y="${top-6}" font-size="11.5" fill="#53656b" font-family="system-ui,sans-serif">Illustrative, not real rates.</text>`;
  RECIP.forEach((r,i)=>{ const y = top + i*rowH; const v = c[r.k];
    s += `<text x="${lx}" y="${y+21}" font-size="14" font-weight="${r.k==='creator'?800:600}" fill="#13262d" font-family="system-ui,sans-serif">${esc(r.n)}</text>`;
    s += `<rect x="${bx}" y="${y+6}" width="${bw}" height="22" rx="5" fill="#efe8d8"/>`;
    if (v >= 0) s += `<rect x="${bx}" y="${y+6}" width="${Math.max(0,bw*Math.min(v,100)/100)}" height="22" rx="5" fill="${r.col}"/>`;
    else s += `<rect x="${bx}" y="${y+6}" width="${bw*Math.min(-v,100)/100}" height="22" rx="5" fill="#fbe7e3" stroke="#b8352a" stroke-width="2" stroke-dasharray="4 3"/>`;
    s += `<text x="${W-4}" y="${y+22}" text-anchor="end" font-size="14" font-weight="800" fill="${v<0?'#b8352a':'#13262d'}" font-family="ui-monospace,Menlo,monospace">${v<0?'−'+(-v):v}¢</text>`;
  });
  s += `<text x="${lx}" y="${top+RECIP.length*rowH+22}" font-size="13" font-weight="800" fill="#13262d" font-family="system-ui,sans-serif">Total: ${RECIP.reduce((a,r)=>a+c[r.k],0)}¢ = US$1.00</text>${c.creator<0?`<text x="${lx}" y="${top+RECIP.length*rowH+42}" font-size="12.5" font-weight="700" fill="#b8352a" font-family="system-ui,sans-serif">Costs were bigger than income: a loss.</text>`:''}`;
  return s + `</svg>`;
}

const EVENT_IDS = Object.keys(EVENTS);
function byId(a, id){ return a.find(x=>x.id===id) || a[0]; }
function licOfferValue(T,P,ch){ return Math.round(P.licBase*0.8*byId(PROD,ch.prod).q); }
function chanOf(P, id){ return byId(P.ch, id); }

function newRun(pid){
  let evs = shuffle(EVENT_IDS).slice(0,4);
  if (evs[0]==='fanfund' || evs[0]==='payfee'){ const t = evs[0]; evs[0] = evs[1]; evs[1] = t; }
  const P = TY[pid];
  return { pid, q:1, phase:'choose', cash:START_CASH, fans:0, payRate:PAY_RATE, kitOwned:false, bonus:{reach:1, conv:1},
    events:evs, history:[], pending:null,
    ch:{concept:'original', prod:'phone', pack:'basic', chan:P.ch[1].id, mkt:'organic', mon:[P.ch[1].models[0]], data:'analytics'} };
}

function simulate(T, ch, evId, optIdx){
  const P = TY[T.pid], C = byId(CONCEPTS,ch.concept), PR = byId(PROD,ch.prod), PK = byId(PACK,ch.pack), CH = chanOf(P,ch.chan), M = byId(MKT,ch.mkt), D = byId(DATA,ch.data);
  const ev = evId ? EVENTS[evId] : null;
  const fx = ev ? (ev.opts[optIdx].fx(T, ch, CH, P) || {}) : {};
  const eR = fx.reach || 1, eF = fx.fans || 1, eP = fx.fanPaid || 1;
  const payRate = fx.payRate != null ? fx.payRate : T.payRate;
  const Q = PR.q;
  const prodCost = Math.round((PR.id==='kit' ? (T.kitOwned ? PR.upkeep : PR.cost) : PR.cost) * P.scale);
  const newViews = Math.round(P.base * C.reach * Q * PK.reach * CH.reach * M.reach * T.bonus.reach * eR);
  const returning = Math.round(T.fans * 2);
  const views = newViews + returning;
  const mon = ch.mon.filter(m => CH.models.includes(m));
  const sponsor = mon.includes('sponsorship');
  const newFans = Math.round(newViews * 0.03 * Q * C.loyal * PK.fan * CH.fanConv * M.loyal * eF * (sponsor ? 0.95 : 1));
  const fans = Math.round(T.fans * 0.9) + newFans;
  const conv = C.conv * T.bonus.conv * eP;
  const lines = [];
  const add = (key, label, g, plat, dist, fan, supplies, how) => lines.push({key, label, g:Math.max(0,g), plat:plat||0, dist:dist||0, fan:!!fan, supplies:supplies||0, how});
  mon.forEach(m=>{
    if (m==='ads'){ const a = CH.ads; add('ads', a.label, views/1000*a.rpm, a.plat, a.dist, false, 0, `${fmtInt(views)} ${P.unit} ÷ 1,000 × US$${a.rpm} per 1,000`); }
    if (m==='sales'){ const a = CH.sales; add('sales', a.label, views*a.rate*a.price*conv, a.plat, a.dist, true, 0, `${fmtInt(views)} × ${(a.rate*100).toFixed(1)}% buy × US$${a.price} × fan factor ${conv.toFixed(2)}`); }
    if (m==='subs'){ const a = CH.subs || {}; add('subs', 'Memberships', fans*0.02*9*conv, a.plat, a.dist, true, 0, `${fmtInt(fans)} fans × 2% join × US$3 × 3 months × ${conv.toFixed(2)}`); }
    if (m==='merch'){ add('merch', 'Merchandise', fans*0.015*20*conv, 0, 0, true, 0.55, `${fmtInt(fans)} fans × 1.5% buy × US$20 × ${conv.toFixed(2)} (supplies 55%)`); }
    if (m==='donations'){ const a = CH.donations || {}; add('donations', 'Donations and tips', fans*0.04*4*conv, a.plat, 0, true, 0, `${fmtInt(fans)} fans × 4% tip × US$4 × ${conv.toFixed(2)}`); }
    if (m==='sponsorship'){ add('sponsorship', 'Sponsorship', views>=2000 ? views/1000*12 : 0, 0, 0, false, 0, views>=2000 ? `${fmtInt(views)} ÷ 1,000 × US$12` : `Under 2,000 views: no sponsor signed`); }
    if (m==='licensing'){ const ok = Q >= 1.0; add('licensing', 'Licensing', ok ? P.licBase*0.25*Q*C.orig*PK.lic : 0, 0, 0.20, false, 0, ok ? `US$${P.licBase} × 0.25 × quality ${Q} × originality ${C.orig} × packaging ${PK.lic}` : 'Phone quality: no licensee interested'); }
  });
  if (CH.licence){ const g = P.licBase * 0.5 * Q * C.orig * PK.lic * (1 + Math.min(T.fans,4000)/8000);
    add('licfee', 'Licence fee (exclusive)', g, 0, 0.15, false, 0, `US$${P.licBase} × 0.5 × quality ${Q} × originality ${C.orig} × packaging ${PK.lic} × fan bonus ${(1+Math.min(T.fans,4000)/8000).toFixed(2)}`); }
  (fx.extra||[]).forEach(x => add('extra', x.label, x.g, x.plat, x.dist, x.fan, 0, 'Event'));
  const L = {gross:0, platform:0, distributor:CH.flat, payment:0, marketing:M.cost + D.cost, production:prodCost + PK.cost + (fx.prodCost||0)};
  lines.forEach(l=>{ l.platAmt = l.g*l.plat; l.distAmt = l.g*l.dist; l.payAmt = l.fan ? l.g*payRate : 0; l.supAmt = l.g*l.supplies;
    L.gross += l.g; L.platform += l.platAmt; L.distributor += l.distAmt; L.payment += l.payAmt; L.production += l.supAmt; });
  L.costs = L.platform + L.distributor + L.payment + L.marketing + L.production;
  L.creator = L.gross - L.costs;
  const formula = [
    `New ${P.unit} = base ${fmtInt(P.base)} × concept ${C.reach} × quality ${Q} × packaging ${PK.reach} × channel ${CH.reach} × marketing ${M.reach}` + (T.bonus.reach!==1?` × data ${T.bonus.reach}`:'') + (eR!==1?` × event ${eR}`:'') + ` = ${fmtInt(newViews)}`,
    `Returning ${P.unit} = last quarter’s ${fmtInt(T.fans)} fans × 2 = ${fmtInt(returning)}`,
    `New fans = ${fmtInt(newViews)} × 3% × quality ${Q} × concept ${C.loyal} × packaging ${PK.fan} × channel ${CH.fanConv} × marketing ${M.loyal}` + (eF!==1?` × event ${eF}`:'') + (sponsor?' × sponsorship 0.95':'') + ` = ${fmtInt(newFans)}`,
    `Fans now = ${fmtInt(T.fans)} × 90% kept + ${fmtInt(newFans)} new = ${fmtInt(fans)}`
  ].join('\n');
  return {q:T.q, ch:JSON.parse(JSON.stringify(ch)), ev:evId, opt:optIdx, note:fx.note||'', newViews, returning, views, newFans, fans, lines, L, payRate, Q, prodCost, formula, nextBonus:{reach:D.reach, conv:D.conv}, kitBought: PR.id==='kit'};
}

function totals(run){
  const t = {gross:0, platform:0, distributor:0, payment:0, marketing:0, production:0, creator:0, costs:0, views:0};
  const byModel = {};
  run.history.forEach(h=>{ ['gross','platform','distributor','payment','marketing','production','creator','costs'].forEach(k=> t[k] += h.L[k]); t.views += h.views;
    h.lines.forEach(l=>{ const k = l.key==='licfee' || /licence/i.test(l.label) ? 'licensing' : l.key; byModel[k] = (byModel[k]||0) + l.g; }); });
  t.fans = run.history.length ? run.history[run.history.length-1].fans : 0;
  t.byModel = byModel;
  return t;
}
function rating(t){
  const sh = k => t.gross > 0 ? t[k]/t.gross : 0;
  const lic = t.gross>0 ? (t.byModel.licensing||0)/t.gross : 0;
  if (t.gross <= 0 || t.creator < 0) return {n:'Starving Artist', d:'Your costs were bigger than your income. Value was created, but you paid more to make and push it than the chain paid back.'};
  if (sh('platform') >= 0.30) return {n:'Platform Dependent', d:'You reached people, but a large slice of every dollar stayed with the platforms. One rule change could wipe you out.'};
  if (sh('creator') >= 0.45 && sh('platform') < 0.1 && t.fans >= 1000) return {n:'Indie Hero', d:'You built a real fan base and kept most of each dollar by going direct where it counted.'};
  if (lic >= 0.4) return {n:'Licensing Dealmaker', d:'Most of your income came from licensing: you kept ownership and let others pay to use your work.'};
  if (sh('marketing') >= 0.3) return {n:'Hype Machine', d:'Marketing swallowed a big share of every dollar. Attention was bought rather than earned.'};
  return {n:'Balanced Pro', d:'A sensible mix: decent reach, several income streams and no single middleman taking too much.'};
}
function debrief(run){
  const t = totals(run), P = TY[run.pid], hs = run.history, n = hs.length || 1;
  const avg = f => hs.reduce((a,h)=>a+f(h),0)/n;
  const boosts = [
    {s:0, n:'Concept', v:avg(h=>byId(CONCEPTS,h.ch.concept).reach)},
    {s:1, n:'Production', v:avg(h=>h.Q)},
    {s:2, n:'Packaging', v:avg(h=>byId(PACK,h.ch.pack).reach)},
    {s:3, n:'Distribution', v:avg(h=>chanOf(P,h.ch.chan).reach)},
    {s:4, n:'Marketing', v:avg(h=>byId(MKT,h.ch.mkt).reach)}
  ].sort((a,b)=>b.v-a.v);
  const top = boosts[0];
  const models = Object.entries(t.byModel).sort((a,b)=>b[1]-a[1]);
  const leaks = RECIP.filter(r=>r.k!=='creator').map(r=>({r, v:t[r.k]})).sort((a,b)=>b.v-a.v);
  const leakStage = {platform:'distribution', distributor:'distribution', payment:'monetisation', marketing:'marketing', production:'production'};
  const rpm = t.views ? t.gross/t.views*1000 : 0;
  const out = [];
  out.push(`<b>Most value added:</b> ${top.n} (stage ${top.s+1}) multiplied your reach by ×${top.v.toFixed(2)} on average, more than any other stage. ` + (top.s===3 ? 'Distribution adds value by giving access to a big audience, but the platform charges for that access.' : top.s===4 ? 'Marketing adds value by winning attention, but you pay for it out of every dollar.' : top.s===1 ? 'Higher quality made people share and stay.' : top.s===2 ? 'Good packaging made your work easy to find and enjoy.' : 'Your idea itself carried the product.'));
  if (models.length) out.push(`<b>Monetisation:</b> your biggest earner was ${esc(models[0][0]==='licensing'?'licensing':models[0][0]==='extra'?'event income (fan-funding or a deal)':MODELS[models[0][0]] ? MODELS[models[0][0]].n.toLowerCase() : models[0][0])} (${t.gross?pct(models[0][1]/t.gross):'0%'} of income). Overall, every 1,000 ${P.unit} earned you ${usd(rpm,2)} before costs.`);
  if (leaks[0] && t.gross>0) out.push(`<b>Biggest leak:</b> ${leaks[0].r.n.toLowerCase()} took ${Math.round(leaks[0].v/t.gross*100)}¢ of every US$1, at the ${leakStage[leaks[0].r.k]} stage. ${leaks[0].r.k==='platform' ? 'This is reintermediation: the platform is the new middleman.' : leaks[0].r.k==='production' ? 'Production spending only pays off if the reach and income follow.' : leaks[0].r.k==='marketing' ? 'Paid attention is expensive: organic sharing and loyal fans cost less.' : leaks[0].r.k==='payment' ? 'Payment fees are small per sale but add up over every fan payment.' : 'Distributors and agents bring access, but each takes a percentage.'}`);
  const dataQs = hs.filter(h=>h.ch.data!=='ignore').length;
  out.push(`<b>Feedback loop:</b> you used your data in ${dataQs} of ${hs.length} quarters. ` + (dataQs>=3 ? 'Closing the loop kept boosting your next release.' : 'Using analytics every quarter would have raised the next quarter’s reach and conversion.'));
  out.push(`<b>Keep more of the value:</b> build an own list or website for fan payments (disintermediation), use more than one platform so no single middleman controls you, license original work, and keep production costs in line with your audience.`);
  return out;
}

function cbPlace(k, iOverride){
  const i = iOverride != null ? iOverride : CBS.sel; if (i == null) { say('Pick a card first.'); return; }
  const P = CB.find(p=>p.id===CBS.pid);
  let ok = false;
  if (CBS.step === 1){
    if (CBS.order[k] != null) return;
    if (i === k){ CBS.order[k] = i; ok = true; CBS.msg = {ok:true, html:`Correct! Stage ${k+1} is <b>${esc(STAGES[k].n)}</b>: ${esc(STAGES[k].about)}.`}; }
    else { CBS.mistakes++; CBS.msg = {ok:false, html:`Not stage ${k+1}. Stage ${k+1} is about ${esc(STAGES[k].about)}. Does this card fit? Try another slot.`}; }
  } else {
    const t = P.tk[i];
    if (t[1] === k){ CBS.placed[i] = k; ok = true; CBS.msg = {ok:true, html:`Correct: <b>${esc(t[0])}</b> belongs in ${esc(STAGES[k].n)}. ${esc(t[2])}`}; }
    else { CBS.mistakes++; CBS.msg = {ok:false, html:`Not ${esc(STAGES[k].n)}: that stage is about ${esc(STAGES[k].about)}. Where does <b>${esc(t[0])}</b> add value? Try again.`}; }
  }
  CBS.sel = ok ? null : i;
  if (CBS.step === 1 && CBS.order.every(x=>x!=null)){ CBS.step = 2; CBS.msg = {ok:true, html:'All eight stages are in order. Step 2: place the actors and activities.'}; }
  else if (CBS.step === 2 && P.tk.every((t,j)=>CBS.placed[j]!=null)){
    CBS.step = 3; const stars = CBS.mistakes<=2?3:CBS.mistakes<=6?2:1; const prev = S.cb[P.id];
    S.cb[P.id] = {done:true, stars: Math.max(stars, prev && prev.stars || 0), mistakes:CBS.mistakes}; save(); renderTabs();
  }
  renderBuild();
  say((ok?'Correct. ':'Not quite. ') + (CBS.msg ? CBS.msg.html.replace(/<[^>]+>/g,'') : '') + (CBS.step===3?' Chain complete!':''));
  if (!ok){ const z = $(`[data-drop][data-k="${k}"]`); if (z && !RM){ z.classList.add('shake'); } if (z) z.focus(); }
  else { const next = $('[data-drag]') || $('#cbbody .btn'); if (next && !isMouse) next.focus();
    if (window.innerWidth<=640 && !isMouse){ const pl = $('#cbbody .pool') || $('#cbbody .card'); if (pl) pl.scrollIntoView({block:'start', behavior:RM?'auto':'smooth'}); } }
}

/* Drag (mouse) */
let drag = null, suppressClick = false, isMouse = false;
document.addEventListener('pointerdown', e=>{
  isMouse = e.pointerType === 'mouse';
  const el = e.target.closest('[data-drag]'); if (!el || e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = {el, x:e.clientX, y:e.clientY, started:false, ghost:null, over:null};
});
document.addEventListener('pointermove', e=>{
  if (!drag) return;
  if (!drag.started){ if (Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    drag.started = true; const g = drag.el.cloneNode(true); g.classList.add('dragghost'); g.removeAttribute('data-drag'); g.setAttribute('aria-hidden','true'); document.body.appendChild(g); drag.ghost = g; drag.el.classList.add('dragging');
    $$('[data-drop]').forEach(z=>z.classList.add('ready')); }
  drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
  const under = document.elementFromPoint(e.clientX, e.clientY); const z = under && under.closest('[data-drop]');
  if (drag.over && drag.over !== z) drag.over.classList.remove('hot');
  if (z){ z.classList.add('hot'); } drag.over = z;
});
document.addEventListener('pointerup', e=>{
  if (!drag) return; const d = drag; drag = null;
  if (!d.started) return;
  suppressClick = true; setTimeout(()=>{ suppressClick = false; }, 50);
  if (d.ghost) d.ghost.remove(); d.el.classList.remove('dragging');
  const under = document.elementFromPoint(e.clientX, e.clientY); const z = under && under.closest('[data-drop]');
  if (z && CBS){ cbPlace(+z.dataset.k, +d.el.dataset.i); } else { $$('[data-drop]').forEach(x=>x.classList.remove('ready','hot')); }
});

function keepAt(y){ for (let i=0;i<KEEP.length-1;i++){ const a=KEEP[i], b=KEEP[i+1]; if (y<=b[0]) return Math.round(a[1] + (b[1]-a[1])*(y-a[0])/(b[0]-a[0])); } return KEEP[KEEP.length-1][1]; }

});
document.addEventListener('input', e=>{
  if (e.target.id === 'cmpSlider'){ setYear(+e.target.value); return; }
  const k = e.target.dataset && e.target.dataset.sheet; if (k){ S.sheet[k] = e.target.value; save(); const pt = e.target.parentElement.querySelector('.printtext'); if (pt) pt.textContent = e.target.value; }
});
document.addEventListener('keydown', e=>{
  trapModal(e);
  const el = e.target;
  if ((e.key==='Enter' || e.key===' ') && el.getAttribute && el.getAttribute('role')==='button' && el.tagName!=='BUTTON'){ e.preventDefault(); el.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if (e.key==='Escape' && CBS && CBS.sel!=null){ const i = CBS.sel; CBS.sel = null; renderBuild(); const c = $(`[data-drag][data-i="${i}"]`); if (c) c.focus(); say('Card put back.'); return; }
  if (S.view==='learn' && !e.target.closest('input,textarea') && (e.key==='ArrowRight' || e.key==='ArrowLeft') && !el.closest('[role="button"]')){
    const n = S.learn + (e.key==='ArrowRight'?1:-1); if (n>=0 && n<LEARN.length){ S.learn = n; save(); renderLearn(); renderTabs(); $('#h-learn').setAttribute('tabindex','-1'); $('#h-learn').focus(); } }
});
document.addEventListener('keydown', e=>{ if (e.key==='Tab' || e.key==='Enter') isMouse = false; }, true);
function playCompare(){
  if (cmpTimer){ clearInterval(cmpTimer); cmpTimer = null; $('#cmpPlay').textContent = '▶ Play 1990 to 2026'; return; }
  if (RM){ setYear(2026); return; }
  let y = (S.compareYear>=2026) ? 1990 : S.compareYear; setYear(y);
  $('#cmpPlay').textContent = '⏸ Pause';
  cmpTimer = setInterval(()=>{ y++; if (y>2026){ clearInterval(cmpTimer); cmpTimer=null; const b=$('#cmpPlay'); if (b) b.textContent='▶ Play 1990 to 2026'; return; } if (!$('#cmpSlider')){ clearInterval(cmpTimer); cmpTimer=null; return; } setYear(y); }, 260);
}

/* Test hook: exposes the pure model for automated checks. */
window.VCT = {CB, simulate, splitCents, totals, rating, TY, EVENTS, newRun, get state(){ return S; }};

/* Restore an in-progress run's modal if needed and start */
if (S.run && S.run.phase === 'event' && S.view !== 'tycoon') {}
/* ---------- saved progress (GameSave): progress, the Tycoon run and the sheet were already kept; now the chain you are
   building and the quiz in progress (same question order) also come back ---------- */
if (window.GameSave){
  let touched = false, gsT = 0;
  GameSave.persist({ key: 'vct:save',
    get: () => touched ? { v: 1, cbs: CBS, qz: QZ } : undefined,
    set: d => {
      if (!d || d.v !== 1) throw 0;
      const c = d.cbs, P = c && CB.find(p => p.id === c.pid);
      if (P && Array.isArray(c.order) && c.order.length === 8 && Array.isArray(c.deck) && Array.isArray(c.tokens) && c.placed && typeof c.placed === 'object' && [1, 2, 3].includes(c.step) && (c.step < 3 || (S.cb[P.id] && S.cb[P.id].done))){
        CBS = Object.assign({}, c, { sel: null, mistakes: Math.max(0, c.mistakes | 0) });
      }
      const q = d.qz;
      if (q && Array.isArray(q.order) && q.order.length === QUIZ.length && q.order.every(i => QUIZ[i]) && Array.isArray(q.opts) && q.opts.length === 4 && Number.isInteger(q.i) && q.i >= 0 && q.i <= QUIZ.length){
        QZ = { order: q.order, i: q.i, score: Math.max(0, q.score | 0), ans: q.ans == null ? null : +q.ans, opts: q.opts };
      }
      touched = true;
    } });
  ['click', 'change', 'input', 'pointerup', 'keyup'].forEach(t => document.addEventListener(t, () => { touched = true; clearTimeout(gsT); gsT = setTimeout(() => GameSave.save(), 500); }, true));
}
go(S.view || 'home', false);
})();
</script>
