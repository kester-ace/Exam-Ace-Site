<!DOCTYPE html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balsamiq Lab · CAPE Digital Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Patrick+Hand&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13265e;--gold:#F5C542;--gold2:#ffd970;--ink:#EAF0FF;--muted:#AFC0EA;
  --ok:#3ddc97;--bad:#ff8a8a;
  --disp:"Bricolage Grotesque","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  /* app chrome (light) */
  --c-bg:#f3f4f7;--c-panel:#ffffff;--c-panel2:#f7f8fa;--c-line:#d9dce3;--c-line2:#e8eaef;--c-text:#1f2430;--c-text2:#5b6272;
  --c-hover:#e9edf5;--c-press:#dde4f2;--c-field:#ffffff;--c-shadow:0 10px 30px #0b1a4626;--c-desk:#d7dae1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --c-bg:#1b1e25;--c-panel:#23272f;--c-panel2:#2a2f39;--c-line:#3a404c;--c-line2:#323743;--c-text:#e8ebf2;--c-text2:#a8b0c0;
    --c-hover:#323846;--c-press:#3b4354;--c-field:#1b1e25;--c-shadow:0 10px 30px #0008;--c-desk:#14161b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-bg:#1b1e25;--c-panel:#23272f;--c-panel2:#2a2f39;--c-line:#3a404c;--c-line2:#323743;--c-text:#e8ebf2;--c-text2:#a8b0c0;
  --c-hover:#323846;--c-press:#3b4354;--c-field:#1b1e25;--c-shadow:0 10px 30px #0008;--c-desk:#14161b;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;max-width:100vw}
body{font-family:var(--ui);color:var(--c-text);background:var(--navy);font-size:13px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #4c8dff;outline-offset:1px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
kbd{font:600 11.5px var(--ui);background:#eef1f7;border:1px solid #c9cfdc;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:#1f2430;white-space:nowrap}

/* ============ START SCREEN ============ */
#start{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#1d3a8f55,transparent),linear-gradient(160deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);z-index:50}
#start .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
.brandrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.brandrow b{color:var(--gold)}
.brandrow .sp{flex:1}
.appicon{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;flex:none}
.appicon svg{display:block}
#start h1{font-family:var(--disp);font-size:clamp(34px,5vw,58px);margin:14px 0 6px;line-height:1.02;letter-spacing:-.01em}
#start h1 span{color:var(--gold)}
#start .pitch{font-size:18px;max-width:760px;color:#d7e1ff;margin:0 0 14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.objs li{border:1px solid #2c4590;background:#0d1d50;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#cfdcff}
.objs li b{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{position:relative;text-align:left;border:1px solid #2b4391;background:linear-gradient(180deg,#10225c,#0b1844);border-radius:18px;padding:20px 18px 18px;color:var(--ink);cursor:pointer;font-family:var(--body);transition:transform .15s,border-color .15s;min-height:190px}
.lvcard:hover,.lvcard:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.lvcard .em{font-size:30px}
.lvcard h2{font-family:var(--disp);margin:6px 0 4px;font-size:22px}
.lvcard p{margin:0 0 12px;color:#c4d2fb;font-size:14.5px}
.lvcard .bar{height:8px;border-radius:9px;background:#203a86;overflow:hidden}
.lvcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);width:0}
.lvcard .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#b8c8f5}
.startbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.gbtn{border:1px solid #33509f;background:#0f2160;color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.gbtn:hover{border-color:var(--gold)}
.gbtn:disabled{opacity:.45;cursor:default}
.gbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.xpline{display:flex;gap:18px;align-items:center;margin:4px 0 18px;color:#cfdcff;font-size:14px;flex-wrap:wrap}
.xpline b{color:var(--gold);font-family:var(--disp);font-size:20px}
.credit{margin-top:28px;color:#8fa3d8;font-size:12.5px;border-top:1px solid #1d2f6a;padding-top:14px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.credit button{background:none;border:0;color:#cfdcff;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:#0e1f58;border:1px solid #2a428e;border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;font-family:var(--body);min-height:150px}
.mcard:hover,.mcard:focus-visible{border-color:var(--gold)}
.mcard .num{font:700 11.5px var(--body);letter-spacing:.06em;color:var(--gold)}
.mcard h3{margin:0;font:700 16.5px var(--body)}
.mcard .ob{font-size:12px;color:#9fb4ec}
.mcard p{margin:2px 0 0;font-size:13.5px;color:#cfdcff;line-height:1.35}
.mcard .st{margin-top:auto;font-size:14px;color:var(--gold);letter-spacing:2px}
.backlink{background:none;border:0;color:var(--gold);font:600 14px var(--body);cursor:pointer;padding:6px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.badge{border:1px solid #2a428e;border-radius:14px;padding:12px;text-align:center;background:#0e1f58;color:#c9d6fb;font-size:13px}
.badge .bi{font-size:28px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--gold);color:#fff}
.badge.on .bi{filter:none;opacity:1}
.badge b{display:block;margin:4px 0 2px;color:inherit}
.lvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.starter{border:1px solid #2a428e;background:#0e1f58;border-radius:14px;padding:12px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--body)}
.starter:hover,.starter:focus-visible{border-color:var(--gold)}
.starter b{display:block;font-size:15px;margin-bottom:3px}
.starter small{color:#9fb4ec;font-size:12.5px}
.sechead{font:700 20px var(--disp);margin:28px 0 4px}

/* ============ COURSE BAR ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#coursebar{flex:none;height:42px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);border-bottom:1px solid #1d2f6a;overflow:hidden}
#coursebar .cbtn{flex:none;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:9px;padding:5px 9px;cursor:pointer;font:600 13px var(--body);white-space:nowrap;min-height:30px}
#coursebar .cbtn:hover{border-color:var(--gold)}
#coursebar .cbtn[aria-pressed=true]{background:var(--gold);color:#1b1500}
#coursebar .ctitle{flex:1;min-width:60px;font:700 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
#coursebar .ctitle small{font:400 12px var(--body);color:var(--muted)}
#coursebar .xp{flex:none;color:var(--gold);font:700 14px var(--disp);white-space:nowrap}
.dial{flex:none;display:flex;border:1px solid #2c4590;border-radius:9px;overflow:hidden}
.dial button{border:0;background:#0f2160;color:var(--ink);padding:5px 9px;cursor:pointer;font:600 12.5px var(--body);white-space:nowrap}
.dial button:hover{background:#1a2f75}
.dial button:disabled{opacity:.4;cursor:default}
.dial .lv{padding:5px 9px;background:#071237;color:var(--gold);font:700 12.5px var(--body);white-space:nowrap;display:flex;align-items:center}
#appmain{flex:1;display:flex;min-height:0;position:relative}
#appwin{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--c-bg);color:var(--c-text)}
.cb-lbl{display:inline}

/* ======= MISSION PANEL ======= */
#mission{flex:none;width:330px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0B1A46,#060D26);color:var(--ink);font-family:var(--body);border-left:3px solid var(--gold);min-height:0;transition:width .2s}
#mission.collapsed{width:40px}
#mission.collapsed .mbody,#mission.collapsed .mhead .mtt,#mission.collapsed .mfoot,#mission.collapsed .mbar{display:none}
.mhead{padding:10px 12px 8px;border-bottom:1px solid #1f3474;display:flex;gap:8px;align-items:flex-start}
.mhead h2{margin:0;font:700 17px/1.2 var(--disp)}
.mhead .mob{font-size:12px;color:var(--gold);margin-bottom:2px}
.mhead .colbtn{flex:none;margin-left:auto;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:7px;width:28px;height:28px;cursor:pointer}
.mbody{flex:1;overflow:auto;padding:10px 12px 16px}
.brief{background:#0f2160;border:1px solid #233d86;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:#dfe7ff}
.brief b{color:#fff}
.tagline{font-size:12px;color:#9fb4ec;margin:8px 0 0}
.steps{list-style:none;margin:12px 0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-radius:9px;font-size:14px;line-height:1.35}
.steps li .sn{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #3b57a6;display:grid;place-items:center;font:700 12px var(--disp);color:#b8c8f5}
.steps li.ok .sn{background:var(--ok);border-color:var(--ok);color:#03311d}
.steps li.ok .st{color:#a9f0cf}
.steps li.cur{background:#132a6c;outline:1px solid #2c4590}
.steps li .fb{display:block;margin-top:4px;font-size:12.5px;color:#ffd1d1}
.steps li.ok .fb{display:none}
.mbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid #1f3474}
.mbtn{border:1px solid #2f4b9c;background:#10235f;color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font:600 13.5px var(--body);min-height:34px}
.mbtn:hover{border-color:var(--gold)}
.mbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.mbtn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #f5c54266}}
.hintbox{margin-top:10px;background:#1a1a3a;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#fff3c4}
.mtimer{font:700 13px var(--disp);color:var(--gold);margin-left:8px;align-self:center}
.complete{text-align:center;padding:12px 6px}
.complete .stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.complete h3{font:800 22px var(--disp);margin:4px 0}
.complete p{color:#c4d2fb}
.mfoot{padding:8px 12px;border-top:1px solid #1f3474;font-size:11.5px;color:#8fa3d8}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #F5C542!important;outline-offset:1px;position:relative;z-index:30}
@keyframes pulse{50%{outline-color:#ff8b00;box-shadow:0 0 0 6px #f5c54255}}
#drawerBtn{display:none}

/* ======= MENUS / DIALOGS / TOAST ======= */
.menu{position:fixed;z-index:300;background:var(--c-panel);border:1px solid var(--c-line);border-radius:8px;box-shadow:var(--c-shadow);padding:4px;min-width:200px;max-height:80vh;overflow:auto;font:13px var(--ui);color:var(--c-text)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;min-height:30px}
.menu .mi:hover,.menu .mi:focus{background:var(--c-hover);outline:none}
.menu .mi[aria-disabled=true]{opacity:.45}
.menu .mi .mic{width:20px;display:grid;place-items:center;flex:none}
.menu .mi .kb{margin-left:auto;color:var(--c-text2);padding-left:18px;font-size:11.5px}
.menu .mi .sub{margin-left:auto;font-size:10px;padding-left:12px}
.menu .sep{height:1px;background:var(--c-line2);margin:4px 2px}
.menu .mh{padding:6px 10px 2px;font-weight:700;color:var(--c-text2);font-size:11.5px}
#dlgLayer{position:fixed;inset:0;z-index:250;pointer-events:none}
.dlgback{position:fixed;inset:0;background:#00000040;pointer-events:auto}
.dlg{position:fixed;background:var(--c-panel);color:var(--c-text);border-radius:10px;box-shadow:0 18px 50px #0006;border:1px solid var(--c-line);min-width:min(300px,94vw);max-width:min(96vw,860px);max-height:92vh;display:flex;flex-direction:column;pointer-events:auto;font:13px var(--ui)}
.dlg .dh{display:flex;align-items:center;padding:10px 10px 6px 16px;font-size:15px;font-weight:700;cursor:move;user-select:none;touch-action:none}
.dlg .dh span{flex:1}
.dlg .dh button{border:0;background:transparent;width:30px;height:30px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--c-text)}
.dlg .dh button:hover{background:#e81123;color:#fff}
.dlg .db{padding:6px 16px 12px;overflow:auto;line-height:1.45}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--c-line2);align-items:center;flex-wrap:wrap}
.dlg label.f{display:block;margin:8px 0 3px;font-weight:700}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{font:13px var(--ui);border:1px solid var(--c-line);border-radius:5px;padding:5px 7px;min-height:30px;background:var(--c-field);color:var(--c-text);width:100%}
.dlg textarea{min-height:90px;resize:vertical}
.pbtn{border:1px solid var(--c-line);background:var(--c-panel2);color:var(--c-text);border-radius:7px;padding:6px 14px;cursor:pointer;font:600 13px var(--ui);min-height:32px}
.pbtn:hover{background:var(--c-hover)}
.pbtn.pri{background:#2563eb;border-color:#2563eb;color:#fff}
.pbtn.pri:hover{background:#1d4fd8}
.pbtn.danger{color:#c62828}
table.qref{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:10px}
table.qref th,table.qref td{border:1px solid var(--c-line);padding:5px 8px;text-align:left;vertical-align:top}
table.qref th{background:var(--c-panel2)}
.qtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px;border-bottom:1px solid var(--c-line)}
.qtabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 12px;border-radius:6px 6px 0 0;cursor:pointer;font-weight:600;color:var(--c-text2)}
.qtabs button[aria-selected=true]{border-color:var(--c-line);background:var(--c-panel);color:var(--c-text);margin-bottom:-1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:9px;z-index:400;font:13.5px var(--ui);box-shadow:0 6px 20px #0004;max-width:min(90vw,560px);text-align:center}
.toast.gold{background:var(--navy2);color:var(--ink);border:1px solid var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;width:100vw;height:100vh}
.narrow-banner{position:fixed;left:8px;right:8px;top:48px;z-index:600;background:var(--gold);color:#1b1500;border-radius:10px;padding:8px 12px;font:600 13px var(--body);display:flex;gap:8px;align-items:center}
.narrow-banner button{margin-left:auto;border:0;background:#1b1500;color:var(--gold);border-radius:6px;padding:4px 10px;cursor:pointer}
.expimg{display:block;max-width:100%;max-height:46vh;margin:8px auto;border:1px solid var(--c-line);background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px}
.exptxt{width:100%;min-height:160px;font:12px ui-monospace,Consolas,monospace!important}
.note{color:var(--c-text2);font-size:12px}

/* ======= TOUR ======= */
#tour{position:fixed;inset:0;z-index:450}
#tour .ring{position:fixed;border-radius:10px;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px #050b2299;transition:all .25s;pointer-events:none}
#tour .bubble{position:fixed;width:min(340px,92vw);background:var(--navy2);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;font:14px/1.45 var(--body);box-shadow:0 14px 40px #0008}
#tour .bubble h3{margin:0 0 6px;font:800 18px var(--disp);color:var(--gold)}
#tour .bubble p{margin:0 0 10px}
#tour .tnav{display:flex;gap:6px;align-items:center}
#tour .tnav .cnt{margin-right:auto;font-size:12px;color:var(--muted)}

@media (max-width:1100px){#mission{width:290px}}
@media (max-width:900px){
  #mission{position:absolute;right:0;top:0;bottom:0;z-index:120;width:min(340px,92vw);box-shadow:-10px 0 30px #0006;transform:translateX(105%);transition:transform .2s}
  #mission.open{transform:none}
  #mission.collapsed{width:min(340px,92vw)}
  #mission.collapsed .mbody,#mission.collapsed .mhead .mtt,#mission.collapsed .mfoot,#mission.collapsed .mbar{display:flex}
  #mission.collapsed .mbody{display:block}
  #drawerBtn{display:inline-block}
  .levels{grid-template-columns:1fr}
}
@media (max-width:700px){
  .cb-lbl{display:none}
  #coursebar .ctitle small{display:none}
  #coursebar .xp{display:none}
  #coursebar{gap:4px;padding:0 5px}
  #coursebar .cbtn{padding:5px 7px}
  .dial button{padding:5px 6px}
  .dial .lv{padding:5px 6px}
  #start .wrap{padding:18px 16px 30px}
  #start .pitch{font-size:16px}
  .mlist{grid-template-columns:1fr}
}
@media print{body *{visibility:hidden}}

/* ============ BALSAMIQ LAB WINDOW ============ */
:root{--accT:#c9473b;--acc:#c9473b;--acc2:#a8382e;--accl:#fbe9e7}
:root[data-theme="dark"]{--accT:#ff9d92;--accl:#4a2723}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accT:#ff9d92;--accl:#4a2723}}
#appwin{font-family:var(--ui);font-size:13px}
#bm-menubar{flex:none;height:40px;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--c-panel);border-bottom:1px solid var(--c-line);min-width:0}
.bm-logo{width:26px;height:26px;flex:none;margin-right:6px;display:grid;place-items:center}
.bm-mb{border:0;background:transparent;border-radius:6px;padding:6px 9px;cursor:pointer;color:var(--c-text);font-weight:600;flex:none}
.bm-mb:hover,.bm-mb[aria-expanded=true]{background:var(--c-hover)}
.bm-title{flex:1;min-width:40px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c-text2);padding:0 8px}
.bm-title b{color:var(--c-text)}
.bm-title small{margin-left:6px;font-size:11.5px;padding:1px 6px;border-radius:9px;background:var(--c-panel2);border:1px solid var(--c-line)}
.bm-skin{display:flex;border:1px solid var(--c-line);border-radius:8px;overflow:hidden;flex:none}
.bm-skin button{border:0;background:var(--c-panel);padding:5px 10px;cursor:pointer;color:var(--c-text);font-weight:600;min-height:30px}
.bm-skin button[aria-pressed=true]{background:var(--acc);color:#fff}
.bm-present{flex:none;margin-left:6px;border:0;background:#1f2430;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;min-height:30px}
:root[data-theme="dark"] .bm-present{background:#eef1f7;color:#1f2430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bm-present{background:#eef1f7;color:#1f2430}}

     GameSave.persist({ key, get, set, every })       save get() under key (on every save(), every `every` ms, and when the page is hidden); on load call set(saved) once
     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)
     GameSave.onReset(fn)             run fn before the page reloads after a reset
     GameSave.startOver()             ask "Start over?" and, if confirmed, clear this game's saved progress and reload
     GameSave.reset({reload})         clear without asking

      '.gs-box{max-width:420px;width:100%;background:#0F1E4A;color:#F1F4FF;border:2px solid #F5C542;border-radius:16px;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}' +

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

function gsGet(){

  let doc;try{doc=APP.snapDoc()}catch(e){return undefined}

function gsResume(R,mi,mode,st,lv){
  if(lv)return false;

  const th=6/S.zoom;const B={x:b0.x+dx,y:b0.y+dy,w:b0.w,h:b0.h};const xs=[B.x,B.x+B.w/2,B.x+B.w],ys=[B.y,B.y+B.h/2,B.y+B.h];let bx=null,by=null;

  const g=[];const nb={x:b0.x+dx,y:b0.y+dy,w:b0.w,h:b0.h};
  if(bx){const o=bx.o;g.push([bx.v,Math.min(nb.y,o.y)-8,bx.v,Math.max(nb.y+nb.h,o.y+o.h)+8])}

function onMove(e){if(!drag)return;
  if(drag.mode==='pan'){wrapEl.scrollLeft=drag.sl-(e.clientX-drag.cx);wrapEl.scrollTop=drag.st-(e.clientY-drag.cy);return}
  const pt=svgPt(e);let dx=pt.x-drag.start.x,dy=pt.y-drag.start.y;

    if(d.includes('w'))x1=snapEdge(x1+dx,'x',drag.others).v;if(d.includes('e'))x2=snapEdge(x2+dx,'x',drag.others).v;if(d.includes('n'))y1=snapEdge(y1+dy,'y',drag.others).v;if(d.includes('s'))y2=snapEdge(y2+dy,'y',drag.others).v;

/* ---------- inline text editing ---------- */
function startEdit(id){const c=cById(id);if(!c)return;if(NOTEXT.includes(c.type)){toast(CTRL[c.type].n+' has no text — use the Property Inspector.');return}
  if(c.p.lock){toast('Unlock it first (Property Inspector ▸ 🔒).');return}
  const ta=$('#bm-edit');S.editing={id,before:snapP(),orig:c.t};const z=S.zoom;const multi=MULTILINE.includes(c.type);
  let w=Math.max(c.w,150),h=multi?Math.max(c.h,72):Math.max(c.h,34);if(c.type==='callout'){w=90;h=36}if(FRAMES.includes(c.type)){w=Math.min(c.w,420);h=40}
  const size=Math.max(13,Math.min(28,(c.p.size||(c.type==='heading'?28:16))*z));
  Object.assign(ta.style,{left:(svgEl.offsetLeft+c.x*z)+'px',top:(svgEl.offsetTop+c.y*z)+'px',width:Math.max(120,w*z)+'px',height:Math.max(32,h*z)+'px',fontSize:size+'px',fontFamily:P.skin==='sketch'||MARKUP.includes(c.type)?SKF:CLF});
  ta.placeholder=LISTY.includes(c.type)?'Items separated by commas':c.type==='table'?'One row per line, cells separated by commas':'';
  ta.value=c.t||'';ta.hidden=false;ta.focus();ta.select();say('Editing text. Enter to finish'+(multi?' (Ctrl+Enter)':'')+', Esc to cancel.')}

function wireEdit(){const ta=$('#bm-edit');ta.addEventListener('input',()=>{if(!S.editing)return;const c=cById(S.editing.id);if(c){c.t=ta.value;renderCanvas();schedCheck()}});
  ta.addEventListener('keydown',e=>{e.stopPropagation();if(!S.editing)return;const c=cById(S.editing.id);const multi=c&&MULTILINE.includes(c.type);if(e.key==='Escape'){e.preventDefault();closeEdit(true)}else if(e.key==='Enter'&&((!multi&&!e.shiftKey)||e.ctrlKey||e.metaKey)){e.preventDefault();closeEdit()}else if(e.key==='Tab'){e.preventDefault();closeEdit()}});

/* ---------- edit commands ---------- */
function deleteSel(){const sl=selList();if(!sl.length)return;change(()=>{const s=scr();s.ctrls=s.ctrls.filter(c=>!S.sel.has(c.id));S.sel.clear()});say('Deleted.')}
function copySel(){const sl=selList();if(!sl.length)return false;S.clip=JSON.parse(JSON.stringify(sl));S.clipScr=P.cur;S.pasteN=0;say('Copied.');return true}
function cutSel(){if(copySel())deleteSel()}
function cloneCtrls(list,dx,dy){const gm={};return list.map(c=>{const n=JSON.parse(JSON.stringify(c));n.id=uid('c');if(n.g){gm[n.g]=gm[n.g]||uid('g');n.g=gm[n.g]}n.x+=dx;n.y+=dy;return n})}
function pasteClip(){if(!S.clip){toast('Nothing to paste yet — copy something first (Ctrl+C).');return}S.pasteN=(S.pasteN||0)+1;const off=S.clipScr===P.cur?16*S.pasteN:0;const n=cloneCtrls(S.clip,off,off);change(()=>{scr().ctrls.push(...n);S.sel=new Set(n.map(c=>c.id))})}
function duplicateSel(){const sl=selList();if(!sl.length)return;const b=bbox(sl);const s=scr();let dy=b.h+8,dx=0;if(b.y+b.h+dy>s.h){dy=16;dx=16}const n=cloneCtrls(sl,dx,dy);change(()=>{const maxI=Math.max(...sl.map(c=>s.ctrls.indexOf(c)));s.ctrls.splice(maxI+1,0,...n);S.sel=new Set(n.map(c=>c.id))});S.ev.duplicated=(S.ev.duplicated||0)+1;ensureVisible(bbox(n));say('Duplicated below.')}

function ungroupSel(){const sl=selList();if(!sl.some(c=>c.g))return;change(()=>{sl.forEach(c=>delete c.g)});toast('Ungrouped.')}
function zorder(k){const sl=selList();if(!sl.length)return;change(()=>{const s=scr();const rest=s.ctrls.filter(c=>!S.sel.has(c.id));if(k==='front')s.ctrls=rest.concat(sl);else if(k==='back')s.ctrls=sl.concat(rest);else{const arr=s.ctrls;const idx=sl.map(c=>arr.indexOf(c)).sort((a,b)=>k==='forward'?b-a:a-b);for(const i of idx){const j=k==='forward'?i+1:i-1;if(j<0||j>=arr.length||S.sel.has(arr[j].id))continue;[arr[i],arr[j]]=[arr[j],arr[i]]}}})}
function alignSel(k){const u=units(selList());if(u.length<2)return;const B=bbox(u.flatMap(x=>x.cs));change(()=>{for(const x of u){let dx=0,dy=0;const b=x.b;if(k==='left')dx=B.x-b.x;if(k==='right')dx=B.x+B.w-(b.x+b.w);if(k==='center')dx=B.x+B.w/2-(b.x+b.w/2);if(k==='top')dy=B.y-b.y;if(k==='bottom')dy=B.y+B.h-(b.y+b.h);if(k==='middle')dy=B.y+B.h/2-(b.y+b.h/2);x.cs.forEach(c=>{c.x=Math.round(c.x+dx);c.y=Math.round(c.y+dy)})}});S.ev.aligned=k;say('Aligned '+k+'.')}

/* ---------- keyboard ---------- */
function onKey(e){
  if($('#app').hidden||dlgStack.length||!$('#tour').hidden)return;
  if(S.presenting){pvKey(e);return}
  if(isTyping(e))return;
  const k=e.key,K=k.length===1?k.toLowerCase():k,mod=e.ctrlKey||e.metaKey;const onCanvas=document.activeElement===svgEl||document.activeElement===document.body||document.activeElement===wrapEl;
  if(mod){
    if(K==='z'&&!e.shiftKey){e.preventDefault();undo();return}
    if(K==='y'||(K==='z'&&e.shiftKey)){e.preventDefault();redo();return}
    if(K==='s'){e.preventDefault();e.shiftKey?saveAs():save();return}
    if(K==='o'){e.preventDefault();openDialog();return}
    if(K==='e'){e.preventDefault();if(e.shiftKey)saveCopy();else exportMenu();return}
    if(k==='Enter'){e.preventDefault();present();return}
    if(k==='='||k==='+'){e.preventDefault();zoomStep(1);return}
    if(k==='-'||k==='_'){e.preventDefault();zoomStep(-1);return}
    if(k==='0'){e.preventDefault();setZoom(1);return}
    if(k==="'"){e.preventDefault();S.grid=!S.grid;renderCanvas();renderStatus();return}
    if(!onCanvas)return;
    if(K==='c'){e.preventDefault();copySel();return}
    if(K==='x'){e.preventDefault();cutSel();return}
    if(K==='v'){e.preventDefault();pasteClip();return}
    if(K==='d'){e.preventDefault();duplicateSel();return}
    if(K==='a'){e.preventDefault();selectAll();return}
    if(K==='g'){e.preventDefault();e.shiftKey?ungroupSel():groupSel();return}
    if(K==='k'){e.preventDefault();focusLink();return}
    if(K==='m'){e.preventDefault();toggleMarkup();return}
    if(K==='b'||K==='i'){const one=selList().length===1?selList()[0]:null;if(one&&['heading','label','paragraph','link','button'].includes(one.type)){e.preventDefault();const p=K==='b'?'bold':'italic';change(()=>{const cur=one.p[p]!=null?one.p[p]:(p==='bold'&&one.type==='heading');one.p[p]=!cur})}return}
    if(k===']'||k==='}'){e.preventDefault();zorder(e.shiftKey?'front':'forward');return}
    if(k==='['||k==='{'){e.preventDefault();zorder(e.shiftKey?'back':'backward');return}
    return}
  if(k==='/'&&!e.altKey){e.preventDefault();$('#bm-quickadd').focus();return}
  if(!onCanvas)return;
  if(k==='Delete'||k==='Backspace'){if(S.sel.size){e.preventDefault();deleteSel()}return}
  if(k.startsWith('Arrow')){e.preventDefault();if(!S.sel.size){cycleSel(1);return}const st=e.shiftKey?10:1;nudge(k==='ArrowLeft'?-st:k==='ArrowRight'?st:0,k==='ArrowUp'?-st:k==='ArrowDown'?st:0);return}
  if(k==='Enter'||k==='F2'){const sl=selList();if(sl.length===1){e.preventDefault();startEdit(sl[0].id)}else if(!sl.length&&k==='Enter'){e.preventDefault();cycleSel(1)}return}
  if(k==='Escape'){if(S.sel.size){S.sel.clear();renderSel()}return}
  if(k==='Tab'&&document.activeElement===svgEl){if(S.sel.size||!e.shiftKey){if(cycleSel(e.shiftKey?-1:1))e.preventDefault()}return}
  if(k===' '&&document.activeElement===svgEl){e.preventDefault();const sl=selList();if(sl.length===1&&['checkbox','radio','toggle'].includes(sl[0].type)){const c=sl[0];change(()=>{c.p.checked=!c.p.checked});return}if(!S.space){S.space=true;svgEl.classList.add('space')}return}
  if(k==='ContextMenu'||(e.shiftKey&&k==='F10')){e.preventDefault();const b=bbox(selList());const r=svgEl.getBoundingClientRect();canvasMenu(b?{rect:{left:r.left+(b.x+b.w)*S.zoom,top:r.top+b.y*S.zoom,bottom:r.top+b.y*S.zoom,right:r.left+(b.x+b.w)*S.zoom}}:svgEl);return}
}
addEventListener('keyup',e=>{if(e.key===' '&&S.space){S.space=false;svgEl&&svgEl.classList.remove('space')}});

const narrow=()=>innerWidth<=900;

function bmXML(list,ox,oy,par,ind){return list.map((q,i)=>{const id=String(i);let s=`${ind}<control controlID="${id}" controlTypeID="${q.t==='__group__'?'__group__':'com.balsamiq.mockups::'+q.t}" x="${bmI(q.x-ox)}" y="${bmI(q.y-oy)}" w="${bmI(q.w)}" h="${bmI(q.h)}" measuredW="${bmI(q.w)}" measuredH="${bmI(q.h)}" zOrder="${id}" locked="${q.lock?'true':'false'}" isInGroup="${par}"`;
  const pr=Object.entries(q.p||{}).map(([k,v])=>`${ind}    <${k}>${bmEsc(k==='icon'&&v&&typeof v==='object'?v.ID+'|'+v.size:v)}</${k}>`);
  if(!pr.length&&!q.kids)return s+'/>';s+='>\n';if(pr.length)s+=`${ind}  <controlProperties>\n${pr.join('\n')}\n${ind}  </controlProperties>\n`;

let pvStack=[],pvStart=null;
function present(){closeEdit();if(S.presenting)return;S.presenting=true;pvStack=[];pvStart=P.cur;S.ev.presented=true;S.ev.pvVia=S.ev.pvVia||new Set();S.ev.pvSeen=S.ev.pvSeen||new Set();S.ev.pvSeen.add(P.cur);closeMenus();const pv=$('#bm-presentation');pv.hidden=false;renderPV();setTimeout(()=>{const b=$('.pv-hot button')||$('[data-pv="exit"]');b&&b.focus()},60);schedCheck()}
function renderPV(){const s=scr();const stage=$('.pv-stage');const avW=Math.max(120,stage.clientWidth-32),avH=Math.max(120,stage.clientHeight-32);const pad=16;const b=contentBounds(s,false)||{x:0,y:0,w:s.w,h:s.h};const vx=Math.floor(b.x-pad),vy=Math.floor(b.y-pad),vw=Math.ceil(b.w+pad*2),vh=Math.ceil(b.h+pad*2);const k=Math.min(avW/vw,avH/vh,1.6);const W=Math.round(vw*k),H=Math.round(vh*k);
  const box=$('.pv-box');box.style.width=W+'px';box.style.height=H+'px';$('.pv-svg').innerHTML=screenSVG(s,{crop:true,pad,markup:false,width:W,height:H});
  const hot=$('.pv-hot');hot.innerHTML='';const kx=W/vw,ky=H/vh;
  s.ctrls.filter(c=>c.link&&!MARKUP.includes(c.type)&&(c.link==='back'||P.screens.some(x=>x.id===c.link))).forEach(c=>{const tgt=c.link==='back'?'the previous wireframe':'“'+P.screens.find(x=>x.id===c.link).name+'”';const bt=el('button',{'data-pvlink':c.id,'aria-label':(c.t?String(c.t).split(/\n|,/)[0]+': ':'')+'go to '+tgt,title:'Go to '+tgt,style:{left:((c.x-vx)*kx)+'px',top:((c.y-vy)*ky)+'px',width:Math.max(24,c.w*kx)+'px',height:Math.max(24,c.h*ky)+'px'}});bt.onclick=e=>{e.stopPropagation();pvGo(c.link)};hot.append(bt)});
  $('.pv-name').textContent=(P.screens.indexOf(s)+1)+' / '+P.screens.length+' · '+s.name;$('[data-pv="prev"]').disabled=P.screens.indexOf(s)===0;$('[data-pv="next"]').disabled=P.screens.indexOf(s)===P.screens.length-1}
function pvGo(link){let id=link;if(link==='back'){id=pvStack.pop();if(!id){toast('This is the first wireframe you opened — there is nowhere to go back to.');return}}else pvStack.push(P.cur);if(!P.screens.some(x=>x.id===id))return;P.cur=id;S.ev.pvVia.add(id);S.ev.pvSeen.add(id);S.ev.pvClicks=(S.ev.pvClicks||0)+1;renderPV();setTimeout(()=>{const b=$('.pv-hot button')||$('[data-pv="exit"]');b&&b.focus()},30);schedCheck()}
function pvStep(d){const i=P.screens.findIndex(x=>x.id===P.cur);const j=clamp(i+d,0,P.screens.length-1);if(j===i)return;pvStack.push(P.cur);P.cur=P.screens[j].id;S.ev.pvSeen.add(P.cur);renderPV()}
function pvFlash(){const h=$('.pv-hot');if(!h.children.length){toast('Nothing on this wireframe is linked yet. Select a control and choose 🔗 Link in the Property Inspector.');return}h.classList.add('flash');setTimeout(()=>h.classList.remove('flash'),700)}
function exitPresent(){if(!S.presenting)return;S.presenting=false;$('#bm-presentation').hidden=true;S.sel.clear();renderAll();zoomFit(true);svgEl.focus({preventScroll:true});schedCheck()}
function pvKey(e){if(e.key==='Escape'){e.preventDefault();exitPresent()}else if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();pvStep(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();pvStep(-1)}else if(e.key==='Backspace'){e.preventDefault();pvGo('back')}}

  {t:'Change the nav bar items to <b>Home, Shop, About, Contact</b>.',c:()=>{const n=Q.of(scr(),'navbar')[0];return (n&&itemsOf(n).map(lc).join('|')==='home|shop|about|contact')||'The nav bar should list exactly: Home, Shop, About, Contact.'},h:['Items in a nav bar are separated by commas.','Select the nav bar and type Home, Shop, About, Contact in the Text box (or double-click it).'],show:['#ip-text']},
  {t:'Show visitors where they are: make <b>Shop</b> the selected nav item.',c:()=>{const n=Q.of(scr(),'navbar')[0];return (n&&lc(itemsOf(n)[n.p.sel==null?0:n.p.sel]||'')==='shop')||'Shop is not the selected item yet.'},h:['A selected (highlighted) item tells users which page they are on.','Select the nav bar ▸ Property Inspector ▸ Selected item ▸ Shop.'],show:['#ip-sel']},
  {t:'Change the heading to <b>Salt & Sea Threads</b>.',c:()=>Q.of(scr(),'heading').some(c=>Q.has(c,/^salt & sea threads$/i))||'The heading should read “Salt & Sea Threads”.',h:['Double-click the word “Heading”.'],show:['#ip-text']},
  {t:'Change the button text to <b>Shop the collection</b>.',c:()=>Q.of(scr(),'button').some(c=>Q.has(c,/shop the collection/i))||'The button still has placeholder words.',h:['A button label should say exactly what happens when you click it.'],show:['#ip-text']},
  {t:'Make the heading bigger: font size <b>36</b> or more.',c:()=>Q.of(scr(),'heading').some(c=>(c.p.size||28)>=36)||'The heading is still smaller than 36.',h:['Size shows hierarchy: the most important words are biggest.','Select the heading ▸ Property Inspector ▸ Text style ▸ type 36 in the size box and press Enter.'],show:['[data-prop="size"]']},
 ]},
{id:'line-up',level:1,title:'Line it up, group it, lock it',unit:'Unit 2 · Module 1 · Composition and principles of interactive design (alignment)',
 brief:'<b>Nutmeg Trail Tours</b> in Grenada has three tour buttons on its app home screen, but they were dropped in by hand and look messy. Tidy them the way a designer would: line them up, space them evenly, then group them.',
 setup:()=>proj('Nutmeg Trail Tours',[newScreen('Home',[phoneAt(40,24),mk('appbar',52,68,276,52,'Spice Tours',{back:false}),mk('button',70,160,200,44,'Nutmeg trail'),mk('button',96,236,200,44,'Cocoa estate'),mk('button',62,336,200,44,'Waterfall hike')])]),
 steps:[
  {t:'Line up the <b>left edges</b> of the three buttons.',c:()=>{const b=Q.of(scr(),'button');return (b.length>=3&&b.every(c=>Math.abs(c.x-b[0].x)<=1))||'The buttons do not share the same left edge yet.'},h:['Select all three buttons, then use Align in the Property Inspector.','Shift+click each button (or drag a box around them) ▸ Property Inspector ▸ Align left edges.'],show:['[data-cmd="align-left"]']},
  {t:'Make the gaps between them equal (<b>Distribute vertically</b>).',c:()=>{const b=Q.of(scr(),'button').slice().sort((p,q)=>p.y-q.y);if(b.length<3)return 'Keep all three buttons.';const g=[];for(let i=1;i<b.length;i++)g.push(b[i].y-(b[i-1].y+b[i-1].h));return (g.every(x=>x>=0)&&Math.max(...g)-Math.min(...g)<=2)||'The gaps are not equal yet.'},h:['Equal spacing is part of the principle of alignment and repetition.','With all three selected, click Distribute vertically in the Property Inspector.'],show:['[data-cmd="dist-v"]']},
  {t:'Group the three buttons (<b>Ctrl+G</b>) so they move as one.',c:()=>{const b=Q.of(scr(),'button');return (b.length>=3&&b[0].g&&b.every(c=>c.g===b[0].g))||'The buttons are not in one group.'},h:['Select the three buttons, then Group.','Ctrl+G, or Property Inspector ▸ ⧈ Group.'],show:['[data-cmd="group"]']},
  {t:'Lock the phone so it cannot be dragged by accident.',c:()=>{const f=Q.frame(scr());return (f&&f.p.lock)||'The phone is not locked.'},h:['Select only the phone (click its edge).','Property Inspector ▸ Arrange ▸ 🔓 Lock.'],show:['[data-prop="lock"]']},
 ]},
{id:'two-screens',level:1,title:'Two screens, one tap',unit:'Unit 2 · Module 3 · Tools and techniques to create a mobile application (user flows)',
 brief:'<b>Swing Bridge Bites</b> runs a food truck in Belize City. Their home screen has a <b>View menu</b> button that goes nowhere. Add a second wireframe and link the two so testers can tap from one to the other — your first click-through prototype.',
 setup:()=>proj('Swing Bridge Bites',[newScreen('Home',[phoneAt(40,24),mk('appbar',52,68,276,52,'Swing Bridge Bites',{back:false}),mk('image',64,132,252,180),mk('paragraph',64,324,252,72,'Fry jacks, stew chicken and fresh juices at the Swing Bridge every weekday.'),mk('button',64,448,252,48,'View menu')])]),
 steps:[
  {t:'Add a new wireframe named <b>Menu</b>.',c:()=>!!Q.by(/^menu$/i)||'There is no wireframe called “Menu”.',h:['Wireframes are listed in the navigator on the left.','Click ＋ in the Wireframes navigator, type Menu and press Create.'],show:['[data-cmd="newscreen"]','[data-cmd="navtoggle"]']},
  {t:'On <b>Menu</b>, add a <b>Phone</b> with a <b>List</b> of at least three dishes inside it.',c:()=>{const m=Q.by(/^menu$/i);if(!m)return 'Make the Menu wireframe first.';const l=Q.inPh(m,'list');return (l.length&&linesOf(l[0]).length>=3)||'The Menu wireframe needs a phone with a list of three or more dishes inside it.'},h:['Add the Phone first, select it, then add a List.','In the List’s Text box, put one dish per line, for example Fry jacks, Stew chicken, Ceviche.'],show:['[data-lib="phone"]','[data-lib="list"]']},
  {t:'Back on <b>Home</b>, link the <b>View menu</b> button to the Menu wireframe.',c:()=>{const m=Q.by(/^menu$/i),h=Q.by(/^home$/i);const b=h&&Q.of(h,'button').find(c=>Q.has(c,/view menu/i));return (m&&b&&b.link===m.id)||'The View menu button is not linked to Menu.'},h:['Open Home in the navigator, then select the button.','Property Inspector ▸ 🔗 Link ▸ choose Menu (or press Ctrl+K).'],show:['#ip-link']},
  {t:'Click <b>▶ Present</b> and tap the View menu button to reach the Menu screen.',c:()=>{const m=Q.by(/^menu$/i);return (m&&Q.pv(m.id))||'Not tested in Present mode yet.'},h:['Present mode hides the editor so you can click like a user.','Open Home, click ▶ Present, then click the button. Press Esc to come back.'],show:['[data-cmd="present"]']},
 ]},
/* ===== Level 2 · Core ===== */
{id:'lologo-lofi',level:2,title:'LoloGo: the lo-fi home screen',unit:'Unit 1 · Module 3 · Wireframes, mock-ups and prototypes (LoloGo case study)',
 brief:'Revisit the <b>LoloGo</b> case study: an app that helps people in Sint Maarten find a lolo (roadside grill), see today’s dishes and order ahead. Turn the team’s pencil sketch (the sticky note) into a clean <b>lo-fi wireframe</b> of the home screen. Structure only — no colour.',
 setup:()=>proj('LoloGo',[newScreen('Home',[phoneAt(40,24),sticky(380,40,230,180,'From the paper sketch:\n• title bar: LoloGo\n• search box\n• list of lolos\n• tabs at the bottom')])]),
 steps:[
  {t:'An <b>App Bar</b> at the very top of the phone screen, titled <b>LoloGo</b>.',c:()=>{const f=Q.frame(scr());const a=Q.inPh(scr(),'appbar').find(c=>Q.has(c,/lologo/i));return (a&&a.y<=Q.inner(f).y+30)||'Put an App Bar titled LoloGo at the top of the phone.'},h:[IN+' An App Bar added to a phone snaps to its top.','Select the phone ▸ App Bar tile ▸ change its text to LoloGo.'],show:['[data-lib="appbar"]']},
  {t:'A <b>Search Box</b> below it that says <b>Search lolos or dishes</b>.',c:()=>{const a=Q.inPh(scr(),'appbar')[0];return Q.inPh(scr(),'search').some(c=>Q.has(c,/search lolos/i)&&(!a||c.y>=a.y+a.h-4))||'Add a search box under the app bar with the words “Search lolos or dishes”.'},h:['Search is the first thing hungry users try, so it goes near the top.'],show:['[data-lib="search"]']},
  {t:'A <b>List</b> of at least <b>four</b> lolos (one per line).',c:()=>Q.inPh(scr(),'list').some(c=>linesOf(c).length>=4)||'The list needs four or more lines.',h:['List ▸ Text box: one lolo per line, e.g. Kim’s Lolo, Sandy Ground Grill…'],show:['[data-lib="list"]','#ip-text']},
  {t:'A <b>Tab Bar</b> at the bottom of the phone with Home, Search, Orders and Profile.',c:()=>{const f=Q.frame(scr());const t=Q.inPh(scr(),'tabbar')[0];if(!t)return 'No tab bar inside the phone.';const it=itemsOf(t).map(lc);const r=Q.inner(f);return (it.length>=4&&it.includes('home')&&it.some(x=>x.startsWith('order'))&&Math.abs(t.y+t.h-(r.y+r.h))<=30)||'The tab bar must sit at the bottom and include Home and Orders (4 items).'},h:['A Tab Bar added to a selected phone snaps to its bottom.','Text box: Home, Search, Orders, Profile'],show:['[data-lib="tabbar"]']},
  {t:'Label it: a <b>Text</b> control that says <b>Low-fidelity wireframe, version 1</b>.',c:()=>scr().ctrls.some(c=>['label','paragraph','heading'].includes(c.type)&&Q.has(c,/low-fidelity wireframe/i))||'Add the label so reviewers know what to judge.',h:['The course recommends labelling lo-fi work so people comment on structure, not looks.','Add a Text control (outside the phone is fine) and type Low-fidelity wireframe, version 1.'],show:['[data-lib="label"]']},
  {t:'Keep it lo-fi: <b>no colour</b> on any control.',c:()=>scr().ctrls.filter(c=>!MARKUP.includes(c.type)).every(c=>!c.p.color)||'Remove colour (Property Inspector ▸ Colour ▸ Default).',h:['Colour, real photos and fonts belong in the mock-up stage.'],show:['[data-prop="color"]']},
 ]},
{id:'mobile-first',level:2,title:'Mobile-first home page',unit:'Unit 2 · Module 3 · Factors that impact the mobile user experience',
 brief:'<b>Cockleshell Paddle Co.</b> rents kayaks at Cockleshell Bay, St. Kitts. Eight out of ten customers find them on a phone, so manager <b>Jalisa Liburd</b> wants the page designed <b>mobile-first</b>: small screen first, thumb-friendly, one column.',
 setup:()=>proj('Cockleshell Paddle',[newScreen('Home',[phoneAt(40,24),mk('heading',64,80,200,40,'Cockleshell Paddle',{size:22})])]),
 steps:[
  {t:'A hamburger <b>Menu icon</b> in the top strip of the phone (Icon ▸ Menu).',c:()=>{const f=Q.frame(scr());return Q.inPh(scr(),'icon').some(c=>c.p.icon==='menu'&&c.y<Q.inner(f).y+80)||'Add an Icon set to “Menu (hamburger)” near the top of the phone.'},h:['On small screens the nav bar collapses into a ☰ menu icon.','Add an Icon, then pick Menu (hamburger) in the Property Inspector. Move it to the top right.'],show:['[data-lib="icon"]','[data-prop="icon"]']},
  {t:'A hero <b>Image</b> at least <b>80%</b> of the phone screen’s width.',c:()=>{const f=Q.frame(scr());return Q.inPh(scr(),'image').some(c=>c.w>=Q.inner(f).w*.8)||'Make the image wider (W in the Property Inspector).'},h:['The phone screen is 276 px wide, so the image needs W of 221 or more.'],show:['[data-lib="image"]','#ip-w']},
  {t:'A <b>Button</b> that says <b>Book a kayak</b>.',c:()=>Q.inPh(scr(),'button').some(c=>Q.has(c,/book a kayak/i))||'Add the Book a kayak button inside the phone.',h:['One clear call to action.'],show:['[data-lib="button"]']},
  {t:'Thumb-friendly: the button is at least <b>44 px tall</b> and sits in the <b>bottom third</b> of the phone screen.',c:()=>{const f=Q.frame(scr());const r=Q.inner(f);const b=Q.inPh(scr(),'button').find(c=>Q.has(c,/book a kayak/i));if(!b)return 'Add the button first.';if(b.h<44)return 'Tap targets should be at least 44 × 44 px (set H to 44 or more).';return (ctr(b).y>=r.y+r.h*2/3)||'Move the button lower, into the thumb zone.'},h:['Most people use a phone one-handed: the easiest place to tap is low on the screen.','Set the button’s H to 48 and its Y to about 480 in the Property Inspector.'],show:['#ip-h','#ip-y']},
  {t:'One column only: every control sits <b>fully inside</b> the phone screen.',c:()=>{const f=Q.frame(scr());const r=Q.inner(f);const out=scr().ctrls.filter(c=>c!==f&&!MARKUP.includes(c.type)&&!Q.fully(c,r));return !out.length||(out.length+' control'+(out.length>1?'s stick':' sticks')+' out of the phone screen.')},h:['Check the right-hand edge of the image and the heading.'],show:['#ip-x','#ip-w']},
 ]},
{id:'booking-flow',level:2,title:'Booking flow: three linked screens',unit:'Unit 2 · Module 3 · User flows and clickable prototypes',
 brief:'<b>Ridge Runner Hikes</b> in Soufrière, St. Lucia, wants visitors to book a hike in three taps: choose a tour → pick a date → confirm. Build the missing screens, link the flow and test it like a user would.',
 setup:()=>proj('Ridge Runner Hikes',[newScreen('Choose a tour',[phoneAt(40,24),mk('appbar',52,68,276,52,'Choose a tour',{back:false}),mk('list',64,132,252,120,'Gros Piton summit\nTet Paul nature trail\nSulphur Springs walk'),mk('paragraph',64,264,252,60,'Guided hikes from EC$95. Pick-up from Soufrière included.'),mk('button',64,476,252,48,'Next')])]),
 steps:[
  {t:'Add two more wireframes: <b>Pick a date</b> and <b>Confirm</b>.',c:()=>(Q.by(/^pick a date$/i)&&Q.by(/^confirm$/i))||'Both wireframes are needed (check the spelling).',h:['Tip: right-click a wireframe ▸ Duplicate keeps the phone and app bar, then rename it.'],show:['[data-cmd="newscreen"]','[data-cmd="navtoggle"]']},
  {t:'<b>Pick a date</b>: a phone with a <b>Dropdown</b> or <b>Text Input</b> for the date, and a button.',c:()=>{const s=Q.by(/^pick a date$/i);if(!s)return 'Make the Pick a date wireframe first.';return ((Q.inPh(s,'dropdown').length||Q.inPh(s,'textinput').length)&&Q.inPh(s,'button').length)||'Pick a date needs a date field and a button inside a phone.'},h:['Placeholder text like “Choose a date” tells users what to do.'],show:['[data-lib="dropdown"]']},
  {t:'<b>Confirm</b>: a phone with a button that says <b>Pay</b> or <b>Confirm</b>.',c:()=>{const s=Q.by(/^confirm$/i);return (s&&Q.inPh(s,'button').some(c=>Q.has(c,/pay|confirm/i)))||'Confirm needs a Pay or Confirm button inside a phone.'},h:['Say exactly what happens: “Pay EC$95”.']},
  {t:'Link the flow: <b>Next</b> → Pick a date, and Pick a date’s button → Confirm.',c:()=>{const a=P.screens[0],b=Q.by(/^pick a date$/i),c=Q.by(/^confirm$/i);if(!b||!c)return 'Make both wireframes first.';if(!a.ctrls.some(x=>x.link===b.id))return 'Link a control on Choose a tour to Pick a date.';return b.ctrls.some(x=>x.link===c.id)||'Link a control on Pick a date to Confirm.'},h:['Select a button ▸ Property Inspector ▸ 🔗 Link.'],show:['#ip-link']},
  {t:'Give <b>Confirm</b> a way back: link a control (the app bar’s back arrow is ideal) to <b>Go back</b>.',c:()=>{const b=Q.by(/^pick a date$/i),c=Q.by(/^confirm$/i);return (c&&c.ctrls.some(x=>x.link==='back'||(b&&x.link===b.id)))||'Nothing on Confirm leads back.'},h:['Users must always be able to undo a step (user control and freedom).','Select Confirm’s App Bar ▸ 🔗 Link ▸ ↩ Go back.'],show:['#ip-link']},
  {t:'Test it: <b>▶ Present</b> from the first screen and click all the way to Confirm.',c:()=>{const b=Q.by(/^pick a date$/i),c=Q.by(/^confirm$/i);return (b&&c&&Q.pv(b.id)&&Q.pv(c.id))||'Click through Pick a date and Confirm in Present mode.'},h:['Open Choose a tour, press ▶ Present, then click Next and the next button.'],show:['[data-cmd="present"]']},
 ]},
{id:'annotate',level:2,title:'Annotate for the developer',unit:'Unit 1 · Module 3 · Wireframes, mock-ups and prototypes (annotation)',
 brief:'<b>Roseau Market Days</b> lets shoppers in Dominica pre-order ground provisions for Saturday pick-up. Your wireframe goes to a developer in Guyana who has never seen the market. Add <b>markup</b> — numbered callouts and notes — so nothing is misunderstood.',
 setup:()=>proj('Roseau Market Days',[newScreen('Basket',[phoneAt(40,24),mk('appbar',52,68,276,52,'Your basket'),mk('list',64,132,252,108,'Dasheen x2\nGreen plantain x3\nCassava bread x1'),mk('textinput',64,256,252,36,'Pick-up time (Saturday)'),mk('toggle',64,306,252,30,'Text me when it is ready'),mk('button',64,470,252,48,'Place order')])]),
 steps:[
  {t:'Add numbered <b>Callouts</b> 1, 2 and 3, each next to a different control.',c:()=>{const s=scr();const cs=Q.of(s,'callout').filter(c=>/^[123]$/.test(norm(c.t)));const nums=new Set(cs.map(c=>norm(c.t)));if(nums.size<3)return 'You need callouts numbered 1, 2 and 3.';const ctl=s.ctrls.filter(c=>!MARKUP.includes(c.type)&&!FRAMES.includes(c.type));const near=new Set();for(const n of ['1','2','3']){const c=cs.find(x=>norm(x.t)===n);let best=null,bd=1e9;for(const o of ctl){const d=Q.gap(c,o);if(d<bd){bd=d;best=o}}if(best&&bd<=30)near.add(best.id)}return near.size>=3||'Move each callout so it touches (or sits within 30 px of) a different control.'},h:['Callouts are numbered automatically: 1, 2, 3…','Add a Callout and drag it onto the edge of the list; repeat for the time box and the button.'],show:['[data-lib="callout"]']},
  {t:'Add a <b>Sticky Note</b> that explains callouts 1, 2 and 3 (at least 12 words).',c:()=>Q.of(scr(),'sticky').some(c=>Q.words(c.t)>=12&&/1/.test(c.t)&&/2/.test(c.t)&&/3/.test(c.t))||'The sticky note needs notes for 1, 2 and 3 (12+ words).',h:['Example: 1. Quantities can be changed. 2. Only Saturday times 7–11 am. 3. Button stays grey until a time is chosen.'],show:['[data-lib="sticky"]']},
  {t:'Add an <b>Arrow</b> from the note towards the phone.',c:()=>Q.of(scr(),'arrow').length>0||'No arrow yet.',h:['Arrows are markup too: they never appear in the finished design.'],show:['[data-lib="arrow"]']},
  {t:'Copy the key points into this wireframe’s <b>Notes</b> (click empty canvas ▸ Property Inspector ▸ Notes, 8+ words).',c:()=>Q.words(scr().notes||'')>=8||'The wireframe notes are empty or too short.',h:['Click an empty part of the canvas so nothing is selected; the Inspector then shows the wireframe’s own settings.'],show:['#ip-snotes']},
  {t:'Export a <b>PNG without markup</b> to see the clean design (untick “Include markup”).',c:()=>(S.ev.exported==='png'&&S.ev.expMarkup===false)||'Export a PNG of this wireframe with markup switched off.',h:['Project ▸ Export… (Ctrl+E) ▸ PNG picture ▸ untick Include markup ▸ Export.'],show:['[data-menu="project"]']},
 ]},
{id:'web-page',level:2,title:'Desktop web page wireframe',unit:'Unit 2 · Module 2 · Prototypes using design principles (wireframes and layout)',
 brief:'<b>Breadfruit Breeze</b> is a family guest house in Oistins, Barbados. Owner <b>Marcia Clarke</b> wants a new website and asks for the <b>home page wireframe</b> on a desktop screen: navigation, a big hero picture, three room cards, a booking button and a footer.',
 setup:()=>proj('Breadfruit Breeze website',[newScreen('Home',[mk('browser',24,24,900,660,'https://www.breadfruitbreeze.bb')])]),
 steps:[
  {t:'A <b>Nav Bar</b> near the top of the browser with at least 4 pages.',c:()=>{const b=Q.frame(scr(),'browser');return Q.inPh(scr(),'navbar','browser').some(c=>itemsOf(c).length>=4&&c.y<b.y+140)||'Add a nav bar with 4+ items near the top of the browser.'},h:['Select the Browser Window first so the nav bar lands inside it.','Items e.g. Home, Rooms, Things to do, Book.'],show:['[data-lib="navbar"]']},
  {t:'A hero <b>Image</b> at least <b>60%</b> of the browser’s width.',c:()=>{const b=Q.frame(scr(),'browser');return Q.inPh(scr(),'image','browser').some(c=>c.w>=b.w*.6)||'The hero image must be at least 540 px wide.'},h:['Set W to 600 or more in the Property Inspector.'],show:['#ip-w']},
  {t:'Three equal <b>Image</b> cards in a row (same width, tops lined up).',c:()=>{const b=Q.frame(scr(),'browser');const im=Q.inPh(scr(),'image','browser').filter(c=>c.w<b.w*.5);return Q.row(im,3)||'Make three images of the same width with their tops lined up, side by side.'},h:['Make one card, then Duplicate it (Ctrl+D) twice and drag the copies sideways: pink guides show when edges line up.','Select all three ▸ Align top edges ▸ Distribute horizontally.'],show:['[data-lib="image"]']},
  {t:'A <b>Book now</b> button.',c:()=>Q.inPh(scr(),'button','browser').some(c=>Q.has(c,/book now/i))||'Add a Book now button inside the browser.',h:['The call to action should stand out: give it room.'],show:['[data-lib="button"]']},
  {t:'A footer: a <b>Text</b> control near the bottom of the browser with <b>Contact</b> details.',c:()=>{const b=Q.frame(scr(),'browser');return scr().ctrls.some(c=>['label','paragraph'].includes(c.type)&&Q.inF(c,b)&&/contact/i.test(c.t)&&c.y>b.y+b.h-150)||'Add contact text in the bottom 150 px of the browser.'},h:['e.g. “Contact: Oistins Main Road · 246-555-0142”. Move it down with Y.'],show:['[data-lib="label"]']},
 ]},
/* ===== Level 3 · Challenge ===== */
{id:'usability-fix',level:3,time:600,title:'Spot and fix the usability problems',unit:'Unit 2 · Module 3 · Factors that impact the mobile user experience (usability testing)',
 brief:'<b>Roti Rocket</b> delivers roti in San Fernando, Trinidad. Five testers tried the checkout wireframe and said: <i>“I couldn’t find Pay.” “Pay looked greyed out.” “My thumb kept missing it.” “What do I type in these boxes?” “I couldn’t go back to change my order.”</i> Fix every problem, then record your findings.',
 setup:()=>proj('Roti Rocket checkout',[newScreen('Checkout',[phoneAt(40,24),mk('appbar',52,68,276,52,'Checkout',{back:false,menu:false}),mk('button',256,128,60,24,'Pay',{state:'disabled',size:13}),mk('textinput',64,196,252,36,''),mk('textinput',64,248,252,36,''),mk('dropdown',64,300,252,36,'Pick-up or delivery'),mk('label',64,352,252,26,'Total: TT$85',{bold:true}),mk('list',64,392,252,96,'Doubles x2\nChicken roti x1\nSorrel x1')])]),
 steps:[
  {t:'Make <b>Pay</b> easy to hit: at least <b>120 × 44 px</b>.',c:()=>{const b=Q.of(scr(),'button').find(c=>Q.has(c,/pay/i));return (b&&b.w>=120&&b.h>=44)||'Pay is still too small (W ≥ 120, H ≥ 44).'},h:['Use the W and H boxes, or drag a corner handle.']},
  {t:'Move <b>Pay</b> into the thumb zone: the bottom third of the phone screen.',c:()=>{const f=Q.frame(scr());const r=Q.inner(f);const b=Q.of(scr(),'button').find(c=>Q.has(c,/pay/i));return (b&&ctr(b).y>=r.y+r.h*2/3&&Q.fully(b,r))||'Pay must sit low on the screen, fully inside the phone.'},h:['The list may need to move up a little to make room.']},
  {t:'Make <b>Pay</b> look usable: State <b>Normal</b>, not Disabled.',c:()=>{const b=Q.of(scr(),'button').find(c=>Q.has(c,/pay/i));return (b&&(b.p.state||'normal')!=='disabled')||'Pay still looks disabled.'},h:['A greyed-out button tells people they cannot use it.']},
  {t:'Every <b>Text Input</b> says what to type (placeholder text).',c:()=>{const t=Q.of(scr(),'textinput');return (t.length>=2&&t.every(c=>norm(c.t).length>=3))||'Give both text inputs placeholder text (e.g. Name, Phone number).'},h:['Empty boxes give no clue: “Name on order”, “Phone number”.']},

function psDate(){try{return new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}
function psJpg(c,max){max=max||1600;const k=Math.min(1,max/Math.max(1,c.width)),o=document.createElement('canvas');o.width=Math.max(1,Math.round(c.width*k));o.height=Math.max(1,Math.round(c.height*k));const x=o.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/jpeg',.8)}
function psImg(cap,src){return `<h3>${esc(cap)}</h3><p><img alt="${esc(cap)}" src="${src}" style="max-width:100%;max-height:820px;border:1px solid #cccccc"></p>`}
function psHead(title,note,tool){return `<p><b>Task:</b> ${esc(title)}<br><b>Tool:</b> ${esc(tool)} · <b>Date:</b> ${esc(psDate())} · Free practice</p>`+(note?`<h3>Note to my teacher</h3><p style="white-space:pre-wrap">${esc(note)}</p>`:'')}
function psAsk(tool,go){
  const t=el('input',{type:'text',id:'ps-title',value:'Free practice · '+tool,placeholder:'e.g. “Paper 02 Question 3 prototype” or “Class task 4 — school club flyer”',maxlength:'120',style:'width:100%;box-sizing:border-box'});
  const n=el('textarea',{id:'ps-note',rows:'3',maxlength:'1000',placeholder:'Anything your teacher should know (optional)',style:'width:100%;box-sizing:border-box;font:inherit;resize:vertical'});
  const body=el('div',{},el('label',{class:'f',for:'ps-title'},'What task is this for?'),t,el('label',{class:'f',for:'ps-note'},'Note to my teacher (optional)'),n,el('p',{class:'tagline',style:'margin:10px 0 0'},'Next you choose how to hand it in: a PDF or Word file, or straight to your teacher.'));
  dialog({title:'📤 Submit my work',width:460,body,buttons:[{label:'Continue',primary:true,onClick:()=>{const v=t.value.trim();if(!v){t.focus();toast('Type what task this is for.');return false}setTimeout(()=>go(v.slice(0,120),n.value.trim().slice(0,1000)),30)}},{label:'Cancel'}]});
  setTimeout(()=>{try{t.focus();t.select()}catch(e){}},40);
}

      '<div class="f"><label>Flag</label><select id="f-flag">' + FLAGS.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === d.flag ? ' selected' : '') + '>' + f[0] + '  ' + esc(f[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label>Subjects in your plan</label><div class="subs">' + SUBJ_ORDER.map(function (k) { return '<label><input type="checkbox" data-sub="' + k + '"' + (d.plan.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(subjName(k)) + '</label>'; }).join('') + '</div></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn big" data-act="save">Enter the arena</button></div>';
  }
  function viewList() {
    var me = S.me, out = '';
    out += '<div class="me">' + avHTML(me.avatar) + '<div class="grow"><div class="nm">' + esc(me.name) + ' ' + esc(me.flag) + '</div><div class="sub">' + esc(me.cls || 'No class') + ' · ' + me.plan.length + ' subject' + (me.plan.length === 1 ? '' : 's') + '</div></div>' + (me.locked ? '' : '<button class="btn2" data-act="edit">Edit</button>') + '</div>';
    out += '<label>Challenge subject</label><select id="subj">' + me.plan.map(function (k) { return '<option value="' + k + '"' + (k === S.subject ? ' selected' : '') + '>' + esc(subjName(k)) + '</option>'; }).join('') + '</select>';
    var live = S.conn === 'live' || S.conn === 'local';
    var ids = Object.keys(S.players).filter(function (k) { return S.filter === 'all' || (S.players[k].user.cls || '').toLowerCase() === (me.cls || '').toLowerCase(); });
    ids.sort(function (a, b) { var A = S.players[a], B = S.players[b]; return (A.status === 'match') - (B.status === 'match') || A.user.name.localeCompare(B.user.name); });
    out += '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Everyone</button><button class="chip ' + (S.filter === 'class' ? 'on' : '') + '" data-filter="class">My class</button></div>';
    out += '<div class="status"><i class="' + (live ? '' : 'off') + '"></i>' + (live ? ids.length + ' in the arena now · updates every few seconds' : S.conn === 'error' ? 'Can\'t reach the arena. Retrying…' : 'Connecting…') + '</div>';
    if (S.host) out += viewLobby();
    if (S.pendingJoin) out += '<div class="card"><h3>Joining ' + esc(S.pendingJoin.name) + '\'s match…</h3><div class="sub">Hang tight.</div></div>';
    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
