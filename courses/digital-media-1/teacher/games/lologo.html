<!-- gamesave:start --><script id="gamesave-kit">
/* GameSave: every game remembers its progress on this device, and can start over. Developed by Kester Small
   API (window.GameSave):
     GameSave.id                      this game's id (from <html data-game="…">, else the page name)
     GameSave.register(['key', 'prefix*', /regex/])   storage keys that belong to this game (also caught automatically when set with localStorage.setItem)
     GameSave.persist({ key, get, set, every })       save get() under key (on every save(), every `every` ms, and when the page is hidden); on load call set(saved) once
     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)
     GameSave.onReset(fn)             run fn before the page reloads after a reset
     GameSave.startOver()             ask "Start over?" and, if confirmed, clear this game's saved progress and reload
     GameSave.reset({reload})         clear without asking
   Inside the course the player bar shows "↺ Start over"; on its own page a small "↺ Start over" button appears unless
   <html data-gs-own> says the game already has its own visible reset (which should call GameSave.startOver()). */
(function () {
  if (window.GameSave) return;
  var LS = null; try { LS = window.localStorage; LS.getItem('gs:probe'); } catch (e) { LS = null; }
  var html = document.documentElement;
  var page = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
  var id = html.getAttribute('data-game') || page;
  if (!id || /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(id)) id = (document.title || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'game';
  var REG = 'gs:keys:' + id;
  var SKIP = /^(gs:|ws\.|course\.|nocopy|simsave)/;
  var keys = []; try { keys = JSON.parse((LS && LS.getItem(REG)) || '[]') || []; } catch (e) { keys = []; }
  var patterns = [], hooks = [], persisters = [], rawSet = null;
  function track(k) {
    k = String(k); if (!LS || SKIP.test(k) || keys.indexOf(k) >= 0) return;
    keys.push(k); try { (rawSet || LS.setItem).call(LS, REG, JSON.stringify(keys)); } catch (e) { }
  }
  if (LS) {
    try {
      var proto = Object.getPrototypeOf(LS); rawSet = proto.setItem;
      proto.setItem = function (k, v) { var r = rawSet.apply(this, arguments); if (this === LS) track(k); return r; };
    } catch (e) { rawSet = null; }
  }
  function matches(k) {
    if (keys.indexOf(k) >= 0) return true;
    return patterns.some(function (p) { return p instanceof RegExp ? p.test(k) : (p.slice(-1) === '*' ? k.indexOf(p.slice(0, -1)) === 0 : k === p); });
  }
  function owned() { var out = []; if (!LS) return out; for (var i = 0; i < LS.length; i++) { var k = LS.key(i); if (k && !SKIP.test(k) && matches(k)) out.push(k); } return out; }
  var resetting = false;
  function reset(opt) {
    opt = opt || {}; resetting = true;
    hooks.forEach(function (fn) { try { fn(); } catch (e) { } });
    owned().forEach(function (k) { try { LS.removeItem(k); } catch (e) { } });
    persisters.forEach(function (p) { try { LS.removeItem(p.key); } catch (e) { } });
    try { LS.removeItem(REG); } catch (e) { }
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'gs:reset-done', id: id }, '*'); } catch (e) { }
    if (opt.reload !== false) setTimeout(function () { location.reload(); }, 60);
  }
  function css() {
    if (document.getElementById('gs-css')) return;
    var st = document.createElement('style'); st.id = 'gs-css';
    st.textContent = '.gs-modal{position:fixed;inset:0;z-index:2147483600;display:grid;place-items:center;padding:16px;background:rgba(3,8,24,.62);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}' +
      '.gs-box{max-width:420px;width:100%;background:#0F1E4A;color:#F1F4FF;border:2px solid #F5C542;border-radius:16px;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}' +
      '.gs-box h2{margin:0 0 8px;font-size:1.2rem;color:#FFE38A}.gs-box p{margin:0 0 14px}' +
      '.gs-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}' +
      '.gs-row button{font:700 14px system-ui,sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer;border:2px solid #F5C542}' +
      '.gs-keep{background:transparent;color:#F1F4FF}.gs-go{background:#F5C542;color:#0A1433}' +
      '.gs-row button:focus-visible{outline:3px solid #fff;outline-offset:2px}' +
      '.gs-pill{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483500;font:700 12px/1 system-ui,sans-serif;color:#fff;background:rgba(10,20,51,.85);border:1px solid rgba(245,197,66,.7);border-radius:99px;padding:7px 11px;cursor:pointer;opacity:.6}' +
      '.gs-pill:hover,.gs-pill:focus-visible{opacity:1;background:#F5C542;color:#0A1433}' +
      '.gs-toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:2147483550;background:#0F1E4A;color:#F1F4FF;border:1px solid #F5C542;border-radius:99px;padding:8px 16px;font:700 13px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .4s}' +

    var t = document.createElement('div'); t.className = 'gs-toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; }, 2600); setTimeout(function () { t.remove(); }, 3100);
  }

    if (!document.body) return reset();
    if (document.querySelector('.gs-modal')) return;
    css();
    var prev = document.activeElement;
    var m = document.createElement('div'); m.className = 'gs-modal';
    m.innerHTML = '<div class="gs-box" role="alertdialog" aria-modal="true" aria-labelledby="gs-t" aria-describedby="gs-d"><h2 id="gs-t">Start this game again?</h2>' +
      '<p id="gs-d">Your saved progress in this game on this device will be cleared and the game will start from the beginning. Work you have already submitted and your course progress are not affected.</p>' +
      '<div class="gs-row"><button type="button" class="gs-keep">Keep my progress</button><button type="button" class="gs-go">↺ Start over</button></div></div>';
    document.body.appendChild(m);
    var keep = m.querySelector('.gs-keep'), go = m.querySelector('.gs-go');
    function close() { m.remove(); document.removeEventListener('keydown', onKey, true); try { prev && prev.focus && prev.focus(); } catch (e) { } }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } if (e.key === 'Tab') { e.preventDefault(); (document.activeElement === keep ? go : keep).focus(); } }
    keep.addEventListener('click', close); go.addEventListener('click', function () { close(); reset(); });
    m.addEventListener('click', function (e) { if (e.target === m) close(); });
    document.addEventListener('keydown', onKey, true); keep.focus();
  }
  function saveAll() {
    if (resetting || !LS) return;
    persisters.forEach(function (p) { try { var v = p.get(); if (v !== undefined) (rawSet || LS.setItem).call(LS, p.key, JSON.stringify({ v: v, at: Date.now() })); } catch (e) { } });
  }
  function persist(o) {
    if (!o || typeof o.get !== 'function') return false;
    var p = { key: o.key || ('gsave.' + id), get: o.get }; persisters.push(p); track(p.key);
    var restored = false;
    if (LS && typeof o.set === 'function') {
      try { var raw = LS.getItem(p.key); if (raw) { var d = JSON.parse(raw); if (d && 'v' in d) { o.set(d.v); restored = true; } } } catch (e) { }
    }
    if (o.every) setInterval(saveAll, Math.max(2000, +o.every || 0));
    if (restored && o.welcome !== false) setTimeout(function () { toast('Welcome back! Your progress was restored.'); }, 400);
    return restored;
  }
  window.addEventListener('pagehide', saveAll);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveAll(); });
  window.addEventListener('message', function (e) { var d = e.data; if (d && d.type === 'gs:reset') { if (d.ask === false) reset(); else startOver(); } });
  function pill() {
    if (window.parent !== window || html.hasAttribute('data-gs-own') || html.hasAttribute('data-gs-none') || !document.body || document.querySelector('.gs-pill')) return;
    css(); var b = document.createElement('button'); b.type = 'button'; b.className = 'gs-pill'; b.textContent = '↺ Start over'; b.title = 'Clear your saved progress in this game and start again';
    b.addEventListener('click', startOver); document.body.appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pill); else pill();
  window.GameSave = {
    id: id,
    register: function (list) { (Array.isArray(list) ? list : [list]).forEach(function (k) { if (k instanceof RegExp || (typeof k === 'string' && k.slice(-1) === '*')) patterns.push(k); else if (k) track(k); }); },
    persist: persist, save: saveAll, onReset: function (fn) { if (typeof fn === 'function') hooks.push(fn); },
    startOver: startOver, reset: reset, keys: owned, toast: toast
  };
})();

<script>
/* Early setup: theme + mobile mode, before first paint */
(function(){
  var t = null;
  try { t = localStorage.getItem('lologo-theme'); } catch (e) {}
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  function isMobile(){
    var coarse = false, noHover = false;
    try { coarse = matchMedia('(pointer: coarse)').matches; noHover = matchMedia('(hover: none)').matches; } catch (e) {}
    return coarse || ((navigator.maxTouchPoints || 0) > 0 && noHover) || window.innerWidth <= 500;
  }
  window.__isMobile = isMobile;
  document.documentElement.classList.toggle('mobile', isMobile());
})();
</script>
<style>
:root{
  --teal:#0B5D6B; --sea:#2FB7A9; --sun:#FFC23C; --flame:#E5482F; --sand:#FFF6E6;
  --cream:#FFE8C4; --ink:#13262B; --mist:#EEF3F2; --green:#2E9E5B;
  --bg:var(--sand); --surface:#FFFFFF; --surface-2:var(--mist); --text:var(--ink); --muted:#53656A;
  --line:rgba(19,38,43,.10); --line-strong:rgba(19,38,43,.22);
  --primary:var(--teal); --on-primary:#FFFFFF; --price:var(--flame); --accent-soft:#E6F4F2;
  --tile:radial-gradient(120% 100% at 50% 30%, #FFF7E8 0%, #FFE8C4 70%, #F8D9A8 100%);
  --shadow:0 8px 24px rgba(11,93,107,.10), 0 1px 3px rgba(19,38,43,.07);
  --shadow-lg:0 18px 40px rgba(11,93,107,.18), 0 2px 6px rgba(19,38,43,.08);
  --r:18px; --g:16px;
  --map-land:#E4EFE6; --map-block:#D3E5D8; --map-road:#FFFFFF; --map-sea:#9EDCD4;
  --canvas-a:#CDEBE6; --canvas-b:#8FCFC6; --canvas-c:#5DB5AA;
  --sb:54px; --tabh:66px;
  --font:"Poppins", system-ui, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0E1D21; --surface:#162A2F; --surface-2:#1E373D; --text:#EAF3F1; --muted:#A3B8BA;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.26);
  --primary:#2FB7A9; --on-primary:#06282D; --price:#FF7C64; --accent-soft:#183F44;
  --tile:radial-gradient(120% 100% at 50% 30%, #2E4A49 0%, #1F3537 75%, #182C2E 100%);
  --shadow:0 8px 24px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 18px 40px rgba(0,0,0,.45);
  --map-land:#1C3337; --map-block:#24424A; --map-road:#3A5A60; --map-sea:#0F4C55;
  --canvas-a:#0F3A40; --canvas-b:#0A2C31; --canvas-c:#061E22;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:radial-gradient(1200px 800px at 70% 20%, var(--canvas-a), var(--canvas-b) 55%, var(--canvas-c));
  -webkit-font-smoothing:antialiased; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; overflow:auto}
button,input,select,textarea{font:inherit;color:inherit}
button,label,select,.chip,.tab{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{font-size:16px}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:10px}
h1:focus,h2:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg{display:block}
img{display:block}

/* ---------- Stage + 3D device ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px 32px;}
.device-wrap{position:relative;perspective:1800px;display:flex;flex-direction:column;align-items:center}
.device{--dev-h:min(860px, calc(100vh - 70px)); position:relative;width:410px;height:var(--dev-h);border-radius:62px;padding:5px;
  background:linear-gradient(140deg,#5f6266 0%,#c9cbce 14%,#8a8d91 30%,#e3e4e6 48%,#7a7d81 64%,#bfc1c4 82%,#626569 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), inset 0 0 3px 1px rgba(0,0,0,.4),
    0 2px 2px rgba(0,0,0,.25), 0 12px 24px rgba(4,30,34,.30), 0 40px 70px rgba(4,30,34,.35), 0 70px 120px rgba(4,30,34,.25);
  transform:rotateX(var(--rx,3deg)) rotateY(var(--ry,-8deg)); transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.8,.2,1); will-change:transform}
.device::after{content:"";position:absolute;inset:2px;border-radius:60px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.side-btn{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#55585c,#d4d6d8 45%,#76797d);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.side-btn.l{left:-4px}.side-btn.r{right:-4px}
.side-btn.action{top:132px;height:32px}.side-btn.vup{top:190px;height:58px}.side-btn.vdown{top:262px;height:58px}.side-btn.power{top:220px;height:92px}
.bezel{position:relative;width:100%;height:100%;border-radius:57px;background:#050708;padding:11px;box-shadow:inset 0 0 0 2px #1b1f22}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:22px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:300;pointer-events:none;box-shadow:inset 0 0 0 1px #111}
.island::after{content:"";position:absolute;right:16px;top:12px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3a55,#0a0d14 60%)}
.glass{position:absolute;inset:0;border-radius:46px;pointer-events:none;z-index:250;
  background:linear-gradient(112deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 22%, rgba(255,255,255,0) 34%, rgba(255,255,255,0) 72%, rgba(255,255,255,.06) 86%, rgba(255,255,255,0) 100%)}
.floor{width:340px;height:36px;margin-top:-18px;border-radius:50%;background:radial-gradient(closest-side, rgba(3,25,29,.45), rgba(3,25,29,0));filter:blur(6px);pointer-events:none}

/* ---------- Prototype panel ---------- */
.panel{width:310px;flex:none;background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow-lg);color:var(--text)}
.panel h2{font-size:20px;margin:10px 0 4px}
.panel p{margin:6px 0;font-size:14px;line-height:1.5;color:var(--muted)}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px;color:var(--muted)}
.panel-brand{display:flex;align-items:center;gap:10px}
.qlinks{display:grid;gap:8px}
.qlink{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;min-height:48px;font-weight:600;font-size:14px}
.qlink small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.qlink .num{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font-size:12px}
.panel-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.panel-note{margin-top:18px!important;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px!important}
.panel .panel-close{display:none}
.proto-btn{display:none;position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:1000;border:0;border-radius:0 14px 14px 0;background:var(--flame);color:#fff;
  font-weight:700;font-size:13px;letter-spacing:.06em;padding:14px 8px;writing-mode:vertical-rl;min-width:44px;box-shadow:var(--shadow)}
.panel-scrim{display:none}
@media (max-width: 900px){
  .stage{gap:0}
  .panel{position:fixed;left:0;top:0;bottom:0;z-index:1001;border-radius:0 24px 24px 0;overflow:auto;transform:translateX(-105%);transition:transform .3s ease;width:min(320px,86vw)}
  .panel.open{transform:none}
  .panel .panel-close{display:inline-grid}
  .proto-btn{display:block}
  .panel-scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000}
}
/* Real phones: full-screen app, no chrome */
html.mobile body{overflow:hidden;background:var(--bg)}
html.mobile .stage{display:block;padding:0;min-height:0}
html.mobile .panel, html.mobile .proto-btn, html.mobile .panel-scrim, html.mobile .floor,
html.mobile .side-btn, html.mobile .island, html.mobile .glass, html.mobile .statusbar{display:none!important}
html.mobile .device-wrap{display:block;perspective:none}
html.mobile .device{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;background:var(--bg);box-shadow:none;transform:none!important;transition:none}
html.mobile .device::after{display:none}
html.mobile .bezel{padding:0;border-radius:0;background:var(--bg);box-shadow:none}
html.mobile .screen-wrap{border-radius:0}
html.mobile #app{--sb:env(safe-area-inset-top, 0px)}

/* ---------- App shell ---------- */
#app{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:240;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:15px;color:var(--text);pointer-events:none}
.sb-icons{display:flex;gap:6px;align-items:center}
.sb-icons svg{fill:currentColor}
#screens{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:var(--sb);transition:transform .34s cubic-bezier(.2,.8,.2,1), opacity .34s ease;will-change:transform}
.screen.current{z-index:2}
.screen.enter-fwd{transform:translateX(100%)}
.screen.enter-back{transform:translateX(-28%);opacity:.6}
.screen.enter-fade{opacity:0;transform:translateY(10px)}
.screen.leave-fwd{transform:translateX(-28%);opacity:.6;z-index:1}
.screen.leave-back{transform:translateX(100%);z-index:3;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.screen.leave-fade{opacity:0;z-index:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.screen.has-tabs .scroll{padding-bottom:calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px))}
.screen:not(.has-tabs) .scroll{padding-bottom:24px}
.pad{padding-left:var(--g);padding-right:var(--g)}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.h-xl{font-size:24px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.h-lg{font-size:20px;line-height:1.25;margin:0 0 6px;font-weight:700}
.h-md{font-size:17px;margin:0;font-weight:700}
.h-sm{font-size:15px;margin:0;font-weight:700}
.price{color:var(--price);font-weight:700}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.section{margin:22px var(--g) 0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.section-h h2{font-size:18px;margin:0;font-weight:700}
.ic{flex:none}

/* Header */
.hdr{display:flex;align-items:center;gap:10px;padding:10px var(--g) 8px;min-height:62px;position:relative;z-index:5}
.hdr .grow{flex:1;min-width:0}
.hdr.overlay{position:absolute;top:var(--sb);left:0;right:0;z-index:10;justify-content:space-between}
.screen[data-screen="lolo"],.screen[data-screen="dish"]{padding-top:0}
.screen[data-screen="lolo"] .lolo-hero{height:calc(210px + var(--sb))}
.screen[data-screen="dish"] .dish-hero{height:calc(250px + var(--sb));padding-top:calc(20px + var(--sb))}
.screen[data-screen="splash"]{background:#0B5D6B}
#app[data-screen="splash"] .statusbar,#app[data-screen="lolo"] .statusbar{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
#app[data-screen="lolo"] .sb-icons svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.iconbtn[aria-pressed="true"]{color:var(--flame)}
.iconbtn[aria-pressed="true"] svg{fill:var(--flame)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 18px;min-height:48px;font-weight:600;font-size:15px;line-height:1.2;background:var(--surface-2);color:var(--text);text-decoration:none;transition:transform .12s ease, filter .15s}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px rgba(11,93,107,.25)}
.btn.flame{background:var(--flame);color:#fff;box-shadow:0 6px 16px rgba(229,72,47,.3)}
.btn.ghost{background:transparent;border:1.5px solid var(--line-strong)}
.btn.text{background:transparent;min-height:44px;padding:8px 10px;color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.btn.small{min-height:44px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;box-shadow:none}
button:not(:disabled):active, label.opt:active, .press:active{transform:scale(.97)}
.danger{color:var(--flame)}

/* Splash / onboarding / auth */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(500px 420px at 50% 38%, #137080, var(--teal) 60%, #084651);color:#fff}
.splash-logo{filter:drop-shadow(0 18px 30px rgba(0,0,0,.3));animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.wordmark{font-size:44px;margin:22px 0 4px;font-weight:800;letter-spacing:-.02em}
.wordmark span{color:var(--sun)}
.tagline{margin:0;font-size:17px;opacity:.9}
.splash-foot{position:absolute;left:24px;right:24px;bottom:calc(36px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;text-align:center}
.splash .btn.primary{background:var(--sun);color:var(--ink)}
.splash .tiny{opacity:.75}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ob{flex:1;display:flex;flex-direction:column;min-height:0}
.ob-top{position:relative;display:flex;justify-content:center;align-items:center;padding:14px var(--g) 4px;min-height:72px}
.ob-top .btn{position:absolute;right:8px;top:14px}
.ob-viewport{flex:1;overflow:hidden;min-height:0}
.ob-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ob-slide{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 28px;text-align:center;min-height:0}
.ob-art{width:min(270px,72%);aspect-ratio:1;border-radius:50%;background:var(--tile);display:grid;place-items:center;box-shadow:inset 0 -10px 30px rgba(0,0,0,.06);margin-bottom:22px;flex:none;max-height:44vh}
.ob-art svg{width:84%;height:84%}
.ob-title{font-size:24px;margin:0 0 8px;font-weight:700}
.ob-text{margin:0;color:var(--muted);max-width:300px}
.ob-foot{padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.dots{display:flex;justify-content:center;gap:4px}
.dotbtn{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.dotbtn span{width:9px;height:9px;border-radius:5px;background:var(--line-strong);transition:width .25s, background .25s}
.dotbtn[aria-current="true"] span{width:26px;background:var(--primary)}
.auth{padding:12px 24px 24px;max-width:420px;margin:0 auto;display:grid;gap:14px}
.auth-logo{display:flex;justify-content:center;padding:18px 0 8px}
.field{display:grid;gap:6px}
.field label,.flabel{font-weight:600;font-size:14px}
.input,.field input,.field textarea,.field select{width:100%;min-height:50px;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--surface);padding:12px 14px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus,.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,183,169,.25)}
.field textarea{min-height:84px;resize:vertical}
.phone-in{display:flex;align-items:stretch;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--surface);overflow:hidden}
.phone-in:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,183,169,.25)}
.phone-in .cc{display:flex;align-items:center;padding:0 12px;background:var(--surface-2);font-weight:600;white-space:nowrap}
.phone-in input{border:0!important;box-shadow:none!important;border-radius:0;min-width:0}
.prefix-in{display:flex;align-items:stretch;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--surface);overflow:hidden}
.prefix-in:focus-within{border-color:var(--primary)}
.prefix-in span{display:flex;align-items:center;padding:0 0 0 14px;color:var(--muted);white-space:nowrap}
.prefix-in input{border:0!important;box-shadow:none!important;padding-left:6px!important;min-width:0}
.err{color:var(--flame);font-size:13px;margin:0;min-height:0;font-weight:500}
.err:empty{display:none}
.demo-code{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent-soft);border:1.5px dashed var(--sea);border-radius:16px;padding:12px}
.demo-code strong{font-size:22px;letter-spacing:.3em;color:var(--primary)}
.code{border:0;padding:0;margin:0;display:flex;justify-content:center;gap:12px}
.code-box{width:58px;height:64px;text-align:center;font-size:26px!important;font-weight:700;border:1.5px solid var(--line-strong);border-radius:16px;background:var(--surface);outline:none}
.code-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,183,169,.25)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* Home */
.home-hdr{padding-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:600;box-shadow:var(--shadow);color:var(--text)}
.pill .ic{color:var(--flame)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--sun),#ffb020);color:var(--ink);font-weight:700;border:0;flex:none}
.greet{padding:4px var(--g) 0}
.greet p{margin:0}
.searchbar{display:flex;align-items:center;gap:10px;width:calc(100% - 2*var(--g));margin:14px var(--g) 0;min-height:52px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:0 16px;color:var(--muted);text-align:left;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px var(--g) 4px;scrollbar-width:none;scroll-padding:0 var(--g)}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:0 16px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.promo{position:relative;display:flex;align-items:center;gap:12px;width:calc(100% - 2*var(--g));margin:18px var(--g) 0;border:0;border-radius:20px;padding:18px;background:linear-gradient(120deg,#0B5D6B,#138A8E 60%,#2FB7A9);color:#fff;text-align:left;overflow:hidden;box-shadow:var(--shadow)}
.promo::before{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,194,60,.25)}
.promo-txt{position:relative;flex:1;min-width:0}
.promo-txt strong{display:block;font-size:16px;line-height:1.3}
.promo-code{display:inline-block;margin-top:8px;background:var(--sun);color:var(--ink);font-weight:700;border-radius:8px;padding:3px 9px;font-size:13px;letter-spacing:.04em}
.promo-art{position:relative;width:86px;height:86px;flex:none}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px var(--g) 14px;margin:0 calc(-1*var(--g));scroll-snap-type:x mandatory;scroll-padding:0 var(--g);scrollbar-width:none}
.lcard{flex:0 0 232px;scroll-snap-align:start;border:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;color:var(--text)}
.lcard-img{position:relative;height:112px;background:#cfe}
.lcard-img svg{width:100%;height:100%}
.lcard-body{display:grid;gap:3px;padding:12px 16px 16px}
.lcard-name{font-size:15px}
.meta{display:flex;align-items:center;gap:4px;color:var(--muted);flex-wrap:wrap}
.meta .star{color:#F2A900;fill:#F2A900}
.ic.star{display:inline-block;vertical-align:-2px;fill:#F2A900}
.badge-closed,.tag-closed{display:inline-block;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 8px}
.badge-closed{position:absolute;left:10px;top:10px}
.tag-sold{display:inline-block;background:var(--flame);color:#fff;font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:4px;vertical-align:1px}
.tag-closed{margin-left:4px}
.list{display:grid;gap:12px}
.drow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 12px 12px;text-align:left;color:var(--text)}
.drow[data-sold="1"] .tile{filter:grayscale(.8);opacity:.7}
.tile{width:76px;height:76px;flex:none;border-radius:16px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.tile svg{width:92%;height:92%}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.sm{width:52px;height:52px;border-radius:12px}
.drow-txt{flex:1;min-width:0;display:grid;gap:2px}
.drow-txt strong{font-size:15px;line-height:1.3}
.drow-txt .muted{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drow-price{color:var(--price);font-weight:700;font-size:14.5px;margin-top:2px}
.drow-add{width:34px;height:34px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty .tile{margin:0 auto 12px;width:110px;height:110px;border-radius:50%}

/* Lolo page */
.lolo-hero{position:relative;height:210px}
.lolo-hero svg{width:100%;height:100%}
.lolo-info{position:relative;margin:-42px var(--g) 0;z-index:3}
.lolo-info h1{font-size:23px;margin:0 0 2px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 10px}
.status.open{background:rgba(46,158,91,.14);color:var(--green)}
.status.closed{background:rgba(229,72,47,.12);color:var(--flame)}
:root[data-theme="dark"] .status.open{color:#5fd08f}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:var(--surface-2);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;color:var(--muted)}
.fact strong{display:block;color:var(--text);font-size:14.5px}
.notice{display:flex;gap:12px;align-items:flex-start;margin:14px var(--g) 0;padding:14px 16px;border-radius:16px;background:rgba(229,72,47,.10);color:var(--text);border:1.5px solid rgba(229,72,47,.35)}
.notice .ic{color:var(--flame);margin-top:2px}
.notice.info{background:var(--accent-soft);border-color:rgba(47,183,169,.45)}
.notice.info .ic{color:var(--primary)}
.menu-sec h2{font-size:18px;margin:24px 0 12px}
.bagbar{padding:12px var(--g) calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 20px rgba(0,0,0,.06)}
.bagbar .btn{justify-content:space-between}
.count{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);font-size:13px;padding:0 6px}

/* Dish */
.dish-hero{height:250px;background:var(--tile);display:grid;place-items:center;overflow:hidden;padding-top:20px}
.dish-hero svg{width:250px;height:250px}
.dish-hero img{width:100%;height:100%;object-fit:cover}
.dish-head{margin-top:-26px;position:relative}
.dish-head h1{font-size:22px}
.price-lg{color:var(--price);font-weight:800;font-size:20px;margin:6px 0 0}
fieldset.card{border:0;margin:14px 0 0;min-width:0}
fieldset.card legend{float:left;width:100%;padding:0;margin:0 0 10px}
fieldset.card legend + *{clear:both}
.opt-list{display:grid;gap:8px;clear:both}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;position:relative;transition:transform .12s, border-color .15s}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;transition:border .15s}
.opt .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center;color:transparent}
.opt-l{flex:1;font-weight:500}
.opt-p{color:var(--muted);font-size:13.5px;font-weight:600}
.opt:has(input:checked){border-color:var(--primary);background:var(--accent-soft)}
.opt:has(input:checked) .dot{border:7px solid var(--primary)}
.opt:has(input:checked) .chk{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.opt:has(input:focus-visible){outline:3px solid var(--sun);outline-offset:2px}
.opt:has(input:disabled){opacity:.5;cursor:not-allowed}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:14px;padding:2px}
.stepper button{width:44px;height:44px;border:0;border-radius:12px;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--text)}
.stepper output{min-width:30px;text-align:center;font-weight:700}
.stepper.sm button{width:44px;height:44px}
.foot{padding:12px var(--g) calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 20px rgba(0,0,0,.06);z-index:4}

/* Bag / checkout */
.bag-line{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.bag-line:last-child{border-bottom:0;padding-bottom:0}
.bag-line:first-child{padding-top:0}
.bag-line .tile{width:64px;height:64px}
.bag-line h3{font-size:15px;margin:0}
.bag-line .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.bag-line .ctl .price{white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.seg button{min-height:46px;border:0;border-radius:12px;background:transparent;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--primary)}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-weight:800;font-size:17px;border-top:1px dashed var(--line-strong);padding-top:10px;margin-top:4px}
.promo-form{display:flex;gap:8px}
.promo-form input{flex:1;min-width:0}
.applied{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(46,158,91,.12);border-radius:12px;padding:6px 6px 6px 12px;color:var(--green);font-weight:600}
:root[data-theme="dark"] .applied{color:#5fd08f}
.co-sec{margin:16px var(--g) 0}
.co-sec > h2{font-size:16px;margin:0 0 10px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addr-new{display:grid;gap:10px;margin-top:10px}

/* Tracking */
.track-hero{margin:4px var(--g) 0;padding:18px;border-radius:20px;background:linear-gradient(130deg,#0B5D6B,#137F86);color:#fff;box-shadow:var(--shadow)}
.track-hero h2{margin:0;font-size:22px}
.track-hero p{margin:4px 0 0;opacity:.9}
.mapcard{margin:14px var(--g) 0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--map-land)}
.mapcard svg{width:100%;height:auto}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line-strong)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--green)}
.sdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:2px solid var(--line-strong)}
.done .sdot{background:var(--green);border-color:var(--green);color:#fff}
.now .sdot{background:var(--sun);border-color:var(--sun);color:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,194,60,.6)}100%{box-shadow:0 0 0 12px rgba(255,194,60,0)}}
.steps strong{display:block;font-size:15px}
.steps span{font-size:13px;color:var(--muted)}
.pickup-code{display:flex;align-items:center;gap:14px}
.pickup-code b{font-size:34px;letter-spacing:.12em;color:var(--primary)}
.skip{display:block;margin:12px auto 0}

/* Delivered */
.stars{display:flex;justify-content:center;gap:4px}
.starbtn{width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;color:var(--line-strong);padding:0}
.starbtn svg{fill:currentColor;stroke:none}
.starbtn[aria-pressed="true"]{color:#F2A900}
.tagrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.celebrate{display:grid;place-items:center;text-align:center;padding:10px var(--g) 0}
.celebrate .tile{width:150px;height:150px;border-radius:50%;margin-bottom:10px}

/* Orders */
.ocard{display:grid;gap:12px}
.ocard-top{display:flex;gap:12px;align-items:center}
.ocard-top h3{margin:0;font-size:15.5px}
.ocard-top p{margin:2px 0 0}
.ocard-top > div{flex:1;min-width:0}
.spill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.spill.live{background:rgba(255,194,60,.25);color:#8a5a00}
:root[data-theme="dark"] .spill.live{color:var(--sun)}
.spill.ok{background:rgba(46,158,91,.14);color:var(--green)}
.spill.bad{background:rgba(229,72,47,.12);color:var(--flame)}
.ocard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ocard-foot .btns{display:flex;gap:8px}

/* Profile */
.prof{display:flex;align-items:center;gap:14px}
.prof .avatar{width:60px;height:60px;font-size:22px}
.wallet{background:linear-gradient(130deg,#E5482F,#F07A3A 55%,#FFC23C);color:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px}
.wallet .bal{font-size:28px;font-weight:800;line-height:1.1}
.wallet .btn{background:#fff;color:var(--ink)}
.setlist{padding:6px 18px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow-l{display:grid;gap:1px;flex:1;min-width:0}

.rowbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;background:transparent;text-align:left;font-weight:600;color:var(--text);padding:0;border-bottom:1px solid var(--line)}
.rowbtn:last-child{border-bottom:0}
.rowbtn .grow{flex:1}
.switch{width:60px;height:44px;border:0;background:transparent;position:relative;flex:none;padding:0}
.switch::before{content:"";position:absolute;left:4px;right:4px;top:7px;height:30px;border-radius:15px;background:var(--line-strong);transition:background .2s}
.switch .knob{position:absolute;left:7px;top:10px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]::before{background:var(--green)}
.switch[aria-checked="true"] .knob{transform:translateX(22px)}
.addr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.addr:last-child{border-bottom:0}
.addr .ic{color:var(--primary);margin-top:2px}

/* Owner */
.owner-hero{background:linear-gradient(130deg,#13262B,#0B5D6B);color:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.owner-hero select{width:100%;min-height:48px;border-radius:12px;border:0;padding:0 12px;background:#fff;color:var(--ink);margin-top:8px}
.owner-hero .switch::before{background:rgba(255,255,255,.3)}
.owner-hero .switch[aria-checked="true"]::before{background:var(--green)}
.oacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.oacts .btn{padding:8px 6px;font-size:13px;min-height:44px}
.oacts .btn.done{background:rgba(46,158,91,.14);color:var(--green);opacity:1}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow h3{font-size:14.5px;margin:0}
.photo-actions{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px dashed var(--line-strong);font-weight:600;font-size:13.5px;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}

/* Tab bar + bag FAB */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom, 0px));box-shadow:0 -6px 20px rgba(0,0,0,.06);transition:transform .3s ease}
.tabbar.hidden{transform:translateY(110%)}
.tab{flex:1;max-width:96px;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:14px;padding:4px 0}
.tab .tab-ic{width:48px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] .tab-ic{background:var(--accent-soft)}
.bagfab{position:absolute;right:var(--g);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom, 0px));z-index:31;width:60px;height:60px;border-radius:20px;border:0;background:var(--flame);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(229,72,47,.4)}
.bagfab[hidden]{display:none}
.bagfab .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--sun);color:var(--ink);font-weight:800;font-size:12.5px;display:grid;place-items:center;border:2px solid var(--surface);padding:0 4px}

/* Toasts, notifications, sheets */
.toasts{position:absolute;left:var(--g);right:var(--g);bottom:calc(var(--tabh) + 92px + env(safe-area-inset-bottom,0px));z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:tin .25s ease both;max-width:100%;text-align:center}
:root[data-theme="dark"] .toast{background:#EAF3F1;color:#0E1D21}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.notif{position:absolute;left:10px;right:10px;top:calc(var(--sb) + 8px);z-index:410;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--text);border-radius:20px;padding:12px 12px 12px 12px;box-shadow:var(--shadow-lg);border:1px solid var(--line);
  transform:translateY(calc(-100% - var(--sb) - 20px));transition:transform .35s cubic-bezier(.2,.9,.3,1.1);pointer-events:none}
.notif.show{transform:none;pointer-events:auto}
.notif-txt{flex:1;min-width:0;display:grid;font-size:13.5px}
.notif-txt strong{font-size:14.5px}
.sheet-wrap{position:absolute;inset:0;z-index:500;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-backdrop{position:absolute;inset:0;background:rgba(6,22,26,.5);opacity:0;transition:opacity .28s}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet{position:relative;background:var(--surface);color:var(--text);border-radius:26px 26px 0 0;padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-wrap.open .sheet{transform:none}
.grab{display:flex;justify-content:center;padding:10px 0 14px;cursor:grab;touch-action:none;position:sticky;top:0;background:var(--surface);z-index:2}
.grab span{width:42px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-x{position:absolute;right:12px;top:8px;z-index:3;box-shadow:none;background:var(--surface-2)}
.opt-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;font-weight:600;text-align:left;color:var(--text)}
.opt-btn[aria-checked="true"]{border-color:var(--primary);background:var(--accent-soft);color:var(--primary)}
.a2hs{display:grid;gap:12px;margin:14px 0}
.a2hs > div{background:var(--surface-2);border-radius:16px;padding:14px 16px}
.a2hs ol{margin:6px 0 0;padding-left:20px;font-size:14px}
.about-logo{display:flex;justify-content:center;padding:6px 0 10px}

/* Hotspots */
#app.hotspots button, #app.hotspots a, #app.hotspots input:not([type=radio]):not([type=checkbox]):not([type=file]), #app.hotspots select, #app.hotspots textarea, #app.hotspots label.opt, #app.hotspots label.filebtn{
  outline:2px dashed var(--flame)!important;outline-offset:1px;box-shadow:0 0 0 4px rgba(229,72,47,.15)!important}

/* Banner animation */
.smoke{animation:rise 3.6s ease-in infinite;transform-box:fill-box;transform-origin:center}
.smoke.s2{animation-delay:1.2s}.smoke.s3{animation-delay:2.4s}
@keyframes rise{0%{transform:translateY(10px) scale(.6);opacity:0}25%{opacity:.75}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
.flick{animation:flick .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scaleY(.9)}to{transform:scaleY(1.08) skewX(2deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

}

html.embed,html.embed body{background:transparent;overflow:hidden}

/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

  pts.forEach(([x, y], i) => {

    if (t === 'b') g += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a | 0})"><ellipse rx="2.3" ry="1.5" fill="url(#gBean)"/><ellipse cx="-.6" cy="-.5" rx=".8" ry=".35" fill="#FFFFFF" opacity=".7"/></g>`;

  });
  return `<path d="M13 50 C 16 33, 33 27, 50 27 C 67 27, 84 33, 87 50 A37 11 0 0 1 13 50Z" fill="url(#gRice)"/>${g}

function totals(items, mode, promo){
  items = items || S.bag.items; mode = mode || S.mode; if (promo === undefined) promo = S.promo;
  const sub = r2(items.reduce((s, i) => s + i.unit * i.qty, 0));
  const deliveryBase = mode === 'delivery' ? 3.5 : 0;
  const delivery = promo === 'FIRSTLOLO' ? 0 : deliveryBase;
  const service = items.length ? Math.max(.5, r2(sub * .05)) : 0;
  return {sub, delivery, deliveryBase, service, total: r2(sub + delivery + service)};
}

  ['#screens', '#tabbar', '#bagfab'].forEach(s => $(s).setAttribute('inert', ''));

function bindGrab(wrap){
  const sheet = wrap.querySelector('.sheet'), grab = wrap.querySelector('.grab');
  let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; sheet.style.transition = 'none'; try { grab.setPointerCapture(e.pointerId); } catch (err) {} });
  grab.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; sheet.style.transition = ''; sheet.style.transform = ''; if (dy > 80) closeSheet(); };
  grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
}

/* =========================================================
   Order engine
   ========================================================= */
function stepMsg(o){
  const l = LOLOS[o.loloId];
  return [
    ['Order received', `${l.name} has your order ${o.id}.`],
    ['On the grill', 'Your food is cooking now. Smells good already!'],
    o.mode === 'delivery' ? ['Out for delivery', 'Your rider is on the way with your food.'] : ['Ready for pick-up', `Head to ${l.street}. Show code ${o.code}.`],
    o.mode === 'delivery' ? ['Delivered', `Enjoy! Don't forget to rate ${l.name}.`] : ['Picked up', 'Enjoy your food!']
  ][o.status];
}
function setStatus(o, s){
  if (o.cancelled || s <= o.status || s > 3) return;
  if (s >= 1) o.accepted = true;
  o.status = s; o.stepAt = Date.now();
  const [t, m] = stepMsg(o); notify(t, m, o.id);
  onOrderChange(o);
}
function onOrderChange(o){
  const t = top(); if (!t) return;
  if (t.name === 'tracking' && t.params.id === o.id){ if (o.status >= 3) nav('delivered', {id: o.id}, {replace: true, dir: 'fade'}); else refresh(); }
  else if (t.name === 'orders' || t.name === 'owner') refresh();
  updateChrome();
}
function tick(){
  if (!S) return; const now = Date.now();
  S.orders.forEach(o => {
    if (o.cancelled || o.status >= 3 || o.seed || o.hold) return;
    if (S.owner && o.status < 2){ o.stepAt = now; return; }
    if (now - o.stepAt >= stepDur(o)){
      if (o.status === 0 && !o.accepted) o.accepted = true;
      setStatus(o, o.status + 1);
    }
  });
}
setInterval(tick, 500);

function addLine(it, opts, qty, note){
  const key = [it.id, opts.side, opts.sauce, opts.spice, note].join('|');

function placeOrder(){

  S.coErr = E;

/* Swipe from the left edge to go back (touch) */
(function(){
  let sw = null;
  const host = $('#screens');
  host.addEventListener('touchstart', e => {
    if (SH || e.touches.length !== 1) return;
    const t = e.touches[0], r = app.getBoundingClientRect();
    if (t.clientX - r.left > 24 || S.stack.length < 2) return;
    const el = cur(); if (!el) return;
    sw = {x: t.clientX, y: t.clientY, el, dx: 0, moved: false, w: r.width};
  }, {passive: true});
  host.addEventListener('touchmove', e => {
    if (!sw) return; const t = e.touches[0]; const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.moved){ if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8){ sw = null; return; } if (dx > 8) sw.moved = true; else return; }
    e.preventDefault(); sw.dx = Math.max(0, dx); sw.el.style.transition = 'none'; sw.el.style.transform = `translateX(${sw.dx}px)`; sw.el.style.boxShadow = '-10px 0 30px rgba(0,0,0,.15)';
  }, {passive: false});
  const end = () => {
    if (!sw) return; const s = sw; sw = null; s.el.style.boxShadow = '';
    if (s.moved && s.dx > s.w * .3){ s.el.style.transition = ''; back(); }
    else { s.el.style.transition = ''; s.el.style.transform = ''; }
  };
  host.addEventListener('touchend', end); host.addEventListener('touchcancel', end);
})();

      const p192 = make(192, .1), p512 = make(512, .1), p180 = make(180, .08);

      setManifest([{src: p192, sizes: '192x192', type: 'image/png'}, {src: p512, sizes: '512x512', type: 'image/png', purpose: 'any maskable'}, {src: svgUri, sizes: 'any', type: 'image/svg+xml'}]);

/* 3D tilt that follows the pointer (desktop only) */
(function(){
  const dev = $('#device');
  const set = (rx, ry) => { dev.style.setProperty('--rx', rx.toFixed(2) + 'deg'); dev.style.setProperty('--ry', ry.toFixed(2) + 'deg'); };
  const rest = () => set(3, -8);
  window.addEventListener('pointermove', e => {
    if (RM.matches || document.documentElement.classList.contains('mobile') || e.pointerType !== 'mouse') return;
    const r = dev.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){ set(0, 0); return; }
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const nx = Math.max(-1, Math.min(1, (e.clientX - cx) / (window.innerWidth / 2))), ny = Math.max(-1, Math.min(1, (e.clientY - cy) / (window.innerHeight / 2)));
    set(-ny * 5, nx * 9);
  });
  document.addEventListener('pointerleave', rest);
  document.documentElement.addEventListener('mouseleave', rest);
  rest();
})();

/* =========================================================

function setEmbed(d){
  const root = document.documentElement;
  EMBED.on = d.chrome === false;

  root.classList.toggle('embed', EMBED.on);
