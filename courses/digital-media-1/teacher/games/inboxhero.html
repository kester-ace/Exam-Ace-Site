<!doctype html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox Hero</title>
<meta name="description" content="Inbox Hero: Compose Like a Pro. Professional e-mail and netiquette game for CAPE Digital Media.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
 --bg:#ece6db;--pane:#fffdf9;--pane2:#f6f1e8;--rail:#e4ecea;--ink:#16252a;--muted:#5a686d;--line:#dbd2c4;--line2:#cfc5b4;
 --sea:#0f5c68;--sea2:#0a434c;--sea-soft:#dcebec;--coral:#cf5236;--coral-soft:#fbe7e0;--gold:#cf8f12;--gold-soft:#fbefd2;
 --good:#1b7646;--good-soft:#dff2e6;--bad:#b23636;--bad-soft:#f9e1df;--warn:#9a5c00;--focus:#1b63d6;
 --chip:#e2edef;--chip-ink:#0d3f47;--shadow:0 1px 2px rgba(20,30,30,.08),0 6px 18px rgba(20,30,30,.08);
 --top1:#0b3d46;--top2:#11586a;
 --fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0c1416;--pane:#141f22;--pane2:#192629;--rail:#111d1f;--ink:#e4eeec;--muted:#9fb1b3;--line:#283a3e;--line2:#34494d;
 --sea:#5bbccb;--sea2:#86d3de;--sea-soft:#17343a;--coral:#f0805f;--coral-soft:#3a221c;--gold:#f1bd52;--gold-soft:#3a2f14;
 --good:#5bd497;--good-soft:#15342a;--bad:#ff8a84;--bad-soft:#3d1d1d;--warn:#f0b65a;--focus:#7fb0ff;
 --chip:#1c3439;--chip-ink:#cfeef2;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0c1416;--pane:#141f22;--pane2:#192629;--rail:#111d1f;--ink:#e4eeec;--muted:#9fb1b3;--line:#283a3e;--line2:#34494d;
 --sea:#5bbccb;--sea2:#86d3de;--sea-soft:#17343a;--coral:#f0805f;--coral-soft:#3a221c;--gold:#f1bd52;--gold-soft:#3a2f14;
 --good:#5bd497;--good-soft:#15342a;--bad:#ff8a84;--bad-soft:#3d1d1d;--warn:#f0b65a;--focus:#7fb0ff;
 --chip:#1c3439;--chip-ink:#cfeef2;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0 0 .6em}
ul{margin:.2em 0 .6em;padding-left:1.2em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.mono{font-family:var(--fm);font-size:.86em;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.shell{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;min-height:560px}
.topbar{background:linear-gradient(100deg,var(--top1),var(--top2));color:#f4fbfa;display:flex;align-items:center;gap:12px;padding:8px 14px;min-width:0}
.logo{width:38px;height:38px;flex:none}
.brand{min-width:0;flex:1}
.brand h1{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 span{color:#ffc9b8}
.brand p{margin:0;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstats{display:flex;align-items:center;gap:8px;flex:none}
.tpill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13.5px;white-space:nowrap}
.tpill .star{color:#ffd166}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:5px 12px;border-top:1px solid var(--line);background:var(--pane2)}
.foot b{color:var(--ink)}

.app{display:grid;grid-template-columns:228px 282px minmax(0,1fr);min-height:0;background:var(--pane)}
.pane{min-height:0;overflow:auto}
.folders{background:var(--rail);border-right:1px solid var(--line);padding:10px 8px 14px}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.fbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:7px 10px;font-size:14px;color:var(--ink);position:relative}
.fbtn:hover{background:rgba(15,92,104,.08)}
.fbtn[aria-current="true"]{background:var(--pane);box-shadow:var(--shadow);font-weight:700}
.fbtn[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--coral)}
.fbtn .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn .fcount{font-size:12px;font-weight:700;color:var(--muted)}
.fbtn .fstars{font-size:11.5px;color:var(--gold);font-weight:700;white-space:nowrap}
.fbtn svg{color:var(--sea)}
.mbox{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.mbox .fbtn{padding:5px 10px;font-size:13.5px}
.mbox .fbtn.drop-hover,.zone.drop-hover,.bin.drop-hover,.slot.drop-hover{outline:3px dashed var(--coral);outline-offset:-3px;background:var(--coral-soft)}
.drop-ready{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--sea-soft)}}

.list{border-right:1px solid var(--line);background:var(--pane);display:flex;flex-direction:column}
.lhead{padding:12px 14px 10px;border-bottom:1px solid var(--line);background:var(--pane);position:sticky;top:0;z-index:2}
.lhead h2{font-size:17px}
.lhead p{font-size:13px;color:var(--muted);margin:3px 0 0}
.lprog{height:6px;border-radius:6px;background:var(--pane2);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.lprog i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--coral));border-radius:6px;transition:width .4s}
.sortbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sortbar button{border:1px solid var(--line2);background:var(--pane2);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.sortbar button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--pane)}
.lrows{flex:1}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px 10px 16px;position:relative;color:var(--ink)}
.row:hover{background:var(--pane2)}
.row[aria-current="true"]{background:var(--coral-soft)}
.row[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--coral)}
.row .r1{display:flex;align-items:baseline;gap:8px}
.row .rfrom{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rtime{font-size:12px;color:var(--muted);white-space:nowrap}
.row .rsub{font-size:13.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rsnip{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .rfrom::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sea);margin-right:6px;vertical-align:1px}
.row .rtag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:4px;background:var(--pane2);border:1px solid var(--line);color:var(--muted)}
.row .rtag.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.row .rtag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.row .rtag.flag{background:var(--gold-soft);color:var(--warn);border-color:transparent}
.row.mail{touch-action:auto;cursor:grab}
.row.arrive{animation:arrive .45s ease-out both}
@keyframes arrive{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

.reader{background:var(--pane);padding:0}
.rinner{max-width:760px;margin:0 auto;padding:16px 20px 28px}
.rtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--pane2);position:sticky;top:0;z-index:3}
.rtool .sp{flex:1}
.mhead h2{font-size:21px;margin-bottom:8px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--pane2);margin-bottom:12px}
.meta dt{color:var(--muted);font-weight:700}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;font-family:var(--fd)}
.sender{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sender .sn{font-weight:700}
.sender .sa{font-size:12.5px;color:var(--muted)}
.mbody{font-size:15px;line-height:1.6}
.mbody p{margin:0 0 .8em}
.task{border:1px dashed var(--sea);background:var(--sea-soft);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px}
.task h3{font-size:14.5px;margin-bottom:4px;color:var(--sea2)}
:root[data-theme="dark"] .task h3{color:var(--sea)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--line2);background:var(--pane);padding:8px 14px;font-weight:700;font-size:14px;line-height:1.1;min-height:38px;text-decoration:none}
.btn:hover{border-color:var(--sea)}
.btn.pri{background:var(--sea);border-color:var(--sea);color:var(--pane)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- cards / lessons ---------- */
.card{border:1px solid var(--line);border-radius:14px;background:var(--pane);box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px}
.card h3{font-size:16px;margin-bottom:6px}
.card .kick{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--coral);margin-bottom:2px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.ltab{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.ltab th,.ltab td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.ltab th{font-family:var(--fd);font-size:13px;background:var(--pane2)}
.good-t{color:var(--good);font-weight:700}
.bad-t{color:var(--bad);font-weight:700}
.sigdemo{font-size:13.5px;border-left:3px solid var(--sea);padding:6px 10px;background:var(--pane2);border-radius:0 8px 8px 0;white-space:pre-line}
.def{border-left:4px solid var(--coral);background:var(--coral-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:8px 0}

/* ---------- options ---------- */
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line2);background:var(--pane);border-radius:11px;padding:9px 12px;font-size:14px;line-height:1.4;white-space:pre-line}
.opt:hover{border-color:var(--sea)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.opt[aria-checked="true"] .dot,.opt[aria-pressed="true"] .dot{border-color:var(--sea);background:var(--sea);box-shadow:inset 0 0 0 3px var(--pane)}
.opt[role="checkbox"] .dot{border-radius:5px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.6}
.opt .otag{margin-left:auto;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;align-self:center}
.fb{border-radius:11px;padding:9px 12px;font-size:14px;margin-top:10px}
.fb.ok{background:var(--good-soft);color:var(--ink);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb.info{background:var(--sea-soft);border-left:4px solid var(--sea)}

/* ---------- compose ---------- */
.compose{position:fixed;inset:0;z-index:40;background:rgba(10,25,28,.45);display:flex;align-items:center;justify-content:center;padding:12px}
.cwin{min-width:0;width:min(1060px,100%);height:min(100%,760px);background:var(--pane);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;overflow:hidden;border:1px solid var(--line)}
.cwin.fly{animation:fly .6s cubic-bezier(.5,0,.75,0) forwards}
@keyframes fly{to{transform:translate(45vw,-60vh) scale(.15) rotate(-12deg);opacity:0}}
.ctitle{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--top1);color:#fff}
.ctitle h2{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--pane2)}
.ctool .sp{flex:1}
.ctabs{display:none}
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.cbuild{overflow:auto;padding:12px 14px 30px;min-height:0}
.cprev{overflow:auto;border-left:1px solid var(--line);background:var(--pane2);padding:12px 14px 24px;min-height:0}
.brief{font-size:13.5px;background:var(--gold-soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.hfield{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;margin-bottom:6px}
.hfield label,.hfield .hl{font-weight:700;font-size:13px;color:var(--muted)}
.zone{min-height:40px;border:1.5px dashed var(--line2);border-radius:10px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--pane);cursor:pointer;text-align:left;width:100%}
.zone:hover{border-color:var(--sea)}
.zone .ph{font-size:12.5px;color:var(--muted);padding:0 4px}
.zone.sel-ready{border-color:var(--coral);border-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--pane2);margin:8px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700;user-select:none;-webkit-user-select:none;max-width:100%}
.chip .avatar{width:24px;height:24px;font-size:10px}
.chip small{font-weight:400;opacity:.8}
.chip[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.chip.placed{opacity:.45}
.chip .x{border:0;background:none;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;padding:0;color:inherit}
.chip .x:hover{background:rgba(0,0,0,.12)}
.chip span.cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (pointer:fine){[data-drag]{touch-action:none}}
[data-drag]{cursor:grab}
.dragghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 10px 28px rgba(0,0,0,.25)}
.hint{font-size:12.5px;color:var(--muted)}
.sect{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--pane)}
.sect>h3{margin:0}
.sect>h3 button{width:100%;display:flex;align-items:center;gap:8px;background:var(--pane2);border:0;padding:9px 12px;font-family:var(--fd);font-size:14.5px;text-align:left}
.sect>h3 button .sv{margin-left:auto;font-family:var(--fb);font-weight:400;font-size:12.5px;color:var(--muted);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect>h3 button .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.sect>h3 button .tick.on{background:var(--sea);border-color:var(--sea);color:var(--pane)}
.sect .sbody{padding:10px 12px 12px}
.sub{font-weight:700;font-size:13px;color:var(--muted);margin:8px 0 5px}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--pane);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px}
.toggle[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}

.preview{background:var(--pane);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pvh{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.pvh dt{color:var(--muted);font-weight:700}
.pvh dd{margin:0;overflow-wrap:anywhere}
.pvsub{font-family:var(--fd);font-weight:700;font-size:16px;padding:10px 12px 0}
.pvb{padding:8px 12px 14px;font-size:14px;line-height:1.55}
.pvb p{margin:0 0 .75em;white-space:pre-line}
.pvb .empty-part{color:var(--muted);font-style:italic;background:var(--pane2);border-radius:6px;padding:1px 6px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;font-size:11.5px;font-weight:700;padding:1px 7px}
.badge.hi{background:var(--bad);color:#fff}
.attach{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:13px;background:var(--pane2);margin:0 12px 10px}
.sigline{border-top:1px solid var(--line);padding-top:6px;color:var(--muted)}

/* ---------- results ---------- */
.res{text-align:left}
.reshead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bigstars{font-size:30px;letter-spacing:3px;color:var(--line2)}
.bigstars b{color:var(--gold);font-weight:400}
.bigstars b.pop{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.scorebig{font-family:var(--fd);font-size:26px;font-weight:800}
.rtab{width:100%;border-collapse:collapse;font-size:13.5px}
.rtab td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rtab td.m{white-space:nowrap;font-weight:700}
.ok-i{color:var(--good)}.no-i{color:var(--bad)}.half-i{color:var(--warn)}
.learned{border:1px solid var(--line);background:var(--sea-soft);border-radius:12px;padding:10px 14px;margin-top:12px}
.learned h3{font-size:15px;margin-bottom:4px}
.learned li{margin:3px 0}
.stars-s{color:var(--gold);letter-spacing:1px}
.stars-s .o{color:var(--line2)}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,25,28,.5);display:grid;place-items:center;padding:14px}
.mbox2{width:min(560px,100%);max-height:calc(100vh - 28px);overflow:auto;background:var(--pane);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:16px 18px;border:1px solid var(--line)}
.mbox2 h2{font-size:18px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--pane);padding:9px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.good{background:var(--good);color:#fff}
.toast.bad{background:var(--bad);color:#fff}

/* ---------- fix mode ---------- */
.draft{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--pane);box-shadow:var(--shadow)}
.dh{display:grid;grid-template-columns:70px 1fr;gap:4px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;background:var(--pane2)}
.dh .k{color:var(--muted);font-weight:700;padding-top:3px}
.dbody{padding:12px 14px;font-size:15px;line-height:1.6}
.seg{display:inline;text-align:left;border:0;background:none;padding:2px 3px;margin:0 -1px;border-radius:5px;line-height:inherit;font-size:inherit;color:inherit;border-bottom:1.5px dotted transparent;white-space:pre-line}
.seg:hover{background:var(--gold-soft);border-bottom-color:var(--gold)}
.seg.blk{display:block;width:100%;margin:0 0 .7em}
.seg.fixed{background:var(--good-soft);border-bottom:1.5px solid var(--good);cursor:default}
.seg.cleared{background:var(--pane2);cursor:default}
.seg.reveal{background:var(--gold-soft);outline:2px solid var(--gold)}
.counter{font-weight:700;font-size:14px}

/* ---------- tone meter ---------- */
.meter{margin:12px 0 6px}
.mtrack{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mstop{border:0;border-radius:8px;padding:8px 4px;font-weight:700;font-size:12.5px;text-align:center;color:#fff;opacity:.55}
.mstop[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px var(--ink) inset}
.mstop.t0{background:#b23a3a}.mstop.t1{background:#c27a12}.mstop.t2{background:#1b7646}.mstop.t3{background:#55628a}
.mrange{width:75%;margin:8px 12.5% 0;display:block;accent-color:var(--sea)}
.mout{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--pane2);font-size:15.5px;min-height:70px;margin-top:8px}
.mout .ml{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:3px}
.quote{border-left:4px solid var(--bad);padding:8px 12px;background:var(--bad-soft);border-radius:0 10px 10px 0;font-size:15px}
.quote.stiff{border-color:#55628a;background:rgba(85,98,138,.12)}

/* ---------- sort / drag games ---------- */
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.bin{border:1.5px dashed var(--line2);border-radius:12px;padding:8px;min-height:90px;background:var(--pane2);text-align:left;width:100%;display:block}
.bin h4{font-size:14px;margin-bottom:5px;display:flex;justify-content:space-between}
.bin .bi{font-size:12px;background:var(--good-soft);border-radius:7px;padding:3px 7px;margin:3px 0}
.pool{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.card-b{overflow-wrap:anywhere;border:1.5px solid var(--line2);background:var(--pane);border-radius:10px;padding:7px 10px;font-size:13.5px;text-align:left;box-shadow:var(--shadow);max-width:100%}
.card-b[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slots{display:grid;gap:5px;margin:8px 0}
.slot{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;border:1.5px dashed var(--line2);border-radius:10px;padding:5px 8px;min-height:38px;background:var(--pane);text-align:left;width:100%}
.slot .n{font-family:var(--fd);font-weight:800;color:var(--muted);text-align:center}
.slot .sl{font-size:13.5px}
.slot .sl em{color:var(--muted);font-size:12.5px}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.sigpv{overflow-wrap:anywhere;white-space:pre-line;font-size:13.5px;border-left:3px solid var(--sea);padding:6px 10px;background:var(--pane2)}

/* ---------- video call ---------- */
.vcall{background:#101820;border-radius:14px;padding:10px;color:#e8f0f2}
.vtop{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.vtop .rec{width:9px;height:9px;border-radius:50%;background:#e54848}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vmain{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.tile{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#24323b;padding:0;color:#fff;text-align:left;width:100%}
.tile svg.scene{position:absolute;inset:0;width:100%;height:100%}
.tile .nm{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 7px;font-size:11.5px;display:flex;gap:5px;align-items:center}
.tile:hover{border-color:#ffd166}
.tile.fixed{border-color:#5bd497}
.tile.cleared{border-color:#5a7380}
.vchat{background:#18242c;border-radius:10px;padding:8px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.vchat h4{font-size:12.5px;color:#9fb1b3;font-family:var(--fb)}
.cmsg{background:#22323c;border-radius:8px;padding:6px 8px;text-align:left;border:2px solid transparent;color:#e8f0f2;font-size:12.5px;width:100%}
.cmsg:hover{border-color:#ffd166}
.cmsg.fixed{border-color:#5bd497}
.cmsg b{color:#8fd3dd}
.vbar{display:flex;justify-content:center;gap:8px;margin-top:8px}
.vbar span{width:34px;height:34px;border-radius:50%;background:#2a3a44;display:grid;place-items:center}
.vbar span.end{background:#c63c3c}
.wave{animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{to{opacity:.25}}
.late{background:#3a2f14;color:#ffd98a;border-radius:8px;padding:6px 8px;font-size:12.5px;border:2px solid transparent;text-align:left;width:100%}
.late:hover{border-color:#ffd166}
.late.fixed{border-color:#5bd497;background:#15342a;color:#c9f3dc}

/* ---------- phone ---------- */
.phone-line{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.bubble{border-radius:12px;padding:8px 12px;font-size:14.5px;max-width:520px}
.bubble.them{background:var(--pane2);border:1px solid var(--line)}
.bubble.me{background:var(--sea-soft);border:1px solid var(--sea);margin-left:auto}
.slip{border:2px solid var(--ink);border-radius:6px;background:#fffbe9;color:#1d1a14;padding:12px 14px;font-size:14px;max-width:520px;box-shadow:4px 4px 0 rgba(0,0,0,.15)}

.qdots span.no{background:var(--bad);color:#fff;border-color:transparent}
.qdots span.cur{outline:2px solid var(--coral)}

.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mcard{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--pane);width:100%}

.mcard small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.mcard svg{color:var(--coral);margin-top:2px}

@media (max-width:1000px){.app{grid-template-columns:196px 250px minmax(0,1fr)}.fbtn .fstars{display:none}.cbody{grid-template-columns:minmax(0,1fr) 330px}}

 .shell{height:auto;min-height:0;display:block}

 .app{display:block}
 .pane{overflow:visible}
 .folders{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;scrollbar-width:thin}

 .folders>div{display:contents}
 .fbtn{flex:none;width:auto;padding:7px 10px;font-size:13px;background:var(--pane)}
 .fbtn .fcount,.fbtn .fstars{display:none}
 .fbtn[aria-current="true"]::before{left:8px;right:8px;top:auto;bottom:2px;width:auto;height:3px}
 .mbox{display:none!important}
 .list{border-right:0;border-bottom:4px solid var(--line)}
 .lhead{position:static}
 .lrows{max-height:300px;overflow:auto}
 .rinner{padding:14px 16px 24px}
 .rtool{padding:8px 16px;top:47px}
 .lesson-grid,.mgrid{grid-template-columns:1fr}
 .compose{padding:0}
 .cwin{height:100%;border-radius:0}
 .ctabs{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line)}
 .ctabs button{flex:1;border:1px solid var(--line2);background:var(--pane);border-radius:8px;padding:6px;font-weight:700;font-size:13.5px}
 .ctabs button[aria-selected="true"]{background:var(--sea);color:var(--pane);border-color:var(--sea)}
 .cwin{grid-template-rows:auto auto auto 1fr}
 .cbody{display:block;overflow:auto}
 .cbody .cbuild,.cbody .cprev{overflow:visible;border-left:0}
 .cbody[data-tab="build"] .cprev,.cbody[data-tab="preview"] .cbuild{display:none}
 .bins{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;position:sticky;top:50px;z-index:4;background:var(--pane);padding:4px 0}
 .bin{min-height:54px;padding:6px}
 .bin h4{font-size:12.5px;flex-direction:column;gap:2px}
 .bin h4 svg{display:none}
 .bin .bi{display:none}
 .poolcol{order:-1}
 .rtab tr{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--line);padding:4px 0}
 .rtab td{border:0;padding:3px 6px}
 .rtab td.m{white-space:normal}
 .rtab td:nth-child(2){grid-column:1/-1;order:3;padding-top:0}
 .vmain{grid-template-columns:1fr}
 .vgrid{grid-template-columns:repeat(2,1fr)}
 .slip .sf{grid-template-columns:1fr}
 .welcome-hero svg{width:64px;height:64px}
 .dh{grid-template-columns:58px 1fr}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}

const LEARN=[
 ["E-mail features (Chapter 7.2)",["<b>To</b> — the primary, direct recipient(s), expected to read and act on the message.","<b>Cc (Carbon Copy)</b> — people who should be kept informed but are not expected to act; everyone can see who else received it.","<b>Bcc (Blind Carbon Copy)</b> — sends a copy WITHOUT revealing addresses to other recipients; used for a large list of unrelated people.","<b>Subject line</b> — a short, specific summary; a vague or missing subject can cause e-mails to be delayed, ignored or lost.","<b>Attachments</b> — files sent along with the e-mail rather than pasted into the body. Check you attach the right, final version — and do not forget it!"]],
 ["Greetings &amp; sign-offs",["Formal: <i>Dear Mr / Mrs / Ms / Dr Surname,</i> or <i>Dear Sir or Madam,</i> when the name is unknown.","Semi-formal: <i>Good morning [Name],</i> — and <i>Hi [first name],</i> only for colleagues you know.","<i>Dear Sir or Madam</i> → <i>Yours faithfully</i>; a named person → <i>Yours sincerely</i>; <i>Kind regards / Best regards</i> for business e-mail.","Standard punctuation puts a comma after the greeting and the close; open punctuation uses none. Be consistent.","Never use “Hey”, “Yo” or “Sup” at work."]],
 ["Designation &amp; signature block",["Order: full name → designation (job title) → department → company → address → telephone with +1 (246) → e-mail → optional confidentiality line.","Use courtesy titles (Mr, Mrs, Ms, Dr); “Ms” when unsure of marital status.","When the name is unknown, address by designation: “Dear Human Resources Manager” or “The Manager, Human Resources Department”.","Avoid nicknames, inspirational quotes, emojis and huge images."]],
 ["Tone &amp; register",["Registers: formal (unknown readers, applications), semi-formal (colleagues, regular clients), informal (friends only — never work).","Aim for Professional on the tone meter — not rude, not casual, not overly stiff.","Polite requests: “Could you…”, “Would you be able to…”. Soften bad news with “Unfortunately…” and offer an alternative.","Use the positive “you” attitude; avoid passive-aggressive phrases such as “As per my last e-mail”.","Limit exclamation marks; avoid emojis and humour in formal e-mail; open with a courteous “Good morning”."]],
 ["Netiquette (Chapter 7.7)",["Netiquette: the accepted standards of polite, professional and ethical behaviour when communicating electronically.","Use a clear, respectful tone and avoid writing in all capital letters, which is widely read as shouting.","Proofread carefully before sending — messages are easily forwarded and difficult to retract.","Protect confidential and personal information; share it only through secure channels with authorised recipients.","Verify unfamiliar senders and be cautious of suspicious links or attachments.","Respect intellectual property and privacy; respond within a reasonable time and acknowledge important messages."]],
 ["Etiquette: phone &amp; video calls",["Answer with a greeting, the company name and your name, and offer help.","Ask permission before putting a caller on hold; thank them for holding.","Take messages accurately — name, company, number with country code, message, action, date/time and who took it — then read them back.","On video calls: be on time, mute when not speaking, don’t eat on camera, keep a tidy background, keep the chat on topic."]],
 ["Organising e-mail (Chapter 7.5)",["Sort <b>by date</b> to track recent mail or a sequence of events; <b>by sender</b> to review all correspondence with one client, colleague or organisation; <b>by subject</b> to follow a whole conversation thread.","Keep contact lists organised and up to date to avoid sending to the wrong person.","<b>Archive</b> older or completed correspondence; flag mail that needs follow-up; delete spam; report phishing (check the sender, the links and urgency cues)."]]
];

function setDiff(a,b){return{miss:b.filter(x=>!a.includes(x)),extra:a.filter(x=>!b.includes(x))};}

 let rp=0,rmsg=[];[["to",2],["cc",1],["bcc",1]].forEach(([f,w])=>{const d=setDiff(c[f],s[f]);if(!d.miss.length&&!d.extra.length)rp+=w;else{if(d.miss.length)rmsg.push(`${f.toUpperCase()} is missing ${d.miss.map(cName).join(", ")}.`);if(d.extra.length)rmsg.push(`${d.extra.map(cName).join(", ")} should not be in ${f.toUpperCase()}.`);}});
 rows.push({part:"Recipients",ok:rp===4?true:rp>0?"half":false,msg:(rmsg.length?rmsg.join(" ")+" ":"")+esc(s.recipWhy),pts:`${rp}/4`});score+=rp;
 const sub=s.subject[c.subject];rows.push({part:"Subject line",ok:!!sub[1],msg:esc(sub[2]),pts:sub[1]?"2/2":"0/2"});score+=sub[1]?2:0;
 const g=s.greet[c.greet];rows.push({part:"Salutation",ok:!!g[1],msg:`“${esc(g[0])}” — ${esc(g[2])}`,pts:g[1]?"2/2":"0/2"});score+=g[1]?2:0;
 const p1=s.p1[c.p1],p2=s.p2[c.p2];const cp=(p1[1]?1:0)+(p2[1]?1:0);rows.push({part:"Content",ok:cp===2?true:cp?"half":false,msg:[p1[1]?"Opening ✓ "+esc(p1[2]):"Opening ✗ "+esc(p1[2]),p2[1]?"Main ✓ "+esc(p2[2]):"Main ✗ "+esc(p2[2])].join("<br>"),pts:`${cp}/2`});score+=cp;
 const cl=s.close[c.close];const toneParts=[["greeting",g[3]],["opening",p1[3]],["main paragraph",p2[3]],["closing",cl[3]]].filter(x=>x[1]!=="p");const tp=toneParts.length===0?2:toneParts.length===1?1:0;
 rows.push({part:"Tone",ok:tp===2?true:tp?"half":false,msg:tp===2?"Professional throughout — polite, clear and respectful.":"Off-tone parts: "+toneParts.map(x=>`${x[0]} (${TONEL[x[1]]})`).join(", ")+". Aim for Professional: not rude, casual or overly stiff.",pts:`${tp}/2`});score+=tp;
 const pair=/Yours faithfully/.test(cl[0])&&!/Sir or Madam/.test(g[0])?" Remember: “Yours faithfully” pairs with “Dear Sir or Madam”.":/Yours sincerely/.test(cl[0])&&/Sir or Madam/.test(g[0])?" “Yours sincerely” pairs with a named person.":"";
 rows.push({part:"Closing",ok:!!cl[1],msg:esc(cl[2])+pair,pts:cl[1]?"1/1":"0/1"});score+=cl[1]?1:0;
 const sOk=c.sig===s.sigOk;const sw=(s.sigWhyOverride&&s.sigWhyOverride[c.sig])||SIGWHY[c.sig];rows.push({part:"Signature & designation",ok:sOk,msg:esc(sw),pts:sOk?"2/2":"0/2"});score+=sOk?2:0;
 const aOk=c.attach===s.attachOk;rows.push({part:"Attachment",ok:aOk,msg:(forgot?"<b>You forgot the attachment!</b> ":"")+esc(s.attachWhy),pts:aOk?"2/2":"0/2"});score+=aOk?2:0;
 const pOk=c.pri===s.pri;rows.push({part:"Priority",ok:pOk,msg:esc(s.priWhy),pts:pOk?"1/1":"0/1"});score+=pOk?1:0;
 return{rows,score,max:18};}

 list(){return lhead("Quick Quiz","Ten questions drawn from a bank of "+QUIZ.length+".",Q.ans.length/10)+`<div class="qdots" aria-label="Question progress">${Q.qs.map((_,i)=>`<span class="${Q.ans[i]==null?"":Q.ans[i].ok?"ok":"no"}${i===Q.i&&!Q.done?" cur":""}" aria-label="Question ${i+1}${Q.ans[i]==null?"":Q.ans[i].ok?" correct":" wrong"}">${i+1}</span>`).join("")}</div><div style="padding:0 14px 14px"><p class="hint">${tagStars("quiz","main")}</p><button class="btn sm" type="button" data-act="qnew">New quiz</button></div>`;},
 reader(){if(Q.done)return`<div class="rinner">${Q.done}</div>`;const it=Q.qs[Q.i],q=QUIZ[it.q],a=Q.ans[Q.i];
  return`<div class="rinner"><div class="qnum">Question ${Q.i+1} of 10</div><p class="qtext">${esc(q[0])}</p><div class="opts">${it.ord.map(j=>{let cls="";if(a)cls=j===q[2]?" right":a.pick===j?" wrong":" dim";return`<button type="button" class="opt${cls}" data-act="qpick" data-v="${j}" ${a?"disabled":""}><span class="dot"></span><span>${esc(q[1][j])}</span></button>`;}).join("")}</div>${a?`<div class="fb ${a.ok?"ok":"no"}"><b>${a.ok?"Correct!":"Not quite."}</b> ${esc(q[3])}</div><div class="btnrow"><button class="btn pri" data-act="qnext">${Q.i<9?"Next question":"See results"}</button></div>`:""}</div>`;}
};
A.qpick=el=>{const it=Q.qs[Q.i],q=QUIZ[it.q],j=+el.dataset.v;Q.ans[Q.i]={pick:j,ok:j===q[2]};sfx(j===q[2]?"success":"error");renderReader();renderList();const n=$('[data-act="qnext"]');n&&n.focus();};
A.qnext=()=>{if(Q.i<9){Q.i++;renderReader();renderList();const o=$("#reader .opt");o&&o.focus();return;}const sc=Q.ans.filter(a=>a.ok).length*10;const rec=record("quiz","main",sc,100);Q.done=resultsHTML({title:"Quiz complete",score:sc,max:100,rec,rows:Q.qs.map((it,i)=>({part:`Q${i+1}`,ok:Q.ans[i].ok,msg:esc(QUIZ[it.q][0])+"<br><span class='hint'>"+esc(QUIZ[it.q][3])+"</span>"})),learned:["Review “What you learned” for the full summary."],actions:`<button class="btn" data-act="qnew">New quiz</button><button class="btn pri" data-act="mode" data-v="learn">What you learned</button>`});celebrate(rec.stars);renderReader();renderList();};

/* ---------- saved progress (GameSave): best scores and sound (inboxhero.v1) and, in inboxhero.play, the folder you were in and every
   task in progress (the e-mail being composed, drafts being fixed, greetings, signatures, tone, Inbox Zero, etiquette and the quiz)
   survive a reload. "Reset all scores" now starts the whole game over. ---------- */
const GSK="inboxhero.play";
const gsObj=d=>!!d&&typeof d==="object"&&!Array.isArray(d);
function gsSnap(){return{v:1,mode:S.mode,B,CS,F,G,SG,T,E,Q,IZ:Object.assign({},IZ,{mails:IZ.mails.map(m=>({id:m.id,at:m.at,tries:m.tries,pts:m.pts}))})};}
function gsSet(o,d,replace){if(!gsObj(d))return;if(replace)Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,d);}
function gsApply(d){
 if(MODES.some(m=>m.id===d.mode))S.mode=d.mode;
 gsSet(B,d.B);if(!scen(B.sel))B.sel="s1";gsSet(F,d.F);if(!gsObj(F.st))F.st={};if(!fdraft(F.sel))F.sel="d1";
 gsSet(G,d.G);gsSet(SG,d.SG);if(!gsObj(SG.b))SG.b={};gsSet(T,d.T);gsSet(E,d.E);gsSet(Q,d.Q);
 if(gsObj(d.IZ)){const by={};(Array.isArray(d.IZ.mails)?d.IZ.mails:[]).forEach(x=>{if(gsObj(x)&&x.id)by[x.id]=x;});const z=Object.assign({},d.IZ);
  z.mails=z.started?MAIL.map(m=>{const x=by[m.id]||{};return Object.assign({},m,{at:typeof x.at==="string"?x.at:"inbox",tries:Number.isInteger(x.tries)?x.tries:0,pts:typeof x.pts==="number"?x.pts:0});}):[];
  if(!gsObj(z.insp))z.insp={};gsSet(IZ,z);}
 CS=gsObj(d.CS)&&scen(d.CS.sid)&&gsObj(d.CS.ord)?d.CS:null;
 MI[S.mode]&&MI[S.mode].enter&&MI[S.mode].enter();
}
load();setMute();updateTop();
let gsBack=false;
if(window.GameSave){
 GameSave.register([KEY,GSK]);
 const D0=JSON.parse(JSON.stringify({mode:S.mode,B,F,G,SG,T,E,Q,IZ}));
 GameSave.persist({key:GSK,get:gsSnap,welcome:false,set:d=>{if(!gsObj(d)||d.v!==1)return;
  try{gsApply(d);render();if(CS){$("#compose").hidden=false;renderCompose();}gsBack=true;}
  catch(e){S.mode=D0.mode;[["B",B],["F",F],["G",G],["SG",SG],["T",T],["E",E],["Q",Q],["IZ",IZ]].forEach(([k,o])=>gsSet(o,JSON.parse(JSON.stringify(D0[k])),true));CS=null;$("#compose").hidden=true;$("#compose").innerHTML="";}}});
 let gsT=null;const gsLater=()=>{clearTimeout(gsT);gsT=setTimeout(GameSave.save,350);};
 ["click","pointerup","change","input","keyup"].forEach(t=>document.addEventListener(t,gsLater));
}
if(!gsBack)render();
if((gsBack||Object.keys(store.best).length)&&window.GameSave&&GameSave.toast)setTimeout(()=>GameSave.toast("Welcome back! Your progress was restored."),400);
</script>
