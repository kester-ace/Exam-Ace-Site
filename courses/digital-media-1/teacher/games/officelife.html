<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Office Life</title>
<meta name="description" content="Office Life: People Skills at Work — a branching workday game on interpersonal skills, work habits and ethics for CAPE Digital Media.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --ink:#14324a; --ink-2:#3d5a70; --muted:#66808f;
  --sea:#0f8b8d; --sea-2:#0b6f72; --sea-soft:#d9f2f0;
  --coral:#f0624d; --coral-soft:#fde4df;
  --sun:#ffbf3c; --sun-soft:#fff3d6;
  --leaf:#2f9a63; --leaf-soft:#dcf3e5;
  --plum:#7a4ea3; --plum-soft:#ece3f6;
  --paper:#fffdf8; --card:#ffffff; --line:#e3ddd0; --bg:#f3ede1;
  --shadow:0 6px 22px rgba(20,50,74,.12);
  --head:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(ellipse at 10% 0%,#fff6e3 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#dff3ef 0,transparent 50%);
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;min-height:100vh}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 280px}
.logo{width:40px;height:40px;flex:none}
.brand h1{font-family:var(--head);font-weight:800;font-size:1.28rem;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--sea)}
.brand p{margin:2px 0 0;font-size:.78rem;color:var(--muted);line-height:1.2}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--head);font-weight:600;font-size:.82rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{color:var(--sea)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.iconbtn:hover{background:var(--sea-soft)}
.iconbtn svg{width:19px;height:19px}

.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px 7px;position:relative}
.meter .lab{display:flex;align-items:center;gap:6px;font-family:var(--head);font-weight:600;font-size:.8rem}
.meter .lab svg{width:16px;height:16px;flex:none}
.meter .val{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:8px;border-radius:6px;background:#eee8dc;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:6px;transition:width .7s cubic-bezier(.3,1.3,.5,1)}
.delta{position:absolute;right:8px;top:-10px;font-family:var(--head);font-weight:800;font-size:.8rem;padding:1px 7px;border-radius:999px;color:#fff;opacity:0;transform:translateY(4px);pointer-events:none}
.delta.show{animation:pop 1.6s ease forwards}
.delta.up{background:var(--leaf)} .delta.down{background:var(--coral)}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.m-p i{background:linear-gradient(90deg,#1aa3a6,var(--sea))} .m-p svg{color:var(--sea)}
.m-r i{background:linear-gradient(90deg,#ff8b6e,var(--coral))} .m-r svg{color:var(--coral)}
.m-w i{background:linear-gradient(90deg,#ffd36b,#f0a51e)} .m-w svg{color:#d48b00}
.m-e i{background:linear-gradient(90deg,#9b74c4,var(--plum))} .m-e svg{color:var(--plum)}

main.play{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:12px;flex:1;min-height:0}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#cfeef5;box-shadow:var(--shadow);min-height:300px;isolation:isolate}
.stage svg.bg,.stage svg.fg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.fg{z-index:3;pointer-events:none}
.cast{position:absolute;inset:0;z-index:2;pointer-events:none}
.ch{position:absolute;bottom:0;height:var(--ch-h,80%);aspect-ratio:240/360;transform:translateX(-50%);transition:left .5s ease,opacity .45s ease,filter .3s ease,transform .45s ease}
.ch svg{width:100%;height:100%;display:block;overflow:visible}
.ch.enter{opacity:0;transform:translateX(-50%) translateY(14px)}
.ch.dim{filter:saturate(.8) brightness(.9)}
.ch .bodywrap{transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.006)}}
.ch.bounce svg{animation:nudge .45s ease}
@keyframes nudge{0%{transform:translateY(0)}35%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.prop{position:absolute;z-index:4;pointer-events:none}
.prop svg{width:100%;height:100%;display:block}
.prop.ring svg{animation:ring .35s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

.bubble{position:absolute;z-index:5;left:50%;top:14px;transform:translateX(-50%);width:min(82%,520px);background:#fff;border-radius:18px;padding:11px 16px 12px;box-shadow:0 8px 26px rgba(20,50,74,.18);font-size:1rem;line-height:1.42;transition:opacity .3s ease,transform .3s ease}
.bubble.hide{opacity:0;transform:translateX(-50%) translateY(-6px)}
.bubble .who{font-family:var(--head);font-weight:700;font-size:.8rem;color:var(--sea);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;display:flex;gap:6px;align-items:center}
.bubble .who em{font-style:normal;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.bubble::after{content:"";position:absolute;bottom:-13px;left:var(--tail,50%);width:26px;height:16px;background:#fff;clip-path:polygon(0 0,100% 0,30% 100%);transform:translateX(-50%)}
.bubble.notail::after{display:none}
.bubble.phone{background:#fff8e6}
.bubble.phone::after{background:#fff8e6}

.chapcard{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(20,50,74,.78);color:#fff;text-align:center;opacity:0;pointer-events:none;transition:opacity .45s ease}
.chapcard.show{opacity:1;pointer-events:auto}
.chapcard .k{font-family:var(--head);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;color:var(--sun)}
.chapcard .t{font-family:var(--head);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);line-height:1;margin:6px 0}
.chapcard .s{font-size:1rem;opacity:.9}
.chapcard .tap{margin-top:14px;font-size:.8rem;opacity:.7}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.scene-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.scene-h h2{font-family:var(--head);font-weight:700;font-size:1.15rem;margin:0;line-height:1.15}
.tag{font-family:var(--head);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sea-2);background:var(--sea-soft);border-radius:999px;padding:2px 9px}
.narr{margin:0;color:var(--ink-2)}
.narr strong{color:var(--ink)}
.tasks{margin:0;padding-left:0;list-style:none;display:grid;gap:4px;font-size:.92rem}
.tasks li{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:4px 8px}
.tasks b{font-family:var(--head);color:var(--sea-2)}
.prompt{font-family:var(--head);font-weight:600;margin:2px 0 0;font-size:1rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;line-height:1.38;transition:border-color .15s,background .15s,transform .15s}
.choice:hover:not(:disabled){border-color:var(--sea);background:#f4fbfa;transform:translateY(-1px)}
.choice .num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--sea);color:#fff;font-family:var(--head);font-weight:700;display:grid;place-items:center;font-size:.85rem;margin-top:1px}
.choice:disabled{cursor:default;opacity:.5}
.choice.gone{display:none}
.choice.picked{opacity:1;border-color:var(--ink)}
.email{font-size:.9rem}
.email .subj{display:block;font-family:var(--head);font-weight:600;font-size:.82rem;color:var(--muted)}

.fb{border-radius:14px;padding:12px 14px;border:2px solid;background:#fff;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb.best,.fb.good{border-color:var(--leaf);background:var(--leaf-soft)}
.fb.ok{border-color:var(--sun);background:var(--sun-soft)}
.fb.poor{border-color:var(--coral);background:var(--coral-soft)}
.verdict{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:800;font-size:1.05rem;margin-bottom:4px}
.verdict svg{width:22px;height:22px;flex:none}
.fx{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.fx span{font-family:var(--head);font-weight:600;font-size:.74rem;border-radius:999px;padding:1px 8px;background:#fff;border:1px solid var(--line)}
.fx .u{color:#1d7a4a} .fx .d{color:#c03b26}
.fb p{margin:4px 0}
.better{margin-top:8px;padding:8px 10px;background:#fff;border-radius:10px;border-left:4px solid var(--leaf);font-size:.93rem}
.better b{font-family:var(--head)}
.habit{margin-top:8px;font-size:.85rem;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}
.habit svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--sea)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{font-family:var(--head);font-weight:700;border:0;border-radius:12px;padding:11px 18px;background:var(--sea);color:#fff;font-size:1rem;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 0 var(--sea-2)}
.btn:hover{background:var(--sea-2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sea-2)}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.alt:hover{background:var(--sea-soft)}
.btn.coral{background:var(--coral);box-shadow:0 3px 0 #c64532}
.kbd{font-family:var(--head);font-size:.72rem;font-weight:600;opacity:.75;border:1px solid currentColor;border-radius:5px;padding:0 5px}

/* title */
.title-card h2{font-family:var(--head);font-weight:800;font-size:1.7rem;line-height:1.05;margin:0}
.title-card h2 span{color:var(--sea)}
.title-card .sub{font-family:var(--head);font-weight:500;color:var(--coral);margin:4px 0 8px}
.title-card p{margin:6px 0}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-family:var(--head);font-weight:600;font-size:.85rem}
.field input{border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;max-width:280px}
.field input:focus{border-color:var(--sea);outline:none}
.howto{margin:6px 0;padding-left:20px;font-size:.92rem;color:var(--ink-2)}
.howto li{margin:2px 0}
.bestline{font-size:.88rem;background:var(--sun-soft);border-radius:10px;padding:6px 10px;margin-top:4px}

/* review */
.rating{text-align:center;padding:6px 0 2px}
.rating .lbl{font-family:var(--head);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.rating .name{font-family:var(--head);font-weight:800;font-size:1.7rem;line-height:1.1;margin:2px 0}
.stars{display:flex;justify-content:center;gap:4px;margin:4px 0}
.stars svg{width:30px;height:30px}
.stars .on{color:var(--sun)} .stars .off{color:#e2dccf}
.stars svg.pop{animation:star .5s ease backwards}
@keyframes star{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.scoregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:.88rem}
.scoregrid div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;justify-content:space-between}
.scoregrid b{font-variant-numeric:tabular-nums}
.habits{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.habits li{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.habits .mk{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.75rem;margin-top:1px}
.mk.best,.mk.good{background:var(--leaf)} .mk.ok{background:#e6a316} .mk.poor{background:var(--coral)}
.habits b{font-family:var(--head)}
h3.sec{font-family:var(--head);font-size:.95rem;margin:6px 0 0}

.modes{display:grid;gap:8px;margin:6px 0}
.mode{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--coral);transform:translateY(-1px)}
.mode b{font-family:var(--head);font-size:1rem;color:var(--ink)} .mode span{font-size:.86rem;color:var(--ink-2)}
#startBtn.mode{border-color:var(--coral)}
.strip{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.strip .st{--c:var(--sea);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;background:#fff;border:2px solid var(--line);color:var(--c);text-align:center;position:relative}
.strip .st svg{width:20px;height:20px}
.strip .nm{font-family:var(--head);font-weight:800;font-size:.66rem;letter-spacing:.03em;color:var(--ink);line-height:1.1}
.strip .sb{font-size:.7rem;color:var(--ink-2);line-height:1.2}
.strip.big .st svg{width:28px;height:28px} .strip.big .nm{font-size:.74rem}
.strip .st.now{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.strip .st.done{opacity:.55}
.strip .st.done::after{content:"✓";position:absolute;top:2px;right:5px;font-size:.7rem;font-weight:700;color:var(--leaf)}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.case{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 9px;font-size:.88rem}
.case:hover{border-color:var(--sea)}
.case .cn{flex:none;width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:.75rem}
.case .ct{flex:1;font-weight:700;line-height:1.2}
.case .cs{font-family:var(--head);font-size:.74rem;font-weight:600;color:var(--muted);white-space:nowrap}
.case.did{background:var(--leaf-soft);border-color:#a8dcbd} .case.did .cs{color:#1d7a4a}
.ftag{display:inline-block;font-family:var(--head);font-weight:600;font-size:.66rem;color:var(--plum);background:var(--plum-soft);border-radius:999px;padding:0 6px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.facts{display:grid;gap:6px}
.fact{display:flex;gap:9px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 11px;line-height:1.35;flex-wrap:wrap}
.fact .num{flex:none;width:22px;height:22px;border-radius:6px;background:var(--sea);color:#fff;font-family:var(--head);font-weight:700;display:grid;place-items:center;font-size:.8rem}
.fact .box{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:5px}
.fact[aria-pressed="true"]{border-color:var(--sea);background:#f0faf9}
.fact[aria-pressed="true"] .box{background:var(--sea);border-color:var(--sea);box-shadow:inset 0 0 0 3px #fff}
.fact span:last-of-type{flex:1;min-width:60%}
.fact .lbl{flex-basis:100%;font-style:normal;font-family:var(--head);font-weight:600;font-size:.76rem;padding-left:58px}
.fact.isfact .lbl{color:#1d7a4a} .fact.notfact .lbl{color:#c03b26}
.fact:disabled{cursor:default}
.model{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.model li{--c:var(--sea);display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:7px 10px;font-size:.88rem}
.model li svg{width:20px;height:20px;flex:none;color:var(--c);margin-top:1px}
.model li b{display:block;font-family:var(--head);font-size:.74rem;letter-spacing:.05em;color:var(--c)}
.irf{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0;font-size:.88rem;box-shadow:4px 4px 0 rgba(20,50,74,.12)}
.irf-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;background:var(--ink);color:#fff;padding:7px 10px;font-family:var(--head)}
.irf-h span{font-weight:800;letter-spacing:.08em;color:var(--sun)} .irf-h i{margin-left:auto;font-style:normal;font-size:.75rem;opacity:.8}
.irf-row{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
.irf-row>span{font-family:var(--head);font-weight:700;font-size:.8rem}
.irf-row select{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:7px;padding:6px;background:#fffdf8;font-size:.86rem}
.irf-row.good{background:var(--leaf-soft)} .irf-row.bad{background:var(--coral-soft)}
.irf-row .full{grid-column:2;font-size:.82rem;color:var(--ink);line-height:1.3}
.irf-row .full:empty{display:none}
.irf-row .fix{grid-column:2;font-style:normal;font-size:.8rem;color:#1d7a4a}
.sig{font-family:"Caveat","Segoe Script",cursive;font-size:1.05rem;color:var(--sea-2);border-bottom:1.5px dashed var(--muted)}
.badge{width:118px;height:125px;display:block;margin:4px auto}
.food{display:flex;align-items:center;gap:12px;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:8px 12px}
.food .fimg{width:110px;flex:none} .food .fimg svg{width:100%;height:auto;display:block}
.food .fname{font-family:var(--head);font-weight:700;font-size:1.05rem}
.rounds{margin:4px 0;padding-left:22px} .rounds li{margin:3px 0}
.tips{margin:4px 0;padding-left:20px;font-size:.88rem;color:var(--ink-2)} .tips li{margin:3px 0}
@media (max-width:560px){ .cases{grid-template-columns:1fr} .strip .sb{display:none} .irf-row{grid-template-columns:1fr} .irf-row .fix,.irf-row .full{grid-column:1} .fact .lbl{padding-left:0} .strip .nm{font-size:.58rem} }
footer.foot{text-align:center;font-size:.78rem;color:var(--muted);padding:2px 0}
footer.foot b{color:var(--ink-2)}

@media (min-width:821px) and (min-height:560px){
  .app{height:100vh;height:100dvh;min-height:0}
}
@media (min-width:821px){ #bubbleNarrow{display:none} }
@media (max-width:820px){
  #bubbleWide{display:none}
  main.play{grid-template-columns:1fr}
  .stage{aspect-ratio:5/4;min-height:0;--ch-h:90%}
  .bubble{position:relative;left:auto;top:auto;transform:none;width:auto;margin:0;box-shadow:none;border:1px solid var(--line);border-radius:14px}
  .bubble.hide{transform:none}
  .bubble::after{display:none}
  .bubble-slot{order:0}
}
@media (max-width:560px){
  .meters{grid-template-columns:repeat(2,1fr);gap:6px}
  .brand h1{font-size:1.1rem}
  .brand p{font-size:.72rem}
  .panel{padding:12px}
  .stage{aspect-ratio:6/5}
  .hud .pill.time{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
<!-- gamesave:start --><script id="gamesave-kit">
/* GameSave: every game remembers its progress on this device, and can start over. Developed by Kester Small

{id:"commute", ch:1, time:"7:42", bg:"street", title:"The Morning Commute", habit:"Punctuality and absence notification", ref:"Section 9.8 · Punctuality and regularity", cast:[], prop:"mobile",
 narr:"It is your first day as the new administrative assistant at <strong>Bayside Business Centre</strong> in Port of Spain. Traffic on the Beetham Highway is at a standstill and you will be about <strong>fifteen minutes late</strong> for your 8:00 start.",
 prompt:"What do you do?",

   fb:"Punctuality and regularity matter, but when lateness cannot be avoided, telling your supervisor <em>before</em> your start time is the professional response. It shows courtesy and personal integrity — being honest and consistent even when no one is watching or checking."},
  {t:"Text Shanice, a colleague you met at the interview, and ask her to tell the manager for you.", q:"ok", fx:{p:-1,r:1}, set:{late:"texted"}, react:{who:"Shanice", phone:true, line:"lol ok, I'll tell her when I see her 👍"},
   fb:"Better than silence, but the message may not reach the right person in time. Lateness or absence should be reported <em>directly</em> to your supervisor, using the method your organisation expects (usually a phone call)."},
  {t:"Say nothing and slip in quietly — maybe nobody will notice.", q:"poor", fx:{p:-6,r:-3,e:-6}, set:{late:"sneak"}, react:{who:"You", line:"You stare at the traffic and hope for the best…"},
   fb:"Hiding lateness damages trust. Your supervisor may be planning the day around you. Personal integrity means being honest even when you might not be caught."},
  {t:"Post a video of the traffic jam on social media and decide later.", q:"poor", fx:{p:-5,w:-3,e:-2}, set:{late:"sneak"}, react:{who:"You", line:"Twelve likes… but no message to work."},
   fb:"A social media post does not inform your employer — and your supervisor may see it before she hears from you. Use the right medium for the message: an urgent matter calls for an instant medium such as a phone call (Section 7.6, degree of urgency)."}
 ]},

 cast:function(f){ return [{c:"sup", x:f.late==="called"?"happy":(f.late==="sneak"?"annoyed":"neutral")}]; },

 prompt:"How do you greet her?",
 choices:[
  {t:"“Good morning, Mrs. Arrindell. Thank you — I'm pleased to be here. Where would you like me to start?”", q:"best", fx:{p:6,r:6,w:2}, react:{x:"happy", line:"What a lovely attitude! Let me show you the front desk."},
   fb:"A polite greeting using the person's title and name, a thank-you and an offer to start work shows courtesy and willingness — “a readiness to take on tasks and responsibilities without excessive reluctance or complaint.”"},

{id:"phone", ch:1, time:"8:30", bg:"reception", title:"The Ringing Telephone", habit:"Telephone etiquette", ref:"Section 9.8 · Courtesy", cast:[], prop:"phone", ring:true,

   fb:"A professional telephone greeting has four parts: a greeting, the organisation's name, your name and an offer to help. Speak clearly and smile — callers can hear it in your voice."},

  {t:"Let it ring — someone more experienced will pick it up.", q:"poor", fx:{p:-5,w:-6}, react:{who:"Caller", phone:true, line:"(after eight rings) Finally! I've been holding for ages."},

 choices:[
  {t:"Smile, speak clearly and patiently, and walk her to the filing cabinet. Later, tell the colleague privately that the comment was unkind.", q:"best", fx:{r:7,e:5,p:4}, react:{x:"happy", line:"¡Gracias! Thank you, {n}. That helps me a lot."},
   fb:"Caribbean workplaces bring together people of many nationalities who speak English, Spanish, Dutch, French, Papiamentu, Kwéyòl and more. Respect for diversity means “valuing and treating fairly people of different backgrounds, cultures, abilities and perspectives” — and quietly challenging disrespect."},
  {t:"Chuckle at the comment — it was a bit funny.", q:"poor", fx:{r:-6,e:-7}, react:{x:"worried", line:"…Never mind. I will ask someone else."},
   fb:"Laughing along makes a newcomer feel unwelcome and encourages discrimination. Courtesy and respect apply to everyone."},
  {t:"Help her with the files, but say nothing about the comment.", q:"good", fx:{r:4,e:1,w:1}, react:{x:"happy", line:"Thank you — now I understand."},
   fb:"Helping her is kind and productive. Taking the extra step of speaking to the colleague privately helps build a respectful workplace for everyone."},
  {t:"Answer her very loudly and slowly, as if she can't understand anything.", q:"ok", fx:{r:-3,p:-3}, react:{x:"worried", line:"I… understand. I am not deaf."},
   fb:"Speaking clearly is helpful; speaking down to someone is not. A person learning a language is still an intelligent adult."}
 ]},

/* ===== CHAPTER 3 : AFTERNOON ===== */
{id:"gossip_back", ch:3, time:"14:00", bg:"breakroom", title:"The Rumour Comes Back", habit:"Apologising and repairing trust", ref:"Section 9.8 · Personal integrity; Courtesy", when:function(f){ return f.gossip==="yes"; },
 cast:[{c:"mari", x:"worried"}],
 narr:"Marisela finds you in the break room. Her eyes are red.",
 say:"{n}… people are saying I only got this internship because of my uncle. I worked very hard for it. Did you say that?",
 prompt:"What do you say?",
 choices:[
  {t:"“I'm truly sorry, Marisela. I repeated something I shouldn't have. It was wrong, and I'll tell people it isn't true.”", q:"best", fx:{e:6,r:5}, react:{x:"neutral", line:"…Thank you for being honest. That means something."},
   fb:"A sincere apology names what you did, accepts responsibility and offers to put it right. It is the first step in repairing trust."},
  {t:"“It wasn't me — it was Shanice who started it.”", q:"poor", fx:{e:-4,r:-3}, react:{x:"worried", line:"But you still passed it on."},
   fb:"Shifting the blame does not undo your part in spreading the rumour. Take responsibility for your own actions."},
  {t:"“Relax, it's just office talk. Don't take it personally.”", q:"poor", fx:{r:-6,e:-4}, react:{x:"annoyed", line:"It IS personal. It's about me."},
   fb:"Dismissing someone's hurt adds to the harm. Gossip is never “just talk” to the person it is about."}
 ]},
{id:"gossip_good", ch:3, time:"14:00", bg:"breakroom", title:"A Quiet Thank-you", beat:true, when:function(f){ return f.gossip!=="yes"; },
 cast:[{c:"mari", x:"happy"}], fx:{r:3,e:2},
 narr:"Marisela catches you by the water cooler.",
 say:"Devon told me you refused to join in some gossip about me at lunch. Thank you, {n}. I feel more welcome now.",
 note:"Refusing to gossip protected a colleague's reputation — and built a new working relationship."},

{id:"teamwork", ch:3, time:"14:20", bg:"office", title:"A Colleague Under Pressure", habit:"Team spirit and co-operation", ref:"Section 9.8 · Team spirit; Co-operation; Willingness",
 cast:[{c:"devon", x:"worried"}],
 narr:"Your own filing is on schedule. Devon looks overwhelmed.",
 say:"I've got sixty invoices to enter before the 4:00 bank run, and the phones won't stop ringing. I'm drowning here.",
 prompt:"What do you do?",
 choices:[
  {t:"“My filing is on track — I'll check with Mrs. Arrindell, then I can take your phone calls so you can focus on the invoices.”", q:"best", fx:{r:8,w:5,p:3}, set:{helped:true}, react:{x:"happy", line:"Seriously? Thank you! You're a star."},
   fb:"Team spirit means “actively supporting and contributing to the shared goals of a group … rather than working in isolation.” Checking with your supervisor first keeps your own priorities on track."},
  {t:"“That's tough. Good luck with it!”", q:"ok", fx:{r:-3}, react:{x:"worried", line:"…Yeah. Thanks."},
   fb:"Sympathy is kind, but when you have capacity, offering practical help is what co-operation looks like."},
  {t:"“Not my job — I'm only the admin assistant.”", q:"poor", fx:{r:-7,p:-3,w:-2}, react:{x:"annoyed", line:"Right. I'll remember that."},
   fb:"Refusing to help when you have time shows an unwillingness that colleagues remember. The success of the whole team matters."},
  {t:"Take half his invoices without asking and enter them your own way.", q:"ok", fx:{w:1,r:1,p:-2}, set:{helped:true}, react:{x:"worried", line:"Whoa — wait, we have a set procedure for those!"},
   fb:"Willingness is good, but co-operation means agreeing <em>how</em> to help. Follow the established procedure and check with your supervisor."}
 ]},

{id:"criticism", ch:3, time:"15:00", bg:"meeting", title:"Constructive Criticism", habit:"Accepting constructive criticism", ref:"Section 9.6 · Acceptable standards of work",
 cast:[{c:"sup", x:"neutral"}],
 narr:"Mrs. Arrindell calls you into the meeting room with the letter you typed this morning.",
 say:"{n}, the layout of this letter is good, but there are three spelling errors and the date is in the wrong format. Clients notice these things.",
 prompt:"How do you respond?",
 choices:[
  {t:"“Thank you for pointing that out. I'll correct it now and proofread more carefully. Could you show me the house style for dates?”", q:"best", fx:{p:7,r:4,w:3}, react:{x:"happy", line:"Of course. That's exactly the right attitude."},
   fb:"Constructive criticism is feedback on your <em>work</em>, not an attack on <em>you</em>. Thanking the person, correcting the error and asking how to improve shows willingness and a commitment to acceptable standards of work."},
  {t:"“The spell-checker didn't flag anything, so it's not really my fault.”", q:"poor", fx:{p:-6,r:-4}, react:{x:"annoyed", line:"A spell-checker won't catch “form” instead of “from”. Proofreading is your job."},
   fb:"Software is a tool, not an excuse. Always proofread your documents carefully before they are sent."},
  {t:"Fold your arms, sigh loudly and say nothing.", q:"poor", fx:{p:-5,r:-5}, react:{x:"annoyed", line:"I'm trying to help you grow here, {n}."},
   fb:"Body language speaks. Defensiveness makes supervisors less willing to coach you."},
  {t:"“Sorry. I'll fix it.” Then sulk quietly for the rest of the afternoon.", q:"ok", fx:{p:1,w:-3}, react:{x:"neutral", line:"Thank you. Don't be discouraged — everyone learns."},
   fb:"You accepted the correction, but letting it ruin your afternoon hurts your productivity. Learn from it and move on."}
 ]},

{id:"priorities", ch:3, time:"15:20", bg:"office", title:"Urgent or Important?", habit:"Ordering priorities and time management", ref:"Section 9.6 · Execution of effective time management",
 cast:[{c:"sup", x:"worried"}], prop:"papers",
 narr:"Four tasks land on your desk at once:",
 tasks:["<b>A</b> Photocopy the board meeting agenda — the meeting starts at <strong>3:45</strong>.", "<b>B</b> Reply to a routine supplier e-mail — due by end of day.", "<b>C</b> Reorganise the stationery cupboard — due Friday.", "<b>D</b> A colleague wants to show you her holiday photos."],
 say:"The board members are arriving at 3:45 and I need those agenda copies!",
 prompt:"In what order do you tackle them?",
 choices:[
  {t:"A → B → C (plan it for tomorrow) → D at break time.", q:"best", fx:{w:8,p:5}, react:{x:"happy", line:"Agenda copies on the table at 3:35 — perfect. Thank you!"},
   fb:"Do <strong>urgent and important</strong> tasks first (the agenda), then important tasks with a near deadline (the e-mail). Schedule important-but-not-urgent work (the cupboard) and leave non-work matters for break time. This is effective time management: “planning and prioritising tasks realistically.”"},
  {t:"C → A → B — the cupboard is the biggest job, so get it out of the way.", q:"poor", fx:{w:-6,p:-3}, react:{x:"annoyed", line:"The board is sitting here without agendas!"},
   fb:"The size of a task does not decide its priority — the deadline and importance do."},
  {t:"D → A → B → C — be friendly first, then see how much time is left.", q:"poor", fx:{w:-7,r:2,p:-2}, react:{x:"annoyed", line:"Photos? The meeting starts in five minutes!"},
   fb:"Relationships matter, but personal chats belong at break time when urgent work is waiting."},
  {t:"B → A → C — answer e-mails first, as always.", q:"ok", fx:{w:1}, react:{x:"worried", line:"Just in time… but that was very close."},
   fb:"Routine habits are useful, but the agenda had the nearest deadline. Always check for urgent tasks before starting routine work."}
 ]},

{id:"email", ch:3, time:"15:45", bg:"office", title:"Mind Your Netiquette", habit:"E-mail tone and netiquette", ref:"Section 7.7 · Netiquette; Section 7.2 · Subject line", cast:[], prop:"laptop",
 narr:"A client, Mr. Halley, has e-mailed for the third time asking about a quotation that Accounts has not finished. You feel frustrated.",
 prompt:"Which reply do you send?",
 email:true,
 choices:[
  {t:"<span class=\"subj\">Subject: Re: Quotation for office furniture – update</span>Dear Mr. Halley, thank you for your patience. Our Accounts team is finalising your quotation, and I will send it to you by 12 noon tomorrow. Kind regards, {n}", q:"best", fx:{p:7,r:4,w:2}, react:{who:"Mr. Halley (reply)", line:"Thank you for the update — much appreciated."},
   fb:"Good netiquette: a clear, specific subject line, a respectful tone, a polite greeting and closing, and an acknowledgement of receipt “even if a full reply will take longer to prepare.” Proofread before you press Send."},
  {t:"<span class=\"subj\">Subject: (none)</span>WE ARE WORKING ON IT. PLEASE STOP E-MAILING.", q:"poor", fx:{p:-8,r:-6}, react:{who:"Mr. Halley (reply)", line:"There's no need to shout. I'll take my business elsewhere."},
   fb:"Writing in all capital letters “is widely read as shouting,” and a missing subject line makes the message hard to find later. Always use a clear, respectful tone."},
  {t:"<span class=\"subj\">Subject: quote</span>hey!! soon come lol 😊", q:"ok", fx:{p:-4,r:1}, react:{who:"Mr. Halley (reply)", line:"…Soon? When exactly?"},
   fb:"Friendly, but too informal for a client, and it gives no real information. Business e-mails need standard English, a proper greeting and a specific answer."},
  {t:"<span class=\"subj\">Subject: Re: Re: Re: Quotation</span>Reply All to the whole client list: “Some people really need to learn patience…”", q:"poor", fx:{p:-9,e:-5,r:-6}, react:{who:"Mrs. Arrindell", line:"{n}! Thirty clients just received that!"},
   fb:"<em>Think and check before sending.</em> Using Reply All carelessly is an error in dispatch that cannot be recalled, and a sarcastic remark about a client is disrespectful and unprofessional."}
 ]},

{id:"resources", ch:3, time:"16:05", bg:"office", title:"Just a Few Flyers…", habit:"Using company resources ethically", ref:"Section 9.8 · Personal integrity", prop:"printer",
 cast:[{c:"andre", x:"neutral"}],
 narr:"Your cousin's birthday party is on Saturday and you need thirty colour flyers. The office colour printer is right beside you. Andre Carty from IT walks past.",

 prompt:"What do you do about the flyers?",
 choices:[
  {t:"Print them at a print shop on Frederick Street after work — company resources are for company business.", q:"best", fx:{e:8,p:4}, react:{x:"happy", line:"Respect. You'd be surprised how many people don't think like that."},
   fb:"Paper, ink, computers, phones and working time all cost the company money. Personal integrity means “being honest and consistent in one's actions, even when no one is watching or checking.”"},
  {t:"Ask Mrs. Arrindell first whether you may print them, and offer to pay for the paper and ink.", q:"good", fx:{e:5,p:3}, react:{x:"neutral", line:"That's a fair way to handle it. Most managers appreciate being asked."},
   fb:"Asking permission and offering to pay is honest. Some organisations allow limited personal use with permission; others do not. Never assume."},
  {t:"Print them quickly while no one is looking.", q:"poor", fx:{e:-10,p:-4}, react:{x:"annoyed", line:"Every print job is logged under your name, you know."},

  {t:"Design them on the office computer during work hours, then print them at home.", q:"poor", fx:{w:-6,e:-4}, react:{x:"neutral", line:"Hmm. That's still company time you're using."},

 ]},

/* ===== CHAPTER 4 : DEADLINE ===== */
{id:"pw_bad", ch:4, time:"16:30", bg:"office", title:"A Security Alert", habit:"Honesty about security breaches", ref:"Section 7.7 · Protecting confidential information", when:function(f){ return f.pw==="shared"; },
 cast:[{c:"andre", x:"annoyed"}],

 ]},
{id:"pw_good", ch:4, time:"16:30", bg:"office", title:"Good Call", beat:true, when:function(f){ return f.pw!=="shared"; },
 cast:[{c:"andre", x:"happy"}], fx:{e:3,p:2},
 narr:"Andre stops by on his way back from the server room.",

{id:"askhelp", ch:4, time:"16:40", bg:"office", title:"Stuck on a Task", habit:"Asking for help appropriately", ref:"Section 9.8 · Individual responsibility; Willingness",
 cast:function(f){ return [{c:"devon", x:f.helped?"happy":"neutral"}]; }, prop:"laptop",
 narr:"Mrs. Arrindell needs 25 personalised client letters for tomorrow's presentation by <strong>5:30</strong>. They require a mail merge — which you have never done before.",
 say:function(f){ return f.helped ? "You helped me out earlier — need a hand? I know mail merge inside out." : "I'm still finishing these invoices… what's up?"; },
 prompt:"What do you do?",
 choices:[
  {t:"Explain exactly where you're stuck and ask for a quick demonstration, so that you can do it yourself next time.", q:"best", fx:{w:7,p:4,r:3}, react:{x:"happy", line:"Sure — watch: select the recipients, insert the merge fields, preview, then finish. Easy!"},
   fb:"Asking for help early, with a specific question, is a sign of responsibility, not weakness. Asking to be <em>shown</em> rather than to have it done builds your own skills."},

   fb:"Pride can cost a deadline. Effective time management includes recognising when you need support."},

   fb:"Handing your work to someone else is not asking for help. Individual responsibility means doing your own tasks, with support where needed."},
  {t:"Watch a random video tutorial and guess at the steps.", q:"ok", fx:{w:-2,p:1}, react:{x:"neutral", line:"Did it work? Some of those videos use an older version."},
   fb:"Independent research is useful, but under a tight deadline a quick question to a knowledgeable colleague is usually faster and more reliable."}
 ]},

{id:"conflict", ch:4, time:"16:55", bg:"office", title:"Printer Wars", habit:"Conflict resolution", ref:"Section 9.8 · Co-operation; Courtesy", prop:"printer",
 cast:[{c:"shanice", x:"annoyed"}, {c:"devon", x:"annoyed"}], speaker:0,
 narr:"Shanice and Devon are arguing loudly over the shared printer. Devon insists his bank documents must leave in ten minutes.",

 choices:[
  {t:"Stay calm and neutral: suggest they compare deadlines. Devon's bank run prints first, Shanice's packs go straight after, and you offer to collect her pages for her.", q:"best", fx:{r:7,p:5,w:3}, react:{x:"neutral", both:"neutral", line:"…Fine. That's fair. Thanks, {n}."},
   fb:"Conflict resolution means focusing on the problem, not the people: listen to both sides, use objective facts (here, deadlines), and find a solution both can accept. Offering practical help shows co-operation."},
  {t:"Take Shanice's side — she has worked here longer.", q:"poor", fx:{r:-5,p:-3}, react:{x:"happy", both:"annoyed", line:"See? Even the new person agrees with me."},

  {t:"Walk away — it's not your argument.", q:"ok", fx:{r:-2,w:-1}, react:{x:"annoyed", both:"annoyed", line:"(the argument gets louder…)"},
   fb:"Sometimes it is wise not to get involved, but a calm suggestion could have solved this quickly for the whole team."},
  {t:"“You're both being childish. Grow up!”", q:"poor", fx:{r:-6,p:-4}, react:{x:"annoyed", both:"annoyed", line:"Excuse me?!"},

 ]},

{id:"credit", ch:4, time:"17:15", bg:"meeting", title:"Whose Idea Was It?", habit:"Giving credit for others' work", ref:"Section 9.4 · Plagiarism; Section 9.8 · Personal integrity",
 cast:[{c:"sup", x:"happy"}, {c:"mari", x:"neutral"}], speaker:0,
 narr:"The client packs are finished. Marisela suggested the colour-coded index tabs and spent an hour making them.",
 say:"These client packs look excellent! The colour-coded tabs are brilliant — whose idea was that?",

  {t:"“Thank you! The tabs were Marisela's idea — she did a great job on them.”", q:"best", fx:{e:8,r:6,p:3}, react:{x:"happy", both:"happy", line:"Well done, Marisela! And thank you for recognising her, {n}."},
   fb:"Taking credit for someone else's idea is a workplace form of plagiarism — “the use of another person's intellectual property … without giving them appropriate credit.” Acknowledging others builds trust and team spirit."},
  {t:"“Mine — I'm so glad you like them!”", q:"poor", fx:{e:-10,r:-6}, react:{x:"happy", both:"worried", line:"Wonderful work, {n}!"},

  {t:"“It was a team effort.”", q:"ok", fx:{e:1,r:1}, react:{x:"neutral", both:"neutral", line:"Well, good work, everyone."},

  {t:"Say nothing and let her assume it was you.", q:"poor", fx:{e:-7,r:-4}, react:{x:"happy", both:"worried", line:"Lovely work, {n}. Keep it up!"},

{id:"deadline", ch:4, time:"17:25", bg:"office", title:"The 5:45 Courier", habit:"Meeting deadlines without cutting corners", ref:"Section 9.6 · Submission; Follow-up procedures · Section 9.8 · Meeting deadlines", prop:"papers",

/* ---------------- state + meters ---------------- */
var METERS = ["p","r","w","e"], MNAME = {p:"Professionalism", r:"Relationships", w:"Productivity", e:"Ethics"};
var START = 45;
function newState(name){ return {name:name||"Jordan", i:-1, f:{}, m:{p:START,r:START,w:START,e:START}, log:[], ch:0}; }
function drawMeters(delta){
  METERS.forEach(function(k){
    var el = $("mt-"+k), v = state.m[k];
    el.querySelector(".bar i").style.width = v + "%";
    el.setAttribute("aria-valuenow", v);
    tweenNum(el.querySelector(".val"), v);
    if(delta && delta[k]){
      var d = el.querySelector(".delta"); d.textContent = (delta[k] > 0 ? "+" : "") + delta[k];
      d.className = "delta " + (delta[k] > 0 ? "up" : "down");
      void d.offsetWidth; d.classList.add("show");
    }
  });
}
function tweenNum(el, to){
  var from = +el.textContent || 0; if(RM || from === to){ el.textContent = to; return; }
  var t0 = performance.now();
  function step(t){ var k = Math.min(1,(t-t0)/600); el.textContent = Math.round(from + (to-from)*k); if(k < 1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
function applyFx(fx){
  var d = {};
  METERS.forEach(function(k){ if(fx && fx[k]){ var before = state.m[k]; state.m[k] = Math.max(0, Math.min(100, before + fx[k])); d[k] = state.m[k] - before; } });
  drawMeters(d); return d;
}

/* ---------------- rendering ---------------- */
var stage = $("stage"), castEl = $("cast"), body = $("panelBody");
var bubbleW = $("bubbleWide"), bubbleN = $("bubbleNarrow");
var current = null, curCast = [];
function val(x){ return typeof x === "function" ? x(state.f) : x; }

function setScene(bg, time){
  var key = bg + "|" + time;
  if(!BGCACHE[key]) BGCACHE[key] = bgSVG(bg, time);
  $("bg").innerHTML = BGCACHE[key];
  $("fg").innerHTML = fgSVG(bg);
  $("timeTxt").textContent = time;
}
function layoutCast(list, entering){
  castEl.innerHTML = ""; curCast = [];
  var n = list.length, pos = n === 1 ? [50] : n === 2 ? [30, 70] : [];
  list.forEach(function(it, idx){
    var d = document.createElement("div");
    d.className = "ch" + (entering && !RM ? " enter" : "");
    d.style.left = pos[idx] + "%";
    d.innerHTML = person(it.c, it.x || "neutral");
    castEl.appendChild(d);
    curCast.push({c:it.c, x:it.x || "neutral", el:d});
    if(entering && !RM) setTimeout(function(){ d.classList.remove("enter"); }, 40 + idx*120);
  });
  describeStage();
}
function setExpr(idx, x){
  var it = curCast[idx]; if(!it || it.x === x) return;
  it.x = x; it.el.innerHTML = person(it.c, x);
  if(!RM){ it.el.classList.remove("bounce"); void it.el.offsetWidth; it.el.classList.add("bounce"); }
  describeStage();
}
function setDim(speakerIdx){
  curCast.forEach(function(it, i){ it.el.classList.toggle("dim", curCast.length > 1 && i !== speakerIdx); });
}
function describeStage(){
  var place = current ? ({reception:"the reception desk", office:"the open-plan office", breakroom:"the break room", meeting:"the meeting room", kitchen:"the staff kitchen", street:"a bus stop on Frederick Street"}[current.bg] || "the office") : "the office";
  var who = curCast.map(function(it){ var c = CAST[it.c]; return c.name + " (" + c.role + ") looks " + EXPR_WORD[it.x]; }).join("; ");
  stage.setAttribute("aria-label", "Scene at " + place + (who ? ". " + who + "." : "."));
}
function setProp(name, ring){
  var pl = $("propLayer"); pl.innerHTML = "";
  if(!name) return;
  var d = document.createElement("div"); d.className = "prop" + (ring && !RM ? " ring" : "");
  var sizes = {microwave:[24,"80%","4%"], dishes:[20,"20%","4%"], phone:[22,"50%","5%"], mobile:[13,"50%","22%"], laptop:[26,"50%","4%"], printer:[18,"86%","6%"], papers:[20,"14%","4%"]};
  var sz = sizes[name] || [20,"50%","5%"];

    if(fct && !fct.disabled){ e.preventDefault(); fct.click(); return; }
    var b = body.querySelector('.choice[data-pos="' + (+e.key - 1) + '"]');
    if(b && !b.disabled){ e.preventDefault(); b.click(); }
    return;
  }
  if(e.key === "Enter"){
    var active = document.activeElement;
    if(active && active.tagName === "BUTTON") return; // native activation
    var c = $("contBtn") || $("replayBtn") || $("startBtn");
