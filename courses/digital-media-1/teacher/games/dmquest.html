<title>Digital Media Quest</title>
<meta name="description" content="Digital Media Quest: Ms. Kester Small's review game for CAPE Digital Media Unit 1. Four worlds, three game modes and an easier mode. Works offline.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: sticky top bar; home = hero + four world cards; world = three game modes; play = one card at a time, solid colours, no blur.
   Offline: no web fonts are loaded; the stacks below use fonts already on the device. */

 --bg:#eaf1f9;--panel:#ffffff;--panel2:#dde8f4;--ink:#13202d;--muted:#4a5c72;--line:#c5d3e3;
 --accent:#1a5fd6;--accent-ink:#ffffff;--good:#0f7a57;--good-ink:#ffffff;--bad:#c42b39;--bad-ink:#ffffff;--star:#9a6400;
 --font-display:"Fredoka","Trebuchet MS","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
 --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0b1420;--panel:#132131;--panel2:#1b2f45;--ink:#eef4fb;--muted:#a9bacd;--line:#2d4660;
 --accent:#6aa8ff;--accent-ink:#06182e;--good:#4fd1a1;--good-ink:#06231a;--bad:#ff8590;--bad-ink:#3a0810;--star:#ffc533;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0b1420;--panel:#132131;--panel2:#1b2f45;--ink:#eef4fb;--muted:#a9bacd;--line:#2d4660;
 --accent:#6aa8ff;--accent-ink:#06182e;--good:#4fd1a1;--good-ink:#06231a;--bad:#ff8590;--bad-ink:#3a0810;--star:#ffc533;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;font-weight:700;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1040px;margin:0 auto;padding-block:10px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(28px,5vw,44px)}h2{font-size:clamp(21px,3.4vw,28px)}h3{font-size:20px}
p{margin:0}.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:8px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--font-display);font-weight:700;font-size:24px}
.brand i{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 9px;font-size:17px;line-height:30px}
.spacer{flex:1}
.star{color:var(--star)}
.tot{font-weight:800}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 20px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.sec{margin-top:30px;display:flex;flex-direction:column;gap:14px}
/* hero */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center;margin-top:6px}
.hero p{font-size:18px;color:var(--muted);margin-top:10px;max-width:54ch}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles b{display:flex;align-items:center;justify-content:center;height:84px;border-radius:16px;font-size:44px;border-bottom:6px solid rgba(0,0,0,.25)}
.tiles b:nth-child(1){background:#3b2a85}.tiles b:nth-child(2){background:#0a82b0}.tiles b:nth-child(3){background:#12906a}.tiles b:nth-child(4){background:#c2571a}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
/* worlds */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}

.wcard .sp{position:absolute;top:12px;right:16px;font-size:60px;line-height:1}
.wcard .tag{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.wcard h3{font-size:26px}.wcard p{font-size:16px}.wcard .st{margin-top:6px;font-weight:800;font-size:15px}
.w-space{--w1:#0a0d2e;--w2:#3b2a85}.w-ocean{--w1:#07507f;--w2:#0a82b0}.w-carib{--w1:#075c40;--w2:#0e8a62}.w-city{--w1:#6e2a0c;--w2:#b5501a}
.whead{border-radius:20px;color:#fff;padding:20px;background:linear-gradient(145deg,var(--w1),var(--w2));display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.whead .sp{font-size:58px}.whead>div{flex:1;min-width:220px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.mode{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mode:hover{border-color:var(--accent)}
.mode .big{font-family:var(--font-display);font-weight:700;font-size:22px}
.mode small{color:var(--muted);font-size:15px;font-weight:700}
.stars{font-size:22px;letter-spacing:2px;margin-top:auto}.stars .off{color:var(--line)}
.fact{background:var(--panel2);border-radius:14px;padding:12px 16px;text-align:left;font-size:17px}
.fact b{display:block;font-family:var(--font-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
/* play */
.hud{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 2px}
.hud b{font-family:var(--font-display);font-size:20px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
.prog{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;border-top:6px solid var(--w2)}
.qno{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qtxt{font-size:clamp(21px,3vw,28px);line-height:1.3}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ltr{flex:none;width:32px;height:32px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
.opt:disabled{cursor:default}
.opt.right{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.opt.right .ltr,.opt.wrong .ltr{background:rgba(255,255,255,.25);color:inherit}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-family:var(--font-display);font-size:26px;padding:22px 10px}
.fbk{border-radius:14px;padding:12px 16px;font-size:17px}
.fbk.ok{background:var(--panel2);border-left:6px solid var(--good)}
.fbk.no{background:var(--panel2);border-left:6px solid var(--bad)}
.fbk b{margin-right:4px}
.fbwrap{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;border-top:6px solid var(--w2)}
.fcard .big{font-size:48px;line-height:1}
.fcard .ft{font-size:clamp(19px,2.6vw,24px);max-width:36ch}

.stats3{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.stats3 span{background:var(--panel2);border-radius:10px;padding:4px 12px;font-weight:800;font-size:15px}

.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pt{position:fixed;z-index:60;font-size:26px;line-height:1;pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.qcard.shake{animation:shake .3s}
.res .stars .star{display:inline-block;animation:starpop .45s cubic-bezier(.2,1.6,.4,1) both}
.res .stars .star:nth-child(2){animation-delay:.25s}.res .stars .star:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Course additions: accessibility, easier mode, footer, small screens */
html,body{overflow-x:hidden}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;font-weight:800;text-decoration:none}
.skip:focus{top:8px}
h1:focus,h2:focus{outline:none}
h1:focus-visible,h2:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
.qtxt,.ft,.mit,.opt span,.fact,.fbk{overflow-wrap:anywhere}
.easybar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:15px;margin-bottom:10px}
.easybar b{color:var(--accent)}
.opt.gone{opacity:.35;text-decoration:line-through}
.mit.hintme{outline:3px dashed var(--good);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.wcard{padding-top:80px}
.course-foot{text-align:center;color:var(--muted);font-size:14px;font-weight:700;padding:10px 16px 24px}
@media(max-width:480px){
 body{font-size:16px}
 .wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 .brand{font-size:20px}.chip{font-size:13px;padding:4px 10px}
 .qcard,.fcard,.res{padding:16px;border-radius:16px}
 .opt{font-size:16px;padding:10px 12px}
 .tf .opt{font-size:22px;padding:16px 8px}
 .wcard{min-height:170px}.wcard h3{font-size:22px}
 .whead{padding:16px}.whead>div{min-width:0}.whead .sp{font-size:44px}
 .mgrid{gap:6px}.mit{font-size:14px;padding:8px;min-height:54px}.mit.term{font-size:15px}
 .tiles b{height:64px;font-size:34px}
 .stats3 span{font-size:14px}
}

    '.nm{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:#b9c6ea}' +
    '.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}' +
    'label{font-size:11px;font-weight:700;color:#f7d36b;text-transform:uppercase;letter-spacing:.8px;display:block;margin:0 0 5px}' +
    'select,input{width:100%;font:inherit;font-size:13px;padding:9px 10px;border-radius:10px;border:1px solid #ffffff2e;background:#081536;color:#fff;-webkit-user-select:text;user-select:text}' +
    '.chips{display:flex;gap:6px;margin:10px 0}.chip{padding:5px 11px;border-radius:999px;background:#ffffff14;color:#cdd8f5;font-size:12px;font-weight:600}.chip.on{background:#f2b705;color:#0a1a44}' +
    '.status{font-size:11px;color:#b9c6ea;display:flex;align-items:center;gap:6px;margin:4px 0 10px}.status i{width:7px;height:7px;border-radius:50%;background:#35d07f;display:inline-block}.status i.off{background:#e0a33a}' +
    '.pl{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff12;margin-bottom:7px}' +
    '.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#35d07f26;color:#7cf0b0;margin-left:4px;vertical-align:1px}.badge.m{background:#e0583a2e;color:#ffab95}.badge.h{background:#f2b70530;color:#ffd970}' +
    '.btn{padding:8px 12px;border-radius:10px;background:linear-gradient(180deg,#ffd34d,#f2b705);color:#0a1a44;font-weight:800;font-size:12.5px;white-space:nowrap;box-shadow:0 2px 0 #a87b00}.btn:hover{filter:brightness(1.06)}.btn:disabled{background:#ffffff1c;color:#8f9cc2;box-shadow:none}' +
    '.btn2{padding:8px 12px;border-radius:10px;background:#ffffff18;color:#fff;font-weight:700;font-size:12.5px}.btn2:hover{background:#ffffff26}.btn.big,.btn2.big{padding:12px 16px;font-size:14px;width:100%}' +
    '.why{font-size:10.5px;color:#93a1c9;text-align:right;margin-top:3px;max-width:110px}' +
    '.empty{text-align:center;color:#b9c6ea;font-size:13px;padding:26px 10px;border:1px dashed #ffffff2a;border-radius:14px}' +
    '.card{background:#ffffff10;border:1px solid #f2b70566;border-radius:14px;padding:12px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:14px;color:#ffd970}' +
    '.inv{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid #ffffff12}.inv:first-of-type{border-top:0}' +
    '.st{margin-left:auto;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}.st.pending{background:#f2b70530;color:#ffd970}.st.accepted{background:#35d07f2a;color:#7cf0b0}.st.declined,.st.cancelled{background:#e0583a2e;color:#ffab95}.st.expired{background:#ffffff18;color:#a8b3d4}' +
    '.mini{width:26px;height:26px;font-size:15px;border-width:1px}' +
    '.q{font-size:16px;font-weight:700;color:#fff;line-height:1.35;margin:10px 0 12px}' +
    '.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;margin-bottom:8px;background:#ffffff12;border:1px solid #ffffff22;color:#fff;font-size:14px}.opt:hover{background:#ffffff1f}.opt.ok{background:#1f8f55;border-color:#35d07f}.opt.bad{background:#9a3420;border-color:#ff8466}' +
    '.bar{height:6px;border-radius:9px;background:#ffffff1a;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#f2b705,#ffe27a);transition:width 1s linear}' +
    '.cd{font-size:72px;font-weight:900;text-align:center;color:#ffd970;margin:30px 0 6px;text-shadow:0 4px 20px #f2b70566}' +
    '.sb .r{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}.sb .r b{margin-left:auto;color:#ffd970}.sb .r.me .nm{color:#ffd970}' +
    '.modal{position:fixed;inset:0;display:grid;place-items:center;background:#030a1fcc;z-index:5;padding:16px;animation:fade .2s}@keyframes fade{from{opacity:0}}' +
    '.mbox{width:min(360px,100%);background:linear-gradient(180deg,#10285f,#0a1a44);border:2px solid #f2b705;border-radius:20px;padding:20px;text-align:center;color:#eaf0ff;box-shadow:0 20px 60px #000a;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.85);opacity:0}}' +
    '.mbox .av{width:64px;height:64px;font-size:34px;margin:0 auto 10px}.mbox h3{margin:0 0 4px;font-size:18px;color:#fff}.mbox p{margin:0 0 14px;font-size:13px;color:#cdd8f5}' +
    '.toasts{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:6;width:min(380px,92vw)}' +
    '.toast{background:#0a1a44f2;color:#fff;border:1px solid #f2b705;border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px #0007;animation:fade .2s}' +
    '.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.grid button{aspect-ratio:1;border-radius:9px;background:#ffffff12;font-size:18px}.grid button.on{background:#f2b705}' +
    '.subs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.subs label{text-transform:none;letter-spacing:0;font-size:12px;color:#eaf0ff;font-weight:600;display:flex;gap:6px;align-items:center;background:#ffffff0d;padding:7px;border-radius:9px;margin:0}.subs input{width:auto}' +
    '.f{margin-bottom:12px}.err{color:#ffab95;font-size:12px;margin-top:-6px;margin-bottom:10px}.foot{font-size:10.5px;color:#7f8db8;text-align:center;padding:8px;border-top:1px solid #ffffff12}';

  function avHTML(a, cls) { a = a || '🦁'; return '<div class="av ' + (cls || '') + '">' + (/^(https?:|data:image)/.test(a) ? '<img alt="" src="' + esc(a) + '">' : esc(a)) + '</div>'; }
  var rq = 0; function renderSoon() { if (rq) return; rq = setTimeout(function () { rq = 0; render(); }, 120); }

  var draft = null;
  function viewSetup() {
    var d = draft || (draft = Object.assign({ name: '', cls: '', avatar: '🦁', flag: '🇸🇽', plan: [CFG.gameSubject] }, ls('ea_arena_profile') || {}));
    return '<div class="card"><h3>Set up your arena card</h3>' +
      '<div class="f"><label>Name or alias</label><input id="f-name" maxlength="20" value="' + esc(d.name) + '" placeholder="e.g. Kai_IT"></div>' +
      '<div class="f"><label>Class</label><input id="f-cls" maxlength="10" value="' + esc(d.cls) + '" placeholder="e.g. L6, 5A"></div>' +
      '<div class="f"><label>Avatar</label><div class="grid">' + AVATARS.map(function (a) { return '<button data-av="' + a + '" class="' + (a === d.avatar ? 'on' : '') + '">' + a + '</button>'; }).join('') + '</div></div>' +
      '<div class="f"><label>Flag</label><select id="f-flag">' + FLAGS.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === d.flag ? ' selected' : '') + '>' + f[0] + '  ' + esc(f[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label>Subjects in your plan</label><div class="subs">' + SUBJ_ORDER.map(function (k) { return '<label><input type="checkbox" data-sub="' + k + '"' + (d.plan.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(subjName(k)) + '</label>'; }).join('') + '</div></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn big" data-act="save">Enter the arena</button></div>';
  }
  function viewList() {
    var me = S.me, out = '';
    out += '<div class="me">' + avHTML(me.avatar) + '<div class="grow"><div class="nm">' + esc(me.name) + ' ' + esc(me.flag) + '</div><div class="sub">' + esc(me.cls || 'No class') + ' · ' + me.plan.length + ' subject' + (me.plan.length === 1 ? '' : 's') + '</div></div>' + (me.locked ? '' : '<button class="btn2" data-act="edit">Edit</button>') + '</div>';
    out += '<label>Challenge subject</label><select id="subj">' + me.plan.map(function (k) { return '<option value="' + k + '"' + (k === S.subject ? ' selected' : '') + '>' + esc(subjName(k)) + '</option>'; }).join('') + '</select>';
    var live = S.conn === 'live' || S.conn === 'local';
    var ids = Object.keys(S.players).filter(function (k) { return S.filter === 'all' || (S.players[k].user.cls || '').toLowerCase() === (me.cls || '').toLowerCase(); });
    ids.sort(function (a, b) { var A = S.players[a], B = S.players[b]; return (A.status === 'match') - (B.status === 'match') || A.user.name.localeCompare(B.user.name); });
    out += '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Everyone</button><button class="chip ' + (S.filter === 'class' ? 'on' : '') + '" data-filter="class">My class</button></div>';
    out += '<div class="status"><i class="' + (live ? '' : 'off') + '"></i>' + (live ? ids.length + ' in the arena now · updates every few seconds' : S.conn === 'error' ? 'Can\'t reach the arena. Retrying…' : 'Connecting…') + '</div>';
    if (S.host) out += viewLobby();
    if (S.pendingJoin) out += '<div class="card"><h3>Joining ' + esc(S.pendingJoin.name) + '\'s match…</h3><div class="sub">Hang tight.</div></div>';
    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each · 15 minutes max.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();
