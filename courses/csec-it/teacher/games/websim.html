function resetTools(){pubStep=1;S.evalRes=null;evPage=null;evDev='phone';W.place={};W.checked=false;W.pick=null;W.done=[];W.sel=null;W.wrong=0;W.order=null;W.tab='url'}
function enterGame(mode){
  S.undo=[];S.redo=[];S.lastSnap=null;snapNow();S.sel=null;S.selRegion='main';S.tab='home';
  showScreen('game');S.mode='';setMode(mode||'design');renderPanel();updateTop();
  if(innerWidth<=900)$('#mpanel').classList.remove('open');
}
function startMission(id){
  const m=MISSIONS.find(x=>x.id===id);if(!m)return;
  closeBrowser();resetTools();S.mission=m;S.level=m.lv;S.free=false;S.site=SITES[m.site]();S.track={};
  if(m.setup)m.setup(S.site);S.cur=m.page||'index.html';
  S.ms={hints:0,stage:{},show:0,checks:0,done:false,timerOn:false,left:m.timer||0,expired:false,prev:[]};
  stopTimer();enterGame(m.mode);scheduleCheck();
}
function startFree(){
  closeBrowser();resetTools();S.mission=null;S.free=true;S.track={};
  S.site=S.prog.sandbox&&S.prog.sandbox.pages?S.prog.sandbox:siteClub();S.cur='index.html';enterGame('design');
}
function stepRes(){const m=S.mission;if(!m)return [];return m.steps.map(st=>{try{return !!st.ok()}catch(e){return false}})}
function scheduleCheck(){clearTimeout(_ckT);_ckT=setTimeout(liveTicks,350)}
function liveTicks(){
  const m=S.mission;if(!m||!S.ms||S.ms.done||$('#game').classList.contains('hidden'))return;
  const r=stepRes();
  $$('#mpSteps li').forEach((li,i)=>{const was=li.classList.contains('done');li.classList.toggle('done',r[i]);li.querySelector('.tick').textContent=r[i]?'✓':i+1;if(r[i]&&!was){blip(740+i*60,.08)}li.setAttribute('aria-label',(r[i]?'Done: ':'To do: ')+m.steps[i].s)});
  const all=r.every(Boolean);const cb=$('#mpCheck');if(cb){cb.classList.toggle('pulse',all&&!S.ms.toldAll);if(all&&!S.ms.toldAll){S.ms.toldAll=true;toast('All steps done — press ✅ Check my work!');setTimeout(()=>cb&&cb.classList.remove('pulse'),4000)}}
  if(m.rubric)renderReadout();
}
function renderReadout(){const el=$('#mpRead');if(!el)return;let R;try{R=S.mission.rubric()}catch(e){return}const tot=R.reduce((a,x)=>a+x.got,0);el.innerHTML=`<table class="readout" aria-label="Marking scheme">${R.map(x=>`<tr><td>${x.n}<div style="font-size:11.5px;color:#9fb0e6">${esc(x.why)}</div></td><td>${x.got}/${x.max}</td></tr>`).join('')}<tr><td><b>Total</b></td><td>${tot}/10</td></tr></table>`}
function renderPanel(){
  const mp=$('#mpanel'),m=S.mission;
  if(!m){mp.innerHTML=`<div class="mp-head"><div class="oc"><span class="lvchip">FREE</span> Free practice · no checking</div><h2>Your own website</h2></div><div class="mp-body"><div class="brief">Build anything you like. Your site is saved in this browser. Ideas:</div><ul style="line-height:1.6;padding-left:18px"><li>Make the SBA page: logo, nav area, content area, 2+ link types.</li><li>Add a page, then copy the navigation to every page.</li><li>Hand-code a page in Code view until Problems shows no errors.</li><li>Plan a site map, then publish it with FTP.</li><li>Run Evaluate it and chase 100%.</li><li>File ▸ Export to download your page as .html.</li><li>Doing a task your teacher set? Use <b>📤 Submit my work</b> below.</li></ul></div><div class="mp-actions"><button class="mbtn gold" id="mpSubmit" title="Hand in this website for a task your teacher set">📤 Submit my work</button><button class="mbtn" id="mpSave" title="Save a copy: HTML, JPG, PNG, PDF or the whole site as a .zip">⬇ Save a copy</button><button class="mbtn" id="mpMenu">🏠 Missions</button></div>`;$('#mpMenu').onclick=()=>{renderStart();showScreen('start')};$('#mpSubmit').onclick=practiceSubmit;$('#mpSave').onclick=()=>saveCopy(curPage());return}
  const list=MISSIONS.filter(x=>x.lv===m.lv),idx=list.indexOf(m)+1;
  mp.innerHTML=`<div class="mp-head"><div class="oc"><span class="lvchip">L${m.lv} · ${LV[m.lv].n}</span><span>${esc(m.oc)}</span><span>· ${idx}/${list.length}</span></div><h2>${esc(m.t)}</h2>${m.timer?`<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="mbtn" style="flex:none;min-width:0;padding:4px 10px;font-size:12.5px" id="mpTimer" aria-pressed="${S.ms.timerOn}">⏱ ${S.ms.timerOn?'Timer on':'Start timer (bonus XP)'}</button><span class="timer" id="mpClock" aria-live="off">${fmtT(S.ms.left)}</span></div>`:''}</div>
  <div class="mp-body"><div class="brief">${esc(m.brief)}</div><ol class="steps" id="mpSteps">${m.steps.map((st,i)=>`<li><span class="tick" aria-hidden="true">${i+1}</span><span class="st">${esc(st.s)}</span>${m.lv<3&&st.show?`<button class="shw" data-show="${i}" title="Show me where" aria-label="Show me where for step ${i+1}">👉</button>`:''}</li>`).join('')}</ol>${m.rubric?'<div id="mpRead"></div>':''}<div id="mpHint"></div><div id="mpFb"></div><div id="mpRes"></div></div>
  <div class="mp-actions"><button class="mbtn" id="mpHintB">💡 Hint</button><button class="mbtn" id="mpShow" ${m.lv===3?'disabled title="No Show me at Challenge level"':''}>👉 Show me</button><button class="mbtn gold" id="mpCheck">✅ Check my work</button></div>`;
  $('#mpHintB').onclick=hint;$('#mpShow').onclick=()=>{const i=stepRes().findIndex(x=>!x);if(i<0){toast('All steps done — press Check my work!');return}doShow(i)};
  $('#mpCheck').onclick=checkWork;
  $('#mpSteps').onclick=e=>{const b=e.target.closest('[data-show]');if(b)doShow(+b.dataset.show)};
  const tb=$('#mpTimer');if(tb)tb.onclick=()=>{if(S.ms.timerOn)return;S.ms.timerOn=true;startTimer();renderPanel();scheduleCheck()};
  liveTicks();if(m.rubric)renderReadout();
}
const fmtT=s=>Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
function startTimer(){stopTimer();_timerI=setInterval(()=>{if(!S.ms||S.ms.done){stopTimer();return}S.ms.left--;const c=$('#mpClock');if(c)c.textContent=fmtT(S.ms.left);if(S.ms.left<=0&&!S.ms.expired){S.ms.expired=true;toast('⏱ Time is up — keep going, you can still finish (no time bonus).');stopTimer()}},1000)}
function stopTimer(){clearInterval(_timerI)}
function hint(){
  const m=S.mission;const r=stepRes();const i=r.findIndex(x=>!x);if(i<0){toast('All steps are done — press ✅ Check my work.');return}
  const st=m.steps[i];const stage=S.ms.stage[i]||0;
  let txt;if(m.lv===3){txt=stage>0?'Challenge level gives one hint per step: '+st.h[0]:st.h[0]}else txt=st.h[Math.min(stage,st.h.length-1)];
  if(!(m.lv===3&&stage>0)){S.ms.hints++;S.ms.stage[i]=stage+1}
  $('#mpHint').innerHTML=`<div class="hintbox" role="status">💡 <b>Step ${i+1}${stage>0&&m.lv<3?' (exact)':''}:</b> ${esc(txt)}</div>`;
}
function doShow(i){const m=S.mission,st=m.steps[i];if(m.lv===3||!st.show)return;S.ms.show++;showMe(st.show)}
function showMe(sp){
  if(sp.mode&&S.mode!==sp.mode){S.mode='';setMode(sp.mode)}
  if(sp.pubStep&&pubStep!==sp.pubStep){pubStep=sp.pubStep;renderPublish()}
  if(sp.tab&&S.tab!==sp.tab){S.tab=sp.tab;renderRibbon()}
  if(innerWidth<=900&&sp.sel&&sp.sel.includes('data-page'))$('#sitepanel').classList.add('open');
  setTimeout(()=>{const el=$(sp.sel);if(!el){toast('Open the right view first, then try Show me again.');return}el.scrollIntoView({block:'nearest',inline:'nearest'});el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),4200)},60);
}
function checkWork(){
  const m=S.mission;if(!m||S.ms.done)return;const r=stepRes();
  const fb=$('#mpFb');
  fb.innerHTML=`<div class="fb" role="status">${m.steps.map((st,i)=>`<div class="${r[i]?'y':'n'}">${r[i]?'✅':'❌'} ${i+1}. ${esc(st.s)}${!r[i]?`<br><span style="color:#e6ecff;font-size:12.5px">↳ ${esc(st.h[0])}</span>`:''}</div>`).join('')}</div>`;
  if(r.every(Boolean))complete();else{S.ms.checks++;blip(240,.15,'square');const n=r.filter(x=>!x).length;toast(n+' step'+(n>1?'s':'')+' still to do — see the feedback.')}
}
function complete(){
  const m=S.mission,ms=S.ms;ms.done=true;stopTimer();
  let stars;const h=ms.hints,sh=ms.show;
  if(m.lv===1)stars=h+sh<=3?3:h+sh<=6?2:1;else if(m.lv===2)stars=h<=1&&sh===0?3:h+sh<=3?2:1;else stars=h===0?3:h<=2?2:1;
  if(m.lv===3&&ms.timerOn&&ms.expired)stars=Math.max(1,stars-1);
  const bonus=m.lv===3&&ms.timerOn&&!ms.expired?30:0;
  const xp=Math.round(LV[m.lv].base*stars/3)+bonus;
  const g=S.prog,old=g.done[m.id]||{stars:0,xp:0};const gain=Math.max(0,xp-old.xp);
  g.done[m.id]={stars:Math.max(stars,old.stars),xp:Math.max(xp,old.xp)};g.xp+=gain;
  g.streak=stars===3?(g.streak||0)+1:0;g.best=Math.max(g.best||0,g.streak);
  const newB=[];for(const b of BADGES)if(!g.badges[b.id]&&b.ok(g)){g.badges[b.id]=Date.now();newB.push(b)}
  saveProg();updateTop();
  let pct=Math.round(stars/3*100);let readout='';
  if(m.rubric){const R=m.rubric();const tot=R.reduce((a,x)=>a+x.got,0);pct=tot*10;readout=`<p style="margin:6px 0 0">SBA web page mark: <b>${tot}/10</b></p>`}
  try{parent.postMessage({type:'dm:result',kind:'game',id:'websim',title:m.t,score:stars,max:3,pct,level:m.lv},'*')}catch(e){}
  const list=MISSIONS.filter(x=>x.lv===m.lv),nx=list[list.indexOf(m)+1]||MISSIONS.find(x=>x.lv===m.lv+1);
  $('#mpRes').innerHTML=`<div class="result" role="status"><div class="bigstars" aria-label="${stars} out of 3 stars">${starStr(stars)}</div><b style="font:800 18px var(--disp)">Mission complete!</b><p style="margin:4px 0">+${gain} XP${bonus?' (incl. +30 time bonus)':''}${g.streak>1?' · 🔥 streak '+g.streak:''}</p>${readout}${newB.map(b=>`<p style="margin:4px 0">🏅 New badge: <b>${b.ic} ${b.n}</b></p>`).join('')}<p style="font-size:12.5px;color:#C9D3F5">${stars<3?'Tip: fewer hints = more stars. Replay any time.':'Flawless!'}</p><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${nx?`<button class="mbtn gold" id="mpNext">Next mission ▶</button>`:''}<button class="mbtn" id="mpAgain">↺ Replay</button><button class="mbtn" id="mpList">Mission list</button><button class="mbtn gold" id="mpSubmit">📤 Submit my work</button></div></div>`;
  $('#mpSubmit').onclick=()=>submitWork(m,stars);
  if(nx)$('#mpNext').onclick=()=>startMission(nx.id);$('#mpAgain').onclick=()=>startMission(m.id);$('#mpList').onclick=()=>renderLevels(m.lv);
  $('#mpRes').scrollIntoView({block:'nearest'});
  confetti();blip(523,.1);setTimeout(()=>blip(659,.1),110);setTimeout(()=>blip(784,.18),220);
  if(innerWidth<=900)$('#mpanel').classList.add('open');
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#F5C542','#6A3BA0','#2fbf71','#ff5d8f','#4cc9f0'];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}));
  let t=0;const step=()=>{x.clearRect(0,0,c.width,c.height);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()}if(++t<90)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)};step();
}
function updateTop(){$('#tbXp').textContent='⭐ '+S.prog.xp+' XP';$('#tbStreak').textContent='🔥 '+(S.prog.streak||0);$('#dialLbl').textContent=S.free&&!S.mission?'Free practice':'Level '+S.level+' · '+LV[S.level].n;const s=$('#tbSound');s.setAttribute('aria-pressed',S.prog.sound);s.textContent=S.prog.sound?'🔊 Sound':'🔇 Sound'}
function dial(d){const l=Math.max(1,Math.min(3,(S.level||1)+d));renderLevels(l)}

/* ---------- global wiring ---------- */
function applyCmd(c){
  if(!c)return;closeMenu();
  if(c.startsWith('style-')){const f=needSel(['heading','text'],'Click the paragraph or heading you want to restyle.');if(!f)return;retag(f,c.slice(6));renderDesign();select(f.b.id);designEdit();return}
  if(c.startsWith('layout-')){const p=curPage();p.layout=c.slice(7);if(p.css!=null){p.css=null;toast('Your own CSS was replaced by the template')}renderAll();designEdit();return}
  if(c.startsWith('cols-')){const p=curPage();p.cols=+c.slice(5);renderAll();designEdit();return}
  if(c.startsWith('theme-')){const p=curPage();if(p.css!=null){p.css=null;toast('Your own CSS was replaced by the theme · Ctrl+Z to undo')}p.theme=c.slice(6);renderAll();designEdit();if(S.site.pages.length>1)setStatusTip('Tip: Layout ▸ Apply this design to all pages keeps the site consistent');return}
  if(c.startsWith('font-')){const p=curPage();if(p.css!=null){p.css=null;toast('Your own CSS was replaced by the theme')}p.font=c.slice(5);renderAll();designEdit();return}
  if(c.startsWith('nn-')){toast('Not needed for CSEC — try clicking the block you want and editing it directly.');return}
  if(c==='sitepanel'){$('#sitepanel').classList.toggle('open');return}
  if(CMD[c]){if((S.mode!=='design')&&['logo','navbar','picture','video','table','bookmark','button','form','f-text','f-radio','f-check','f-submit','ins-h2','ins-p','ins-hr','paste','cut','copy','up','down','delete','alt','compress','changepic','bullets','numbers','alignL','alignC','alignR','w-200','w-400','w-600','w-fit'].includes(c)){if(S.mode==='code'){toast('That command works in Design view — switch with ✏️ Design, or type the HTML here.');return}setMode('design')}CMD[c]()}
}
function wire(){
  $('#office').addEventListener('mousedown',e=>{if(e.target.closest('#ribbon button,.qat button'))e.preventDefault()});
  $('#office').addEventListener('click',e=>{
    const t=e.target.closest('[data-tab]');if(t){if(t.dataset.tab==='file'){openBackstage('info');return}S.tab=t.dataset.tab;renderRibbon();return}
    const md=e.target.closest('.titlebar [data-mode]');if(md){setMode(md.dataset.mode);return}
    const c=e.target.closest('#ribbon [data-cmd],.qat [data-cmd],#statusbar [data-cmd]');if(c)applyCmd(c.dataset.cmd);
  });
  $('#tabsrow').addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const tabs=$$('#tabsrow [data-tab]');const i=tabs.indexOf(document.activeElement);if(i<0)return;const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];if(n.dataset.tab!=='file'){S.tab=n.dataset.tab;renderRibbon()}$('#tab-'+n.dataset.tab).focus()});
  document.addEventListener('keydown',e=>{
    if($('#game').classList.contains('hidden'))return;
    const k=e.key.toLowerCase(),inField=e.target.closest&&e.target.closest('input,textarea,select');
    if((e.ctrlKey||e.metaKey)&&k==='k'){e.preventDefault();if(S.mode==='design'||S.mode==='code')CMD.hyperlink();return}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==='s'){e.preventDefault();saveCopy(curPage());return}
    if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();CMD.save();return}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==='b'){e.preventDefault();openBrowser(S.cur);return}
    if((e.ctrlKey||e.metaKey)&&!inField&&(k==='z'||k==='y')){e.preventDefault();(k==='z'&&!e.shiftKey)?undo():redo();return}
    if(e.key==='Escape'&&!$('.dlgback')){closeMenu();if($('.backstage')){closeBackstage();renderRibbon()}}
  });
  document.addEventListener('click',e=>{
    const lv=e.target.closest('[data-lv]');if(lv){renderLevels(+lv.dataset.lv);return}
    const ms=e.target.closest('[data-mission]');if(ms){startMission(ms.dataset.mission);return}
    const dl=e.target.closest('[data-dial]');if(dl){dial(+dl.dataset.dial);return}
    const go=e.target.closest('[data-go]');if(go){if(go.dataset.go==='start')renderStart();if(go.dataset.go==='badgesScr'){renderBadges();return}showScreen(go.dataset.go);return}
    const id=e.target.id;
    if(id==='sFree'||id==='lFree')startFree();
    else if(id==='sHow')howToPlay();else if(id==='sRef')quickRef();else if(id==='sBadges')renderBadges();
    else if(id==='bReset'&&window.GameSave)GameSave.startOver();
    else if(id==='bReset')dialog({course:true,title:'Reset progress?',body:'<p>This clears all stars, XP, badges and your free-practice site in this browser. It cannot be undone.</p>',buttons:[{l:'Cancel'},{l:'Reset',pri:true,act(){S.prog={done:{},xp:0,badges:{},streak:0,best:0,sound:S.prog.sound,sandbox:null};saveProg();renderBadges();toast('Progress reset')}}]});
  });
  $('#tbMenu').onclick=()=>{renderStart();showScreen('start')};
  $('#dialDown').onclick=()=>dial(-1);$('#dialUp').onclick=()=>dial(1);
  $('#tbSound').onclick=()=>{S.prog.sound=!S.prog.sound;saveProg();updateTop();blip(660,.08)};
  $('#tbHelp').onclick=howToPlay;$('#tbRef').onclick=quickRef;
  $('#tbPanel').onclick=()=>{const mp=$('#mpanel');if(innerWidth<=900){mp.classList.toggle('open');mp.classList.remove('hidden');$('#tbPanel').setAttribute('aria-pressed',mp.classList.contains('open'))}else{mp.classList.toggle('hidden');$('#tbPanel').setAttribute('aria-pressed',!mp.classList.contains('hidden'))}};
  const qat=$('.qat');qat.insertAdjacentHTML('afterbegin','<button data-cmd="sitepanel" title="Show or hide the Site panel" aria-label="Show or hide the Site panel">📁</button>');
}
function narrowBanner(){if(innerWidth>=600||S._bannerOff||$('.narrow-banner'))return;const b=document.createElement('div');b.className='narrow-banner';b.setAttribute('role','status');b.innerHTML='📱 Best on a laptop or tablet in landscape.<button aria-label="Dismiss">OK</button>';b.querySelector('button').onclick=()=>{S._bannerOff=true;b.remove()};$('.topbar').after(b)}
function init(){
  loadProg();S.site=siteClub();
  setupCanvas();setupSitePanel();buildCodeView();wire();
  renderStart();
  const u=new URLSearchParams(location.search);
  if(u.get('mission')&&MISSIONS.some(m=>m.id===u.get('mission')))startMission(u.get('mission'));
  else if(u.get('mode')==='free')startFree();
  else if(['1','2','3'].includes(u.get('level')))renderLevels(+u.get('level'));
  else showScreen('start');
  narrowBanner();addEventListener('resize',narrowBanner);
}
init();
/* ---------- saved progress (GameSave) ----------
   Stars, XP, badges and the free-practice site were already kept under KEY. This also keeps the mission in progress
   (the site being built, the page and view, hints used and steps tracked), so a student who leaves comes back to it.
   A timed challenge restarts its clock. "Start over" (GameSave, also ↺ Reset progress) clears everything. */
(function(){
  if(!window.GameSave)return;
  GameSave.register([KEY,KEY+'.*']);
  let off=false,qT=0,pending=null;
  const inGame=()=>!$('#game').classList.contains('hidden');
  function get(){
    if(off)return undefined;
    if(S.mission&&S.ms&&!S.ms.done&&inGame())return {v:1,mission:S.mission.id,site:S.site,cur:S.cur,mode:S.mode,device:S.device,
      ms:{hints:S.ms.hints,stage:S.ms.stage,show:S.ms.show,checks:S.ms.checks},track:S.track,pubStep};
    if(S.free&&inGame())return {v:1,free:true,cur:S.cur};
    return {v:1};
  }
  GameSave.persist({key:KEY+'.session',get,set:v=>{pending=v},welcome:false});
  GameSave.onReset(()=>{off=true;clearTimeout(qT);try{history.replaceState(null,'',location.pathname)}catch(e){}});
  const sc0=window.scheduleCheck;
  window.scheduleCheck=function(){sc0.apply(this,arguments);clearTimeout(qT);qT=setTimeout(()=>{if(!off)GameSave.save()},800)};
  const v=pending;if(!v||v.v!==1||!(v.mission||v.free))return;
  const u=new URLSearchParams(location.search),qm=u.get('mission'),ql=u.get('level'),qf=u.get('mode')==='free';
  try{
    if(v.mission){
      const m=MISSIONS.find(x=>x.id===v.mission);
      if(!m||(qm&&qm!==m.id)||qf||(ql&&+ql!==m.lv))return;
      if(!(v.site&&Array.isArray(v.site.pages)&&v.site.pages.length&&v.site.pages.every(p=>p&&p.file&&p.regions)))return;
      startMission(m.id);
      S.site=v.site;if(v.site.pages.some(p=>p.file===v.cur))S.cur=v.cur;
      const ms=v.ms||{};S.ms.hints=+ms.hints||0;S.ms.show=+ms.show||0;S.ms.checks=+ms.checks||0;if(ms.stage&&typeof ms.stage==='object')S.ms.stage=ms.stage;
      if(v.track&&typeof v.track==='object')S.track=v.track;
      if(typeof v.pubStep==='number'&&v.pubStep>=1&&v.pubStep<=4)pubStep=v.pubStep;
      if(['desktop','tablet','phone'].includes(v.device))S.device=v.device;
      enterGame(['design','code','plan','publish','evaluate','words'].includes(v.mode)?v.mode:(m.mode||'design'));
      scheduleCheck();
    }else{
      if(qm||ql)return;
      if(!S.free||!inGame())startFree();
      if(S.site.pages.some(p=>p.file===v.cur)){S.cur=v.cur;renderAll()}
    }
    setTimeout(()=>GameSave.toast('Welcome back! Your progress was restored.'),400);
  }catch(e){}
})();
</script>

<script id="ea-live-arena">
/* Exam Ace · Live Arena · Kester Small */
(function () {
  if (window.__eaLiveArena) return; window.__eaLiveArena = true;

    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
