<!DOCTYPE html>
<html lang="en" data-gs-own>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Page Builder · CSEC Information Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#14275f;--gold:#F5C542;--gold2:#ffd96b;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --disp:"Bricolage Grotesque","Segoe UI",system-ui,Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  --brand:#6A3BA0;--brand2:#55308a;--blue:#0F6CBD;--ok:#107C41;--bad:#C42B1C;--warn:#8A5A00;
  --rb:#F3F2F1;--rbline:#E1DFDD;--txt:#201F1E;--mut:#605E5C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--txt);background:var(--navy);overflow:hidden}
.hidden{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #F5C542;outline-offset:2px}
.office :focus-visible,.dlg :focus-visible{outline:2px solid #0F6CBD;outline-offset:1px}
button{font:inherit;color:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- course screens ---------- */
.scr{position:fixed;inset:0;overflow:auto;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#EEF2FF;font-family:var(--body)}
.scr-in{max-width:1080px;margin:0 auto;padding:28px 22px 40px}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.applogo{width:46px;height:46px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;font:800 20px var(--disp);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.kicker{color:var(--gold);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
h1.big{font:800 clamp(30px,5vw,48px)/1.05 var(--disp);margin:14px 0 8px;color:#fff}
.pitch{font-size:18px;max-width:760px;color:#D6DEFF;margin:0 0 14px}
.objs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 22px}
.obj{border:1px solid rgba(245,197,66,.45);color:#FFE7A3;border-radius:999px;padding:5px 11px;font-size:13px;background:rgba(245,197,66,.08)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.lvcard{text-align:left;background:linear-gradient(180deg,#12245e,#0d1b4a);border:1px solid #2a3f86;border-radius:18px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:8px;min-height:190px;transition:transform .15s,border-color .15s}
.lvcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.lvcard .ico{font-size:30px}
.lvcard h3{font:800 22px var(--disp);margin:0}
.lvcard p{margin:0;color:#C9D3F5;font-size:15px}
.bar{height:8px;border-radius:9px;background:#26386f;overflow:hidden;margin-top:auto}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:9px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.cbtn{background:#1a2c66;border:1px solid #33499a;color:#fff;border-radius:12px;padding:11px 16px;font:700 15px var(--body)}
.cbtn:hover{border-color:var(--gold)}
.cbtn.gold{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.credit{margin-top:30px;color:#9fb0e6;font-size:13px}
.dial{display:inline-flex;align-items:center;gap:4px;background:#0f1f52;border:1px solid #2f4592;border-radius:999px;padding:3px}
.dial button{white-space:nowrap;background:transparent;border:0;color:#fff;border-radius:999px;padding:5px 10px;font:700 13px var(--body)}
.dial button:hover{background:#21357a}
.dial span{font:700 13px var(--body);color:var(--gold);padding:0 6px;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.mcard{text-align:left;background:#0f2056;border:1px solid #2a3f86;border-radius:14px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:6px}
.mcard:hover{border-color:var(--gold)}
.mcard .oc{font-size:12px;color:#FFE7A3}
.mcard b{font:700 17px var(--disp)}
.mcard small{color:#C9D3F5;font-size:13px}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.stars .off{color:#3b4f8f}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.badge{background:#0f2056;border:1px solid #2a3f86;border-radius:14px;padding:12px;text-align:center}
.badge .bi{font-size:30px}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge b{display:block;font:700 15px var(--disp);margin:4px 0}
.badge small{color:#C9D3F5}
.statrow{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stat{background:#0f2056;border:1px solid #2a3f86;border-radius:12px;padding:10px 14px;min-width:130px}
.stat b{display:block;font:800 24px var(--disp);color:var(--gold)}
.narrow-banner{flex:none;margin:4px 6px;background:#FFF4CE;color:#3b2b00;border:1px solid #e0c56b;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font:600 14px var(--body)}
.narrow-banner button{margin-left:auto;background:#3b2b00;color:#fff;border:0;border-radius:8px;padding:4px 10px}

/* ---------- game frame ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#C8C6C4}
.topbar{height:44px;flex:none;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px;font-family:var(--body);overflow-x:auto;overflow-y:hidden}
.topbar .tb{background:#13245c;border:1px solid #2c4290;color:#fff;border-radius:9px;padding:5px 10px;font:700 13px var(--body);white-space:nowrap}
.topbar .tb:hover{border-color:var(--gold)}
.topbar .tb[aria-pressed=true]{background:var(--gold);color:#1a1300}
.topbar .pill{font:700 13px var(--body);color:var(--gold);white-space:nowrap;padding:0 4px}
.topbar .grow{flex:1}
.gamebody{flex:1;display:flex;min-height:0;position:relative}

/* ---------- office window ---------- */
.office{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;font-size:13px;position:relative}
.titlebar{height:40px;flex:none;background:var(--brand);color:#fff;display:flex;align-items:center;gap:6px;padding:0 6px;overflow-x:auto;overflow-y:hidden}
.titlebar .qat{display:flex;gap:2px}
.titlebar .qat button,.winbtn{background:transparent;border:0;color:#fff;width:30px;height:30px;border-radius:4px;display:grid;place-items:center}
.titlebar .qat button:hover,.winbtn:hover{background:rgba(255,255,255,.18)}
.ttl{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;min-width:120px}
.appico{width:22px;height:22px;border-radius:6px;background:#fff;color:var(--brand);display:grid;place-items:center;font:800 11px var(--ui);flex:none}
.seg{display:inline-flex;background:rgba(0,0,0,.22);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;color:#fff;border-radius:5px;padding:4px 9px;font:600 12.5px var(--ui);white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.16)}
.seg button[aria-pressed=true]{background:#fff;color:var(--brand2)}
.tabsrow{display:flex;align-items:flex-end;background:var(--rb);border-bottom:1px solid var(--rbline);padding:0 6px;height:32px;flex:none;overflow-x:auto;overflow-y:hidden}
.rtab{border:0;background:transparent;padding:6px 12px;font:13px var(--ui);color:#323130;border-bottom:3px solid transparent;white-space:nowrap}
.rtab:hover{background:#E9E7E5}
.rtab[aria-selected=true]{color:var(--brand2);border-bottom-color:var(--brand);font-weight:600}
.rtab.file{background:var(--brand);color:#fff;border-radius:3px 3px 0 0;margin-right:4px}
.rtab.ctx{color:#8a1f7a}
.rtab.ctx[aria-selected=true]{border-bottom-color:#b4009e;color:#8a1f7a}
.ribbon{height:96px;flex:none;background:var(--rb);border-bottom:1px solid var(--rbline);display:flex;padding:4px 4px 0;overflow-x:auto;overflow-y:hidden}
.grp{display:flex;flex-direction:column;border-right:1px solid var(--rbline);padding:0 6px;flex:none}
.grp .gi{display:flex;gap:2px;flex:1;align-items:flex-start}
.grp .gl{text-align:center;color:var(--mut);font-size:11px;padding:1px 0 3px;white-space:nowrap}
.col{display:flex;flex-direction:column;gap:1px}
.rbtn{border:1px solid transparent;background:transparent;border-radius:4px;display:flex;align-items:center;gap:5px;padding:2px 5px;font:12px var(--ui);color:#323130;white-space:nowrap;min-height:22px}
.rbtn:hover{background:#E1DFDD}
.rbtn[aria-pressed=true]{background:#D2D0CE;border-color:#B3B0AD}
.rbtn.big{flex-direction:column;justify-content:flex-start;padding:4px 6px;min-width:52px;height:68px;gap:2px;text-align:center;white-space:normal;line-height:1.15}
.rbtn.big svg{width:30px;height:30px}
.rbtn svg{width:16px;height:16px;flex:none}
.rbtn .k{font-weight:700;font-family:Georgia,serif;width:16px;text-align:center}
.gal{display:flex;gap:4px;align-items:flex-start;flex-wrap:nowrap}
.gitem{border:1px solid #C8C6C4;background:#fff;border-radius:4px;padding:3px;width:62px;height:66px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;line-height:1.1;text-align:center}
.gitem:hover{border-color:var(--brand)}
.gitem[aria-pressed=true]{border:2px solid var(--brand);padding:2px}
.gitem .sw{width:52px;height:34px;border-radius:3px;overflow:hidden;display:block}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #ff3d7f!important;outline-offset:2px;position:relative;z-index:5}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,61,127,.35)}}
.workspace{flex:1;display:flex;min-height:0;position:relative}
.sitepanel{width:212px;flex:none;background:#FAF9F8;border-right:1px solid var(--rbline);overflow:auto;padding:8px 0}
.sitepanel h2{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:10px 12px 4px;display:flex;align-items:center;gap:4px}
.sitepanel .sn{font:600 14px var(--ui);margin:0 12px;color:var(--txt)}
.sitepanel .sd{font-size:11.5px;color:var(--mut);margin:0 12px 4px;word-break:break-all}
.fitem{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:4px 10px 4px 14px;font:12.5px var(--ui);color:var(--txt)}
.fitem:hover{background:#EDEBE9}
.fitem[aria-current=true]{background:#E5DDF3;font-weight:600;box-shadow:inset 3px 0 var(--brand)}
.fitem .fi{width:18px;text-align:center}
.fitem .fx{margin-left:auto;color:var(--mut);font-size:11px}
.addbtn{border:1px dashed #A19F9D;background:#fff;border-radius:4px;margin:4px 12px;padding:3px 8px;font:12px var(--ui);color:var(--brand2)}
.stage{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;background:#E6E5E4}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.statusbar{height:24px;flex:none;background:var(--rb);border-top:1px solid var(--rbline);display:flex;align-items:center;gap:14px;padding:0 10px;font-size:12px;color:#3b3a39;overflow:hidden;white-space:nowrap}
.statusbar button{border:0;background:transparent;font:12px var(--ui);padding:1px 6px;border-radius:3px}
.statusbar button:hover{background:#E1DFDD}
.statusbar .sp{flex:1}

/* design canvas */
.canvas-scroll{flex:1;overflow:auto;padding:18px 14px 40px}
.pgc{container-type:inline-size;margin:0 auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);position:relative}
.pgc.w-desktop{width:100%;max-width:1100px}
.pgc.w-tablet{width:768px;max-width:none}
.pgc.w-phone{width:390px;max-width:none}
:where(.pg){background:#fff;color:#000;font:16px/normal "Times New Roman",Times,serif;text-align:left;min-height:100%}
.pg{overflow-wrap:normal}
#pgD [data-region]{position:relative;outline:1px dashed rgba(106,59,160,.55);outline-offset:-1px;min-height:44px}
#pgD.nolabels [data-region]{outline-color:transparent}
#pgD [data-region]::before{content:attr(data-region);position:absolute;left:2px;top:2px;font:600 10px/1 var(--ui);background:rgba(106,59,160,.9);color:#fff;padding:2px 5px;border-radius:3px;z-index:3;pointer-events:none;letter-spacing:.04em}
#pgD.nolabels [data-region]::before{display:none}
#pgD [data-region].rsel{outline:2px solid var(--brand)}
#pgD [data-region].dropping{background-image:linear-gradient(rgba(106,59,160,.08),rgba(106,59,160,.08))}
#pgD .blk{position:relative;outline:1px dashed transparent;outline-offset:2px;min-width:30px}
#pgD .blk:hover{outline-color:#8a8886}
#pgD .blk.sel{outline:2px solid #0F6CBD}
#pgD .blk.dragging{opacity:.4}
#pgD .dropline{height:4px;background:#0F6CBD;border-radius:2px;margin:2px 0;flex-basis:100%}
#pgD .bbar{position:absolute;right:0;top:-24px;display:none;gap:1px;background:#0F6CBD;border-radius:4px 4px 0 0;padding:1px 2px;z-index:6;font:11px var(--ui);color:#fff;white-space:nowrap}
#pgD .blk:hover>.bbar,#pgD .blk.sel>.bbar{display:flex}
#pgD .bbar button{border:0;background:transparent;color:#fff;padding:1px 5px;border-radius:3px;font:12px var(--ui);line-height:18px}
#pgD .bbar button:hover{background:rgba(255,255,255,.25)}
#pgD .bbar .lab{padding:1px 6px;cursor:grab;line-height:18px}
#pgD .ph{color:#8a8886;font:italic 13px var(--ui);padding:14px 10px 10px;text-align:center;flex:1}
#pgD [contenteditable]{outline:none;cursor:text}
#pgD [contenteditable]:focus{background:rgba(15,108,189,.05)}

/* code view */
.codewrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0}
.codeleft{display:flex;flex-direction:column;min-width:0;border-right:1px solid #C8C6C4;background:#1E1E1E}
.ctool{display:flex;gap:6px;align-items:center;padding:5px 8px;background:#2D2D30;color:#ddd;flex-wrap:wrap}
.ctool button,.ctool select{background:#3E3E42;border:1px solid #555;color:#eee;border-radius:4px;padding:3px 8px;font:12px var(--ui)}
.ctool button:hover{background:#505055}
.ctool .clbl{font:600 12px var(--ui);color:#fff;margin-right:auto}
.editor{flex:1;position:relative;min-height:0;display:flex;font:13px/20px var(--mono)}
.gutter{width:44px;flex:none;background:#1E1E1E;color:#858585;text-align:right;padding:8px 8px 8px 0;overflow:hidden;user-select:none;white-space:pre}
.gutter .er{color:#ff8080;font-weight:700}
.edarea{flex:1;position:relative;min-width:0}
.edarea pre,.edarea textarea{position:absolute;inset:0;margin:0;padding:8px 10px;font:13px/20px var(--mono);white-space:pre;overflow:auto;tab-size:2;border:0;letter-spacing:0}
.edarea pre{color:#D4D4D4;pointer-events:none;overflow:hidden}
.edarea textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none}
.edarea textarea::selection{background:rgba(38,79,120,.85);color:transparent}
.edarea textarea:focus-visible{box-shadow:inset 0 0 0 2px #0F6CBD}
.hl-t{color:#569CD6}.hl-a{color:#9CDCFE}.hl-v{color:#CE9178}.hl-c{color:#6A9955}.hl-d{color:#808080}.hl-p{color:#808080}
.problems{height:150px;flex:none;background:#252526;color:#ddd;overflow:auto;border-top:1px solid #3c3c3c;font:12.5px var(--ui)}
.problems h3{margin:0;padding:5px 10px;font:600 12px var(--ui);background:#2D2D30;position:sticky;top:0;display:flex;gap:8px}
.prob{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:#ddd;padding:4px 10px;font:12.5px var(--ui)}
.prob:hover{background:#37373d}
.prob .pi{width:16px;flex:none}
.prob.err .pi{color:#f48771}.prob.warn .pi{color:#cca700}
.codert{display:flex;flex-direction:column;min-width:0;background:#E6E5E4}
.prevhead{display:flex;gap:6px;align-items:center;padding:5px 8px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font:600 12px var(--ui)}
.prevhead .grow{flex:1}
.mini{border:1px solid #C8C6C4;background:#fff;border-radius:4px;padding:2px 8px;font:12px var(--ui)}
.mini[aria-pressed=true]{background:#E5DDF3;border-color:var(--brand)}
.prevscroll{flex:1;overflow:auto;padding:12px}

/* tool views (plan/publish/evaluate/words) */
.tool{flex:1;overflow:auto;padding:14px 16px 30px;background:#F5F4F3}
.toolhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.toolhead h2{font:600 18px var(--ui);margin:0}
.toolhead p{margin:0;color:var(--mut)}
.card{background:#fff;border:1px solid #E1DFDD;border-radius:8px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin:0 0 8px;font:600 14px var(--ui)}
.btn{border:1px solid #8A8886;background:#fff;border-radius:4px;padding:5px 12px;font:13px var(--ui);color:var(--txt)}
.btn:hover{background:#F3F2F1}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.fld{display:flex;flex-direction:column;gap:3px;margin:6px 0;font-size:12.5px}
.fld input,.fld select,.fld textarea{font:13px var(--ui);padding:5px 7px;border:1px solid #8A8886;border-radius:4px;background:#fff;color:var(--txt)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #0F6CBD;outline-offset:-1px}
.note{font-size:12px;color:var(--mut)}
.okc{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}

/* sitemap */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{display:flex;justify-content:center;padding-top:18px;position:relative}
.tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:18px 6px 0}
.tree>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;width:50%;height:18px;border-top:2px solid #8A8886}
.tree li::before{right:50%}.tree li::after{left:50%;border-left:2px solid #8A8886}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:18px}
.tree li:only-child>.node::before{content:"";position:absolute;top:-18px;left:50%;height:18px;border-left:2px solid #8A8886}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:2px solid #8A8886;border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree>li::before,.tree>li::after{display:none}
.tree ul::before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:2px solid #8A8886}
.node{background:#fff;border:2px solid var(--brand);border-radius:8px;padding:6px;min-width:110px;text-align:center;position:relative}
.node input{width:104px;border:1px solid #C8C6C4;border-radius:3px;font:600 12.5px var(--ui);text-align:center;padding:2px}
.node .nf{font-size:11px;color:var(--mut);margin:2px 0}
.node .nb{display:flex;gap:3px;justify-content:center}
.node .nb button{border:1px solid #C8C6C4;background:#fff;border-radius:3px;font-size:11px;padding:1px 6px}
.wire{position:relative;width:100%;aspect-ratio:4/3;background:#fff repeating-linear-gradient(0deg,transparent 0 19px,#f0eff5 19px 20px),#fff;background-color:#fff;border:2px solid #8A8886;border-radius:6px;touch-action:none;overflow:hidden}
.wbox{position:absolute;border:2px dashed #555;background:rgba(106,59,160,.10);display:flex;align-items:center;justify-content:center;font:600 12px var(--ui);color:#2b1a40;cursor:move;user-select:none;touch-action:none;overflow:hidden;text-align:center}
.wbox:focus{outline:2px solid #0F6CBD}
.wbox .rz{position:absolute;right:0;bottom:0;width:14px;height:14px;background:linear-gradient(135deg,transparent 50%,#555 50%);cursor:nwse-resize}
.wbox .wx{position:absolute;right:2px;top:1px;border:0;background:transparent;font-size:12px;line-height:1;padding:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:2px dashed #555;background:#fff;border-radius:6px;padding:5px 10px;font:600 12.5px var(--ui);cursor:grab;touch-action:none;user-select:none}

/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.

/* ---------- pretty printer ---------- */
const BLK=new Set('ul ol li table thead tbody tfoot tr th td form section article div p h1 h2 h3 h4 h5 h6 figure figcaption blockquote hr header footer nav aside main fieldset select dl dt dd'.split(' '));
const LEAFISH=new Set('p h1 h2 h3 h4 h5 h6 th td li label a button figcaption dt dd'.split(' '));
const attrsStr=n=>[...n.attributes].map(a=>` ${a.name}="${escAttr(a.value)}"`).join('');
function ppNode(n,ind){
  if(n.nodeType===3){const s=n.textContent.replace(/\s+/g,' ').trim();return s?ind+escText(s):''}
  if(n.nodeType===8)return ind+'<!--'+n.textContent+'-->';

  const big=kids.some(k=>k.nodeType===1&&BLK.has(k.tagName.toLowerCase())&&!(LEAFISH.has(tag)&&!['ul','ol','table','p','div','form','h1','h2','h3','li','tr'].includes(k.tagName.toLowerCase())));
  if(!big)return ind+n.outerHTML;
  const inner=kids.map(k=>ppNode(k,ind+'  ')).filter(Boolean);

}
function pp(h,ind){const t=document.createElement('template');t.innerHTML=h;return [...t.content.childNodes].map(n=>ppNode(n,ind)).filter(Boolean).join('\n')}
function pageHtml(p){

  for(const r of REGIONS){const bl=p.regions[r];if(!bl.length)continue;s+=`  <${r}${p.ra[r]?' '+p.ra[r]:''}>\n`+bl.map(b=>pp(b.h,'    ')).join('\n')+`\n  </${r}>\n`}

}
const codeOf=p=>p.src!=null?p.src:pageHtml(p);

/* ---------- parse code back into the page model ---------- */
const CONT=new Set('ul ol table thead tbody tfoot tr form section article div nav header footer main aside figure select dl fieldset body'.split(' '));

function parseCode(p,src){

  const R={header:[],nav:[],main:[],aside:[],footer:[]};p.ra={};
  const add=(n,r)=>{
    if(n.nodeType===3){const s=n.textContent.trim();if(s)R[r].push(B('<p>'+escText(s)+'</p>'));return}
    if(n.nodeType!==1)return;
    const tag=n.tagName.toLowerCase();

  const body=d.body;collapseWs(body);

  for(const n of [...body.childNodes]){
    const tag=n.nodeType===1?n.tagName.toLowerCase():'';

  const m=/\/\*\s*Web Page Builder · theme:(\w+) · font:(\w+) · layout:(\w+) · cols:(\d) · phone:(yes|no)\s*\*\//.exec(st);
  if(m){
    p.theme=THEMES[m[1]]?m[1]:'plain';p.font=FONTS[m[2]]?m[2]:'segoe';p.layout=LAYOUTS[m[3]]?m[3]:'basic';p.cols=+m[4]||1;p.responsive=m[5]==='yes';
    const i=st.indexOf('/* My styles */');const gen=i>=0?st.slice(0,i):st,mine=i>=0?st.slice(i+15):'';
    const norm=s=>s.replace(/\s+/g,'');
    if(norm(gen.slice(gen.indexOf('/* Web Page Builder')))===norm(genCss(p))){p.css=null;p.myCss=mine.split('\n').map(l=>l.replace(/^ {4}/,'')).join('\n').trim()}
    else p.css=st.split('\n').map(l=>l.replace(/^ {4}/,'')).join('\n').trim();
  }else p.css=st.split('\n').map(l=>l.replace(/^ {4}/,'')).join('\n').trim();
}

/* ---------- scope page CSS so it only styles the simulated page ---------- */
function scopeCss(css,sc){
  css=String(css||'').replace(/\/\*[\s\S]*?\*\//g,'').replace(/url\s*\(/gi,'x-url(').replace(/@import[^;]*;/gi,'');
  const pre=s=>{s=s.trim();if(!s)return '';if(/^(html\s+body|html|body|:root)\b/i.test(s))return s.replace(/^(html\s+body|html|body|:root)/i,sc);if(s==='*')return sc+' *';return sc+' '+s};
  const block=str=>{let out='',pos=0;
    while(pos<str.length){const ob=str.indexOf('{',pos);if(ob<0)break;const sel=str.slice(pos,ob).trim();let d=1,j=ob+1;while(j<str.length&&d){if(str[j]==='{')d++;else if(str[j]==='}')d--;j++}
      const body=str.slice(ob+1,j-1);
      if(/^@media/i.test(sel)){const conds=sel.match(/\([^)]*\)/g);if(conds)out+='@container '+conds.join(' and ')+'{'+block(body)+'}'}
      else if(/^@(keyframes|-webkit-keyframes)/i.test(sel))out+=sel+'{'+body+'}';
      else if(!sel.startsWith('@'))out+=sel.split(',').map(pre).filter(Boolean).join(',')+'{'+body+'}';
      pos=j}
    return out};
  try{return block(css)}catch(e){return ''}
}

/* ---------- media resolution (all pictures are drawn in-app; nothing is fetched) ---------- */
const normPath=s=>{s=String(s||'').trim().replace(/^\.\//,'').replace(/^\//,'');try{s=decodeURI(s)}catch(e){}return s.split('?')[0]};

  if(GALLERY[s])return svgUri(GALLERY[s].svg);
  if(isLogoFile(site,s))return svgUri(logoSvg(site.logo));

}
function siteHasFile(site,f){f=normPath(f);return site.files.some(x=>x.name===f)||!!GALLERY[f]}
function fixMedia(root,opt){

  for(const im of root.querySelectorAll('img')){
    const src=im.getAttribute('src')||'';im.setAttribute('data-o',src);
    const u=imgData(site,src,opt);
    if(u)im.setAttribute('src',u);
    else{const w=+im.getAttribute('width')||160;im.setAttribute('src',svgUri(brokenSvg(im.getAttribute('alt')||src||'(no src)',Math.max(60,Math.min(w,600)),Math.max(50,Math.round(Math.min(w,600)*.5)))));im.setAttribute('data-broken','1')}
  }

}

  for(const e of root.querySelectorAll('script,iframe,object,embed,link,base,meta,style,noscript,frame,frameset'))e.remove();

}
function cleanHTML(el){
  const c=el.cloneNode(true);c.removeAttribute('contenteditable');
  for(const e of [c,...c.querySelectorAll('*')]){e.removeAttribute('contenteditable');if(e.hasAttribute('data-o')){e.setAttribute('src',e.getAttribute('data-o'));e.removeAttribute('data-o');e.removeAttribute('data-broken')}if(e.getAttribute('style')==='')e.removeAttribute('style')}

/* Render a whole HTML document (as text) into a host element, scoped and safe */
let _pgN=0;
function renderDoc(host,src,opt={}){

  const id='pgx'+(++_pgN);

/* ---------- link helpers ---------- */
function linkType(href){
  href=String(href||'').trim();if(!href)return 'none';
  if(href.startsWith('#'))return 'bookmark';
  if(/^mailto:/i.test(href))return 'email';
  if(/^(https?:)?\/\//i.test(href))return 'web';
  if(/^[a-z]+:/i.test(href))return 'other';
  const f=href.split('#')[0].split('?')[0];
  return /\.html?$/i.test(f)?'page':'file';
}
const LT_NAMES={page:'link to another page',bookmark:'bookmark (same page)',email:'e-mail (mailto)',file:'link to a file',web:'web address'};
function hrefProblem(href,site,ids){
  const t=linkType(href);href=String(href||'').trim();
  if(t==='none')return 'This link has an empty href, so it goes nowhere.';
  if(t==='email'){const addr=href.slice(7).split('?')[0];return /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(addr)?null:`The e-mail link "${href}" doesn't contain a valid address.`}
  if(t==='bookmark'){const id=href.slice(1);return !id||ids.has(id)?null:`There is no bookmark called "${id}" on this page (nothing has id="${id}").`}
  if(t==='page'){const f=normPath(href.split('#')[0]);return site.pages.some(p=>p.file===f)?null:`Broken link: "${f}" is not a page in this site.`}
  if(t==='file'){if(/@/.test(href))return `E-mail links must start with mailto: (e.g. mailto:${href.replace(/^mailto\s*/i,'').trim()}).`;const f=normPath(href);return siteHasFile(site,f)?null:`Broken link: the file "${f}" is not in the site folder.`}
  if(t==='other')return `"${href}" is not a link type used in CSEC web pages.`;
  return null;
}
const _docCache=new Map();

function idsIn(d){return new Set($$('[id]',d).map(e=>e.id))}
function linksOf(p){const d=pageDoc(p);return $$('a[href]',d).map(a=>({href:a.getAttribute('href').trim(),type:linkType(a.getAttribute('href')),text:a.textContent.trim(),inNav:!!a.closest('nav'),inFooter:!!a.closest('footer'),cls:a.className}))}

/* ---------- validator (friendly messages with line numbers) ---------- */
const VOID=new Set('area base br col embed hr img input link meta source track wbr'.split(' '));
const KNOWN=new Set('html head title meta style body header nav main section article aside footer h1 h2 h3 h4 h5 h6 p b strong i em u br hr ul ol li a img table thead tbody tfoot tr th td div span form input label textarea select option button figure figcaption blockquote small sup sub video audio source iframe link script mark code pre caption fieldset legend'.split(' '));
function parseAttrs(s){const A={};const re=/([a-zA-Z_:][-a-zA-Z0-9_:.]*)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;let m;while((m=re.exec(s)))A[m[1].toLowerCase()]=m[2]!=null?m[2]:m[3]!=null?m[3]:m[4]!=null?m[4]:'';return A}

  const re=/<(\/?)([a-zA-Z][a-zA-Z0-9]*)([^<>]*)>/g;const stack=[],ids=new Set(),hrefs=[];let title=null,charset=false,h1=0,m;
  while((m=re.exec(s))){

      while(stack.length-1>idx){const o=stack.pop();add(o.line,o.tag==='li'||o.tag==='p'?'warn':'error','unclosed',`<${o.tag}> on line ${o.line} is never closed. Add </${o.tag}> before </${tag}>.`,o.tag)}

    }else{

  $$('#pgD .blk.sel').forEach(e=>e.classList.remove('sel'));$$('#pgD .rsel').forEach(e=>e.classList.remove('rsel'));
  if(f){const w=$(`#pgD .blk[data-id="${id}"]`);if(w)w.classList.add('sel')}
  else{const R=$(`#pgD [data-region="${S.selRegion}"]`);if(R)R.classList.add('rsel')}
  const pic=f&&(f.b.k==='img'||f.b.k==='logo');
  const had=!!$('#tab-picfmt');
  if(pic&&!had&&!noRibbon){S.tab='picfmt';renderRibbon()}else if(!pic&&had){if(S.tab==='picfmt')S.tab='insert';renderRibbon()}
  updateStatus();
}
const closestCE=n=>{n=n&&(n.nodeType===1?n:n.parentElement);return n?n.closest('[contenteditable="true"]'):null};
function syncFromDom(ce){const w=ce.closest('.blk');if(!w)return;const f=findBlock(w.dataset.id);if(!f)return;f.b.h=cleanHTML(ce);f.b.k=kindOf(f.b.h);designEdit({typing:true})}
function setupCanvas(){
  const cv=$('#canvas');
  cv.addEventListener('click',e=>{
    const ba=e.target.closest('[data-bact]');
    if(ba){const id=ba.closest('.blk').dataset.id;select(id);({up:()=>moveBlock(id,-1),down:()=>moveBlock(id,1),del:()=>delBlock(id)})[ba.dataset.bact]();return}
    const a=e.target.closest('a');
    if(a){e.preventDefault();if(e.ctrlKey||e.metaKey){openBrowser(a.getAttribute('href'));return}setStatusTip('Link: '+a.getAttribute('href')+'  ·  Ctrl+Click to follow')}
    const w=e.target.closest('.blk');
    if(w){select(w.dataset.id);const f=findBlock(w.dataset.id);if(f&&!isEditable(f.b))S.savedRange=null;return}
    const R=e.target.closest('[data-region]');if(R){S.sel=null;S.savedRange=null;S.selRegion=R.dataset.region;select(null)}
  });
  cv.addEventListener('focusin',e=>{const w=e.target.closest('.blk');if(w&&S.sel!==w.dataset.id)select(w.dataset.id)});
  cv.addEventListener('input',e=>{const ce=closestCE(e.target);if(ce)syncFromDom(ce)});
  cv.addEventListener('keydown',e=>{
    const ce=closestCE(e.target);
    if(ce&&e.key==='Enter'&&!e.shiftKey){const f=findBlock(ce.closest('.blk').dataset.id);if(f&&(f.b.k==='heading'||f.b.k==='text'||f.b.k==='link'||f.b.k==='button')){e.preventDefault();const nb=insertBlockAt(f.p,f.r,f.i+1,'<p></p>');focusBlock(nb.id)}}
    else if(ce&&e.key==='Enter'&&e.shiftKey){e.preventDefault();document.execCommand('insertLineBreak')}
    else if(!ce&&(e.key==='Delete')&&S.sel){e.preventDefault();delBlock(S.sel)}
  });
  cv.addEventListener('dragstart',e=>{const lab=e.target.closest&&e.target.closest('.lab');if(!lab){e.preventDefault();return}const w=lab.closest('.blk');S.drag=w.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',S.drag);w.classList.add('dragging')});
  const dropInfo=e=>{const R=e.target.closest&&e.target.closest('[data-region]');if(!R)return null;const bl=$$(':scope>.blk',R).filter(b=>b.dataset.id!==S.drag);const cs=getComputedStyle(R);const hz=cs.display.includes('flex')&&!cs.flexDirection.startsWith('column');let idx=bl.findIndex(b=>{const r=b.getBoundingClientRect();return hz?e.clientX<r.left+r.width/2:e.clientY<r.top+r.height/2});if(idx<0)idx=bl.length;return {R,bl,idx}};
  cv.addEventListener('dragover',e=>{if(!S.drag)return;const d=dropInfo(e);if(!d)return;e.preventDefault();$$('#pgD .dropline').forEach(x=>x.remove());$$('#pgD .dropping').forEach(x=>x.classList.remove('dropping'));d.R.classList.add('dropping');const ln=document.createElement('div');ln.className='dropline';if(d.idx<d.bl.length)d.R.insertBefore(ln,d.bl[d.idx]);else d.R.append(ln)});
  cv.addEventListener('drop',e=>{if(!S.drag)return;const d=dropInfo(e);e.preventDefault();if(d){const f=findBlock(S.drag);const tgt=d.idx<d.bl.length?d.bl[d.idx].dataset.id:null;f.p.regions[f.r].splice(f.i,1);const arr=f.p.regions[d.R.dataset.region];let at=tgt?arr.findIndex(b=>b.id===tgt):arr.length;arr.splice(at,0,f.b);S.sel=f.b.id;S.drag=null;renderDesign();designEdit();toast('Moved to <'+d.R.dataset.region+'>')}});
  cv.addEventListener('dragend',()=>{S.drag=null;$$('#pgD .dropline').forEach(x=>x.remove());$$('#pgD .dropping,#pgD .dragging').forEach(x=>x.classList.remove('dropping','dragging'))});
  cv.addEventListener('contextmenu',e=>{const w=e.target.closest('.blk');if(!w)return;e.preventDefault();select(w.dataset.id);const f=findBlock(w.dataset.id);
    const its=[{l:'✂️ Cut',a:()=>CMD.cut()},{l:'📄 Copy',a:()=>CMD.copy()},{l:'📋 Paste',a:()=>CMD.paste()},'-',{l:'🔗 Hyperlink… <span style="margin-left:auto;color:#777">Ctrl+K</span>',a:()=>CMD.hyperlink()},{l:'🔖 Bookmark…',a:()=>CMD.bookmark()}];
    if(f.b.k==='img'||f.b.k==='logo')its.push({l:'🅰️ Edit Alt Text…',a:()=>CMD.alt()},{l:'🗜️ Compress Picture',a:()=>CMD.compress()});
    its.push('-',{l:'↑ Move up',a:()=>moveBlock(f.b.id,-1)},{l:'↓ Move down',a:()=>moveBlock(f.b.id,1)});
    for(const r of REGIONS)if(r!==f.r)its.push({l:'➜ Move to &lt;'+r+'&gt;',a:()=>moveTo(f.b.id,r)});
    its.push('-',{l:'🗑️ Delete',a:()=>delBlock(f.b.id)});menu(e.clientX,e.clientY,its)});
  document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);const n=r.commonAncestorContainer;const el=n.nodeType===1?n:n.parentElement;if(!el||!el.closest('#pgD'))return;const ce=closestCE(n);S.savedRange=ce?{range:r.cloneRange(),id:ce.closest('.blk').dataset.id}:null});
}
function focusBlock(id){const w=$(`#pgD .blk[data-id="${id}"]`);if(!w)return;select(id);const ce=$('[contenteditable="true"]',w);if(ce){ce.focus();const r=document.createRange();r.selectNodeContents(ce);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}w.scrollIntoView({block:'nearest'})}
function insertBlockAt(p,r,i,h){const b=B(h);p.regions[r].splice(i,0,b);S.sel=b.id;S.selRegion=r;renderDesign();designEdit();return b}
function insertBlock(h,region){
  const p=curPage();let r=region,i;
  const f=S.sel&&findBlock(S.sel);
  if(!r&&f&&f.p===p){r=f.r;i=f.i+1}
  if(!r)r=S.selRegion||'main';
  if(i==null)i=p.regions[r].length;
  if(r==='aside')p.showAside=true;
  const b=insertBlockAt(p,r,i,h);select(b.id);
  const w=$(`#pgD .blk[data-id="${b.id}"]`);if(w)w.scrollIntoView({block:'nearest'});
  return b;
}
function moveBlock(id,d){const f=findBlock(id);if(!f)return;const a=f.p.regions[f.r],j=f.i+d;if(j<0||j>=a.length){toast(d<0?'Already at the top of <'+f.r+'>':'Already at the bottom of <'+f.r+'>');return}a.splice(f.i,1);a.splice(j,0,f.b);renderDesign();select(id);designEdit()}
function moveTo(id,r){const f=findBlock(id);if(!f)return;f.p.regions[f.r].splice(f.i,1);f.p.regions[r].push(f.b);if(r==='aside')f.p.showAside=true;renderDesign();select(id);designEdit();toast('Moved to <'+r+'>')}
function delBlock(id){const f=findBlock(id);if(!f)return;f.p.regions[f.r].splice(f.i,1);S.sel=null;renderDesign();designEdit();toast('Deleted '+blockLabel(f.b,f.r).toLowerCase()+' · Ctrl+Z to undo')}
function needSel(kinds,msg){const f=S.sel&&findBlock(S.sel);if(!f||f.p!==curPage()||(kinds&&!kinds.includes(f.b.k))){toast(msg||'Click a block on the page first.');return null}return f}
function retag(f,tag){const t=document.createElement('template');t.innerHTML=f.b.h;const o=t.content.firstElementChild;if(!o)return;const n=document.createElement(tag);for(const a of o.attributes)n.setAttribute(a.name,a.value);n.innerHTML=o.innerHTML;f.b.h=n.outerHTML;f.b.k=kindOf(f.b.h)}
function setRootStyle(f,prop,val){const t=document.createElement('template');t.innerHTML=f.b.h;const o=t.content.firstElementChild;if(!o)return;o.style[prop]=val||'';if(!o.getAttribute('style'))o.removeAttribute('style');f.b.h=o.outerHTML}
function restoreRange(){const sr=S.savedRange;if(!sr||!sr.range.startContainer.isConnected)return null;const ce=closestCE(sr.range.commonAncestorContainer);if(!ce)return null;ce.focus({preventScroll:true});const s=getSelection();s.removeAllRanges();s.addRange(sr.range);return ce}
function execFmt(cmd){
  if(S.mode!=='design'){toast('Formatting buttons work in Design view. In Code view type tags like <b>…</b>.');return}
  let ce=restoreRange();
  if(!ce){const f=needSel(['heading','text','list','table','link','html','button'],'Select some text first, then click '+cmd+'.');if(!f)return;const w=$(`#pgD .blk[data-id="${f.b.id}"] [contenteditable="true"]`);if(!w)return;ce=w;w.focus();const r=document.createRange();r.selectNodeContents(w);const s=getSelection();s.removeAllRanges();s.addRange(r)}
  else if(getSelection().isCollapsed&&cmd!=='removeFormat'){const r=document.createRange();r.selectNodeContents(ce);const s=getSelection();s.removeAllRanges();s.addRange(r)}
  document.execCommand(cmd,false,null);syncFromDom(ce);
}

/* ---------- commands ---------- */
const CMD={
  save(){if(S.free){saveSandbox();toast('Saved in this browser ✓')}else toast('Mission work is checked live. Use File ▸ Export to download your page.');track('saved')},
  undo,redo,
  cut(){const f=needSel(null,'Click a block to cut.');if(!f)return;S.clip=f.b.h;delBlock(f.b.id);toast('Block cut · Paste to place it')},
  copy(){const f=needSel(null,'Click a block to copy.');if(!f)return;S.clip=f.b.h;toast('Block copied')},
  paste(){if(!S.clip){toast('Nothing copied yet. Copy a block first (text can be pasted with Ctrl+V).');return}insertBlock(S.clip)},
  bold(){execFmt('bold')},italic(){execFmt('italic')},underline(){execFmt('underline')},clearfmt(){execFmt('removeFormat')},
  bullets(){listify('ul')},numbers(){listify('ol')},
  alignL(){align('')},alignC(){align('center')},alignR(){align('right')},
  up(){const f=needSel();if(f)moveBlock(f.b.id,-1)},down(){const f=needSel();if(f)moveBlock(f.b.id,1)},delete(){const f=needSel();if(f)delBlock(f.b.id)},
  logo:logoDialog,navbar:navDialog,picture:()=>pictureDialog(),video:videoDialog,table:tableDialog,hyperlink:()=>linkDialog(),bookmark:bookmarkDialog,button:()=>linkDialog({button:true}),
  form(){insertBlock('<form><p><label>Name: <input type="text" name="name"></label></p><p><label>E-mail: <input type="email" name="email"></label></p><p><label><input type="checkbox" name="news"> Send me news</label></p><p><input type="submit" value="Send"></p></form>');toast('Form inserted · add more controls from the Forms group')},
  'f-text':()=>formCtl('text'),'f-radio':()=>formCtl('radio'),'f-check':()=>formCtl('check'),'f-submit':()=>formCtl('submit'),
  'ins-h2'(){const b=insertBlock('<h2>New heading</h2>');focusBlock(b.id)},'ins-p'(){const b=insertBlock('<p>Type your text here.</p>');focusBlock(b.id)},'ins-hr'(){insertBlock('<hr>')},
  aside(){const p=curPage();if(p.showAside||p.regions.aside.length){p.showAside=false;if(p.regions.aside.length){p.regions.aside=[];toast('Sidebar box removed · Ctrl+Z to undo')}}else{p.showAside=true;p.regions.aside.push(B('<h3>Latest news</h3>'),B('<p>Add news or quick links here.</p>'))}renderAll();designEdit()},
  responsive(){const p=curPage();if(p.css!=null){toast('This page uses your own CSS. Add an @media rule in Code view, or Design ▸ Clear my styles first.');return}p.responsive=!p.responsive;renderAll();designEdit();toast(p.responsive?'Phone-friendly ON: a @media (max-width:600px) rule now stacks the layout':'Phone-friendly OFF')},
  copynav(){const p=curPage();if(!p.regions.nav.length){toast('This page has no navigation bar to copy.');return}for(const q of S.site.pages)if(q!==p){q.regions.nav=clone(p.regions.nav).map(b=>({...b,id:nid()}));if(p.ra.nav)q.ra.nav=p.ra.nav;q.src=null}designEdit();track('copynav');toast('Navigation copied to all '+S.site.pages.length+' pages ✓')},
  copyhf(){const p=curPage();for(const q of S.site.pages)if(q!==p){for(const r of ['header','footer'])q.regions[r]=clone(p.regions[r]).map(b=>({...b,id:nid()}));q.src=null}designEdit();toast('Header and footer copied to every page ✓')},
  applyall(){const p=curPage();for(const q of S.site.pages){q.theme=p.theme;q.font=p.font;q.layout=p.layout;q.cols=p.cols;q.responsive=p.responsive;q.myCss=p.myCss;q.css=p.css;q.src=null}designEdit();renderAll();toast('Theme, fonts, layout and styles applied to all pages ✓')},
  title:titleDialog,
  clearcss(){const p=curPage();if(p.css==null&&!p.myCss.trim()){toast('No custom styles on this page.');return}p.css=null;p.myCss='';renderAll();designEdit();toast('Your own CSS was removed · the theme is back')},
  'v-design':()=>setMode('design'),'v-code':()=>setMode('code'),
  preview:()=>openBrowser(S.cur),
  'dev-desktop':()=>setDevice('desktop'),'dev-tablet':()=>setDevice('tablet'),'dev-phone':()=>setDevice('phone'),
  labels(){S.labels=!S.labels;renderAll()},
  alt:altDialog,
  'w-200':()=>picWidth('200'),'w-400':()=>picWidth('400'),'w-600':()=>picWidth('600'),'w-fit':()=>picWidth('fit'),
  compress(){const f=needSel(['img','logo'],'Click a picture first.');if(!f)return;const t=document.createElement('template');t.innerHTML=f.b.h;const im=t.content.firstElementChild;const s=normPath(im.getAttribute('src'));const g=GALLERY[s];if(g&&g.small){im.setAttribute('src',g.small);f.b.h=im.outerHTML;renderDesign();select(f.b.id);designEdit();toast(`Compressed: ${(g.kb/1024).toFixed(1)} MB ➜ ${GALLERY[g.small].kb} KB ✓`)}else toast('This picture is already web-sized ('+((g&&g.kb)||24)+' KB).')},
  changepic(){const f=needSel(['img','logo'],'Click a picture first.');if(f)pictureDialog(f)}
};
function setDevice(d){S.device=d;renderAll();track('device_'+d)}
function align(v){const f=needSel(null,'Click the block you want to align.');if(!f)return;if(f.b.k==='img'||f.b.k==='logo'){setRootStyle(f,'display',v?'block':'');setRootStyle(f,'marginLeft',v?'auto':'');setRootStyle(f,'marginRight',v==='center'?'auto':'')}else setRootStyle(f,'textAlign',v);renderDesign();select(f.b.id);designEdit()}
function listify(tag){
  const f=needSel(['text','heading','list'],'Click the paragraph you want to turn into a list.');if(!f)return;
  const arr=f.p.regions[f.r];
  if(f.b.k==='list'){const cur=/^\s*<(ul|ol)/i.exec(f.b.h)[1].toLowerCase();if(cur===tag){const t=document.createElement('template');t.innerHTML=f.b.h;const lis=$$('li',t.content).map(li=>B('<p>'+li.innerHTML+'</p>'));arr.splice(f.i,1,...lis);S.sel=lis[0]&&lis[0].id}else retag(f,tag)}
  else{const t=document.createElement('template');t.innerHTML=f.b.h;const inner=t.content.firstElementChild.innerHTML;const prev=arr[f.i-1];
    if(prev&&prev.k==='list'&&new RegExp('^\\s*<'+tag,'i').test(prev.h)){prev.h=prev.h.replace(new RegExp('</'+tag+'>\\s*$','i'),'<li>'+inner+'</li></'+tag+'>');arr.splice(f.i,1);S.sel=prev.id;toast('Added to the list above ✓')}
    else{f.b.h=`<${tag}><li>${inner}</li></${tag}>`;f.b.k='list'}}
  renderDesign();select(S.sel);designEdit();
}
function picWidth(w){const f=needSel(['img','logo'],'Click a picture first.');if(!f)return;const t=document.createElement('template');t.innerHTML=f.b.h;const im=t.content.firstElementChild;if(w==='fit'){im.removeAttribute('width');im.style.width='100%';im.style.height='auto'}else{im.setAttribute('width',w);im.style.width='';if(!im.getAttribute('style'))im.removeAttribute('style')}f.b.h=im.outerHTML;renderDesign();select(f.b.id);designEdit()}
function formCtl(type){
  const ask=(title,body,make)=>dialog({title,body,buttons:[{l:'Cancel'},{l:'Insert',pri:true,act:d=>make(d)}]});
  const add=h=>{const f=S.sel&&findBlock(S.sel);if(f&&f.b.k==='form'&&f.p===curPage()){const t=document.createElement('template');t.innerHTML=f.b.h;const fm=t.content.firstElementChild;const sub=fm.querySelector('input[type=submit]');const tt=document.createElement('template');tt.innerHTML=h;if(sub&&type!=='submit')sub.closest('p')?sub.closest('p').before(tt.content):sub.before(tt.content);else fm.append(tt.content);f.b.h=fm.outerHTML;renderDesign();select(f.b.id);designEdit();toast('Added to the selected form ✓')}else{insertBlock('<form>'+h+'</form>');toast('New form created. Select it to add more controls.')}};
  if(type==='text')ask('Text box','<label class="fld">Label<input id="fl" value="Name:"></label>',d=>{const l=$('#fl',d).value.trim()||'Name:';add(`<p><label>${escText(l)} <input type="text" name="${slug(l)}"></label></p>`)});
  else if(type==='radio')ask('Radio buttons','<label class="fld">Question<input id="fq" value="Course:"></label><label class="fld">Choices (comma separated)<input id="fo" value="Discover Scuba, Open Water, Advanced"></label><p class="note">Radio buttons let the user pick only ONE choice.</p>',d=>{const q=$('#fq',d).value.trim(),o=$('#fo',d).value.split(',').map(s=>s.trim()).filter(Boolean);if(o.length<2){toast('Give at least two choices.');return false}const n=slug(q)||'choice';add(`<p>${escText(q)} ${o.map(x=>`<label><input type="radio" name="${n}" value="${escAttr(x)}"> ${escText(x)}</label>`).join(' ')}</p>`)});
  else if(type==='check')ask('Check box','<label class="fld">Label<input id="fl" value="Send me the newsletter"></label><p class="note">Check boxes let the user tick as many as they like.</p>',d=>{const l=$('#fl',d).value.trim()||'Yes';add(`<p><label><input type="checkbox" name="${slug(l)}"> ${escText(l)}</label></p>`)});
  else ask('Submit button','<label class="fld">Button text<input id="fl" value="Send"></label>',d=>add(`<p><input type="submit" value="${escAttr($('#fl',d).value.trim()||'Send')}"></p>`));
}

/* ---------- dialogs: logo, nav, picture, video, table, link, bookmark, title, alt ---------- */
function logoDialog(){
  const L={...(S.site.logo||{text:'LOGO',shape:'circle',color:'#0B4F6C'})};
  const existing=curPage().regions.header.find(b=>b.k==='logo');
  const curAlt=existing?(/alt="([^"]*)"/.exec(existing.h)||[])[1]||'':'';
  const cols=['#0B4F6C','#6B2D5C','#B23A48','#1E5631','#0077B6','#111827','#E07A00','#5B3CC4'];
  dialog({title:'Logo designer',wide:true,body:`<div class="two"><div>
    <label class="fld">Initials (up to 4 letters)<input id="lgT" maxlength="4" value="${esc(L.text||'')}"></label>
    <label class="fld">Small tagline<input id="lgS" maxlength="14" value="${esc(L.sub||'')}"></label>
    <div class="fld">Shape<div style="display:flex;gap:6px" id="lgShape">${['circle','square','shield','wave'].map(s=>`<button class="mini" data-s="${s}" aria-pressed="${(L.shape||'circle')===s}">${s}</button>`).join('')}</div></div>
    <div class="fld">Colour<div style="display:flex;gap:5px;flex-wrap:wrap" id="lgCol">${cols.map(c=>`<button class="mini" data-c="${c}" aria-label="Colour ${c}" aria-pressed="${L.color===c}" style="width:28px;height:24px;background:${c}"></button>`).join('')}</div></div>
    <label class="fld">Alt text (describe the logo for screen readers)<input id="lgA" placeholder="e.g. ${esc(S.site.name)} logo" value="${esc(curAlt)}"></label>
    <p class="note">The logo is saved in your site folder as <b>logo.png</b> and placed at the start of the &lt;header&gt;.</p></div>
    <div style="display:grid;place-items:center"><div id="lgPrev" style="width:150px;height:150px"></div></div></div>`,
    onOpen(d){const up=()=>{L.text=$('#lgT',d).value.toUpperCase();L.sub=$('#lgS',d).value.toUpperCase();$('#lgPrev',d).innerHTML=logoSvg(L)};up();$('#lgT',d).oninput=up;$('#lgS',d).oninput=up;
      $('#lgShape',d).onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;L.shape=b.dataset.s;$$('[data-s]',d).forEach(x=>x.setAttribute('aria-pressed',x===b));up()};
      $('#lgCol',d).onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;L.color=b.dataset.c;$$('[data-c]',d).forEach(x=>x.setAttribute('aria-pressed',x===b));up()}},
    buttons:[{l:'Cancel'},{l:existing?'Update logo':'Insert logo',pri:true,id:'lgOk',act(d){
      S.site.logo={text:L.text||'LOGO',sub:L.sub,shape:L.shape||'circle',color:L.color};
      if(!S.site.files.some(f=>f.logo)){S.site.files=S.site.files.filter(f=>f.name!=='logo.png');S.site.files.unshift({name:'logo.png',kb:24,logo:true})}
      const lf=S.site.files.find(f=>f.logo).name;const alt=$('#lgA',d).value.trim();
      const h=`<img src="${lf}" alt="${escAttr(alt)}" width="80" class="logo">`;
      const p=curPage();if(existing){existing.h=h}else{p.regions.header.unshift(B(h))}
      renderAll();designEdit();toast(alt?'Logo placed in the header ✓':'Logo placed. Tip: add alt text (Picture Format ▸ Alt Text).');
    }}]});
}
function pageLabel(p){const t=(p.title||'').split('|').pop().trim();return t||p.file.replace(/\.html?$/,'').replace(/^index$/,'Home').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase())}
function navDialog(){
  const pages=S.site.pages;

function applyLink(href,text,existing){
  if(existing&&existing.isConnected){existing.setAttribute('href',href);if(text)existing.textContent=text;const ce=closestCE(existing);if(ce)syncFromDom(ce);toast('Hyperlink updated ✓');return}
  const f=S.sel&&findBlock(S.sel);
  const sr=S.savedRange&&S.savedRange.range.startContainer.isConnected?S.savedRange:null;
  const navList=f&&f.r==='nav'&&f.b.k==='list';
  if(sr&&S.mode==='design'&&!(navList&&sr.range.collapsed)){
    const ce=restoreRange();
    if(ce){const txt=text||sr.range.toString()||href;document.execCommand('insertHTML',false,`<a href="${escAttr(href)}">${escText(txt)}</a>`);syncFromDom(ce);toast('Hyperlink inserted ✓');return}
  }
  if(navList){const t=document.createElement('template');t.innerHTML=f.b.h;const ul=t.content.firstElementChild;const li=document.createElement('li');li.innerHTML=`<a href="${escAttr(href)}">${escText(text||href)}</a>`;ul.append(li);f.b.h=ul.outerHTML;renderDesign();select(f.b.id);designEdit();toast('Link added to the navigation bar ✓');return}

  insertBlock(`<p><a href="${escAttr(href)}">${escText(text||href)}</a></p>`);toast('Hyperlink inserted as a new paragraph ✓');
}

  sp.addEventListener('click',e=>{
    const pm=e.target.closest('[data-pmenu]');if(pm){e.stopPropagation();const r=pm.getBoundingClientRect();pageMenu(pm.dataset.pmenu,r.left,r.bottom);return}
    const pg=e.target.closest('[data-page]');if(pg){openPage(pg.dataset.page);if(innerWidth<=900)sp.classList.remove('open');return}

    const c=e.target.closest('[data-cmd]');if(c){if(c.dataset.cmd==='newpage')newPageDialog();else addFileDialog()}
  });

  sp.addEventListener('keydown',e=>{const pm=e.target.closest('[data-pmenu]');if(pm&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();const r=pm.getBoundingClientRect();pageMenu(pm.dataset.pmenu,r.left,r.bottom)}});

/* ---------- code view ---------- */
function hlHtml(src){
  let out='';const re=/(<!--[\s\S]*?(?:-->|$))|(<!DOCTYPE[^>]*>)|(<\/?)([a-zA-Z][a-zA-Z0-9]*)([^<>]*?)(\/?>)|([^<]+)|(<)/gi;let m;
  while((m=re.exec(src))){
    if(m[1])out+=`<span class="hl-c">${escText(m[1])}</span>`;
    else if(m[2])out+=`<span class="hl-d">${escText(m[2])}</span>`;
    else if(m[4])out+=`<span class="hl-p">${escText(m[3])}</span><span class="hl-t">${m[4]}</span>${escText(m[5]).replace(/([\w-:]+)(=)("[^"]*"?|'[^']*'?|[^\s"']+)?/g,(x,a,e,v)=>`<span class="hl-a">${a}</span>${e}${v?`<span class="hl-v">${v}</span>`:''}`)}<span class="hl-p">${escText(m[6])}</span>`;
    else out+=escText(m[7]||m[8]||'');
    if(m[0]==='')re.lastIndex++;
  }
  return out+'\n';
}

/* SimSave helpers: draw a whole web page (in a hidden frame, scripts off) so it can be saved as a JPG, PNG or PDF.
   size = page width in px, or [width, viewport height] (a short viewport crops the picture to the content). */
function ssRenderPage(html, size, fn) {
  const width = Array.isArray(size) ? size[0] : size, height = Array.isArray(size) ? size[1] : 900;
  return new Promise((res, rej) => {
    const f = document.createElement('iframe');
    f.className = 'ss-ignore'; f.setAttribute('aria-hidden', 'true'); f.setAttribute('sandbox', 'allow-same-origin'); f.tabIndex = -1; f.title = 'Page renderer';
    f.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + width + 'px;height:' + height + 'px;border:0;pointer-events:none';
    let done = false;
    const go = async late => {
      if (done) return;
      const d0 = f.contentDocument; // wait for the page itself, not the frame's first blank page
      if (late !== true && !(d0 && d0.URL === 'about:srcdoc' && d0.readyState === 'complete')) return;
      done = true;
      const sx = window.scrollX, sy = window.scrollY;
      try {
        const d = f.contentDocument; if (!d || !d.documentElement) throw new Error('page did not load');
        await Promise.all(Array.from(d.images).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; setTimeout(r, 4000); })));
        try { if (d.fonts && d.fonts.ready) await Promise.race([d.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
        // SVG pictures with no width/height of their own would be drawn empty: swap each for a PNG of the same size
        for (const im of Array.from(d.images)) {
          const src = im.currentSrc || im.src || ''; if (!/^data:image\/svg\+xml|\.svg(?:[?#]|$)/i.test(src) || !im.complete) continue;
          const cs = d.defaultView.getComputedStyle(im), w = parseFloat(cs.width), h = parseFloat(cs.height); if (!(w > 0 && h > 0)) continue;
          try {
            const c = document.createElement('canvas'); c.width = Math.round(w * 2); c.height = Math.round(h * 2); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
            const u = c.toDataURL('image/png'); im.style.width = cs.width; im.style.height = cs.height;
            await new Promise(ok => { im.onload = im.onerror = ok; im.src = u; setTimeout(ok, 2000); });
          } catch (e) { }
        }
        if (sx || sy) window.scrollTo(0, 0);
        res(await fn(d.documentElement, d));
      } catch (e) { rej(e); } finally { if (sx || sy) window.scrollTo(sx, sy); f.remove(); }
    };
    f.addEventListener('load', () => setTimeout(go, 80));
    f.srcdoc = html; document.body.appendChild(f); setTimeout(() => go(true), 8000);
  });
}
function ssScale(el, max) { const w = Math.max(el.scrollWidth, 1), h = Math.max(el.scrollHeight, 1); return Math.max(0.5, Math.min(max || 2, Math.sqrt(30e6 / (w * h)))); }
function ssPageImg(html, size, type) { return ssRenderPage(html, size, async el => { const c = await SimSave.domToCanvas(el, { scale: ssScale(el, (Array.isArray(size) ? size[0] : size) <= 600 ? 2 : 1.5) }); return type === 'png' ? SimSave.png(c) : SimSave.jpg(c, 0.9); }); }
function ssPagePdf(html, size, title, landscape) { return ssRenderPage(html, size, el => SimSave.pdfFromElement(el, { size: 'Letter', landscape: !!landscape, margin: 24, title: title, scale: ssScale(el, 2) })); }
function ssBlank(c) { try { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; for (let i = 4; i < d.length; i += 28) if (Math.abs(d[i] - d[0]) + Math.abs(d[i + 1] - d[1]) + Math.abs(d[i + 2] - d[2]) > 12) return false; return true; } catch (e) { return false; } }
function ssPageDataURL(html, size, maxH) { return ssRenderPage(html, size, async el => { const c = await SimSave.domToCanvas(el, { scale: 1 }); if (ssBlank(c)) return ''; if (maxH && c.height > maxH) { const t = document.createElement('canvas'); t.width = c.width; t.height = maxH; t.getContext('2d').drawImage(c, 0, 0); return t.toDataURL('image/jpeg', 0.85); } return c.toDataURL('image/jpeg', 0.85); }); }

/* Save a copy of the page: .html (CSS and pictures built in), a full-length JPG / PNG of the page, and a PDF */

/* Whole site as a .zip: every page as its own .html file (exactly as written, so the links between pages work), plus every
   lab picture the pages use, saved under the same file name as a real PNG or JPG. */
async function siteZipBlob(pages,extra,imgURI){const files=pages.map(p=>({name:p.name,data:p.html})).concat(extra||[]);const seen=new Set(files.map(f=>f.name));
  const srcs=new Set();pages.forEach(p=>{for(const m of p.html.matchAll(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["']/gi))srcs.add(m[1].trim());for(const m of p.html.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi))srcs.add(m[1].trim())});
  for(const s of srcs){if(/^(data:|https?:|mailto:|#|\/\/)/i.test(s)||s.includes('..'))continue;const name=s.replace(/^\.?\//,'').split(/[?#]/)[0];if(!name||seen.has(name))continue;
    const u=imgURI(s);if(!u)continue;let data=null;
    try{if(/^data:image\/svg\+xml/i.test(u)){const svg=/;base64,/i.test(u)?atob(u.split(',')[1]):decodeURIComponent(u.slice(u.indexOf(',')+1));const jpg=/\.jpe?g$/i.test(name);
        const c=await SimSave.svgToCanvas(svg,1,jpg?'#ffffff':null);data=new Uint8Array(await (await SimSave.canvasBlob(c,jpg?'image/jpeg':'image/png',0.9)).arrayBuffer())}
      else if(/^data:/i.test(u)){const b=atob(u.split(',')[1]);data=new Uint8Array(b.length);for(let i=0;i<b.length;i++)data[i]=b.charCodeAt(i)}}catch(e){console.warn(e)}
    if(data){files.push({name,data});seen.add(name)}}
  return SimSave.zip(files)}

function curLoc(){return BW.hist[BW.idx]||{file:'index.html',hash:''}}
function resolveHref(h){
  h=String(h||'').trim();
  if(/^https?:\/\//i.test(h)){const m=/^(https?):\/\/([^\/?#]+)([^?#]*)(\?[^#]*)?(#.*)?$/i.exec(h);if(!m)return {bad:h};const dom=m[2].toLowerCase(),ad=(activeDomain()||'').toLowerCase();if(dom!==ad&&'www.'+dom!==ad&&dom!=='www.'+ad)return {ext:h,dom};return {file:normPath(m[3]||'')||'index.html',hash:(m[5]||'').slice(1),proto:m[1].toLowerCase()}}
  if(h.startsWith('#'))return {file:curLoc().file,hash:h.slice(1),same:true};
  if(/^mailto:/i.test(h))return {mail:h};
  if(/^[a-z]+:/i.test(h))return {bad:h};
  const [f,hash]=h.split('#');return {file:normPath(f)||'index.html',hash:hash||''};
}
function absUrl(h){const r=resolveHref(h);if(r.mail)return h;if(r.ext||r.bad)return h;return 'https://'+activeDomain()+'/'+(r.file==='index.html'&&!h.includes('index.html')?'':r.file)+(r.hash?'#'+r.hash:'')}
function bwGo(h){
  const r=resolveHref(h);
  if(r.mail){mailDialog(r.mail);track('mailtoClicked',r.mail);return}
  if(r.same&&BW.idx>=0){const loc={...curLoc(),hash:r.hash};BW.hist=BW.hist.slice(0,BW.idx+1);BW.hist.push(loc);BW.idx++;scrollHash(r.hash);setAddr(loc);track('anchorJump',r.hash);navBtns();return}
  let loc;if(r.ext)loc={ext:r.ext};else if(r.bad)loc={bad:r.bad};else loc={file:r.file,hash:r.hash,proto:r.proto};
  if(loc.file&&!pageExists(loc.file)&&fileExists(loc.file)&&/\.(docx?|pptx|xlsx|zip)$/i.test(loc.file)){downloadShelf(loc.file);track('file_'+loc.file);if(BW.live)track('livefile_'+loc.file);return}
  BW.hist=BW.hist.slice(0,BW.idx+1);BW.hist.push(loc);BW.idx++;show(loc);
}
const pageExists=f=>BW.live?!!(S.site.pub.server[f]&&S.site.pub.server[f].src!=null):S.site.pages.some(p=>p.file===f);
const fileExists=f=>BW.live?!!S.site.pub.server[f]:siteHasFile(S.site,f);
function setAddr(loc){const a=$('#bwAddr');if(!a)return;a.value=loc.ext||loc.bad||('https://'+activeDomain()+'/'+(loc.file==='index.html'&&BW.idx===0&&!loc.hash?'':loc.file)+(loc.hash?'#'+loc.hash:''))}
function navBtns(){const b=$('#bwBack'),f=$('#bwFwd');if(b)b.disabled=BW.idx<=0;if(f)f.disabled=BW.idx>=BW.hist.length-1;$$('[data-bdev]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.bdev===BW.device))}
function scrollHash(h){const pg=$('#bwPg .pg');if(!pg||!h)return;const t=pg.querySelector('#'+CSS.escape(h));if(t)t.scrollIntoView({block:'start'});else toast('Bookmark #'+h+' not found on this page')}
function show(loc,keepScroll){
  const host=$('#bwPg'),v=$('#bwView');if(!host)return;host.className='pgc w-'+BW.device;
  const sc=v.scrollTop;setAddr(loc);navBtns();let title='';
  if(loc.ext){host.innerHTML=`<div class="pg"><div class="errpage"><h1>🌐 This site is outside the simulator</h1><p><b>${esc(loc.ext)}</b></p><p>Your browser would leave your website and visit another site on the World Wide Web. External links are fine on a real web page — they need the full URL with https://</p></div></div>`;title='External site'}
  else if(loc.bad){host.innerHTML=`<div class="pg"><div class="errpage"><h1>Hmm. We can't open this address</h1><p>${esc(loc.bad)}</p></div></div>`;title='Error'}
  else if(pageExists(loc.file)){
    const src=BW.live?S.site.pub.server[loc.file].src:codeOf(S.site.pages.find(p=>p.file===loc.file));
    const r=renderDoc(host,src,{site:S.site,live:BW.live,server:S.site.pub.server});title=r.title||loc.file;
    track(BW.live?'liveVisit_'+loc.file:'visit_'+loc.file);
    if(loc.hash)setTimeout(()=>scrollHash(loc.hash));else if(!keepScroll)v.scrollTop=0;
  }
  else if(fileExists(loc.file)&&/\.pdf$/i.test(loc.file)){host.innerHTML=`<div class="pg" style="background:#525659;min-height:420px;padding:20px;display:grid;place-items:center"><div style="background:#fff;width:min(420px,90%);padding:30px 26px;font-family:Arial;box-shadow:0 4px 18px rgba(0,0,0,.4)"><div style="font-size:30px">📕</div><h2 style="margin:6px 0">${esc(loc.file)}</h2><p style="color:#555">PDF document opened in the browser's PDF viewer.</p><div style="height:8px;background:#ddd;margin:8px 0;width:90%"></div><div style="height:8px;background:#ddd;margin:8px 0;width:75%"></div><div style="height:8px;background:#ddd;margin:8px 0;width:82%"></div></div></div>`;title=loc.file;track('file_'+loc.file);if(BW.live)track('livefile_'+loc.file)}
  else if(fileExists(loc.file)&&GALLERY[loc.file]){host.innerHTML=`<div class="pg" style="background:#0e0e0e;min-height:400px;display:grid;place-items:center"><img src="${svgUri(GALLERY[loc.file].svg)}" alt="${esc(loc.file)}" style="max-width:90%"></div>`;title=loc.file}
  else{const dom=activeDomain();host.innerHTML=`<div class="pg" style="background:#fff;font-family:Times New Roman,serif;padding:10px 18px"><h1>Not Found</h1><p>The requested URL /${esc(loc.file)} was not found on this server.</p><hr><address>Apache Server at ${esc(dom)} Port 443</address><p style="font-family:Arial;color:#555;margin-top:30px;font-size:14px">💡 404 error: ${BW.live?'this file was not uploaded to the web server, or the link has a spelling mistake.':'there is no page called '+esc(loc.file)+' in your site. Check the link.'}</p></div>`;title='404 Not Found';track('saw404',loc.file)}
  $('#bwTitle').textContent=title;
}
function downloadShelf(f){const ex=$('#bwShelf');if(ex)ex.remove();const d=document.createElement('div');d.id='bwShelf';d.className='bw-status';d.style.cssText='left:auto;right:10px;bottom:10px;border-radius:8px;padding:8px 12px;max-width:none;box-shadow:0 4px 14px rgba(0,0,0,.25)';d.innerHTML=`⬇ <b>${esc(f)}</b> downloaded · ${(S.site.files.find(x=>x.name===f)||{kb:40}).kb} KB · opens in ${/docx?$/.test(f)?'Word':/pptx$/.test(f)?'PowerPoint':'its app'}`;$('.browser').append(d);setTimeout(()=>d.remove(),4000)}
function mailDialog(h){const addr=h.slice(7).split('?')[0];const sub=h.includes('subject=')?decodeURIComponent(h.split('subject=')[1].split('&')[0]):'';dialog({title:'✉️ New message (your e-mail app)',body:`<p class="note">The mailto: link opened the visitor's e-mail program with the address filled in.</p><label class="fld">To<input value="${esc(addr)}" readonly></label><label class="fld">Subject<input value="${esc(sub)}" readonly></label><label class="fld">Message<textarea rows="3" readonly>Hello…</textarea></label>`,buttons:[{l:'Close',pri:true}]})}

/* ---------- Plan it (S4 SO9) ---------- */
const WTYPES=['Logo','Navigation','Heading','Content','Picture','Sidebar','Footer'];
const WSIZE={Logo:[16,14],Navigation:[100,8],Heading:[46,10],Content:[62,40],Picture:[30,26],Sidebar:[24,44],Footer:[100,10]};
const nodeFile=(n,root)=>root?'index.html':slug(n.name)+'.html';
function planNodes(n,acc=[],root=true){acc.push({n,root});n.kids.forEach(k=>planNodes(k,acc,false));return acc}
function findNode(n,id,parent=null){if(n.id===id)return {n,parent};for(const k of n.kids){const r=findNode(k,id,n);if(r)return r}return null}
function renderPlan(){
  const P=S.site.plan;
  const node=(n,root)=>`<li><div class="node"><input value="${esc(n.name)}" data-nid="${n.id}" aria-label="Page name"><div class="nf" id="nf-${n.id}">${nodeFile(n,root)}</div><div class="nb"><button data-add="${n.id}" title="Add a page linked from this one" aria-label="Add a page under ${esc(n.name)}">+ page</button>${root?'':`<button data-del="${n.id}" title="Remove" aria-label="Remove ${esc(n.name)}">✕</button>`}</div></div>${n.kids.length?'<ul>'+n.kids.map(k=>node(k,false)).join('')+'</ul>':''}</li>`;
  $('#planTool').innerHTML=`<div class="toolhead"><h2>🗺️ Plan it</h2><p>Plan the structure (site map) and the layout (wireframe) before you build — CSEC S4 SO9.</p></div>
  <div class="two"><div class="card"><h3>Site map</h3><p class="note">The home page goes at the top. Pages it links to go underneath.</p><div style="overflow:auto;padding:10px 0"><ul class="tree">${node(P.map,true)}</ul></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px"><button class="btn pri" id="plCreate">Create pages from site map</button><span class="note" id="plCount"></span></div></div>
  <div class="card"><h3>Wireframe — home page layout</h3><p class="note">Drag the labelled boxes onto the page sketch. Drag a box to move it, drag its corner to resize. Keyboard: click a chip to add, select a box and use the arrow keys (Shift+arrows to resize, Delete to remove).</p>
  <div class="chips" id="wChips">${WTYPES.map(t=>`<button class="chip" data-wt="${t}" title="Drag onto the wireframe, or click to add">${t}</button>`).join('')}</div>
  <div class="wire" id="wire" role="application" aria-label="Wireframe canvas"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="wClear">Clear</button><button class="btn pri" id="wApply">Use this layout for my page</button></div><div id="wFb" class="note" style="margin-top:6px"></div></div></div>`;
  drawWire();planCount();
  const pt=$('#planTool');
  pt.oninput=e=>{const i=e.target.closest('[data-nid]');if(!i)return;const r=findNode(P.map,i.dataset.nid);r.n.name=i.value;$('#nf-'+r.n.id).textContent=nodeFile(r.n,r.n===P.map);changed({typing:true});planCount()};
  pt.onclick=e=>{
    const a=e.target.closest('[data-add]'),d=e.target.closest('[data-del]');
    if(a){const r=findNode(P.map,a.dataset.add);const names=['About','Events','Gallery','Contact','Menu','Tours','Courses','News'];const used=new Set(planNodes(P.map).map(x=>x.n.name));const nm=names.find(x=>!used.has(x))||'New page';r.n.kids.push({id:nid(),name:nm,kids:[]});changed();renderPlan();track('planEdited');return}
    if(d){const r=findNode(P.map,d.dataset.del);r.parent.kids=r.parent.kids.filter(k=>k!==r.n);changed();renderPlan();return}
    if(e.target.id==='plCreate'){let made=0;for(const {n,root} of planNodes(P.map)){if(root)continue;const f=nodeFile(n);if(!S.site.pages.some(p=>p.file===f)){addPage(f,n.name,true,true);made++}}renderSitePanel();track('planCreated');toast(made?made+' page'+(made>1?'s':'')+' created and linked in the navigation ✓':'All the pages already exist ✓');planCount();return}
    if(e.target.id==='wClear'){P.wire=[];changed();drawWire();return}
    if(e.target.id==='wApply'){const c=wireCheck();if(!c.content||!c.nav){$('#wFb').textContent='Add at least a Navigation box and a Content box first.';return}const p=curPage();p.layout=c.layout;p.src=null;changed();track('wireApplied');toast('Layout template set to "'+LAYOUTS[c.layout].name+'" for '+p.file+' ✓');renderSitePanel();return}
  };
  setupWireDrag();
}
function planCount(){const n=planNodes(S.site.plan.map).length;const e=$('#plCount');if(e)e.textContent=n+' page'+(n>1?'s':'')+' planned · '+S.site.pages.length+' in the site'}
function drawWire(){
