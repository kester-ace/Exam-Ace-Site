{id:'L3-01',level:3,title:'SBA Task 1 · Design the tour database',obj:'S6 SO2/SO3 · table design, keys, relationships',db:'blank:Rainforest Trail Tours',target:20,
 brief:'Rainforest Trail Tours (a company) runs hiking trips around Dominica. Build its database from this brief. Every table needs a primary key and the right data types, and the tables must be linked with referential integrity.',
 data:'Guides: GuideID (AutoNumber, key), FirstName, LastName, Phone (Short Text), HireDate (Date/Time)\nTours: TourCode (Short Text 5, key), TourName (Short Text), Price (Currency), DurationHours (Number), GuideID (Number – links to Guides)\nBookings: BookingID (AutoNumber, key), TourCode (Short Text 5 – links to Tours), CustomerName (Short Text), TourDate (Date/Time), Guests (Number), Paid (Yes/No)',
 steps:[
  st('Guides table has all five fields',function(){return ['GuideID','FirstName','LastName','Phone','HireDate'].every(function(f){return !!G.saved('Guides',f);});},{m:1,h1:'Create ▸ Table Design, then save as Guides.'}),
  st('Guides data types correct',function(){return G.typeIs('Guides','GuideID','AutoNumber',{saved:1})&&G.typeIs('Guides','Phone','Short Text',{saved:1})&&G.typeIs('Guides','HireDate','Date/Time',{saved:1})&&G.typeIs('Guides','FirstName','Short Text',{saved:1});},{m:1,h1:'Phone numbers are text; dates are Date/Time.'}),
  st('Guides primary key is GuideID',function(){return G.pkIs('Guides',['GuideID'],{saved:1});},{m:1,h1:'Select the row, then Table Design ▸ Primary Key.'}),
  st('Tours table has all five fields',function(){return ['TourCode','TourName','Price','DurationHours','GuideID'].every(function(f){return !!G.saved('Tours',f);});},{m:1}),
  st('Tours data types correct (Price is Currency, DurationHours is Number)',function(){return G.typeIs('Tours','TourCode','Short Text',{saved:1})&&G.typeIs('Tours','Price','Currency',{saved:1})&&G.typeIs('Tours','DurationHours','Number',{saved:1});},{m:1,h1:'Money should use the Currency type.'}),
  st('Tours primary key is TourCode',function(){return G.pkIs('Tours',['TourCode'],{saved:1});},{m:1}),
  st('Tours.GuideID is a Number (Long Integer) so it can link to an AutoNumber',function(){var f=G.saved('Tours','GuideID');return !!f&&f.type==='Number'&&(f.size||'Long Integer')==='Long Integer';},{m:1,h1:'A foreign key that links to an AutoNumber must be Number ▸ Long Integer.'}),
  st('Bookings table has all six fields',function(){return ['BookingID','TourCode','CustomerName','TourDate','Guests','Paid'].every(function(f){return !!G.saved('Bookings',f);});},{m:1}),
  st('Bookings data types correct',function(){return G.typeIs('Bookings','BookingID','AutoNumber',{saved:1})&&G.typeIs('Bookings','TourCode','Short Text',{saved:1})&&G.typeIs('Bookings','TourDate','Date/Time',{saved:1})&&G.typeIs('Bookings','Guests','Number',{saved:1})&&G.typeIs('Bookings','Paid','Yes/No',{saved:1});},{m:1}),
  st('Bookings primary key is BookingID',function(){return G.pkIs('Bookings',['BookingID'],{saved:1});},{m:1}),
  st('One-to-many: Guides ▸ Tours on GuideID, referential integrity enforced',function(){var r=G.rel('Guides','GuideID','Tours','GuideID');return r?(r.enforce&&r.type==='One-To-Many'?2:1):0;},{m:2,h1:'Database Tools ▸ Relationships, drag GuideID from Guides onto Tours.'}),
  st('One-to-many: Tours ▸ Bookings on TourCode, referential integrity enforced',function(){var r=G.rel('Tours','TourCode','Bookings','TourCode');return r?(r.enforce&&r.type==='One-To-Many'?2:1):0;},{m:2,h1:'Tick Enforce Referential Integrity in the Edit Relationships box.'})]},
{id:'L3-02',level:3,title:'Paper 032 · Library queries',obj:'S6 SO4 · single- and multi-table queries, calculated fields',db:'library',target:15,
 brief:'Answer these Paper 032-style query questions using the Ocho Rios Community Library database. Save each query with the exact name given.',
 data:'(a) “Computing Books”: Title, Author and Price of Computing books costing more than $36, most expensive first.\n(b) “Late Fines”: FirstName, LastName, BookID and Fine for every loan with a fine greater than 0.\n(c) “Loan Charges”: LoanID, Title and a calculated field Charge that is 10% of the book’s Price.',
 steps:[

function prepDB(m){var db;if(/^blank:/.test(m.db))db=PRACTICE.blank(m.db.slice(6));else db=PRACTICE.build(m.db);if(m.prep)m.prep(db);return db;}

  var m=MISSIONS.find(function(x){return x.id===id;});if(!m)return;closeOverlay();

  S.mode='mission';enterGame();
  S.db=prepDB(m);S.docs=[];S.active=null;S.navSel=null;S.bs=null;S.tab='home';S.events=[];S.zoom=0;

function evalStep(s){if(s.quiz)return MS.quizState[MS.m.steps.indexOf(s)]==='right'?(s.m||1):0;try{var r=s.c();return typeof r==='number'?r:(r?(s.m||1):0);}catch(e){return 0;}}
function liveCheck(){
  if(!MS||MS.finished)return;var m=MS.m,changed2=false;
  m.steps.forEach(function(s,i){
    var v=evalStep(s);
    if(m.level<3){if(v>0&&!MS.done[i]){MS.done[i]=true;changed2=true;blip('good');}}
    else{var full=v>=(s.m||1);if(!!MS.done[i]!==full){MS.done[i]=full;changed2=true;}}
  });
  if(changed2)renderSteps();
  if(m.level<3&&m.steps.every(function(s,i){return MS.done[i];}))completeMission();
}
function renderPanel(){
  var p=$('#mpanel');if(!p)return;
  if(S.mode==='free'){p.innerHTML='<button type="button" class="mp-tog" data-act="mptoggle" aria-expanded="true">◀ Free practice</button><div class="mp-inner"><span class="mp-obj">🧪 Free practice</span><h2 class="mp-title">Sandbox</h2><p class="mp-brief">Nothing is checked here. Explore, experiment and break things! Your sandbox database is saved in this browser. Working on a task your teacher set? Hand it in with <b>📤 Submit my work</b>, or download it with <b>⬇ Save a copy</b>.</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px"><button type="button" class="cbtn gold sm" data-act="pssubmit">📤 Submit my work</button><button type="button" class="cbtn sm" data-act="pscopy">⬇ Save a copy</button></div><div class="free-tips"><b>Open a practice database:</b><div style="display:flex;flex-direction:column;gap:6px;margin:6px 0 10px">'+PRACTICE.list.map(function(x){return '<button type="button" class="cbtn sm" data-act="freeopen" data-id="'+x.id+'">'+esc(x.title)+'</button>';}).join('')+'<button type="button" class="cbtn sm" data-act="freeblank">➕ Blank database</button></div><b>Try this:</b><ul><li>Build a table in Design View and set a key.</li><li>Link tables in Database Tools ▸ Relationships.</li><li>Query with criteria like <code>Like "S*"</code>.</li><li>Import a CSV: External Data ▸ New Data Source ▸ From File ▸ Text File.</li></ul></div><button type="button" class="cbtn" data-act="home">⌂ Back to missions</button></div>';return;}
  if(!MS){p.innerHTML='';return;}

  var h='<button type="button" class="mp-tog" data-act="mptoggle" aria-expanded="true">◀ Mission '+m.id+'</button><div class="mp-inner"><div style="display:flex;justify-content:space-between;align-items:center;gap:6px"><span class="mp-obj">'+esc(m.obj)+'</span>'+(m.level===3?'<span class="timer" id="mptimer" aria-live="off"></span>':'')+'</div><h2 class="mp-title">'+esc(m.title)+'</h2><p class="mp-brief">'+esc(m.brief)+'</p>';

  h+='<ol class="steps" id="mpsteps"></ol><div id="mphint"></div><div id="mpfb"></div><div class="mp-actions" id="mpact"></div></div>';

function renderSteps(){
  var ol=$('#mpsteps');if(!ol||!MS)return;var m=MS.m,cur=m.steps.findIndex(function(s,i){return !MS.done[i];});
  ol.innerHTML=m.steps.map(function(s,i){
    var dn=!!MS.done[i],txt=s.quiz?esc(s.quiz.q):s.t;
    var autoHint=m.level===1&&i===cur&&!s.quiz&&s.h1?'<small>💡 '+esc(s.h1)+'</small>':'';
    var q='';if(s.quiz&&!dn)q='<div class="quiz" role="group" aria-label="Answer choices">'+s.quiz.opts.map(function(o,k){var st2=MS.quizState[i+':'+k];return '<button type="button" data-act="quiz" data-s="'+i+'" data-k="'+k+'" class="'+(st2||'')+'">'+esc(o)+'</button>';}).join('')+'</div>';
    if(s.quiz&&dn)q='<small>✔ '+esc(s.quiz.opts[s.quiz.a])+'</small>';
    var sm=!s.quiz&&s.show&&!dn&&m.level<3?'<button type="button" class="smb" data-act="showme" data-s="'+i+'" aria-label="Show me step '+(i+1)+'" title="Show me">👉</button>':'';
    return '<li class="step'+(dn?' done':'')+(i===cur?' cur':'')+'"><span class="n" aria-hidden="true">'+(dn?'✓':i+1)+'</span><div class="st"><span class="sr">'+(dn?'Done: ':'To do: ')+'</span>'+txt+autoHint+q+'</div>'+(m.level===3?'<span class="marks">'+(s.m||1)+' mk</span>':'')+sm+'</li>';
  }).join('');
}
function renderActions(){
  var a=$('#mpact');if(!a||!MS)return;var m=MS.m;
  if(MS.finished){a.innerHTML='';return;}
  a.innerHTML='<button type="button" class="cbtn" data-act="hint">💡 Hint</button>'+(m.level<3?'<button type="button" class="cbtn" data-act="showmecur">👉 Show me</button>':'<button type="button" class="cbtn" data-act="toggletimer">⏱ Timer '+(MS.timerOn?'on':'off')+'</button>')+
    '<button type="button" class="cbtn gold wide" data-act="check">✅ '+(m.level===3?'Check my work / Submit for marking':'Check my work')+'</button><button type="button" class="cbtn" data-act="restart">↺ Restart</button><button type="button" class="cbtn" data-act="missions">☰ Missions</button>';
}
function curStepIdx(){return MS.m.steps.findIndex(function(s,i){return !MS.done[i]&&!s.quiz;});}
function giveHint(){
  var i=curStepIdx();if(i<0){i=MS.m.steps.findIndex(function(s,k){return !MS.done[k];});}if(i<0)return;var s=MS.m.steps[i];
  var lvl=(MS.hint[i]||0)+1;if(MS.m.level===3&&lvl>1)lvl=2;MS.hint[i]=Math.min(2,lvl);MS.hintsUsed++;
  var txt=s.quiz?'Think about what the question is really testing — re-read the brief.':(lvl===1?(s.h1||s.h2||'Re-read the step carefully.'):(s.h2||s.h1||'Check each part of the step.'));
  if(lvl===2&&MS.m.level>=2){MS.costly++;}
  $('#mphint').innerHTML='<div class="hintbox" role="status"><b>Hint '+(lvl===1?'(nudge)':'(exact)')+' for step '+(i+1)+':</b> '+esc(txt)+(lvl===1&&MS.m.level>=2?'<br><small>Press Hint again for the exact answer (costs a star).</small>':'')+'</div>';
}
function showMe(i){
  if(i==null)i=curStepIdx();if(i<0)return;var s=MS.m.steps[i];if(!s.show){toast('There is no button to point at for this step — try the Hint.','warn');return;}
  if(MS.m.level>=2&&!MS.showUsed){MS.showUsed=true;MS.costly++;}
  var spec=typeof s.show==='function'?s.show():s.show;pointAt(spec);
}
function pointAt(spec){
  hideShowMe();if(!spec)return;var el=null,tip='Click here';
  if(spec.indexOf('cmd:')===0){var id=spec.slice(4),tb=tabOf(id),vis=visibleTabs().some(function(t){return t[0]===tb;});
    if(tb&&S.tab!==tb){if(vis){el=$('[data-tabid="'+tb+'"]');tip='Open the '+(visibleTabs().find(function(t){return t[0]===tb;})||['',''])[1]+' tab first, then click '+CMD[id].l;}else{toast('The '+CMD[id].l+' button appears once the right object is open.','warn');return;}}
    else{el=$('#ribbon [data-cmdid="'+id+'"]');tip=CMD[id].l;}}
  else if(spec.indexOf('nav:')===0){var parts=spec.split(':'),k=parts[1],n=parts.slice(2).join(':');S.navOpen=true;S.navGroups[k]=true;S.navFilter='';renderNav();el=$('[data-nav="'+k+':'+CSS.escape(n).replace(/\\ /g,' ')+'"]')||$$('.nav-item').find(function(x){return x.dataset.nav===k+':'+n;});tip='Double-click '+n;}
  else if(spec.indexOf('sel:')===0){el=$(spec.slice(4));}
  if(!el||!el.getBoundingClientRect().width){toast('Open the right object first, then try Show me again.','warn');return;}
  el.scrollIntoView({block:'nearest',inline:'nearest'});
  var r=el.getBoundingClientRect(),ring=document.createElement('div');ring.className='showme';ring.style.left=(r.left-4)+'px';ring.style.top=(r.top-4)+'px';ring.style.width=(r.width+8)+'px';ring.style.height=(r.height+8)+'px';
  var t=document.createElement('div');t.className='showme-tip';t.textContent='👉 '+tip;t.style.left=Math.max(6,Math.min(innerWidth-270,r.left))+'px';t.style.top=(r.bottom+10>innerHeight-40?r.top-40:r.bottom+10)+'px';
  document.body.appendChild(ring);document.body.appendChild(t);setTimeout(hideShowMe,4500);
}
function hideShowMe(){$$('.showme,.showme-tip').forEach(function(x){x.remove();});}
document.addEventListener('mousedown',function(){if($('.showme'))setTimeout(hideShowMe,150);},true);
function checkWork(){
  if(!MS||MS.finished)return;flushAll();var m=MS.m;
  var res=m.steps.map(function(s,i){var v=evalStep(s);return {s:s,i:i,v:v,max:s.m||1};});
  if(m.level<3){
    res.forEach(function(r){if(r.v>0)MS.done[r.i]=true;});renderSteps();
    var miss=res.filter(function(r){return !MS.done[r.i];});
    if(!miss.length){completeMission();return;}
    MS.fails++;blip('bad');
    $('#mpfb').innerHTML='<div class="fb" role="status"><b>'+(m.steps.length-miss.length)+' of '+m.steps.length+' steps done.</b><ul>'+res.map(function(r){var ok=!!MS.done[r.i];return '<li class="'+(ok?'ok':'no')+'">'+(ok?'✔ ':'✘ ')+'Step '+(r.i+1)+': '+(ok?'done':(r.s.quiz?'answer the question':esc(r.s.h1||'not done yet — look at the real object, not just the screen')))+'</li>';}).join('')+'</ul></div>';
    return;
  }
  var got=res.reduce(function(a,r){return a+Math.min(r.v,r.max);},0),tot=res.reduce(function(a,r){return a+r.max;},0),pct=Math.round(100*got/tot);
  MS.marks={got:got,tot:tot,pct:pct};
  res.forEach(function(r){MS.done[r.i]=r.v>=r.max;});renderSteps();
  $('#mpfb').innerHTML='<div class="fb" role="status"><b>Mark scheme: '+got+' / '+tot+' ('+pct+'%)</b><table class="ms">'+res.map(function(r){return '<tr><td>'+(r.v>=r.max?'<span class="ok">✔</span>':r.v>0?'<span class="ok">½</span>':'<span class="no">✘</span>')+' '+(r.s.quiz?esc(r.s.quiz.q):esc(r.s.t))+(r.v<r.max&&r.s.h1?'<br><small style="color:#C9D2F2">'+esc(r.s.h1)+'</small>':'')+'</td><td class="m">'+Math.min(r.v,r.max)+'/'+r.max+'</td></tr>';}).join('')+'</table>'+
    (pct>=40?'<div style="display:flex;gap:6px;margin-top:8px"><button type="button" class="cbtn gold sm" data-act="submitmarks">📤 Submit '+pct+'% for marking</button><button type="button" class="cbtn sm" data-act="keepgoing">Keep improving</button></div>':'<p>Reach at least 40% to submit. Keep going!</p>')+'</div>';
  if(pct===100)completeMission();
}
function completeMission(){
  if(!MS||MS.finished)return;var m=MS.m;MS.finished=true;
  var pct=m.level===3?(MS.marks?MS.marks.pct:100):100;
  var stars;if(m.level===3)stars=pct>=90?3:pct>=70?2:1;else stars=3;
  stars-=Math.min(1,MS.costly);if(m.level<3&&MS.fails>=3)stars--;stars=Math.max(1,stars);
  var secs=Math.round((Date.now()-MS.start)/1000),bonus=0;
  if(m.level===3&&MS.timerOn&&m.target&&secs<=m.target*60)bonus=30;
  var xp=Math.round(LEVELS[m.level].xp*stars/3)+bonus;
  var prev=P.done[m.id];
  if(!prev||stars>prev.stars||pct>(prev.pct||0)){P.xp+=Math.max(0,xp-(prev?prev.xp||0:0));P.done[m.id]={stars:Math.max(stars,prev?prev.stars:0),pct:Math.max(pct,prev&&prev.pct||0),xp:Math.max(xp,prev?prev.xp||0:0)};}
  if(stars===3){P.streak++;P.best=Math.max(P.best,P.streak);}else P.streak=0;
  if(m.level>=2&&MS.hintsUsed===0)P.noHint=true;
  var newB=[];BADGES.forEach(function(b){if(P.badges.indexOf(b.id)<0&&b.t()){P.badges.push(b.id);newB.push(b);}});
  saveP();blip('win');confetti();
  try{parent.postMessage({type:'dm:result',kind:'game',id:'accesssim',title:m.title,score:stars,max:3,pct:pct,level:m.level},'*');}catch(e){}
  MS.result={stars:stars,pct:pct,xp:xp,bonus:bonus,badges:newB.map(function(b){return b.id;})};
  $('#mpact').innerHTML='';$('#mphint').innerHTML='';
  $('#mpfb').innerHTML=doneCardHTML(m,MS.result);gsSave();
  buildTop();setTimeout(function(){var b=$('#mpfb .cbtn');if(b)b.focus();},50);
}
function doneCardHTML(m,r){
  var stars=r.stars,xp=r.xp,bonus=r.bonus,pct=r.pct,next=MISSIONS[MISSIONS.indexOf(m)+1];
  var newB=BADGES.filter(function(b){return (r.badges||[]).indexOf(b.id)>=0;});
  return '<div class="done-card" role="status"><div class="big">'+'★★★'.slice(0,stars)+'<span style="opacity:.3">'+'★★★'.slice(stars)+'</span></div><b>Mission complete!</b><p style="margin:4px 0">+'+xp+' XP'+(bonus?' (incl. ⏱ +30 speed bonus)':'')+(m.level===3?' · '+pct+'%':'')+'</p>'+(newB.length?'<p>New badge'+(newB.length>1?'s':'')+': '+newB.map(function(b){return b.em+' '+esc(b.n);}).join(', ')+'</p>':'')+
    '<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">'+(next?'<button type="button" class="cbtn gold" data-act="startmission" data-id="'+next.id+'">Next mission ▶</button>':'')+'<button type="button" class="cbtn" data-act="sssubmit">📤 Submit my work</button><button type="button" class="cbtn" data-act="restart">↺ Replay</button><button type="button" class="cbtn" data-act="missions">☰ Missions</button></div></div>';
}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=document.createElement('canvas');c.id='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);var x=c.getContext('2d'),ps=[],cols=['#F5C542','#A4373A','#3FB46E','#4F81BD','#fff'];
  for(var i=0;i<140;i++)ps.push({x:innerWidth*0.7,y:innerHeight*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,s:4+Math.random()*5,c:cols[i%5],r:Math.random()*6});
  var t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});if(++t<110)requestAnimationFrame(f);else c.remove();})();
}
setInterval(function(){var t=$('#mptimer');if(!t||!MS||MS.finished)return;if(!MS.timerOn){t.textContent='';return;}var s=Math.round((Date.now()-MS.start)/1000);t.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+(MS.m.target?' / '+MS.m.target+':00':'');},1000);

/* ---------- top bar ---------- */
function buildTop(){
  var l=MS?MS.m.level:P.lastLevel||1;
  $('#topbar').innerHTML='<div class="tb-brand"><i aria-hidden="true">A</i><span class="hide-s">Access Lab</span></div><button type="button" class="tbtn" data-act="home" aria-label="Home screen">⌂</button>'+dialHTML(l).replace('class="dial"','class="dial hide-s"')+'<span class="sp"></span><span class="xp" aria-label="'+P.xp+' experience points">⭐ '+P.xp+' XP</span>'+
    '<button type="button" class="tbtn" data-act="missions">☰ <span class="hide-s">Missions</span></button><button type="button" class="tbtn hide-s" data-act="progress">🏅</button><button type="button" class="tbtn hide-s" data-act="qref" aria-label="Quick reference">⌨️</button><button type="button" class="tbtn" data-act="howto" aria-label="How to play">❓</button><button type="button" class="tbtn" data-act="togglesound" aria-pressed="'+P.sound+'" aria-label="Sound '+(P.sound?'on':'off')+'">'+(P.sound?'🔊':'🔇')+'</button><button type="button" class="tbtn" data-act="mptoggle" aria-label="Show or hide the mission panel">📋</button>';
}
ACT.openlevel=function(el){showLevel(+el.dataset.l);};
ACT.startmission=function(el){startMission(el.dataset.id);};
ACT.closeovl=closeOverlay;
ACT.dial=function(el){var cur=MS?MS.m.level:(P.lastLevel||1);var $l=$('#ovl .dial span');if($l)cur=+$l.textContent.replace(/\D/g,'');var n=Math.max(1,Math.min(3,cur+(+el.dataset.d)));showLevel(n);};
ACT.freeplay=function(){startFree();};
ACT.freeopen=function(el){S.mode='free';GAME.openPractice(el.dataset.id);};
ACT.freeblank=function(){GAME.newBlank();};
ACT.howto=showHowTo;ACT.progress=showProgress;ACT.qref=showQuickRef;ACT.printqref=printQref;
ACT.home=function(){closeOverlay();DLG.slice().forEach(function(r){r.close(null);});if(S.mode==='free')saveSandbox();S.mode='start';MS=null;renderStart();showScreen('start');try{history.replaceState(null,'','?');}catch(e){}gsSave();};
ACT.missions=function(){showLevel(MS?MS.m.level:(P.lastLevel||1));};
ACT.togglesound=function(){P.sound=!P.sound;S.sound=P.sound;saveP();if(S.mode==='start')renderStart();else buildTop();blip('click');};
ACT.mptoggle=function(){var p=$('#mpanel');p.classList.toggle('collapsed');var b=p.querySelector('.mp-tog');if(b)b.setAttribute('aria-expanded',String(!p.classList.contains('collapsed')));setTimeout(function(){if(activeDoc()&&(activeDoc().kind==='rel'||activeDoc().kind==='query'))renderDoc();},250);};
ACT.resetprog=async function(){if(window.GameSave){closeOverlay();GameSave.startOver();return;}var a=await new Promise(function(res){overlay('<h2>Reset progress?</h2><p>This deletes all your stars, XP and badges on this device. It cannot be undone.</p><div class="row-btns"><button type="button" class="cbtn gold" id="rpyes">Yes, reset</button><button type="button" class="cbtn" id="rpno">Cancel</button></div>','Confirm reset');$('#rpyes').onclick=function(){res(true);};$('#rpno').onclick=function(){res(false);};});
  closeOverlay();if(!a)return;var snd=P.sound;P={v:1,xp:0,done:{},badges:[],streak:0,best:0,sound:snd,timer:true,lastLevel:1,sandbox:null};saveP();if(S.mode==='start')renderStart();else buildTop();toast('Progress reset.');};
ACT.quiz=function(el){var i=+el.dataset.s,k=+el.dataset.k,s=MS.m.steps[i];if(k===s.quiz.a){MS.quizState[i]='right';MS.done[i]=true;blip('good');}else{MS.quizState[i+':'+k]='wrong';MS.fails+=MS.m.level<3?0:0;blip('bad');toast('Not quite — try another answer.','warn');}renderSteps();liveCheck();};
ACT.hint=giveHint;ACT.showmecur=function(){showMe();};ACT.showme=function(el){showMe(+el.dataset.s);};
ACT.check=checkWork;ACT.submitmarks=function(){completeMission();};ACT.keepgoing=function(){$('#mpfb').innerHTML='';};
ACT.restart=function(){if(MS)startMission(MS.m.id);};
ACT.toggletimer=function(){MS.timerOn=!MS.timerOn;P.timer=MS.timerOn;saveP();renderActions();};
ACT.csvdl=function(el){var c=MS.m.csvs[+el.dataset.i];download(c.name,c.text,'text/csv');};
ACT.csvcopy=function(el){var c=MS.m.csvs[+el.dataset.i];try{navigator.clipboard.writeText(c.text).then(function(){toast('Copied — paste it into the import box.');},function(){toast('Select the text in the box and press Ctrl+C.','warn');});}catch(e){toast('Select the text in the box and press Ctrl+C.','warn');}};
ACT.dismiss600=function(){$('#banner600').remove();};

/* ---------- boot ---------- */
function boot(){
  S.sound=P.sound;buildWindow();installEvents();renderStart();
  var q={};try{location.search.replace(/^\?/,'').split('&').forEach(function(p){var kv=p.split('=');if(kv[0])q[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});}catch(e){}
  var sv=null;if(window.GameSave){GameSave.register([KEYSTORE,AC_SESSION]);GameSave.persist({key:AC_SESSION,welcome:false,every:5000,get:acSessionGet,set:function(v){sv=v;}});GameSave.onReset(function(){clearTimeout(_autoT);_autoT=null;try{var u=new URLSearchParams(location.search);u.delete('mission');u.delete('mode');var qs=u.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));}catch(e){}});}
  var resume=function(){if(!acRestore(sv))return false;if(sv.mode==='mission')setTimeout(function(){try{GameSave.toast('Welcome back! Your work was restored.');}catch(e){}},400);return true;};
  var qm=q.mission?MISSIONS.find(function(m){return lc(m.id)===lc(q.mission);}):null;
  if(qm){if(!(sv&&sv.mode==='mission'&&sv.mission===qm.id&&resume()))startMission(qm.id);}
  else if(q.mode==='free'){startFree();}
  else if(q.level&&/^[123]$/.test(q.level)){showScreen('start');showLevel(+q.level);}
  else if(!(sv&&resume()))showScreen('start');
  window.addEventListener('resize',function(){var d=activeDoc();if(d&&(d.kind==='rel'||d.kind==='query'||d.kind==='report'))renderDoc();});
}
document.addEventListener('DOMContentLoaded',boot);

</script>
