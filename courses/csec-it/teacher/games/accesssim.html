<!doctype html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Lab</title>
<meta name="description" content="Access Lab: a Microsoft Access practice simulator for CSEC Information Technology (Section 6 databases).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13286A;--gold:#F5C542;--gold2:#FFD970;--ink:#EEF2FF;--muted:#B7C2E6;
  --acc:#A4373A;--acc-d:#8B2E31;--acc-l:#F6E3E4;--acc-ll:#FBF1F1;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --ds:"Calibri","Segoe UI",system-ui,Arial,sans-serif;
  --disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --line:#D4D4D4;--line2:#E6E6E6;--txt:#262626;--txt2:#555;--sel:#E8D5D6;--focus:#1A5FB4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--navy);color:var(--txt);font-family:var(--ui);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ===== course screens ===== */
.screen{position:fixed;inset:0;overflow:auto;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:var(--ink);font-family:var(--body);font-size:16px}
.start-wrap{max-width:1120px;margin:0 auto;padding:28px 24px 40px}
.brand{display:flex;align-items:center;gap:14px}
.brand .appA{width:54px;height:54px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font:700 30px var(--disp);color:#fff;box-shadow:0 6px 24px rgba(164,55,58,.45)}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1.title{font:800 clamp(34px,5vw,56px)/1.02 var(--disp);margin:6px 0 6px;letter-spacing:-.02em}
.pitch{font-size:18px;color:var(--muted);max-width:760px;margin:8px 0 18px}
.objs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.objs li{border:1px solid rgba(245,197,66,.35);background:rgba(245,197,66,.08);color:#FBE7A6;border-radius:999px;padding:5px 12px;font-size:13px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{position:relative;text-align:left;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-radius:18px;padding:18px 18px 16px;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s}
.lvcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.lvcard .em{font-size:30px}
.lvcard h3{font:700 22px var(--disp);margin:6px 0 4px}
.lvcard p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.lvmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.cbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.cbtn:hover{border-color:var(--gold)}
.cbtn.gold{background:var(--gold);color:#1B1600;border-color:var(--gold)}
.cbtn.gold:hover{background:var(--gold2)}
.cbtn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.statline{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 0;color:var(--muted);font-size:14px}
.statline b{color:var(--gold)}
.foot{margin-top:28px;color:#8F9CC8;font-size:13px}
.dial{display:inline-flex;align-items:center;border:1px solid rgba(245,197,66,.4);border-radius:999px;overflow:hidden}
.dial button{border:0;background:transparent;color:var(--ink);padding:6px 10px;cursor:pointer;font:600 13px var(--body)}
.dial button:hover{background:rgba(245,197,66,.15)}
.dial span{padding:0 8px;color:var(--gold);font:700 13px var(--body);border-left:1px solid rgba(245,197,66,.3);border-right:1px solid rgba(245,197,66,.3);line-height:28px}

/* overlay pages */
.ovl{position:fixed;inset:0;z-index:900;background:rgba(3,7,22,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;font-family:var(--body)}
.ovl-card{width:min(980px,100%);background:linear-gradient(180deg,var(--navy2),#091538);border:1px solid rgba(255,255,255,.14);border-radius:18px;color:var(--ink);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ovl-card h2{font:800 28px var(--disp);margin:0 0 4px}
.ovl-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:5px}
.mcard:hover{border-color:var(--gold)}
.mcard .mid{font-size:12px;color:var(--gold);letter-spacing:.04em}
.mcard b{font:700 16px var(--disp)}
.mcard small{color:var(--muted);font-size:13px}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.stars .off{color:rgba(255,255,255,.25)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.badge{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.04)}
.badge .bi{font-size:26px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge b{display:block;font-size:14px}.badge small{color:var(--muted);font-size:12px}
.qref{columns:2 320px;column-gap:24px}
.qref section{break-inside:avoid;margin:0 0 14px}
.qref h3{font:700 16px var(--disp);color:var(--gold);margin:0 0 6px}
.qref table{width:100%;border-collapse:collapse;font-size:13.5px}
.qref td{border-bottom:1px solid rgba(255,255,255,.08);padding:4px 6px;vertical-align:top}
.qref td:first-child{white-space:nowrap;color:#FBE7A6;font-family:var(--ui)}
.howto ol{padding-left:20px;line-height:1.55}
.kbd{font-family:var(--ui);background:rgba(255,255,255,.12);border-radius:5px;padding:1px 6px;font-size:.9em}

/* ===== game layout ===== */
#game{display:flex;flex-direction:column;background:#1b1b1b}
#topbar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);font-size:14px;border-bottom:1px solid rgba(245,197,66,.25)}
#topbar .tb-brand{display:flex;align-items:center;gap:8px;font:700 15px var(--disp);white-space:nowrap}
#topbar .tb-brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center;font:700 13px var(--disp);color:#fff;font-style:normal}
#topbar .sp{flex:1}
.tbtn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--ink);border-radius:9px;padding:5px 9px;cursor:pointer;font:600 13px var(--body);white-space:nowrap}
.tbtn:hover{border-color:var(--gold)}
.xp{color:var(--gold);font-weight:700;white-space:nowrap}
#workspace{flex:1;display:flex;min-height:0;position:relative}
#banner600{display:none;background:#FFF4CE;color:#3b2f00;font:14px var(--body);padding:6px 10px;align-items:center;gap:8px}
#banner600 button{margin-left:auto;border:1px solid #8a6d00;background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}

/* ===== Access window ===== */
.acc{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;color:var(--txt);font-family:var(--ui);font-size:12px;position:relative;overflow:hidden}
.acc-title{height:32px;flex:none;display:flex;align-items:center;gap:6px;background:var(--acc);color:#fff;padding:0 0 0 8px;user-select:none}
.appicon{width:18px;height:18px;border-radius:4px;background:#fff;color:var(--acc);display:grid;place-items:center;font:700 11px var(--ui)}
.qat{display:flex;gap:1px;margin-left:4px}
.qat button,.winbtns button{border:0;background:transparent;color:#fff;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;border-radius:3px}
.qat button:hover{background:rgba(255,255,255,.18)}
.acc-ttl{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.acc-search{flex:0 1 300px;min-width:110px;position:relative}
.acc-search input{width:100%;height:24px;border-radius:4px;border:0;background:rgba(255,255,255,.88);color:#222;padding:0 8px 0 26px;font-size:12px}
.acc-search svg{position:absolute;left:7px;top:5px}
.acc-search .res{position:absolute;top:28px;left:0;right:0;background:#fff;color:#222;border:1px solid #ccc;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:60;max-height:300px;overflow:auto}
.acc-search .res button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:#fff;padding:6px 10px;text-align:left;cursor:pointer}
.acc-search .res button:hover,.acc-search .res button:focus{background:#f0f0f0}
.acc-user{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:11px;margin:0 6px}
.winbtns{display:flex}.winbtns button{width:40px;height:32px;border-radius:0}
.winbtns button:hover{background:rgba(255,255,255,.18)}.winbtns button.x:hover{background:#C42B1C}
.acc-tabs{flex:none;display:flex;align-items:flex-end;gap:0;background:var(--acc);padding:0 6px;height:30px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.acc-tabs::-webkit-scrollbar{display:none}
.rtab{border:0;background:transparent;color:#fff;padding:0 12px;height:27px;cursor:pointer;white-space:nowrap;font-size:12.5px;border-radius:3px 3px 0 0}
.rtab:hover{background:rgba(255,255,255,.15)}
.rtab[aria-selected=true]{background:#fff;color:var(--acc);font-weight:600}
.rtab.file{background:var(--acc-d);font-weight:600}
.rtab.file:hover{background:#7a2629}
.rtab.ctxt{color:#FFE7A8}
.rtab.ctxt[aria-selected=true]{color:var(--acc);box-shadow:inset 0 3px 0 #E8A33D}
.ctxlabel{align-self:center;color:#FFE7A8;font-size:11px;padding:0 4px 0 10px;white-space:nowrap;opacity:.9}
.acc-ribbon{flex:none;height:96px;display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:2px 2px 0}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--line2);padding:0 3px;flex:none}
.rgroup-body{flex:1;display:flex;align-items:flex-start;gap:1px;padding-top:2px}
.rgroup-label{height:17px;font-size:11px;color:#666;text-align:center;white-space:nowrap;padding:0 4px}
.rcol{display:flex;flex-direction:column;gap:0;justify-content:flex-start}
.rb{border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:#262626;display:flex;align-items:center;gap:4px;padding:1px 4px;white-space:nowrap;font-size:12px;position:relative}
.rb:hover:not([aria-disabled=true]){background:#E9E9E9;border-color:#D0D0D0}
.rb:active:not([aria-disabled=true]){background:#DADADA}
.rb[aria-disabled=true]{color:#A6A6A6;cursor:default}
.rb[aria-disabled=true] svg{opacity:.4}
.rb.on{background:#E2CFD0;border-color:#C9A9AA}
.rb.lg{flex-direction:column;justify-content:flex-start;min-width:46px;max-width:74px;height:74px;padding:3px 3px 1px;white-space:normal;text-align:center;line-height:1.15}
.rb.lg .lbl{font-size:11.5px}
.rb.sm{height:23px}
.rb .dd{font-size:8px;opacity:.75;margin-left:1px}
.rbsplit{display:flex;flex-direction:column;align-items:center;border:1px solid transparent;border-radius:3px}
.rbsplit:hover{border-color:#D0D0D0}
.rbsplit .rb.lg{height:44px;border-radius:3px 3px 0 0;min-width:46px}
.rbsplit .rb.lgdd{height:30px;border-radius:0 0 3px 3px;font-size:11.5px;min-width:46px;justify-content:center;flex-direction:column;gap:0;line-height:1.1}
.rfield{display:flex;align-items:center;gap:4px;height:23px;font-size:12px;padding:0 4px}
.rfield select,.rfield input[type=text]{height:21px;border:1px solid #C8C8C8;border-radius:2px;background:#fff;font-size:12px;padding:0 3px}
.rfield input[type=checkbox]{margin:0}
.tfmock{display:flex;flex-direction:column;gap:3px;padding-top:2px;opacity:.75}
.tfmock div{display:flex;gap:3px}
.tfmock span{border:1px solid #ccc;height:20px;border-radius:2px;display:inline-grid;place-items:center;padding:0 5px;font-size:11px;background:#fff;cursor:pointer}
.acc-body{flex:1;display:flex;min-height:0;position:relative;background:#E7E7E7}
/* nav pane */
.nav{width:228px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nav-h{display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 4px 0 8px;font-weight:600;border-bottom:1px solid var(--line2)}
.nav-h button{border:0;background:transparent;cursor:pointer;border-radius:3px;padding:2px 5px}
.nav-h button:hover{background:#eee}
.nav-search{padding:5px 6px;border-bottom:1px solid var(--line2);position:relative}
.nav-search input{width:100%;height:23px;border:1px solid #C8C8C8;border-radius:2px;padding:0 24px 0 6px;font-size:12px}
.nav-search svg{position:absolute;right:12px;top:10px}
.nav-list{flex:1;overflow:auto;padding-bottom:10px}
.nav-grp{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:#F3F3F3;border-bottom:1px solid #E3E3E3;padding:4px 8px;font-weight:600;color:var(--acc);cursor:pointer;font-size:12px;text-align:left}
.nav-grp:hover{background:#ECECEC}
.nav-grp .chev{color:#666;font-size:10px}
.nav-item{display:flex;align-items:center;gap:6px;width:100%;border:1px solid transparent;background:transparent;padding:3px 8px 3px 14px;cursor:pointer;text-align:left;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:#F2F2F2}
.nav-item.sel{background:var(--sel);border-color:#D6B7B8}
.nav-item.open{font-weight:600}
.nav-collapsed{width:26px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.nav-collapsed button{border:0;background:transparent;cursor:pointer;padding:6px 0}
.nav-collapsed span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;margin-top:8px;color:#444}
.nav-empty{padding:10px;color:#777;font-style:italic}
/* documents */
.docs{flex:1;min-width:0;display:flex;flex-direction:column;background:#E7E7E7}
.dtabs{flex:none;display:flex;gap:0;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;min-height:27px}
.dtab{display:flex;align-items:center;gap:5px;padding:0 4px 0 9px;height:26px;border-right:1px solid var(--line2);cursor:pointer;background:#F7F7F7;white-space:nowrap;border-top:2px solid transparent;font-size:12px;user-select:none}
.dtab.on{background:#fff;border-top-color:var(--acc);font-weight:600}
.dtab button{border:0;background:transparent;width:18px;height:18px;border-radius:3px;cursor:pointer;display:grid;place-items:center;color:#666}
.dtab button:hover{background:#e5e5e5;color:#000}
.dbody{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
.dempty{position:absolute;inset:0;display:grid;place-items:center;background:#E7E7E7;color:#777;text-align:center;font-size:13px;padding:20px}
.status{height:24px;flex:none;display:flex;align-items:center;background:#F3F3F3;border-top:1px solid var(--line);padding:0 6px;font-size:11.5px;color:#444;gap:10px}
.status .sp{flex:1}
.status .vbtn{border:1px solid transparent;background:transparent;width:24px;height:20px;cursor:pointer;display:grid;place-items:center;border-radius:2px}
.status .vbtn:hover{background:#e3e3e3}
.status .vbtn.on{background:#E0CDCE;border-color:#C9A9AA}

/* datasheet */
.ds{position:absolute;inset:0;display:flex;flex-direction:column;font-family:var(--ds);font-size:13px}
.ds-scroll{flex:1;overflow:auto;min-height:0;background:#fff}
.dsg{border-collapse:separate;border-spacing:0;table-layout:fixed}
.dsg th,.dsg td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:22px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.dsg thead th{position:sticky;top:0;z-index:2;background:#F3F3F3;font-weight:400;text-align:left;color:#222;padding:0 2px 0 6px;cursor:default;user-select:none}
.dsg thead th.csel{background:#E2CFD0}
.dsg thead th .hcell{display:flex;align-items:center;justify-content:space-between;gap:3px}
.dsg thead th .hname{overflow:hidden;text-overflow:ellipsis}
.dsg thead th .hsort{font-size:10px;color:var(--acc)}
.dsg thead th button.cm{border:0;background:transparent;width:16px;height:18px;cursor:pointer;color:#444;font-size:9px;border-radius:2px;flex:none}
.dsg thead th button.cm:hover{background:#ddd}
.dsg thead th.addcol{color:#666;font-style:normal;cursor:pointer;min-width:100px}
.dsg th.rs,.dsg td.rs{width:20px;min-width:20px;max-width:20px;padding:0;text-align:center;background:#F3F3F3;color:#555;font-size:10px;cursor:pointer;position:sticky;left:0;z-index:1}
.dsg thead th.rs{z-index:3}
.dsg tr.cur td.rs{background:#E2CFD0;color:var(--acc)}
.dsg tr.rsel td{background:#EBD9DA}
.dsg td.num{text-align:right}
.dsg td.cc{padding:0;outline:2px solid var(--acc);outline-offset:-2px;background:#fff}
.dsg td.cc input.ci{width:100%;height:21px;border:0;padding:0 5px;background:transparent;font-family:var(--ds);font-size:13px;outline:none}
.dsg td.cc.num input.ci{text-align:right}
.dsg td.ync{text-align:center}
.dsg td.ync input{margin:0;vertical-align:middle;cursor:pointer}
.dsg tr.newrow td{color:#888}
.dsg tr.tot td{background:#FAF4E1;border-top:2px solid #C9B98A}
.dsg tr.tot select{border:0;background:transparent;font-size:11px;color:#555;max-width:72px}
.dsg tr.tot .tv{font-weight:600;margin-right:4px}
.dsg tr:hover td:not(.rs):not(.cc){background:#FAFAFA}
.dsnav{flex:none;height:24px;display:flex;align-items:center;gap:2px;background:#F3F3F3;border-top:1px solid var(--line);padding:0 4px;font-family:var(--ui);font-size:11.5px;color:#444;white-space:nowrap;overflow:hidden}
.dsnav button{border:1px solid transparent;background:transparent;height:20px;min-width:20px;cursor:pointer;border-radius:2px;font-size:11px;color:#333}
.dsnav button:hover:not(:disabled){background:#e3e3e3;border-color:#ccc}
.dsnav button:disabled{color:#aaa;cursor:default}
.dsnav input{height:18px;width:80px;border:1px solid #C8C8C8;font-size:11.5px;text-align:center}
.dsnav .flt{border:1px solid #ccc;padding:0 6px;margin-left:6px}
.dsnav .flt.on{background:#FFF0B3;border-color:#D9B500}
.dsnav .srch{width:110px;text-align:left;margin-left:6px}
/* table design */
.tdv{position:absolute;inset:0;display:flex;flex-direction:column}
.tdv-top{flex:1 1 55%;overflow:auto;min-height:80px;border-bottom:4px solid #D9D9D9}
.tdg{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
.tdg th{position:sticky;top:0;background:#F3F3F3;border:1px solid var(--line);font-weight:400;text-align:left;padding:3px 6px;z-index:1}
.tdg td{border:1px solid var(--line);padding:0;height:22px}
.tdg td.rs{width:22px;text-align:center;background:#F3F3F3;cursor:pointer;font-size:11px}
.tdg tr.sel td.rs{background:#E2CFD0}
.tdg tr.msel td{background:#F4E8E8}
.tdg tr.sel td{background:#F8EEEE}
.tdg input,.tdg select{width:100%;height:21px;border:0;background:transparent;padding:0 5px;font-size:12.5px;outline:none}
.tdg input:focus,.tdg select:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--acc)}
.tdg col.c1{width:28%}.tdg col.c2{width:20%}
.tdv-bot{flex:1 1 45%;display:flex;flex-direction:column;min-height:120px;background:#fff}

      (o.buttons&&o.buttons.length?'<div class="dlg-f">'+o.buttons.map(function(b,i){return '<button type="button" class="btn'+(b.def?' def':'')+'" data-b="'+i+'"'+(b.id?' id="'+b.id+'"':'')+'>'+esc(b.label)+'</button>';}).join('')+'</div>':'')+'</div>';
    var host=$('#accwin')||document.body;host.appendChild(back);
    var prevFocus=document.activeElement;
    var rec={el:back,close:function(v){if(!back.parentNode)return;back.remove();DLG.splice(DLG.indexOf(rec),1);try{if(prevFocus&&prevFocus.focus&&document.body.contains(prevFocus))prevFocus.focus();}catch(e){}resolve(v);}};
    DLG.push(rec);
    back.addEventListener('click',function(ev){
      var x=ev.target.closest('[data-x]');if(x){rec.close(o.cancelValue!==undefined?o.cancelValue:null);return;}
      var b=ev.target.closest('[data-b]');if(b&&!b.disabled){var bt=o.buttons[+b.dataset.b];
        if(bt.click){var r=bt.click(back,rec);if(r===false)return;if(r&&r.then){r.then(function(v){if(v!==false)rec.close(v===undefined?bt.value:v);});return;}if(r!==undefined){rec.close(r);return;}}
        rec.close(bt.value!==undefined?bt.value:bt.label);}
    });
    back.addEventListener('keydown',function(ev){
      if(ev.key==='Escape'){ev.stopPropagation();ev.preventDefault();rec.close(o.cancelValue!==undefined?o.cancelValue:null);return;}
      if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.tagName!=='TEXTAREA'&&ev.target.tagName!=='BUTTON'&&!(ev.target.tagName==='SELECT'&&ev.target.size>1&&false)){var d=o.buttons&&o.buttons.findIndex(function(b){return b.def;});if(d>=0){ev.preventDefault();ev.stopPropagation();back.querySelector('[data-b="'+d+'"]').click();}}
      if(ev.key==='Tab'){var f=$$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])',back).filter(function(e){return !e.disabled&&e.offsetParent!==null;});if(!f.length)return;var i=f.indexOf(document.activeElement);if(ev.shiftKey&&i<=0){ev.preventDefault();f[f.length-1].focus();}else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0].focus();}}
      ev.stopPropagation();
    });
    if(o.onOpen)o.onOpen(back,rec);
    setTimeout(function(){var t=back.querySelector('[autofocus]')||back.querySelector('.dlg-b input,.dlg-b select,.dlg-b textarea')||back.querySelector('.btn.def')||back.querySelector('.btn');if(t)t.focus();if(t&&t.select&&t.tagName==='INPUT')t.select();},20);
  });
}

/* ---------- menus ---------- */
var MENU=null;
function closeMenu(){if(MENU){MENU.el.remove();if(MENU.sub)MENU.sub.remove();var r=MENU.ret;MENU=null;if(r&&document.body.contains(r))try{r.focus();}catch(e){}}}
function menuHTML(items){
  return items.map(function(it,i){
    if(it.sep)return '<hr>';
    if(it.html)return it.html;
    return '<button type="button" role="menuitem" data-mi="'+i+'"'+(it.disabled?' disabled':'')+(it.id?' data-cmdid="'+esc(it.id)+'"':'')+'><span class="ic">'+(it.check?'✓':it.icon?ic(it.icon,16):'')+'</span>'+esc(it.label)+(it.sub?'<span class="sub">▸</span>':'')+'</button>';
  }).join('');
}
function openMenu(x,y,items,anchor,o){
  closeMenu();
  var el=document.createElement('div');el.className='ctx';el.setAttribute('role','menu');el.innerHTML=menuHTML(items);
  document.body.appendChild(el);
  var w=el.offsetWidth,h=el.offsetHeight;if(x+w>innerWidth-4)x=Math.max(4,innerWidth-w-4);if(y+h>innerHeight-4)y=Math.max(4,innerHeight-h-4);
  el.style.left=x+'px';el.style.top=y+'px';
  MENU={el:el,items:items,ret:anchor||document.activeElement};
  if(o&&o.onOpen)o.onOpen(el);
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-mi]');if(!b||b.disabled)return;var it=items[+b.dataset.mi];
    if(it.sub){openSub(b,it.sub);return;}
    closeMenu();if(it.act)it.act();
  });
  el.addEventListener('mouseover',function(ev){var b=ev.target.closest('[data-mi]');if(!b)return;var it=items[+b.dataset.mi];if(it.sub)openSub(b,it.sub);else if(MENU&&MENU.sub&&!MENU.sub.contains(ev.target)){MENU.sub.remove();MENU.sub=null;}});
  el.addEventListener('keydown',menuKeys);
  setTimeout(function(){var f=el.querySelector('button:not(:disabled),input');if(f)f.focus();},10);
  return el;
}
function openSub(b,items){
  if(MENU.sub)MENU.sub.remove();
  var el=document.createElement('div');el.className='ctx';el.setAttribute('role','menu');el.innerHTML=menuHTML(items);document.body.appendChild(el);
  var r=b.getBoundingClientRect(),x=r.right-2,y=r.top-3;if(x+el.offsetWidth>innerWidth)x=r.left-el.offsetWidth+2;if(y+el.offsetHeight>innerHeight)y=innerHeight-el.offsetHeight-4;
  el.style.left=x+'px';el.style.top=y+'px';MENU.sub=el;
  el.addEventListener('click',function(ev){var bb=ev.target.closest('[data-mi]');if(!bb||bb.disabled)return;var it=items[+bb.dataset.mi];closeMenu();if(it.act)it.act();});
  el.addEventListener('keydown',menuKeys);
  return el;
}
function menuKeys(ev){
  var m=ev.currentTarget,bs=$$('button:not(:disabled)',m),i=bs.indexOf(document.activeElement);
  if(ev.key==='ArrowDown'){ev.preventDefault();(bs[i+1]||bs[0]).focus();}
  else if(ev.key==='ArrowUp'){ev.preventDefault();(bs[i-1]||bs[bs.length-1]).focus();}
  else if(ev.key==='ArrowRight'&&document.activeElement&&document.activeElement.querySelector('.sub')){ev.preventDefault();document.activeElement.dispatchEvent(new MouseEvent('click',{bubbles:true}));setTimeout(function(){if(MENU&&MENU.sub){var f=MENU.sub.querySelector('button');if(f)f.focus();}},10);}
  else if(ev.key==='ArrowLeft'&&MENU&&MENU.sub===m){ev.preventDefault();MENU.sub.remove();MENU.sub=null;var f2=MENU.el.querySelector('button:focus,button');if(f2)f2.focus();}
  else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closeMenu();}
  else if(ev.key==='Tab'){closeMenu();}
}
function menuAt(el,items,o){var r=el.getBoundingClientRect();return openMenu(r.left,r.bottom+1,items,el,o);}
document.addEventListener('mousedown',function(ev){if(MENU&&!MENU.el.contains(ev.target)&&!(MENU.sub&&MENU.sub.contains(ev.target)))closeMenu();},true);

var BASETABS=[['home','Home'],['create','Create'],['ext','External Data'],['dbt','Database Tools'],['help','Help']];
function ctxTabs(){
  var d=activeDoc();if(!d)return [];
  if(d.kind==='table'&&d.view==='datasheet')return [['tfields','Table Fields'],['ttable','Table']];
  if(d.kind==='table'&&d.view==='design')return [['tdesign','Table Design']];
  if(d.kind==='query'&&d.view==='design')return [['qdesign','Query Design']];
  if(d.kind==='rel')return [['reldesign','Relationship Design']];
  if(d.kind==='report'&&d.view==='preview')return [['preview','Print Preview']];
  if(d.kind==='report'&&d.view==='layout')return [['rlayout','Report Layout Design']];
  return [];
}
function visibleTabs(){var d=activeDoc();if(d&&d.kind==='report'&&d.view==='preview')return ctxTabs();return BASETABS.concat(ctxTabs());}
function ribHas(k,id){return (RIB[k]||[]).some(function(g){return g[1].some(function(it){return it[1]===id||(Array.isArray(it[1])&&it[1].indexOf(id)>=0);});});}
function tabOf(cmdId){
  var vis=visibleTabs().map(function(t){return t[0];});
  if(vis.indexOf(S.tab)>=0&&ribHas(S.tab,cmdId))return S.tab;
  var base=['home','create','ext','dbt','help'];
  for(var i=0;i<vis.length;i++)if(ribHas(vis[i],cmdId))return vis[i];
  for(var k in RIB)if(ribHas(k,cmdId))return k;return null;}
function cmdIcon(c){return typeof c.i==='function'?c.i():c.i;}
function rbtn(id,size){
  var c=CMD[id];if(!c)return '';var en=c.en?c.en():true,on=c.on&&c.on();
  var dd=c.menu&&!c.run?'<span class="dd">▼</span>':'';
  var tip=(c.t||c.l)+(en?'':'\n(Not available right now)');
  if(size==='L')return '<button type="button" class="rb lg'+(on?' on':'')+'" data-act="cmd" data-cmdid="'+id+'" aria-label="'+esc(c.l)+'" title="'+esc(tip)+'"'+(en?'':' aria-disabled="true"')+(on?' aria-pressed="true"':'')+'>'+ic(cmdIcon(c),32)+'<span class="lbl">'+esc(c.l)+(dd?' '+dd:'')+'</span></button>';
  return '<button type="button" class="rb sm'+(on?' on':'')+'" data-act="cmd" data-cmdid="'+id+'" aria-label="'+esc(c.l)+'" title="'+esc(tip)+'"'+(en?'':' aria-disabled="true"')+(on?' aria-pressed="true"':'')+'>'+ic(cmdIcon(c),16)+'<span>'+esc(c.l)+'</span>'+dd+'</button>';
}
function renderRibbon(){
  var host=$('#ribbon');if(!host)return;
  var vis=visibleTabs().map(function(t){return t[0];});if(vis.indexOf(S.tab)<0)S.tab=vis[0];
  var groups=RIB[S.tab]||[];
  host.innerHTML=groups.map(function(g){
    return '<div class="rgroup" role="group" aria-label="'+esc(g[0])+'"><div class="rgroup-body">'+g[1].map(function(it){
      if(it[0]==='L')return rbtn(it[1],'L');
      if(it[0]==='S')return '<div class="rcol">'+it[1].map(function(id){return rbtn(id,'S');}).join('')+'</div>';
      if(it[0]==='SPLIT'){var c=CMD[it[1]],en=c.en();return '<div class="rbsplit"><button type="button" class="rb lg" data-act="cmd" data-cmdid="'+it[1]+'" aria-label="'+esc(c.l)+'" title="'+esc(c.t)+'"'+(en?'':' aria-disabled="true"')+'>'+ic(cmdIcon(c),32)+'</button><button type="button" class="rb lgdd" data-act="cmdmenu" data-cmdid="'+it[1]+'" aria-label="View menu" title="View options"'+(en?'':' aria-disabled="true"')+'><span>View</span><span class="dd">▼</span></button></div>';}
      if(it[0]==='TF')return '<div class="tfmock" title="Text Formatting is not needed for CSEC database tasks"><div><span data-act="notcsec" style="width:96px;justify-content:flex-start">Calibri (Detail) ▾</span><span data-act="notcsec">11 ▾</span></div><div><span data-act="notcsec"><b>B</b></span><span data-act="notcsec"><i>I</i></span><span data-act="notcsec"><u>U</u></span><span data-act="notcsec">A ▾</span><span data-act="notcsec">≡</span></div></div>';
      if(it[0]==='FSIZE'||it[0]==='FTYPE'||it[0]==='FVAL')return TD.ribbonField(it[0]);
      return '';
    }).join('')+'</div><div class="rgroup-label">'+esc(g[0])+'</div></div>';
  }).join('');
}
function renderTabs(){
  var host=$('#rtabs');if(!host)return;var ctx=ctxTabs(),vis=visibleTabs();
  var html='<button type="button" class="rtab file" data-act="file" aria-label="File (backstage)" title="File\nOpen, save, compact and close your database">File</button>';

async function openObject(kind,name,view){
  if(!S.db)return null;
  var cur=activeDoc();if(cur&&!flushDoc(cur))return null;
  var obj={table:AX.getTable,query:AX.getQuery,form:AX.getForm,report:AX.getReport}[kind](S.db,name);
  if(!obj){toast("Can't find '"+name+"'.",'warn');return null;}
  name=obj.name;
  var ex=S.docs.find(function(d){return d.kind===kind&&lc(d.name)===lc(name);});
  if(ex){S.active=ex.id;if(view&&ex.view!==view){await setView(ex,view);}else changed();return ex;}
  var d={id:uid('doc'),kind:kind,name:name};
  if(kind==='table'){d.view=view||'datasheet';d.ds=DS.newState();if(d.view==='design')TD.init(d);}
  else if(kind==='query'){d.q=AX.clone(obj);d.view=view||'datasheet';d.ds=DS.newState();
    if(d.view==='datasheet'||d.view==='sql'){var ok=await QD.execute(d);if(!ok)return null;}}
  else if(kind==='form'){d.view='form';FRM.init(d);}
  else if(kind==='report'){d.view=view||'report';if(d.view==='design'){d.view='layout';}}
  S.docs.push(d);S.active=d.id;
  var ct=ctxTabs();if(ct.length&&!(kind==='table'&&d.view==='datasheet'))S.tab=ct[0][0];
  logEv('open',{kind:kind,name:name,view:d.view});
  if(kind==='report'&&(d.view==='preview'||d.view==='report'))logEv('reportView',{name:name,view:d.view});
  S.navSel={kind:kind,name:name};
  changed();blip('click');
  return d;
}
function addDoc(d){S.docs.push(d);S.active=d.id;var ct=ctxTabs();if(ct.length)S.tab=ct[0][0];changed();return d;}
async function setView(d,v){
  if(!d||d.view===v)return;
  if(d.kind==='form'&&v!=='form'){notCSEC(VIEWNAME[v]+' for forms','Form View');return;}
  if(d.kind==='report'&&v==='design'){notCSEC('Report Design View','Layout View (to edit the title) or Print Preview');return;}
  if(!flushDoc(d))return;
  if(d.kind==='table'){
    if(v==='design'){TD.init(d);d.view='design';}
    else{
      if(d.view==='design'&&(d.dirty||d.isNew)){
        var a=await msgBox('You must save the table first.\n\nDo you want to save the table now?',{icon:'q',buttons:['Yes','No']});
        if(a!=='Yes')return;var ok=await TD.save(d);if(!ok)return;
      }
      d.view='datasheet';d.ds=d.ds||DS.newState();
    }
  }else if(d.kind==='query'){
    if(v==='datasheet'){var ok2=await QD.execute(d);if(!ok2)return;d.view='datasheet';}
    else if(v==='sql'){d.view='sql';}
    else d.view='design';
  }else if(d.kind==='report'){d.view=v;if(v==='preview'||v==='report')logEv('reportView',{name:d.name,view:v});}
  logEv('view',{kind:d.kind,name:d.name,view:d.view});
  var ct=ctxTabs();if(ct.length&&!(d.kind==='table'&&d.view==='datasheet'))S.tab=ct[0][0];else if(!ct.length||(S.tab!=='home'&&!visibleTabs().some(function(t){return t[0]===S.tab;})))S.tab='home';
  changed();
}
async function closeDoc(d,opts){
  if(!d)return true;opts=opts||{};
  if(!opts.force&&!flushDoc(d))return false;
  if(!opts.force){
    var what={table:'table',query:'query',form:'form',report:'report'}[d.kind];
    var nm=d.name||d.temp;
    var needs=(d.kind==='table'&&d.view==='design'&&(d.dirty||d.isNew))||(d.kind==='query'&&(d.dirty||!d.name))||((d.kind==='form'||d.kind==='report')&&(d.unsaved||d.dirty))||(d.kind==='table'&&d.tempTable);
    if(needs){
      var a=await msgBox("Do you want to save changes to the design of "+what+" '"+nm+"'?",{icon:'warn',buttons:['Yes','No','Cancel']});
      if(a==='Cancel'||a==null)return false;
      if(a==='Yes'){var ok=await saveDoc(d);if(!ok)return false;}
      else if(d.kind==='table'&&d.tempTable){AX.deleteObject(S.db,'table',d.name,true);}
    }
  }
  var i=S.docs.indexOf(d);if(i>=0)S.docs.splice(i,1);
  if(S.active===d.id){var n=S.docs[Math.min(i,S.docs.length-1)];S.active=n?n.id:null;}
  logEv('close',{kind:d.kind,name:d.name});
  if(!visibleTabs().some(function(t){return t[0]===S.tab;}))S.tab='home';
  changed();return true;
}
async function saveDoc(d){
  d=d||activeDoc();if(!d){toast('Nothing to save — open an object first.');return false;}
  if(!flushDoc(d))return false;
  if(d.kind==='table'){
    if(d.view==='design')return await TD.save(d);
    if(d.tempTable){var nm=await inputBox('Save As','Table Name:',d.name);if(!nm)return false;nm=nm.trim();
      try{if(lc(nm)!==lc(d.name))AX.renameObject(S.db,'table',d.name,nm);}catch(e){showErr(e);return false;}
      var t=AX.getTable(S.db,nm);delete t.unsaved;d.name=nm;d.tempTable=false;logEv('tableSaved',{name:nm});changed();toast("Table '"+nm+"' saved.",'good');return true;}
    toast('Records are saved automatically when you move to another record.');return true;
  }
  if(d.kind==='query')return await QD.save(d);
  if(d.kind==='form')return await FRM.save(d);
  if(d.kind==='report')return await RPT.save(d);
  return true;
}

async function bsAction(p){
  if(p==='save'){S.bs=null;if(activeDoc())await saveDoc(activeDoc());else{flushAll();toast('Database saved.','good');}if(GAME.saveSandbox)GAME.saveSandbox(true);changed();return;}
  if(p==='print'){var d=activeDoc();S.bs=null;if(d&&d.kind==='report'){setView(d,'preview');}else if(d&&/^(form|table|query)$/.test(d.kind)){changed();ssSaveCopy('pdf');}else{changed();toast('Open a report first, then use Print Preview.','warn');}return;}
  if(p==='close'){S.bs=null;await closeDatabase();S.bs='home';changed();return;}
  S.bs=p;changed();
}
async function closeDatabase(){
  for(var i=S.docs.length-1;i>=0;i--){var ok=await closeDoc(S.docs[i]);if(!ok)return false;}
  if(GAME.saveSandbox)GAME.saveSandbox(true);
  S.db=null;S.navSel=null;logEv('closeDb',{});changed();return true;
}
async function loadDatabase(db,o){
  o=o||{};
  if(S.db&&!o.force){var ok=await closeDatabase();if(!ok)return false;}
  S.db=db;S.docs=[];S.active=null;S.navSel=null;S.bs=null;S.tab='home';
  logEv('openDb',{name:db.name});changed();return true;
}

/* ---------- search (Tell me) ---------- */
function runSearch(q){
  var box=$('#accsearchres');if(!box)return;q=lc(q).trim();
  if(!q){box.hidden=true;box.innerHTML='';return;}
  var seen={},hits=[];
  Object.keys(CMD).forEach(function(id){var c=CMD[id];if(lc(c.l).indexOf(q)>=0&&!seen[c.l]){seen[c.l]=1;hits.push(id);}});
  hits=hits.slice(0,8);
  box.hidden=false;
  box.innerHTML=hits.length?hits.map(function(id){var c=CMD[id];var en=c.en?c.en():true;return '<button type="button" data-act="searchrun" data-cmdid="'+id+'"'+(en?'':' style="color:#999"')+'>'+ic(cmdIcon(c),16)+esc(c.l)+' <small style="color:#888;margin-left:auto">'+esc((visibleTabs().concat([['tfields','Table Fields'],['tdesign','Table Design'],['qdesign','Query Design'],['reldesign','Relationship Design'],['preview','Print Preview'],['rlayout','Report Layout Design']]).find(function(t){return t[0]===tabOf(id);})||['',''])[1])+'</small></button>';}).join(''):'<div style="padding:8px 10px;color:#666">No commands match.</div>';
}
function runCmd(id,el){
  var c=CMD[id];if(!c)return;if(c.en&&!c.en()){toast((c.l)+' isn\'t available right now.','warn');return;}
  blip('click');
  if(c.run){c.run();logEv('cmd',{id:id});}
  else if(c.menu){var items=c.menu();if(items.length)menuAt(el||document.body,items);}
}

function installEvents(){
  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-act]');if(!el)return;
    if(el.closest('.dlg-back')&&!el.closest('.dlg-back').contains(el))return;
    var f=ACT[el.dataset.act];if(f){f(el,ev);}
  });
  document.addEventListener('dblclick',function(ev){var el=ev.target.closest('[data-dbl]');if(!el)return;var f=DBL[el.dataset.dbl];if(f){ev.preventDefault();f(el,ev);}});
  document.addEventListener('contextmenu',function(ev){var el=ev.target.closest('[data-ctx]');if(!el)return;var f=CTX[el.dataset.ctx];if(f){ev.preventDefault();f(el,ev);}});
  document.addEventListener('input',function(ev){var el=ev.target.closest('[data-in]');if(!el)return;var f=IN[el.dataset.in];if(f)f(el,ev,'input');});
  document.addEventListener('change',function(ev){var el=ev.target.closest('[data-in]');if(!el)return;var f=IN[el.dataset.in];if(f)f(el,ev,'change');});
  document.addEventListener('pointerdown',function(ev){var el=ev.target.closest('[data-drag]');if(!el||ev.button!==0)return;var f=DRAG[el.dataset.drag];if(f)f(el,ev);});
  document.addEventListener('focusout',function(ev){var el=ev.target.closest&&ev.target.closest('[data-blur]');if(!el)return;var f=IN[el.dataset.blur];if(f)f(el,ev,'blur');});
  document.addEventListener('keydown',function(ev){
    var el=ev.target.closest&&ev.target.closest('[data-key]');
    if(el&&KEY[el.dataset.key]){KEY[el.dataset.key](el,ev);if(ev.defaultPrevented)return;}
    globalKeys(ev);
  });
}
function inAccess(){return S.mode!=='start'&&!$('#game').hidden;}
function globalKeys(ev){
  if(!inAccess()||DLG.length||document.querySelector('.ss-back'))return;
  var k=ev.key,ctrl=ev.ctrlKey||ev.metaKey;
  if(k==='Escape'){if(MENU){closeMenu();return;}if(S.bs&&S.db){S.bs=null;changed();return;}if(typeof hideShowMe==='function')hideShowMe();return;}
  if(ctrl&&(k==='s'||k==='S')){ev.preventDefault();saveDoc();return;}
  if(ctrl&&(k==='f'||k==='F')){ev.preventDefault();if(curDS())FIND.open(false);return;}
  if(ctrl&&(k==='h'||k==='H')){ev.preventDefault();if(curDS())FIND.open(true);return;}
  if(ctrl&&(k==='w'||k==='W'||k==='F4')){ev.preventDefault();closeDoc(activeDoc());return;}
  if(ctrl&&(k==='p'||k==='P')){ev.preventDefault();var d=activeDoc();if(d&&d.kind==='report')RPT.print(d);else toast('Open a report in Print Preview to print.');return;}
  if(k==='F11'){ev.preventDefault();S.navOpen=!S.navOpen;renderNav();return;}
  if(k==='F1'){ev.preventDefault();GAME.showQuickRef();return;}
  if(ctrl&&(k==='+'||k==='='||(k==='+'&&ev.shiftKey))){ev.preventDefault();runCmd('home.newrec');return;}
  if(ctrl&&k==='-'){ev.preventDefault();runCmd('home.delrec');return;}
  if(k==='F6'){var d2=activeDoc();if(d2&&d2.kind==='table'&&d2.view==='design'){ev.preventDefault();TD.switchPane(d2);}return;}
}

/* ===== Access Lab · datasheets, find, table design ===== */
function fieldWidth(f){var n=String(f.name||'').length*7.4+34,t={'Short Text':Math.min(220,Math.max(90,(+f.size||50)*5.2)),'Long Text':220,'Number':80,'Currency':90,'Date/Time':96,'Yes/No':64,'AutoNumber':84}[f.type]||110;return Math.round(Math.max(64,Math.min(260,Math.max(n,t))));}
function isNumType(t){return t==='Number'||t==='Currency'||t==='AutoNumber';}
var DS={
  newState:function(){return {sort:[],filters:[],filterOn:false,rid:null,c:0,pend:null,pendRid:null,totals:false,tfn:{},selRow:false,colSel:false,wantFocus:false};},
  st:function(d,k){if(k==='sub'){d.subDs=d.subDs||DS.newState();return d.subDs;}d.ds=d.ds||DS.newState();return d.ds;},
  model:function(d,k){
    var s=DS.st(d,k);
    if(k==='sub')return FRM.subModel(d);
    if(d.kind==='table'){var t=AX.getTable(S.db,d.name);if(!t)return null;
      return {fields:t.fields,base:t.rows,rows:AX.viewRows(t.rows,t.fields,s),editable:true,canAdd:true,table:t.name,total:t.rows.length,addCol:true};}
    if(d.kind==='query'&&d.result){var res=d.result;
      var base=res.rows.map(function(a,i){var o={_rid:i};res.columns.forEach(function(c,j){o[c.name]=a[j];});return o;});
      return {fields:res.columns,base:base,rows:AX.viewRows(base,res.columns,s),editable:false,canAdd:false,total:base.length,query:true};}
    return null;
  },
  curIndex:function(m,s){if(s.rid==='new')return m.rows.length;return m.rows.findIndex(function(r){return r._rid===s.rid;});},
  render:function(d,host,k){
    k=k||'main';var m=DS.model(d,k),s=DS.st(d,k);
    if(!m){host.innerHTML='<div class="dempty">This object could not be found.</div>';return;}
    var had=host.contains(document.activeElement)&&document.activeElement.classList.contains('ci');
    if(s.rid!=='new'&&!m.rows.some(function(r){return r._rid===s.rid;}))s.rid=m.rows.length?m.rows[0]._rid:(m.canAdd?'new':null);
    if(s.rid==='new'&&!m.canAdd)s.rid=m.rows.length?m.rows[0]._rid:null;
    if(s.c>=m.fields.length)s.c=0;
    var ri=DS.curIndex(m,s),fs=m.fields;
    var sortMap={};s.sort.forEach(function(x){sortMap[lc(x.field)]=x.dir;});
    var fltMap={};if(s.filterOn)s.filters.forEach(function(x){fltMap[lc(x.field)]=1;});
    var h='<div class="ds" data-dsk="'+k+'"><div class="ds-scroll"><table class="dsg" role="grid" aria-label="'+esc(d.name||'Datasheet')+' datasheet" aria-rowcount="'+(m.rows.length+1)+'"><colgroup><col style="width:20px">'+fs.map(function(f){return '<col style="width:'+fieldWidth(f)+'px">';}).join('')+(m.addCol&&k==='main'?'<col style="width:110px">':'')+'</colgroup><thead><tr><th class="rs" aria-label="Record selectors"></th>';
    fs.forEach(function(f,c){
      var sd=sortMap[lc(f.name)],fl=fltMap[lc(f.name)];
      h+='<th scope="col" class="'+(s.colSel&&s.c===c?'csel':'')+'" data-act="dshead" data-dbl="dsrename" data-ctx="dsheadctx" data-dsk="'+k+'" data-c="'+c+'" title="'+esc(f.description||f.caption||f.name)+'"><div class="hcell"><span class="hname">'+esc(f.caption||f.name)+'</span>'+(sd?'<span class="hsort" aria-label="sorted '+(sd==='asc'?'ascending':'descending')+'">'+(sd==='asc'?'▲':'▼')+'</span>':'')+(fl?'<span class="hsort" aria-label="filtered">'+ic('toggle',11)+'</span>':'')+'<button type="button" class="cm" data-act="dscolmenu" data-dsk="'+k+'" data-c="'+c+'" aria-label="Sort and filter options for '+esc(f.name)+'" title="Sort and filter options">▼</button></div></th>';
    });
    if(m.addCol&&k==='main')h+='<th class="addcol" data-act="dsaddcol" title="Click to Add a new field" role="button" tabindex="0" data-key="enterclick">Click to Add ▾</th>';
    h+='</tr></thead><tbody>';
    var pend=s.pend||{};
    function cellHTML(row,rid,c,f,isCur,isNew){
      var inPend=s.pendRid===rid&&(f.name in pend),v=row?row[f.name]:null;
      var cls=(isNumType(f.type)?'num':'');
      if(f.type==='Yes/No'){var chk=inPend?!!pend[f.name]:(isNew?(f.defaultValue&&/yes|true|-1/i.test(f.defaultValue)):!!v);
        return '<td class="ync '+(isCur?'cc':'')+'" data-act="dscell" data-dsk="'+k+'" data-rid="'+rid+'" data-c="'+c+'"><input type="checkbox" '+(isCur?'class="ci" data-key="dscell" data-dsk="'+k+'"':'tabindex="-1"')+' data-in="dschk" data-dsk="'+k+'" data-rid="'+rid+'" data-c="'+c+'" aria-label="'+esc(f.name)+'"'+(chk?' checked':'')+(m.editable?'':' disabled')+'></td>';}
      var disp=inPend?pend[f.name]:(isNew?(f.type==='AutoNumber'?'(New)':''):AX.display(v,f));
      if(isNew&&!inPend&&f.type!=='AutoNumber'&&f.defaultValue){var dv=AX.defaultFor(f);if(dv!=null)disp=AX.display(dv,f);}
      if(isCur){
        var ro=!m.editable||f.type==='AutoNumber';
        var max=f.type==='Short Text'?' maxlength="'+(+f.size||255)+'"':'';
        var ph=f.inputMask&&!ro?' placeholder="'+esc(AX.maskPlaceholder(f.inputMask))+'"':'';
        return '<td class="cc '+cls+'" data-act="dscell" data-dsk="'+k+'" data-rid="'+rid+'" data-c="'+c+'"><input type="text" class="ci" data-in="dscell" data-key="dscell" data-dsk="'+k+'" value="'+esc(disp)+'"'+max+ph+(ro?' readonly':'')+' aria-label="'+esc(f.name)+', record '+(ri+1)+'" autocomplete="off" spellcheck="false"></td>';
      }
      return '<td class="'+cls+'" data-act="dscell" data-dsk="'+k+'" data-rid="'+rid+'" data-c="'+c+'">'+esc(disp)+'</td>';
    }
    m.rows.forEach(function(r,i){
      var cur=r._rid===s.rid,ed=cur&&s.pend&&s.pendRid===r._rid;
      h+='<tr class="'+(cur?'cur':'')+(cur&&s.selRow?' rsel':'')+'" data-rid="'+r._rid+'"><td class="rs" data-act="dsrs" data-dsk="'+k+'" data-rid="'+r._rid+'" aria-label="Select record '+(i+1)+'">'+(ed?'✎':cur?'▶':'')+'</td>';
      fs.forEach(function(f,c){h+=cellHTML(r,r._rid,c,f,cur&&s.c===c,false);});
      if(m.addCol&&k==='main')h+='<td></td>';h+='</tr>';
    });
    if(m.canAdd){var curN=s.rid==='new',edN=curN&&s.pend&&s.pendRid==='new';
      h+='<tr class="newrow'+(curN?' cur':'')+'" data-rid="new"><td class="rs" data-act="dsrs" data-dsk="'+k+'" data-rid="new" aria-label="New record">'+(edN?'✎':'✱')+'</td>';
      fs.forEach(function(f,c){h+=cellHTML(null,'new',c,f,curN&&s.c===c,true);});if(m.addCol&&k==='main')h+='<td></td>';h+='</tr>';}
    if(s.totals){
      h+='<tr class="tot"><td class="rs">Σ</td>';
      fs.forEach(function(f,c){var fn=s.tfn[lc(f.name)]||'None';var opts=(isNumType(f.type)&&f.type!=='AutoNumber'?['None','Sum','Average','Count','Maximum','Minimum']:['None','Count','Maximum','Minimum']);
        if(c===0&&fn==='None'&&!isNumType(f.type)){}

KEY.dscell=function(el,ev){
  var d=dsDoc(),k=el.dataset.dsk,s=DS.st(d,k),m=DS.model(d,k);
  var key=ev.key,ctrl=ev.ctrlKey||ev.metaKey;

  if(key==='Enter'&&ev.shiftKey){ev.preventDefault();if(DS.commitAll(d,k)){s.wantFocus=true;changed();toast('Record saved.');}return;}
  if(key==='Enter'){ev.preventDefault();DS.step(d,k,0,1);return;}

  if(key==='ArrowUp'){ev.preventDefault();DS.step(d,k,-1,0);return;}

  if(key==='PageUp'||(ctrl&&key==='Home')){ev.preventDefault();DS.nav(d,k,'first');return;}

  if(key==='ArrowLeft'&&el.type==='text'&&el.selectionStart===0&&el.selectionEnd===0){ev.preventDefault();DS.step(d,k,0,-1);return;}

  if(key==='ArrowLeft'&&el.type==='checkbox'){ev.preventDefault();DS.step(d,k,0,-1);return;}
  if(key==='Escape'){ev.preventDefault();ev.stopPropagation();if(s.pend)DS.cancel(d,k);return;}

  if(ctrl&&key==="'"&&m.editable&&!el.readOnly){ev.preventDefault();var o=DS.order(m),i=o.indexOf(s.rid);var prev=i>0?m.rows[i-1]:null;if(prev){var f=m.fields[s.c];el.value=AX.display(prev[f.name],f);DS.pendSet(d,k,el.value);}return;}

var FIND={
  last:{what:'',with:'',look:'doc',match:'any',caseS:false},
  open:function(rep){
    var c=curDS();if(!c||c.k==='form'){toast('Open a datasheet first.','warn');return;}
    var L=FIND.last;
    dialog({title:'Find and Replace',width:520,body:'<div class="ptabs" style="padding:0 0 8px"><button type="button" class="'+(rep?'':'on')+'" data-ftab="find">Find</button><button type="button" class="'+(rep?'on':'')+'" data-ftab="rep">Replace</button></div>'+
      '<div class="frmrow"><label for="fwhat">Find What:</label><input type="text" id="fwhat" value="'+esc(L.what)+'" autofocus></div><div class="frmrow" id="frow"'+(rep?'':' hidden')+'><label for="fwith">Replace With:</label><input type="text" id="fwith" value="'+esc(L.with)+'"></div>'+
      '<div class="frmrow"><label for="flook">Look In:</label><select id="flook"><option value="field">Current field</option><option value="doc"'+(L.look==='doc'?' selected':'')+'>Current document</option></select></div>'+
      '<div class="frmrow"><label for="fmatch">Match:</label><select id="fmatch"><option value="any">Any Part of Field</option><option value="whole"'+(L.match==='whole'?' selected':'')+'>Whole Field</option><option value="start"'+(L.match==='start'?' selected':'')+'>Start of Field</option></select></div>'+
      '<div class="frmrow"><label for="fsearch">Search:</label><select id="fsearch"><option>All</option><option>Down</option><option>Up</option></select></div><label class="chk"><input type="checkbox" id="fcase"'+(L.caseS?' checked':'')+'> Match Case</label>',
      buttons:[{label:'Find Next',def:true,click:function(b){FIND.read(b);FIND.next();return false;}},{label:'Replace',id:'frepbtn',click:function(b){FIND.read(b);FIND.replace(false);return false;}},{label:'Replace All',id:'frepall',click:function(b){FIND.read(b);FIND.replace(true);return false;}},{label:'Cancel',value:null}],
      onOpen:function(b){var set=function(r){$$('[data-ftab]',b).forEach(function(x){x.classList.toggle('on',(x.dataset.ftab==='rep')===r);});b.querySelector('#frow').hidden=!r;b.querySelector('#frepbtn').hidden=!r;b.querySelector('#frepall').hidden=!r;};set(!!rep);
        b.addEventListener('click',function(ev){var t=ev.target.closest('[data-ftab]');if(t)set(t.dataset.ftab==='rep');});}});
  },
  read:function(b){FIND.last={what:b.querySelector('#fwhat').value,with:b.querySelector('#fwith').value,look:b.querySelector('#flook').value,match:b.querySelector('#fmatch').value,caseS:b.querySelector('#fcase').checked};},
  hit:function(text){var L=FIND.last,a=L.caseS?String(text):lc(text),w=L.caseS?L.what:lc(L.what);if(!w)return false;if(L.match==='whole')return a===w;if(L.match==='start')return a.indexOf(w)===0;return a.indexOf(w)>=0;},
  next:function(){
    var c=curDS();if(!c)return;var d=c.d,k=c.k,m=DS.model(d,k),s=DS.st(d,k);if(!FIND.last.what)return;
    var cols=FIND.last.look==='field'?[s.c]:m.fields.map(function(_,i){return i;});
    var pos=[];m.rows.forEach(function(r,i){cols.forEach(function(cc){pos.push([i,cc]);});});
    var ci=DS.curIndex(m,s),cur=pos.findIndex(function(p){return p[0]===ci&&p[1]===s.c;});
    for(var st=1;st<=pos.length;st++){var p=pos[(cur+st+pos.length)%pos.length];var f=m.fields[p[1]];
      if(FIND.hit(AX.display(m.rows[p[0]][f.name],f))){if(DS.commitAll(d,k)){s.rid=m.rows[p[0]]._rid;s.c=p[1];logEv('find',{obj:d.name,what:FIND.last.what});changed();}return true;}}
    msgBox('Microsoft Access finished searching the records. The search item was not found.',{icon:'info'});return false;
  },

    if(!DS.commitAll(d,k))return;
    var swap=function(text){if(L.match!=='any')return L.with;var re=new RegExp(L.what.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),L.caseS?'g':'gi');return String(text).replace(re,L.with);};
    var cols=L.look==='field'?[s.c]:m.fields.map(function(_,i){return i;});
    if(!all){var row=DS.curRow(d,k),f=m.fields[s.c];if(row&&FIND.hit(AX.display(row[f.name],f))){try{var ch={};ch[f.name]=swap(AX.display(row[f.name],f));AX.updateRow(S.db,m.table,row._rid,ch);logEv('replace',{obj:d.name});}catch(e){showErr(e);return;}}FIND.next();return;}
    var a=await msgBox("You won't be able to undo this Replace operation.\n\nDo you want to continue?",{icon:'warn',buttons:['Yes','No']});if(a!=='Yes')return;
    var count=0,errs=0;m.rows.slice().forEach(function(r){cols.forEach(function(ci){var f=m.fields[ci];if(f.type==='AutoNumber')return;var t=AX.display(r[f.name],f);if(FIND.hit(t)){try{var ch={};ch[f.name]=swap(t);AX.updateRow(S.db,m.table,r._rid,ch);count++;}catch(e){errs++;}}});});
    logEv('replace',{obj:d.name,count:count});changed();msgBox(count+' replacement(s) made.'+(errs?'\n'+errs+' value(s) could not be replaced because they would break a rule.':''),{icon:'info'});
  }

function drawLines(canvas,links){
  var svg=canvas.querySelector('svg.lines');if(!svg)return;
  var cr=canvas.getBoundingClientRect(),sl=canvas.scrollLeft,st=canvas.scrollTop;
  svg.setAttribute('width',canvas.scrollWidth);svg.setAttribute('height',canvas.scrollHeight);
  var h='';
  links.forEach(function(L){
    var ba=canvas.querySelector('.flbox[data-box="'+CSS.escape(L.a)+'"]'),bb=canvas.querySelector('.flbox[data-box="'+CSS.escape(L.b)+'"]');if(!ba||!bb)return;
    var fa=ba.querySelector('li[data-f="'+CSS.escape(L.af)+'"]'),fb=bb.querySelector('li[data-f="'+CSS.escape(L.bf)+'"]');
    var ra=ba.getBoundingClientRect(),rb=bb.getBoundingClientRect();
    var ya=fa?fa.getBoundingClientRect():ra,yb=fb?fb.getBoundingClientRect():rb;
    var ul1=ba.querySelector('ul').getBoundingClientRect(),ul2=bb.querySelector('ul').getBoundingClientRect();
    var y1=Math.max(ul1.top+6,Math.min(ul1.bottom-6,ya.top+ya.height/2))-cr.top+st,y2=Math.max(ul2.top+6,Math.min(ul2.bottom-6,yb.top+yb.height/2))-cr.top+st;
    var x1,x2,d1,d2;
    if(ra.right<=rb.left){x1=ra.right;x2=rb.left;d1=1;d2=-1;}else if(rb.right<=ra.left){x1=ra.left;x2=rb.right;d1=-1;d2=1;}else{x1=ra.right;x2=rb.right;d1=1;d2=1;}
    x1=x1-cr.left+sl;x2=x2-cr.left+sl;
    var p='M'+x1+' '+y1+' h'+(14*d1)+' L'+(x2+14*d2)+' '+y2+' H'+x2;
    var col=L.sel?'#A4373A':'#333',w=L.enforce?2:1.3;
    h+='<path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="'+(L.sel?w+1:w)+'"/>';
    if(L.oneMany){h+='<text class="rellbl" x="'+(x1+(d1>0?3:-10))+'" y="'+(y1-4)+'">1</text><text class="rellbl" x="'+(x2+(d2>0?3:-13))+'" y="'+(y2-3)+'" style="font-size:15px">'+(L.oneOne?'1':'∞')+'</text>';}
    if(L.arrow)h+='<path d="M'+(x2+6*d2)+' '+(y2-4)+' L'+x2+' '+y2+' L'+(x2+6*d2)+' '+(y2+4)+'" fill="none" stroke="'+col+'"/>';
    h+='<path class="hit" d="'+p+'" fill="none" stroke="transparent" stroke-width="12" data-act="'+L.act+'" data-dbl="'+L.act+'dbl" data-ctx="'+L.act+'ctx" data-id="'+esc(L.id)+'"><title>'+esc(L.title||'')+'</title></path>';
  });
  svg.innerHTML=h;
}
function startDrag(ev,label,onMove,onDrop){
  ev.preventDefault();var sx=ev.clientX,sy=ev.clientY,moved=false,ghost=null,last=null;
  function mv(e){if(!moved&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<5)return;moved=true;
    if(label){if(!ghost){ghost=document.createElement('div');ghost.className='dragghost';ghost.textContent=label;document.body.appendChild(ghost);}ghost.style.left=(e.clientX+10)+'px';ghost.style.top=(e.clientY+8)+'px';
      var t=document.elementFromPoint(e.clientX,e.clientY);if(last)last.classList.remove('dropok');last=t&&(t.closest('li[data-f]')||t.closest('[data-qcol]'));if(last)last.classList.add('dropok');}
    if(onMove)onMove(e,e.clientX-sx,e.clientY-sy);}
  function up(e){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(ghost)ghost.remove();if(last)last.classList.remove('dropok');if(!moved)return;var t=document.elementFromPoint(e.clientX,e.clientY);var sup=function(ce){ce.stopPropagation();ce.preventDefault();};document.addEventListener('click',sup,true);setTimeout(function(){document.removeEventListener('click',sup,true);onDrop(t,e);},30);}
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
}

  flush:function(d){

function ssCur(t){

async function ssResult(o){
  flushAll();
  if(o.kind==='table'){var t=AX.getTable(S.db,o.name);return t?AX.tableAsResult(t):null;}
  if(o.kind==='query'){
    if(o.d&&o.d.result)return o.d.result;
    var q=o.d&&o.d.q?o.d.q:AX.getQuery(S.db,o.name);if(!q)return null;

/* one worksheet from a table, query or report result: field names in bold on row 1, then the records */
function ssSheet(name,res){
  var rows=[res.columns.map(function(c){return c.caption||c.name;})];
  res.rows.forEach(function(r){rows.push(res.columns.map(function(c,i){var v=r[i];if(v==null||v==='')return null;
    if(c.type==='Yes/No')return !!v;
    if(c.type==='Date/Time')return AX.display(v,{type:'Date/Time',format:c.format||'Short Date'});
    if(typeof v==='number')return c.type==='Currency'?{v:v,money:true}:v;
    return String(v);}));});
  return {name:name,rows:rows,freezeHeader:true};
}
function ssBook(sheets){var seen={};sheets.forEach(function(s){var n=String(s.name||'Sheet').replace(/[\\\/?*\[\]:]/g,' ').slice(0,31),k=n,i=2;while(seen[k.toLowerCase()]){k=n.slice(0,28)+' '+(i++);}seen[k.toLowerCase()]=1;s.name=k;});return SimSave.xlsx(sheets,{numbers:false});}
function ssDbBook(){

function ssFormHTML(o,all){

  view:function(kind,name,v){var d=G.doc(kind,name);return (!!d&&d.view===v)||G.ev('open',function(e){return e.kind===kind&&lc(e.name)===lc(name)&&e.view===v;})||G.ev('view',function(e){return e.kind===kind&&lc(e.name)===lc(name)&&e.view===v;});},
  ev:function(type,pred){return S.events.some(function(e){return e.type===type&&(!pred||pred(e));});},
  ds:function(kind,name){var d=G.doc(kind,name);return d&&d.ds?d.ds:null;},
  /* a field definition from the saved table or any open design (including an unsaved new table) */
  fdef:function(t,f){
    var out=null;S.docs.forEach(function(d){if(d.kind==='table'&&d.view==='design'&&d.draft&&(lc(d.name)===lc(t)||(d.isNew&&!d.name))){var x=d.draft.fields.find(function(y){return y&&lc(y.name)===lc(f);});if(x&&!out)out={f:x,pk:d.draft.pk};}});
    if(out)return out;var tb=G.T(t),fx=AX.getField(tb,f);return fx?{f:fx,pk:tb.pk}:null;
  },
  saved:function(t,f){var tb=G.T(t),fx=AX.getField(tb,f);return fx||null;},
  typeIs:function(t,f,type,o){var x=o&&o.saved?G.saved(t,f):(G.fdef(t,f)||{}).f;return !!x&&x.type===type;},
  pkIs:function(t,keys,o){var tb=G.T(t),pk=null;
    if(!(o&&o.saved))S.docs.forEach(function(d){if(d.kind==='table'&&d.view==='design'&&d.draft&&lc(d.name)===lc(t))pk=d.draft.pk;});
    if(!pk&&tb)pk=tb.pk;if(!pk)return false;return pk.length===keys.length&&keys.every(function(k){return pk.some(function(p){return lc(p)===lc(k);});});},
  ruleOK:function(rule,good,bad){if(!rule||!String(rule).trim())return false;try{var a=AX.parse(rule,'crit');var t=function(v){var r=AX.evalAst(a,{subj:v,get:function(){throw new Error('x');}});return r===true||(typeof r==='number'&&r!==0);};return good.every(t)&&bad.every(function(v){return !t(v);});}catch(e){return false;}},
  rel:function(pt,pf,ct,cf){return S.db.rels.find(function(r){return lc(r.pt)===lc(pt)&&lc(r.pf)===lc(pf)&&lc(r.ct)===lc(ct)&&lc(r.cf)===lc(cf);})||null;},
  relOK:function(pt,pf,ct,cf){var r=G.rel(pt,pf,ct,cf);return !!r&&r.enforce&&r.type==='One-To-Many';},
  qCands:function(){var out=S.db.queries.slice();S.docs.forEach(function(d){if(d.kind==='query'&&d.q)out.push(d.q);});return out;},
  run:function(q,p){if(!q)return null;try{var need=AX.queryParams(S.db,q),pp={};need.forEach(function(n){pp[n]=p!==undefined?p:'';});return AX.runQuery(S.db,q,pp);}catch(e){return null;}},
  keys:function(res,table,field){if(!res)return null;return res.recs.map(function(rec){var k=Object.keys(rec).find(function(x){return lc(x)===lc(table);});var row=k?rec[k]:null;return row?row[field]:undefined;});},
  setEq:function(a,b){if(!a||!b)return false;var A=a.map(function(x){return lc(x);}).sort(),B=b.map(function(x){return lc(x);}).sort();return A.length===B.length&&A.every(function(x,i){return x===B[i];});},

};

  st('Add athlete <b>Joel Campbell</b>, M, age <b>15</b>, school <b>HRH</b>.',function(){return G.rows('Athletes').some(function(r){return lc(r.FirstName)==='joel'&&lc(r.LastName)==='campbell'&&r.Age===15&&lc(r.SchoolCode)==='hrh';});},{h1:'Press Esc first if a bad value is still in a cell.',h2:'Use the ✱ new row. SchoolCode must match a school (HRH).',show:'cmd:home.newrec'})]},
{id:'L2-02',level:2,title:'Smarter fields',obj:'S6 SO3 · input mask, default value, required',db:'library',

 steps:[st('Open <b>Members</b> in Design View.',function(){return G.view('table','Members','design');},{h2:'Right-click Members ▸ Design View.',show:showFor('table','Members','cmd:home.view')}),
  st('Give <b>Phone</b> the Input Mask <b>000-0000</b>.',function(){var x=G.fdef('Members','Phone');if(!x||!x.f.inputMask)return false;var a=AX.applyMask(x.f.inputMask,'9749931');return a.ok&&a.value==='974-9931'&&!AX.applyMask(x.f.inputMask,'97499').ok;},{h1:'0 means “a digit is required here”.',h2:'Click the Phone row and type 000-0000 in Input Mask.',show:'sel:#tdprops [data-p="inputMask"]'}),
  st('Set the <b>Default Value</b> of District to <b>"Ocho Rios"</b>.',function(){var x=G.fdef('Members','District');return !!x&&AX.defaultFor(x.f)==='Ocho Rios';},{h1:'A default value is filled in automatically for new records.',h2:'Click the District row and type "Ocho Rios" in Default Value.',show:'sel:#tdprops [data-p="defaultValue"]'}),
  st('Make <b>LastName</b> <b>Required</b>.',function(){var x=G.fdef('Members','LastName');return !!x&&x.f.required===true;},{h1:'Required is near the bottom of the property list.',h2:'Click the LastName row and set Required to Yes.',show:'sel:#tdprops [data-p="required"]'}),

  st('In Datasheet View add <b>Gabriel Rogers</b>, phone typed as <b>9749931</b> — watch the mask and default value work.',function(){return G.rows('Members').some(function(r){return lc(r.FirstName)==='gabriel'&&lc(r.LastName)==='rogers'&&r.Phone==='974-9931'&&r.District==='Ocho Rios';});},{h1:'Leave District as it is — the default fills it in.',h2:'Home ▸ View, then use the ✱ row: Gabriel, Rogers, Tab past District, 9749931…',show:'cmd:home.view'})]},
{id:'L2-03',level:2,title:'Link the tables',obj:'S6 SO2/SO3 · relationships and referential integrity',db:'library',
 prep:function(db){db.rels=[];db.relShown=[];},
 brief:'Someone deleted all the library’s relationships! Loans now records MemberIDs and BookIDs that may not exist. Link the tables again and switch on referential integrity.',
 steps:[st('Open <b>Database Tools ▸ Relationships</b>.',function(){return !!REL.doc();},{h1:'It is on the Database Tools tab.',h2:'Database Tools ▸ Relationships.',show:'cmd:dbt.rel'}),
  st('Add <b>Members</b>, <b>Loans</b> and <b>Books</b> to the window.',function(){var s=S.db.relShown.map(lc);return ['members','loans','books'].every(function(n){return s.indexOf(n)>=0;});},{h1:'Use Show Table / Add Tables.',h2:'Relationship Design ▸ Add Tables, pick each table and click Add.',show:'cmd:rd.add'}),
  st('Drag <b>MemberID</b> from Members onto MemberID in Loans. Tick <b>Enforce Referential Integrity</b> and click Create.',function(){return G.relOK('Members','MemberID','Loans','MemberID');},{h1:'Drag the field name itself, not the table title.',h2:'Drag Members.MemberID onto Loans.MemberID, tick Enforce Referential Integrity, click Create.',show:'sel:#relcanvas .flbox[data-box="Members"] li[data-f="MemberID"]'}),
  st('Do the same for <b>BookID</b>: Books ▸ Loans, with referential integrity.',function(){return G.relOK('Books','BookID','Loans','BookID');},{h1:'The 1 is on the Books side; ∞ (many) is on the Loans side.',h2:'Drag Books.BookID onto Loans.BookID, tick Enforce Referential Integrity, Create.',show:'sel:#relcanvas .flbox[data-box="Books"] li[data-f="BookID"]'}),
  Object.assign(st('',null),quiz('A member can borrow many books and a book can be borrowed by many members. What relationship is there between Members and Books?',['Many-to-many (through the Loans table)','One-to-one','One-to-many from Books to Members','There is no relationship'],0)),
  st('Test it: in Loans, try adding a loan for MemberID <b>99</b> (no such member).',function(){return G.ev('error',function(e){return e.code==='ri'&&lc(e.table)==='loans';});},{h1:'Open Loans and use the new record row.',h2:'Open Loans, type 99 in MemberID and B001 in BookID, then move off the record.',show:'nav:table:Loans'})]},
{id:'L2-04',level:2,title:'Toyotas under $60',obj:'S6 SO4 · query with AND criteria',db:'cars',
 brief:'A family from Anguilla wants a Toyota that costs less than $60 a day. Build a query that finds them.',
 steps:[st('<b>Create ▸ Query Design</b> and add the <b>Cars</b> table.',function(){return S.docs.some(function(d){return d.kind==='query'&&d.q.tables.some(function(t){return lc(t.name)==='cars';});});},{h1:'Query Design opens the Show Table box.',h2:'Create ▸ Query Design, choose Cars, click Add, then Close.',show:'cmd:create.querydesign'}),
  st('Put <b>RegNo, Make, Model</b> and <b>DailyRate</b> in the grid.',function(){return G.anyQ(function(q){var f=q.columns.map(function(c){return lc(String(c.field).replace(/^.*\./,''));});return ['regno','make','model','dailyrate'].every(function(x){return f.indexOf(x)>=0;});});},{h1:'Double-click each field in the Cars box.',h2:'Double-click RegNo, Make, Model and DailyRate.',show:'sel:#qcanvas li[data-f="RegNo"]'}),
  st('Criteria: Make <b>="Toyota"</b> AND DailyRate <b>&lt;60</b> (same Criteria row).',function(){var exp=G.rows('Cars').filter(function(r){return r.Make==='Toyota'&&r.DailyRate<60;}).map(function(r){return r.RegNo;});return G.anyQ(function(q){return G.setEq(G.keys(G.run(q),'Cars','RegNo'),exp);});},{h1:'Conditions on the SAME row are joined with AND.',h2:'Type ="Toyota" under Make and <60 under DailyRate, both on the Criteria row.',show:'sel:#dbody [data-in="qcrit"][data-r="0"]'}),
  st('<b>Run</b> the query (!).',function(){return G.ev('queryRun',function(e){return e.rows===2;});},{h1:'Run is the red exclamation mark.',h2:'Query Design ▸ Run.',show:'cmd:qd.run'}),
  st('Save it as <b>Cheap Toyotas</b>.',function(){var q=G.savedQ('Cheap Toyotas');var exp=G.rows('Cars').filter(function(r){return r.Make==='Toyota'&&r.DailyRate<60;}).map(function(r){return r.RegNo;});return !!q&&G.setEq(G.keys(G.run(q),'Cars','RegNo'),exp);},{h2:'Press Ctrl+S and type Cheap Toyotas.',show:'sel:.qat button'})]},
{id:'L2-05',level:2,title:'Two towns',obj:'S6 SO4 · query with OR criteria',db:'library',
 brief:'The library’s mobile van visits Ocho Rios and Runaway Bay this Saturday. List members from EITHER district, sorted by surname.',
 steps:[st('Create a query on <b>Members</b> showing FirstName, LastName and District.',function(){return G.anyQ(function(q){var f=q.columns.map(function(c){return lc(String(c.field).replace(/^.*\./,''));});return G.usesTables(q,['Members'])&&['firstname','lastname','district'].every(function(x){return f.indexOf(x)>=0;});});},{h1:'Create ▸ Query Design, add Members.',h2:'Double-click FirstName, LastName and District.',show:'cmd:create.querydesign'}),
  st('Find members in <b>Ocho Rios OR Runaway Bay</b>.',function(){var exp=G.rows('Members').filter(function(r){return r.District==='Ocho Rios'||r.District==='Runaway Bay';}).map(function(r){return r.MemberID;});return G.anyQ(function(q){return G.setEq(G.keys(G.run(q),'Members','MemberID'),exp);});},{h1:'Put the second town on the “or” row, or join them with Or in one cell.',h2:'Under District type "Ocho Rios" on Criteria and "Runaway Bay" on the or row.',show:'sel:#dbody [data-in="qcrit"][data-r="1"]'}),
  st('Sort by <b>LastName</b> ascending.',function(){return G.anyQ(function(q){var r=G.run(q);return !!r&&r.rows.length===6&&G.sortedBy(r,'LastName','asc','Short Text')&&q.columns.some(function(c){return /lastname/i.test(c.field)&&c.sort==='Ascending';});});},{h2:'In the LastName column choose Ascending in the Sort row.',show:'sel:#dbody [data-in="qsort"]'}),
  st('Run it and save as <b>Town Members</b>.',function(){var q=G.savedQ('Town Members');var exp=G.rows('Members').filter(function(r){return r.District==='Ocho Rios'||r.District==='Runaway Bay';}).map(function(r){return r.MemberID;});return !!q&&G.setEq(G.keys(G.run(q),'Members','MemberID'),exp);},{h2:'Click Run, then Ctrl+S and type Town Members.',show:'cmd:qd.run'})]},
{id:'L2-06',level:2,title:'What does it cost?',obj:'S6 SO4 · calculated field',db:'cars',
 brief:'Island Car Rentals wants to see the cost of every rental: number of days × daily rate. The cost is not stored — it is calculated in a query.',
 steps:[st('Create a query using <b>Rentals</b> and <b>Cars</b> (they join on RegNo).',function(){return G.anyQ(function(q){return G.usesTables(q,['Rentals','Cars'])&&q.joins.length>0;});},{h1:'Add both tables in the Show Table box.',h2:'Create ▸ Query Design, add Rentals and Cars.',show:'cmd:create.querydesign'}),
  st('Show <b>RentalID</b>, <b>RegNo</b>, <b>Days</b> and <b>DailyRate</b>.',function(){return G.anyQ(function(q){var r=G.run(q);return !!r&&['RentalID','RegNo','Days','DailyRate'].every(function(n){return G.hasCol(r,n);});});},{h2:'Double-click RentalID, RegNo and Days (Rentals) and DailyRate (Cars).'}),
  st('In an empty Field cell type <b>Cost: [Days]*[DailyRate]</b>.',function(){return G.anyQ(function(q){var r=G.run(q);if(!r||!G.hasCol(r,'Cost')||r.rows.length!==G.rows('Rentals').length)return false;var v=G.colVals(r,'Cost'),d=G.keys(r,'Rentals','Days'),p=G.keys(r,'Cars','DailyRate');return v.every(function(x,i){return Math.abs(x-d[i]*p[i])<0.005;});});},{h1:'Name: expression — the name comes before the colon.',h2:'Click the next empty Field cell and type Cost: [Days]*[DailyRate]',show:'sel:#dbody [data-in="qfield"]'}),
  st('Run it and save as <b>Rental Costs</b>.',function(){var q=G.savedQ('Rental Costs');var r=G.run(q);return !!r&&G.hasCol(r,'Cost');},{h2:'Run, then Ctrl+S ▸ Rental Costs.',show:'cmd:qd.run'})]},
{id:'L2-07',level:2,title:'Ask me which district',obj:'S6 SO4 · parameter query',db:'library',
 brief:'Instead of making a new query for every district, make ONE query that asks the user which district to show.',
 steps:[st('Create a query on <b>Members</b> with FirstName, LastName and District.',function(){return G.anyQ(function(q){return G.usesTables(q,['Members'])&&q.columns.some(function(c){return /district/i.test(c.field);});});},{h2:'Create ▸ Query Design ▸ Members.',show:'cmd:create.querydesign'}),
  st('In District’s Criteria type <b>[Enter district:]</b>.',function(){return G.anyQ(function(q){return AX.queryParams(S.db,q).length>=1&&q.columns.some(function(c){return /district/i.test(c.field)&&(c.criteria||[]).some(function(x){return /\[[^\]]+\]/.test(x||'');});});});},{h1:'Square brackets around a prompt that is not a field name make Access ask a question.',h2:'Type [Enter district:] in the Criteria cell under District.',show:'sel:#dbody [data-in="qcrit"][data-r="0"]'}),
  st('Run it and answer <b>Discovery Bay</b>.',function(){return G.ev('queryRun',function(e){return Object.keys(e.params||{}).some(function(k){return lc(e.params[k])==='discovery bay';})&&e.rows===3;});},{h2:'Click Run and type Discovery Bay in the Enter Parameter Value box.',show:'cmd:qd.run'}),
  st('Save it as <b>Members by District</b>.',function(){var q=G.savedQ('Members by District');if(!q)return false;var exp=G.rows('Members').filter(function(r){return r.District==='Discovery Bay';}).map(function(r){return r.MemberID;});return G.setEq(G.keys(G.run(q,'Discovery Bay'),'Members','MemberID'),exp);},{h2:'Ctrl+S ▸ Members by District.',show:'sel:.qat button'})]},
{id:'L2-08',level:2,title:'First-quarter loans',obj:'S6 SO4 · date criteria with Between',db:'library',
 brief:'The library board wants every loan made from 1 January to 31 March 2026, oldest first.',
 steps:[st('Create a query on <b>Loans</b> with LoanID, MemberID, BookID and LoanDate.',function(){return G.anyQ(function(q){var r=G.run(q);return G.usesTables(q,['Loans'])&&!!r&&['LoanID','MemberID','BookID','LoanDate'].every(function(n){return G.hasCol(r,n);});});},{h2:'Create ▸ Query Design ▸ Loans, then double-click the four fields.',show:'cmd:create.querydesign'}),
  st('LoanDate criteria: <b>Between #01/01/2026# And #31/03/2026#</b>.',function(){var exp=G.rows('Loans').filter(function(r){return r.LoanDate>='2026-01-01'&&r.LoanDate<='2026-03-31';}).map(function(r){return r.LoanID;});return G.anyQ(function(q){return G.setEq(G.keys(G.run(q),'Loans','LoanID'),exp);});},{h1:'Dates go between # signs.',h2:'Type Between #01/01/2026# And #31/03/2026# under LoanDate.',show:'sel:#dbody [data-in="qcrit"][data-r="0"]'}),
  st('Sort LoanDate <b>Ascending</b>.',function(){return G.anyQ(function(q){var r=G.run(q);return !!r&&r.rows.length===10&&G.sortedBy(r,'LoanDate','asc','Date/Time');});},{h2:'Choose Ascending in the Sort row under LoanDate.'}),
  st('Run and save as <b>Q1 Loans</b>.',function(){var q=G.savedQ('Q1 Loans');var r=G.run(q);return !!r&&r.rows.length===10;},{h2:'Run, then Ctrl+S ▸ Q1 Loans.',show:'cmd:qd.run'})]},
{id:'L2-09',level:2,title:'Member loans form',obj:'S6 SO3 · forms with a subform',db:'library',
 brief:'At the front desk, volunteers want to see one member at a time with all of that member’s loans underneath.',
 steps:[st('Start <b>Create ▸ Form Wizard</b>.',function(){return G.ev('cmd',function(e){return e.id==='create.formwiz';})||S.db.forms.length>1;},{h2:'Create ▸ Form Wizard.',show:'cmd:create.formwiz'}),
  st('Pick FirstName, LastName, District from <b>Members</b> and BookID, LoanDate, Returned from <b>Loans</b>; view <b>by Members</b>; title it <b>Member Loans</b>.',function(){return G.formSub(G.form('Member Loans'),'Members','Loans','MemberID');},{h1:'Change the Tables/Queries box to pick fields from the second table.',h2:'Choose “by Members” and “Form with subform(s)”, then type Member Loans as the form title.'}),
  st('Use the navigation buttons to show <b>Marlon Clarke</b>.',function(){var d=G.doc('form','Member Loans');if(!d)return false;var r=FRM.curRow(d);return !!r&&r.FirstName==='Marlon';},{h1:'The ▶ button moves one record at a time.',h2:'Marlon is record 7 — click ▶ until he appears, or type 7 in the Record box.',show:'sel:#dbody [data-act="frmnav"][data-w="next"]'}),
  Object.assign(st('',null),quiz('How many loans does Marlon Clarke have? (Look at the subform.)',['1','2','3','4'],1))]},
{id:'L2-10',level:2,title:'Book catalogue report',obj:'S6 SO4 · reports',db:'library',
 brief:'The library needs a printed catalogue of its books, in title order, for the reading tent at the Emancipation Day fair.',
 steps:[st('Start <b>Create ▸ Report Wizard</b> and choose <b>Title, Author, Genre, Price</b> from Books.',function(){return G.ev('cmd',function(e){return e.id==='create.reportwiz';})||S.db.reports.length>1;},{h2:'Create ▸ Report Wizard.',show:'cmd:create.reportwiz'}),
  st('Sort by <b>Title</b> ascending, no grouping, and title the report <b>Library Book Catalogue</b>.',function(){var r=G.report('Library Book Catalogue');return !!r&&G.repSource(r).map(lc).indexOf('books')>=0&&['title','author','genre','price'].every(function(f){return r.fields.map(lc).indexOf(f)>=0;})&&r.sorts.length>0&&lc(r.sorts[0].field)==='title'&&r.sorts[0].dir==='asc';},{h1:'The sort order is chosen on the step after grouping.',h2:'On the sort step choose Title in box 1 (Ascending). Type the title on the last step.'}),
  st('View it in <b>Print Preview</b>.',function(){return G.previewed('Library Book Catalogue');},{h2:'Choose “Preview the report” on the last wizard step.'}),
  Object.assign(st('',null),quiz('Which object would you use to PRINT a neat, formatted list of books?',['A report','A form','A query','A table'],0))]},
{id:'L2-11',level:2,title:'Points per school',obj:'S6 SO4 · totals query (Group By, Sum)',db:'sports',
 brief:'Which school is winning the Sports Meet? Add up the points for each school.',
 steps:[st('Create a query with <b>Schools</b>, <b>Athletes</b> and <b>Results</b>.',function(){return G.anyQ(function(q){return G.usesTables(q,['Schools','Athletes','Results']);});},{h2:'Create ▸ Query Design, add all three tables.',show:'cmd:create.querydesign'}),
  st('Add <b>SchoolName</b> and <b>Points</b>, then click <b>Totals</b> (Σ).',function(){return G.anyQ(function(q){return q.totals&&q.columns.some(function(c){return /schoolname/i.test(c.field);})&&q.columns.some(function(c){return /points/i.test(c.field);});});},{h2:'Query Design ▸ Totals adds a Total row.',show:'cmd:qd.totals'}),
  st('Set Points’ Total to <b>Sum</b> and sort it <b>Descending</b>.',function(){var t=G.rows('Results'),A=G.rows('Athletes'),Sc=G.rows('Schools'),exp={};t.forEach(function(r){var a=A.find(function(x){return x.AthleteID===r.AthleteID;});var s=Sc.find(function(x){return x.SchoolCode===a.SchoolCode;});exp[s.SchoolName]=(exp[s.SchoolName]||0)+r.Points;});
    return G.anyQ(function(q){var r=G.run(q);if(!r||r.rows.length!==Object.keys(exp).length||!q.totals)return false;var n=G.colVals(r,'SchoolName'),i=r.columns.findIndex(function(c){return /points/i.test(c.name)||/sumof/i.test(c.name);});if(!n||i<0)return false;var ok=n.every(function(x,k){return exp[x]===r.rows[k][i];});var v=r.rows.map(function(x){return x[i];});return ok&&v.every(function(x,k){return k===0||v[k-1]>=x;});});},{h2:'In the Points column choose Sum in the Total row and Descending in the Sort row.'}),
  st('Run and save as <b>School Points</b>.',function(){return !!G.savedQ('School Points')&&!!G.run(G.savedQ('School Points'));},{h2:'Run, then Ctrl+S ▸ School Points.',show:'cmd:qd.run'}),
  Object.assign(st('',null),quiz('Which school has the most points?',['Calabash Point Secondary','Hummingbird Ridge High School','Coralstone College','Palmetto Point Secondary'],2))]},
