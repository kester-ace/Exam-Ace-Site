<!doctype html>
<html lang="en" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Lab · CSEC Information Technology</title>
<meta name="description" content="Code Lab: problem solving, pseudocode, flowcharts, trace tables, Pascal and Python for CSEC Information Technology Sections 7 and 8. Kester Small">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{
  --navy0:#060D26;--navy1:#0B1A46;--navy2:#13265e;--gold:#F5C542;--gold2:#ffd96b;--ink:#E8ECF8;--ink2:#b9c3e3;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  --disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --ok:#2ea043;--bad:#e5534b;--warn:#d29922;
}
.theme-dark{--bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d2d;--act:#333333;--bd:#3c3c3c;--tx:#d4d4d4;--tx2:#a8a8a8;--ln:#8a8a8a;--cur:#2a2d2e;--sel:#264f78;--tab:#2d2d2d;--tabOn:#1e1e1e;
  --kw:#569cd6;--kw2:#c586c0;--str:#ce9178;--num:#b5cea8;--com:#7ca668;--fn:#dcdcaa;--op:#d4d4d4;--var:#9cdcfe;--status:#0063a5;--hl:#3a3d41;--exec:#4b4b18;--execbd:#ffd700;--err:#5a1d1d;--accent:#3794ff;--btn:#0e639c;--btnh:#1177bb;
  --fc-fill:#2b2f3a;--fc-stroke:#c9d1d9;--fc-term:#1d3b53;--fc-io:#4a3f1a;--fc-proc:#23401f;--fc-dec:#4a1f3a;--fc-txt:#f0f0f0;--canvas:#1b1b1f;--grid:#2a2a30}
.theme-light{--bg:#ffffff;--bg2:#f3f3f3;--bg3:#e8e8e8;--act:#2c2c2c;--bd:#d0d0d0;--tx:#1f1f1f;--tx2:#4d4d4d;--ln:#6e6e6e;--cur:#f5f8ff;--sel:#add6ff;--tab:#ececec;--tabOn:#ffffff;
  --kw:#b34700;--kw2:#8a2be2;--str:#067d17;--num:#0b5394;--com:#b00000;--fn:#900090;--op:#1f1f1f;--var:#1f1f1f;--status:#0063a5;--hl:#e8eefc;--exec:#fff3a3;--execbd:#b58900;--err:#ffe0e0;--accent:#005fb8;--btn:#005fb8;--btnh:#0a6dcc;
  --fc-fill:#ffffff;--fc-stroke:#1f2937;--fc-term:#e0f2fe;--fc-io:#fef9c3;--fc-proc:#ecfccb;--fc-dec:#fce7f3;--fc-txt:#111111;--canvas:#fbfbfd;--grid:#eceef3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui);font-size:13px;background:var(--navy0)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{display:flex;flex-direction:column;height:100vh;background:var(--bg);color:var(--tx)}
/* top bar */
.topbar{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;background:var(--bg3);border-bottom:1px solid var(--bd);flex:none;min-width:0}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--gold),#e59a2a);color:#1a1a1a;font:700 12px var(--mono)}
.brand b{font-weight:600}
.brand .file{color:var(--tx2);font-size:12px}
.dial{display:flex;align-items:center;gap:4px;margin-left:auto;background:var(--navy1);border-radius:16px;padding:2px;border:1px solid #2b3d78}
.dial button{background:transparent;border:0;color:var(--ink);padding:4px 9px;border-radius:14px;font-size:12px}
.dial button:hover{background:#1c2f6b}
.dial span{color:var(--gold);font-weight:700;font-size:12px;padding:0 6px;white-space:nowrap}
.tb-actions{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tb-actions button{background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;white-space:nowrap;color:var(--tx)}
.tb-actions button:hover{background:var(--hl);border-color:var(--bd)}
.tb-actions button[aria-pressed=true]{background:var(--hl)}
.banner-small{display:none;background:var(--gold);color:#1a1a1a;padding:6px 10px;font-weight:600;align-items:center;justify-content:space-between}
.banner-small button{background:#1a1a1a;color:#fff;border:0;border-radius:4px;padding:2px 8px}
/* main */
.main{flex:1;display:flex;min-height:0;position:relative}
.activity{width:48px;flex:none;background:var(--act);display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:2px}
.activity button{width:44px;height:46px;border:0;background:transparent;color:#c5c5c5;font-size:19px;border-left:2px solid transparent;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.activity button small{font-size:9px;margin-top:3px;font-family:var(--ui)}
.activity button[aria-selected=true]{color:#fff;border-left-color:var(--gold);background:#ffffff14}
.activity button:hover{color:#fff}
.activity button.hidden{display:none}
.activity .spacer{flex:1}
.views{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
/* toolbars */
.toolbar{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-wrap:wrap;flex:none}
.toolbar .sep{width:1px;height:20px;background:var(--bd);margin:0 3px}
.tbtn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;color:var(--tx);white-space:nowrap}
.tbtn:hover{background:var(--hl);border-color:var(--bd)}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn.primary{background:var(--btn);color:#fff}
.tbtn.primary:hover{background:var(--btnh)}
.tbtn[aria-pressed=true]{background:var(--sel);border-color:var(--accent)}
.tbtn .k{font-size:10px;opacity:.75}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--btn);color:#fff}
.go{color:#89d185}
.theme-light .go{color:#1a7f37}
.stop{color:#f48771}
.theme-light .stop{color:#c42b1c}
/* editor */
.ed-area{flex:1;min-height:0;display:flex}
.ed-wrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.tabs{display:flex;background:var(--bg2);flex:none;overflow-x:auto}
.tab{padding:6px 12px;background:var(--tab);color:var(--tx2);border-right:1px solid var(--bd);white-space:nowrap;font-size:12px;border-top:1px solid transparent}
.tab.on{background:var(--tabOn);color:var(--tx);border-top-color:var(--accent)}
.code-ed{position:relative;flex:1;min-height:0;display:flex;font:13.5px/20px var(--mono);overflow:hidden}
.gutter{flex:none;width:52px;background:var(--bg);color:var(--ln);text-align:right;overflow:hidden;user-select:none;position:relative}
.gutter .gl{height:20px;padding-right:10px;position:relative;cursor:pointer}
.gutter .gl.bp::before{content:"";position:absolute;left:6px;top:5px;width:10px;height:10px;border-radius:50%;background:#e51400}
.gutter .gl.exec{color:var(--tx);font-weight:700}
.gutter .gl.exec::after{content:"▶";position:absolute;left:18px;top:0;color:var(--execbd);font-size:11px}
.gutter .gl.errl{color:#f14c4c}
.ed-scroll{position:relative;flex:1;min-width:0;overflow:auto}
.ed-inner{position:relative;min-height:100%;width:max-content;min-width:100%}
.ed-inner pre,.ed-inner textarea{margin:0;padding:0 12px 40px 6px;font:inherit;white-space:pre;tab-size:4;border:0;letter-spacing:0}
.ed-inner pre{position:relative;pointer-events:none;color:var(--tx);min-height:100%}
.ed-inner textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--tx);outline:none;overflow:hidden}
.ed-inner textarea::selection{background:var(--sel);color:transparent}
.ed-inner textarea:focus-visible{outline:none}
.code-ed:focus-within{box-shadow:inset 0 0 0 1px var(--accent)}
.lnhl{position:absolute;left:0;right:0;height:20px;pointer-events:none}
.lnhl.cur{background:var(--cur)}
.lnhl.exec{background:var(--exec);box-shadow:inset 3px 0 0 var(--execbd)}
.lnhl.err{background:var(--err);box-shadow:inset 3px 0 0 #f14c4c}
.lnhl.hov{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.ro .ed-inner textarea{caret-color:transparent}
.t-kw{color:var(--kw)}.t-kw2{color:var(--kw2)}.t-str{color:var(--str)}.t-num{color:var(--num)}.t-com{color:var(--com);font-style:italic}.t-fn{color:var(--fn)}.t-op{color:var(--op)}
.side{width:250px;flex:none;border-left:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.side h3{margin:0;padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);border-bottom:1px solid var(--bd)}
.side .sbody{overflow:auto;flex:1;min-height:0}
.watch{width:100%;border-collapse:collapse;font:12px var(--mono)}
.watch td{padding:3px 8px;border-bottom:1px solid var(--bd);vertical-align:top;word-break:break-all}
.watch td:first-child{color:var(--var);white-space:nowrap}
.watch td.ty{color:var(--tx2);font-family:var(--ui);font-size:11px}
.watch tr.chg td{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.pas-pane{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--bd)}
.split-pas{width:45%}
/* bottom panel */
.panel{height:38%;min-height:120px;flex:none;border-top:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg)}
.ptabs{display:flex;gap:2px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--bd);align-items:center;flex:none;overflow-x:auto}
.ptabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);white-space:nowrap}
.ptabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--accent)}
.ptabs .grow{flex:1}
.pbody{flex:1;min-height:0;overflow:auto}
.ppane{display:none;height:100%}
.ppane.on{display:block}
.console{font:13px/1.45 var(--mono);padding:6px 10px;white-space:pre-wrap;word-break:break-word;min-height:100%}
.console .err{color:#f48771}
.theme-light .console .err{color:#c42b1c}
.console .hint{color:var(--gold);font-family:var(--body)}
.theme-light .console .hint{color:#8a5a00}
.console .sys{color:var(--tx2);font-style:italic}
.console .echo{color:var(--var)}
.console .inrow{display:inline-flex;align-items:center;gap:4px}
.console input{background:var(--bg3);border:1px solid var(--accent);color:var(--tx);font:inherit;padding:1px 6px;min-width:120px;border-radius:3px}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:var(--btn);color:#fff;font-size:10px;text-align:center}
/* trace table */
.trace-tools{display:flex;gap:8px;align-items:center;padding:6px 10px;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--bg2);position:sticky;top:0;z-index:1}
.trace-tools label{display:flex;gap:4px;align-items:center}
.trace-tools input[type=text]{background:var(--bg);border:1px solid var(--bd);padding:3px 6px;border-radius:3px;width:200px;font-family:var(--mono)}
table.tt{border-collapse:collapse;font:12.5px var(--mono);margin:8px 10px}
table.tt th,table.tt td{border:1px solid var(--bd);padding:3px 8px;text-align:center;min-width:56px}
table.tt th{background:var(--bg3);color:var(--tx);font-weight:600}
table.tt td.ln{color:var(--ln);min-width:30px}
table.tt td.out{text-align:left;color:var(--str)}
table.tt tr.latest td{background:color-mix(in srgb,var(--gold) 18%,transparent)}
table.tt input{width:100%;min-width:52px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font:inherit;padding:2px 4px;text-align:center}
table.tt td.ok{background:color-mix(in srgb,var(--ok) 26%,transparent)}
table.tt td.no{background:color-mix(in srgb,var(--bad) 26%,transparent)}
table.tt td .mk{font-size:10px;margin-left:3px}
.problems{padding:6px 10px}
.prob{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.prob .ic{color:#f14c4c}
/* status bar */
.statusbar{height:22px;flex:none;background:var(--status);color:#fff;display:flex;align-items:center;gap:14px;padding:0 10px;font-size:12px;white-space:nowrap;overflow:hidden}
.statusbar .r{margin-left:auto;display:flex;gap:14px}
/* mission panel */
.mission{width:340px;flex:none;background:linear-gradient(180deg,var(--navy1),var(--navy0));color:var(--ink);display:flex;flex-direction:column;font-family:var(--body);border-left:2px solid #22346f;min-height:0}
.mission.collapsed{display:none}
.m-head{padding:10px 12px 8px;border-bottom:1px solid #22346f}
.m-head .obj{display:inline-block;font-size:11px;background:#1c2f6b;color:var(--gold2);border:1px solid #2f4a9a;padding:1px 7px;border-radius:10px}
.m-head h2{font:700 18px/1.2 var(--disp);margin:6px 0 2px;color:#fff}
.m-head .lvl{font-size:12px;color:var(--ink2)}
.m-close{float:right;background:transparent;border:1px solid #2f4a9a;color:var(--ink);border-radius:4px;padding:1px 7px}
.m-body{flex:1;overflow:auto;padding:10px 12px}
.brief{background:#0e1f55;border:1px solid #22346f;border-left:3px solid var(--gold);border-radius:6px;padding:8px 10px;line-height:1.45;font-size:13.5px}
.brief code,.m-body code{font-family:var(--mono);background:#06102e;padding:0 4px;border-radius:3px;color:var(--gold2);font-size:12px}
.brief pre{font:12px/1.45 var(--mono);background:#06102e;padding:6px 8px;border-radius:4px;overflow:auto;color:#e7ecff;margin:6px 0 0;white-space:pre}
ol.steps{list-style:none;padding:0;margin:10px 0;counter-reset:st}
ol.steps li{counter-increment:st;display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:6px;margin-bottom:4px;background:#0c1a48;border:1px solid #1d2f68;line-height:1.35;font-size:13.5px}
ol.steps li::before{content:counter(st);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#1c2f6b;color:var(--gold);font-weight:700;font-size:12px}
ol.steps li.done::before{content:"✓";background:var(--gold);color:#1a1a1a}
ol.steps li.done{border-color:#4a5e2a}
ol.steps li .st-txt{flex:1}
ol.steps li .showme{flex:none;background:transparent;border:1px solid #2f4a9a;color:var(--gold2);border-radius:4px;font-size:11px;padding:2px 6px}
ol.steps li .fb{display:block;font-size:12.5px;margin-top:4px;color:#ffb4a8}
ol.steps li.done .fb{color:#b6e3a1}
.m-actions{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid #22346f}
.mbtn{background:#1c2f6b;color:#fff;border:1px solid #2f4a9a;border-radius:6px;padding:7px 10px;font-family:var(--body);font-weight:700}
.mbtn:hover{background:#25408f}
.mbtn.gold{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.mbtn.gold:hover{background:var(--gold2)}
.hintbox{margin-top:8px;background:#2b2408;border:1px solid #6b5615;color:#ffe9a8;border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.4}
.stars{font-size:26px;letter-spacing:4px;color:var(--gold)}
.donebox{text-align:center;background:#0e1f55;border:1px solid var(--gold);border-radius:8px;padding:12px;margin-top:10px}
.timer{font:700 13px var(--mono);color:var(--gold);float:right}
.m-empty{padding:16px;line-height:1.5}
.mlist h3{font:700 15px var(--disp);color:var(--gold);margin:12px 0 6px}
.mitem{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:#0c1a48;border:1px solid #1d2f68;color:var(--ink);border-radius:6px;padding:7px 8px;margin-bottom:4px;font-family:var(--body)}
.mitem:hover{border-color:var(--gold)}
.mitem .mi-s{margin-left:auto;color:var(--gold);white-space:nowrap}
.mitem small{display:block;color:var(--ink2);font-size:11px}
.robo-card{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#123a2a,#0b1a46);border:1px solid #2c7a55;border-radius:8px;padding:10px;color:var(--ink);margin-top:10px;width:100%;text-align:left;font-family:var(--body)}
.robo-card b{color:#7ff0b5}
/* converter */
.conv-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,0.9fr) minmax(300px,1.3fr) minmax(260px,1.1fr)}
.cpane{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--bd)}
.cpane h3{margin:0;padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}
.cpane h3 .grow{flex:1}
.cpane .code-ed{font-size:12.5px;line-height:19px}
.cpane .code-ed .gutter .gl,.cpane .code-ed .lnhl{height:19px}
.ltabs{display:flex;flex-wrap:wrap;gap:2px;padding:4px 6px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.ltabs button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:3px 7px;font-size:12px;color:var(--tx)}
.ltabs button[aria-selected=true]{background:var(--btn);color:#fff;border-color:var(--btn)}
.codeview{flex:1;min-height:0;overflow:auto;font:12.5px/19px var(--mono);background:var(--bg)}
.codeview .cl{display:flex;white-space:pre;cursor:default}
.codeview .cl .n{flex:none;width:36px;text-align:right;padding-right:8px;color:var(--ln);user-select:none}
.codeview .cl.hov{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.codeview .cl.exec{background:var(--exec)}
.mini-console{height:120px;flex:none;border-top:1px solid var(--bd);overflow:auto}
.conv-msg{padding:4px 10px;font-size:12px;border-bottom:1px solid var(--bd);background:var(--bg2);min-height:24px}
.conv-msg.bad{color:#f48771}
.theme-light .conv-msg.bad{color:#c42b1c}
.conv-msg.good{color:#89d185}
.theme-light .conv-msg.good{color:#1a7f37}
/* flowchart studio */
.studio{flex:1;min-height:0;display:flex;flex-direction:column}
.palette{display:flex;gap:4px;padding:5px 6px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}
.palette .pal{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:var(--bg);border-radius:5px;padding:3px 7px;font-size:12px;cursor:grab;color:var(--tx)}
.palette .pal svg{width:26px;height:16px}
.palette .pal:hover{border-color:var(--accent)}
.canvas-wrap{flex:1;min-height:0;overflow:auto;background:var(--canvas);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:16px 16px;position:relative}
.canvas-wrap svg.studio-svg{display:block}
.fc-s{fill:var(--fc-fill);stroke:var(--fc-stroke);stroke-width:1.6}
.fc-term{fill:var(--fc-term)}.fc-io{fill:var(--fc-io)}.fc-proc{fill:var(--fc-proc)}.fc-dec{fill:var(--fc-dec)}
.fc-t{font:12.5px var(--ui);fill:var(--fc-txt);pointer-events:none}
.fc-l{fill:none;stroke:var(--fc-stroke);stroke-width:1.5}
.fc-ah{fill:var(--fc-stroke)}
.fc-lab{font:700 11.5px var(--ui);fill:var(--gold)}
.theme-light .fc-lab{fill:#9a3412}
.fc-g{cursor:move}
.fc-g:focus{outline:none}
.fc-g:focus .fc-s,.fc-g.sel .fc-s{stroke:var(--accent);stroke-width:3}
.fc-g.hov .fc-s{stroke:var(--gold);stroke-width:3.2}
.fc-g.bad .fc-s{stroke:#f14c4c;stroke-width:3;stroke-dasharray:5 3}
.fc-edge{cursor:pointer}
.fc-edge .hit{stroke:transparent;stroke-width:12;fill:none}
.fc-edge.sel .fc-l{stroke:var(--accent);stroke-width:2.6}
.fc-handle{fill:var(--accent);stroke:#fff;stroke-width:1.5;cursor:crosshair}
.fc-ghost{stroke:var(--accent);stroke-dasharray:4 3;fill:none;stroke-width:1.5}
.edge-panel{border-top:1px solid var(--bd);background:var(--bg2);padding:5px 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}

/* ---------- Analyse: program features + hidden tests (used by missions and the checker) ---------- */
const Analyse = {
  ir(lang, code) { try { return CodeGen.toIR(lang, code); } catch (e) { return null; } },
  comments(lang, code) {
    if (lang === 'pascal') { const s = code.replace(/'(?:[^'\n]|'')*'/g, "''"); return (s.match(/\{[^}]*\}|\(\*[\s\S]*?\*\)|\/\/[^\n]*/g) || []).length; }
    if (lang === 'python') { const doc = (code.match(/("""|''')[\s\S]*?\1/g) || []).length; const s = code.replace(/("""|''')[\s\S]*?\1/g, '').replace(/"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/g, '""'); return doc + (s.match(/#[^\n]*/g) || []).length; }
    const s = code.replace(/"[^"\n]*"|'[^'\n]*'/g, '""'); return (s.match(/\/\/[^\n]*/g) || []).length;
  },
  features(lang, code) {
    const ir = this.ir(lang, code);
    const F = { ok: !!ir, ir, ifs: 0, ifElse: 0, maxBranches: 0, nestedIf: 0, cases: 0, caseOther: 0, fors: 0, whiles: 0, repeats: 0, foreach: 0, arrays: 0, inputs: 0, inputTargets: 0, outputs: 0, assigns: 0, accum: 0, consts: 0, names: new Set(), loopVars: new Set(), conds: [], comments: this.comments(lang, code) };
    if (!ir) return F;
    const ex = e => { if (!e || typeof e !== 'object') return; if (e.type === 'Index' || e.type === 'ListLit') F.arrays++; for (const k of ['l', 'r', 'e', 'index']) ex(e[k]); if (e.args) e.args.forEach(ex); if (e.items) e.items.forEach(ex); };
    const condTxt = e => { try { return CodeGen.pseudoExpr(e); } catch (x) { return ''; } };
    const walk = (b, depthIf, inLoop) => {
      for (const s of b || []) {
        switch (s.type) {
          case 'Declare': s.names.forEach(d => { F.names.add(d.name); if (d.hi) F.arrays++; }); break;
          case 'Const': F.consts++; F.names.add(s.name); break;
          case 'Assign': F.assigns++; F.names.add(s.target.name); ex(s.expr); if (s.target.index) F.arrays++;
            if (inLoop && s.expr.type === 'Bin' && ['+', '-'].includes(s.expr.op) && ((s.expr.l.type === 'Var' && s.expr.l.name.toLowerCase() === s.target.name.toLowerCase()) || (s.expr.l.type === 'Index' && s.target.index))) F.accum++;
            break;
          case 'Append': F.arrays++; break;
          case 'Input': F.inputs++; F.inputTargets += s.targets.length; s.targets.forEach(t => { F.names.add(t.name); if (t.index) F.arrays++; }); break;
          case 'Output': F.outputs++; s.exprs.forEach(ex); break;
          case 'If': {
            F.ifs++; if (depthIf > 0) F.nestedIf++;
            let n = s.branches.length + (s.elseBody ? 1 : 0); F.maxBranches = Math.max(F.maxBranches, n);
            if (s.elseBody || s.branches.length > 1) F.ifElse++;
            s.branches.forEach(br => { F.conds.push(condTxt(br.cond)); ex(br.cond); walk(br.body, depthIf + 1, inLoop); });
            walk(s.elseBody, depthIf + 1, inLoop); break;
          }
          case 'Case': F.cases++; if (s.other) F.caseOther++; s.branches.forEach(br => walk(br.body, depthIf, inLoop)); walk(s.other, depthIf, inLoop); break;
          case 'For': F.fors++; F.loopVars.add(s.var.toLowerCase()); F.names.add(s.var); walk(s.body, depthIf, true); break;
          case 'ForEach': F.foreach++; F.loopVars.add(s.var.toLowerCase()); walk(s.body, depthIf, true); break;
          case 'While': F.whiles++; F.conds.push(condTxt(s.cond)); ex(s.cond); walk(s.body, depthIf, true); break;
          case 'Repeat': F.repeats++; F.conds.push(condTxt(s.cond)); walk(s.body, depthIf, true); break;
          case 'Func': walk(s.body, depthIf, inLoop); break;
        }
      }
    };
    walk(ir.body, 0, false);
    F.loops = F.fors + F.whiles + F.repeats + F.foreach;
    F.selection = F.ifs + F.cases;
    const nm = [...F.names].filter(n => !F.loopVars.has(n.toLowerCase()) && !/^(i|j|k)$/i.test(n));
    F.badNames = nm.filter(n => n.length < 3 && !/^(id|no)$/i.test(n));
    F.meaningful = nm.length > 0 && F.badNames.length <= Math.floor(nm.length * 0.2);
    return F;
  },
  numbersIn(s) { return (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number); },
  outMatch(output, want) {
    const out = output.toLowerCase(); let pos = 0; const missing = [];
    for (const w of want) {
      if (typeof w === 'number') {
        const re = /-?\d[\d,]*(?:\.\d+)?/g; re.lastIndex = pos; let m, found = false;
        while ((m = re.exec(out))) { const v = parseFloat(m[0].replace(/,/g, '')); if (Math.abs(v - w) < 0.011) { pos = m.index + m[0].length; found = true; break; } }
        if (!found) missing.push(String(w));
      } else if (w instanceof RegExp) { const m = w.exec(out.slice(pos)); if (m) pos += m.index + m[0].length; else missing.push(String(w)); }
      else { const i = out.indexOf(String(w).toLowerCase(), pos); if (i >= 0) pos = i + String(w).length; else missing.push(`"${w}"`); }
    }
    return { ok: !missing.length, missing };
  },
  runTests(lang, code, tests) {
    const results = tests.map(t => {
      const r = runProgram(ENGINES[lang], code, t.in, { maxSteps: 30000 });
      if (r.error) return { ok: false, test: t, error: r.error, errorKind: r.errorKind, output: r.output };
      const m = this.outMatch(r.output, t.want);
      let ok = m.ok;
      if (ok && t.not) for (const bad of t.not) if (r.output.toLowerCase().includes(String(bad).toLowerCase())) { ok = false; m.missing.push(`(should not print "${bad}")`); }
      return { ok, test: t, missing: m.missing, output: r.output };
    });
    return { pass: results.every(r => r.ok), results, passed: results.filter(r => r.ok).length };
  }
};

/* ---------- Trace table (automatic, and fill-in-yourself with cell-by-cell marking) ---------- */
const Trace = {
  init(host) {
    this.host = host;
    const tools = h('div', { class: 'trace-tools' },
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Trace table mode' },
        h('button', { id: 'tr-auto', 'aria-pressed': 'true', onclick: () => this.setMode('auto') }, 'Automatic'),
        h('button', { id: 'tr-fill', 'aria-pressed': 'false', onclick: () => this.setMode('fill') }, '✍ I\'ll fill it in')),
      h('label', null, 'Test data:', h('input', { type: 'text', id: 'trace-inputs', placeholder: 'e.g. 5, 7, -1', 'aria-label': 'Test data inputs, separated by commas' })),
      h('button', { class: 'tbtn', id: 'btn-mk-table', onclick: () => this.makeBlank() }, '▦ Make blank table'),
      h('button', { class: 'tbtn primary', id: 'btn-mark', onclick: () => this.mark() }, '✓ Mark my table'),
      h('button', { class: 'tbtn', id: 'btn-trace-run', title: 'Fill the automatic table by running with the test data', onclick: () => this.autoRun() }, '▶ Run with test data'),
      h('span', { id: 'trace-score', class: 'note', 'aria-live': 'polite' }));
    this.box = h('div', { id: 'trace-box' }, h('p', { class: 'note', style: { padding: '8px 10px' } }, 'Run or Step your program and the trace table builds itself: one column per variable, a new row every time a variable changes.'));
    host.append(tools, this.box);
    this.mode = 'auto'; this.setMode('auto');
  },
  setMode(m) {
    this.mode = m;
    $('#tr-auto').setAttribute('aria-pressed', m === 'auto'); $('#tr-fill').setAttribute('aria-pressed', m === 'fill');
    $('#btn-mk-table').hidden = m !== 'fill'; $('#btn-mark').hidden = m !== 'fill'; $('#btn-trace-run').hidden = m !== 'auto';
    if (m === 'fill') { App.flag('fillMode'); this.box.innerHTML = ''; this.box.append(h('p', { class: 'note', style: { padding: '8px 10px' } }, 'Type the test data above, press “Make blank table”, then fill in each value as the program would. Leave a cell empty if that variable does not change in that row.')); }
    else if (Lab.runner) this.live(Lab.runner, true);
  },
  inputs() { const v = $('#trace-inputs').value.trim(); return v ? v.split(/\s*,\s*|\s*\n\s*/).filter(x => x !== '') : []; },
  reset() { if (this.mode === 'auto') this.box.innerHTML = ''; },
  autoRun() {
    const r = runProgram(ENGINES[Lab.lang], Lab.getCode(), this.inputs());
    if (r.error && !r.trace.rows.length) { this.box.innerHTML = ''; this.box.append(h('p', { class: 'note', style: { padding: '8px 10px', color: '#f48771' } }, r.error)); return; }
    this.render(r.trace, -1); if (r.error) this.box.append(h('p', { class: 'note', style: { padding: '0 10px' } }, '⚠ ' + r.error));

  },
  live(runner, final) {
    if (this.mode !== 'auto') return;

    if (final) App.lastTrace = { lang: Lab.lang, code: Lab.code0, inputs: [], trace: runner.trace, output: runner.output };
  },
  render(tr, latest) {
    this.box.innerHTML = '';
    if (!tr.rows.length) { this.box.append(h('p', { class: 'note', style: { padding: '8px 10px' } }, 'No rows yet — no variable has changed.')); return; }
    const t = h('table', { class: 'tt' }, h('caption', { class: 'sr' }, 'Trace table'));
    t.append(h('tr', null, h('th', { scope: 'col' }, 'Line'), ...tr.cols.map(c => h('th', { scope: 'col' }, c)), h('th', { scope: 'col' }, 'Output')));
    tr.rows.slice(0, 600).forEach((r, i) => {
      t.append(h('tr', { class: i === latest ? 'latest' : '' }, h('td', { class: 'ln' }, String(r.line)), ...tr.cols.map(c => h('td', null, c in r.cells ? r.cells[c] : '')), h('td', { class: 'out' }, r.out)));
    });
    this.box.append(t);
    if (tr.rows.length > 600) this.box.append(h('p', { class: 'note', style: { padding: '0 10px' } }, `Showing the first 600 of ${tr.rows.length} rows.`));

  },
  makeBlank() {
    const code = Lab.getCode(), inputs = this.inputs();
    const r = runProgram(ENGINES[Lab.lang], code, inputs);
    if (r.error && !r.trace.rows.length) { this.box.innerHTML = ''; this.box.append(h('p', { class: 'note', style: { padding: '8px 10px', color: '#f48771' } }, r.error)); return; }
    // expected values + carried values (so an unchanged cell may also hold the previous value)
    const carry = {}; const rows = r.trace.rows.map(row => { const exp = {}; for (const c of r.trace.cols) { if (c in row.cells) carry[c] = row.cells[c]; exp[c] = { want: c in row.cells ? row.cells[c] : '', carry: carry[c] }; } return { line: row.line, exp, out: row.out }; });
    this.fill = { code, lang: Lab.lang, inputs, cols: r.trace.cols, rows, marked: false };
    if (rows.length > 80) { toast('That trace is very long — try smaller test data.'); }
    this.box.innerHTML = '';
    const t = h('table', { class: 'tt', id: 'fill-table' }, h('caption', { class: 'sr' }, 'Trace table to fill in'));
    t.append(h('tr', null, h('th', null, 'Line'), ...r.trace.cols.map(c => h('th', null, c)), h('th', null, 'Output')));
    rows.slice(0, 80).forEach((row, i) => {
      t.append(h('tr', null, h('td', { class: 'ln' }, String(row.line)),
        ...r.trace.cols.map(c => h('td', null, h('input', { type: 'text', 'data-r': i, 'data-c': c, 'aria-label': `Row ${i + 1}, ${c}` }))),
        h('td', null, h('input', { type: 'text', 'data-r': i, 'data-c': '__out', 'aria-label': `Row ${i + 1}, output`, style: { minWidth: '120px', textAlign: 'left' } }))));
    });
    this.box.append(t);
    $('#trace-score').textContent = `${rows.length} rows to fill.`;
    App.flag('madeBlank');
  },
  norm(s) { return String(s == null ? '' : s).trim().replace(/^["']|["']$/g, '').replace(/\s+/g, ' ').toLowerCase(); },
  same(a, b) {
    const x = this.norm(a), y = this.norm(b);
    if (x === y) return true;

    return false;
  },
  mark() {
    if (!this.fill) { toast('Make a blank table first.'); return; }
    let total = 0, right = 0;
    $$('#fill-table input').forEach(inp => {
      const row = this.fill.rows[+inp.dataset.r]; const c = inp.dataset.c; const td = inp.parentElement;
      td.querySelectorAll('.mk').forEach(x => x.remove());

      else {

        else ok = this.same(inp.value, e.want);
      }
      total++; if (ok) right++;
      td.className = ok ? 'ok' : 'no';
      td.append(h('span', { class: 'mk', 'aria-label': ok ? 'correct' : 'incorrect' }, ok ? '✓' : '✗'));
    });
    const pct = total ? Math.round(right / total * 100) : 0;
    $('#trace-score').textContent = `${right} / ${total} cells correct (${pct}%)` + (pct === 100 ? ' — perfect! 🎉' : '');
    App.traceFill = { code: this.fill.code, lang: this.fill.lang, inputs: this.fill.inputs.slice(), pct, total, right, cols: this.fill.cols, rows: this.fill.rows };
    if (pct === 100) { App.award('trace'); Sound.ok(); } else Sound.bad();
    App.stateChanged();
  }
};

/* ---------- Flowchart Studio: drag-and-drop symbols, arrows with Yes/No labels ---------- */
const KIND_NAMES = { term: 'Terminator (Start/Stop)', io: 'Input / Output', proc: 'Process', dec: 'Decision', conn: 'Connector' };
const KIND_DEFAULT = { term: 'START', io: 'INPUT value', proc: 'total ← total + value', dec: 'value > 0?', conn: '' };
function palIcon(kind) {
  const s = 'fill="none" stroke="currentColor" stroke-width="1.5"';
  return { term: `<svg viewBox="0 0 26 16" aria-hidden="true"><rect x="1" y="2" width="24" height="12" rx="6" ${s}/></svg>`, io: `<svg viewBox="0 0 26 16" aria-hidden="true"><polygon points="6,2 25,2 20,14 1,14" ${s}/></svg>`, proc: `<svg viewBox="0 0 26 16" aria-hidden="true"><rect x="2" y="2" width="22" height="12" ${s}/></svg>`, dec: `<svg viewBox="0 0 26 16" aria-hidden="true"><polygon points="13,1 25,8 13,15 1,8" ${s}/></svg>`, conn: `<svg viewBox="0 0 26 16" aria-hidden="true"><circle cx="13" cy="8" r="6" ${s}/></svg>` }[kind];
}
class Studio {
  constructor(host, opts) {
    this.o = opts || {}; this.g = { nodes: [], edges: [] }; this.sel = null; this.selEdge = null; this.hov = new Set(); this.bad = null; this.nid = 1;
    this.root = h('div', { class: 'studio' });
    const pal = h('div', { class: 'palette', role: 'toolbar', 'aria-label': 'Flowchart symbols — click to add, or drag onto the canvas', id: 'fc-palette' });
    for (const k of ['term', 'io', 'proc', 'dec', 'conn']) {
      const b = h('button', { class: 'pal', draggable: 'true', 'data-kind': k, title: 'Add ' + KIND_NAMES[k], 'aria-label': 'Add ' + KIND_NAMES[k], html: palIcon(k) + `<span>${{ term: 'Start/Stop', io: 'Input/Output', proc: 'Process', dec: 'Decision', conn: 'Connector' }[k]}</span>` });
      b.addEventListener('click', () => this.add(k));
      b.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', 'fc:' + k); e.dataTransfer.effectAllowed = 'copy'; });
      pal.append(b);
    }
    pal.append(h('span', { class: 'sep' }),
      h('button', { class: 'tbtn', id: 'fc-connect', 'aria-pressed': 'false', title: 'Connect mode: click a symbol, then the symbol the arrow should point to', onclick: () => this.toggleConnect() }, '↘ Connect'),
      h('button', { class: 'tbtn', title: 'Edit the text of the selected symbol (Enter)', onclick: () => this.sel && this.edit(this.sel) }, '✎ Text'),
      h('button', { class: 'tbtn', title: 'Delete the selected symbol or arrow (Delete)', onclick: () => this.del() }, '🗑'),
      h('button', { class: 'tbtn', title: 'Zoom out', 'aria-label': 'Zoom out', onclick: () => this.zoom(-0.1) }, '－'),
      h('button', { class: 'tbtn', title: 'Zoom in', 'aria-label': 'Zoom in', onclick: () => this.zoom(0.1) }, '＋'));
    this.wrap = h('div', { class: 'canvas-wrap' });
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.svg.setAttribute('class', 'studio-svg'); this.svg.setAttribute('role', 'application'); this.svg.setAttribute('aria-label', 'Flowchart canvas. Tab to a symbol; arrow keys move it, Enter edits text, Delete removes it.');
    this.wrap.append(this.svg);
    this.edgePanel = h('div', { class: 'edge-panel', 'aria-label': 'Arrows' });
    this.root.append(pal, this.wrap, this.edgePanel); host.append(this.root);
    this.scale = 1;
    this.wrap.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    this.wrap.addEventListener('drop', e => {
      const d = e.dataTransfer.getData('text/plain'); if (!d.startsWith('fc:')) return; e.preventDefault();
      const p = this.pt(e); this.add(d.slice(3), p.x - 60, p.y - 20);
    });
    this.svg.addEventListener('pointerdown', e => { if (e.target === this.svg || e.target.classList.contains('bgr')) { this.select(null); this.selectEdge(null); } });

  }
  pt(e) { const r = this.svg.getBoundingClientRect(); return { x: (e.clientX - r.left) / this.scale, y: (e.clientY - r.top) / this.scale }; }
  zoom(d) { this.scale = Math.min(1.6, Math.max(0.5, this.scale + d)); this.render(); }
  size(n) { const m = Flow.measure(n.kind, n.text || ' '); return { w: m.w, h: m.h, lines: m.lines }; }
  setGraph(g) { this.g = { nodes: g.nodes.map(n => Object.assign({}, n)), edges: g.edges.map(e => Object.assign({}, e)) }; this.nid = this.g.nodes.length + 1; this.sel = null; this.selEdge = null; this.bad = null; this.render(); this.changed(); }
  clear() { this.g = { nodes: [], edges: [] }; this.sel = this.selEdge = null; this.render(); this.changed(); }

  add(kind, x, y) {
    if (x == null) {
      const maxY = this.g.nodes.reduce((m, n) => Math.max(m, n.y + this.size(n).h), 0);
      const sx = this.sel ? this.byId(this.sel).x : 60;
      x = sx; y = maxY + 36;
      if (!this.g.nodes.length) { x = 120; y = 24; }
    }
    let text = KIND_DEFAULT[kind];
    if (kind === 'term' && this.g.nodes.some(n => n.kind === 'term' && /start|begin/i.test(n.text))) text = 'STOP';
    const n = { id: this.newId(), kind, text, x: Math.max(4, Math.round(x)), y: Math.max(4, Math.round(y)) };

      { ext: 'svg', label: 'SVG picture', note: 'Sharp at any size; opens in browsers and Word · .svg', make: () => SimSave.text(svg, 'image/svg+xml') },
      { ext: 'png', label: 'PNG picture', note: 'For documents and slides · .png', make: async () => SimSave.png(await SimSave.svgToCanvas(svg, 2, '#ffffff')) },
      { ext: 'jpg', label: 'JPG picture', note: 'Smaller file · .jpg', make: async () => SimSave.jpg(await SimSave.svgToCanvas(svg, 2, '#ffffff')) },
      { ext: 'pdf', label: 'PDF', note: 'Ready to print · .pdf', make: async n => SimSave.pdfFromCanvases([await SimSave.svgToCanvas(svg, 2, '#ffffff')], { size: 'Letter', margin: 36, title: n.replace(/\.pdf$/i, '') }) }] });
  },
  // ---------- running converted code ----------
  runCode() {
    const l = this.lang; this.con.clear();
    if (l === 'js') return this.runJS();
    const code = this.view.text();
    this.con.line(`▶ ${LANG_NAMES[l]}`, 'sys');
    const r = new Runner(ENGINES[l], code, {
      onOut: (t, c) => this.con.write(t, '', c), onClear: () => this.con.clear(),
      onInputRequest: (p, n, pause) => this.con.ask(p, pause, v => { r.provideInput(v); go(); }), skipPause: true
    });
    const go = () => { const ev = r.runToEnd(); if (ev.t === 'done') this.con.line('— finished —', 'sys'); else if (ev.t === 'error') { this.con.line(r.error, 'err'); if (r.errorObj && r.errorObj.hint) this.con.line('💡 ' + r.errorObj.hint, 'hint'); } };
    if (!r.compile()) { this.con.line(r.error, 'err'); return; }

  },
  sandboxInit() {
    this.frame = $('#js-sandbox');
    const src = `<!doctype html><meta charset="utf-8"><script>
let pending=null;
addEventListener('message', async e => {
  const d=e.data||{};
  const send=(type,x)=>parent.postMessage(Object.assign({__cl:1,type},x||{}),'*');
  if(d.type==='run'){
    const input=p=>new Promise(r=>{pending=r;send('input',{prompt:p==null?'':String(p)});});
    const fmt=x=>typeof x==='number'&&!Number.isInteger(x)?String(parseFloat(x.toPrecision(12))):String(x);
    const con={log:(...a)=>send('out',{text:a.map(fmt).join(' ')+'\\n'})};
    const write=s=>send('out',{text:String(s)});
    let n=0;const __g=()=>{if(++n>200000)throw new Error('More than 200,000 loop steps — is there an infinite loop?');};
    try{const AF=Object.getPrototypeOf(async function(){}).constructor;await new AF('input','console','write','__g',d.code)(input,con,write,__g);send('done');}
    catch(err){send('error',{text:(err&&err.name?err.name+': ':'')+(err&&err.message||err)});}
  } else if(d.type==='input'&&pending){const r=pending;pending=null;r(d.value);}
});
<\/script>`;
    try { this.frame.srcdoc = src; } catch (e) { }
    window.addEventListener('message', e => {
      const d = e.data; if (!d || !d.__cl || !this.frame || e.source !== this.frame.contentWindow) return;
      if (d.type === 'out') this.con.write(d.text);
      else if (d.type === 'input') this.con.ask(d.prompt, false, v => this.frame.contentWindow.postMessage({ type: 'input', value: v }, '*'));
      else if (d.type === 'done') this.con.line('— finished —', 'sys');
      else if (d.type === 'error') this.con.line(d.text, 'err');
    });
  },
  runJS() {
    const code = this.view.text().split('\n').map(l => /^\s*(for|while|do)\b.*\{\s*$/.test(l) || /^\s*do\s*\{\s*$/.test(l) ? l + ' __g();' : l).join('\n');
    this.con.line('▶ JavaScript (sandboxed)', 'sys');
    try { this.frame.contentWindow.postMessage({ type: 'run', code }, '*'); App.flag('ranConv:js'); }
    catch (e) { this.con.line('JavaScript could not start here: ' + e.message, 'err'); }
  }
};

/* ---------- SortBoard: drag cards into buckets (keyboard: pick a card, then choose a bucket) ---------- */
class SortBoard {
  constructor(host, opts) {
    this.o = opts; this.place = {}; (opts.cards || []).forEach(c => this.place[c.id] = opts.initial && opts.initial[c.id] || null);
    this.custom = []; this.picked = null; this.marks = null;
    this.el = h('div'); host.append(this.el); this.render();
  }
  allCards() { return this.o.cards.concat(this.custom); }
  move(id, b) { this.place[id] = b; this.picked = null; this.marks = null; this.render(); if (this.o.onChange) this.o.onChange(this); Sound.tick(); }
  render() {
    const o = this.o; this.el.innerHTML = '';
    const cardEl = c => {
      const m = this.marks ? this.marks[c.id] : null;
      const b = h('button', { class: 'card' + (this.picked === c.id ? ' picked' : '') + (m === true ? ' ok' : m === false ? ' no' : ''), draggable: 'true', 'data-card': c.id, 'aria-pressed': this.picked === c.id ? 'true' : 'false', title: 'Drag to a box — or click, then click “Place here” on a box' , html: (c.html || esc(c.text)) + (m === true ? ' <span aria-label="correct">✓</span>' : m === false ? ' <span aria-label="not correct">✗</span>' : '') });
      b.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', 'card:' + c.id); });
      b.addEventListener('click', () => { this.picked = this.picked === c.id ? null : c.id; this.render(); const nb = $(`[data-card="${c.id}"]`, this.el); nb && nb.focus(); });
      b.addEventListener('keydown', e => { const k = parseInt(e.key, 10); if (k >= 1 && k <= o.buckets.length) { e.preventDefault(); this.move(c.id, o.buckets[k - 1].id); } if (e.key === '0') this.move(c.id, null); });
      return b;
    };
    const drop = (el, bid) => {
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); const d = e.dataTransfer.getData('text/plain'); if (d.startsWith('card:')) this.move(d.slice(5), bid); });
    };
    const bank = h('div', { class: 'bank', role: 'group', 'aria-label': 'Card bank' }, h('h4', null, o.bankLabel || 'Cards to sort ', h('small', { class: 'note' }, ' — drag, or click a card then a box (or press 1–' + o.buckets.length + ')')));
    drop(bank, null);
    this.allCards().filter(c => !this.place[c.id]).forEach(c => bank.append(cardEl(c)));
    if (!this.allCards().some(c => !this.place[c.id])) bank.append(h('span', { class: 'note' }, 'All cards placed.'));
    this.el.append(bank);
    if (o.allowAdd) {
      const inp = h('input', { type: 'text', placeholder: o.addPlaceholder || 'Type your own item', 'aria-label': 'New item text' });
      const sel = h('select', { 'aria-label': 'Put it in' }, ...o.buckets.map(b => h('option', { value: b.id }, b.label)));
      this.el.append(h('div', { class: 'addrow' }, inp, sel, h('button', { class: 'tbtn primary', onclick: () => { const t = inp.value.trim(); if (!t) return; const id = 'c' + Date.now(); this.custom.push({ id, text: t, custom: true }); this.place[id] = sel.value; this.render(); if (o.onChange) o.onChange(this); } }, '＋ Add')));
    }
    const grid = h('div', { class: 'board ' + (o.layout === 'ipo' ? 'ipo-grid' : ''), style: o.layout === 'ipo' ? null : { gridTemplateColumns: `repeat(auto-fit,minmax(${o.minW || 170}px,1fr))` } });
    o.buckets.forEach((b, i) => {
      const box = h('div', { class: 'bucket' + (b.cls ? ' ' + b.cls : ''), role: 'group', 'aria-label': b.label, 'data-bucket': b.id },
        h('h4', null, h('span', null, `${i + 1}. ${b.label}`, b.hint ? h('small', null, ' ' + b.hint) : null),
          h('button', { class: 'tbtn', disabled: !this.picked, 'aria-label': 'Place the picked card in ' + b.label, onclick: () => this.picked && this.move(this.picked, b.id) }, 'Place here')));
      drop(box, b.id);
      this.allCards().filter(c => this.place[c.id] === b.id).forEach(c => {
        const ce = cardEl(c);
        box.append(h('span', null, ce, h('button', { class: 'card x', title: 'Send back to the bank', 'aria-label': 'Send back to the bank', onclick: () => this.move(c.id, null) }, '↩')));
      });
      grid.append(box);
    });
    this.el.append(grid);
  }
  check() {
    this.marks = {}; let right = 0, total = 0;
    for (const c of this.o.cards) { if (c.answer === undefined) continue; total++; const ok = (this.place[c.id] || null) === (c.answer || null); this.marks[c.id] = this.place[c.id] || c.answer ? ok : null; if (ok) right++; }
    this.render(); return { right, total };
  }
  correct(ids) { return ids.every(id => { const c = this.o.cards.find(x => x.id === id); return c && (this.place[id] || null) === (c.answer || null); }); }
}

/* ---------- OrderList: put items in order (drag, or ↑ ↓ buttons) ---------- */
class OrderList {
  constructor(host, items, opts) { this.o = opts || {}; this.items = items.slice(); this.marks = null; this.el = h('ol', { class: 'ordlist', 'aria-label': this.o.label || 'Put these in order' }); host.append(this.el); this.render(); }
  render() {
    this.el.innerHTML = '';
    this.items.forEach((it, i) => {
      const m = this.marks ? this.marks[i] : null;
      const li = h('li', { draggable: 'true', class: m === true ? 'ok' : m === false ? 'no' : '', 'data-i': i },
        h('span', { 'aria-hidden': 'true' }, '⋮⋮'), h('span', { style: { whiteSpace: 'pre' } }, it.text),
        h('span', { class: 'mv' }, h('button', { 'aria-label': `Move "${it.text.trim()}" up`, disabled: i === 0, onclick: () => this.swap(i, i - 1) }, '↑'), h('button', { 'aria-label': `Move "${it.text.trim()}" down`, disabled: i === this.items.length - 1, onclick: () => this.swap(i, i + 1) }, '↓')));
      li.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', 'ord:' + i); li.classList.add('drag'); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => e.preventDefault());
      li.addEventListener('drop', e => { e.preventDefault(); const d = e.dataTransfer.getData('text/plain'); if (!d.startsWith('ord:')) return; const from = +d.slice(4); const [x] = this.items.splice(from, 1); this.items.splice(i, 0, x); this.marks = null; this.render(); this.changed(); });
      this.el.append(li);
    });
  }
  swap(a, b) { [this.items[a], this.items[b]] = [this.items[b], this.items[a]]; this.marks = null; this.render(); this.changed(); const btn = $$('li', this.el)[b]; if (btn) { const f = $(`button:not([disabled])`, btn); f && f.focus(); } }
  changed() { if (this.o.onChange) this.o.onChange(this); Sound.tick(); }
}

  classify(v) {
    const c = this.tcfg; const s = String(v).trim();

    const isNum = /^[+-]?\d+(\.\d+)?$/.test(s);
    if (!isNum || (c.int && !/^[+-]?\d+$/.test(s))) return ['Erroneous'];
    const n = +s;

    if (c.locked) $$('.rule input', b).forEach(i => i.disabled = true);
    const t = h('table', { class: 'tp-table' }, h('caption', { class: 'sr' }, 'Test plan'),

    this.rows.forEach((r, i) => {
      const cls = this.classify(r.value);

      const res = r.actual === '' ? '' : (r.expected && r.actual.toLowerCase().includes(r.expected.toLowerCase().trim()) ? '✓ as expected' : '✗ differs');
      t.append(h('tr', null, h('td', null, String(i + 1)),

          typeOk === false ? h('div', { class: 'note', style: { color: '#f48771' } }, `⚠ ${r.value} looks like ${cls.join(' or ')} data`) : null),
        h('td', null, h('input', { type: 'text', value: r.value, 'aria-label': `Row ${i + 1} value`, onchange: e => { r.value = e.target.value; r.actual = ''; this.renderTest(); this.changed(); } })),
        h('td', null, h('input', { type: 'text', value: r.expected, 'aria-label': `Row ${i + 1} expected output`, placeholder: 'e.g. Valid', onchange: e => { r.expected = e.target.value; this.renderTest(); this.changed(); } })),
        h('td', null, h('input', { type: 'text', value: r.actual, readonly: true, 'aria-label': `Row ${i + 1} actual output` })),
        h('td', { class: 'res' }, res),
        h('td', null, h('button', { class: 'tbtn', title: 'Run the program in the editor with this value', onclick: () => { this.runRow(r); this.renderTest(); this.changed(); } }, '▶'), h('button', { class: 'tbtn', 'aria-label': `Delete row ${i + 1}`, onclick: () => { this.rows.splice(i, 1); this.renderTest(); this.changed(); } }, '✕'))));
    });
    b.append(t, h('div', { class: 'addrow' },
      h('button', { class: 'tbtn', id: 'tp-add', onclick: () => { this.rows.push({ type: 'Normal', value: '', expected: '', actual: '' }); this.renderTest(); } }, '＋ Add row'),
      h('button', { class: 'tbtn primary', id: 'tp-runall', onclick: () => { this.rows.forEach(r => this.runRow(r)); this.renderTest(); this.changed(); toast('Ran every test with the program in the Code editor'); } }, '▶ Run all tests'),
      h('span', { class: 'note' }, 'Tests run the program that is in the Code editor.')));
    App.tplan = this;
  },
  runRow(r) {
    if (r.value.trim() === '') { r.actual = ''; return; }
    const inputs = r.value.split(/\s*,\s*/);
    const res = runProgram(ENGINES[Lab.lang], Lab.getCode(), inputs, { maxSteps: 20000 });
    r.actual = (res.output.trim().split('\n').pop() || '') + (res.error ? ' [' + res.error.split('\n').pop() + ']' : '');
    if (!res.output.trim() && res.error) r.actual = '[' + res.error.split('\n').pop() + ']';
  },
  changed() { App.tplan = this; App.stateChanged(); },
  summary() {
    const out = { Normal: 0, Boundary: 0, Erroneous: 0, wrongType: 0, noExpected: 0, notRun: 0, rows: this.rows.length, filled: 0, values: new Set() };

      if (!r.actual) out.notRun++;

  },
  tableHTML() { return `<table border="1" cellpadding="5" style="border-collapse:collapse"><tr><th>#</th><th>Type</th><th>Test data</th><th>Expected</th><th>Actual</th></tr>${this.rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.type)}</td><td>${esc(r.value)}</td><td>${esc(r.expected)}</td><td>${esc(r.actual)}</td></tr>`).join('')}</table>`; }

function indent(lines, lang) {
  if (lang !== 'pseudo') return lines.map(l => l).join('\n');
  let d = 0; const out = [];

    out.push('   '.repeat(d) + l);

};
function testFb(x) {
  if (!x.tests) return 'Fix the errors first so the tests can run.';
  const bad = x.tests.results.find(r => !r.ok);
  if (!bad) return '';
  const inp = bad.test.in.length ? bad.test.in.join(', ') : '(no input)';
  if (bad.error) return `With test data ${inp} the program stopped with an error: ${bad.error.split('\n').filter(l => l.trim()).pop()}`;
  return `With test data ${inp}, the output is missing ${bad.missing.slice(0, 3).join(', ')}. (${x.tests.passed}/${x.tests.results.length} tests passed)`;
}
const convTests = (tests) => x => { if (!x.conv.pseudo) return false; const r = Analyse.runTests('pseudo', x.conv.pseudo, tests); x.convTests = r; return r.pass; };
const convFb = () => x => { const r = x.convTests; if (!r) return 'Write or generate the pseudocode first.'; const b = r.results.find(z => !z.ok); if (!b) return ''; return b.error ? 'The pseudocode stops with: ' + b.error : `With input ${b.test.in.join(', ')} the output is missing ${b.missing.join(', ')}.`; };

    steps: [{ t: 'INPUT the mark', c: x => x.F.inputs >= 1, show: '#btn-run' }, { t: 'Use IF … THEN … ELSE … ENDIF', c: x => x.F.ifElse >= 1, fb: () => 'You need an ELSE part for Fail.' }, S_.tests('Correct for 50 (boundary), 49, 100 and 0'), S_.ran],
    hints: ['Is 50 a pass? Then the condition must include 50.', 'IF mark >= 50 THEN\n   PRINT "Pass"\nELSE\n   PRINT "Fail"\nENDIF'] },
  { id: 'l2-grades', level: 2, title: 'Grade bands', obj: 'S8 SO6 · nested IF / ELSE IF', view: 'editor', langs: PP,
    brief: 'Calabash Point Secondary reports use these bands: <b>80–100 → A</b>, <b>70–79 → B</b>, <b>60–69 → C</b>, <b>50–59 → D</b>, <b>below 50 → F</b>. Read a mark and display <code>Grade: A</code> (etc.).',
    starter: { pascal: "program GradeBands;\n{ Converts a mark into a grade }\nvar\n  mark: integer;\nbegin\n  write('Enter the mark: ');\n  readln(mark);\n  { Display Grade: A, B, C, D or F }\n\nend.\n", python: '# Converts a mark into a grade\nmark = int(input("Enter the mark: "))\n# Display Grade: A, B, C, D or F\n' },
    tests: [80, 85, 79, 70, 65, 60, 55, 50, 49].map(m => ({ in: [String(m)], want: [new RegExp('grade\\W*' + (m >= 80 ? 'a' : m >= 70 ? 'b' : m >= 60 ? 'c' : m >= 50 ? 'd' : 'f') + '\\b')] })),
    steps: [{ t: 'Use a chain of IF / ELSE IF (nested selection)', c: x => x.F.maxBranches >= 4 || x.F.ifs >= 4, fb: () => 'You need a decision for each band.' }, S_.tests('Correct grade for every band, including the boundaries 80, 70, 60, 50'), S_.comments(1), S_.ran],
    hints: ['Test the highest band first: if mark >= 80 … else if mark >= 70 …', "Pascal:\n  if mark >= 80 then writeln('Grade: A')\n  else if mark >= 70 then writeln('Grade: B')\n  else if mark >= 60 then writeln('Grade: C')\n  else if mark >= 50 then writeln('Grade: D')\n  else writeln('Grade: F');"] },
  { id: 'l2-ten-scores', level: 2, title: 'Ten cricket scores', obj: 'S7 SO8 · FOR loop, accumulator', view: 'editor', langs: ALL3,
    brief: 'A batter played 10 innings in the Leeward Islands tournament. Use a <b>FOR loop</b> to read the 10 scores, add them with an <b>accumulator</b>, then display the <b>total</b> and the <b>average</b>.',
    starter: { pascal: "program TenScores;\n{ Total and average of 10 scores }\nvar\n  i, score, total: integer;\n  average: real;\nbegin\n  total := 0;\n  { Use a FOR loop to read 10 scores and add them up }\n\n  { Work out and display the total and the average }\n\nend.\n", python: '# Total and average of 10 scores\ntotal = 0\n# Use a for loop to read 10 scores and add them up\n\n# Work out and display the total and the average\n', pseudo: 'START\n   total ← 0\n   // FOR loop to read 10 scores and add them up\n   \n   // output the total and the average\nSTOP\n' },
    tests: [{ in: ['70', '80', '90', '60', '50', '40', '100', '85', '75', '65'], want: [715, 71.5] }, { in: Array(10).fill('50'), want: [500, 50] }],
    steps: [{ t: 'Use a FOR loop that runs 10 times', c: x => x.F.fors >= 1, fb: () => 'Pascal: for i := 1 to 10 do   Python: for i in range(10):   Pseudocode: FOR i ← 1 TO 10 DO' }, { t: 'Add each score to an accumulator inside the loop', c: x => x.F.accum >= 1, fb: () => 'total := total + score;' }, S_.tests('Correct total and average'), S_.ran],
    hints: ['Read the score INSIDE the loop, calculate the average AFTER the loop.', 'for i := 1 to 10 do\nbegin\n  readln(score);\n  total := total + score;\nend;\naverage := total / 10;'] },
  { id: 'l2-cruise', level: 2, title: 'Cruise passengers in Philipsburg', obj: 'S8 SO6 · WHILE loop with a sentinel', view: 'editor', langs: PP,
    brief: 'The cruise pier in Philipsburg, Sint Maarten, records passengers for each ship that docks. Enter passenger counts until <b>-1</b> (the sentinel/rogue value) is entered. Display the <b>number of ships</b> and the <b>total passengers</b>.',
    starter: { pascal: "program CruisePassengers;\n{ Counts ships and passengers until -1 is entered }\nvar\n  passengers, ships, total: integer;\nbegin\n  ships := 0;\n  total := 0;\n  { read the first count, then loop WHILE it is not -1 }\n\nend.\n", python: '# Counts ships and passengers until -1 is entered\nships = 0\ntotal = 0\n# read the first count, then loop while it is not -1\n' },
    tests: [{ in: ['3200', '4100', '2500', '-1'], want: [3, 9800] }, { in: ['-1'], want: [0, 0] }, { in: ['5000', '-1'], want: [1, 5000] }],
    steps: [{ t: 'Use a WHILE loop', c: x => x.F.whiles >= 1 }, { t: 'The loop stops at the sentinel value -1', c: x => x.F.conds.some(c => /-\s*1/.test(c)), fb: () => 'Condition: passengers <> -1  (Python: passengers != -1)' }, { t: 'A counter and an accumulator inside the loop', c: x => x.F.accum >= 2, fb: () => 'ships := ships + 1;  total := total + passengers;' }, { t: 'Read before the loop AND at the end of the loop (priming read)', c: x => x.F.inputs >= 2 }, S_.tests('Works for 3 ships, and for no ships at all')],
    hints: ['Read one count before the loop; read the next count as the LAST line inside the loop.', "readln(passengers);\nwhile passengers <> -1 do\nbegin\n  ships := ships + 1;\n  total := total + passengers;\n  readln(passengers);\nend;"] },
  { id: 'l2-vending', level: 2, title: 'Vending machine flowchart', obj: 'S7 SO7 · flowcharts → pseudocode → code', view: 'conv',
    brief: 'The vending machine in the staff room at Breadfruit Valley Secondary sells drinks for <b>$2</b>. Build a <b>flowchart</b>: input the money; if it is <b>2 or more</b>, output <code>"Enjoy your drink"</code> and the change; otherwise output <code>"Insert more money"</code> and go <b>back to the input</b>. Then let the lab write the pseudocode and the program.',
    setup: () => { Conv.studio.clear(); Conv.setPseudo('START\n   // Build the flowchart, then press Flowchart ▶ Pseudocode\nSTOP'); },
    steps: [
      { t: 'Flowchart has a START and a STOP terminator', c: x => x.fc.start && x.fc.stop, show: '#fc-palette [data-kind="term"]' },
      { t: 'An INPUT money symbol and OUTPUT symbols', c: x => x.fc.input && x.fc.output, fb: () => 'Use the parallelogram. Text like: INPUT money   and   OUTPUT "Enjoy your drink"', show: '#fc-palette [data-kind="io"]' },
      { t: 'A decision (money >= 2?) with arrows labelled Yes and No', c: x => x.fc.decision && x.fc.labelled, fb: () => 'Select an arrow from the diamond and set its label (or use the Add arrow bar).', show: '#fc-palette [data-kind="dec"]' },
      { t: 'An arrow flows back to the input (a loop)', c: x => x.fc.loop, fb: () => 'Connect "Insert more money" back to the INPUT symbol.', show: '#fc-add-arrow' },
      { t: 'Press “Flowchart ▶ Pseudocode” — and the algorithm works', c: x => x.flags.has('genFromFlow') && convTests([{ in: ['3'], want: ['enjoy'] }, { in: ['1', '2'], want: ['insert more', 'enjoy'] }])(x), fb: x => x.flags.has('genFromFlow') ? convFb()(x) : 'Press Flowchart ▶ Pseudocode.', show: '#cv-gen' },
      { t: 'View the program in Python and in Pascal', c: x => x.conv.viewed && x.conv.viewed.has('python') && x.conv.viewed.has('pascal'), show: '#cv-tab-python' }],
    hints: ['START → INPUT money → diamond “money >= 2?”. Yes → OUTPUT … → STOP. No → OUTPUT "Insert more money" → arrow back up to INPUT money.', 'Symbols: START · INPUT money · money >= 2? · (No) OUTPUT "Insert more money" ↺ · (Yes) OUTPUT "Enjoy your drink" · change ← money - 2 · OUTPUT "Change:", change · STOP'] },
  { id: 'l2-rain-trace', level: 2, title: 'Trace the rainfall loop', obj: 'S7 SO9 · trace table with a loop', view: 'editor', langs: ['pseudo'], readOnly: true,
    brief: 'The Meteorological Department recorded rainfall (mm) for three months of hurricane season. Complete the trace table for this algorithm with the test data <b>120, 90, 150</b>.',
    starter: { pseudo: 'START\n   total ← 0\n   FOR month ← 1 TO 3 DO\n      INPUT rain\n      total ← total + rain\n   ENDFOR\n   average ← total / 3\n   PRINT "Average:", average\nSTOP\n' },
    setup: () => { Lab.panel('trace'); $('#trace-inputs').value = '120, 90, 150'; },
    steps: [
      { t: 'Fill-in mode, test data 120, 90, 150, “Make blank table”', c: x => x.flags.has('madeBlank') && Trace.fill && Trace.fill.inputs.join(',') === '120,90,150', fb: () => 'Choose “✍ I’ll fill it in”, check the test data box, then press Make blank table.', show: '#btn-mk-table' },
      { t: 'Mark your table: at least 90% correct', c: x => x.traceFill && norm(x.traceFill.code) === norm(x.m.starter.pseudo) && x.traceFill.inputs.join(',') === '120,90,150' && x.traceFill.pct >= 90, fb: x => x.traceFill ? `You have ${x.traceFill.pct}%.` : 'Press ✓ Mark my table.', show: '#btn-mark' },
      { t: 'Step through with the debugger to check', c: x => x.flags.has('stepped'), show: '#btn-step' }],
    hints: ['Each time round the loop, month changes, then rain is input, then total changes.', 'total: 0, 120, 210, 360 · month: 1, 2, 3 · rain: 120, 90, 150 · average: 120 · output: Average: 120'] },
  { id: 'l2-carnival', level: 2, title: 'Carnival troupe fees', obj: 'S8 SO6 · translating pseudocode into a program', view: 'editor', langs: PP,
    brief: 'A Vincy Mas carnival troupe in St. Vincent charges <b>$450</b> for a Frontline costume and <b>$300</b> for Backline. Early-bird members (<code>Y</code>) get <b>10% off</b>. Translate this pseudocode into a working program:<pre>START\n   INPUT section\n   INPUT early\n   IF section = "Frontline" THEN\n      fee ← 450\n   ELSE\n      fee ← 300\n   ENDIF\n   IF early = "Y" THEN\n      fee ← fee - fee * 0.10\n   ENDIF\n   PRINT "Costume fee: $", fee\nSTOP</pre>',
    starter: { pascal: "program CarnivalFees;\n{ Translate the pseudocode into Pascal }\nvar\n  section, early: string;\n  fee: real;\nbegin\n\nend.\n", python: '# Translate the pseudocode into Python\n' },
    tests: [{ in: ['Frontline', 'Y'], want: [405] }, { in: ['Backline', 'N'], want: [300] }, { in: ['Frontline', 'N'], want: [450] }, { in: ['Backline', 'Y'], want: [270] }],
    steps: [{ t: 'Read the section and the early-bird answer', c: x => x.F.inputTargets >= 2 }, { t: 'Two separate IF statements', c: x => x.F.ifs >= 2 }, S_.tests('Correct fee for all four combinations'), S_.comments(1)],
    hints: ['Each pseudocode line becomes one line of code. INPUT → readln (Pascal) / input() (Python).', "Pascal:\n  readln(section);\n  readln(early);\n  if section = 'Frontline' then fee := 450 else fee := 300;\n  if early = 'Y' then fee := fee - fee * 0.10;\n  writeln('Costume fee: $', fee:0:2);"] },
  { id: 'l2-testplan', level: 2, title: 'Plan the test data', obj: 'S8 SO5 · normal, boundary and erroneous data', view: 'planner', langs: PP,
    brief: 'The program in the Code editor accepts a mark from <b>0 to 100</b>. Plan test data that proves it works: <b>normal</b>, <b>boundary</b> (on the limits) and <b>erroneous</b> data (outside the range). Fill in the expected output, then run every test.',
    starter: { pascal: "program CheckMark;\n{ Validates a mark: it must be a whole number from 0 to 100 }\nvar\n  mark: integer;\nbegin\n  write('Enter mark: ');\n  readln(mark);\n  if (mark >= 0) and (mark <= 100) then\n    writeln('Valid')\n  else\n    writeln('Invalid');\nend.\n", python: '# Validates a mark: it must be a whole number from 0 to 100\nmark = int(input("Enter mark: "))\nif mark >= 0 and mark <= 100:\n    print("Valid")\nelse:\n    print("Invalid")\n' },
    setup: () => { Planner.loadTest({ lo: 0, hi: 100, int: true, what: 'mark', locked: true }); Planner.show('test'); },
    steps: [
      { t: 'At least 2 rows of NORMAL data', c: x => x.tp.Normal >= 2, fb: () => 'Normal data is any ordinary valid mark, like 65.', show: '#tp-add' },
      { t: 'BOUNDARY data on both limits (0 and 100)', c: x => x.tp.values.has('0') && x.tp.values.has('100') && x.tp.Boundary >= 2, fb: () => 'Boundary data sits exactly on the limits.' },
      { t: 'At least 1 row of ERRONEOUS data', c: x => x.tp.Erroneous >= 1, fb: () => 'Erroneous data must be rejected: e.g. -5 or 150.' },
      { t: 'Every row has the right type and an expected output', c: x => x.tp.filled >= 5 && x.tp.wrongType === 0 && x.tp.noExpected === 0, fb: x => x.tp.wrongType ? 'Some rows have the wrong type — look for the ⚠ notes.' : 'Fill in the Expected output for every row (Valid / Invalid).' },
      { t: 'Run all the tests', c: x => x.tp.filled >= 5 && x.tp.notRun === 0, show: '#tp-runall' }],
    hints: ['You need at least 5 rows: two normal, two boundary, one erroneous.', 'Normal: 45, 72 · Boundary: 0, 100 · Erroneous: 101 or -1 · Expected: Valid, Valid, Valid, Valid, Invalid'] },
  { id: 'l2-busfare-case', level: 2, title: 'Bus routes with CASE', obj: 'S7 SO8 · CASE statement', view: 'editor', langs: ['pascal', 'pseudo'],
    brief: 'Minibus routes from St. George’s, Grenada: <b>1</b> → Grand Anse <b>$2.00</b>, <b>2</b> → Morne Rouge <b>$2.50</b>, <b>3</b> → True Blue <b>$3.00</b>. Any other number → <code>Invalid route</code>. Use a <b>CASE</b> statement.',
    starter: { pascal: "program BusRoutes;\n{ Fare for a route number, using CASE }\nvar\n  route: integer;\nbegin\n  write('Route number: ');\n  readln(route);\n  { use case route of ... }\n\nend.\n", pseudo: 'START\n   INPUT route\n   // use CASE route OF ... ENDCASE\n   \nSTOP\n' },
    tests: [{ in: ['1'], want: [2] }, { in: ['2'], want: [2.5] }, { in: ['3'], want: [3] }, { in: ['7'], want: ['invalid'] }],
    steps: [{ t: 'Use a CASE statement', c: x => x.F.cases >= 1, fb: () => 'Pascal: case route of 1: …; 2: …; end;   Pseudocode: CASE route OF … ENDCASE' }, { t: 'An ELSE / OTHERWISE branch for other numbers', c: x => x.F.caseOther >= 1 }, S_.tests('Correct fare for routes 1, 2, 3 and “Invalid route” for 7')],
    hints: ['CASE replaces a long chain of IFs when you test one variable against fixed values.', "case route of\n  1: writeln('Fare: $2.00');\n  2: writeln('Fare: $2.50');\n  3: writeln('Fare: $3.00');\nelse\n  writeln('Invalid route');\nend;"] },
  { id: 'l2-runrate', level: 2, title: 'Cricket run rate', obj: 'S7 SO8 · REPEAT-UNTIL validation', view: 'editor', langs: ALL3,
    brief: 'Calculate a team’s <b>run rate</b> (runs ÷ overs) for a T20/50-over match. The number of overs must be <b>1 to 50</b>: use a <b>REPEAT … UNTIL</b> loop to keep asking until it is valid. Display the run rate to 2 decimal places. <i>(Python has no REPEAT — use <code>while True:</code> … <code>break</code>.)</i>',
    starter: { pascal: "program RunRate;\n{ Run rate = runs / overs, with overs validated }\nvar\n  runs, overs: integer;\n  rate: real;\nbegin\n  write('Runs scored: ');\n  readln(runs);\n  { REPEAT asking for overs UNTIL they are from 1 to 50 }\n\nend.\n", python: '# Run rate = runs / overs, with overs validated\nruns = int(input("Runs scored: "))\n# keep asking for overs until they are from 1 to 50\n', pseudo: 'START\n   INPUT runs\n   // REPEAT ... UNTIL overs are from 1 to 50\n   \nSTOP\n' },
    tests: [{ in: ['250', '0', '60', '50'], want: [5] }, { in: ['180', '30'], want: [6] }, { in: ['99', '-3', '20'], want: [4.95] }],
    steps: [{ t: 'A validation loop (REPEAT…UNTIL, or while True with break in Python)', c: x => x.F.repeats >= 1 || (x.lang === 'python' && /while\s+True/.test(x.code) && /break/.test(x.code)), fb: () => 'repeat readln(overs); until (overs >= 1) and (overs <= 50);' }, { t: 'Calculate runs ÷ overs', c: x => /\//.test(x.code.replace(/\{[^}]*\}|#[^\n]*|\/\/[^\n]*/g, '')) }, S_.tests('Rejects 0 and 60, accepts 50 → run rate 5.00')],
    hints: ['The UNTIL condition says when the value is GOOD: overs between 1 and 50.', "repeat\n  write('Overs (1-50): ');\n  readln(overs);\nuntil (overs >= 1) and (overs <= 50);\nrate := runs / overs;\nwriteln('Run rate: ', rate:0:2);"] },

  // ===================== LEVEL 3 · CHALLENGE (SBA style) =====================
  { id: 'l3-election', level: 3, title: 'Student Council election', obj: 'S8 SO6–SO8 · SBA: arrays, selection, iteration', view: 'editor', langs: PP, par: 1500,
    brief: '<b>Problem statement:</b> The Sandbox Tree College Student Council election has four candidates: <b>1 Ava</b>, <b>2 Brandon</b>, <b>3 Chloe</b>, <b>4 Dwayne</b>. Votes are entered as candidate numbers; <b>0</b> ends the voting. Any other number prints <code>Invalid vote</code> and is not counted. Display each candidate’s name and votes, then <code>Winner: &lt;name&gt;</code>.<br><br>SBA requirements: arrays, selection, iteration, internal documentation, meaningful names.',
    starter: { pascal: "program StudentCouncil;\n{ Student Council election vote counter }\nvar\n  names: array[1..4] of string;\n  votes: array[1..4] of integer;\n  i, vote, winner: integer;\nbegin\n  names[1] := 'Ava';\n  names[2] := 'Brandon';\n  names[3] := 'Chloe';\n  names[4] := 'Dwayne';\n  { set every count to 0, read votes until 0, then display results and the winner }\n\nend.\n", python: '# Student Council election vote counter\nnames = ["Ava", "Brandon", "Chloe", "Dwayne"]\nvotes = [0, 0, 0, 0]\n# read votes until 0, then display results and the winner\n' },
    tests: [{ in: ['1', '2', '1', '3', '1', '0'], want: ['ava', 3, 'brandon', 1, 'chloe', 1, 'dwayne', 0, 'winner', 'ava'] }, { in: ['4', '4', '2', '9', '0'], want: ['invalid', 'dwayne', 2, 'winner', 'dwayne'] }, { in: ['3', '0'], want: ['chloe', 1, 'winner', 'chloe'] }],
    steps: [S_.array, S_.selIter, { t: 'Invalid votes are rejected and not counted', c: x => x.tests && x.tests.results[1] && x.tests.results[1].ok, fb: x => testFb(x) }, S_.tests('Counts and the winner are correct on every hidden test'), S_.comments(3), S_.names],
    hints: ['Use the vote as the array index: votes[vote] := votes[vote] + 1 (Python: votes[vote - 1] += 1).', 'After the loop, find the winner like a maximum: winner := 1; for i := 2 to 4 do if votes[i] > votes[winner] then winner := i;'] },
  { id: 'l3-relief', level: 3, title: 'Hurricane relief donations', obj: 'S8 SO6–SO8 · SBA: totals, max/min, validation, trace table', view: 'editor', langs: PP, par: 1800,
    brief: '<b>Problem statement:</b> After a hurricane, a relief drive in Roseau, Dominica, records donations. Enter amounts until <b>0</b>. A negative amount prints <code>Invalid amount</code> and is ignored. Then display, in this order: the <b>number</b> of donations, the <b>total</b>, the <b>highest</b>, the <b>lowest</b> and the <b>average</b> (2 dp). If there were no donations, display <code>No donations</code>.<br><br>For your SBA evidence, complete a trace table with the test data <b>50, -10, 30, 0</b> and export it.',
    starter: { pascal: "program ReliefDonations;\n{ Hurricane relief donation tracker }\nvar\n  amount, total, highest, lowest, average: real;\n  count: integer;\nbegin\n  count := 0;\n  total := 0;\n\nend.\n", python: '# Hurricane relief donation tracker\ncount = 0\ntotal = 0\n' },
    tests: [{ in: ['50', '120.5', '-10', '30', '0'], want: ['invalid', 3, 200.5, 120.5, 30, 66.83] }, { in: ['0'], want: ['no donations'] }, { in: ['25', '0'], want: [1, 25, 25, 25, 25] }],
    setup: () => { $('#trace-inputs').value = '50, -10, 30, 0'; },
    steps: [S_.selIter, S_.tests('Correct count, total, highest, lowest and average'), { t: 'Trace table filled in with 50, -10, 30, 0 — at least 80% correct', c: x => x.traceFill && x.traceFill.code === x.code && x.traceFill.inputs.join(',') === '50,-10,30,0' && x.traceFill.pct >= 80, fb: () => 'Trace table tab → ✍ I’ll fill it in → test data 50, -10, 30, 0 → Make blank table → fill → Mark.', show: '#pt-trace' }, S_.comments(3), S_.names, { t: 'Export your SBA evidence', c: x => x.flags.has('exported'), show: '#tb-export' }],
    hints: ['Give highest and lowest the FIRST valid donation, then compare each new one.', "Python:\namount = float(input())\nwhile amount != 0:\n    if amount < 0:\n        print(\"Invalid amount\")\n    else:\n        count += 1; total += amount\n        if count == 1 or amount > highest: highest = amount\n        if count == 1 or amount < lowest: lowest = amount\n    amount = float(input())"] },
  { id: 'l3-gebe', level: 3, title: 'Electricity bill', obj: 'S8 SO6–SO8 · SBA: constants, selection, validation', view: 'editor', langs: PP, par: 1500,
    brief: '<b>Problem statement:</b> Coral Power charges <b>$0.30 per kWh for the first 250 kWh</b> and <b>$0.40 per kWh above 250</b>, plus a <b>$15 service charge</b>. <b>5% government tax</b> is added to (energy + service). Read the customer’s name and kWh used (reject negative kWh with <code>Invalid</code> and ask again). Display the total bill to 2 dp. Use <b>constants</b> for the rates.',
    starter: { pascal: "program PowerBill;\n{ Coral Power electricity bill calculator }\nconst\n  RATE1 = 0.30;\n\nvar\n  customer: string;\n  kwh: integer;\n  energy, total: real;\nbegin\n\nend.\n", python: '# Coral Power electricity bill calculator\nRATE1 = 0.30\n' },
    tests: [{ in: ['Ms Lake', '200'], want: [78.75] }, { in: ['Mr Hodge', '400'], want: [157.5] }, { in: ['Ms Peters', '-5', '100'], want: ['invalid', 47.25] }, { in: ['Mr Gumbs', '250'], want: [94.5] }],
    steps: [{ t: 'At least 3 constants (rates, service charge, tax)', c: x => x.F.consts >= 3, fb: x => `Found ${x.F.consts} constant(s).` }, { t: 'Selection for the two price tiers', c: x => x.F.ifs >= 1 }, { t: 'A validation loop for negative kWh', c: x => x.F.loops >= 1 }, S_.tests('Correct bill for 200, 250, 400 and an invalid entry'), S_.comments(3), S_.names],
    hints: ['If kWh ≤ 250: energy = kWh × 0.30. Otherwise: energy = 250 × 0.30 + (kWh − 250) × 0.40.', 'total := (energy + SERVICE) * (1 + TAX);  with const SERVICE = 15; TAX = 0.05;'] },
  { id: 'l3-rainfall', level: 3, title: 'Hurricane season rainfall', obj: 'S7 SO8 / S8 SO8 · arrays, totals, maximum, counting', view: 'editor', langs: ALL3, par: 1500,
    brief: '<b>Problem statement:</b> Store the rainfall (mm) for each month of hurricane season — <b>June to November</b> — in an array. Display the <b>total</b>, the <b>average</b> (2 dp), the <b>name of the wettest month</b>, and <b>how many months were above the average</b>.',
