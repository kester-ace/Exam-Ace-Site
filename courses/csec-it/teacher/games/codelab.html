    const body = doc.replace(/^[\s\S]*?<body[^>]*>/i, '').replace(/<\/body>[\s\S]*$/i, '');
    const forWord = async () => { const box = document.createElement('div'); box.innerHTML = body; for (const sv of Array.from(box.querySelectorAll('svg'))) { try { const c = await SimSave.svgToCanvas(sv.outerHTML, 1.5, '#ffffff'); const im = document.createElement('img'); im.src = c.toDataURL('image/png'); im.width = Math.min(600, Math.round(c.width / 1.5)); im.alt = 'Flowchart'; sv.replaceWith(im); } catch (e) { sv.remove(); } } return box; };
    SimSave.dialog({ title: 'Save my SBA evidence', name: 'codelab_sba_evidence', sub: 'Problem statement, algorithm, flowchart, code, trace table and output in one file.', formats: [
      { ext: 'pdf', label: 'PDF document', note: 'Best for submitting · .pdf', make: n => { done(); return ssPagePdf(doc, 900, n.replace(/\.pdf$/i, '')); } },
      { ext: 'docx', label: 'Word document', note: 'Edit and add your own notes · .docx', make: async n => { done(); return SimSave.docx(await forWord(), { title: n.replace(/\.docx$/i, ''), footer: 'Code Lab · CSEC Information Technology', pageNumbers: true }); } },
      { ext: 'html', label: 'Web page', note: 'Opens in any browser · .html', make: () => { done(); return SimSave.text(doc, 'text/html;charset=utf-8'); } }] });
  },
  exportEvidence(only) {
    const name = $('#ex-name').value.trim(), school = $('#ex-school').value.trim(), prob = $('#ex-prob').value.trim();
    const inputs = $('#ex-data').value.trim() ? $('#ex-data').value.split(/\s*,\s*/) : [];
    Store.data.settings.student = name; Store.data.settings.school = school; Store.save();
    const lang = Lab.lang, code = Lab.getCode();
    let ir = null, pseudo = '', svg = '<p><i>Fix the program’s errors to generate a flowchart.</i></p>', other = '', otherLang = lang === 'pascal' ? 'python' : 'pascal';
    try {
      ir = CodeGen.toIR(lang, code);
      pseudo = lang === 'pseudo' ? code : CodeGen.text(CodeGen.generate('pseudo', ir));
      let fir = ir; try { fir = Pseudo.parse(pseudo); } catch (e) { }
      svg = Flow.toSVG(Flow.fromIR(fir), { inline: true, mid: 'e', label: 'Flowchart' });
      other = CodeGen.text(CodeGen.generate(otherLang, ir, { title: ir.title || 'Program' }));
    } catch (e) { }
    const r = runProgram(ENGINES[lang], code, inputs);
    const tr = r.trace;
    const traceHTML = tr.rows.length ? `<table><tr><th>Line</th>${tr.cols.map(c => `<th>${esc(c)}</th>`).join('')}<th>Output</th></tr>${tr.rows.slice(0, 300).map(row => `<tr><td>${row.line}</td>${tr.cols.map(c => `<td>${c in row.cells ? esc(row.cells[c]) : ''}</td>`).join('')}<td>${esc(row.out)}</td></tr>`).join('')}</table>` : '<p><i>No trace rows.</i></p>';
    let studentTrace = '';
    if (this.traceFill && this.traceFill.code === code) studentTrace = `<p>Student’s own trace table (filled in and marked in Code Lab): <b>${this.traceFill.right} / ${this.traceFill.total} cells correct (${this.traceFill.pct}%)</b> with test data ${esc(this.traceFill.inputs.join(', '))}.</p>`;
    const F = Analyse.features(lang, code);
    const ipoHTML = Planner.ipo && Planner.ipo.allCards().some(c => Planner.ipo.place[c.id]) ? `<h2>IPO chart</h2>${Planner.ipoHTML()}` : '';
    const tpHTML = Planner.rows && Planner.rows.some(rw => rw.value) ? `<h2>Test-data plan</h2>${Planner.tableHTML()}` : '';
    const doc = `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SBA evidence – ${esc(name || 'student')}</title>
<style>body{font-family:Arial,Helvetica,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#111;line-height:1.45}h1{border-bottom:3px solid #F5C542;padding-bottom:6px}h2{color:#0B1A46;margin-top:28px;border-bottom:1px solid #ccc}pre{background:#f6f8fa;border:1px solid #ddd;padding:10px;overflow:auto;font:12.5px/1.45 Consolas,Menlo,monospace;white-space:pre}table{border-collapse:collapse;font:12.5px Consolas,Menlo,monospace}td,th{border:1px solid #999;padding:3px 8px;text-align:center}th{background:#eef}.meta td{text-align:left;font-family:Arial}.svgbox{overflow:auto;border:1px solid #ddd;padding:8px}@media print{h2{page-break-after:avoid}pre,table,.svgbox{page-break-inside:avoid}}</style></head><body>
<h1>Programming SBA evidence</h1>
<table class="meta"><tr><td><b>Student</b></td><td>${esc(name)}</td></tr><tr><td><b>School / centre</b></td><td>${esc(school)}</td></tr><tr><td><b>Task</b></td><td>${esc(this.mission ? this.mission.title : 'Free practice')}</td></tr><tr><td><b>Language</b></td><td>${LANG_NAMES[lang]}</td></tr><tr><td><b>Date</b></td><td>${new Date().toLocaleDateString('en-GB')}</td></tr></table>
<h2>1. Problem statement</h2><p>${esc(prob).replace(/\n/g, '<br>')}</p>${ipoHTML}
<h2>2. Algorithm (pseudocode)</h2><pre>${esc(pseudo || '(not available)')}</pre>
<h2>3. Flowchart</h2><div class="svgbox">${svg}</div>
<h2>4. Program code (${LANG_NAMES[lang]})</h2><pre>${esc(code)}</pre>
<p>Checklist: selection ${F.selection ? '✔' : '✘'} · iteration ${F.loops ? '✔' : '✘'} · arrays ${F.arrays ? '✔' : '—'} · comments (internal documentation): ${F.comments} · meaningful variable names ${F.meaningful ? '✔' : '✘'}</p>
${other ? `<h2>5. Equivalent program in ${LANG_NAMES[otherLang]}</h2><pre>${esc(other)}</pre>` : ''}
<h2>6. Trace table (test data: ${esc(inputs.join(', ') || 'none')})</h2>${studentTrace}${traceHTML}
<h2>7. Console output</h2><pre>${esc(r.output || '')}${r.error ? '\n' + esc(r.error) : ''}</pre>${tpHTML}
<p style="margin-top:30px;color:#666;font-size:12px">Generated with Code Lab · Kester Small</p></body></html>`;
    if (only) return doc;
    download('codelab_sba_evidence.html', doc, 'text/html');
    this.flag('exported'); this.award('export'); toast('SBA evidence downloaded — open it, or use Save as PDF or Word.');
  }
};
function closeModal() { const b = $('.modal-back'); if (b) b.remove(); }
/* ---------- saved progress (GameSave) ----------
   XP, stars, badges, arcade bests, settings and the code typed for each mission were already kept under STORE_KEY.
   This also keeps the mission that was open: its view and level, hints and checks used, what has been run, and the
   answers placed in sort / order / choice tasks, the IPO chart, the test-data plan and the converter's pseudocode.
   A timed challenge restarts its clock. "Start over" (GameSave, also Reset progress) clears everything. */
function gsCodelab() {
  if (!window.GameSave) return;
  GameSave.register([STORE_KEY, STORE_KEY + '.*']);
  let off = false, qT = 0, pending = null;
  const okView = w => typeof w === 'string' && /^[a-z]+$/.test(w) && !!document.getElementById('view-' + w);
  const small = o => { try { const j = JSON.stringify(o); return j && j.length < 200000 ? JSON.parse(j) : null; } catch (e) { return null; } };
  const boardState = b => b ? { place: Object.assign({}, b.place), custom: small(b.custom) || [] } : null;
  function get() {
    if (off) return undefined;
    const startOn = !$('#start').classList.contains('hidden');
    const m = App.mission;
    if (!m) return { v: 1, free: !startOn, view: App.view, level: App.level };
    const t = App.task || {};
    return { v: 1, mission: m.id, view: App.view, level: App.level, hints: App.hintsUsed, fails: App.failedChecks, showMe: App.showMeUsed, hintShown: App.hintShown || 0,
      flags: [...App.flags], lastRun: small(App.lastRun), lastTrace: small(App.lastTrace),
      task: { board: boardState(t.board), order: t.list ? t.list.items.map(it => it.key) : null, choice: typeof t.choice === 'number' ? t.choice : null },
      ipo: boardState(Planner.ipo), rows: small(Planner.rows), conv: m.view === 'conv' && Conv.ped ? Conv.ped.getValue() : null };
  }
  GameSave.persist({ key: STORE_KEY + '.session', get, set: v => { pending = v; }, welcome: false });
  GameSave.onReset(() => { off = true; clearTimeout(qT); try { history.replaceState(null, '', location.pathname); } catch (e) { } });
  const sc0 = App.stateChanged;
  App.stateChanged = function () { sc0.apply(this, arguments); clearTimeout(qT); qT = setTimeout(() => { if (!off) GameSave.save(); }, 800); };
  const v = pending; if (!v || v.v !== 1) return;
  const q = new URLSearchParams(location.search), qm = q.get('mission'), ql = +q.get('level'), qf = q.get('mode') === 'free';
  const setBoard = (b, s) => {
    if (!b || !s || typeof s.place !== 'object') return;
    if (Array.isArray(s.custom) && b.o && b.o.allowAdd) b.custom = s.custom.filter(c => c && c.id && typeof c.text === 'string');
    const ids = new Set(b.allCards().map(c => c.id));
    Object.keys(s.place).forEach(id => { if (ids.has(id)) b.place[id] = s.place[id]; });
    b.render();
  };
  try {
    if (v.mission) {
      const m = MISSIONS.find(x => x.id === v.mission);
      if (!m || (qm && qm !== m.id) || qf || (ql && ql !== m.level)) return;
      if (App.mission !== m) { App.hideStart(); App.load(m); }
      App.hintsUsed = +v.hints || 0; App.failedChecks = +v.fails || 0; App.showMeUsed = +v.showMe || 0; App.hintShown = +v.hintShown || 0;
      if (Array.isArray(v.flags)) App.flags = new Set(v.flags.filter(f => typeof f === 'string'));
      const code = Lab.getCode();
      if (v.lastRun && v.lastRun.code === code && v.lastRun.lang === Lab.lang) App.lastRun = v.lastRun;
      if (v.lastTrace && v.lastTrace.code === code && v.lastTrace.lang === Lab.lang) App.lastTrace = v.lastTrace;
      const t = App.task || {}, vt = v.task || {};
      setBoard(t.board, vt.board);
      if (t.list && Array.isArray(vt.order) && vt.order.length === t.list.items.length) {
        const by = new Map(t.list.items.map(it => [it.key, it])); const items = vt.order.map(k => by.get(k));
        if (items.every(Boolean) && new Set(vt.order).size === items.length) { t.list.items = items; t.list.render(); }
      }
      if (typeof vt.choice === 'number' && $$('#task-box .choice').length > vt.choice) { t.choice = vt.choice; $$('#task-box .choice').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === vt.choice))); }
      setBoard(Planner.ipo, v.ipo);
      if (Array.isArray(v.rows) && v.rows.length && Planner.rows) {
        Planner.rows = v.rows.slice(0, 40).map(r => ({ type: String(r && r.type || 'Normal'), value: String(r && r.value != null ? r.value : ''), expected: String(r && r.expected != null ? r.expected : ''), actual: String(r && r.actual != null ? r.actual : '') }));
        Planner.renderTest();
      }
      if (typeof v.conv === 'string' && v.conv && m.view === 'conv') Conv.setPseudo(v.conv);
      if (okView(v.view)) App.go(v.view);
      App.renderPanel(); App.stateChanged();
    } else if (v.free) {
      if (qm || ql || qf) return;
      App.hideStart();
      if (v.level >= 1 && v.level <= 3) App.setLevel(v.level);
      if (okView(v.view)) App.go(v.view);
    } else return;
    setTimeout(() => GameSave.toast('Welcome back! Your progress was restored.'), 400);
  } catch (e) { }
}
window.addEventListener('DOMContentLoaded', () => { App.init(); gsCodelab(); });
