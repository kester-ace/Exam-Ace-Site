<!DOCTYPE html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Lab · CSEC Information Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13265e;--gold:#F5C542;--gold2:#ffd970;--ink:#EAF0FF;--muted:#AFC0EA;
  --ok:#3ddc97;--bad:#ff8a8a;
  --disp:"Bricolage Grotesque","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --wblue:#185ABD;--wblue2:#2B579A;--wbluel:#E8F0FB;--rib:#F9F9F9;--ribline:#E1DFDD;--canvas:#E3E3E3;--txt:#242424;--txt2:#555;
  --docfont:Aptos,Calibri,Carlito,"Segoe UI",Arial,sans-serif;
  --headfont:"Aptos Display",Aptos,Calibri,Carlito,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui);color:var(--txt);background:var(--navy);font-size:13px}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #0F6CBD;outline-offset:1px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ============ START SCREEN ============ */
#start{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#1d3a8f55,transparent),linear-gradient(160deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);z-index:50}
#start .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
.brandrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.appicon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#185ABD;color:#fff;font:800 19px/1 var(--ui);box-shadow:inset 0 -3px 0 #0e3f8a}
.appicon.sm{width:18px;height:18px;border-radius:4px;font-size:11px;box-shadow:none}
#start h1{font-family:var(--disp);font-size:clamp(34px,5vw,58px);margin:14px 0 6px;line-height:1.02;letter-spacing:-.01em}
#start h1 span{color:var(--gold)}
#start .pitch{font-size:18px;max-width:720px;color:#d7e1ff;margin:0 0 14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.objs li{border:1px solid #2c4590;background:#0d1d50;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#cfdcff}
.objs li b{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{position:relative;text-align:left;border:1px solid #2b4391;background:linear-gradient(180deg,#10225c,#0b1844);border-radius:18px;padding:20px 18px 18px;color:var(--ink);cursor:pointer;font-family:var(--body);transition:transform .15s,border-color .15s;min-height:190px}
.lvcard:hover,.lvcard:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.lvcard .em{font-size:30px}
.lvcard h2{font-family:var(--disp);margin:6px 0 4px;font-size:22px}
.lvcard p{margin:0 0 12px;color:#c4d2fb;font-size:14.5px}
.lvcard .bar{height:8px;border-radius:9px;background:#203a86;overflow:hidden}
.lvcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);width:0}
.lvcard .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#b8c8f5}
.startbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.gbtn{border:1px solid #33509f;background:#0f2160;color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.gbtn:hover{border-color:var(--gold)}
.gbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.xpline{display:flex;gap:18px;align-items:center;margin:4px 0 18px;color:#cfdcff;font-size:14px;flex-wrap:wrap}
.xpline b{color:var(--gold);font-family:var(--disp);font-size:20px}
.credit{margin-top:28px;color:#8fa3d8;font-size:12.5px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.mcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0e1f58;border:1px solid #2a428e;border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;font-family:var(--body)}
.mcard:hover,.mcard:focus-visible{border-color:var(--gold)}
.mcard .num{flex:none;width:34px;height:34px;border-radius:10px;background:#1b3277;display:grid;place-items:center;font:700 15px var(--disp);color:var(--gold)}
.mcard .done{background:var(--gold);color:#1b1500}
.mcard h3{margin:0 0 3px;font:700 15.5px var(--body)}
.mcard .ob{font-size:12px;color:#9fb4ec}
.mcard .st{margin-left:auto;font-size:14px;white-space:nowrap;color:var(--gold)}
.backlink{background:none;border:0;color:var(--gold);font:600 14px var(--body);cursor:pointer;padding:6px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.badge{border:1px solid #2a428e;border-radius:14px;padding:12px;text-align:center;background:#0e1f58;color:#c9d6fb;font-size:13px}
.badge .bi{font-size:28px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--gold);color:#fff}
.badge.on .bi{filter:none;opacity:1}
.badge b{display:block;margin:4px 0 2px;color:inherit}
.lvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}

/* ============ COURSE BAR ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#coursebar{flex:none;height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);font-family:var(--body);border-bottom:1px solid #1d2f6a;overflow-x:auto;overflow-y:hidden}
#coursebar .cbtn{flex:none;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:9px;padding:5px 10px;cursor:pointer;font:600 13px var(--body);white-space:nowrap}
#coursebar .cbtn:hover{border-color:var(--gold)}
#coursebar .cbtn[aria-pressed=true]{background:var(--gold);color:#1b1500}
#coursebar .ctitle{flex:1;min-width:120px;font:700 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#coursebar .ctitle small{font:400 12px var(--body);color:var(--muted);margin-left:6px}
#coursebar .xp{flex:none;color:var(--gold);font:700 14px var(--disp);white-space:nowrap}
.dial{flex:none;display:flex;border:1px solid #2c4590;border-radius:9px;overflow:hidden}
.dial button{border:0;background:#0f2160;color:var(--ink);padding:5px 9px;cursor:pointer;font:600 12.5px var(--body);white-space:nowrap}
.dial button:hover{background:#1a2f75}
.dial .lv{padding:5px 9px;background:#071237;color:var(--gold);font:700 12.5px var(--body);white-space:nowrap}
#appmain{flex:1;display:flex;min-height:0;position:relative}
#taskbar{flex:none;height:34px;display:flex;align-items:center;justify-content:center;gap:4px;background:#dfe6f0;border-top:1px solid #c5ccd6}
#taskbar button{width:40px;height:30px;border:0;border-radius:5px;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative}
#taskbar button:hover{background:#cdd6e3}
#taskbar button.on::after{content:"";position:absolute;bottom:1px;left:14px;right:14px;height:3px;border-radius:2px;background:#0078D4}
.winlogo{display:grid;grid-template-columns:8px 8px;gap:2px}
.winlogo i{width:8px;height:8px;background:#0078D4;display:block}
.globe{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7fd0ff,#0a7ac2);position:relative;overflow:hidden}
.globe::before{content:"";position:absolute;inset:4px 0;border-top:1.5px solid #ffffffa0;border-bottom:1.5px solid #ffffffa0}
.globe::after{content:"";position:absolute;left:6px;right:6px;top:0;bottom:0;border-left:1.5px solid #ffffffa0;border-right:1.5px solid #ffffffa0;border-radius:50%}

/* ============ WORD WINDOW ============ */
#wordwin{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;position:relative}
#titlebar{flex:none;height:40px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--wblue);color:#fff;font-size:12.5px;user-select:none}
#titlebar .tbtn{border:0;background:transparent;color:#fff;height:30px;min-width:30px;border-radius:4px;cursor:pointer;display:grid;place-items:center;padding:0 5px}
#titlebar .tbtn:hover{background:#ffffff26}
#titlebar .tbtn[aria-disabled=true]{opacity:.5}
.autosave{display:flex;align-items:center;gap:6px;padding:0 4px;white-space:nowrap}
.tog{width:34px;height:18px;border-radius:9px;border:1px solid #fff;background:transparent;position:relative;cursor:pointer;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-checked=true]{background:#fff}
.tog[aria-checked=true]::after{left:19px;background:var(--wblue)}
#docTitle{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;cursor:default}
#docTitle small{opacity:.85;margin-left:4px}
#tsearch{position:relative;width:min(36vw,380px)}
#tsearch input{width:100%;height:28px;border-radius:6px;border:0;padding:0 10px 0 30px;font:12.5px var(--ui);background:#ffffffe6;color:#222}
#tsearch svg{position:absolute;left:9px;top:7px}
#tsearchRes{position:absolute;left:0;right:0;top:31px;background:#fff;color:#222;border-radius:6px;box-shadow:0 8px 24px #0004;z-index:60;padding:4px;max-height:320px;overflow:auto}
#tsearchRes button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:4px;cursor:pointer}
#tsearchRes button:hover,#tsearchRes button.on{background:#EBF3FC}
#tsearchRes small{color:#666;margin-left:6px}
.avatar{width:26px;height:26px;border-radius:50%;background:#F5C542;color:#1b1500;display:grid;place-items:center;font-weight:700;font-size:11px}

#tabsrow{flex:none;display:flex;align-items:flex-end;gap:2px;height:32px;padding:0 6px;background:#fff;border-bottom:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.rtab{flex:none;border:0;background:transparent;height:30px;padding:0 10px;cursor:pointer;color:#333;font-size:13px;position:relative;border-radius:4px 4px 0 0;white-space:nowrap}
.rtab:hover{background:#f0f0f0}
.rtab[aria-selected=true]{color:var(--wblue);font-weight:600}
.rtab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:2px;background:var(--wblue)}
.rtab.file{color:#333}
.rtab.ctx{color:#7a3e9d}
.rtab.ctx[aria-selected=true]{color:#7a3e9d}
.rtab.ctx[aria-selected=true]::after{background:#7a3e9d}
.tabsright{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:3px}
.tabsright button{border:1px solid #c8c8c8;background:#fff;border-radius:5px;height:26px;padding:0 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.tabsright .share{background:var(--wblue);color:#fff;border-color:var(--wblue)}

#ribbon{flex:none;margin:0 6px 4px;background:var(--rib);border:1px solid var(--ribline);border-radius:8px;height:98px;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.rpanel{display:flex;align-items:stretch;min-width:max-content}
.rgroup{display:flex;flex-direction:column;padding:4px 6px 0;border-right:1px solid #e3e3e3;position:relative}
.rgroup .gbody{flex:1;display:flex;gap:2px;align-items:flex-start}
.rgroup .gname{height:18px;font-size:11.5px;color:#555;text-align:center;white-space:nowrap;padding:0 14px}
.rgroup .launch{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border:0;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;border-radius:2px}
.rgroup .launch:hover{background:#e3e3e3}
.col{display:flex;flex-direction:column;gap:1px}
.row{display:flex;gap:1px;align-items:center}
.rb{border:1px solid transparent;background:transparent;border-radius:4px;cursor:pointer;color:#242424;display:flex;align-items:center;gap:4px;padding:0 4px;height:24px;font-size:12px;white-space:nowrap;position:relative}
.rb:hover{background:#e6e6e6;border-color:#dcdcdc}
.rb[aria-pressed=true]{background:#dbe6f5;border-color:#b9cdea}
.rb[aria-disabled=true]{opacity:.45;cursor:default}
.rb.lg{flex-direction:column;height:74px;min-width:44px;max-width:76px;padding:4px 3px 2px;white-space:normal;text-align:center;line-height:1.1;justify-content:flex-start;gap:3px}
.rb.lg .ico{width:32px;height:32px;display:grid;place-items:center}
.rb.lg .lbl{font-size:11.5px}
.rb .ico{width:18px;height:18px;display:grid;place-items:center;flex:none}
.rb .car{font-size:9px;opacity:.75}
.rb.ic{width:26px;padding:0;justify-content:center}
.rb.ic.dd{width:36px;gap:0}
.rb.split{padding-right:0}
.rbwrap{display:flex;border-radius:4px}
.rbwrap:hover{outline:1px solid #dcdcdc}
.rbwrap .rb{border-radius:4px 0 0 4px}
.rbwrap .rb.arrow{border-radius:0 4px 4px 0;width:14px;padding:0;justify-content:center}
.rbwrap.lgw{flex-direction:column}
.rbwrap.lgw .rb.lg{height:44px;border-radius:4px 4px 0 0}
.rbwrap.lgw .rb.arrow{width:auto;height:30px;border-radius:0 0 4px 4px;flex-direction:column;font-size:11.5px;line-height:1.05;text-align:center;white-space:normal;max-width:76px}
.combo{display:flex;align-items:center;border:1px solid #c8c8c8;border-radius:4px;background:#fff;height:24px}
.combo input{border:0;height:22px;font:12px var(--ui);padding:0 4px;width:100%;background:transparent;color:#242424}
.combo button{border:0;background:transparent;width:16px;height:22px;cursor:pointer;font-size:9px}
.combo:focus-within{border-color:var(--wblue)}
.gallery{display:flex;border:1px solid #d6d6d6;border-radius:4px;background:#fff;height:72px;overflow:hidden}
.gallery .gitems{display:flex;flex-wrap:wrap;width:100%;overflow:hidden}
.gallery .gi{border:1px solid transparent;background:#fff;cursor:pointer;margin:2px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.gallery .gi:hover{border-color:#9bbbe6;background:#f3f8fe}
.gallery .gi[aria-pressed=true]{border-color:var(--wblue);background:#e3eefb}
.gallery .gside{display:flex;flex-direction:column;border-left:1px solid #e3e3e3}
.gallery .gside button{flex:1;border:0;background:#fafafa;width:16px;cursor:pointer;font-size:9px;padding:0}
.gallery .gside button:hover{background:#e6e6e6}
.stylegi{width:70px;height:64px}
.stylegi .pv{height:38px;display:flex;align-items:center;justify-content:center;width:100%;white-space:nowrap;overflow:hidden;font-family:var(--docfont);color:#000}
.stylegi .nm{font-size:11px;color:#444}
.spin{display:flex;align-items:center;gap:4px;font-size:12px;height:24px}
.spin input{width:58px;height:22px;border:1px solid #c8c8c8;border-radius:4px;padding:0 4px;font:12px var(--ui)}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;height:22px;cursor:pointer;white-space:nowrap}
.chk input{margin:0}
.colorbar{display:block;width:16px;height:4px;margin-top:-3px}
.icoA{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1}

#msgbar{flex:none}
.mbar{display:flex;align-items:center;gap:12px;padding:6px 12px;font-size:12.5px;border-bottom:1px solid #e0c96a;background:#FFF4CE;color:#3b2f00}
.mbar b{letter-spacing:.03em}
.mbar button{border:1px solid #b9a24a;background:#fff;border-radius:4px;padding:3px 10px;cursor:pointer}
.mbar.blue{background:#e7f0fb;border-color:#b3cdee;color:#0b315f}
.mbar.blue button{border-color:#8eb2e2}

#workarea{flex:1;display:flex;min-height:0;position:relative;background:var(--canvas)}
#navpane,#sidepane{flex:none;width:280px;background:#fff;border-right:1px solid #dcdcdc;display:flex;flex-direction:column;min-height:0}
#sidepane{border-right:0;border-left:1px solid #dcdcdc;width:300px}
.panehead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:15px;font-weight:600}
.panehead button{border:0;background:transparent;cursor:pointer;width:26px;height:26px;border-radius:4px}
.panehead button:hover{background:#eee}
.panebody{flex:1;overflow:auto;padding:4px 12px 14px;font-size:12.5px}
.panebody h4{margin:12px 0 6px;font-size:13px}
.pbtn{border:1px solid #c8c8c8;background:#fff;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.pbtn:hover{background:#f3f3f3}
.pbtn.pri{background:var(--wblue);color:#fff;border-color:var(--wblue)}
.pbtn.pri:hover{background:#124a9e}
.pbtn[disabled]{opacity:.5;cursor:default}
.sugg{display:block;width:100%;text-align:left;border:1px solid #d9d9d9;background:#fff;border-radius:4px;padding:6px 8px;margin:4px 0;cursor:pointer;font-weight:600}
.sugg:hover{background:#EBF3FC;border-color:#9bbbe6}
.ctxbox{border:1px solid #e3e3e3;background:#fafafa;border-radius:6px;padding:8px;line-height:1.5}
.ctxbox mark{background:none;border-bottom:2px wavy #d13438;color:inherit;font-weight:700}
.ctxbox mark.g{border-bottom:3px double #2e5fd8}
.nres{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;background:#fff;padding:6px 4px;cursor:pointer;font-size:12.5px}
.nres:hover{background:#f3f8fe}
.nres b{background:#ffe86b}
.navtabs{display:flex;gap:12px;border-bottom:1px solid #e3e3e3;margin:6px 0}
.navtabs button{border:0;background:none;padding:4px 0;cursor:pointer;border-bottom:2px solid transparent}
.navtabs button[aria-selected=true]{border-color:var(--wblue);color:var(--wblue);font-weight:600}
.navsearch{width:100%;height:28px;border:1px solid #c8c8c8;border-radius:4px;padding:0 8px;font:12.5px var(--ui)}
.hlist button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 6px;cursor:pointer;border-radius:3px}
.hlist button:hover{background:#eef4fc}
.hlist .l2{padding-left:20px}

#canvasWrap{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#ruler{flex:none;height:22px;background:var(--canvas);position:relative;overflow:hidden;border-bottom:1px solid #d4d4d4}
#rulerInner{position:absolute;top:3px;height:16px;background:#fff;border:1px solid #c9c9c9}
#rulerInner .mz{position:absolute;top:0;bottom:0;background:#d6d6d6}
#rulerInner .tk{position:absolute;top:10px;width:1px;height:4px;background:#888}
#rulerInner .tk.h{top:7px;height:6px}
#rulerInner .nb{position:absolute;top:1px;font-size:9px;color:#555;transform:translateX(-50%)}
.rmk{position:absolute;width:10px;height:7px;cursor:ew-resize;z-index:2;transform:translateX(-5px)}
.rmk.fl{top:-1px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid #6d6d6d;width:0;height:0}
.rmk.li{top:9px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid #6d6d6d;width:0;height:0}
.rmk.ri{top:9px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid #6d6d6d;width:0;height:0}
#canvas{flex:1;overflow:auto;position:relative;scrollbar-gutter:stable}
#sizer{position:relative;margin:0 auto;padding:18px 0 40px}
#pagesWrap{position:relative;transform-origin:0 0;width:max-content;margin:0 auto}
#pagebg{position:absolute;inset:0;pointer-events:none;z-index:0}
.pg{position:absolute;background:#fff;box-shadow:0 0 0 1px #d0d0d0,0 2px 6px #0000001f}
.pg .pgborder{position:absolute;inset:24px;border:3px double #1f3864}
.pg .wm{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.pg .wm span{transform:rotate(-40deg);font:700 92px var(--headfont);color:#00000014;white-space:nowrap}

/* ======= DOCUMENT ======= */
#doc{position:relative;z-index:1;outline:none;font-family:var(--docfont);font-size:12pt;color:#000;line-height:1.35;caret-color:#000;width:max-content}
#doc ::selection{background:#c6dcf7}
.sect{position:relative;background:transparent;padding:0;box-sizing:border-box;tab-size:.5in;-moz-tab-size:.5in}
.sect.np{margin-top:20px}
.sect:first-child{margin-top:0}
.webview .sect{width:auto!important;max-width:900px;margin:0 auto 20px!important;background:#fff;padding:24px 36px!important;box-shadow:0 1px 4px #0002}
#doc p,#doc h1,#doc h2,#doc h3,#doc li{margin:0 0 8pt;min-height:1em;overflow-wrap:break-word}
#doc h1{font:400 20pt/1.2 var(--headfont);color:#0F4761;margin:18pt 0 4pt}
#doc h2{font:400 16pt/1.2 var(--headfont);color:#0F4761;margin:8pt 0 4pt}
#doc h3{font:400 14pt/1.2 var(--headfont);color:#0F4761;margin:8pt 0 4pt}
#doc p[data-style=Title]{font:400 28pt/1.1 var(--headfont);letter-spacing:-.5pt;margin:0 0 4pt}
#doc p[data-style=Subtitle]{font-size:14pt;color:#595959;letter-spacing:.5pt;margin-bottom:8pt}
#doc p[data-style=NoSpacing]{margin:0;line-height:1.17}
#doc p[data-style=Quote]{font-style:italic;color:#404040;text-align:center;margin:10pt .6in}
#doc p[data-style=Caption]{font-size:9pt;font-style:italic;color:#0E2841;margin-bottom:10pt}
#doc ul,#doc ol{margin:0 0 8pt;padding-left:.5in}
#doc li{margin-bottom:0}
#doc li>p{margin:0}
#doc a{color:#467886;text-decoration:underline}
#doc table.wt{border-collapse:collapse;margin:0 0 8pt;width:100%;table-layout:fixed}
#doc table.wt td,#doc table.wt th{border:1px solid #000;padding:0 5pt;vertical-align:top;min-width:20px;font-weight:inherit;text-align:inherit}
#doc table.wt td>p,#doc table.wt th>p{margin:0}
#doc .wt.nogrid td{border-color:transparent}
#doc .cols{column-gap:.5in;margin:0 0 0}
#doc .cols[data-cols="2"]{column-count:2}
#doc .cols[data-cols="3"]{column-count:3}
#doc .cols.line{column-rule:1px solid #000}
#doc .colbreak{break-after:column;height:0}
#doc .pbreak{height:0;overflow:visible;user-select:none;position:relative}
#doc img.wpic{max-width:100%;cursor:default}
#doc img.wpic[data-wrap=inline]{vertical-align:bottom}
#doc img.wpic[data-wrap=square],#doc img.wpic[data-wrap=tight],#doc img.wpic[data-wrap=through]{float:left;margin:2pt 10pt 4pt 0}
#doc img.wpic[data-wrap=square][data-side=right],#doc img.wpic[data-wrap=tight][data-side=right],#doc img.wpic[data-wrap=through][data-side=right]{float:right;margin:2pt 0 4pt 10pt}
#doc img.wpic[data-wrap=tight]{shape-outside:margin-box}
#doc img.wpic[data-wrap=topbottom]{display:block;margin:4pt 0}
#doc img.wpic[data-wrap=behind]{position:relative;z-index:-1;margin-right:-100%;opacity:.95}
#doc img.wpic[data-wrap=front]{position:relative;z-index:3;margin-right:-60%}
#doc img.wpic.ps1{border:6px solid #fff;box-shadow:0 1px 4px #0006}
#doc img.wpic.ps2{box-shadow:5px 5px 6px #0005}
#doc img.wpic.ps3{border-radius:16px}
#doc img.wpic.ps4{border-radius:50%}
#doc img.wpic.ps5{border:3px solid #000}
#doc img.wpic.ps6{filter:drop-shadow(0 6px 3px #0004);transform:perspective(400px) rotateY(-8deg)}
#doc img.wpic.selpic{outline:1px solid #6b6b6b;outline-offset:0}
#doc .dropcap{float:left;font-size:3.6em;line-height:.85;margin:3pt 4pt 0 0;font-family:var(--headfont)}
#doc .dropcap.margin{margin-left:-.75in;width:.7in}
#doc .tab{white-space:pre}
#doc .fnref{font-size:65%;vertical-align:super;line-height:0;color:#000;cursor:default;user-select:all}
#doc .enref{font-size:65%;vertical-align:super;line-height:0}
#doc .cite{color:inherit}
#doc .bm{display:inline}
#doc .mf{background:transparent}
#doc.hlmf .mf,#doc.hlmf .mfb{background:#d9d9d9}
#doc .mfb{display:inline}
#doc .fld{}
/* track changes */
#doc ins.tc{text-decoration:underline;color:var(--tcc,#b5179e);text-decoration-color:currentColor}
#doc del.tc{text-decoration:line-through;color:var(--tcc,#b5179e)}
#doc ins.tc[data-a2="1"],#doc del.tc[data-a2="1"]{--tcc:#0b7a75}
#doc ins.tc[data-a2="2"],#doc del.tc[data-a2="2"]{--tcc:#c55a11}
#doc.mk-simple ins.tc{text-decoration:none;color:inherit}
#doc.mk-simple del.tc{display:none}
#doc.mk-none ins.tc{text-decoration:none;color:inherit}
#doc.mk-none del.tc{display:none}
#doc.mk-orig ins.tc{display:none}
#doc.mk-orig del.tc{text-decoration:none;color:inherit}
#doc .tcbar{position:absolute;left:-18px;width:2px;background:#d13438}
#doc .cmt{background:#fbe8a6;border-bottom:1px solid #e1b600}
#doc .cmt.act{background:#f7d55c}
#doc.nocmt .cmt{background:none;border:0}
/* TOC & biblio */
#doc .toc,#doc .biblio{margin:0 0 10pt;position:relative;cursor:default}
#doc .toc:hover,#doc .biblio:hover{outline:1px solid #b9b9b9;outline-offset:3px}
#doc .toc-title{font:400 16pt/1.2 var(--headfont);color:#0F4761;margin:0 0 8pt}
#doc .toc-e{display:flex;align-items:baseline;gap:2px;margin:0 0 5pt}
#doc .toc-e.l2{padding-left:.22in}
#doc .toc-e .dots{flex:1;border-bottom:1.5px dotted #000;margin:0 3px;transform:translateY(-3px)}
#doc .toc-e .pn{min-width:14px;text-align:right}
#doc .tocbar{position:absolute;top:-26px;left:-4px;display:none;gap:4px;background:#fff;border:1px solid #b9b9b9;border-radius:3px;padding:2px;font:12px var(--ui);z-index:4}
#doc .toc:hover .tocbar,#doc .toc.focus .tocbar{display:flex}
#doc .tocbar button{border:0;background:#fff;cursor:pointer;padding:2px 6px;border-radius:2px;font:12px var(--ui)}
#doc .tocbar button:hover{background:#e8e8e8}
#doc .biblio .bt{font:400 16pt/1.2 var(--headfont);color:#0F4761;margin:0 0 8pt}
#doc .biblio .be{padding-left:.5in;text-indent:-.5in;margin:0 0 8pt}
/* content controls */
#doc .cc{display:inline;border:1px solid transparent;border-radius:2px;position:relative;cursor:text}
#doc .cc:hover,#doc .cc.cur{border-color:#8aa4c8;background:#f1f5fb}
#doc .cc.design{border-color:#5b8bd6}
#doc .cc .cct{display:none;position:absolute;left:-1px;top:-17px;font:11px/15px var(--ui);background:#5b8bd6;color:#fff;padding:0 5px;border-radius:2px 2px 0 0;white-space:nowrap;user-select:none;pointer-events:none}
#doc .cc.cur .cct,#doc .cc.design .cct{display:block}
#doc .cc .ccb{outline:none;padding:0 1px}
#doc .cc .ccb.ph{color:#7f7f7f}
#doc .cc .ccdd{display:inline-block;width:14px;text-align:center;font-size:9px;color:#444;cursor:pointer;border-left:1px solid #c8d3e3;margin-left:2px;user-select:none}
#doc .cc[data-type=check] .ccb{cursor:pointer;font-family:"Segoe UI Symbol","DejaVu Sans",sans-serif}
#doc .cc[data-type=date] .ccb,#doc .cc[data-type=dropdown] .ccb{cursor:pointer}
#doc.formfill .cc{border-color:#c8d3e3;background:#f6f9fd}
#doc.formfill .cc .ccb{background:#fff6c7}
/* spacers / pages */
#doc .spacer{user-select:none;cursor:default;position:relative;font-family:var(--docfont);font-size:11pt}
#doc .sp-head,#doc .sp-foot{position:relative}
#doc .sp-fill{display:flex;flex-direction:column;justify-content:flex-end}
#doc .hdr,#doc .ftr{position:absolute;left:0;right:0;min-height:18px;outline:none;font-size:11pt;line-height:1.3}
#doc .hdr p,#doc .ftr p{margin:0}
#doc .hdr{top:.5in}
#doc .ftr{bottom:.5in}
#doc .hfedit .hdr.edit,#doc .hfedit .ftr.edit{outline:1px dashed #5b8bd6;outline-offset:3px;background:#fff;cursor:text;user-select:text}
#doc .hflabel{display:none;position:absolute;left:-8px;font:11px var(--ui);background:#e9eef7;color:#1f4e8c;border:1px solid #9cb3d8;padding:0 6px;border-radius:2px;white-space:nowrap}
#doc.hfmode .hflabel{display:block}
#doc.hfmode .sect>*:not(.spacer){opacity:.45}
#doc .sp-head .hflabel{bottom:-1px}
#doc .sp-foot .hflabel{top:-1px}
#doc .fnarea{border-top:0;padding-top:4pt;font-size:10pt;line-height:1.25;margin-bottom:2pt}
#doc .fnarea .fnsep,#doc .ennotes .fnsep{width:2in;border-top:1px solid #000;margin-bottom:3pt}
#doc .fnline{display:flex;gap:2px}
#doc .fnline sup{font-size:70%}
#doc .fn-text{flex:1;outline:none;min-height:1em;cursor:text;user-select:text}
#doc .ennotes{font-size:10pt;line-height:1.25;padding-top:8pt}
/* show marks */
#doc.marks p::after,#doc.marks h1::after,#doc.marks h2::after,#doc.marks li::after{content:"¶";color:#6a8fd0;font-family:Arial,sans-serif;font-weight:400;font-style:normal;font-size:11pt}
#doc.marks td>p:last-child::after{content:"¤"}
#doc.marks .pbreak{height:16px}
#doc.marks .pbreak::before{content:"·········································· Page Break ··········································";position:absolute;left:0;right:0;top:0;text-align:center;color:#6a8fd0;font:10px Arial,sans-serif;white-space:nowrap;overflow:hidden}
#doc.marks .sect+.sect::before{content:"···· Section Break (Next Page) ····";display:block;position:absolute;top:-38px;left:0;right:0;text-align:center;color:#6a8fd0;font:10px Arial,sans-serif}
#doc.marks .sect.cont::before{content:"···· Section Break (Continuous) ····";top:-14px}
#doc.marks .tab{background:linear-gradient(#6a8fd0,#6a8fd0) left 55%/100% 1px no-repeat}
/* spell (custom highlight) */
::highlight(spell){text-decoration:underline wavy #d13438;text-decoration-thickness:1.5px;text-underline-offset:2px}
::highlight(gram){text-decoration:underline double #2e5fd8;text-underline-offset:2px}
::highlight(find){background:#ffe86b;color:#000}
#doc.nospell ::highlight(spell){text-decoration:none}

#cmtcol{position:absolute;top:0;width:270px;z-index:3}
.ccard{position:absolute;left:0;width:260px;background:#fff;border:1px solid #d6d6d6;border-radius:8px;box-shadow:0 2px 6px #0002;padding:8px 10px;font:12.5px var(--ui);color:#242424;transition:top .15s}
.ccard.act{border-color:#c19c00;box-shadow:0 2px 10px #0003}
.ccard .chd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ccard .cav{width:24px;height:24px;border-radius:50%;background:#7a3e9d;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.ccard .cnm{font-weight:600;flex:1}
.ccard .ctm{color:#666;font-size:11px}
.ccard textarea{width:100%;min-height:52px;border:1px solid #c8c8c8;border-radius:4px;font:12.5px var(--ui);padding:4px;resize:vertical}
.ccard .cact{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.ccard .ctx{white-space:pre-wrap;word-break:break-word}
.ccard .cmore{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:4px}
.ccard .cmore:hover{background:#eee}
.ccard .rep{border-top:1px solid #eee;margin-top:6px;padding-top:6px}
.ccard.res{opacity:.6}

#pichandles{position:absolute;pointer-events:none;z-index:5}
#pichandles .hd{position:absolute;width:9px;height:9px;background:#fff;border:1px solid #555;border-radius:50%;pointer-events:auto;cursor:nwse-resize}
#pichandles .lob{position:absolute;width:24px;height:24px;border:1px solid #bbb;background:#fff;border-radius:3px;pointer-events:auto;cursor:pointer;display:grid;place-items:center}
.pasteopt{position:absolute;z-index:6;border:1px solid #b5b5b5;background:#fff;border-radius:3px;padding:1px 4px;font:11px var(--ui);cursor:pointer;display:flex;align-items:center;gap:3px;box-shadow:0 1px 3px #0002}

#statusbar{flex:none;height:26px;display:flex;align-items:center;gap:14px;padding:0 10px;background:#f3f3f3;border-top:1px solid #dedede;font-size:12px;color:#444;white-space:nowrap;overflow:hidden}
#statusbar button{border:0;background:transparent;cursor:pointer;height:22px;border-radius:3px;padding:0 4px;color:#444;font-size:12px;display:flex;align-items:center;gap:4px}
#statusbar button:hover{background:#e3e3e3}
#statusbar .sp{flex:1}
#statusbar input[type=range]{width:110px;accent-color:#666}
#statusbar .vb[aria-pressed=true]{background:#dcdcdc}

/* ======= MISSION PANEL ======= */
#mission{flex:none;width:340px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0B1A46,#060D26);color:var(--ink);font-family:var(--body);border-left:1px solid #1e3170;min-height:0;transition:width .2s}
#mission.collapsed{width:38px}
#mission.collapsed .mbody,#mission.collapsed .mhead h2,#mission.collapsed .mhead .mob{display:none}
.mhead{padding:10px 12px 8px;border-bottom:1px solid #1f3474;display:flex;gap:8px;align-items:flex-start}
.mhead h2{margin:0;font:700 17px/1.2 var(--disp)}
.mhead .mob{font-size:12px;color:var(--gold);margin-bottom:2px}
.mhead .colbtn{flex:none;margin-left:auto;border:1px solid #2c4590;background:#0f2160;color:var(--ink);border-radius:7px;width:26px;height:26px;cursor:pointer}
.mbody{flex:1;overflow:auto;padding:10px 12px 16px}
.brief{background:#0f2160;border:1px solid #233d86;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:#dfe7ff}
.steps{list-style:none;margin:12px 0;padding:0;counter-reset:s}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-radius:9px;font-size:14px;line-height:1.35}
.steps li .sn{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #3b57a6;display:grid;place-items:center;font:700 12px var(--disp);color:#b8c8f5}
.steps li.ok .sn{background:var(--ok);border-color:var(--ok);color:#03311d}
.steps li.ok .st{color:#a9f0cf}
.steps li.cur{background:#132a6c}
.steps li .st small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.steps li .fb{display:block;margin-top:4px;font-size:12.5px;color:#ffd1d1}
.steps li.ok .fb{display:none}
.steps li .ans{margin-top:6px;display:flex;gap:6px}
.steps li .ans input{width:90px;border-radius:6px;border:1px solid #3b57a6;background:#08143a;color:#fff;padding:4px 6px;font:14px var(--body)}
.mbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mbtn{border:1px solid #2f4b9c;background:#10235f;color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font:600 13.5px var(--body)}
.mbtn:hover{border-color:var(--gold)}
.mbtn.gold{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.mbtn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #f5c54266}}
.hintbox{margin-top:10px;background:#1a1a3a;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#fff3c4}
.mtimer{font:700 13px var(--disp);color:var(--gold);margin-left:8px}
.complete{text-align:center;padding:12px 6px}
.complete .stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.complete h3{font:800 22px var(--disp);margin:4px 0}
.mfoot{padding:8px 12px;border-top:1px solid #1f3474;font-size:11.5px;color:#8fa3d8}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #F5C542!important;outline-offset:1px;position:relative;z-index:30}
@keyframes pulse{50%{outline-color:#ff8b00;box-shadow:0 0 0 6px #f5c54255}}
#drawerBtn{display:none}

/* ======= MENUS / DIALOGS / TOAST ======= */
.menu{position:fixed;z-index:200;background:#fff;border:1px solid #c8c8c8;border-radius:6px;box-shadow:0 8px 24px #0003;padding:4px;min-width:180px;max-height:80vh;overflow:auto;font:12.5px var(--ui);color:#242424}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;min-height:28px}
.menu .mi:hover,.menu .mi:focus{background:#EBF3FC;outline:none}
.menu .mi[aria-disabled=true]{opacity:.45}
.menu .mi .mic{width:20px;display:grid;place-items:center;flex:none}
.menu .mi .kb{margin-left:auto;color:#777;padding-left:16px;font-size:11.5px}
.menu .mi .sub{margin-left:auto;font-size:10px;padding-left:12px}
.menu .sep{height:1px;background:#e3e3e3;margin:4px 2px}
.menu .mh{padding:6px 10px 2px;font-weight:600;color:#555;font-size:11.5px;background:#f6f6f6;border-radius:3px}
.menu .mgrid{display:grid;gap:4px;padding:4px}
.menu .mgrid button{border:1px solid #ddd;background:#fff;cursor:pointer;border-radius:3px;padding:2px}
.menu .mgrid button:hover{border-color:var(--wblue);background:#EBF3FC}
.swatches{display:grid;grid-template-columns:repeat(10,18px);gap:3px;padding:6px}
.swatches button{width:18px;height:18px;border:1px solid #bbb;padding:0;cursor:pointer;border-radius:2px}
.swatches button:hover{outline:2px solid #f5a623}
.tgrid{display:grid;grid-template-columns:repeat(10,16px);gap:2px;padding:6px}
.tgrid i{width:16px;height:16px;border:1px solid #bbb;display:block;cursor:pointer;background:#fff}
.tgrid i.on{border-color:#d08a00;background:#ffe6b0}
#dlgLayer{position:fixed;inset:0;z-index:150;pointer-events:none}
.dlgback{position:fixed;inset:0;background:#0000002e;pointer-events:auto}
.dlg{position:fixed;background:#fff;border-radius:8px;box-shadow:0 18px 50px #0005;border:1px solid #bdbdbd;min-width:300px;max-width:min(96vw,860px);max-height:92vh;display:flex;flex-direction:column;pointer-events:auto;font:12.5px var(--ui);color:#242424}
.dlg .dh{display:flex;align-items:center;padding:10px 12px 6px 16px;font-size:14px;font-weight:600;cursor:move;user-select:none}
.dlg .dh span{flex:1}
.dlg .dh button{border:0;background:transparent;width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:14px}
.dlg .dh button:hover{background:#e81123;color:#fff}
.dlg .db{padding:6px 16px 10px;overflow:auto}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid #eee;align-items:center}
.dlg .df .left{margin-right:auto}
.dlg label.f{display:block;margin:8px 0 3px;font-weight:600}
.dlg input[type=text],.dlg input[type=password],.dlg input[type=number],.dlg select,.dlg textarea{font:12.5px var(--ui);border:1px solid #bdbdbd;border-radius:4px;padding:4px 6px;height:28px;background:#fff;color:#242424}
.dlg textarea{height:auto}
.dlg fieldset{border:1px solid #ddd;border-radius:6px;margin:8px 0;padding:6px 10px 10px}
.dlg legend{font-weight:600;padding:0 4px}
.dlg .grid2{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.dlg .dtabs{display:flex;gap:2px;border-bottom:1px solid #ddd;margin-bottom:8px}
.dlg .dtabs button{border:1px solid transparent;border-bottom:0;background:none;padding:6px 12px;cursor:pointer;border-radius:4px 4px 0 0}
.dlg .dtabs button[aria-selected=true]{border-color:#ddd;background:#fff;margin-bottom:-1px;font-weight:600}
.dlg .list{border:1px solid #ccc;border-radius:4px;overflow:auto;background:#fff}
.dlg .list .li{padding:4px 8px;cursor:pointer;display:flex;gap:8px;align-items:center}
.dlg .list .li:hover{background:#f1f6fd}
.dlg .list .li.on{background:#cfe2fa}
.dlg table.dt{border-collapse:collapse;font-size:12px;width:100%}
.dlg table.dt th,.dlg table.dt td{border:1px solid #d7d7d7;padding:3px 6px;text-align:left;white-space:nowrap}
.dlg table.dt th{background:#f3f3f3;position:sticky;top:0}
.dlg table.dt td input[type=text]{height:24px;width:110px;border:0;padding:0 2px}
.dlg .prev{border:1px solid #ddd;background:#fafafa;border-radius:4px;padding:10px;min-height:60px;line-height:1.4}
.dlg .row2{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:#242424;color:#fff;padding:9px 16px;border-radius:8px;z-index:400;font:13px var(--ui);box-shadow:0 6px 20px #0004;max-width:90vw;text-align:center}
.toast.gold{background:var(--navy2);color:var(--ink);border:1px solid var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500}
.narrow-banner{position:fixed;left:8px;right:8px;top:8px;z-index:600;background:var(--gold);color:#1b1500;border-radius:10px;padding:8px 12px;font:600 13px var(--body);display:flex;gap:8px;align-items:center}
.narrow-banner button{margin-left:auto;border:0;background:#1b1500;color:var(--gold);border-radius:6px;padding:4px 8px;cursor:pointer}

/* ======= BACKSTAGE ======= */
#backstage{position:absolute;inset:0;z-index:40;display:flex;background:#fff}
.bsnav{width:200px;flex:none;background:var(--wblue);color:#fff;display:flex;flex-direction:column;padding:10px 0;overflow:auto}
.bsnav button{border:0;background:transparent;color:#fff;text-align:left;padding:9px 22px;cursor:pointer;font-size:13.5px}
.bsnav button:hover{background:#ffffff22}

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

let openMenus=[];
function closeMenus(level=0){while(openMenus.length>level){const m=openMenus.pop();m.el.remove();m.onClose&&m.onClose()}}
/* items: {label, icon, kb, onClick, sub, sep, header, checked, disabled, id, html, el, keep} */
function showMenu(anchor,items,opts={}){
  const level=opts.level||0;closeMenus(level);
  const m=el('div',{class:'menu',role:'menu'});
  const btns=[];
  for(const it of items){
    if(!it)continue;
    if(it.sep){m.append(el('div',{class:'sep',role:'separator'}));continue}
    if(it.header){m.append(el('div',{class:'mh'},it.header));continue}
    if(it.el){m.append(it.el);continue}
    const b=el('button',{class:'mi',role:'menuitem',tabindex:'-1','data-mi':it.id||null,'aria-disabled':it.disabled?'true':null,title:it.title||null});

    if(it.sub){
      const open=()=>{if(!m.isConnected)return;const r=b.getBoundingClientRect();showMenu({rect:{left:r.right-2,top:r.top-4,bottom:r.top,right:r.right}},typeof it.sub==='function'?it.sub():it.sub,{level:level+1})};

      b.addEventListener('click',e=>{e.stopPropagation();open()});
      b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){open();setTimeout(()=>{const nm=openMenus[level+1];nm&&nm.el.querySelector('.mi')&&nm.el.querySelector('.mi').focus()})}});
    }else{

      b.addEventListener('click',e=>{e.stopPropagation();if(it.disabled)return;if(!it.keep)closeMenus(0);restoreSel();it.onClick&&it.onClick(e)});
    }

  m.addEventListener('keydown',e=>{const i=btns.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();(btns[(i+1)%btns.length]||btns[0]).focus()}else if(e.key==='ArrowUp'){e.preventDefault();(btns[(i-1+btns.length)%btns.length]||btns[0]).focus()}else if(e.key==='Escape'||e.key==='ArrowLeft'&&level>0){e.preventDefault();e.stopPropagation();closeMenus(level);if(anchor&&anchor.focus&&level===0)anchor.focus()}});
  document.body.append(m);

  const mw=m.offsetWidth,mh=m.offsetHeight;
  let x=r.left,y=r.bottom+2;
  if(opts.at){x=opts.at.x;y=opts.at.y}
  if(x+mw>innerWidth-4)x=Math.max(4,(level?r.left-mw:innerWidth-mw-4));
  if(y+mh>innerHeight-4)y=Math.max(4,innerHeight-mh-4);
  m.style.left=x+'px';m.style.top=y+'px';
  openMenus.push({el:m,onClose:opts.onClose});
  if(opts.focus!==false&&(opts.kbd||level>0))setTimeout(()=>btns[0]&&btns[0].focus());
  return m;
}

  const body=el('div',{class:'db'});

    for(const b of o.buttons){const be=el('button',{class:'pbtn'+(b.primary?' pri':''),'data-db':b.id||b.label},b.label);be.onclick=()=>{if(b.onClick){const r=b.onClick(d);if(r===false)return}close(b.primary?true:false)};f.append(be);btnEls[b.id||b.label]=be}

    else if(e.key==='Tab'&&!o.modeless){const f=$$('button,input,select,textarea,[tabindex="0"]',d).filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}
    e.stopPropagation();
  });
  let closed=false;
  function close(ok){if(closed)return;closed=true;d.remove();back&&back.remove();dlgStack=dlgStack.filter(x=>x!==api);o.onClose&&o.onClose(ok);if(!o.modeless){if(prevFocus&&prevFocus.isConnected&&prevFocus!==document.body)try{prevFocus.focus({preventScroll:true})}catch(e){}restoreSel()}}

  dlgStack.push(api);
  setTimeout(()=>{const f=o.focus?$(o.focus,d):$('input:not([type=checkbox]):not([type=radio]),select,textarea,.pbtn.pri',d);f&&f.focus();if(f&&f.select&&f.type==='text')f.select()},0);
  return api;
}

}

/* ===================== Checker helpers ===================== */
const C={
  norm:s=>(s||'').replace(/ /g,' ').replace(/\s+/g,' ').trim(),
  blocks(root=DOC){return $$(BLKSEL,root).filter(b=>!b.closest('.spacer,.toc,.biblio')&&!b.querySelector('p,li'))},
  find(t,root=DOC){t=t.toLowerCase();return C.blocks(root).find(b=>C.norm(C.btext(b)).toLowerCase().includes(t))},
  findAllB(t,root=DOC){t=t.toLowerCase();return C.blocks(root).filter(b=>C.norm(C.btext(b)).toLowerCase().includes(t))},
  btext(b){const c=b.cloneNode(true);$$('del.tc,.cct,.ccdd,[data-ui]',c).forEach(x=>x.remove());return c.textContent},
  runs(b){const out=[];const w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode()){if(!t.data.trim()||t.parentElement.closest('del.tc,.cct,.ccdd'))continue;out.push(t)}return out},
  every(b,f){const r=C.runs(b);return r.length>0&&r.every(t=>f(fmtOf(t)))},
  phrase(q,f){const ms=findAll(q);if(!ms.length)return null;return ms.some(m=>{const r=mRange(m);const ts=[];const w=document.createTreeWalker(r.commonAncestorContainer.nodeType===3?r.commonAncestorContainer.parentNode:r.commonAncestorContainer,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode())if(r.intersectsNode(t)&&t.data.trim())ts.push(t);return ts.length&&ts.every(x=>f(fmtOf(x)))})},
  charFmt(word,i){const ix=buildIndex();const k=ix.txt.indexOf(word);if(k<0)return null;const [n]=idxPos(ix,k+i);return fmtOf(n)},
  text(root=DOC){return C.norm(root===DOC?plainText():(()=>{const c=root.cloneNode(true);$$('del.tc,.cct,.ccdd',c).forEach(x=>x.remove());return c.textContent})())},
  count(s,q){return s.split(q).length-1},
  red(c){const m=/rgb\((\d+), (\d+), (\d+)/.exec(c||'');return m&&+m[1]>150&&+m[2]<90&&+m[3]<90},
  yellow(c){const m=/rgb\((\d+), (\d+), (\d+)/.exec(c||'');return m&&+m[1]>200&&+m[2]>200&&+m[3]<120},
  rootOfDoc(d){if(d===S.cur)return DOC;return el('div',{html:d.html})},
  mainDoc(){return S.docs.find(d=>d.id===M.docId)||S.cur},
  merged(){const id=M.docId;return S.docs.filter(d=>d.mergedFrom===id).slice(-1)[0]},
  letters(d){const r=C.rootOfDoc(d);const g={};$$('.sect',r).forEach(s=>{const k=s.dataset.letter||'1';g[k]=(g[k]||'')+' '+C.norm(s.textContent)});return Object.values(g)},
  sectOf(n){return elOf(n)&&elOf(n).closest('.sect')},
};

/* Every page as a picture, exactly as Print Layout draws it (100% zoom, no comments, marks or handles). */
async function wsPageCanvases(o={}){
  wsPrep();
  const ww=$('#wordwin'),cvs=$('#canvas'),keep={zoom:S.zoom,view:S.view,read:ww.classList.contains('readmode'),cls:DOC.className,top:cvs.scrollTop,left:cvs.scrollLeft};
  const sel=$$('img.selpic,.cc.cur,.cmt.act',DOC).map(x=>[x,x.className]);
  S.zoom=1;if(S.view!=='print'){S.view='print';ww.classList.remove('readmode')}
  DOC.classList.remove('marks','hfmode','showgrid');DOC.classList.add('nocmt');sel.forEach(([x])=>x.classList.remove('selpic','cur','act'));
  layout();
  try{
    const sc=Math.max(1,Math.min(2,30000/Math.max(1,WRAP.offsetHeight)));
    const skip=n=>n.nodeType===1&&(n.id==='cmtcol'||n.id==='pichandles'||(n.classList&&['hflabel','ss-ignore','tocbar','pasteopt','cct','ccdd'].some(c=>n.classList.contains(c))));
    const big=await SimSave.domToCanvas(WRAP,{scale:sc,bg:'#ffffff',ignore:skip});
    let list=PAGES.filter(p=>p&&p.width);
    if(o.what==='cur'){let k=0;try{const r=getRange();if(r)k=pageOfNode(r.startContainer)}catch(e){}list=list.filter(p=>p.idx===k);if(!list.length)list=PAGES.slice(0,1)}
    else if(o.what==='custom'&&o.range){const want=new Set();String(o.range).split(',').forEach(t=>{const [a,b]=t.split('-').map(v=>parseInt(v,10));if(a>0)for(let i=a;i<=(b>=a?b:a);i++)want.add(i-1)});const f=list.filter(p=>want.has(p.idx));if(f.length)list=f}
    const pages=list.map(p=>{const c=document.createElement('canvas');c.width=Math.round(p.width*sc);c.height=Math.round((p.bottom-p.top)*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(big,Math.round(p.left*sc),Math.round(p.top*sc),c.width,c.height,0,0,c.width,c.height);return c});
    return {pages,dpi:DPI*sc};
  }finally{
    S.zoom=keep.zoom;S.view=keep.view;if(keep.read)ww.classList.add('readmode');DOC.className=keep.cls;sel.forEach(([x,c])=>x.className=c);layout();cvs.scrollTop=keep.top;cvs.scrollLeft=keep.left;
  }
}

/* A clean copy of the document body. mode 'docx' leaves markers that wsDocxBlob turns into Word tabs, section and column breaks. */
function wsClone(mode){
  const c=DOC.cloneNode(true);const real=root=>[...root.querySelectorAll('td,th,img')].filter(x=>!x.closest('.spacer'));
  const L=real(DOC),C=real(c);
  L.forEach((n,i)=>{const k=C[i];if(!k||k.tagName!==n.tagName)return;
    if(n.tagName==='IMG'){if(n.offsetWidth){k.setAttribute('width',Math.round(n.offsetWidth));k.setAttribute('height',Math.round(n.offsetHeight))}return}
    const cs=getComputedStyle(n);const bg=cs.backgroundColor;if(!k.style.backgroundColor&&bg&&!/^(transparent|rgba\(0, 0, 0, 0\))$/.test(bg))k.style.backgroundColor=bg;
    const col=cs.color,b=(parseInt(cs.fontWeight,10)||400)>=600;[...k.children].forEach(p=>{if(col&&col!=='rgb(0, 0, 0)'&&!p.style.color)p.style.color=col;if(b&&!p.style.fontWeight)p.style.fontWeight='bold'})});
  c.querySelectorAll('.spacer,[data-ui],.tocbar,.cct,.ccdd,.hflabel,.pasteopt').forEach(x=>x.remove());
  c.querySelectorAll('.cmt').forEach(x=>x.replaceWith(...x.childNodes));
  c.querySelectorAll('.selpic').forEach(x=>x.classList.remove('selpic'));
  const P=t=>{const p=document.createElement('p');p.textContent=t;return p};
  c.querySelectorAll('.tab').forEach(x=>x.replaceWith(mode==='docx'?'[[ss-tab]]':' '));
  c.querySelectorAll('.toc-e .dots').forEach(x=>x.replaceWith(mode==='docx'?'[[ss-toctab]]':' … '));
  c.querySelectorAll('.pbreak').forEach(x=>{const d=document.createElement('div');d.className='pagebreak';d.style.pageBreakBefore='always';x.replaceWith(d)});

/* ===================== Saved progress (GameSave) =====================
   Missions, stars, XP, badges, name and settings: STORE_KEY (this lab's own progress record).
   The mission or free practice in progress (every open document, files saved in Word Lab, mission checks, hints and answers): STORE_KEY+'.session'.
   Start over clears both. */
const WS_SESSION=STORE_KEY+'.session';
const WS_START0=showStart; // this page's start screen, whose Badges view has the Reset progress button
function wsSessionGet(){
  if(!S.cur||(!M&&!S.free))return null;
  try{syncDoc()}catch(e){}
  const docs=S.docs.map(d=>{const o={};for(const k in d)if(k!=='undo'&&k!=='redo')o[k]=d[k];return o});
  return {v:1,mission:M?M.m.id:null,free:!M&&!!S.free,docs,cur:Math.max(0,S.docs.indexOf(S.cur)),files:S.files,flags:S.flags,dataSources:S.dataSources,lettersNum:S.lettersNum,nextDocNum:S.nextDocNum,ignoreAll:S.ignoreAll?[...S.ignoreAll]:[],
    M:M?wsPlainM():null};
}
/* the mission's own fields (hints, checks, answers, level, documents in use …); what the mission rebuilds itself is left out */
const WS_SKIP=['m','steps','v','paras','res','start'];
function wsPlainM(){const o={};for(const k in M){if(WS_SKIP.includes(k))continue;const v=M[k];if(typeof v==='function')continue;try{o[k]=JSON.parse(JSON.stringify(v===undefined?null:v))}catch(e){}}o.elapsed=now()-M.start;return o}
function wsSetM(s,docs){
  const plain=v=>v===null||['string','number','boolean'].includes(typeof v)||(typeof v==='object'&&(Array.isArray(v)||Object.getPrototypeOf(v)===Object.prototype));
  for(const k in s){
    if(WS_SKIP.includes(k)||k==='elapsed'||k==='done')continue;const v=s[k],cur=M[k];
    if(!plain(v)||(typeof v==='number'&&!isFinite(v)))continue;
    if(/Id$/.test(k)&&v!==null&&!docs.some(d=>d.id===v))continue;               // a document the mission had open must exist
    if(cur!==undefined&&cur!==null&&v!==null&&(typeof cur!==typeof v||Array.isArray(cur)!==Array.isArray(v)))continue;
    if(Array.isArray(cur)&&cur.length&&Array.isArray(v)&&v.length!==cur.length)continue; // e.g. parts built: same mission shape only
    M[k]=v;
  }
  if(typeof s.elapsed==='number'&&s.elapsed>=0)M.start=now()-s.elapsed;
  M.done=!!s.done&&!!PROG.done[M.m.id];
}
function wsRestore(sv){
  try{
    if(!sv||sv.v!==1||!Array.isArray(sv.docs)||!sv.docs.length)return false;
    if(!sv.docs.every(d=>d&&typeof d==='object'&&typeof d.html==='string'&&typeof d.id==='string'))return false;
    const m=sv.mission?MISSIONS.find(x=>x.id===sv.mission):null;
    if(sv.mission&&(!m||!sv.M||!sv.docs.some(d=>d.id===sv.M.docId)))return false;
    if(!m&&!sv.free)return false;
    if(m)startMission(m.id,sv.M&&sv.M.lvl);else startFree();
    const docs=sv.docs.map(d=>{const n=newDocObj(d.name,d.html,d);n.undo=[];n.redo=[];return n});
    S.cur=null;S.docs=docs;S.recent=[];
    if(Array.isArray(sv.files))S.files=sv.files.filter(f=>f&&typeof f.name==='string'&&typeof f.ext==='string');
    if(sv.flags&&typeof sv.flags==='object'&&!Array.isArray(sv.flags))S.flags=sv.flags;
    if(sv.dataSources&&typeof sv.dataSources==='object')S.dataSources=sv.dataSources;
    if(typeof sv.lettersNum==='number')S.lettersNum=sv.lettersNum;
    if(typeof sv.nextDocNum==='number')S.nextDocNum=Math.max(S.nextDocNum,sv.nextDocNum);
    if(Array.isArray(sv.ignoreAll))S.ignoreAll=new Set(sv.ignoreAll.filter(w=>typeof w==='string'));
    if(M)wsSetM(sv.M,docs);
    openDocObj(docs[clamp(sv.cur|0,0,docs.length-1)]);
    renderTabs();renderRibbon();renderMission();renderCourseBar();
    return true;
  }catch(e){try{console.warn('Word Lab: saved work could not be restored',e)}catch(_){}M=null;S.free=false;return false}
}

  const resume=()=>{if(!wsRestore(sv))return false;setTimeout(()=>{try{GameSave.toast('Welcome back! Your work was restored.')}catch(e){}},400);return true};
  if(mi&&MISSIONS.find(x=>x.id===mi)){if(!(sv&&sv.mission===mi&&resume()))startMission(mi)}else if(mode==='free'){if(!(sv&&!sv.mission&&sv.free&&resume()))startFree()}else if(lv&&/^[123]$/.test(lv))showStart('level'+lv);else if(!(sv&&resume()))showStart('home');
}
