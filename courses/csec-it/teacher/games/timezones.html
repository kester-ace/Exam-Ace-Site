<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Zone Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1726; --bg2:#10223a; --panel:#13294a; --panel2:#183356; --line:#24476f;
  --ink:#eef4fb; --soft:#a9bdd6; --dim:#7590b2;
  --amber:#ffb84d; --amber2:#ffd28a; --teal:#33d1b2; --teal2:#1f9e86; --coral:#ff6b7f; --sky:#6fb6ff;
  --land:#3d6f94; --land2:#5286ad; --ocean:#0c1d33; --night:rgba(2,8,20,.5);
  --paper:#fbfaf6; --pink:#1b2533;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);overflow-x:hidden;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(111,182,255,.12),transparent 60%),radial-gradient(900px 400px at -10% 110%,rgba(51,209,178,.08),transparent 60%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:44px;height:44px}
h1{font:700 clamp(20px,3vw,27px)/1.05 var(--disp);margin:0;letter-spacing:-.01em}
.sub{margin:3px 0 0;color:var(--soft);font-size:13px}
.hud{display:flex;align-items:center;gap:8px;flex:none}
.starchip{font:700 14px/1 var(--mono);background:var(--panel);border:1px solid var(--line);padding:9px 11px;border-radius:999px;color:var(--amber);white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 12px;padding:5px;background:rgba(16,34,58,.75);border:1px solid var(--line);border-radius:14px}
.tab{flex:1 1 auto;border:0;background:transparent;color:var(--soft);padding:9px 12px;border-radius:10px;font:600 14px/1.15 var(--disp);display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.tab .tstar{font:700 11px/1 var(--mono);color:var(--dim)}
.tab[aria-selected=true]{background:var(--amber);color:#1d1406}
.tab[aria-selected=true] .tstar{color:#8a6a2a}
.tstar b{color:var(--amber);font-weight:700}
.tab[aria-selected=true] .tstar b{color:#3a2200}
.tab:hover:not([aria-selected=true]){background:var(--panel2);color:var(--ink)}
footer{text-align:center;color:var(--dim);font-size:12.5px;padding:18px 16px 20px}

.panel{background:linear-gradient(180deg,var(--panel),#11243f);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.h2{font:700 19px/1.2 var(--disp);margin:0 0 4px}
.lead{color:var(--soft);margin:0 0 10px;font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--amber);color:#1d1406;font:700 15px/1.1 var(--disp);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--amber2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mono{font-family:var(--mono)}
.muted{color:var(--soft)}
.kbd{font:600 12px/1 var(--mono);background:var(--bg2);border:1px solid var(--line);padding:2px 6px;border-radius:5px}
section[hidden]{display:none!important}

/* ---------- World clock ---------- */
.wc-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.mapwrap{overflow-x:auto;overflow-y:hidden;border-radius:12px;background:var(--ocean);border:1px solid var(--line);-webkit-overflow-scrolling:touch}
#map{display:block;width:100%;min-width:640px;height:auto}
#map .land{fill:var(--land);stroke:var(--land2);stroke-width:.35;stroke-linejoin:round}
#map .grat{stroke:rgba(169,189,214,.09);stroke-width:.3;fill:none}
#map .idl{stroke:var(--amber);stroke-width:.5;stroke-dasharray:2 1.6;opacity:.85}
#map .idltxt{fill:var(--amber);font:600 3.4px var(--mono)}
#map .night{fill:var(--night)}
#map .dot{fill:var(--amber);stroke:#0b1726;stroke-width:.6}
#map .dot.home{fill:var(--teal);r:2.4}
#map .lead{stroke:rgba(255,255,255,.45);stroke-width:.35}
#map .pill rect{fill:#0b1726;stroke:var(--line);stroke-width:.4}
#map .pill.home rect{fill:#0e3a3a;stroke:var(--teal)}
#map .pill text{fill:var(--ink);font:500 4.6px var(--mono)}
#map .pill .pt{fill:var(--amber2);font-weight:700}
#map .pill.home .pt{fill:#7ff0d8}
#map .pill .dayx{fill:var(--coral);font-size:3.4px;font-weight:700}
#map .sun{fill:#ffe08a;opacity:.9}
.maphint{font-size:12px;color:var(--dim);margin:6px 2px 0;display:none}
.readout{font-size:14px;color:var(--soft);margin:0 0 10px}
.big{font:700 40px/1 var(--mono);color:var(--teal);letter-spacing:-.02em}
.big small{font:500 15px var(--body);color:var(--soft);margin-left:6px;letter-spacing:0}
.field{display:grid;gap:5px;margin:10px 0}
.field label,.flabel{font:600 13px/1.2 var(--disp);color:var(--soft)}
input[type=date],input[type=text],select{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:42px;width:100%;color-scheme:dark}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;font:600 13px var(--disp);color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--sky);color:#06203d}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 10px;font:600 12.5px var(--disp);color:var(--ink)}
.chip:hover{border-color:var(--sky)}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 0}
.cards{margin-top:12px}
.mission{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.mission .ms{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--dim);font:700 14px/1 var(--mono)}
.mission.done{border-style:solid;border-color:var(--teal2);background:rgba(51,209,178,.08)}
.mission.done .ms{background:var(--teal);border-color:var(--teal);color:#062a22}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.city{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px 10px;min-width:0;position:relative}
.city.home{border-color:var(--teal);background:linear-gradient(180deg,rgba(51,209,178,.14),var(--bg2))}
.city .cn{font:700 14px/1.15 var(--disp)}
.city .cc{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city .ct{font:700 25px/1.1 var(--mono);color:var(--amber2);margin-top:5px}
.city.home .ct{color:#7ff0d8}
.city .c12{font-size:12px;color:var(--soft)}
.city .cd{font-size:12px;margin-top:3px}
.city .cm{font:500 11.5px/1.3 var(--mono);color:var(--soft);margin-top:4px}
.night-ico{position:absolute;top:9px;right:9px;width:16px;height:16px;opacity:.8}
.badge{display:inline-block;font:700 10.5px/1 var(--disp);padding:3px 6px;border-radius:999px;vertical-align:1px;letter-spacing:.02em}
.b-next{background:var(--coral);color:#33040d}
.b-prev{background:var(--sky);color:#06203d}
.b-dst{background:rgba(255,184,77,.16);color:var(--amber);border:1px solid rgba(255,184,77,.4)}
.b-nodst{background:rgba(51,209,178,.14);color:var(--teal);border:1px solid rgba(51,209,178,.35)}
details.learn{margin-top:12px}
details.learn>summary{cursor:pointer;font:700 17px var(--disp);list-style:none;display:flex;align-items:center;gap:8px}
details.learn>summary::-webkit-details-marker{display:none}
details.learn>summary::before{content:'+';display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--amber);color:#1d1406;font:700 17px/1 var(--mono)}
details.learn[open]>summary::before{content:'−'}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.idea{background:var(--bg2);border-left:4px solid var(--sky);border-radius:10px;padding:10px 12px;font-size:14px}
.idea h3{margin:0 0 4px;font:700 15px var(--disp)}
.idea p{margin:0;color:var(--soft)}
.idea.sxm{border-left-color:var(--teal)} .idea.dst{border-left-color:var(--amber)} .idea.idl{border-left-color:var(--coral)}
table.gap{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.gap th,table.gap td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left}
table.gap th{font:600 12px var(--disp);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.tblscroll{overflow-x:auto}

/* ---------- Questions ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prog{display:flex;gap:4px}
.prog i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.prog i.ok{background:var(--teal)} .prog i.bad{background:var(--coral)} .prog i.cur{background:var(--amber)}
.score{font:700 15px var(--mono);color:var(--amber)}
.qbody{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.clockbox{display:grid;justify-items:center;gap:4px;text-align:center}
.clockbox svg{width:130px;height:130px}
.clockbox .cl{font:600 12px var(--disp);color:var(--soft)}
.qtext{font:700 clamp(17px,2.3vw,21px)/1.3 var(--disp);margin:0 0 12px;text-wrap:pretty}
.qtext .hl{color:var(--amber2)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:11px;padding:11px 13px;font:700 17px/1.2 var(--mono);display:flex;gap:10px;align-items:center;min-height:52px}
.opt .ol{flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font:700 12px var(--disp);color:var(--soft)}
.opt small{display:block;font:400 12px var(--body);color:var(--soft)}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt.right{border-color:var(--teal);background:rgba(51,209,178,.14)}
.opt.wrong{border-color:var(--coral);background:rgba(255,107,127,.12)}
.opt:disabled{cursor:default}
.typed{display:grid;gap:10px;max-width:460px}
.typed input{font:700 22px var(--mono);letter-spacing:.04em}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick button{border:1px solid var(--line);background:var(--bg2);border-radius:9px;padding:8px 12px;font:600 13.5px var(--disp)}
.daypick button[aria-pressed=true]{background:var(--sky);color:#06203d;border-color:var(--sky)}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--bg2);border-left:5px solid var(--line);font-size:14.5px}
.fb.ok{border-left-color:var(--teal)} .fb.bad{border-left-color:var(--coral)}
.fb strong{font:700 16px var(--disp);display:block;margin-bottom:3px}
.fb .work{margin:6px 0 0;padding-left:18px;color:var(--soft)}
.fb .work li{margin:2px 0}
.result{text-align:center;padding:22px 10px}
.result .stars3{font-size:44px;letter-spacing:6px;color:var(--line)}
.result .stars3 b{color:var(--amber);font-weight:400}
.result .pct{font:700 34px var(--mono);margin:6px 0}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.bestline{font:600 13px var(--mono);color:var(--soft)}

/* ---------- Book the call ---------- */
.scn-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.scn-meta{font:600 13px var(--mono);color:var(--amber)}
.axis{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;margin-top:10px;padding:0 7px 0 9px}
.axis .ticks{position:relative;height:18px;font:500 10.5px var(--mono);color:var(--dim)}
.axis .ticks span{position:absolute;transform:translateX(-50%);top:2px}
.tl{display:grid;gap:8px;margin-top:2px}
.tlrow{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:center;border-radius:12px;padding:6px 6px 6px 8px;border:1px solid transparent;transition:background .25s,border-color .25s}
.tlrow.ok{background:rgba(51,209,178,.12);border-color:rgba(51,209,178,.5)}
.tlrow.part{background:rgba(255,184,77,.08);border-color:rgba(255,184,77,.35)}
.tlrow.no{background:rgba(255,107,127,.07);border-color:rgba(255,107,127,.3)}
.tll .n{font:700 14px/1.15 var(--disp)}
.tll .l{font:700 15px/1.2 var(--mono);color:var(--amber2)}
.tll .s{display:block;font-size:12px;color:var(--soft);line-height:1.25;margin-top:2px}
.tll .n,.tll .l{white-space:nowrap}
.tlrow.ok .tll .s{color:#8ff2dc}
.track{position:relative;height:34px;border-radius:8px;background:#0a1626;overflow:hidden;touch-action:none;cursor:ew-resize;border:1px solid #1e3a5c}
.track .off{position:absolute;top:0;bottom:0;background:rgba(51,209,178,.28);border-left:1px solid rgba(51,209,178,.7);border-right:1px solid rgba(51,209,178,.7)}
.tlrow.ok .track .off{background:rgba(51,209,178,.55)}
.track .wk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,107,127,.16) 0 4px,transparent 4px 8px)}
.track .hr{position:absolute;bottom:2px;font:500 9.5px var(--mono);color:rgba(238,244,251,.55);transform:translateX(-50%);pointer-events:none}
.track .mt{position:absolute;top:2px;bottom:2px;border-radius:6px;border:2px solid var(--amber);background:rgba(255,184,77,.25);box-shadow:0 0 0 2px rgba(11,23,38,.6);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--soft);margin-top:8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.slidebox{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px;padding:0 7px 0 9px}
.email{background:var(--paper);color:var(--pink);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:10px;white-space:pre-wrap;font-family:var(--body);overflow-wrap:anywhere}
.email b{font-weight:700}

/* ---------- Itinerary ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.steps span{font:600 12.5px var(--disp);padding:6px 10px;border-radius:999px;background:var(--bg2);color:var(--dim);border:1px solid var(--line)}
.steps span.on{background:var(--amber);color:#1d1406;border-color:var(--amber)}
.steps span.done{color:var(--teal);border-color:var(--teal2)}
.flights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pass{background:var(--paper);color:var(--pink);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.pass::after{content:'';position:absolute;right:-9px;top:50%;width:18px;height:18px;border-radius:50%;background:var(--panel);transform:translateY(-50%)}
.pass .fl{display:flex;justify-content:space-between;font:700 13px var(--mono);color:#46566e}
.pass .route{display:flex;align-items:center;gap:8px;font:700 26px/1 var(--disp);margin:8px 0 6px;color:#0f1d30}
.pass .route svg{width:22px;height:22px;flex:none}
.pass .info{font-size:13px;line-height:1.4;color:#36455c}
.pass .info b{color:#0f1d30}
.pass .zones{font:600 11.5px var(--mono);color:#5b6b83;margin:6px 0;background:#eef1f6;border-radius:7px;padding:5px 7px}
.pass label{font:700 12px var(--disp);color:#36455c}
.pass input[type=text]{background:#fff;color:#0f1d30;border:2px solid #c9d2df;font:700 20px var(--mono);color-scheme:light}
.pass .plus{display:flex;align-items:center;gap:6px;font:600 13px var(--body);margin-top:6px;color:#36455c}
.pass .plus input{width:18px;height:18px;accent-color:#0f6b5a}
.pass.ok{box-shadow:0 0 0 3px var(--teal)} .pass.bad{box-shadow:0 0 0 3px var(--coral)}
.pass .pfb{font-size:12.5px;margin-top:6px;min-height:1em;color:#36455c}
.choice{display:grid;gap:8px;margin:8px 0}
.choice button{text-align:left;background:var(--paper);color:var(--pink);border:3px solid transparent;border-radius:10px;padding:10px 12px;font:400 13.5px/1.35 var(--body)}
.choice button .hd{font:700 13px/1.35 var(--body);text-transform:none}
.choice button[aria-pressed=true]{border-color:var(--amber)}
.choice button.right{border-color:var(--teal)} .choice button.wrong{border-color:var(--coral);opacity:.75}
.builder{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.pool{display:grid;gap:6px;max-height:560px;overflow:auto;padding-right:4px}
.ecard{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.3}
.ecard:hover:not(:disabled){border-color:var(--amber)}
.ecard .et{font:700 14px/1.1 var(--mono);color:var(--amber2)}
.ecard .et small{display:block;font:600 10px var(--mono);color:var(--dim);margin-top:2px}
.ecard:disabled{opacity:.35;cursor:default}
.doc{background:var(--paper);color:#151c28;border-radius:6px;padding:20px 20px 16px;box-shadow:0 12px 30px rgba(0,0,0,.35);min-width:0}
.doc .dh{text-align:center;font:700 13.5px/1.45 'Atkinson Hyperlegible',Arial,sans-serif;text-transform:uppercase;margin-bottom:10px;letter-spacing:.02em}
.doc .dh .t1{font-size:17px;text-decoration:underline;letter-spacing:.08em}
.doc .dh.empty{color:#9aa4b2;font-weight:400;text-transform:none;font-style:italic}
table.itin{width:100%;border-collapse:collapse;font-size:13px;line-height:1.35}
table.itin th{border-top:2px solid #151c28;border-bottom:1px solid #151c28;text-align:left;padding:6px 6px;font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.05em}
table.itin td{border-bottom:1px solid #c8ced8;padding:6px 6px;vertical-align:top}
table.itin td.dt{width:200px;font-weight:700}
table.itin td.tm{width:76px;font-family:var(--mono);font-weight:700;white-space:nowrap}
table.itin td.tm small{display:block;font-size:10px;color:#5b6b83}
table.itin td.ac{width:100px;white-space:nowrap;text-align:right}
table.itin tr.daystart td{border-top:1.5px solid #151c28}
table.itin select{background:#fff;color:#151c28;border:1px solid #b9c3d1;font-size:12px;padding:4px 4px;min-height:34px;color-scheme:light;width:100%}
table.itin tr.e-ok td{background:#e5f7f1} table.itin tr.e-bad td{background:#fde8eb}
table.itin .why{display:block;font-size:11.5px;color:#a3132b;margin-top:3px;font-weight:700}
.mini{border:1px solid #b9c3d1;background:#fff;color:#151c28;border-radius:6px;width:30px;height:30px;font:700 13px var(--mono);padding:0}
.mini:hover{background:#eef1f6}
.doc .notes{font-size:12px;color:#36455c;margin-top:10px;border-top:1px solid #c8ced8;padding-top:7px}
.emptyrow td{color:#8a94a3;font-style:italic;text-align:center;padding:16px!important}

     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)
     GameSave.onReset(fn)             run fn before the page reloads after a reset
     GameSave.startOver()             ask "Start over?" and, if confirmed, clear this game's saved progress and reload
     GameSave.reset({reload})         clear without asking

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

}
function offsetMin(utc,tz){const p=parts(utc,tz);return Math.round((Date.UTC(p.y,p.m-1,p.d,p.h,p.mi,p.s)-Math.floor(utc/1000)*1000)/60000);}

  const o2=offsetMin(utc,tz);if(o2!==o1)utc=guess-o2*60000;
  return utc;
}

function hasDST(tz,y){return offsetMin(Date.UTC(y,0,1,12),tz)!==offsetMin(Date.UTC(y,6,1,12),tz);}

function gapStr(diff){return diff===0?'same time':durStr(diff)+(diff>0?' ahead':' behind');}
const _abbr={};
function zoneAbbr(utc,tz){

function solar(utc){
  const d=new Date(utc),start=Date.UTC(d.getUTCFullYear(),0,0),doy=(utc-start)/864e5;
  const decl=-23.44*Math.cos(2*Math.PI/365*(doy+10));
  const hrs=d.getUTCHours()+d.getUTCMinutes()/60;
  let lon=-(hrs-12)*15;if(lon<-180)lon+=360;if(lon>180)lon-=360;
  return {decl,lon};
}
function drawNight(utc){
  const s=solar(utc);let dec=s.decl;if(Math.abs(dec)<0.4)dec=dec<0?-0.4:0.4;
  const t=Math.tan(dec*Math.PI/180);let pts=[];
  for(let lon=-180;lon<=180;lon+=2){const H=(lon-s.lon)*Math.PI/180;const lat=Math.atan(-Math.cos(H)/t)*180/Math.PI;pts.push(PX(lon).toFixed(1)+','+Math.max(-2,Math.min(130,PY(lat))).toFixed(1));}
  const edge=dec>0?130:-2;
  document.getElementById('night').setAttribute('d','M0,'+edge+' L'+pts.join(' L')+' L360,'+edge+' Z');
  const sun=document.getElementById('sun');sun.setAttribute('cx',PX(s.lon));sun.setAttribute('cy',PY(s.decl));
}

   '<line x1="50" y1="50" x2="'+(50+32*Math.sin(b*Math.PI/180)).toFixed(1)+'" y2="'+(50-32*Math.cos(b*Math.PI/180)).toFixed(1)+'" stroke="#33d1b2" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#ffb84d"/>'+

}
function parseTime(s){
  s=String(s).trim().toLowerCase().replace(/\./g,'').replace(/\s+/g,' ').replace(/(\d)\s*(a|p)\s*m?$/,'$1 $2m');
  s=s.replace(/\s*\(.*\)$/,'').replace(/ ?(hrs|hours|h)$/,'');
  const m=s.match(/^(\d{1,2})(?:[:h]?(\d{2}))?\s*(am|pm)?$/);if(!m)return null;
  let h=+m[1],mi=m[2]?+m[2]:0;if(mi>59)return null;
  if(m[3]){if(h<1||h>12)return null;h=h%12+(m[3]==='pm'?12:0);}else if(h>23)return null;
  return h*60+mi;
}

function hqJudge(s,pick,ticks){

  let pts=v==='best'?6:v==='acc'?3:0;
  const c=ticks.filter(t=>s.f.includes(t)).length,w=ticks.filter(t=>!s.f.includes(t)).length;
  const fp=Math.round(4*Math.max(0,c-w)/s.f.length);
  pts+=fp;if(night)pts=Math.max(0,pts-2);
  return {v,pts,fp,night,asleep};

  if(typeof o.date==='string'&&/^\d{4}-\d\d-\d\d$/.test(o.date)){WC.date=o.date;wcDate.value=o.date;}
  if(int(o.min,0,1439))WC.min=o.min;
  WC.h12=o.h12===true;document.getElementById('f24').setAttribute('aria-pressed',String(!WC.h12));document.getElementById('f12').setAttribute('aria-pressed',String(WC.h12));
  WC.touched=o.touched===true;renderWorld();
 }
 function rQs(o){
  if(!Array.isArray(o.qs)||o.qs.length!==10||!int(o.i,0,9)||!int(o.score,0,100)||!Array.isArray(o.res))throw 0;
  const qs=o.qs.map(x=>{
   if(!isO(x)||!C[x.src]||!C[x.dst]||!num(x.u)||(x.type!=='mc'&&x.type!=='typed'))throw 0;
   const src=C[x.src],dst=C[x.dst],u=x.u,sp=parts(u,src.tz),dp=parts(u,dst.tz),so=offsetMin(u,src.tz),do_=offsetMin(u,dst.tz),diff=do_-so,srcMin=sp.h*60+sp.mi;
   if(sp.y!==2026)throw 0;
   return {type:x.type,src,dst,u,sp,dp,so,do_,diff,srcMin,ans:srcMin+diff,dayRel:dayNum(dp)-dayNum(sp),h12:x.h12===true,ov:Array.isArray(x.ov)?x.ov:null};
  });
  QS.started=true;QS.qs=qs;QS.score=o.score;QS.res=o.res.slice(0,10).map(v=>v===true);
  const i=o.i+(o.answered?1:0);
  if(i>=10){QS.i=9;quickResult();}else{QS.i=i;renderQuick();}
 }
 function rCall(o){
  if(!int(o.i,0,SCENARIOS.length-1)||!Array.isArray(o.scores)||o.scores.length>SCENARIOS.length||!int(o.start,0,1440))throw 0;
  CALL.started=true;CALL.i=o.i;CALL.scores=o.scores.map(v=>num(v)?v:0);CALL.booked=false;CALL.start=Math.min(o.start,1440-SCENARIOS[o.i].dur);
  renderScn();if(o.booked)bookCall();
 }
 function rIt(o){
  if(!int(o.step,0,4)||!Array.isArray(o.a)||o.a.length!==3||!Array.isArray(o.aTries)||o.aTries.length!==3||!Array.isArray(o.rows))throw 0;
  const E=buildEntries(),ids=E.map(e=>e.id),seen=new Set(),rows=[];
  o.rows.forEach(r=>{if(isO(r)&&ids.includes(r.id)&&!seen.has(r.id)&&(r.date===''||TRIP_DAYS.includes(r.date))){seen.add(r.id);rows.push({id:r.id,date:r.date});}});
  Object.assign(IT,{started:true,step:o.step,a:o.a.map(x=>x?true:null),aTries:o.aTries.map(n=>int(n,0,99)?n:0),aScore:int(o.aScore,0,30)?o.aScore:0,hScore:int(o.hScore,0,10)?o.hScore:0,dScore:int(o.dScore,0,10)?o.dScore:0,head:null,dateStyle:null,rows,tScore:int(o.tScore,0,50)?o.tScore:null,checks:int(o.checks,0,9999)?o.checks:0,entries:E});
  if(Array.isArray(o.pool)&&o.pool.length===ids.length&&ids.every(id=>o.pool.includes(id)))IT._pool=o.pool.slice();
  if(IT.step===3&&IT.tScore!==null)IT.step=4;
  renderItin();
  if(IT.step===0&&IT.a.every(Boolean))checkA();
 }
 function rQz(o){
  if(!Array.isArray(o.qs)||o.qs.length!==10||!int(o.i,0,9)||!int(o.score,0,10)||!Array.isArray(o.res))throw 0;
  const pool=quizPool();
  const qs=o.qs.map(x=>{const p=isO(x)&&pool.find(z=>z.q===x.q);if(!p)throw 0;const want=[p.right,...p.wrong.slice(0,3)];
   return {...p,opts:Array.isArray(x.opts)&&x.opts.length===want.length&&want.every(w=>x.opts.includes(w))?x.opts.slice():shuffle(want)};});
  QZ.started=true;QZ.qs=qs;QZ.score=o.score;QZ.res=o.res.slice(0,10).map(v=>v===true?true:v===false?false:undefined);
  const i=o.i+(QZ.res[o.i]!==undefined?1:0);
  if(i<10){QZ.i=i;renderQuizQ();return;}
  QZ.i=9;const P=document.getElementById('quizPanel'),pct=QZ.score*10;
  P.innerHTML=resultHTML('Quiz complete',pct,'quiz','<p>'+QZ.score+' out of 10 correct.</p>','qzAgain');
  document.getElementById('qzAgain').addEventListener('click',startQuiz);
 }
 function rHq(o){
  if(!GD[o.genre]||typeof o.base!=='string'||!/^\d{4}-\d\d-\d\d$/.test(o.base)||!Array.isArray(o.ids)||!o.ids.length||!int(o.i,0,o.ids.length-1)||!Array.isArray(o.scores)||o.scores.length>o.ids.length||!Array.isArray(o.verdicts)||o.verdicts.length>o.ids.length)throw 0;
  const g=GD[o.genre];
  const list=o.ids.map(id=>{if(id==='special')return Object.assign({id:'special'},g.special);const s=HQ_SCN.find(x=>x.id===id);if(!s)throw 0;return s;});
  const verdicts=o.verdicts.map(v=>{if(!isO(v)||typeof v.title!=='string'||!MD[v.pick]||!['best','acc','poor'].includes(v.v)||!Array.isArray(v.best)||!v.best.every(k=>MD[k]))throw 0;return {title:v.title,pick:v.pick,v:v.v,best:v.best.slice()};});
  Object.assign(HQ,{genre:o.genre,started:true,base:o.base,list,i:o.i,scores:o.scores.map(v=>num(v)?v:0),verdicts});
  const P=document.getElementById('hqPanel');P.style.setProperty('--g',g.c);
  renderHq();
  if(MD[o.pick]){const b=P.querySelector('.med[data-m="'+o.pick+'"]');if(b)b.click();}
  (Array.isArray(o.ticks)?o.ticks:[]).forEach(k=>{const x=FACTORS.some(f=>f.k===k)&&P.querySelector('.fact input[value="'+k+'"]');if(x)x.checked=true;});
  if(o.done&&HQ.pick&&P.querySelector('.fact input:checked'))sendHq();
 }
 let saved=null,back=false;
 GameSave.register(['tzn.best','tzn.mute',KEY]);
 GameSave.persist({key:KEY,welcome:false,get:snap,set:v=>{saved=v;}});
 const run=(fn,o,reset)=>{if(!isO(o))return;try{fn(o);back=true;}catch(e){try{reset();}catch(_){}}};
 if(isO(saved)&&saved.v===1){
  try{rWc(saved.wc);}catch(e){}
  run(rQs,saved.qs,()=>{QS.started=false;QS.qs=[];renderQuickIntro();});
  run(rCall,saved.call,()=>{CALL.started=false;CALL.booked=false;renderCallIntro();});
  run(rIt,saved.it,()=>{IT.started=false;renderItinIntro();});
  run(rQz,saved.qz,()=>{QZ.started=false;QZ.qs=[];renderQuizIntro();});
  run(rHq,saved.hq,()=>{HQ.started=false;HQ.list=[];renderHqIntro();});
  const t=tabs.find(b=>b.id===saved.tab);if(t&&t.id!=='tab-world'){openTab(t);back=true;}
 }
 let tmr=null;const later=()=>{clearTimeout(tmr);tmr=setTimeout(GameSave.save,300);};
 ['click','input','change','keyup','pointerup'].forEach(e=>document.addEventListener(e,later));
 if(back||Object.keys(BEST).some(k=>BEST[k]>0))setTimeout(()=>GameSave.toast('Welcome back! Your progress was restored.'),400);
})();
</script>
