function pulse(el,msg){if(!el)return false;el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');try{el.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}setTimeout(()=>el.classList.remove('pulse'),4200);if(msg)toast(msg);return true}
let TAB_INDEX=null;
function tabIndex(){if(TAB_INDEX)return TAB_INDEX;TAB_INDEX={};const ids=[...TABS.map(t=>t.id),'ctx-text','ctx-draw','ctx-pic','ctx-wa','ctx-tdesign','ctx-tlayout','ctx-master'];
  ids.forEach(t=>{const w=it=>{if(it.col)it.col.forEach(w);else if(it.row)it.row.forEach(w);else if(it.id&&!TAB_INDEX[it.id])TAB_INDEX[it.id]=t};tabGroups(t).forEach(g=>g.items.forEach(w))});return TAB_INDEX}
const CTX_NEED={'ctx-text':['text','Click a text box first — the Text Box Tools Format tab appears.'],'ctx-draw':['shape','Click a shape first — the Drawing Tools Format tab appears.'],'ctx-pic':['pic','Click the picture first — the Picture Tools Format tab appears.'],'ctx-wa':['wa','Click the WordArt first — the WordArt Tools Format tab appears.'],'ctx-tdesign':['table','Click the table first — the Table Tools tabs appear.'],'ctx-tlayout':['table','Click the table first — the Table Tools tabs appear.'],'ctx-master':[null,'Open the master page first (View ▸ Master Page).']};
const TABNAME=id=>{const t=TABS.find(x=>x.id===id);if(t)return t.label;return {'ctx-text':'Text Box Tools Format','ctx-draw':'Drawing Tools Format','ctx-pic':'Picture Tools Format','ctx-wa':'WordArt Tools Format','ctx-tdesign':'Table Tools Design','ctx-tlayout':'Table Tools Layout','ctx-master':'Master Page'}[id]||id};
function showMe(spec,i){
  if(!spec){const s=MS.m.steps[i];if(!MS.hints[i]||MS.hints[i]<2){MS.hints[i]=2;renderPanel()}toast('Follow the hint under the step.');return}
  const alts=spec.split('|');
  for(const sp of alts){if(showOne(sp))return}
}
function showOne(sp){
  const k=sp.indexOf(':')<0?sp:sp.slice(0,sp.indexOf(':')),rest=sp.slice(sp.indexOf(':')+1);
  if(k==='file'){const [sec,el]=rest.split('>');if($('#backstage').hidden){return pulse($('#tab-file'),'Click File to open the backstage.')}
    const cur=$('#bsnav [aria-current=true]');if(!cur||cur.dataset.sec!==sec)return pulse($('#bs-'+sec),'Click '+$('#bs-'+sec).textContent+'.');if(el&&$(el))return pulse($(el));return pulse($('#bs-'+sec))}
  if(k==='rb'){const [id,mi]=rest.split('>');if(!$('#backstage').hidden)closeBackstage();const tab=tabIndex()[id];if(!tab)return false;
    if(tab.startsWith('ctx')&&!ctxTabs().some(t=>t.id===tab)){const need=CTX_NEED[tab];const o=need[0]&&curList().find(x=>x.t===need[0]||(need[0]==='shape'&&x.t==='group'));if(o&&objEl(o.id))pulse(objEl(o.id));toast(need[1]);return true}
    if(S.tab!==tab){S.tab=tab;renderRibbon(true)}
    const el=$('#rb-'+id);if(!el)return false;
    pulse(el,`${TABNAME(tab)} ▸ ${el.getAttribute('aria-label')||el.textContent.trim()}`);
    if(mi){setTimeout(()=>{const c=RB_REG.get(id);if(mi.startsWith('#rb-')){pulse($(mi));return}if(c&&c.menu){c.menu(el);setTimeout(()=>pulse($(mi)),50)}},600)}
    return true}
  if(k==='el'){const el=$(rest);return el?pulse(el):false}
  if(k==='role'||k==='name'||k==='tag'){const o=[];walk(curList(),x=>{if((k==='role'&&x.role===rest)||(k==='name'&&x.name===rest)||(k==='tag'&&x.tag===rest))o.push(x)});
    let t=o[0];if(!t&&k==='role'){const h=H.headline(analyse(),S.page);t=h&&h.item.top}
    if(t&&objEl(t.id)){if(t.tag==='brandlogo'){const sc=scroller();sc.scrollLeft=STAGE.left+t.x*S.zoom-60}return pulse(objEl(t.id),'Click here.')}return false}
  if(k==='pic'){const o=curList().find(x=>x.t==='pic');return o?pulse(objEl(o.id),'Click the picture to select it.'):false}
  if(k==='new'){const o=curList().find(x=>x.t==='text'&&!MS.ids.has(x.id));return o?pulse(objEl(o.id),'Here is your new text box.'):false}
  return false;
}
/* live ticking */
let lastTickSig='';
const scheduleCheck=debounce(()=>{if(!MS||MS.done||$('#game').hidden)return;const res=stepState();const sig=res.join();if(sig!==lastTickSig){const newly=res.some((r,i)=>r&&!MS.tick[i]);lastTickSig=sig;MS.tick=res;renderPanel();if(newly)sfx('tick')}},380);
function onDocChanged(){DOC_V++;scheduleCheck()}
function onDocChangedSoft(){}
const _render=render;render=function(){_render();if(MS)scheduleCheck()};

const QREF=[['Ctrl+N / Ctrl+O / Ctrl+S / Ctrl+P','New · Open · Save · Print (File tab)'],['Ctrl+Z / Ctrl+Y','Undo · Redo (Quick Access Toolbar)'],['Ctrl+C / Ctrl+X / Ctrl+V','Copy · Cut · Paste (Home ▸ Clipboard)'],['Ctrl+B / Ctrl+I / Ctrl+U','Bold · Italic · Underline (Home ▸ Font)'],['Ctrl+L / Ctrl+E / Ctrl+R / Ctrl+J','Align left · Centre · Right · Justify (Home ▸ Paragraph)'],['Ctrl+Shift+> / Ctrl+Shift+<','Bigger / smaller font'],['Ctrl+Shift+G','Group / Ungroup (Home ▸ Arrange)'],['Ctrl+K','Insert hyperlink (Insert ▸ Link)'],['Ctrl+Shift+N','Insert a new page'],['F7','Spelling (Review ▸ Spelling)'],['F9','Toggle 100% / Whole Page zoom'],['Arrow keys / Alt+Arrow','Nudge selected object / nudge by 1 pixel'],['Shift + drag','Keep straight lines; Shift + rotate = 15° steps'],['Alt + drag','Move without snapping to guides'],['Tab (workspace)','Select the next object · Enter starts typing in it'],['Esc','Stop typing / cancel drawing or linking']];
const QLOC=[['Text box','Home ▸ Draw Text Box · Insert ▸ Draw Text Box'],['Pictures (clip gallery or file)','Insert ▸ Pictures'],['Shapes · WordArt','Insert ▸ Shapes · Insert ▸ WordArt'],['Tables · Calendars','Insert ▸ Table · Insert ▸ Calendars'],['Page Parts · Borders & Accents · Advertisements','Insert ▸ Building Blocks'],['Header, footer, page numbers','Insert ▸ Header & Footer (uses the master page)'],['Margins, orientation, size, guides','Page Design ▸ Page Setup'],['Colour schemes · Font schemes','Page Design ▸ Schemes'],['Background · Master pages','Page Design ▸ Page Background'],['Link text boxes','Text Box Tools Format ▸ Create Link (or click A…)'],['Columns, margins in a text box, Text Fit','Text Box Tools Format'],['Fill, outline, shadow','Drawing Tools Format · Picture Tools Format'],['Alt Text','Picture Tools Format ▸ Alt Text · right-click ▸ Edit Alt Text'],['Align, distribute, order, group, rotate','Home ▸ Arrange'],['Spelling','Review ▸ Spelling'],['Rulers, guides, baselines, page navigation','View ▸ Show'],['Save as PDF / PNG / web page','File ▸ Save As · File ▸ Export'],['Design Checker','File ▸ Info']];
function qrefHTML(){return `<div class="qref"><h3 style="margin-top:0">Keyboard shortcuts</h3><table><tr><th>Keys</th><th>What it does</th></tr>${QREF.map(r=>`<tr><td><span class="kbd">${esc(r[0])}</span></td><td>${esc(r[1])}</td></tr>`).join('')}</table><h3>Where to find it</h3><table><tr><th>Task</th><th>Ribbon location</th></tr>${QLOC.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table><h3>Design checklist</h3><p>Contrast at least 4.5 : 1 · no more than 3 fonts · headline biggest (hierarchy) · align to guides · keep related items close (proximity) · repeat colours and styles · leave white space · add Alt Text to pictures.</p><p style="font-size:11px;color:#555">Publisher Lab · Kester Small</p></div>`}
function quickRef(){dialog({title:'Quick Reference Card',wide:1,body:qrefHTML(),buttons:[{label:'🖨 Print',pri:1,on:()=>{$('#printRoot').innerHTML=`<style>@page{size:auto;margin:14mm}</style><div style="font-family:Segoe UI,Arial,sans-serif;color:#000"><h2>Publisher Lab · Quick Reference</h2>${qrefHTML()}</div>`;setTimeout(()=>{try{window.print()}catch(e){}},50)}},{label:'Close'}]})}
function progressBox(){
  const lv=[1,2,3].map(l=>{const [d,n]=lvlCount(l);return `<p>${LEVELS[l].e} Level ${l} · ${LEVELS[l].n}: <b>${d}/${n}</b> missions</p>`}).join('');
  dialog({title:'Badges & progress',wide:1,body:`<p style="font-size:15px">⭐ <b>${PROG.xp}</b> XP · 🔥 streak ${PROG.streak||0} (best ${PROG.bestStreak||0})</p>${lv}<div class="badges">${BADGES.map(b=>`<div class="badge${PROG.badges.includes(b.id)?'':' lock'}"><span class="e" aria-hidden="true">${b.e}</span><b>${esc(b.n)}</b><br>${esc(b.d)}${PROG.badges.includes(b.id)?'':'<br><i>Locked</i>'}</div>`).join('')}</div>`,
   buttons:[{label:'Reset progress',on:()=>{if(window.GameSave){setTimeout(()=>GameSave.startOver(),10);return}setTimeout(()=>confirmBox('Reset progress','This deletes all your XP, stars, badges and saved files in Publisher Lab. Are you sure?','Reset',()=>{PROG={xp:0,done:{},badges:[],streak:0,bestStreak:0,sound:PROG.sound,files:{}};saveProg();toast('Progress reset');if(!$('#start').hidden)showStart();else renderCbar()}),10)}},{label:'Close',pri:1}]});
}

/* ================= wiring & init ================= */
function wire(){
  $('#rcss').textContent=RCSS+`#stage .obj{cursor:move}#stage .tbc[contenteditable=true]{cursor:text}#stage .fld-pn{background:#d9d9d9}#stage .tbc[contenteditable=true],#stage .cellc[contenteditable=true]{caret-color:#000}`;
  const dl=document.createElement('datalist');dl.id='sizeList';dl.innerHTML=SIZES.map(s=>`<option value="${s}">`).join('');document.body.append(dl);
  $('#qSave').innerHTML=ico('save');$('#qUndo').innerHTML=ico('undo');$('#qRedo').innerHTML=ico('redo');
  $$('#qSave,#qUndo,#qRedo,#qMore').forEach(b=>{b.querySelector('svg')&&(b.querySelector('svg').style.cssText='width:16px;height:16px;color:#fff')});
  $('#qSave').onclick=()=>{if(PROG.files&&PROG.files[D.name])exportAs('pub',D.name);else openBackstage('saveas')};
  $('#qUndo').onclick=undo;$('#qRedo').onclick=redo;$('#qMore').onclick=e=>openMenu(e.currentTarget,[{label:'Save',check:1},{label:'Undo',check:1},{label:'Redo',check:1},{label:'Print Preview',on:()=>openBackstage('print')}]);
  $('#wMin').onclick=()=>toast('Minimise is not needed here.');$('#wMax').onclick=()=>toast('The window is already as big as it can be.');
  $('#wClose').onclick=()=>leaveTo(()=>showStart());
  $('#tsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase().trim();if(!q)return;const idx=tabIndex();const hit=Object.keys(idx).find(id=>{const g=tabGroups(idx[id]);let lab='';const w=it=>{if(it.col)it.col.forEach(w);else if(it.row)it.row.forEach(w);else if(it.id===id)lab=it.label||''};g.forEach(gg=>gg.items.forEach(w));return lab.toLowerCase().includes(q)});if(hit){e.target.value='';showOne('rb:'+hit)}else toast('No command found for “'+q+'”')}});
  $('#narrowX').onclick=()=>$('#narrow').classList.remove('show');
  if(innerWidth<600)$('#narrow').classList.add('show');
  ribbonEvents();
  const sc=scroller();
  sc.addEventListener('pointerdown',onPointerDown);
  sc.addEventListener('dblclick',e=>{const oel=topObjEl(e.target);if(!oel)return;const o=getO(oel.dataset.id);if(!o)return;if(o.t==='wa'){editWordArt(o);return}if(o.t==='pic'){S.tab='ctx-pic';renderRibbon(true);return}if(hasText(o)||o.t==='table')enterEdit(o.id,e.clientX,e.clientY)});
  sc.addEventListener('contextmenu',e=>{const oel=topObjEl(e.target);if(S.editing&&oel&&oel.dataset.id===S.editing)return;objContextMenu(e,oel?oel.dataset.id:null)});
  sc.addEventListener('scroll',()=>drawRulers());
  sc.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(S.zoom*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
  sc.addEventListener('focusin',e=>{const td=e.target.closest&&e.target.closest('td[data-r]');if(td)S.cell=[+td.dataset.r,+td.dataset.c]});
  sc.addEventListener('input',e=>{if(!S.editing)return;const o=getO(S.editing);if(!o)return;const el=objEl(S.editing);if(o.t==='text'&&!o.next&&!o.prev){const tb=el.querySelector('.tb'),tbc=el.querySelector('.tbc');const pad=o.pad||[4,4,4,4];const ov=o.cols>1?tbc.scrollWidth>tbc.clientWidth+1:tbc.offsetHeight>tb.clientHeight-pad[0]-pad[2]+1;const f=FLOWS.get(o.id);if(f&&f.ovf!==ov){f.ovf=ov;renderSel()}}});
  sc.addEventListener('dragover',e=>{if([...(e.dataTransfer.types||[])].includes('Files'))e.preventDefault()});
  sc.addEventListener('drop',e=>{const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){e.preventDefault();readImageFile(f)}});
  $('#rulerH').addEventListener('pointerdown',e=>startNewGuide(e,'h'));$('#rulerV').addEventListener('pointerdown',e=>startNewGuide(e,'v'));
  $('#thumbs').addEventListener('click',e=>{const t=e.target.closest('.thumb');if(!t)return;if(S.view==='master'){S.mi=+t.dataset.p;S.sel=[];render();renderThumbs()}else goPage(+t.dataset.p)});
  $('#thumbs').addEventListener('contextmenu',e=>{const t=e.target.closest('.thumb');if(t)thumbContextMenu(e,+t.dataset.p)});
  $('#navX').onclick=()=>{S.navOn=false;$('#nav').hidden=true;layout();toast('Turn the Pages pane back on in View ▸ Page Navigation.')};
  $('#zoomr').addEventListener('input',e=>setZoom(+e.target.value/100));
  $('#zIn').onclick=()=>setZoom(S.zoom*1.2);$('#zOut').onclick=()=>setZoom(S.zoom/1.2);$('#sbWhole').onclick=zoomWhole;
  $('#mpFab').onclick=()=>{$('#mpanel').classList.remove('collapsed');const t=$('#mpTog');if(t){t.textContent='⇥';t.focus()}};
  window.addEventListener('resize',debounce(()=>{if($('#game').hidden)return;if(S.fit==='whole')zoomWhole();else{layout();renderSel();drawRulers()}if(innerWidth<600)$('#narrow').classList.add('show')},150));
  window.addEventListener('error',e=>{console.warn('Publisher Lab:',e.message)});
}
function init(){
  loadProg();
  D=TEMPLATES.blankLetter.make();
  wire();
  if(innerWidth<=900)$('#mpanel').classList.add('collapsed');
  computeFlows();
  const q=new URLSearchParams(location.search);
  const mid=q.get('mission'),lvl=q.get('level'),mode=q.get('mode');
  const sv=pubSessionInit(),resume=()=>pubRestore(sv);
  if(mid&&missionById(mid)){if(!(sv&&sv.mode==='mission'&&sv.mission===mid&&resume()))startMission(mid)}
  else if(mode==='free'){if(!(sv&&sv.mode==='free'&&resume()))startFree()}
  else if(lvl&&LEVELS[lvl])showStart({level:+lvl});
  else if(!(sv&&resume()))showStart();
}
/* ================= saved progress (GameSave) =================
   Missions, stars, XP, badges, sound and files saved in Publisher Lab: STORE_KEY ('csecit.sim.publishersim').
   The publication you are working on and the mission panel (hints, Show me, checks, steps done): STORE_KEY+'.session'.
   Start over clears both. */
const PUB_SESSION=STORE_KEY+'.session';
function pubSessionGet(){
  if(!PUB_MODE||!D)return null;
  try{if(S.editing)readEdit()}catch(e){}
  const s=MS?{hints:MS.hints,exact:MS.exact,show:MS.show,fails:MS.fails,elapsed:Date.now()-MS.start,ids:[...MS.ids],trio:MS.trio||[],story:MS.story||null,
    done:!!MS.done,stars:MS.stars,xp:MS.xp,bonus:MS.bonus,newBadges:(MS.newBadges||[]).map(b=>b.id)}:null;
  return {v:1,mode:MS?'mission':'free',mission:MS?MS.m.id:null,D,MS:s};
}
function pubSessionInit(){
  if(!window.GameSave)return null;let sv=null;
  GameSave.register([STORE_KEY,PUB_SESSION]);
  GameSave.persist({key:PUB_SESSION,welcome:false,every:5000,get:pubSessionGet,set:v=>{sv=v}});
  return sv;
}
function pubRestore(sv){
  const num=v=>typeof v==='number'&&isFinite(v)?v:0;
  try{
    const d=sv&&sv.D;
    if(!sv||sv.v!==1||!d||typeof d!=='object'||!Array.isArray(d.pages)||!d.pages.length||!Array.isArray(d.masters)||!d.masters.length||!(d.W>0)||!(d.H>0))return false;
    if(sv.mode==='mission'){
      const m=missionById(sv.mission),s=sv.MS;if(!m||!s||!Array.isArray(s.ids))return false;
      startMission(m.id);loadDoc(d);
      MS.ids=new Set(s.ids);MS.trio=Array.isArray(s.trio)?s.trio:[];if(typeof s.story==='string')MS.story=s.story;else delete MS.story;
      if(s.hints&&typeof s.hints==='object'&&!Array.isArray(s.hints))MS.hints=s.hints;
      MS.exact=num(s.exact);MS.show=num(s.show);MS.fails=num(s.fails);
      if(typeof s.elapsed==='number'&&s.elapsed>=0)MS.start=Date.now()-s.elapsed;
      if(s.done)Object.assign(MS,{done:true,stars:Math.max(1,Math.min(3,num(s.stars)||1)),xp:num(s.xp),bonus:num(s.bonus),newBadges:BADGES.filter(b=>Array.isArray(s.newBadges)&&s.newBadges.includes(b.id))});
      MS.tick=stepState();renderPanel();renderCbar();
    }else if(sv.mode==='free'){PUB_MODE='free';MS=null;loadDoc(d);renderPanel();showGame()}
    else return false;
    setTimeout(()=>{try{GameSave.toast('Welcome back! Your publication was restored.')}catch(e){}},400);
    return true;
  }catch(e){
    try{console.warn('Publisher Lab: saved work could not be restored',e)}catch(_){}
    MS=null;PUB_MODE=null;D=TEMPLATES.blankLetter.make();return false;
  }
}
init();
