<!doctype html>
<html lang="en-GB" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publisher Lab · CSEC Information Technology</title>
<meta name="description" content="Publisher Lab: a desktop-publishing practice simulator for CSEC Information Technology. Kester Small">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{
  --navy:#060D26;--navy2:#0B1A46;--navy3:#13286a;--gold:#F5C542;--gold2:#ffd970;--ink:#E9EEFF;--muted:#B7C2E8;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --disp:"Bricolage Grotesque","Segoe UI",system-ui,Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,Arial,sans-serif;
  --teal:#077568;--teal2:#0a5f55;--tealL:#d6ece9;--rib:#f5f5f5;--rib2:#e9e9e9;--line:#d2d2d2;--txt:#222;--sub:#555;
  --pb:#c8c8c8;--focus:#1a73e8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui);font-size:13px;color:var(--txt);background:var(--navy)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ---------- narrow banner ---------- */
#narrow{display:none;position:fixed;left:0;right:0;top:0;z-index:9000;background:var(--gold);color:#1b1400;font:600 13px var(--body);padding:8px 40px 8px 12px}
#narrow button{position:absolute;right:6px;top:4px;background:transparent;border:0;font-size:18px;cursor:pointer;width:30px;height:28px}
@media (max-width:599px){#narrow.show{display:block}}

/* ---------- start / course screens ---------- */
.screen{position:fixed;inset:0;overflow:auto}
#start{background:linear-gradient(160deg,var(--navy),var(--navy2) 60%,#10235c);color:var(--ink);font-family:var(--body)}
.st-wrap{max-width:1060px;margin:0 auto;padding:26px 20px 40px}
.st-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.applogo{width:46px;height:46px;border-radius:10px;background:var(--teal);display:grid;place-items:center;color:#fff;font:800 26px var(--disp);box-shadow:0 4px 16px #0006;flex:none}
.st-top h1{font:800 clamp(28px,4vw,44px)/1.05 var(--disp);margin:0;color:#fff}
.st-top h1 span{color:var(--gold)}
.st-course{font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.st-pitch{font-size:17px;max-width:760px;margin:14px 0 6px;color:var(--ink)}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.chip{background:#ffffff14;border:1px solid #ffffff2a;border-radius:99px;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.chip b{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.levels{grid-template-columns:1fr}}
.lvl{background:linear-gradient(180deg,#14275f,#0d1c4a);border:1px solid #2b3f86;border-radius:16px;padding:18px;color:var(--ink);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:180px;transition:transform .15s,border-color .15s}
.lvl:hover,.lvl:focus-visible{transform:translateY(-2px);border-color:var(--gold)}
.lvl .em{font-size:30px}
.lvl h2{margin:0;font:800 22px var(--disp);color:#fff}
.lvl p{margin:0;color:var(--muted);font-size:14px}
.lvl .bar{height:8px;border-radius:9px;background:#ffffff1c;overflow:hidden;margin-top:auto}
.lvl .bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.lvl .cnt{font-size:12.5px;color:var(--ink)}
.st-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.gbtn{background:var(--gold);color:#1b1400;border:0;border-radius:12px;padding:11px 16px;font:700 15px var(--body);cursor:pointer}
.gbtn:hover{background:var(--gold2)}
.obtn{background:transparent;color:var(--ink);border:1px solid #ffffff44;border-radius:12px;padding:10px 15px;font:700 14px var(--body);cursor:pointer}
.obtn:hover{border-color:var(--gold);color:#fff}
.dial{display:inline-flex;border:1px solid #ffffff3a;border-radius:99px;overflow:hidden}
.dial button{background:transparent;color:var(--ink);border:0;padding:7px 12px;font:700 13px var(--body);cursor:pointer}
.dial button+button{border-left:1px solid #ffffff3a}
.dial button:hover{background:#ffffff14;color:var(--gold)}
.st-stats{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;font-size:14px;align-items:center}
.st-stats b{color:var(--gold)}
.st-foot{margin-top:28px;font-size:12.5px;color:var(--muted)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:16px}
.mcard{background:#0f2056;border:1px solid #2b3f86;border-radius:14px;padding:14px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mcard:hover,.mcard:focus-visible{border-color:var(--gold)}
.mcard h3{margin:0;font:700 17px var(--disp);color:#fff}
.mcard .ob{font-size:12px;color:var(--gold)}
.mcard p{margin:0;font-size:13.5px;color:var(--muted)}
.mcard .stars{font-size:16px;letter-spacing:2px}
.stars .on{color:var(--gold)} .stars .off{color:#ffffff38}

/* ---------- game shell ---------- */
#game{display:flex;flex-direction:column;background:#1d1d1d;overflow:hidden}
#cbar{flex:none;height:40px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 8px;font-family:var(--body);font-size:13px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#cbar::-webkit-scrollbar{display:none}
#cbar .brand{font:800 15px var(--disp);color:#fff;white-space:nowrap;display:flex;align-items:center;gap:7px}
#cbar .brand .applogo{width:24px;height:24px;font-size:14px;border-radius:6px}
.cb{background:transparent;border:1px solid transparent;color:var(--ink);border-radius:8px;height:30px;padding:0 9px;cursor:pointer;white-space:nowrap;font:600 13px var(--body);display:inline-flex;align-items:center;gap:5px}
.cb:hover{border-color:#ffffff3a;color:#fff}
.cb[aria-pressed=true]{background:#ffffff1a;border-color:var(--gold)}
.cstat{white-space:nowrap;padding:0 6px}
.cstat b{color:var(--gold)}
.cspace{flex:1}
#main{flex:1;display:flex;min-height:0;position:relative}

/* ---------- Publisher app ---------- */
#app{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;font-family:var(--ui);position:relative}
#titlebar{flex:none;height:32px;background:var(--teal);color:#fff;display:flex;align-items:center;gap:4px;padding:0 0 0 6px;user-select:none}
#titlebar .pico{width:20px;height:20px;border-radius:4px;background:#fff;color:var(--teal);font:800 12px var(--ui);display:grid;place-items:center;margin-right:4px}
.qat{display:flex;gap:1px}
.qat button,.wctl button{background:transparent;border:0;color:#fff;height:32px;min-width:30px;cursor:pointer;display:grid;place-items:center}
.qat button:hover,.wctl button:hover{background:#ffffff26}
.wctl button.x:hover{background:#c42b1c}
#ttl{flex:1;min-width:0;text-align:center;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#tsearch{background:#ffffff26;border:1px solid #ffffff40;border-radius:4px;height:22px;width:220px;color:#fff;padding:0 8px;font-size:12px}
#tsearch::placeholder{color:#e8f5f3}
.avatar{width:24px;height:24px;border-radius:50%;background:#e8b04a;color:#2a1b00;font:700 11px var(--ui);display:grid;place-items:center;margin:0 6px}
@media (max-width:1250px){#tsearch{display:none}}
#titlebar .wctl{display:flex;flex:none}
@media (max-width:1450px){#cbar .brand .bt{display:none}.cb .lbl{display:none}}
#tabsrow{flex:none;display:flex;align-items:flex-end;background:var(--teal);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;height:30px}
.tab{background:transparent;border:0;color:#fff;height:28px;padding:0 12px;cursor:pointer;white-space:nowrap;font-size:13px;position:relative;margin-right:1px}
.tab:hover{background:#ffffff22}
.tab[aria-selected=true]{background:var(--rib);color:var(--teal);font-weight:600}
.tab.file{background:var(--teal2);font-weight:600}
.tab.file:hover{background:#06483f}
.tab.ctx{color:#fff;padding-top:9px;height:30px;background:#0a8a7b;min-width:104px}
.tab.ctx small{position:absolute;top:1px;left:0;right:0;font-size:9.5px;font-weight:600;text-align:center;letter-spacing:.02em;opacity:.95}
.tab.ctx[aria-selected=true]{background:var(--rib);color:#7a3b00}
.tab.ctx.c-text{box-shadow:inset 0 3px #f4b400}.tab.ctx.c-draw{box-shadow:inset 0 3px #ff8c42}.tab.ctx.c-pic{box-shadow:inset 0 3px #b68cff}.tab.ctx.c-table{box-shadow:inset 0 3px #4fc3f7}.tab.ctx.c-wa{box-shadow:inset 0 3px #ff6fa8}.tab.ctx.c-master{box-shadow:inset 0 3px #ffe066}
#ribbon{flex:none;height:94px;background:var(--rib);border-bottom:1px solid var(--line);display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:2px 2px 0}
.grp{display:flex;flex-direction:column;border-right:1px solid #dadada;padding:0 4px;flex:none}
.grp .gb{flex:1;display:flex;align-items:flex-start;gap:2px;padding-top:2px}
.grp .gl{font-size:11px;color:#666;text-align:center;padding:1px 0 2px;white-space:nowrap}
.col{display:flex;flex-direction:column;gap:1px}
.row{display:flex;gap:1px;align-items:center}
.rb{background:transparent;border:1px solid transparent;border-radius:3px;cursor:pointer;color:#222;display:flex;align-items:center;gap:4px;padding:1px 4px;height:22px;white-space:nowrap;font-size:12px}
.rb:hover{background:#dcdcdc;border-color:#c8c8c8}
.rb[aria-pressed=true]{background:#c5e3df;border-color:#7fb7af}
.rb:disabled{opacity:.42;cursor:default}
.rb.lg{flex-direction:column;height:72px;min-width:46px;max-width:74px;padding:2px 3px;justify-content:flex-start;white-space:normal;text-align:center;line-height:1.1;gap:2px}
.rb.lg svg{width:30px;height:30px;flex:none;margin-top:2px}
.rb.ic{width:24px;justify-content:center;padding:0}
.rb svg{width:16px;height:16px;flex:none}
.rb .dd{font-size:8px;opacity:.7}
.rb.lg .dd{display:block}
.rsel{height:22px;border:1px solid #bdbdbd;background:#fff;border-radius:2px;font-size:12px;padding:0 2px}
.rnum{width:62px;height:22px;border:1px solid #bdbdbd;border-radius:2px;font-size:12px;padding:0 4px}
.rchk{display:flex;align-items:center;gap:4px;font-size:12px;height:22px;cursor:pointer;padding:0 3px}
.swatchbar{display:block;height:4px;width:16px;margin-top:-3px}
.gal{display:flex;gap:3px;border:1px solid #d0d0d0;background:#fff;padding:3px;border-radius:2px;max-width:330px;overflow:hidden;height:60px;align-items:center}
.gal button{border:1px solid #ddd;background:#fff;cursor:pointer;padding:0;border-radius:2px;flex:none}
.gal button:hover{border-color:var(--teal)}
.gal button[aria-pressed=true]{outline:2px solid var(--teal)}
.pulse{animation:pulse 1s ease-in-out 4;outline:3px solid #ff4f9a!important;outline-offset:1px;position:relative;z-index:5}
@keyframes pulse{50%{outline-color:#ffd000;box-shadow:0 0 0 6px #ff4f9a55}}

/* body area */
#abody{flex:1;display:flex;min-height:0;background:var(--pb)}
#nav{flex:none;width:118px;background:#efefef;border-right:1px solid var(--line);display:flex;flex-direction:column}
#nav header{font-size:12px;font-weight:600;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);color:#333}
#nav header button{border:0;background:transparent;cursor:pointer;font-size:14px;width:22px;height:22px}
#thumbs{flex:1;overflow:auto;padding:8px 6px;display:flex;flex-direction:column;gap:10px;align-items:center}
.thumb{background:transparent;border:2px solid transparent;border-radius:3px;cursor:pointer;padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.thumb[aria-current=true]{border-color:var(--teal);background:#dceeea}
.thumb .tv{background:#fff;box-shadow:0 1px 3px #0005;position:relative;overflow:hidden}
.thumb span{font-size:11px;color:#333}
#ws{flex:1;position:relative;min-width:0;display:grid;grid-template-columns:18px 1fr;grid-template-rows:18px 1fr}
#rcorner{background:#e6e6e6;border-right:1px solid #bbb;border-bottom:1px solid #bbb}
#rulerH,#rulerV{background:#f4f4f4;display:block;cursor:crosshair}
#rulerH{border-bottom:1px solid #bbb;width:100%;height:18px}
#rulerV{border-right:1px solid #bbb;width:18px;height:100%}
#ws.norulers{grid-template-columns:0 1fr;grid-template-rows:0 1fr}
#ws.norulers #rulerH,#ws.norulers #rulerV,#ws.norulers #rcorner{display:none}
#scroller{overflow:auto;position:relative;background:var(--pb);outline:none}
#scroller:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
#pboard{position:relative}
#stage{position:absolute;transform-origin:0 0}
#selLayer{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:20}
#scroller.drawing{cursor:crosshair}
#scroller.pitcher,#scroller.pitcher .obj{cursor:copy}
#scroller.fpaint,#scroller.fpaint .obj{cursor:cell}
.hdl{position:absolute;width:9px;height:9px;background:#fff;border:1px solid #444;border-radius:50%;pointer-events:auto;margin:-5px 0 0 -5px;touch-action:none}
.hdl.rot{background:#3c9b49;border-color:#1c5d26}
.selbox{position:absolute;border:1px solid #2b6fd6;pointer-events:none;transform-origin:center}
.selbox.text{border:1px dashed #3a3a3a;outline:1px dashed #fff;outline-offset:-2px}
.selbox.multi{border-color:#888}
.ovf{position:absolute;width:18px;height:16px;background:#fff;border:1px solid #c42b1c;color:#c42b1c;font:700 10px/12px var(--ui);text-align:center;pointer-events:auto;cursor:pointer;border-radius:2px;margin:-8px 0 0 -9px}
.marq{position:absolute;border:1px dashed #2b6fd6;background:#2b6fd61a}
.snapln{position:absolute;background:#e3008c;pointer-events:none}
#statusbar{flex:none;height:24px;background:#f3f3f3;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 10px;font-size:12px;color:#444;white-space:nowrap;overflow:hidden}
#statusbar .sp{flex:1}
#zoomr{width:110px}
#statusbar button{border:0;background:transparent;cursor:pointer;font-size:12px;padding:0 4px;height:22px}
#statusbar button:hover{background:#ddd}

/* backstage */
#backstage{position:absolute;inset:0;z-index:60;display:flex;background:#fff}
#bsnav{width:200px;background:var(--teal);color:#fff;display:flex;flex-direction:column;padding-top:8px;flex:none}
#bsnav button{background:transparent;border:0;color:#fff;text-align:left;padding:10px 20px;font-size:14px;cursor:pointer}
#bsnav button:hover{background:#ffffff22}
#bsnav button[aria-current=true]{background:#06483f;font-weight:600}
#bsnav .back{font-size:20px;padding:8px 18px}
#bsmain{flex:1;overflow:auto;padding:24px 34px;font-size:13px}
#bsmain h2{font:300 32px var(--ui);margin:0 0 18px;color:#222}
#bsmain h3{font-weight:600;font-size:15px;margin:18px 0 8px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tpl{background:#fff;border:1px solid #ddd;border-radius:4px;cursor:pointer;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px}
.tpl:hover,.tpl:focus-visible{border-color:var(--teal);background:#f3faf9}
.tpl .tv{background:#fff;box-shadow:0 1px 4px #0004;position:relative;overflow:hidden}
.bslist{display:flex;flex-direction:column;gap:4px;max-width:640px}
.bsitem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:4px;background:transparent;cursor:pointer;text-align:left;width:100%}
.bsitem:hover{background:#eef6f5;border-color:#cfe6e2}
.bsitem .big{font-size:22px;width:34px;text-align:center}
.bsitem small{display:block;color:#666}
@media (max-width:700px){#bsnav{width:120px}#bsnav button{padding:9px 10px;font-size:13px}#bsmain{padding:16px}}

/* menus, dialogs, toasts */
#menuRoot{position:fixed;left:0;top:0;z-index:7000}
.menu{position:fixed;background:#fff;border:1px solid #c6c6c6;box-shadow:0 6px 18px #0003;padding:4px 0;min-width:180px;max-height:70vh;overflow:auto;font-size:12.5px;font-family:var(--ui);color:#222}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;text-align:left;padding:5px 14px 5px 10px;cursor:pointer;white-space:nowrap}
.menu .mi:hover,.menu .mi:focus{background:#e3efed;outline:none}
.menu .mi .ck{width:14px;text-align:center}
.menu .mi:disabled{opacity:.45}
.menu .msep{height:1px;background:#e0e0e0;margin:4px 0}
.menu .mh{font-weight:600;padding:5px 10px;color:#444;background:#f3f3f3;font-size:12px}
.menu .mgrid{display:grid;gap:3px;padding:4px 8px}
.menu .mgrid button{border:1px solid #ddd;background:#fff;cursor:pointer;padding:0;border-radius:2px}
.menu .mgrid button:hover{border-color:var(--teal);outline:1px solid var(--teal)}
.sw{width:18px;height:18px;display:block;border:1px solid #0002}
#modalRoot .ov{position:fixed;inset:0;background:#0006;z-index:8000;display:grid;place-items:center;padding:12px}
.dlg{background:#fff;border-radius:6px;box-shadow:0 12px 40px #0006;max-width:min(640px,96vw);width:100%;max-height:90vh;display:flex;flex-direction:column;font-family:var(--ui);color:#222}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e3e3e3;font-weight:600;font-size:14px}
.dlg header button{border:0;background:transparent;font-size:18px;cursor:pointer;width:30px;height:28px}
.dlg .db{padding:14px;overflow:auto;font-size:13px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid #e3e3e3;flex-wrap:wrap}
.dbtn{border:1px solid #bdbdbd;background:#fdfdfd;border-radius:3px;padding:5px 14px;cursor:pointer;min-width:76px}
.dbtn:hover{background:#eee}
.dbtn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.dbtn.pri:hover{background:var(--teal2)}
.dlg label{display:block;margin:6px 0 2px;font-weight:600;font-size:12.5px}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{width:100%;border:1px solid #bdbdbd;border-radius:3px;padding:5px 7px;font-size:13px;background:#fff}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .tabsd{display:flex;gap:2px;border-bottom:1px solid #ddd;margin:-4px 0 10px;flex-wrap:wrap}
.dlg .tabsd button{border:1px solid transparent;border-bottom:0;background:transparent;padding:6px 10px;cursor:pointer;border-radius:3px 3px 0 0}
.dlg .tabsd button[aria-selected=true]{border-color:#ddd;background:#fff;font-weight:600;margin-bottom:-1px}
.clipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.clipgrid button{border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.clipgrid button:hover,.clipgrid button[aria-pressed=true]{border-color:var(--teal);background:#eef7f5}
.clipgrid img{width:96px;height:72px;object-fit:contain}
#toastRoot{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:9500;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#1f2a44;color:#fff;padding:8px 14px;border-radius:8px;box-shadow:0 6px 20px #0005;font:600 13px var(--body);max-width:90vw;pointer-events:auto;animation:tin .2s}
.toast.good{background:#0d6b3b}.toast.warn{background:#7a4a00}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9400;width:100%;height:100%}

/* mission panel */
#mpanel{flex:none;width:330px;background:linear-gradient(180deg,var(--navy2),var(--navy));color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;border-left:2px solid var(--gold);min-height:0;transition:width .2s}
#mpanel.collapsed{width:38px}
#mpanel.collapsed .mp-in{display:none}
#mpanel .mp-tog{background:transparent;border:0;color:var(--gold);font-size:16px;cursor:pointer;height:34px;width:36px;flex:none}
.mp-top{display:flex;align-items:center;gap:4px;border-bottom:1px solid #ffffff1f}
.mp-top .lv{font:700 12px var(--body);color:var(--gold);text-transform:uppercase;letter-spacing:.05em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mpanel.collapsed .mp-top .lv{display:none}
.mp-in{flex:1;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.mp-in h2{font:800 20px/1.15 var(--disp);margin:0;color:#fff}
.mp-ob{font-size:12px;color:var(--gold);font-weight:700}
.mp-brief{font-size:14px;line-height:1.45;color:var(--ink);background:#ffffff0d;border-left:3px solid var(--gold);padding:8px 10px;border-radius:0 8px 8px 0}
.mp-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:st}
.mp-steps li{display:flex;gap:8px;font-size:13.5px;line-height:1.35;padding:7px 8px;border-radius:9px;background:#ffffff0a;border:1px solid #ffffff14}
.mp-steps li .n{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #ffffff55;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.mp-steps li.done{background:#1e7a4c33;border-color:#3fbf7f66}
.mp-steps li.done .n{background:#3fbf7f;border-color:#3fbf7f;color:#04220f}
.mp-steps li.cur{border-color:var(--gold)}
.mp-steps li .fb{display:block;margin-top:4px;color:#ffd6a0;font-size:12.5px}
.mp-steps li .hn{display:block;margin-top:4px;color:#bfe3ff;font-size:12.5px}
.mp-act{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mbtn{background:#ffffff12;border:1px solid #ffffff30;color:var(--ink);border-radius:10px;padding:8px 6px;font:700 13px var(--body);cursor:pointer}
.mbtn:hover{border-color:var(--gold);color:#fff}
.mbtn.pri{grid-column:1/-1;background:var(--gold);color:#1b1400;border-color:var(--gold);font-size:14.5px}
.mbtn.pri:hover{background:var(--gold2)}
.mp-res{background:#ffffff10;border:1px solid var(--gold);border-radius:12px;padding:12px;text-align:center}
.mp-res .big{font-size:30px;letter-spacing:4px}
.mp-res p{margin:6px 0}
.mp-small{font-size:12px;color:var(--muted)}
.mp-timer{display:flex;align-items:center;gap:8px;font-size:13px}
.mp-timer b{color:var(--gold);font-variant-numeric:tabular-nums}
#mpFab{display:none}
@media (max-width:900px){
  #mpanel{position:absolute;right:0;top:0;bottom:0;z-index:70;box-shadow:-8px 0 24px #0007;width:min(340px,92vw)}
  #mpanel.collapsed{width:0;border:0;overflow:hidden}
  #mpFab{display:flex;position:absolute;right:10px;bottom:34px;z-index:65;background:var(--gold);color:#1b1400;border:0;border-radius:99px;padding:10px 14px;font:700 13px var(--body);box-shadow:0 6px 18px #0006;cursor:pointer}
  #nav{width:84px}
}
@media (max-width:600px){#nav{display:none}#statusbar .hidem{display:none}}

/* design checker pane */
#dcpane{position:absolute;right:8px;top:8px;width:290px;max-height:calc(100% - 16px);overflow:auto;background:#fff;border:1px solid #bbb;box-shadow:0 6px 20px #0003;z-index:40;font-size:12.5px}
#dcpane header{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f3f3f3;border-bottom:1px solid #ddd;font-weight:600}
#dcpane header button{border:0;background:transparent;font-size:16px;cursor:pointer}
#dcpane ul{list-style:none;margin:0;padding:6px 10px}
#dcpane li{padding:6px 0;border-bottom:1px solid #eee;display:flex;gap:6px}
#dcpane li .ok{color:#0d6b3b;font-weight:700}#dcpane li .bad{color:#b3261e;font-weight:700}

/* print */
#printRoot{display:none}
@media print{
  body{background:#fff!important;overflow:visible!important;height:auto}
  html{overflow:visible!important;height:auto}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .ppage{page-break-after:always;break-after:page;position:relative;overflow:hidden}
  #printRoot .qref{color:#000}
}
#ah{position:fixed;left:-30000px;top:0;visibility:hidden;pointer-events:none}
.qref table{border-collapse:collapse;width:100%;font-size:12.5px}
.qref td,.qref th{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}
.qref th{background:#eef6f5}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px solid #ddd;border-radius:10px;padding:8px;text-align:center;font-size:12px}
.badge .e{font-size:26px;display:block}
.badge.lock{opacity:.45;filter:grayscale(1)}
.kbd{display:inline-block;border:1px solid #bbb;border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px var(--ui);background:#fafafa}

<!-- gamesave:start --><script id="gamesave-kit">
/* GameSave: every game remembers its progress on this device, and can start over. Developed by Kester Small
   API (window.GameSave):
     GameSave.id                      this game's id (from <html data-game="…">, else the page name)
     GameSave.register(['key', 'prefix*', /regex/])   storage keys that belong to this game (also caught automatically when set with localStorage.setItem)
     GameSave.persist({ key, get, set, every })       save get() under key (on every save(), every `every` ms, and when the page is hidden); on load call set(saved) once
     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)
     GameSave.onReset(fn)             run fn before the page reloads after a reset
     GameSave.startOver()             ask "Start over?" and, if confirmed, clear this game's saved progress and reload
     GameSave.reset({reload})         clear without asking
   Inside the course the player bar shows "↺ Start over"; on its own page a small "↺ Start over" button appears unless
   <html data-gs-own> says the game already has its own visible reset (which should call GameSave.startOver()). */
(function () {
  if (window.GameSave) return;
  var LS = null; try { LS = window.localStorage; LS.getItem('gs:probe'); } catch (e) { LS = null; }
  var html = document.documentElement;
  var page = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
  var id = html.getAttribute('data-game') || page;
  if (!id || /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(id)) id = (document.title || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'game';
  var REG = 'gs:keys:' + id;
  var SKIP = /^(gs:|ws\.|course\.|nocopy|simsave)/;
  var keys = []; try { keys = JSON.parse((LS && LS.getItem(REG)) || '[]') || []; } catch (e) { keys = []; }
  var patterns = [], hooks = [], persisters = [], rawSet = null;
  function track(k) {
    k = String(k); if (!LS || SKIP.test(k) || keys.indexOf(k) >= 0) return;
    keys.push(k); try { (rawSet || LS.setItem).call(LS, REG, JSON.stringify(keys)); } catch (e) { }
  }
  if (LS) {
    try {
      var proto = Object.getPrototypeOf(LS); rawSet = proto.setItem;
      proto.setItem = function (k, v) { var r = rawSet.apply(this, arguments); if (this === LS) track(k); return r; };
    } catch (e) { rawSet = null; }
  }
  function matches(k) {
    if (keys.indexOf(k) >= 0) return true;
    return patterns.some(function (p) { return p instanceof RegExp ? p.test(k) : (p.slice(-1) === '*' ? k.indexOf(p.slice(0, -1)) === 0 : k === p); });
  }
  function owned() { var out = []; if (!LS) return out; for (var i = 0; i < LS.length; i++) { var k = LS.key(i); if (k && !SKIP.test(k) && matches(k)) out.push(k); } return out; }
  var resetting = false;
  function reset(opt) {
    opt = opt || {}; resetting = true;
    hooks.forEach(function (fn) { try { fn(); } catch (e) { } });
    owned().forEach(function (k) { try { LS.removeItem(k); } catch (e) { } });
    persisters.forEach(function (p) { try { LS.removeItem(p.key); } catch (e) { } });
    try { LS.removeItem(REG); } catch (e) { }
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'gs:reset-done', id: id }, '*'); } catch (e) { }
    if (opt.reload !== false) setTimeout(function () { location.reload(); }, 60);
  }
  function css() {
    if (document.getElementById('gs-css')) return;
    var st = document.createElement('style'); st.id = 'gs-css';
    st.textContent = '.gs-modal{position:fixed;inset:0;z-index:2147483600;display:grid;place-items:center;padding:16px;background:rgba(3,8,24,.62);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}' +
      '.gs-box{max-width:420px;width:100%;background:#0F1E4A;color:#F1F4FF;border:2px solid #F5C542;border-radius:16px;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}' +
      '.gs-box h2{margin:0 0 8px;font-size:1.2rem;color:#FFE38A}.gs-box p{margin:0 0 14px}' +
      '.gs-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}' +
      '.gs-row button{font:700 14px system-ui,sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer;border:2px solid #F5C542}' +
      '.gs-keep{background:transparent;color:#F1F4FF}.gs-go{background:#F5C542;color:#0A1433}' +
      '.gs-row button:focus-visible{outline:3px solid #fff;outline-offset:2px}' +
      '.gs-pill{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483500;font:700 12px/1 system-ui,sans-serif;color:#fff;background:rgba(10,20,51,.85);border:1px solid rgba(245,197,66,.7);border-radius:99px;padding:7px 11px;cursor:pointer;opacity:.6}' +
      '.gs-pill:hover,.gs-pill:focus-visible{opacity:1;background:#F5C542;color:#0A1433}' +
      '.gs-toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:2147483550;background:#0F1E4A;color:#F1F4FF;border:1px solid #F5C542;border-radius:99px;padding:8px 16px;font:700 13px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .4s}' +
      '@media print{.gs-pill,.gs-toast,.gs-modal{display:none!important}}';
    (document.head || document.documentElement).appendChild(st);
  }
  function toast(msg) {
    if (!document.body) return; css();
    var t = document.createElement('div'); t.className = 'gs-toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; }, 2600); setTimeout(function () { t.remove(); }, 3100);
  }
  function startOver() {
    if (!document.body) return reset();
    if (document.querySelector('.gs-modal')) return;
    css();
    var prev = document.activeElement;
    var m = document.createElement('div'); m.className = 'gs-modal';
    m.innerHTML = '<div class="gs-box" role="alertdialog" aria-modal="true" aria-labelledby="gs-t" aria-describedby="gs-d"><h2 id="gs-t">Start this game again?</h2>' +
      '<p id="gs-d">Your saved progress in this game on this device will be cleared and the game will start from the beginning. Work you have already submitted and your course progress are not affected.</p>' +
      '<div class="gs-row"><button type="button" class="gs-keep">Keep my progress</button><button type="button" class="gs-go">↺ Start over</button></div></div>';
    document.body.appendChild(m);
    var keep = m.querySelector('.gs-keep'), go = m.querySelector('.gs-go');
    function close() { m.remove(); document.removeEventListener('keydown', onKey, true); try { prev && prev.focus && prev.focus(); } catch (e) { } }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } if (e.key === 'Tab') { e.preventDefault(); (document.activeElement === keep ? go : keep).focus(); } }
    keep.addEventListener('click', close); go.addEventListener('click', function () { close(); reset(); });
    m.addEventListener('click', function (e) { if (e.target === m) close(); });
    document.addEventListener('keydown', onKey, true); keep.focus();
  }
  function saveAll() {
    if (resetting || !LS) return;
    persisters.forEach(function (p) { try { var v = p.get(); if (v !== undefined) (rawSet || LS.setItem).call(LS, p.key, JSON.stringify({ v: v, at: Date.now() })); } catch (e) { } });
  }
  function persist(o) {
    if (!o || typeof o.get !== 'function') return false;
    var p = { key: o.key || ('gsave.' + id), get: o.get }; persisters.push(p); track(p.key);
    var restored = false;
    if (LS && typeof o.set === 'function') {
      try { var raw = LS.getItem(p.key); if (raw) { var d = JSON.parse(raw); if (d && 'v' in d) { o.set(d.v); restored = true; } } } catch (e) { }
    }
    if (o.every) setInterval(saveAll, Math.max(2000, +o.every || 0));
    if (restored && o.welcome !== false) setTimeout(function () { toast('Welcome back! Your progress was restored.'); }, 400);
    return restored;
  }
  window.addEventListener('pagehide', saveAll);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveAll(); });
  window.addEventListener('message', function (e) { var d = e.data; if (d && d.type === 'gs:reset') { if (d.ask === false) reset(); else startOver(); } });
  function pill() {
    if (window.parent !== window || html.hasAttribute('data-gs-own') || html.hasAttribute('data-gs-none') || !document.body || document.querySelector('.gs-pill')) return;
    css(); var b = document.createElement('button'); b.type = 'button'; b.className = 'gs-pill'; b.textContent = '↺ Start over'; b.title = 'Clear your saved progress in this game and start again';
    b.addEventListener('click', startOver); document.body.appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pill); else pill();
  window.GameSave = {
    id: id,
    register: function (list) { (Array.isArray(list) ? list : [list]).forEach(function (k) { if (k instanceof RegExp || (typeof k === 'string' && k.slice(-1) === '*')) patterns.push(k); else if (k) track(k); }); },
    persist: persist, save: saveAll, onReset: function (fn) { if (typeof fn === 'function') hooks.push(fn); },
    startOver: startOver, reset: reset, keys: owned, toast: toast
  };
})();

</script><!-- gamesave:end -->
<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

<!-- simsave:start --><script id="simsave-kit">
/* SimSave kit v1: lets students save what they make in the simulators as real files.
   Word (.docx), Excel (.xlsx), CSV, PDF, JPG, PNG, SVG, HTML and TXT, written in the browser with no server.
   Files go through the course's download route (parent.offerFile) when the simulator runs inside the course,
   or a normal browser download when the page is opened on its own. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.SimSave) return;
  const enc = new TextEncoder();
  const xesc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

  /* ------------------------------------------------------------ download route */
  function cleanName(n, ext) {
    n = String(n || 'My_work').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '').replace(/[\u00B7\u2013\u2014]/g, '-').replace(/[^\x20-\x7E]/g, '').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').replace(/_+/g, '_').slice(0, 80) || 'My_work';
    if (ext && !n.toLowerCase().endsWith('.' + ext)) n = n.replace(/\.[a-z0-9]{2,5}$/i, '') + '.' + ext;
    return n;
  }
  async function save(filename, blob) {
    try {
      if (window.parent && window.parent !== window && typeof window.parent.offerFile === 'function') {
        const ok = await window.parent.offerFile(filename, blob);
        toast(ok === false ? 'Save cancelled.' : 'Saved: ' + filename);
        return ok !== false;
      }
    } catch (e) { /* cross-origin parent: fall through */ }
    try {
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 8000);
      toast('Saved: ' + filename);
      return true;
    } catch (e) { toast('This browser blocked the download.'); return false; }
  }
  let tT = null;
  function toast(msg) {
    let t = document.getElementById('ss-toast');
    if (!t) { t = document.createElement('div'); t.id = 'ss-toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
    t.textContent = msg; t.className = 'on'; clearTimeout(tT); tT = setTimeout(() => { t.className = ''; }, 2600);
  }

function bbPullQuote(cx,cy){return GR([SH('rect',cx-I(1.6),cy,I(3.2),I(1.4),{fill:'a1~0.85',line:{c:'a1',w:1}}),TX(cx-I(1.45),cy+I(.1),I(2.9),I(1.2),P('"Place a short, eye-catching quotation from your story here."'),{font:'+h',size:14,i:true,color:'a1',al:'center',va:'m'})],{bb:'Page Parts',name:'Pull Quote'})}
function bbSidebar(cx,cy){return GR([SH('rect',cx-I(1.2),cy,I(2.4),I(3),{fill:'a2~0.8'}),TX(cx-I(1.05),cy+I(.12),I(2.1),I(2.76),'<p><b>Sidebar heading</b></p>'+Ps(['Point one','Point two','Point three'],'bl'),{size:11})],{bb:'Page Parts',name:'Sidebar'})}
function bbCalendar(cx,cy,month,year){
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();
  const weeks=Math.ceil((first+days)/7);
  const t=TB(weeks+1,7,cx-I(2),cy+I(.5),I(4),I(.3)*(weeks+1),{size:10,ts:2,name:'Calendar'});
  'Sun Mon Tue Wed Thu Fri Sat'.split(' ').forEach((n,j)=>t.rows[0][j].html=P(n));
  for(let dd=1;dd<=days;dd++){const p=first+dd-1;t.rows[1+Math.floor(p/7)][p%7].html=P(String(dd))}
  t.rows.forEach(r=>r.forEach(c=>c.al='center'));
  const ttl=TX(cx-I(2),cy,I(4),I(.45),P(names[month]+' '+year),{font:'+h',size:18,b:true,color:'a1',al:'center',va:'m'});
  return GR([ttl,t],{bb:'Calendars',name:'Calendar '+names[month]+' '+year});
}

/* ================= app state ================= */
const S={page:0,view:'normal',mi:0,sel:[],zoom:1,editing:null,tab:'home',guidesOn:true,rulersOn:true,baseOn:false,boundOn:false,navOn:true,snapG:true,snapO:true,
  drawMode:null,linkFrom:null,fpaint:null,clip:null,cell:[0,0],editSnap:null,fit:'whole'};
let UNDO=[],REDO=[];
let FLOWS=new Map();

function curList(){return S.view==='master'?D.masters[S.mi].objs:D.pages[S.page].objs}
function walk(list,fn,parent){for(const o of list){fn(o,list,parent);if(o.t==='group')walk(o.kids,fn,o)}}
function allLists(){const L=[];D.pages.forEach((p,i)=>L.push({list:p.objs,page:i}));D.masters.forEach((m,i)=>L.push({list:m.objs,master:i}));return L}
function findObj(id){let r=null;for(const L of allLists()){walk(L.list,(o,list,parent)=>{if(o.id===id&&!r)r={o,list,parent,page:L.page,master:L.master}});if(r)return r}return null}
const getO=id=>{const f=findObj(id);return f?f.o:null};
function selObjs(){return S.sel.map(getO).filter(Boolean)}
function hasText(o){return o&&(o.t==='text'||(o.t==='shape'&&o.html!=null))}

/* ================= undo ================= */
function snap(){UNDO.push(JSON.stringify(D));if(UNDO.length>60)UNDO.shift();REDO=[]}
function act(fn,opts){ if(S.editing) exitEdit(); snap(); fn(); changed(opts); }
function undo(){ if(S.editing){exitEdit();} if(!UNDO.length){toast('Nothing to undo');return} REDO.push(JSON.stringify(D)); D=JSON.parse(UNDO.pop()); fixState(); changed(); }
function redo(){ if(!REDO.length){toast('Nothing to redo');return} UNDO.push(JSON.stringify(D)); D=JSON.parse(REDO.pop()); fixState(); changed(); }
function fixState(){ S.page=clamp(S.page,0,D.pages.length-1); S.mi=clamp(S.mi,0,D.masters.length-1); S.sel=S.sel.filter(id=>{const f=findObj(id);return f&&!f.parent}); }

/* ================= html cleaning ================= */
function cleanHTML(html){
  const box=document.createElement('div');box.innerHTML=html||'';
  box.querySelectorAll('.wf,script,style,meta,link').forEach(e=>e.remove());
  box.querySelectorAll('font').forEach(f=>{const s=document.createElement('span');if(f.color)s.style.color=f.color;if(f.face)s.style.fontFamily=f.face;s.append(...f.childNodes);f.replaceWith(s)});
  box.querySelectorAll('div,h1,h2,h3,h4,h5,h6,li').forEach(dv=>{if(dv.closest('.wf'))return;const p=document.createElement('p');for(const a of dv.attributes)p.setAttribute(a.name,a.value);p.append(...dv.childNodes);dv.replaceWith(p)});
  box.querySelectorAll('ul,ol').forEach(l=>l.replaceWith(...l.childNodes));
  // nested p -> flatten
  box.querySelectorAll('p p').forEach(pp=>{pp.replaceWith(...pp.childNodes)});
  // wrap stray inline nodes at top level
  let cur=null;
  [...box.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.tagName==='P'){cur=null;return}
    if(n.nodeType===3&&!n.textContent.trim()&&!cur){n.remove();return}
    if(n.nodeType===1&&n.tagName==='BR'&&!cur){n.remove();return}
    if(!cur){cur=document.createElement('p');n.before(cur)}cur.append(n);
  });
  box.querySelectorAll('p').forEach(p=>{p.removeAttribute('contenteditable');if(p.getAttribute('class')==='')p.removeAttribute('class');
    // a p with only <br> becomes empty paragraph
    if(p.childNodes.length===1&&p.firstChild.nodeName==='BR')p.innerHTML='';});
  box.querySelectorAll('span').forEach(s=>{if(!s.attributes.length&&!s.className)s.replaceWith(...s.childNodes)});
  let out=box.innerHTML;
  if(!out.trim())out='<p></p>';
  return out;
}
function htmlText(html){const d=document.createElement('div');d.innerHTML=html||'';d.querySelectorAll('.wf').forEach(e=>e.remove());return [...d.querySelectorAll('p')].map(p=>p.textContent).join('\n')||d.textContent}
function objText(o){
  if(o.t==='text'||o.t==='shape') return o.prev?'':htmlText(o.html||'');
  if(o.t==='wa') return o.text||'';
  if(o.t==='table') return o.rows.map(r=>r.map(c=>htmlText(c.html)).join('\t')).join('\n');
  if(o.t==='group') return o.kids.map(objText).join('\n');
  return '';
}

/* ================= text flow (linked text boxes, wrapping, autofit) ================= */
let MH=null;

  [...src.childNodes].forEach((p,i)=>{

function chainOf(head){const c=[head];let cur=head,g=0;while(cur.next&&g++<50){const n=getO(cur.next);if(!n||c.includes(n))break;c.push(n);cur=n}return c}

function wrapFloats(o,list){

  const cx=o.x+bw+pad[3],cy=o.y+bw+pad[0],cw=o.w-2*bw-pad[1]-pad[3],ch=o.h-2*bw-pad[0]-pad[2];

function scaleHTMLFonts(html,f){return html.replace(/font-size:\s*([\d.]+)pt/g,(m,n)=>`font-size:${Math.round(n*f*2)/2}pt`)}

/* ================= geometry ================= */
function bbox(o,ox,oy){ // axis-aligned bounding box incl. rotation
  ox=ox||0;oy=oy||0;
  const x=o.x+ox,y=o.y+oy;
  if(!o.rot||o.rot%180===0)return {x,y,w:o.w,h:o.h};
  const a=o.rot*Math.PI/180,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));

}

function colLines(){const g=D.grid,m=D.m,xs=[],ys=[];
  if(g.c>1){const cw=(D.W-m.l-m.r-(g.c-1)*g.g)/g.c;for(let k=1;k<g.c;k++){xs.push(m.l+k*cw+(k-1)*g.g);xs.push(m.l+k*(cw+g.g))}}
  if(g.r>1){const rh=(D.H-m.t-m.b-(g.r-1)*g.g)/g.r;for(let k=1;k<g.r;k++){ys.push(m.t+k*rh+(k-1)*g.g);ys.push(m.t+k*(rh+g.g))}}
  return {xs,ys}}

/* ================= stage ================= */

  const st=$('#stage');st.style.left=STAGE.left+'px';st.style.top=STAGE.top+'px';st.style.transform=`scale(${z})`;
  const sl=$('#selLayer');sl.style.left=STAGE.left+'px';sl.style.top=STAGE.top+'px';

    cl.xs.forEach(x=>g+=`<div style="position:absolute;left:${x}px;top:${m.t}px;width:0;height:${D.H-m.t-m.b}px;border-left:${lw}px dashed #2e7dd6;pointer-events:none"></div>`);

function onDragUp(e){
  window.removeEventListener('pointermove',onDragMove);
  const d=DRAG;DRAG=null;if(!d)return;
  $$('#selLayer .snapln,#selLayer .marq').forEach(x=>x.remove());
  if(d.type==='move'){
    if(d.moved){UNDO.push(d.snap);REDO=[];changed()}
    else if(d.was){const o=getO(d.id);if(o&&(hasText(o)||o.t==='table'))enterEdit(d.id,d.cx,d.cy)}
  }else if(d.type==='handle'){if(d.snap&&d.changed){UNDO.push(d.snap);REDO=[];changed()}else render()}
  else if(d.type==='marq'){if(d.r&&d.r.w>3){const ids=curList().filter(o=>{const b=bbox(o);return b.x>=d.r.x&&b.y>=d.r.y&&b.x+b.w<=d.r.x+d.r.w&&b.y+b.h<=d.r.y+d.r.h}).map(o=>o.id);select(ids,e.shiftKey)}else{S.sel=[];render()}}
  else if(d.type==='draw')finishDraw(d);
  else if(d.type==='guide'){const g=D.guides[d.i];const r=$('#scroller').getBoundingClientRect();if((g.a==='v'&&e.clientX<r.left+2)||(g.a==='h'&&e.clientY<r.top+2)){D.guides.splice(d.i,1)}UNDO.push(d.snap);changed()}
  else if(d.type==='newguide'){if(d.p!=null){const r=$('#scroller').getBoundingClientRect();if((d.a==='h'&&e.clientY>r.top)||(d.a==='v'&&e.clientX>r.left))act(()=>D.guides.push({a:d.a,p:Math.round(d.p)}))}}
}

function startHandle(e,h){
  const o=selObjs()[0];if(!o)return;if(S.editing)exitEdit();
  const p0=toPage(e);
  DRAG={type:'handle',h,o,p0,start:{x:o.x,y:o.y,w:o.w,h:o.h,rot:o.rot||0},kids:o.t==='group'?clone(o.kids):null,snap:JSON.stringify(D),changed:false,targets:snapTargets([o.id])};
  addDragListeners();

function handleMove(e,p){
  const d=DRAG,o=d.o,s=d.start;d.changed=true;
  if(d.h==='rot'){
    const cx=s.x+s.w/2,cy=s.y+s.h/2;let a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90;
    if(e.shiftKey)a=Math.round(a/15)*15;a=Math.round(((a%360)+360)%360);if(a>180)a-=360;o.rot=a;
  }else{
    const [sx,sy]=d.h.split(',').map(Number);
    const a=(s.rot||0)*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
    const dx=p.x-d.p0.x,dy=p.y-d.p0.y;
    let ldx=dx*c+dy*sn,ldy=-dx*sn+dy*c;
    let nw=s.w+sx*ldx,nh=s.h+sy*ldy;
    const isLine=o.t==='shape'&&(o.sp==='line'||o.sp==='arrowLine');
    if(!isLine){nw=Math.max(8,nw);nh=Math.max(8,nh)}
    const lock=(o.t==='pic'||o.t==='group'||o.t==='wa')!==e.shiftKey;
    if(sx&&sy&&lock&&!isLine&&s.w>0&&s.h>0){const f=Math.max(nw/s.w,nh/s.h);nw=s.w*f;nh=s.h*f}
    if(!s.rot&&!isLine&&!e.altKey){ // snap moving edges
      if(sx){const edge=sx>0?s.x+nw:s.x+s.w-nw;const b=snapDelta([edge],d.targets.xs);if(b){nw+=sx>0?b.d:-b.d}}
      if(sy){const edge=sy>0?s.y+nh:s.y+s.h-nh;const b=snapDelta([edge],d.targets.ys);if(b){nh+=sy>0?b.d:-b.d}}
    }
    if(isLine){ // free endpoints
      if(sx<0){o.x=s.x+dx;o.y=s.y+dy;o.w=s.w-dx;o.h=s.h-dy}else{o.w=s.w+dx;o.h=s.h+dy}
      if(o.w<0){o.x+=o.w;o.w=-o.w;o.fh=!o.fh}if(o.h<0){o.y+=o.h;o.h=-o.h;o.fv=!o.fv}
    }else{
      const dcx=sx*(nw-s.w)/2,dcy=sy*(nh-s.h)/2;
      const gx=dcx*c-dcy*sn,gy=dcx*sn+dcy*c;
      const ncx=s.x+s.w/2+gx,ncy=s.y+s.h/2+gy;
      o.w=nw;o.h=nh;o.x=ncx-nw/2;o.y=ncy-nh/2;
      if(o.t==='group'){const fx=nw/s.w,fy=nh/s.h;o.kids=clone(d.kids);scaleKids(o.kids,fx,fy)}
      if(o.t==='wa')o.size=Math.max(8,Math.round(nh*.75/1.25));
    }
  }
  const el=objEl(o.id);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=renderObj(o,{pn:S.view==='master'?'#':S.page+1});el.replaceWith(tmp.firstChild)}
  renderSel();drawRulers();updateStatus();
}

/* ---- linking text boxes ---- */
function startLink(id){
  const o=getO(id);if(!o||o.t!=='text'){toast('Select a text box first');return}
  if(o.next){toast('This text box is already linked. Use Break to unlink it first.','warn');return}
  if(S.editing)exitEdit();
  S.sel=[id];S.linkFrom=id;scroller().classList.add('pitcher');updateStatus();render();
  toast('🫗 Pitcher ready: click an EMPTY text box (or click the page to make a new one)');
}
function cancelModes(){S.linkFrom=null;S.fpaint=null;scroller().classList.remove('pitcher','fpaint');if(S.drawMode)setDrawMode(null);updateStatus()}
function finishLink(targetId,e){
  const from=getO(S.linkFrom);cancelModes();
  if(!from)return;
  if(!targetId){
    const p=toPage(e);const nb=TX(p.x,p.y,from.w,Math.min(from.h,I(2)),'<p></p>',{size:from.size,font:from.font,color:from.color});
    act(()=>{curList().push(nb);from.next=nb.id;nb.prev=from.id;S.sel=[nb.id]});toast('New text box created and linked ✔','good');return;
  }
  const to=getO(targetId);
  if(!to||to.t!=='text'){toast('You can only link to a text box.','warn');return}
  if(to===from){toast('Choose a different text box.','warn');return}
  if(to.prev||to.next||htmlText(to.html).trim()){toast('That text box is not empty. Link to an empty text box.','warn');return}
  if(chainOf(headOf(from)).includes(to)){toast('That box is already in this story.','warn');return}
  act(()=>{from.next=to.id;to.prev=from.id;to.html='<p></p>';S.sel=[to.id]});
  toast('Text boxes linked: the story now flows into the next box ✔','good');
}
function breakLink(){
  const o=selObjs()[0];if(!o||!o.next){toast('Select a text box that is linked to a next box');return}
  act(()=>{const head=headOf(o);const chain=chainOf(head);const fr=chain.map(b=>(FLOWS.get(b.id)||{}).html||'');fr.push((FLOWS.get(head.id)||{}).rest||'');
    const idx=chain.indexOf(o);head.html=mergeStory(fr);const n=getO(o.next);if(n)n.prev=null;o.next=null;
    for(let k=idx+1;k<chain.length;k++){chain[k].html='<p></p>'}
  });
}

function startFormatPainter(){const o=selObjs()[0];if(!o){toast('Select the object whose formatting you want to copy');return}S.fpaint=FP_KEYS.reduce((a,k)=>{if(o[k]!==undefined)a[k]=clone(o[k]);return a},{});scroller().classList.add('fpaint');toast('🖌 Format Painter: click the object to paint')}
function applyFormatPainter(id){const f=S.fpaint;cancelModes();const o=getO(id);if(!o)return;act(()=>{Object.keys(f).forEach(k=>{if(k in o||hasText(o))o[k]=clone(f[k])});if(hasText(o))o.html=stripInline(o.html,['font-family','font-size','color','font-weight','font-style','text-decoration']);S.sel=[id]})}
function stripInline(html,props){
  const d=document.createElement('div');d.innerHTML=html;
  d.querySelectorAll('[style]').forEach(el=>{props.forEach(p=>el.style.removeProperty(p));if(!el.getAttribute('style'))el.removeAttribute('style')});
  if(props.includes('font-weight'))d.querySelectorAll('b,strong').forEach(b=>b.replaceWith(...b.childNodes));
  if(props.includes('font-style'))d.querySelectorAll('i,em').forEach(b=>b.replaceWith(...b.childNodes));
  if(props.includes('text-decoration'))d.querySelectorAll('u').forEach(b=>b.replaceWith(...b.childNodes));
  return cleanHTML(d.innerHTML);
}

let MENU_STACK=[];
function closeMenus(){$('#menuRoot').innerHTML='';MENU_STACK=[]}
function openMenu(anchor,items,opts){
  closeMenus();
  const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  items.forEach(it=>{
    if(!it)return;
    if(it.sep){m.insertAdjacentHTML('beforeend','<div class="msep" role="separator"></div>');return}
    if(it.head){const d=document.createElement('div');d.className='mh';d.textContent=it.head;m.append(d);return}
    if(it.html){const d=document.createElement('div');d.innerHTML=it.html;if(it.bind)it.bind(d);m.append(d);return}
    const b=document.createElement('button');b.type='button';b.className='mi';b.setAttribute('role','menuitem');
    b.innerHTML=`<span class="ck">${it.check?'✓':(it.icon?ico(it.icon):'')}</span>${it.sw?`<span class="sw" style="background:${it.sw}"></span>`:''}<span>${esc(it.label)}</span>${it.key?`<span style="margin-left:auto;color:#777;padding-left:16px">${esc(it.key)}</span>`:''}`;
    if(it.id)b.id='mi-'+it.id;
    if(it.dis)b.disabled=true;
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',()=>{closeMenus();it.on&&it.on()});
    m.append(b);
  });
  $('#menuRoot').append(m);
  const r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:anchor.x,bottom:anchor.y,top:anchor.y};
  let x=r.left,y=r.bottom+2;
  const mw=m.offsetWidth,mh=m.offsetHeight;
  if(x+mw>innerWidth-4)x=Math.max(4,innerWidth-mw-4);if(y+mh>innerHeight-4)y=Math.max(4,(r.top||y)-mh-2);
  m.style.left=x+'px';m.style.top=y+'px';
  const f=m.querySelector('.mi:not(:disabled),button');if(f&&!(opts&&opts.nofocus))f.focus({preventScroll:true});
  m.addEventListener('keydown',e=>{const bs=[...m.querySelectorAll('button:not(:disabled)')];const i=bs.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(bs[i+1]||bs[0]).focus()}else if(e.key==='ArrowUp'){e.preventDefault();(bs[i-1]||bs[bs.length-1]).focus()}else if(e.key==='Escape'){e.preventDefault();closeMenus();anchor.focus&&anchor.focus()}});
  return m;
}
document.addEventListener('mousedown',e=>{if(!e.target.closest('.menu')&&!e.target.closest('[data-menu]'))closeMenus()});

/* ================= dialogs & toasts ================= */
let LAST_FOCUS=null;
function dialog({title,body,buttons,wide,onOpen,cls}){
  LAST_FOCUS=document.activeElement;
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="dlg ${cls||''}" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="${wide?'max-width:min(860px,96vw)':''}"><header><span>${esc(title)}</span><button type="button" class="dx" aria-label="Close dialog">×</button></header><div class="db">${body}</div><footer></footer></div>`;
  const ft=ov.querySelector('footer');
  (buttons||[{label:'Close',pri:1}]).forEach(b=>{const bt=document.createElement('button');bt.type='button';bt.className='dbtn'+(b.pri?' pri':'');bt.textContent=b.label;if(b.id)bt.id=b.id;bt.addEventListener('click',()=>{const r=b.on?b.on(ov):undefined;if(r!==false)closeDialog(ov)});ft.append(bt)});
  if(!ft.children.length)ft.remove();
  ov.querySelector('.dx').addEventListener('click',()=>closeDialog(ov));
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeDialog(ov)});
  ov.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.stopPropagation();closeDialog(ov)}
    if(e.key==='Tab'){const f=[...ov.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='color'){const p=ov.querySelector('.dbtn.pri');if(p){e.preventDefault();p.click()}}
  });
  $('#modalRoot').append(ov);
  if(onOpen)onOpen(ov);
  const f=ov.querySelector('.db input,.db select,.db textarea,.db button')||ov.querySelector('.dbtn.pri')||ov.querySelector('.dx');f&&f.focus();
  return ov;
}
function closeDialog(ov){ov.remove();if(LAST_FOCUS&&LAST_FOCUS.focus&&document.contains(LAST_FOCUS))LAST_FOCUS.focus({preventScroll:true})}
function confirmBox(title,msg,yes,on){dialog({title,body:`<p>${msg}</p>`,buttons:[{label:yes||'OK',pri:1,on},{label:'Cancel'}]})}
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=msg;$('#toastRoot').append(t);setTimeout(()=>t.remove(),kind==='good'?2600:3200);while($('#toastRoot').children.length>3)$('#toastRoot').firstChild.remove()}

const STYLE_DEFS={'Normal':{f:'+b',s:11,c:'main'},'Title':{f:'+h',s:36,c:'a1',b:1},'Heading 1':{f:'+h',s:20,c:'a1',b:1},'Heading 2':{f:'+h',s:14,c:'a2',b:1},'Body Text':{f:'+b',s:11,c:'main'},'Quote':{f:'+b',s:14,c:'a2',i:1},'Caption':{f:'+b',s:9,c:'main',i:1}};
function textTargets(){return selObjs().flatMap(o=>o.t==='group'?flatKids(o).filter(k=>hasText(k)||k.t==='table'||k.t==='wa'):[o]).filter(o=>hasText(o)||o.t==='table'||o.t==='wa')}
function flatKids(g){return g.kids.flatMap(k=>k.t==='group'?flatKids(k):[k])}
function curParas(){
  const ed=editEl();if(!ed)return [];restoreRange();
  const s=getSelection();if(!s.rangeCount)return [];const r=s.getRangeAt(0);
  const ps=[...ed.querySelectorAll('p')].filter(p=>r.intersectsNode(p));
  if(!ps.length){const p=(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement).closest('p');if(p)ps.push(p)}
  if(!ps.length&&ed){const np=document.createElement('p');np.append(...ed.childNodes);ed.append(np);ps.push(np)}
  return ps;
}
const PARA_KINDS=['al','bullets','numbering','style','indent','outdent','dropcap'];
function sentinelFix(ed,prop,sent,val){ed.querySelectorAll('[style]').forEach(el=>{const v=el.style.getPropertyValue(prop);if(v&&v.replace(/['"\s]/g,'').toLowerCase().includes(sent))el.style.setProperty(prop,val)});ed.querySelectorAll('font').forEach(f=>{if((f.getAttribute('face')||'').includes(sent)||(f.getAttribute('color')||'').toLowerCase().includes(sent)){const sp=document.createElement('span');sp.style.setProperty(prop,val);sp.append(...f.childNodes);f.replaceWith(sp)}})}
function fmt(kind,val){
  const targets=textTargets();
  if(!S.editing&&!targets.length){toast('Select a text box (or click inside one) first');return}
  if(S.editing&&PARA_KINDS.includes(kind)){
    const o=getO(S.editing);
    if(o&&o.t!=='table'){
      const ps=curParas();
      ps.forEach(p=>{
        if(kind==='al')p.style.textAlign=val;
        if(kind==='bullets'){const on=!p.classList.contains('bl');ps.forEach(q=>{q.classList.toggle('bl',on);q.classList.remove('nm')});}
        if(kind==='numbering'){const on=!p.classList.contains('nm');ps.forEach(q=>{q.classList.toggle('nm',on);q.classList.remove('bl')})}
        if(kind==='indent')p.style.marginLeft=(parseFloat(p.style.marginLeft)||0)+0.25+'in';
        if(kind==='outdent')p.style.marginLeft=Math.max(0,(parseFloat(p.style.marginLeft)||0)-0.25)+'in';
        if(kind==='style')applyStyleToP(p,val);
      });
      if(kind==='dropcap'){const f=editEl().querySelector('p');if(f)f.classList.toggle('dc')}
      afterInline();return;
    }
  }
  if(S.editing&&hasTextSelection()&&!PARA_KINDS.includes(kind)&&kind!=='case'){
    const ed=editEl();
    try{document.execCommand('styleWithCSS',false,true)}catch(e){}
    if(kind==='b')document.execCommand('bold');
    else if(kind==='i')document.execCommand('italic');
    else if(kind==='u')document.execCommand('underline');
    else if(kind==='sub')document.execCommand('subscript');
    else if(kind==='sup')document.execCommand('superscript');
    else if(kind==='strike')document.execCommand('strikeThrough');
    else if(kind==='clear')document.execCommand('removeFormat');
    else if(kind==='font'){if(val[0]==='+'){document.execCommand('fontName',false,'zzsent');sentinelFix(ed,'font-family','zzsent',val==='+h'?'var(--fh)':'var(--fb)')}else document.execCommand('fontName',false,val)}
    else if(kind==='color'){const c=val||'main';if(c[0]==='#')document.execCommand('foreColor',false,c);else{document.execCommand('foreColor',false,'#010203');sentinelFix(ed,'color','rgb(1,2,3)',col(c));sentinelFix(ed,'color','#010203',col(c))}}
    else if(kind==='size'||kind==='grow'||kind==='shrink'){
      let v=val;if(kind!=='size'){const s=getSelection();const n=s.anchorNode&&(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);const cur=n?parseFloat(getComputedStyle(n).fontSize)*.75:11;v=kind==='grow'?(SIZES.find(x=>x>cur+.1)||cur+4):([...SIZES].reverse().find(x=>x<cur-.1)||Math.max(1,cur-1))}
      document.execCommand('fontSize',false,'7');
      ed.querySelectorAll('font[size="7"]').forEach(f=>{const sp=document.createElement('span');sp.style.fontSize=v+'pt';sp.append(...f.childNodes);f.replaceWith(sp)});
      ed.querySelectorAll('span').forEach(sp=>{if(sp.style.fontSize==='xxx-large'||sp.style.fontSize==='-webkit-xxx-large')sp.style.fontSize=v+'pt'});
    }
    else if(kind==='highlight')document.execCommand('hiliteColor',false,val||'transparent');
    afterInline();return;
  }
  if(S.editing&&kind==='case'){const s=getSelection();if(!s.isCollapsed){document.execCommand('insertText',false,changeCase(s.toString(),val));afterInline();return}}
  editAware(()=>{textTargets().forEach(o=>applyBox(o,kind,val))});
}
function afterInline(){renderRibbonState();if(typeof onDocChanged==='function')onDocChangedSoft&&onDocChangedSoft()}
function changeCase(t,m){if(m==='upper')return t.toUpperCase();if(m==='lower')return t.toLowerCase();if(m==='title')return t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());return t.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase())}
function applyStyleToP(p,name){const d=STYLE_DEFS[name];if(!d)return;p.dataset.st=name;p.style.fontFamily=fontCss(d.f);p.style.fontSize=d.s+'pt';p.style.color=col(d.c);p.style.fontWeight=d.b?'700':'400';p.style.fontStyle=d.i?'italic':'normal';
  p.querySelectorAll('[style]').forEach(el=>['font-family','font-size','color','font-weight','font-style'].forEach(pr=>el.style.removeProperty(pr)));p.querySelectorAll('b,i,strong,em').forEach(b=>b.replaceWith(...b.childNodes))}
function mapParas(html,fn){const d=document.createElement('div');d.innerHTML=html;[...d.querySelectorAll('p')].forEach(fn);return cleanHTML(d.innerHTML)}
function applyBox(o,kind,val){
  const strip=(props)=>{if(o.t==='table')o.rows.forEach(r=>r.forEach(c=>c.html=stripInline(c.html,props)));else if(o.html!=null)o.html=stripInline(o.html,props)};
  const paras=(fn)=>{if(o.t==='table')o.rows.forEach(r=>r.forEach(c=>c.html=mapParas(c.html,fn)));else if(o.html!=null)o.html=mapParas(o.html,fn)};
  if(o.t==='wa'){
    if(kind==='font')o.font=val;else if(kind==='size'){o.size=val;const nh=val*1.25/.75;o.y+=(o.h-nh)/2;o.h=nh}else if(kind==='color')o.fill=val||'a1';else if(kind==='b')o.b=!o.b;else if(kind==='i')o.i=!o.i;
    else if(kind==='grow'||kind==='shrink'){const v=kind==='grow'?(SIZES.find(x=>x>o.size)||o.size+4):([...SIZES].reverse().find(x=>x<o.size)||o.size);applyBox(o,'size',v)}
    return;
  }
  switch(kind){
    case 'font':o.font=val;strip(['font-family']);paras(p=>{p.style.removeProperty('font-family')});break;
    case 'size':o.size=val;strip(['font-size']);break;
    case 'grow':case 'shrink':{const old=o.size;const v=kind==='grow'?(SIZES.find(x=>x>old)||old+4):([...SIZES].reverse().find(x=>x<old)||Math.max(1,old-1));o.size=v;if(o.html!=null)o.html=scaleHTMLFonts(o.html,v/old);break}

    case 'numbering':{let all=true;paras(p=>{if(!p.classList.contains('nm'))all=false});paras(p=>{p.classList.toggle('nm',!all);p.classList.remove('bl')});break}
    case 'indent':paras(p=>p.style.marginLeft=(parseFloat(p.style.marginLeft)||0)+.25+'in');break;
    case 'outdent':paras(p=>p.style.marginLeft=Math.max(0,(parseFloat(p.style.marginLeft)||0)-.25)+'in');break;

      const px=g.getImageData(0,0,c.width,c.height).data;let r=0,gg=0,b=0,n=0;for(let i=0;i<px.length;i+=40){if(px[i+3]<20)continue;r+=px[i];gg+=px[i+1];b+=px[i+2];n++}if(n)avg=rgb2hex(r/n,gg/n,b/n);

function textNodesOf(html,fn){const d=document.createElement('div');d.innerHTML=html;const tw=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);let t;const out=[];while((t=tw.nextNode()))out.push(t);const r=fn(out,d);return r}

function spellIssues(){const out=[];eachTextObj((o,pi,kind,cell)=>{const html=kind==='cell'?cell.html:o.html;const txt=htmlText(html);const re=/[A-Za-z']+/g;let m,prev='';while((m=re.exec(txt))){const w=m[0],lw=w.toLowerCase();if(MIS[lw]&&!(D.ignore||[]).includes(lw))out.push({o,pi,cell,word:w,sug:MIS[lw],kind:'spell'});if(prev&&prev===lw&&lw.length>1&&!(D.ignore||[]).includes(lw+' '+lw))out.push({o,pi,cell,word:w,rep:true,sug:'',kind:'repeat'});prev=lw}});return out}

/* One page of the publication as a canvas at its page size: the browser's own renderer first, html2canvas as the backup. */
async function ssPageCanvas(pi,sc){
  const W=D.W,H=D.H;sc=sc||ssScale();
  try{
    const host=document.createElement('div');host.innerHTML=pageHTML(pi,{print:true});
    const xml=new XMLSerializer().serializeToString(host.firstChild);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*sc}" height="${H*sc}" viewBox="0 0 ${W} ${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml"><style>${RCSS.replace(/</g,'')}</style>${xml}</div></foreignObject></svg>`;
    const img=await SimSave.loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
    const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    g.getImageData(0,0,1,1);return c;
  }catch(e){}
  const host=document.createElement('div');host.setAttribute('aria-hidden','true');host.style.cssText=`position:fixed;left:-30000px;top:0;width:${W}px;height:${H}px;pointer-events:none`;
  host.innerHTML=pageHTML(pi,{print:true});document.body.appendChild(host);
  try{await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));return await SimSave.domToCanvas(host.firstChild,{scale:sc,bg:'#ffffff',width:W,height:H})}
  finally{host.remove()}
}

let RB_REG=new Map(),RB_SIG='';
function ctrlHTML(c){
  RB_REG.set(c.id,c);
  const icon=c.icon?(IC[c.icon]?ico(c.icon):c.icon):'';
  const tip=esc(c.tip||c.label);
  const dd=c.menu||c.split?'<span class="dd" aria-hidden="true">▾</span>':'';
  if(c.k==='lg')return `<button type="button" class="rb lg" id="rb-${c.id}" data-cid="${c.id}" title="${tip}" aria-label="${esc(c.label)}"${c.menu?' aria-haspopup="menu" data-menu="1"':''}>${icon}<span>${esc(c.label)}</span>${dd}</button>`;
  if(c.k==='sm')return `<button type="button" class="rb" id="rb-${c.id}" data-cid="${c.id}" title="${tip}" aria-label="${esc(c.label)}"${c.menu||c.split?' aria-haspopup="menu" data-menu="1"':''}>${icon}<span>${esc(c.label)}</span>${dd}</button>`;
  if(c.k==='ic')return `<button type="button" class="rb ic" id="rb-${c.id}" data-cid="${c.id}" title="${tip}" aria-label="${esc(c.label)}"${c.menu?' aria-haspopup="menu" data-menu="1"':''}>${icon}</button>`;
  if(c.k==='sel'){const v=c.val?c.val():'';return `<select class="rsel" id="rb-${c.id}" data-cid="${c.id}" aria-label="${esc(c.label)}" title="${esc(c.label)}" style="width:${c.w||100}px">${c.opts().map(([k,l])=>`<option value="${esc(k)}">${esc(l)}</option>`).join('')}<option value="" hidden></option></select>`}
  if(c.k==='num')return `<span class="row" style="gap:2px">${c.pre?`<span aria-hidden="true">${c.pre}</span>`:''}<input class="rnum" id="rb-${c.id}" data-cid="${c.id}" aria-label="${esc(c.label)}" title="${esc(c.label)}" ${c.list?`list="${c.list}"`:''} style="width:${c.w||60}px"></span>`;
  if(c.k==='chk')return `<label class="rchk" title="${esc(c.label)}"><input type="checkbox" id="rb-${c.id}" data-cid="${c.id}"> ${esc(c.label)}</label>`;
  if(c.k==='html')return `<div id="rb-${c.id}" data-cid="${c.id}" class="rhtml">${c.html()}</div>`;
  return '';
}
function itemHTML(it){if(it.col)return `<div class="col">${it.col.map(itemHTML).join('')}</div>`;if(it.row)return `<div class="row">${it.row.map(itemHTML).join('')}</div>`;return ctrlHTML(it)}

function renderRibbonState(){
  RB_REG.forEach((c,id)=>{
    const el=document.getElementById('rb-'+id);if(!el)return;

  const rb=$('#ribbon');

    const b=e.target.closest('[data-cid]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT'||b.classList.contains('rhtml'))return;
    const c=RB_REG.get(b.dataset.cid);if(!c||b.disabled)return;

function itemBg(pi,item){
  // colour behind an item's centre: own fill, then objects beneath, then master, then page background
  const o=item.o;
  if(o.fill&&o.t!=='pic'&&o.t!=='wa')return col(o.fill);
  const cx=item.x+item.w/2,cy=item.y+item.h/2;
  const at=(list,stopTop)=>{
    let idx=stopTop?list.indexOf(stopTop):list.length;if(idx<0)idx=list.length;
    for(let j=idx-1;j>=0;j--){const c=colourAt(list[j],cx,cy,0,0);if(c)return c}return null;
  };
  const page=pi>=0?D.pages[pi]:null;
  let c=null;
  if(item.inGroup){ // kids earlier in same group first
    const g=item.top;let gx=g.x,gy=g.y;const kids=g.kids;const k=kids.indexOf(o);
    for(let j=k-1;j>=0;j--){const cc=colourAt(kids[j],cx,cy,gx,gy);if(cc){c=cc;break}}
  }
  if(!c&&page)c=at(page.objs,item.top);
  if(!c&&page&&!item.master){const ms=D.masters.find(m=>m.id===page.master);if(ms)c=at(ms.objs,null)}
  if(!c&&item.master)c=at(item.list||[],item.top);
  if(!c){const b=D.bg;c=!b?'#ffffff':b.type==='grad'?mix(col(b.c1),col(b.c2),.5):col(b.c)}
  return c;
}
function colourAt(o,x,y,ox,oy){
  const b=bbox(o,ox,oy);if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h)return null;
  if(o.t==='group'){for(let j=o.kids.length-1;j>=0;j--){const c=colourAt(o.kids[j],x,y,ox+o.x,oy+o.y);if(c)return c}return null}
  if(o.t==='pic')return o.avg||(o.src&&o.src.startsWith('g:')&&CLIPS[o.src.slice(2)]?CLIPS[o.src.slice(2)].avg:'#888888');
  if(o.t==='shape'&&(o.sp==='line'||o.sp==='arrowLine'||o.sp==='frame'))return null;
  if(o.fill){if(o.fill.startsWith('grad:')){const p=o.fill.split(':');return mix(col(p[1]),col(p[2]),.5)}return col(o.fill)}
  return null;
}
let CTX=null,CTX_V=-1,DOC_V=0;

  it.links=it.el.querySelectorAll('a[href]').length?[...it.el.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')):[];

const H={

  headline(ctx,pi){const r=H.maxRun(ctx,pi);if(!r)return null;const it=r.item;const sz=r.size;const txt=it.runs.filter(x=>Math.abs(x.size-sz)<.6).map(x=>x.t).join('').replace(/\s+/g,' ').trim();return {item:it,size:sz,text:txt,font:r.font,color:r.color,align:r.align}},
  otherMax(ctx,pi,head){let m=0;H.runs(ctx,pi).forEach(r=>{if(r.item!==head.item&&r.size>m)m=r.size});return m},
  minSize(ctx,pi){let m=999;H.runs(ctx,pi).forEach(r=>{if(r.size<m)m=r.size});return m===999?0:m},
  lowContrast(ctx,pi){return H.runs(ctx,pi).filter(r=>r.cr<4.5)},
  inMargins(ctx,it){const m=ctx.m,t=1.5;return it.bx>=m.l-t&&it.by>=m.t-t&&it.bx+it.bw<=ctx.W-m.r+t&&it.by+it.bh<=ctx.H-m.b+t},
  onPage(ctx,it){const t=1.5;return it.bx>=-t&&it.by>=-t&&it.bx+it.bw<=ctx.W+t&&it.by+it.bh<=ctx.H+t},
  overlap(a,b){const x=Math.max(0,Math.min(a.bx+a.bw,b.bx+b.bw)-Math.max(a.bx,b.bx)),y=Math.max(0,Math.min(a.by+a.bh,b.by+b.bh)-Math.max(a.by,b.by));return x*y},
  textOverlaps(ctx,pi){const ts=H.items(ctx,pi).filter(i=>(i.t==='text')&&i.text.trim()&&!i.o.tag);const out=[];for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){if(ts[i].top===ts[j].top&&ts[i].inGroup&&ts[j].inGroup)continue;if(H.overlap(ts[i],ts[j])>36)out.push([ts[i],ts[j]])}return out},
  ovf(ctx,pi){return H.items(ctx,pi).filter(i=>{const f=FLOWS.get(i.o.id);return f&&f.ovf})},
  pics(ctx,pi){return H.items(ctx,pi).filter(i=>i.t==='pic')},
  hasAlt(it){return !!(it.o.dec||(it.o.alt&&it.o.alt.trim().length>=3))||(it.inGroup&&it.top.alt&&it.top.alt.trim().length>=3)},
  find(ctx,s,pi){s=s.toLowerCase();return H.items(ctx,pi).filter(i=>(i.text||'').toLowerCase().includes(s)||(i.story||'').toLowerCase().includes(s))},
  links(ctx,pi){const l=[];H.items(ctx,pi).forEach(i=>{if(i.links)l.push(...i.links);if(i.o.link)l.push(i.o.link)});return l},
  pagePN(ctx,pi){const pg=ctx.pages[pi];if(pg.items.some(i=>i.pn))return true;return ctx.masterItems.some(i=>i.mid===pg.master&&i.pn)},
  panel(ctx,it){return Math.min(2,Math.max(0,Math.floor((it.x+it.w/2)/(ctx.W/3))))},
  content(it){return (it.t==='pic'||it.t==='wa'||it.t==='table'||(it.runs&&it.text.trim().length>=3))&&!it.o.tag},
  size(ctx,w,h){return (Math.abs(ctx.W-w*IN)<3&&Math.abs(ctx.H-h*IN)<3)||(Math.abs(ctx.W-h*IN)<3&&Math.abs(ctx.H-w*IN)<3)},
  sameStyle(items){const sig=it=>{const rs=it.runs.filter(r=>r.t.trim());if(!rs.length)return null;const r=rs[0];if(rs.some(x=>x.font!==r.font||Math.abs(x.size-r.size)>.6||x.color!==r.color))return 'mixed';return r.font+'|'+Math.round(r.size)+'|'+r.color};const s=items.map(sig);return s.length>0&&!s.includes(null)&&!s.includes('mixed')&&s.every(x=>x===s[0])},
  headingsOf(ctx,pi){return H.texts(ctx,pi).filter(i=>i.t==='text'&&!i.o.tag&&i.text.trim().length<60&&i.runs.every(r=>r.size>=16)&&i.runs.length&&!i.runs.some(r=>/\d{3}/.test(r.t)))},
  spell(ctx){return spellIssues().filter(x=>x.pi>=0)},
  wordCount(s){return (s.match(/[A-Za-z']+/g)||[]).length},

function designIssues(){
  const ctx=analyse();const out=[];
  ctx.pages.forEach((pg,pi)=>{
    H.ovf(ctx,pi).forEach(i=>out.push({id:i.o.id,pi,msg:`Page ${pi+1}: text does not fit in a text box (overflow). Make the box bigger, shrink the text or link it to another box.`}));
    pg.items.filter(i=>!i.inGroup).forEach(i=>{if(!H.onPage(ctx,i)){const inter=H.overlap(i,{bx:0,by:0,bw:ctx.W,bh:ctx.H});if(inter>0)out.push({id:i.o.id,pi,msg:`Page ${pi+1}: an object is partly off the page.`});}
      else if(i.runs&&i.runs.length&&!H.inMargins(ctx,i)&&!i.o.tag)out.push({id:i.o.id,pi,msg:`Page ${pi+1}: a text box is outside the margin guides.`})});
    const lc=H.lowContrast(ctx,pi);const seen=new Set();lc.forEach(r=>{if(seen.has(r.item))return;seen.add(r.item);out.push({id:r.item.top.id,pi,msg:`Page ${pi+1}: low contrast text "${r.t.trim().slice(0,24)}" (${r2(r.cr)} : 1 — needs 4.5 : 1).`})});
    H.pics(ctx,pi).forEach(i=>{if(!H.hasAlt(i))out.push({id:i.top.id,pi,msg:`Page ${pi+1}: a picture has no Alt Text.`})});
    pg.items.filter(i=>i.t==='text'&&!i.o.prev&&!i.text.trim()&&!(FLOWS.get(i.o.id)||{}).html).forEach(i=>out.push({id:i.top.id,pi,msg:`Page ${pi+1}: an empty text box.`}));
    H.textOverlaps(ctx,pi).forEach(([a])=>out.push({id:a.top.id,pi,msg:`Page ${pi+1}: two text boxes overlap.`}));
    H.runs(ctx,pi).filter(r=>r.size<7).slice(0,1).forEach(r=>out.push({id:r.item.top.id,pi,msg:`Page ${pi+1}: very small text (${r.size} pt) may be hard to read.`}));
  });
  const f=H.fonts(ctx);if(f.size>3)out.push({msg:`The publication uses ${f.size} fonts (${[...f].join(', ')}). Try to use no more than 3.`});
  if(H.placeholder(ctx))out.push({msg:'Placeholder text in [square brackets] is still in the publication.'});
  const sp=spellIssues();if(sp.length)out.push({msg:`${sp.length} possible spelling mistake${sp.length>1?'s':''} (Review ▸ Spelling).`});
  return out;
}
function openDesignChecker(){
  if(S.editing)exitEdit();
  let p=$('#dcpane');if(!p){p=document.createElement('section');p.id='dcpane';p.setAttribute('aria-label','Design Checker');$('#ws').append(p)}
  const iss=designIssues();
  p.innerHTML=`<header><span>🩺 Design Checker</span><button type="button" aria-label="Close Design Checker" id="dcX">×</button></header><ul>${iss.length?iss.map((x,i)=>`<li><span class="bad" aria-hidden="true">!</span><span>${x.id?`<a href="#" data-i="${i}">${esc(x.msg)}</a>`:esc(x.msg)}</span></li>`).join(''):'<li><span class="ok">✓</span><span>No design problems found. Great work!</span></li>'}</ul><p style="padding:0 10px 10px;margin:0"><button type="button" class="dbtn" id="dcR">Run again</button></p>`;
  p.querySelector('#dcX').onclick=()=>p.remove();p.querySelector('#dcR').onclick=openDesignChecker;
  p.querySelectorAll('a[data-i]').forEach(a=>a.onclick=e=>{e.preventDefault();const x=iss[+a.dataset.i];if(x.pi!=null&&x.pi!==S.page)goPage(x.pi);const f=findObj(x.id);if(f&&!f.parent)select([x.id]);});
  p.querySelector('#dcX').focus();
}

let PROG={xp:0,done:{},badges:[],streak:0,bestStreak:0,sound:false,files:{}};
function loadProg(){try{const s=localStorage.getItem(STORE_KEY);if(s)PROG=Object.assign(PROG,JSON.parse(s))}catch(e){}}
function saveProg(){try{localStorage.setItem(STORE_KEY,JSON.stringify(PROG));return true}catch(e){return false}}
function storeFile(name,json){PROG.files=PROG.files||{};PROG.files[name]=json;if(!saveProg()){delete PROG.files[name];saveProg();toast('Saved for this session only (browser storage is full or blocked).','warn');return false}return true}
