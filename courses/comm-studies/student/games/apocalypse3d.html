<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rebuilding Council · 3D · CAPE Communication Studies</title>
<style>
:root{--navy:#0B1A46;--gold:#F5C542;--ink:#F1F4FF;--muted:#B9BEDB;--ok:#5FD38D;--bad:#FF7A6B;--ember:#FF9A4D}

#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block}
#ui.in-ar #stage{display:none}
#hud{position:fixed;left:12px;top:12px;width:min(480px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(10,14,40,.93);border:2px solid var(--gold);border-radius:16px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);box-sizing:border-box;overscroll-behavior:contain}

#tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid rgba(245,197,66,.25)}
#tabs button{padding:5px 10px;font-size:.76rem;border-width:1.5px}
#tabs button[aria-current=true]{background:var(--gold);color:var(--navy)}
#tabs .min{margin-left:auto;padding:5px 9px}
#hud.mini>*:not(#tabs){display:none}#hud.mini #tabs{margin:0;padding:0;border:0}
#hud-eyebrow{color:var(--gold);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
#hud-title{font:800 1.08rem/1.25 "Bricolage Grotesque","Segoe UI",sans-serif;margin:4px 0}

.opt .ic{font-size:1.15rem;line-height:1.2;flex:none}.opt small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.opt.on{border-color:var(--gold);background:rgba(245,197,66,.16)}.opt.ok{border-color:var(--ok);background:rgba(95,211,141,.18)}.opt.bad{border-color:var(--bad);background:rgba(255,122,107,.15)}
.opt[disabled]{cursor:default;opacity:.9}

.plan-item{border:1.5px solid rgba(245,197,66,.35);border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.03)}
.plan-item.on{border-color:var(--gold);background:rgba(245,197,66,.08)}
.plan-item label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.86rem;line-height:1.4}
.plan-item input[type=checkbox]{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#F5C542}
.ord{display:flex;gap:6px;margin-top:6px}.ord button{padding:3px 10px;font-size:.78rem}

.lbl{font-size:.76rem;color:var(--gold);font-weight:700;margin-top:8px;letter-spacing:.04em}

#tools button{background:rgba(10,14,40,.9)}#tools button.vr{background:var(--gold);color:var(--navy)}
#tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(10,14,40,.92);border:2px solid var(--gold);border-radius:14px;padding:9px 14px;font-size:.88rem;max-width:80vw;text-align:center}#tip[hidden]{display:none}
