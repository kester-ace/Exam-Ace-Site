<!DOCTYPE html>
<html lang="en" data-gs-own>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyric Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F3F5F9;
  --surface:#FFFFFF;
  --field:#FBFCFE;
  --ink:#172033;
  --muted:#566178;
  --line:#D5DBE6;
  --focus:#1F5FBF;
  --link:#1F5FBF;
  --warn:#9A5B00;
  --danger:#B3261E;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --text:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1522;
    --surface:#171F30;
    --field:#121A29;
    --ink:#E8ECF5;
    --muted:#A0AAC0;
    --line:#2B364D;
    --focus:#7FB0FF;
    --link:#8DB8FF;
    --warn:#F2B25C;
    --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1522;
  --surface:#171F30;
  --field:#121A29;
  --ink:#E8ECF5;
  --muted:#A0AAC0;
  --line:#2B364D;
  --focus:#7FB0FF;
  --link:#8DB8FF;
  --warn:#F2B25C;
  --danger:#FF8A80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--text);-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0}
button{font:inherit;color:inherit}

/* masthead */
.masthead{max-width:880px;margin:0 auto;padding:26px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.masthead h1{font-weight:700;font-size:clamp(1.75rem,4.8vw,2.7rem);line-height:1.05;letter-spacing:-.01em}
.masthead p{margin:6px 0 0;color:var(--muted)}
.tools{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:300px}
.note{margin:0;font-size:.85rem;color:var(--muted);line-height:1.35}

/* step bar */
.stepbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.stepbar-inner{max-width:880px;margin:0 auto;padding:8px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.pill{--pc:var(--muted);flex:0 0 auto;display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px 7px;font-size:.9rem;font-weight:500;cursor:pointer;min-height:44px}
.pill .pl{white-space:nowrap}
.pill.done .pl::after{content:" \2713";color:var(--muted)}
.pill:hover{border-color:var(--pc)}
.pill[aria-current="page"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,var(--surface));font-weight:600}
.meter{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--pc);transition:width .25s ease}

/* content */
main{max-width:880px;margin:0 auto;padding:26px 20px 36px}
.block{margin:0 0 34px}
.block>h2{font-weight:700;font-size:1.3rem;line-height:1.2;margin-bottom:12px}
.field{margin:0 0 18px}
.lbl{display:block;font-weight:600;margin:0 0 6px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.infogrid .field{margin:0}

.directions{margin:0;padding-left:1.4rem;max-width:64ch}
.directions li{margin:0 0 6px;padding-left:4px}
.flowline{display:flex;flex-wrap:wrap;gap:8px 0;margin-top:14px;align-items:center}
.flowline span{background:var(--surface);border:1px solid var(--line);padding:5px 12px;font-weight:600;font-size:.95rem}
.flowline span:first-child{border-radius:999px 0 0 999px}
.flowline span:last-child{border-radius:0 999px 999px 0}
.flowline span+span{margin-left:-1px}

/* song list */
.songlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.songrow{--pc:var(--muted);border-top:1px solid var(--line);padding:8px 14px 10px}
.songrow:first-child{border-top:0}
.songrow-head{display:grid;grid-template-columns:2rem 1fr auto;align-items:center;gap:12px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--display);background:color-mix(in srgb,var(--pc) 24%,var(--surface))}
.linkbtn{background:none;border:0;color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 4px;font-size:.92rem}

/* title button with record disc */
.titlebtn{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:6px 10px;margin:-6px -10px;border-radius:10px;cursor:pointer;text-align:left;color:var(--ink)}
.titlebtn:hover{background:color-mix(in srgb,var(--pc) 13%,transparent)}
.titlebtn .ttl{display:flex;flex-direction:column;line-height:1.2}
.titlebtn .t{font:700 1.12rem var(--display)}
.titlebtn .artist{font-size:.9rem;color:var(--muted)}
.titlebtn .hint{font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);white-space:nowrap;margin-left:4px}
.titlebtn[aria-expanded="true"] .hint{border-color:var(--pc);color:var(--ink);background:color-mix(in srgb,var(--pc) 18%,transparent)}
.disc{width:36px;height:36px;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.open .disc{animation:spin 3.2s linear infinite}
@media (prefers-reduced-motion: reduce){.open .disc{animation:none}.meter b{transition:none}}

/* player */
.player{margin:12px 0 4px}
.player .frame{position:relative;aspect-ratio:16/9;max-width:720px;background:#000;border-radius:10px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:.9rem;color:var(--muted);align-items:center}
.pmeta a{color:var(--link);text-underline-offset:3px}

/* song page */
.songhead{--pc:var(--muted);border-left:8px solid var(--pc);padding:4px 0 6px 16px;margin:0 0 24px}
.songhead h2{margin:0}
.big .t{font-size:clamp(1.7rem,5.2vw,2.7rem);letter-spacing:-.01em;line-height:1.05}
.big .artist{font-size:1rem}
.big .disc{width:54px;height:54px}
.tcard{border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;background:var(--surface);padding:18px 18px 6px;margin:0 0 20px}
.tcard h3{font-weight:700;font-size:1.15rem}
.flow{display:flex;flex-wrap:wrap;gap:6px 0;margin:10px 0 18px;font-size:.85rem;color:var(--muted)}
.flow span{display:inline-flex;align-items:center;gap:6px}
.flow span+span::before{content:"";width:16px;height:2px;background:var(--line);margin:0 8px 0 2px}
.flow i{width:11px;height:11px;border-radius:50%;border:2px solid var(--pc);flex:0 0 auto}
.flow .done{color:var(--ink)}
.flow .done i{background:var(--pc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chiplabel{font-size:.85rem;color:var(--muted);margin-top:10px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 14px;font-size:.92rem;cursor:pointer;min-height:36px}
.chip:hover{border-color:var(--pc)}
.chip[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 22%,var(--surface));font-weight:600}
.count{font-size:.85rem;color:var(--muted);margin-top:4px;min-height:1.3em}
.count.warn{color:var(--warn)}

/* buttons, pager, footer */
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger.confirm{border-color:var(--danger);color:var(--danger)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.pagefoot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:520px){
  body{font-size:16px}
  .songrow-head{grid-template-columns:2rem 1fr}
  .songrow-head .linkbtn{grid-column:2;justify-self:start;padding-top:0}
  .titlebtn .hint{display:none}
  .big .hint{display:inline-block}
  .tcard{padding:16px 14px 4px}
}
@media print{
  .stepbar,.pager,.tools,.player,.chips,.chiplabel,.actions,.linkbtn,.hint{display:none !important}
  .page[hidden]{display:block !important;break-after:page}
  body{background:#fff;color:#000}
}
</style>

<script id="nocopy-kit">
/* Copy protection for course text: the lesson text, keys and stimuli cannot be selected, copied, cut or dragged out.
   Students can still type, select and copy inside their own answer boxes and editors (inputs, text areas and editable areas),
   and drag-and-drop activities keep working. Developed by Kester Small. */
(function () {
  'use strict';
  if (window.__nocopy) return; window.__nocopy = true;
  const OK = 'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],.allow-copy';
  const editable = n => { try { if (n && n.nodeType === 3) n = n.parentElement; return !!(n && n.closest && n.closest(OK)); } catch (e) { return false; } };
  const css = document.createElement('style'); css.id = 'nocopy-css';
  css.textContent = 'html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}' +
    'input,textarea,select,[contenteditable="true"],[contenteditable=""],[contenteditable="plaintext-only"],[contenteditable="true"] *,.allow-copy,.allow-copy *{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}' +
    'img,svg,canvas{-webkit-user-drag:none;user-drag:none}';
  (document.head || document.documentElement).appendChild(css);
  const selInEditable = () => { const s = window.getSelection && window.getSelection(); if (!s || !s.rangeCount) return true; return editable(s.anchorNode) && editable(s.focusNode); };
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!(editable(e.target) && selInEditable())) e.preventDefault(); }, true));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { const t = e.target; if (editable(t)) return; if (t && t.nodeType === 1 && t.closest && t.closest('[draggable="true"]')) return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = (e.key || '').toLowerCase();
    if ((k === 'c' || k === 'x' || k === 'a') && !editable(e.target)) e.preventDefault();
    if (k === 'u') e.preventDefault();
  }, true);
})();

</script>

<header class="masthead">
  <div>
    <h1>Lyric Lab</h1>
    <p>Interactive, fillable classroom worksheet</p>
  </div>
  <div class="tools">
    <button type="button" class="btn ghost js-save" data-action="save" hidden>Save my answers</button>
    <p class="note" id="note" role="status"></p>
  </div>
</header>

<script>
(function(){
'use strict';

var SONGS=[
  {id:'ordinary',n:1,title:'Ordinary',artist:'Alex Warren',yt:'aoV9eVGhVoQ',kind:'Official music video',accent:'#2F7FB8',techniques:['Metaphor','Hyperbole','Imagery','Allusion','Symbolism']},
  {id:'golden',n:2,title:'Golden',artist:'HUNTR/X (KPop Demon Hunters)',yt:'yebNIHKAC4A',kind:'Official lyric video from Sony Animation',accent:'#D4A017',techniques:['Metaphor','Symbolism','Imagery','Repetition']},
  {id:'beautiful',n:3,title:'Beautiful Things',artist:'Benson Boone',yt:'Oa_RSwwpPaA',kind:'Official music video',accent:'#3F9B6B',techniques:['Contrast','Repetition','Imagery','Hyperbole']},
  {id:'made',n:4,title:'What Was I Made For?',artist:'Billie Eilish',yt:'cW8VLC9nnTo',kind:'Official music video',accent:'#D9689A',techniques:['Rhetorical question','Repetition','Symbolism','Metaphor']},
  {id:'birds',n:5,title:'Birds of a Feather',artist:'Billie Eilish',yt:'V9PVRfjEBTI',kind:'Official music video',accent:'#7A6FD8',techniques:['Idiom','Metaphor','Hyperbole','Symbolism']},
  {id:'try',n:6,title:'Try Everything',artist:'Shakira',yt:'c6rP-YP4c5I',kind:'Official music video',accent:'#E0782C',techniques:['Metaphor','Repetition','Imagery','Symbolism']}
];
var PAGES=[{id:'start',label:'Start',accent:'var(--ink)'}]
  .concat(SONGS.map(function(s){return {id:s.id,label:s.title,accent:s.accent,song:s};}))
  .concat([{id:'final',label:'Final analysis',accent:'var(--ink)'}]);

var FINAL_Q=[
  ['q1','Which literary technique was most noticeable in your song, and why?'],
  ['q2','How do the literary techniques help communicate the artiste\u2019s purpose or message?'],
  ['q3','How do the techniques influence the audience\u2019s emotional response?'],
  ['q4','Choose one technique and explain how the song would change if the language were completely literal.']
];
var PARTS=['tech','evid','mean','eff'];
var KEY='litTechniquesSongs.v1';
var EVID_LIMIT=10;

var vals={};
var ui={page:0};
var storageOK=true;
var dl=null;
var playing=null;
var saveTimer=null,noteTimer=null,resetTimer=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function idOf(k){return 'f-'+k.replace(/\./g,'-');}
function g(k){return (vals[k]||'').trim();}

/* ---------- storage ---------- */
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);vals=o.vals||{};ui.page=Math.min(Math.max(o.page|0,0),PAGES.length-1);}
  }catch(e){storageOK=false;}
}
var gsOff=false;
function persist(){
  if(gsOff)return;
  try{localStorage.setItem(KEY,JSON.stringify({vals:vals,page:ui.page}));}
  catch(e){storageOK=false;setStatus();}
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,300);}
function setStatus(){
  var n=document.getElementById('note');
  n.textContent=storageOK
    ?'Your answers are kept on this device as you type.'
    :'Answers can\u2019t be kept in this browser. Use \u201cSave my answers\u201d before you leave.';
}
function setNote(msg){
  var n=document.getElementById('note');
  n.textContent=msg;
  clearTimeout(noteTimer);
  noteTimer=setTimeout(setStatus,6000);
}

/* ---------- markup ---------- */
function disc(){
  return '<svg class="disc" viewBox="0 0 40 40" aria-hidden="true" focusable="false">'
    +'<circle cx="20" cy="20" r="19" fill="var(--ink)"/>'
    +'<circle cx="20" cy="20" r="15" fill="none" stroke="var(--surface)" stroke-opacity=".28"/>'
    +'<circle cx="20" cy="20" r="11.5" fill="none" stroke="var(--surface)" stroke-opacity=".22"/>'
    +'<path d="M20 4.5A15.5 15.5 0 0 1 31.5 9.5" fill="none" stroke="var(--surface)" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>'
    +'<circle cx="20" cy="20" r="7" fill="var(--pc)"/>'
    +'<circle cx="20" cy="20" r="1.8" fill="var(--surface)"/></svg>';
}
function titleBtn(s,scope,big){
  return '<button type="button" class="titlebtn'+(big?' big':'')+'" data-action="player" data-song="'+s.id+'" aria-expanded="false" aria-controls="pl-'+scope+'-'+s.id+'">'
    +disc()
    +'<span class="ttl"><span class="t">'+esc(s.title)+'</span><span class="artist">'+esc(s.artist)+'</span></span>'
    +'<span class="hint">Watch here</span></button>';
}
function playerPanel(s,scope){
  return '<div class="player" id="pl-'+scope+'-'+s.id+'" hidden>'
    +'<div class="frame"></div>'
    +'<div class="pmeta"><span>'+esc(s.kind)+'</span>'
    +'<a href="https://www.youtube.com/watch?v='+s.yt+'" target="_blank" rel="noopener noreferrer">Open on YouTube (new tab)</a></div>'
    +'</div>';
}
function pager(i){
  var prev=i>0?'<button type="button" class="btn ghost" data-action="goto" data-page="'+(i-1)+'">Back: '+esc(PAGES[i-1].label)+'</button>':'<span></span>';
  var next=i<PAGES.length-1?'<button type="button" class="btn" data-action="goto" data-page="'+(i+1)+'">Next: '+esc(PAGES[i+1].label)+'</button>':'<span></span>';
  return '<div class="pager">'+prev+next+'</div>';
}
function foot(i){
  return '<div class="pagefoot"><span>Communication Studies | Lyric Lab</span><span>Page '+(i+1)+'</span></div>';
}
function textField(key,label,ph,extra){
  return '<div class="field"><label class="lbl" for="'+idOf(key)+'">'+label+'</label>'
    +'<input type="text" id="'+idOf(key)+'" data-key="'+key+'" autocomplete="off" placeholder="'+esc(ph||'')+'"'+(extra||'')+'></div>';
}
function areaField(key,label){
  return '<div class="field"><label class="lbl" for="'+idOf(key)+'">'+label+'</label>'
    +'<textarea id="'+idOf(key)+'" data-key="'+key+'"></textarea></div>';
}

function startPage(i){
  var rows=SONGS.map(function(s,idx){
    return '<li class="songrow" data-pscope style="--pc:'+s.accent+'">'
      +'<div class="songrow-head"><span class="num">'+s.n+'</span>'
      +titleBtn(s,'list',false)
      +'<button type="button" class="linkbtn" data-action="goto" data-page="'+(idx+1)+'">Open worksheet</button></div>'
      +playerPanel(s,'list')+'</li>';
  }).join('');
  return '<section class="page" id="page-start" hidden>'
    +'<div class="block"><h2 tabindex="-1">Student information</h2><div class="infogrid">'
    +'<div class="field"><label class="lbl" for="f-info-name">Name</label><input type="text" id="f-info-name" data-key="info.name" autocomplete="name"></div>'
    +'<div class="field"><label class="lbl" for="f-info-cls">Class</label><input type="text" id="f-info-cls" data-key="info.cls" autocomplete="off"></div>'
    +'<div class="field"><label class="lbl" for="f-info-date">Date</label><input type="date" id="f-info-date" data-key="info.date"></div>'
    +'</div></div>'
    +'<div class="block"><h2>Directions</h2><ol class="directions">'
    +'<li>Listen to or review your assigned song. Do not copy long sections of lyrics.</li>'
    +'<li>Identify literary techniques and record only brief evidence or a short phrase.</li>'
    +'<li>For each technique, explain its meaning and the effect it creates.</li>'
    +'<li>Use the analysis pattern:</li></ol>'
    +'<div class="flowline" aria-label="Technique, then Evidence, then Meaning, then Effect"><span>Technique</span><span>Evidence</span><span>Meaning</span><span>Effect</span></div></div>'
    +'<div class="block"><h2>Song choices</h2>'
    +'<p style="margin:0 0 12px;color:var(--muted)">Select a song title to watch its video here.</p>'
    +'<ol class="songlist">'+rows+'</ol></div>'
    +'<div class="block"><h2>Before you begin</h2>'
    +areaField('before','What do you think literary techniques add to a song?')+'</div>'
    +pager(i)+foot(i)+'</section>';
}

function techCard(s,t){
  var pre=s.id+'.t'+t+'.';
  var chips=s.techniques.map(function(x){
    return '<button type="button" class="chip" data-action="chip" data-key="'+pre+'tech" data-value="'+esc(x)+'" aria-pressed="false">'+esc(x)+'</button>';
  }).join('');
  return '<article class="tcard" data-tcard="'+s.id+'.t'+t+'">'
    +'<h3>Technique '+(t+1)+'</h3>'
    +'<div class="flow" role="img" aria-label="0 of 4 parts filled in"><span><i></i>Technique</span><span><i></i>Evidence</span><span><i></i>Meaning</span><span><i></i>Effect</span></div>'
    +'<div class="field"><label class="lbl" for="'+idOf(pre+'tech')+'">Technique</label>'
    +'<input type="text" id="'+idOf(pre+'tech')+'" data-key="'+pre+'tech" autocomplete="off" placeholder="Pick one below or type your own">'
    +'<div class="chiplabel" id="cl-'+s.id+t+'">Possible techniques</div>'
    +'<div class="chips" role="group" aria-labelledby="cl-'+s.id+t+'">'+chips+'</div></div>'
    +'<div class="field"><label class="lbl" for="'+idOf(pre+'evid')+'">Brief evidence</label>'
    +'<input type="text" id="'+idOf(pre+'evid')+'" data-key="'+pre+'evid" data-evid autocomplete="off" placeholder="A short phrase, not a whole line" aria-describedby="'+idOf(pre+'evid')+'-count">'
    +'<div class="count" id="'+idOf(pre+'evid')+'-count"></div></div>'
    +areaField(pre+'mean','What does the language mean in context?')
    +areaField(pre+'eff','What effect does it create for the listener/audience?')
    +'</article>';
}

function songPage(s,i){
  return '<section class="page" id="page-'+s.id+'" hidden style="--pc:'+s.accent+'">'
    +'<div class="songhead" data-pscope><h2 tabindex="-1">'+titleBtn(s,'page',true)+'</h2>'+playerPanel(s,'page')+'</div>'
    +areaField(s.id+'.theme','Central message/theme of the song')
    +techCard(s,0)+techCard(s,1)
    +pager(i)+foot(i)+'</section>';
}

function finalPage(i){
  var q=FINAL_Q.map(function(x){return areaField('final.'+x[0],x[1]);}).join('');
  return '<section class="page" id="page-final" hidden>'
    +'<div class="block"><h2 tabindex="-1">Final analysis</h2>'
    +'<p style="margin:0 0 16px;color:var(--muted)">Bring your observations together.</p>'+q+'</div>'
    +'<div class="actions"><button type="button" class="btn js-save" data-action="save" hidden>Save my answers</button>'
    +'<button type="button" class="btn ghost danger" data-action="reset">Start over</button></div>'
    +pager(i)+foot(i)+'</section>';
}

function build(){
  var steps=PAGES.map(function(p,i){
    return '<button type="button" class="pill" data-action="goto" data-page="'+i+'" style="--pc:'+p.accent+'">'
      +'<span class="pl">'+esc(p.label)+'</span><span class="meter"><b></b></span></button>';
  }).join('');
  document.getElementById('steps').innerHTML=steps;
  var pages=PAGES.map(function(p,i){
    if(p.id==='start')return startPage(i);
    if(p.id==='final')return finalPage(i);
    return songPage(p.song,i);
  }).join('');
  document.getElementById('pages').innerHTML=pages;
  document.querySelectorAll('[data-key]').forEach(function(el){
    if(el.tagName==='BUTTON')return;
    el.value=vals[el.dataset.key]||'';
  });
  document.querySelectorAll('[data-tcard]').forEach(updateCard);
  document.querySelectorAll('[data-evid]').forEach(updateCount);
  document.querySelectorAll('.js-save').forEach(function(b){b.hidden=!dl;});
  updateProgress();
  setStatus();
}

/* ---------- live updates ---------- */
function updateCard(card){
  var id=card.dataset.tcard;
  var done=PARTS.map(function(f){return !!g(id+'.'+f);});
  var spans=card.querySelectorAll('.flow span');
  for(var i=0;i<spans.length;i++)spans[i].classList.toggle('done',done[i]);
  card.querySelector('.flow').setAttribute('aria-label',done.filter(Boolean).length+' of 4 parts filled in');
  var cur=g(id+'.tech').toLowerCase();
  card.querySelectorAll('.chip').forEach(function(c){
    c.setAttribute('aria-pressed',String(c.dataset.value.toLowerCase()===cur));
  });
}
function updateCount(el){
  var box=document.getElementById(el.id+'-count');
  if(!box)return;
  var t=el.value.trim();
  var n=t?t.split(/\s+/).length:0;
  if(n===0){box.textContent='';box.classList.remove('warn');return;}
  if(n>EVID_LIMIT){
    box.textContent=n+' words. Trim it to the key phrase (about '+EVID_LIMIT+' words or fewer).';
    box.classList.add('warn');
  }else{
    box.textContent=n+(n===1?' word':' words');
    box.classList.remove('warn');
  }
}
function pageKeys(p){
  if(p.id==='start')return ['info.name','info.cls','info.date','before'];
  if(p.id==='final')return FINAL_Q.map(function(x){return 'final.'+x[0];});
  var k=[p.id+'.theme'];
  [0,1].forEach(function(t){PARTS.forEach(function(f){k.push(p.id+'.t'+t+'.'+f);});});
  return k;
}
function updateProgress(){
  var pills=document.querySelectorAll('#steps .pill');
  PAGES.forEach(function(p,i){
    var keys=pageKeys(p);
    var n=keys.filter(function(k){return g(k);}).length;
    var pill=pills[i];
    pill.querySelector('.meter b').style.width=Math.round(n/keys.length*100)+'%';
    pill.classList.toggle('done',n===keys.length);
    pill.setAttribute('aria-label',p.label+', '+n+' of '+keys.length+' answered');
  });
}
function autosize(t){
  t.style.height='auto';
  t.style.height=Math.max(t.scrollHeight+2,96)+'px';
}

/* ---------- navigation ---------- */
function goto(i,quiet){
  closePlayer();
  ui.page=i;
  document.querySelectorAll('.page').forEach(function(sec,idx){sec.hidden=(idx!==i);});
  var pills=document.querySelectorAll('#steps .pill');
  pills.forEach(function(p,idx){
    if(idx===i)p.setAttribute('aria-current','page');else p.removeAttribute('aria-current');
  });
  var cur=document.querySelectorAll('.page')[i];
  cur.querySelectorAll('textarea').forEach(autosize);
  try{pills[i].scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
  window.scrollTo(0,0);
  if(!quiet){var h=cur.querySelector('h2');if(h)h.focus({preventScroll:true});}
  scheduleSave();
}

/* ---------- video player ---------- */
function songById(id){for(var i=0;i<SONGS.length;i++)if(SONGS[i].id===id)return SONGS[i];}
function closePlayer(){
  if(!playing)return;
  var wrap=playing.wrap,btn=playing.btn;
  var panel=wrap.querySelector('.player');
  panel.querySelector('.frame').innerHTML='';
  panel.hidden=true;
  btn.setAttribute('aria-expanded','false');
  btn.querySelector('.hint').textContent='Watch here';
  wrap.classList.remove('open');
  playing=null;
}
function togglePlayer(btn){
  if(playing&&playing.btn===btn){closePlayer();return;}
  closePlayer();
  var s=songById(btn.dataset.song);
  var wrap=btn.closest('[data-pscope]');
  var panel=wrap.querySelector('.player');
  panel.querySelector('.frame').innerHTML=
    '<iframe src="https://www.youtube-nocookie.com/embed/'+s.yt+'?autoplay=1&rel=0&playsinline=1" '
    +'title="'+esc(s.title)+' by '+esc(s.artist)+' on YouTube" '
    +'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen '
    +'referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  panel.hidden=false;
  btn.setAttribute('aria-expanded','true');
  btn.querySelector('.hint').textContent='Hide video';
  wrap.classList.add('open');
  playing={btn:btn,wrap:wrap};
}

/* ---------- saving a file ---------- */
function buildText(){
  var o=[];
  o.push('Lyric Lab','Communication Studies','');
  o.push('Name: '+g('info.name'),'Class: '+g('info.cls'),'Date: '+g('info.date'),'');
  if(g('before')){
    o.push('Before you begin','What do you think literary techniques add to a song?',g('before'),'');
  }
  SONGS.forEach(function(s){
    var keys=pageKeys({id:s.id});
    if(!keys.some(function(k){return g(k);}))return;
    o.push('========================================',s.title+' - '+s.artist,'');
    o.push('Central message/theme of the song:',g(s.id+'.theme')||'(not answered)','');
    [0,1].forEach(function(t){
      var p=s.id+'.t'+t+'.';
      if(!PARTS.some(function(f){return g(p+f);}))return;
      o.push('Technique '+(t+1),
        'Technique: '+g(p+'tech'),
        'Brief evidence: '+g(p+'evid'),
        'What the language means in context: '+g(p+'mean'),
        'Effect on the listener/audience: '+g(p+'eff'),'');
    });
  });
  if(FINAL_Q.some(function(x){return g('final.'+x[0]);})){
    o.push('========================================','Final analysis','');
    FINAL_Q.forEach(function(x){o.push(x[1],g('final.'+x[0])||'(not answered)','');});
  }
  return o.join('\n');
}
function saveFile(){
  if(!dl)return;
  var nm=g('info.name').replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-');
  var filename='Literary-Techniques'+(nm?'-'+nm:'')+'.txt';
  dl.save({filename:filename,data:buildText()}).then(function(){
    setNote('Saved. Check your downloads.');
  }).catch(function(err){
    if(err&&err.code==='declined')setNote('Not saved. You can try again any time.');
    else if(err&&err.code==='rate_limited')setNote('Wait a moment, then try again.');
    else setNote('Saving a file isn\u2019t available here. Copy your answers into a document instead.');
  });
}

/* ---------- reset ---------- */
function resetAll(btn){
  if(window.GameSave){window.GameSave.startOver();return;}
  if(!btn.classList.contains('confirm')){
    btn.classList.add('confirm');
    btn.textContent='Click again to clear all answers';
    clearTimeout(resetTimer);
    resetTimer=setTimeout(function(){btn.classList.remove('confirm');btn.textContent='Start over';},4000);
    return;
  }
  clearTimeout(resetTimer);
  closePlayer();
  vals={};
  try{localStorage.removeItem(KEY);}catch(e){}
  build();
  goto(0,true);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');
  if(!b)return;
  var a=b.dataset.action;
  if(a==='goto')goto(parseInt(b.dataset.page,10));
  else if(a==='player')togglePlayer(b);
  else if(a==='chip'){
    var key=b.dataset.key;
    var input=document.getElementById(idOf(key));
    var same=input.value.trim().toLowerCase()===b.dataset.value.toLowerCase();
    input.value=same?'':b.dataset.value;
    input.dispatchEvent(new Event('input',{bubbles:true}));
  }
  else if(a==='save')saveFile();
  else if(a==='reset')resetAll(b);
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(!el.dataset||!el.dataset.key||el.tagName==='BUTTON')return;
  vals[el.dataset.key]=el.value;
  if(el.tagName==='TEXTAREA')autosize(el);
  if(el.hasAttribute('data-evid'))updateCount(el);
  var card=el.closest('[data-tcard]');
  if(card)updateCard(card);
  updateProgress();
  scheduleSave();
});

/* ---------- start ---------- */
if(window.GameSave){
  window.GameSave.register([KEY]);
  window.GameSave.onReset(function(){gsOff=true;clearTimeout(saveTimer);});
}
window.addEventListener('pagehide',function(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;persist();}});
load();
build();
goto(ui.page,true);
try{
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(d){
      if(d){dl=d;document.querySelectorAll('.js-save').forEach(function(b){b.hidden=false;});}
    }).catch(function(){});
  }
}catch(e){}
})();
</script>
</body>
</html>
