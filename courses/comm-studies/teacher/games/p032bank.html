<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper 03/2 Sample Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3EFE6;--surface:#FFFFFF;--surface2:#FAF7F0;--ink:#15213B;--soft:#4B5671;--line:#D8D1C1;
  --navy:#0B1736;--navy2:#162A5C;--gold:#F5C542;--good:#11704F;--bad:#B42318;--focus:#C2410C;
  --ps:#0F766E;--ce:#B4470F;--nr:#6D3FD8;--cc:#1D4ED8;
  --card:#FFFDF6;--cardink:#1B2233;--rule:#C9DBEF;--margin:#E8A0A0;
  --font-d:"Bricolage Grotesque",Georgia,serif;--font-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0D1322;--surface:#151D31;--surface2:#1A2440;--ink:#ECF0F8;--soft:#A8B2C8;--line:#2B3756;
  --good:#4ADE9B;--bad:#FF8A7A;--focus:#FDBA74;--ps:#5EEAD4;--ce:#FDBA74;--nr:#C4B5FD;--cc:#93C5FD}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1322;--surface:#151D31;--surface2:#1A2440;--ink:#ECF0F8;--soft:#A8B2C8;--line:#2B3756;
  --good:#4ADE9B;--bad:#FF8A7A;--focus:#FDBA74;--ps:#5EEAD4;--ce:#FDBA74;--nr:#C4B5FD;--cc:#93C5FD}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-b);overflow-x:hidden}
img,svg{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.15;margin:0 0 .4em}
h2{font-size:clamp(1.35rem,3.6vw,1.8rem);font-weight:800}
h3{font-size:1.15rem;font-weight:800}
h4{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-family:var(--font-b);font-weight:700;margin-top:1.2em}
p{margin:0 0 .7em}
.skip{position:absolute;left:-9999px;top:8px;background:var(--gold);color:#1B1300;padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}
.hero{background:radial-gradient(120% 140% at 85% 0%,#23407F 0%,var(--navy2) 38%,var(--navy) 100%);color:#fff;padding:22px 16px 54px;position:relative;overflow:hidden}
.hero .in{max-width:1080px;margin:0 auto;position:relative;z-index:2}
.hero .eyebrow{font:700 .78rem var(--font-b);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.hero h1{font:800 clamp(1.9rem,6vw,3.3rem)/1.02 var(--font-d);margin:0 0 8px;letter-spacing:-.01em}
.hero p.lead{color:#D9E2F7;max-width:62ch;margin:0}
.hero .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hero .tools a,.hero .tools button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem;text-decoration:none;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:0;list-style:none}
.stats li{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.9rem}
.deco{position:absolute;right:-30px;bottom:-26px;width:min(46vw,330px);aspect-ratio:3/2;transform:rotate(-8deg);background:var(--card);border-radius:10px;opacity:.16;z-index:1;
  background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(180deg,transparent 0 22px,#9DB8D8 22px 23px);background-size:100% 2px,100% 100%;background-position:0 30px,0 0;background-repeat:no-repeat,repeat}
.wrap{max-width:1080px;margin:-30px auto 0;padding:0 16px 40px;position:relative;z-index:3}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(11,23,54,.08)}
.tab{flex:1 1 auto;min-width:0;border:0;background:transparent;border-radius:12px;padding:9px 12px;font-weight:700;font-size:.93rem;cursor:pointer;color:var(--soft);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--gold);color:#1B1300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--gold);color:#1B1300}}
.panel{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,3vw,22px);margin:0 0 14px;min-width:0;overflow-wrap:anywhere}
.lead2{color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;line-height:1.2}
:root[data-theme="dark"] .btn{background:#2C4380}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:#2C4380}}
.btn.gold{background:var(--gold);color:#1B1300}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--sc,var(--line));background:color-mix(in srgb,var(--sc,var(--line)) 9%,var(--surface));color:var(--ink);border-radius:99px;padding:4px 11px;font-size:.86rem;font-weight:700;cursor:pointer;text-align:left;line-height:1.3}
.chip.static{cursor:default}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--sc) 55%,transparent)}
.s-ps{--sc:var(--ps)}.s-ce{--sc:var(--ce)}.s-nr{--sc:var(--nr)}.s-cc{--sc:var(--cc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.item{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-left:6px solid var(--sc,var(--navy));border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0}
.item:hover{border-color:var(--sc,var(--navy))}
.item b{display:block;font-family:var(--font-d);font-size:1.02rem;line-height:1.2;margin-bottom:4px}
.item small{color:var(--soft);display:block}
details.acc{overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--sc,var(--navy));border-radius:var(--r);margin:0 0 12px;min-width:0}
details.acc>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"▸";font-size:1.1rem;transition:transform .2s;color:var(--sc,var(--soft))}
details.acc[open]>summary::before{transform:rotate(90deg)}
details.acc>summary .t{font:800 1.12rem/1.2 var(--font-d);flex:1 1 200px;min-width:0}
details.acc>summary .n{color:var(--soft);font-size:.86rem;font-weight:700}
details.acc>.body{padding:0 16px 16px;min-width:0}
details.sub{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface2)}
details.sub>summary{cursor:pointer;padding:10px 12px;font-weight:700}
details.sub>.body{padding:0 12px 12px;min-width:0}
.signals{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;padding:0;list-style:none}
.signals li{background:var(--surface2);border:1px dashed color-mix(in srgb,var(--sc) 60%,var(--line));border-radius:8px;padding:2px 8px;font-size:.86rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.box.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
blockquote.stim{margin:8px 0;padding:12px 14px;border-left:4px solid var(--gold);background:var(--surface2);border-radius:0 12px 12px 0}
.stimwrap blockquote{margin:8px 0;padding:12px 14px;border-left:4px solid var(--gold);background:var(--surface2);border-radius:0 12px 12px 0}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:break-word;word-break:normal}
th{background:var(--surface2)}
.q{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--surface);min-width:0}
.q .qh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.q .qh b{font-family:var(--font-d);font-size:1.05rem}
.skill{font-size:.84rem;color:var(--soft)}
.model{background:color-mix(in srgb,var(--good) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,var(--line));border-radius:12px;padding:10px 12px}
.xa{background:color-mix(in srgb,var(--gold) 35%,transparent);border-radius:3px;padding:0 2px}
sup.xn{font-weight:700;color:var(--focus)}
.essay p{margin:0 0 .8em}
.hl{display:inline;border:0;padding:0 2px;margin:0;font:inherit;line-height:inherit;text-align:inherit;cursor:pointer;color:inherit;background:color-mix(in srgb,var(--sc,var(--gold)) 16%,transparent);border-bottom:2px solid var(--sc,var(--gold));border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl sup{font-weight:800;color:var(--sc,var(--focus));margin-right:2px;font-family:var(--font-b)}
.hl[aria-expanded="true"]{background:color-mix(in srgb,var(--sc,var(--gold)) 34%,transparent)}
.note{margin:6px 0 12px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1.5px solid var(--sc,var(--gold));font-size:.95rem}
.note b{font-family:var(--font-d)}
.sandwich{border:1.5px solid var(--line);border-radius:14px;padding:4px 12px;margin:12px 0;background:var(--surface)}
.sw{margin:8px 0;padding-left:28px;text-indent:-28px}
.sw span[aria-hidden]{display:inline-block;width:28px;text-indent:0}
.sw-fix{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-top:8px;padding-bottom:8px}
.fbok{color:var(--good);font-weight:700}.fbno{color:var(--bad);font-weight:700}
.lv{display:block;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-width:0}
.lv[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 70%,transparent)}
.lv b{font:800 1.05rem var(--font-d);display:block}
.lv .stars{color:#B7791F;letter-spacing:2px}
.lv small{display:block;color:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin:10px 0}
.opt{border:2px solid var(--sc,var(--line));background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-weight:700}
.opt.right{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.excerpt{font-size:1.08rem;font-style:italic;background:var(--surface2);border-radius:12px;padding:12px 14px;border-left:4px solid var(--gold);margin:10px 0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--gold));transition:width .3s}
label.f{display:block;font-weight:700;margin:10px 0 4px}
textarea,input[type=text],select{width:100%;max-width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
textarea{min-height:110px;resize:vertical}
.wc{font-size:.86rem;color:var(--soft)}
.timer{font:800 1.4rem var(--font-d);font-variant-numeric:tabular-nums;background:var(--navy);color:var(--gold);border-radius:12px;padding:4px 12px}
.timer.low{background:var(--bad);color:#fff}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.years{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.years button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:800;cursor:pointer;font-family:var(--font-d)}
.years button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1B1300}
.equiv{border:2px dashed color-mix(in srgb,var(--gold) 75%,var(--line));border-radius:14px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.equiv h3{font-size:1rem;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:99px;padding:8px 16px;font-weight:700;z-index:60;max-width:90vw}
.score{font:800 2rem var(--font-d)}
.ok-list{list-style:none;padding:0;margin:8px 0}
.ok-list li{padding:5px 0 5px 28px;position:relative;border-bottom:1px dashed var(--line)}
.ok-list li::before{position:absolute;left:0;top:4px;font-weight:800}
.ok-list li.y::before{content:"✓";color:var(--good)}
.ok-list li.n::before{content:"✗";color:var(--bad)}
footer{max-width:1080px;margin:0 auto;padding:18px 16px 40px;color:var(--soft);font-size:.9rem;text-align:center}
/* ---------- the A4 notes sheet ---------- */
.ccw{container-type:inline-size;width:100%;max-width:520px;min-width:0}
.cc{position:relative;width:100%;aspect-ratio:210/297;overflow:hidden;background-color:var(--card);color:var(--cardink);border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 22px rgba(11,23,54,.16);
  padding:5cqw 5cqw 4cqw 5cqw;font-family:var(--font-b);font-size:clamp(9px,3.3vw,20px);font-size:3.9cqw;line-height:1.45;
  background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(180deg,transparent 0,transparent calc(5.655cqw - 1px),var(--rule) calc(5.655cqw - 1px),var(--rule) 5.655cqw);
  background-size:100% 1.5px,100% calc(100% - 13.1cqw);background-position:0 calc(13.1cqw - .6cqw),0 13.1cqw;background-repeat:no-repeat,no-repeat}
.cc .cch{font:800 4.6cqw/1.1 var(--font-d);margin:0 0 3cqw;display:flex;justify-content:space-between;gap:2cqw;letter-spacing:.01em}
.cc .cch span{font:700 3.3cqw/1.2 var(--font-b);color:#5B6377;text-transform:none;white-space:nowrap}
.cc ol{margin:0;padding:0 0 0 7.2cqw;list-style:none;counter-reset:pt}
.cc li{counter-increment:pt;position:relative;margin:0;min-height:5.655cqw}
.cc li::before{content:counter(pt) ".";position:absolute;left:-7.2cqw;width:6.2cqw;text-align:right;font-weight:700;color:#8A3B3B;white-space:nowrap}
.cc .stamp{position:absolute;right:3cqw;bottom:3cqw;transform:rotate(-9deg);border:.45cqw solid #11704F;color:#11704F;font:800 3.4cqw/1 var(--font-b);padding:1.1cqw 2cqw;border-radius:1.4cqw;letter-spacing:.08em;background:rgba(255,253,246,.85)}
.cc .stamp.no{border-color:#B42318;color:#B42318}
.cc.crammed{font-size:2.6cqw;line-height:1.15;background-image:none}
.cc.crammed .cch{margin-bottom:.8cqw}
.cc .para{font-size:3.2cqw;line-height:1.3;margin:0 0 1.5cqw}
.cc .clip{border:.3cqw solid #999;background:#F1F1F1;padding:1.5cqw;font:2.4cqw/1.2 Georgia,serif;color:#333;transform:rotate(1.5deg);margin-top:1cqw}
.ccpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;align-items:start}
.cardrow{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:860px){.cardrow{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.ann{margin:0;padding:0;list-style:none;counter-reset:a}
.ann li{counter-increment:a;padding:6px 0 6px 30px;position:relative;border-bottom:1px dashed var(--line);font-size:.93rem}
.ann li::before{content:counter(a);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center}
.ann .k{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sc,var(--soft))}
.ann .u{color:var(--soft)}
.ptlist{list-style:none;padding:0;margin:8px 0;counter-reset:p}
.ptlist li{counter-increment:p;display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.ptlist li::before{content:counter(p) ".";font-weight:800;min-width:1.6em}
.ptlist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.ptlist li .mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:.8rem}
.bank button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;margin:4px 0;cursor:pointer;font-size:.92rem}
.bank button:disabled{opacity:.5}
.refusal{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1.5px solid var(--bad);border-radius:10px;padding:8px 12px;font-weight:700;margin:8px 0}
.warnfit{color:var(--bad);font-weight:700;font-size:.9rem}
.refs p{padding-left:2em;text-indent:-2em;font-size:.93rem;overflow-wrap:anywhere;word-break:break-word}
#printcard{display:none}
@media print{
  body.printing-card{background:#fff!important}
  body.printing-card>*:not(#printcard){display:none!important}
  body.printing-card #printcard{display:block!important;width:190mm;height:277mm;overflow:hidden}
  body.printing-card #printcard .ccw{max-width:none;width:190mm}
  body.printing-card #printcard .cc{width:190mm;height:268mm;aspect-ratio:auto;border-radius:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing-card #printcard .stamp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

     GameSave.save()                  save now (call at checkpoints: level done, answer checked, item placed …)

        <p class="skill"><b>Skill:</b> ${esc(skillOf(q, i))}</p>${clean(q.prompt)}
        ${Array.isArray(q.checklist) && q.checklist.length ? `<details class="sub"><summary>Checklist</summary><div class="body"><ul>${q.checklist.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div></details>` : ''}
        <details class="sub"><summary>Show model answer</summary><div class="body model">${clean(q.model)}</div></details>

    });

  }
  function openPaper(id) { showTab('papers', true); rendered.papers = true; renderPapers(id); const h = $('#ph'); goTop(h || $('#v-papers')); if (h) h.focus(); }

  /* ================= 4. ANNOTATED SAMPLES ================= */
  function marked(paras, prefix) {
    return paras.map((par, pi) => {

      return `<p>${html}</p><div class="note" id="${prefix}-p${pi}" hidden></div>`;
    }).join('');
  }
  const unmark = t => String(t).replace(/\{\{\d+\|/g, '').replace(/\}\}/g, '');
  function renderSamples(key) {
    const v = $('#v-samples'); const x = key && sampleByKey(key);

    let h = `<div class="card s-${st}"><div class="row" style="justify-content:space-between"><button type="button" class="btn ghost sm" data-open="samples:">← All samples</button>${tag(st)}</div>
      <h2 tabindex="-1" id="sh" style="margin-top:10px">${esc(s.title)}</h2>
      <p class="skill">${x.kind === 'reflective' ? 'Reflective' : 'Expository'} · ${esc(s.form || '')} · Topic: ${esc(s.topic || '')} · Audience: ${esc(s.audience || '')} · ${essayW} words</p>
      ${s.prompt ? `<div class="box">${clean(s.prompt)}</div>` : ''}
      <p class="lead2" style="margin-top:10px">Click a highlighted span to reveal its note.</p>

      ${bd.length ? `<h3 style="margin-top:14px">Mark breakdown: ${tot}/${of}</h3><div class="tablewrap"><table><thead><tr><th>Criterion</th><th>Marks</th><th>Why</th></tr></thead><tbody>${bd.map(b => `<tr><td>${esc(b.part)}</td><td>${esc(b.got)}/${esc(b.of)}</td><td>${esc(b.why)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      </div>`;
    if (J) {
      const jt = Array.isArray(J.text) ? J.text : [String(J.text || J)];
      const jb = Array.isArray(J.breakdown) ? J.breakdown : [];
      h += `<div class="card s-${st}"><h3>Question 3(b): the justification (${wc(strip(unmark(jt.join(' '))))} words)</h3><div class="essay">${marked(jt, 'j-' + x.key)}</div>
        ${jb.length ? `<div class="tablewrap"><table><thead><tr><th>Element</th><th>Marks</th><th>Why</th></tr></thead><tbody>${jb.map(b => `<tr><td>${esc(b.part)}</td><td>${esc(b.got)}/${esc(b.of)}</td><td>${esc(b.why)}</td></tr>`).join('')}</tbody></table></div><p class="skill">Total: ${jb.reduce((a, b) => a + (+b.got || 0), 0)}/15</p>` : ''}${notesBtn(QNOTES[7], 'Open the notes on the justification')}</div>`;
    }
    if (s.upgrade) h += `<div class="card"><h3>Upgrade: weak → strong</h3><div class="two"><div class="box"><b class="fbno">Weak</b><p>${esc(s.upgrade.weak)}</p></div><div class="box model"><b class="fbok">Strong</b><p>${esc(s.upgrade.strong)}</p></div></div><p style="margin-top:8px"><b>Why the strong version earns more:</b> ${esc(s.upgrade.why)}</p><div class="row">${notesBtn(QNOTES[6], 'Open the notes on Section B')}</div></div>`;
    v.innerHTML = h;
  }
  function openSample(key) { showTab('samples', true); rendered.samples = true; renderSamples(key); const h = $('#sh'); goTop(h || $('#v-samples')); if (h) h.focus(); }
  function toggleNote(btn) {
    const pre = btn.dataset.hl, n = +btn.dataset.n, pi = btn.dataset.pi, box = document.getElementById(pre + '-p' + pi);
    const isJ = pre.indexOf('j-') === 0, x = sampleByKey(pre.slice(2)); if (!x || !box) return;
    const notes = isJ ? ((x.s.justification || {}).notes || []) : (x.s.notes || []);

  }

  /* ================= 5. PRACTISE ================= */
  function renderPractise() {
    const v = $('#v-practise');
    const bestL = k => ST.best[k] != null ? `Best: ${ST.best[k]}%` : 'Not played yet';
    v.innerHTML = `<div class="card"><h2>Practise</h2><p class="lead2">Choose a level. Each round is scored and your best result is saved on this device.</p>
      <div class="grid" role="group" aria-label="Practice level">
        <button type="button" class="lv" data-lv="1" aria-pressed="${ST.lv === 1}"><b>Foundation · Strategy Spotter</b><span class="stars" aria-hidden="true">★☆☆</span><small>Match an annotated feature from a sample to the strategy it shows. Signal words are available as a hint.</small><small>${bestL('l1')}</small></button>
        <button type="button" class="lv" data-lv="2" aria-pressed="${ST.lv === 2}"><b>Core · Answer, then compare</b><span class="stars" aria-hidden="true">★★☆</span><small>Answer a Section A question, check it against the mark scheme, then compare it with the model.</small><small>${bestL('l2')}</small></button>
        <button type="button" class="lv" data-lv="3" aria-pressed="${ST.lv === 3}"><b>Challenge · Timed Section B plan</b><span class="stars" aria-hidden="true">★★★</span><small>Plan a 3(a) piece and your 3(b) justification in 12 minutes, using the strategy you choose.</small><small>${bestL('l3')}</small></button>
      </div></div><div id="pr-body"></div>`;
    if (ST.lv === 2) renderCore(); else if (ST.lv === 3) renderChal(); else startSpot(true);
  }
  function setLevel(n) { ST.lv = n; save(); $$('[data-lv]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.lv === n))); if (n === 2) renderCore(); else if (n === 3) renderChal(); else startSpot(); }

  /* ---- Foundation: Strategy Spotter ---- */
  let SP = null;
  function spotBack() {
    const s = ST.spot, ok = (v, hi) => Number.isInteger(v) && v >= 0 && v <= hi;
    if (!s || typeof s !== 'object' || !Array.isArray(s.ids) || !s.ids.length || !s.ids.every(i => ok(i, FEAT.length - 1))) return false;
    if (!ok(s.i, s.ids.length - 1) || !ok(s.score, s.ids.length) || !Array.isArray(s.ans) || s.ans.length > s.i + 1 || s.ans.length < s.i || !s.ans.every(a => STRATS.some(st => st.id === a))) return false;
    SP = { items: s.ids.map(i => FEAT[i]), i: s.i, score: s.score, ans: s.ans.slice(), hint: !!s.hint };
    return true;
  }
  function startSpot(resume) {
    try { if (resume && spotBack()) return drawSpot(); } catch (e) { }
    const pick = [];
    STRATS.forEach(st => shuffle(FEAT.filter(f => f.s === st.id)).slice(0, 2).forEach(f => pick.push(f)));
    SP = { items: shuffle(pick), i: 0, score: 0, ans: [], hint: false };
    drawSpot();
  }
  function drawSpot(fb) {
    const b = $('#pr-body'); if (!b) return;
    ST.spot = { ids: SP.items.map(f => FEAT.indexOf(f)), i: SP.i, score: SP.score, ans: SP.ans, hint: SP.hint }; save();
    if (SP.i >= SP.items.length) return endSpot();
    const it = SP.items[SP.i], done = SP.ans.length > SP.i;
    b.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Strategy Spotter · ${SP.i + 1} of ${SP.items.length}</h3><span class="tag s-ps">Score ${SP.score}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${Math.round(SP.i / SP.items.length * 100)}%"></i></div>
      <p>Which strategy does this annotated feature show?</p><blockquote class="excerpt">${esc(it.t)}</blockquote><p class="skill">From the sample “${esc(it.src)}”</p>
      <div class="opts">${STRATS.map(st => { let cls = 'opt s-' + st.id; if (done) { if (st.id === it.s) cls += ' right'; else if (st.id === SP.ans[SP.i]) cls += ' wrong'; } return `<button type="button" class="${cls}" data-spot="${st.id}"${done ? ' disabled' : ''}>${done && st.id === it.s ? '✓ ' : done && st.id === SP.ans[SP.i] ? '✗ ' : ''}${st.icon} ${esc(st.name)}</button>`; }).join('')}</div>
      ${done ? '' : `<button type="button" class="btn ghost sm" data-spothint>${SP.hint ? 'Hide' : 'Show'} the signal words</button>${SP.hint ? `<div class="two" style="margin-top:8px">${STRATS.map(st => `<div class="box s-${st.id}"><b>${esc(st.short)}</b><ul class="signals">${st.signals.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}`}
      ${fb || ''}${done ? `<div class="row"><button type="button" class="btn gold" data-spotnext>${SP.i + 1 < SP.items.length ? 'Next excerpt →' : 'See my result'}</button></div>` : ''}</div>`;
  }
  function answerSpot(choice) {
    const it = SP.items[SP.i]; if (SP.ans.length > SP.i) return;
    SP.ans.push(choice); const ok = choice === it.s; if (ok) SP.score++;
    const x = SAMPLES.find(y => y.s.title === it.src);
    const good = ok ? `you matched “${esc(it.sig)}” to ${esc(S(it.s).name)}. ${esc(it.why)}` : `your choice of ${esc(S(choice).short)} was a reasoned one: ${esc(NEAR[choice][it.s])}`;
    const fix = ok ? `Nothing to fix in this answer. To push further in your own Section B piece, ${esc(S(it.s).tip)}.` : `This excerpt shows <b>${esc(S(it.s).name)}</b>. The giveaway is “${esc(it.sig)}”: ${esc(it.why)} Look for signals such as ${S(it.s).signals.slice(0, 3).map(esc).join(', ')}.`;
    const next = ok ? 'keep reading for the signal words before the meaning; it worked here.' : `open “${esc(it.src)}” and click its highlighted spans to see the strategy at work.${x ? ` <button type="button" class="btn ghost sm" data-open="sample:${x.key}">Open the sample</button>` : ''}`;
    drawSpot(`<p class="${ok ? 'fbok' : 'fbno'}">${ok ? '✓ Correct.' : '✗ Not this time.'}</p>` + sandwich(good, fix, next));
  }
  function endSpot() {
    const b = $('#pr-body'), n = SP.items.length, tally = {};
    STRATS.forEach(st => { tally[st.id] = { r: 0, t: 0, miss: null }; });
    SP.items.forEach((it, i) => { const t = tally[it.s]; t.t++; if (SP.ans[i] === it.s) t.r++; else if (!t.miss) t.miss = it; });
    const chosen = {}; SP.ans.forEach(a => { chosen[a] = (chosen[a] || 0) + 1; });
    const most = Object.keys(chosen).sort((a, c) => chosen[c] - chosen[a])[0];
    const perfect = STRATS.filter(st => tally[st.id].t && tally[st.id].r === tally[st.id].t);
    const weak = STRATS.filter(st => tally[st.id].r < tally[st.id].t).sort((a, c) => (tally[a.id].r - tally[a.id].t) - (tally[c.id].r - tally[c.id].t))[0];
    const exFirst = perfect.length ? SP.items.find(it => it.s === perfect[0].id) : null;
    const good = perfect.length ? `you identified every ${esc(perfect[0].name)} excerpt (${tally[perfect[0].id].r}/${tally[perfect[0].id].t}), including “${quoteSome(exFirst.t, 10)}”${perfect.length > 1 ? `, and you were perfect on ${perfect.length - 1} other strateg${perfect.length > 2 ? 'ies' : 'y'} too` : ''}.` : `you committed to an answer on all ${n} excerpts and chose ${esc(S(most).short)} most often, so you already recognise its features when you see them.`;
    const fix = weak ? `${esc(weak.name)} caught you out ${tally[weak.id].t - tally[weak.id].r} time${tally[weak.id].t - tally[weak.id].r > 1 ? 's' : ''}. In “${quoteSome(weak && tally[weak.id].miss.t, 12)}” the signal is “${esc(tally[weak.id].miss.sig)}”. ${esc(weak.what.split('. ')[0])}.` : `Nothing to fix: ${SP.score}/${n}. To push further, explain to a classmate how each signal word earns Organisation marks in Section B.`;
    const next = weak ? `play another round (the excerpts change), then open an annotated ${esc(weak.short)} sample and click its highlighted spans. ${notesBtn(weak.notes)}` : 'move up to Core and answer a Section A question, then compare it with the model.';
    const rows = SP.items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.t)}</td><td>${esc(S(SP.ans[i]).short)}</td><td>${esc(S(it.s).short)}</td><td>${SP.ans[i] === it.s ? '✓' : '✗'}</td></tr>`).join('');
    const doc = { title: 'Strategy Spotter (Foundation)', score: SP.score, max: n, html: `<p>Score: ${SP.score} / ${n}</p><table><tr><th>#</th><th>Excerpt</th><th>My answer</th><th>Strategy</th><th></th></tr>${rows}</table>` };
    b.innerHTML = `<div class="card"><h3>Round complete</h3><p class="score">${SP.score} / ${n}</p><div class="bar" aria-hidden="true"><i style="width:${Math.round(SP.score / n * 100)}%"></i></div>
      <div class="tablewrap"><table><thead><tr><th>Strategy</th><th>Correct</th></tr></thead><tbody>${STRATS.map(st => `<tr><td>${st.icon} ${esc(st.name)}</td><td>${tally[st.id].r}/${tally[st.id].t}</td></tr>`).join('')}</tbody></table></div>
      ${sandwich(good, fix, next)}<div class="row"><button type="button" class="btn" data-spotagain>↻ Play another round</button><button type="button" class="btn ghost" data-lvgo="2">Try Core →</button></div>${workRow('spot', doc)}</div>`;
    best('l1', SP.score, n); postResult('Strategy Spotter (Foundation)', SP.score, n, 1);
  }

  /* ---- Core: answer a Section A question, then compare ---- */
  let CORE = ST.core && typeof ST.core === 'object' && typeof ST.core.pid === 'string' ? { pid: ST.core.pid, qi: Number.isInteger(ST.core.qi) ? ST.core.qi : 0 } : { pid: null, qi: 0 };
  function renderCore() {
    const b = $('#pr-body'); if (!b) return; if (!PAPERS.length) { b.innerHTML = '<div class="card"><p>The practice papers could not be loaded.</p></div>'; return; }
    const p = paperById(CORE.pid) || PAPERS[PAPERS.length - 1]; CORE.pid = p.id;
    if (!p.questions[CORE.qi] || p.questions[CORE.qi].section !== 'A') CORE.qi = 0;
    ST.core = { pid: CORE.pid, qi: CORE.qi }; save();
    const q = p.questions[CORE.qi], dk = p.id + ':' + CORE.qi, draft = ST.drafts[dk] || '';
    b.innerHTML = `<div class="card"><h3>Core · Answer a Section A question, then compare</h3>
      <div class="two"><div><label class="f" for="core-p">Practice paper</label><select id="core-p">${PAPERS.map(x => `<option value="${esc(x.id)}"${x.id === p.id ? ' selected' : ''}>${esc(pTitle(x))}</option>`).join('')}</select></div>
      <div><label class="f" for="core-q">Question</label><select id="core-q">${p.questions.map((x, i) => x.section === 'A' ? `<option value="${i}"${i === CORE.qi ? ' selected' : ''}>${esc(x.title)} · ${esc(x.marks)} marks · ${esc(skillOf(x, i))}</option>` : '').join('')}</select></div></div>
      <div class="row" style="margin-top:8px"><button type="button" class="btn ghost sm" data-corerand>🎲 Random question</button>${tag(pStrat(p))}</div>
      <details class="sub" open><summary>Stimulus</summary><div class="body stimwrap">${clean(p.stimulus)}</div></details>
      <div class="q"><div class="qh"><b>${esc(q.title)}</b><span class="tag s-${pStrat(p)}">${esc(q.marks)} marks</span></div><p class="skill"><b>Skill:</b> ${esc(skillOf(q, CORE.qi))}</p>${clean(q.prompt)}
      ${Array.isArray(q.checklist) ? `<details class="sub"><summary>Checklist</summary><div class="body"><ul>${q.checklist.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div></details>` : ''}
      <label class="f" for="core-ans">Your answer</label><textarea id="core-ans" spellcheck="true">${esc(draft)}</textarea><p class="wc" id="core-wc" aria-live="polite"></p>
      <div class="row"><button type="button" class="btn gold" data-corecheck>✓ Check my answer</button></div></div><div id="core-res"></div></div>`;
    updCoreWc();
  }
  function updCoreWc() { const t = $('#core-ans'), p = paperById(CORE.pid), q = p && p.questions[CORE.qi]; if (!t || !q) return; $('#core-wc').textContent = `${wc(t.value)} words · aim for ${q.min}–${q.max}`; }
  function sentenceWith(text, frag) { const ss = String(text).match(/[^.!?]+[.!?]*/g) || []; const s = ss.find(x => x.toLowerCase().indexOf(String(frag).toLowerCase()) >= 0) || ss[0] || ''; return quoteSome(s, 18); }
  function checkCore() {
    const p = paperById(CORE.pid), q = p.questions[CORE.qi], text = ($('#core-ans').value || '').trim(), words = wc(text);
    const crit = (q.rubric || []).map(r => { const hits = (r.look || []).map(src => { try { const m = new RegExp(src, 'i').exec(text); return m ? m[0] : null; } catch (e) { return null; } }).filter(Boolean); return { r, hits, ok: words >= 8 && hits.length >= (r.min || 1) }; });
    const thin = words >= 8 && words < Math.ceil((q.min || 20) / 2);
    let score = crit.filter(c => c.ok).reduce((a, c) => a + (+c.r.marks || 0), 0);
    if (thin) score = Math.min(score, Math.floor(q.marks / 2));
    const okc = crit.find(c => c.ok), miss = crit.find(c => !c.ok);
    let good, fix, next;
    if (!words) { good = 'you opened the question and read the prompt, which is the first step.'; }
    else if (okc) good = `your answer meets “${esc(okc.r.criterion)}”: “${sentenceWith(text, okc.hits[0])}” shows the marker that you have addressed it.`;
    else good = `you attempted the question in ${words} words, beginning “${quoteSome(text, 10)}”, so you have a draft to build on.`;
    if (words < 8) fix = `an answer of ${words} words cannot earn the marks: this question is worth ${q.marks} marks and needs about ${q.min}–${q.max} words. Make each point, then explain it with “because” or “so”.`;
    else if (thin) fix = `your answer has only ${words} words, so the points are named rather than explained; the estimate is capped at half marks. This question needs about ${q.min}–${q.max} words: for each point, add a sentence that explains it with “because” or “so” and refers to the stimulus.`;
    else if (miss) fix = `“${esc(miss.r.criterion)}” (${esc(miss.r.marks)} marks) is not yet secure. The mark scheme withholds marks when: ${esc(miss.r.weak || 'the point is not explained')} To earn it: ${esc(miss.r.strong || '')}`;
    else fix = `nothing is missing that the checker can see. To make it exam-proof, check that every point is explained (because…, so…) and that you stay within ${q.max} words (you used ${words}).`;
    next = miss ? `read the model answer below, find the sentence that meets “${esc(miss.r.criterion)}”, then add one sentence of your own that does the same job.` : 'try a question that tests a different skill, or move up to Challenge and plan a Section B piece.';
    const res = $('#core-res');
    const doc = { title: `Section A answer: ${pTitle(p)}, ${q.title}`, score, max: q.marks, html: `<p><b>${esc(pTitle(p))}</b></p>${clean(q.prompt)}<h2>My answer (${words} words)</h2><div class="ss-ans">${esc(text)}</div><p>Estimated mark: ${score} / ${q.marks}</p><ul>${crit.map(c => `<li>${c.ok ? '✓' : '✗'} ${esc(c.r.criterion)} (${esc(c.r.marks)})</li>`).join('')}</ul>` };
    res.innerHTML = `<div class="card" style="margin-top:12px"><p class="score">${score} / ${esc(q.marks)}</p><p class="skill">An automatic estimate from the key ideas the mark scheme looks for; your teacher’s mark may differ.</p>
      <ul class="ok-list">${crit.map(c => `<li class="${c.ok ? 'y' : 'n'}">${esc(c.r.criterion)} <span class="skill">(${esc(c.r.marks)} mark${c.r.marks > 1 ? 's' : ''})</span></li>`).join('')}</ul>
      ${sandwich(good, fix, next)}
      <h3>Compare with the model</h3><div class="two"><div class="box"><b>Your answer</b><p style="white-space:pre-wrap">${esc(text) || '<i>(empty)</i>'}</p></div><div class="box model"><b>Model answer</b>${clean(q.model)}</div></div>
      <details class="sub"><summary>Mark scheme</summary><div class="body">${clean(q.key)}</div></details>
      <div class="row">${notesBtn(QNOTES[CORE.qi])}<button type="button" class="btn ghost" data-corerand>🎲 Another question</button></div>${workRow('core', doc)}</div>`;
    best('l2', score, q.marks); postResult(`Section A answer, ${pTitle(p)} ${q.title} (Core)`, score, +q.marks, 2);
    goTop(res);
  }

  /* ---- Challenge: timed Section B plan ---- */
  const FORMS = { Reflective: ['Personal essay', 'Journal entry', 'Memoir extract', 'Reflective blog post'], Expository: ['Feature article', 'Newspaper column', 'Radio talk script', 'Blog post with subheadings', 'Explanatory guide'] };
  let CH = { pid: typeof ST.chpid === 'string' ? ST.chpid : null, end: 0, t: null, done: false };

    const C = [

    const items = c.pts.map(p => ({ g: grp(p[0]), t: p[1] }));

    if (src) items.push({ g: 'Facts with sources', t: 'Copied: "' + src.split(/\s+/).slice(8, 40).join(' ') + '…"', weak: 'copy' });
    const groups = {}; shuffle(items).forEach(it => { (groups[it.g] = groups[it.g] || []).push(it); });

  }
  function basisQ(c) { const y = c && c.year ? yearObj(c.year) : null; if (!y) return null; const m = /Module (\d)/.exec(c.basis || '') ; return y.questions.find(q => String(q.module) === (m ? m[1] : '3')) || y.questions[0]; }
  function drawB() {

    list.innerHTML = B.pts.map((p, i) => `<li><span>${esc(p)}</span><button type="button" class="mini" data-bup="${i}" aria-label="Move point ${i + 1} up"${i ? '' : ' disabled'}>↑</button><button type="button" class="mini" data-bedit="${i}" aria-label="Edit point ${i + 1}">✎</button><button type="button" class="mini" data-bdel="${i}" aria-label="Remove point ${i + 1}">✕</button></li>`).join('');

  }
  function bAdd(txt) {

    if (B.locked) { bMsg('<div class="refusal">' + (ST.blv === 3 && !B.started ? 'Start the timer first.' : 'The sheet is locked.') + '</div>'); return false; }

  }
  function relatedTo(p, t) {
    if (/→|->|\bplan\b|\boutline\b|\bhook\b|\bsec(tion)?\.? a\b|\bslogan\b|\bproverb\b|\bterms?\b|\bsurvey\b|\binterview/i.test(p)) return true;
    const stem = w => w.toLowerCase().replace(/(ing|ies|es|s)$/, '');

    if (t.card) { t.card.pts.forEach(x => { pool = pool.concat(x[1].split(/[^A-Za-z]+/)); }); const pp = t.card.paper && paperById(t.card.paper); if (pp) pool = pool.concat(strip(pp.stimulus).split(/[^A-Za-z]+/)); const bq = basisQ(t.card); if (bq) pool = pool.concat(strip(bq.extract).split(/[^A-Za-z]+/)); }
    const STOPW = /^(this|that|with|from|have|will|your|their|they|them|what|when|more|most|than|then|also|only|into|over|each|every|about|after|before|other|these|those|which|while|where|there|here|very|much|many|some|such|make|made|like|just|been|were|being|because|people|good|great|important|problem|problems|everywhere|always|today|days|time|years)$/i;
    const set = new Set(pool.filter(w => w.length > 3 && !STOPW.test(w)).map(stem));

  function checkCard(timeUp) {
    const t = bTopic(), P = B.pts, num = i => 'point ' + (i + 1);

    const iLocal = idx(p => TERRITORIES.test(p));
    const tw = (t.topic + ' ' + (t.card ? t.card.pts.filter(x => /term/i.test(x[0])).map(x => x[1].split(/[:=]/)[0]).join(' ') : '')).toLowerCase().split(/[^a-z]+/).filter(w => w.length > 3);

      { k: 'A key term and its meaning', ok: iTerm >= 0, fix: 'add a key term with “=” or “Terms:”, so you can define the topic precisely in 3(a).' },
      { k: 'A short quotation or proverb', ok: iQuote >= 0, fix: 'add a proverb or a short quotation from your own interview, inside quotation marks.' },
      { k: 'An outline of the planned piece', ok: iPlan >= 0, fix: 'add “Plan:” with your stages joined by →, e.g. hook → problem → solutions → call to action.' },
      { k: 'Help for Section A (media and a local source)', ok: iSecA >= 0, fix: 'add “Sec A:” with one traditional and one digital medium and one local source of information.' },

    ];

    const goodIdx = iFact >= 0 ? iFact : iLocal >= 0 ? iLocal : iQuote >= 0 ? iQuote : 0;
    const good = !P.length ? `you chose a topic (${esc(t.topic.toLowerCase())} for ${esc(t.aud.toLowerCase())}), which is where every good notes sheet starts.` :
      iFact >= 0 ? `${num(iFact)}, “${quoteSome(P[iFact], 14)}”, gives a fact with its source, which you can turn into logos in 3(a) and ethos in 3(b).` :
      iLocal >= 0 ? `${num(iLocal)}, “${quoteSome(P[iLocal], 14)}”, is a specific local example that makes your piece original.` : `${num(goodIdx)}, “${quoteSome(P[goodIdx], 14)}”, is a short note you can expand into a paragraph.`;

    if (d.bdel) { B.pts.splice(+d.bdel, 1); persist(); drawB(); return; }

  });
  document.addEventListener('input', e => {
    if (e.target.id === 'core-ans') { ST.drafts[CORE.pid + ':' + CORE.qi] = e.target.value; save(); updCoreWc(); }

})();

    '.modal{position:fixed;inset:0;display:grid;place-items:center;background:#030a1fcc;z-index:5;padding:16px;animation:fade .2s}@keyframes fade{from{opacity:0}}' +
    '.mbox{width:min(360px,100%);background:linear-gradient(180deg,#10285f,#0a1a44);border:2px solid #f2b705;border-radius:20px;padding:20px;text-align:center;color:#eaf0ff;box-shadow:0 20px 60px #000a;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.85);opacity:0}}' +
    '.mbox .av{width:64px;height:64px;font-size:34px;margin:0 auto 10px}.mbox h3{margin:0 0 4px;font-size:18px;color:#fff}.mbox p{margin:0 0 14px;font-size:13px;color:#cdd8f5}' +
    '.toasts{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:6;width:min(380px,92vw)}' +
    '.toast{background:#0a1a44f2;color:#fff;border:1px solid #f2b705;border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px #0007;animation:fade .2s}' +
    '.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.grid button{aspect-ratio:1;border-radius:9px;background:#ffffff12;font-size:18px}.grid button.on{background:#f2b705}' +
    '.subs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.subs label{text-transform:none;letter-spacing:0;font-size:12px;color:#eaf0ff;font-weight:600;display:flex;gap:6px;align-items:center;background:#ffffff0d;padding:7px;border-radius:9px;margin:0}.subs input{width:auto}' +
    '.f{margin-bottom:12px}.err{color:#ffab95;font-size:12px;margin-top:-6px;margin-bottom:10px}.foot{font-size:10.5px;color:#7f8db8;text-align:center;padding:8px;border-top:1px solid #ffffff12}';

  function avHTML(a, cls) { a = a || '🦁'; return '<div class="av ' + (cls || '') + '">' + (/^(https?:|data:image)/.test(a) ? '<img alt="" src="' + esc(a) + '">' : esc(a)) + '</div>'; }
  var rq = 0; function renderSoon() { if (rq) return; rq = setTimeout(function () { rq = 0; render(); }, 120); }

  var draft = null;
  function viewSetup() {
    var d = draft || (draft = Object.assign({ name: '', cls: '', avatar: '🦁', flag: '🇸🇽', plan: [CFG.gameSubject] }, ls('ea_arena_profile') || {}));
    return '<div class="card"><h3>Set up your arena card</h3>' +
      '<div class="f"><label>Name or alias</label><input id="f-name" maxlength="20" value="' + esc(d.name) + '" placeholder="e.g. Kai_IT"></div>' +
      '<div class="f"><label>Class</label><input id="f-cls" maxlength="10" value="' + esc(d.cls) + '" placeholder="e.g. L6, 5A"></div>' +
      '<div class="f"><label>Avatar</label><div class="grid">' + AVATARS.map(function (a) { return '<button data-av="' + a + '" class="' + (a === d.avatar ? 'on' : '') + '">' + a + '</button>'; }).join('') + '</div></div>' +
      '<div class="f"><label>Flag</label><select id="f-flag">' + FLAGS.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === d.flag ? ' selected' : '') + '>' + f[0] + '  ' + esc(f[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label>Subjects in your plan</label><div class="subs">' + SUBJ_ORDER.map(function (k) { return '<label><input type="checkbox" data-sub="' + k + '"' + (d.plan.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(subjName(k)) + '</label>'; }).join('') + '</div></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn big" data-act="save">Enter the arena</button></div>';
  }
  function viewList() {
    var me = S.me, out = '';
    out += '<div class="me">' + avHTML(me.avatar) + '<div class="grow"><div class="nm">' + esc(me.name) + ' ' + esc(me.flag) + '</div><div class="sub">' + esc(me.cls || 'No class') + ' · ' + me.plan.length + ' subject' + (me.plan.length === 1 ? '' : 's') + '</div></div>' + (me.locked ? '' : '<button class="btn2" data-act="edit">Edit</button>') + '</div>';
    out += '<label>Challenge subject</label><select id="subj">' + me.plan.map(function (k) { return '<option value="' + k + '"' + (k === S.subject ? ' selected' : '') + '>' + esc(subjName(k)) + '</option>'; }).join('') + '</select>';
    var live = S.conn === 'live' || S.conn === 'local';
    var ids = Object.keys(S.players).filter(function (k) { return S.filter === 'all' || (S.players[k].user.cls || '').toLowerCase() === (me.cls || '').toLowerCase(); });
    ids.sort(function (a, b) { var A = S.players[a], B = S.players[b]; return (A.status === 'match') - (B.status === 'match') || A.user.name.localeCompare(B.user.name); });
    out += '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Everyone</button><button class="chip ' + (S.filter === 'class' ? 'on' : '') + '" data-filter="class">My class</button></div>';
    out += '<div class="status"><i class="' + (live ? '' : 'off') + '"></i>' + (live ? ids.length + ' in the arena now · updates every few seconds' : S.conn === 'error' ? 'Can\'t reach the arena. Retrying…' : 'Connecting…') + '</div>';
    if (S.host) out += viewLobby();
    if (S.pendingJoin) out += '<div class="card"><h3>Joining ' + esc(S.pendingJoin.name) + '\'s match…</h3><div class="sub">Hang tight.</div></div>';
    if (!ids.length) out += '<div class="empty">No one else has the arena open right now.<br>Classmates appear here as soon as they open it.</div>';
    ids.forEach(function (k) {
      var p = S.players[k], u = p.user, c = canChallenge(k);
      var badge = p.status === 'match' ? '<span class="badge m">In match</span>' : p.status === 'hosting' ? '<span class="badge h">Lobby</span>' : '<span class="badge">Online</span>';
      out += '<div class="pl">' + avHTML(u.avatar) + '<div class="grow"><div class="nm">' + esc(u.name) + ' ' + esc(u.flag || '') + badge + '</div><div class="sub">' + esc(u.cls || '—') + '</div></div>' +
        '<div><button class="btn" data-ch="' + esc(k) + '"' + (c.ok ? '' : ' disabled') + '>🎯 ' + (S.host ? 'Add' : 'Challenge') + '</button>' + (c.ok ? '' : '<div class="why">' + esc(c.why) + '</div>') + '</div></div>';
    });
    return out;
  }
  function viewLobby() {
    var h = S.host; var t = now(), rows = '';
    for (var k in h.invites) { var i = h.invites[k]; rows += '<div class="inv">' + avHTML(i.user.avatar, 'mini') + '<span>' + esc(i.user.name) + '</span><span class="st ' + i.status + '">' + (i.status === 'pending' ? 'Waiting ' + mmss(i.deadline - t) : i.status.charAt(0).toUpperCase() + i.status.slice(1)) + '</span></div>'; }
    return '<div class="card"><h3>🎯 Your match · ' + esc(subjName(h.subject)) + '</h3>' + rows +
      '<div class="sub" style="margin:8px 0">' + (S.match ? 'Match in progress — accepted players join straight in.' : 'Waiting for answers. You can challenge more classmates into this match (up to ' + MAX_PLAYERS + ' players).') + '</div>' +
      (S.match ? '' : '<button class="btn2" data-act="cancel">Cancel match</button>') + '</div>';
  }
  function viewMatch() {
    var m = S.match, out = '<div class="row" style="margin-bottom:6px"><div class="grow"><div class="nm">🎯 ' + esc(subjName(m.subject)) + '</div><div class="sub">Private match · ' + Object.keys(m.players).length + ' player' + (Object.keys(m.players).length === 1 ? '' : 's') + '</div></div><button class="btn2" data-act="leavematch">' + (m.phase === 'done' ? 'Back to arena' : 'Leave') + '</button></div>';
    if (m.phase === 'countdown') out += '<div class="cd">' + m.cd + '</div><div class="sub" style="text-align:center">Match starts in ' + m.cd + '… ' + QN + ' questions, ' + QTIME + 's each · 15 minutes max.</div>';
    else if (m.phase === 'q' || m.phase === 'fb') {
      var qi = m.phase === 'q' ? m.i : m.i - 1, q = m.qs[qi], left = m.phase === 'q' ? Math.max(0, QTIME - (now() - m.qStart) / 1000) : 0;
      out += '<div class="row sub" style="margin-top:10px"><span>Question ' + (qi + 1) + ' of ' + m.qs.length + '</span><span style="margin-left:auto">⏱ ' + Math.ceil(left) + 's · ' + m.score + ' pts</span></div><div class="bar"><b style="width:' + (left / QTIME * 100) + '%"></b></div>';
      out += '<div class="q">' + esc(q.q) + '</div>';
      q.opts.forEach(function (o, i) { var c = ''; if (m.phase === 'fb') { if (i === q.ans) c = 'ok'; else if (i === m.picked) c = 'bad'; } out += '<button class="opt ' + c + '" data-pick="' + i + '"' + (m.phase === 'fb' ? ' disabled' : '') + '>' + esc(o) + '</button>'; });
      if (m.phase === 'fb') out += '<div class="sub" style="text-align:center;font-weight:700;color:' + (m.lastRight ? '#7cf0b0' : '#ffab95') + '">' + (m.lastRight ? 'Correct!' : m.picked === -1 ? 'Time\'s up!' : 'Not quite.') + '</div>';
    } else if (m.phase === 'done') {
      var r = ranking(), pos = 1 + r.findIndex(function (x) { return x.id === S.me.id; });
      out += '<div class="cd" style="font-size:44px">' + (m.allDone ? (r.length > 1 && r[0].p.score === r[1].p.score && r[0].p.score === m.score ? '🤝 It\'s a tie!' : pos === 1 ? '🏆 You win!' : '#' + pos) : '✅ Done') + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (m.allDone ? 'Final results' : 'You scored ' + m.score + ' pts. Waiting for the others to finish…') + '</div>';
    }
    out += '<div class="card sb" style="margin-top:14px"><h3>Live scoreboard</h3>' + ranking().map(function (x, i) { var p = x.p; return '<div class="r ' + (x.id === S.me.id ? 'me' : '') + '"><span style="width:16px">' + (i + 1) + '</span>' + avHTML(p.user.avatar, 'mini') + '<span class="nm">' + esc(p.user.name) + ' ' + esc(p.user.flag || '') + '</span><span class="sub">' + (p.left ? 'left' : p.done ? 'finished' : 'Q' + Math.min(p.q + 1, QN)) + '</span><b>' + (p.score || 0) + '</b></div>'; }).join('') + '</div>';
    if (S.host && S.host.id === m.id) out += viewLobby();
    return out;
  }
  function viewModal() {
    var i = S.incoming; if (!i) return '';
    return '<div class="modal"><div class="mbox">' + avHTML(i.user.avatar) + '<h3>' + esc(i.user.name) + ' ' + esc(i.user.flag || '') + ' challenges you!</h3><p>' + esc(i.user.cls || '') + (i.user.cls ? ' · ' : '') + '<b style="color:#ffd970">' + esc(subjName(i.subject)) + '</b><br>Private match · expires in ' + mmss(i.deadline - now()) + '</p>' +
      '<div class="row"><button class="btn2 big" data-act="decline">Decline</button><button class="btn big" data-act="accept">Accept</button></div></div></div>';
  }
  function render() {
    if (root.activeElement && root.activeElement.tagName === 'SELECT' && !S.incoming) { renderSoon(); return; }
    var count = Object.keys(S.players).length, html = '<style>' + CSS + '</style>';
    if (!S.open) html += '<button class="fab" data-act="open" aria-label="Open Live Arena"><span class="ea">EA</span><span class="dot ' + (S.joined ? 'on' : '') + '"></span>Live Arena' + (S.joined ? '<span class="n">' + count + '</span>' : '') + '</button>';
    else {
      var body = (!S.me || S.editing) ? viewSetup() : S.match ? viewMatch() : viewList();
      html += '<div class="panel" role="dialog" aria-label="Live Arena"><div class="hd"><span class="ea">EA</span><div><h2>Live Arena</h2><small>Challenge classmates live</small></div><button class="x" data-act="close" aria-label="Minimise">–</button></div><div class="body">' + body + '</div>' +
        '<div class="foot">' + (S.joined ? '<button class="btn2" data-act="leave" style="padding:5px 10px;font-size:11px">Leave arena</button> · ' : '') + 'Exam Ace · Kester Small</div></div>';
    }
    html += viewModal();
    html += '<div class="toasts">' + S.toasts.map(function (t) { return '<div class="toast">' + esc(t.msg) + '</div>'; }).join('') + '</div>';
    var fx = root.activeElement && root.activeElement.id, val = fx && root.activeElement.value;
    root.innerHTML = html;
    if (fx) { var el = root.getElementById ? root.getElementById(fx) : null; if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(val.length, val.length); } catch (e) {} } }
  }
  function saveSetup() {
    var name = (root.getElementById('f-name').value || '').trim(), cls = (root.getElementById('f-cls').value || '').trim();
    draft.name = name; draft.cls = cls; draft.flag = root.getElementById('f-flag').value;
    if (name.length < 2) { S.err = 'Enter a name or alias (2+ characters).'; return render(); }
    if (BAD.test(name.replace(/[^a-z]/gi, ''))) { S.err = 'Please choose an appropriate name or alias.'; return render(); }
    if (!draft.plan.length) { S.err = 'Tick at least one subject.'; return render(); }
    S.err = ''; ls('ea_arena_profile', { name: name, cls: cls, avatar: draft.avatar, flag: draft.flag, plan: draft.plan });
    S.editing = false; var was = S.joined; S.me = resolveUser();
    if (S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0];
    if (!was) join(); else { beat(); render(); }
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button,[data-filter]') : null; if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') { S.open = true; if (!S.joined) join(); render(); }
    else if (a === 'close') { S.open = false; render(); }
    else if (a === 'leave') { leave(); S.open = false; render(); }
    else if (a === 'edit') { S.editing = true; draft = null; render(); }
    else if (a === 'save') saveSetup();
    else if (a === 'cancel') cancelHost('cancelled');
    else if (a === 'accept') answerInvite(true);
    else if (a === 'decline') answerInvite(false);
    else if (a === 'leavematch') leaveMatch();
    else if (b.hasAttribute('data-ch')) challenge(b.getAttribute('data-ch'));
    else if (b.hasAttribute('data-pick')) pick(+b.getAttribute('data-pick'));
    else if (b.hasAttribute('data-filter')) { S.filter = b.getAttribute('data-filter'); render(); }
    else if (b.hasAttribute('data-av')) { syncDraft(); draft.avatar = b.getAttribute('data-av'); render(); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'subj') { S.subject = t.value; render(); }
    else if (t.hasAttribute && t.hasAttribute('data-sub')) { syncDraft(); var k = t.getAttribute('data-sub'), i = draft.plan.indexOf(k); if (t.checked && i < 0) draft.plan.push(k); if (!t.checked && i >= 0) draft.plan.splice(i, 1); }
  });
  function syncDraft() { var n = root.getElementById && root.getElementById('f-name'); if (n && draft) { draft.name = n.value; draft.cls = root.getElementById('f-cls').value; draft.flag = root.getElementById('f-flag').value; } }
  ['keydown', 'keyup', 'keypress', 'copy', 'contextmenu'].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev === 'copy' || ev === 'contextmenu') e.preventDefault(); e.stopPropagation(); }); });

  function mount() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var parent = fs && fs !== document.documentElement ? fs : document.body;
    if (host.parentNode !== parent) parent.appendChild(host);
  }
  document.addEventListener('fullscreenchange', mount); document.addEventListener('webkitfullscreenchange', mount);
  function boot() { mount(); S.me = resolveUser(); if (S.me && S.me.plan.indexOf(S.subject) < 0) S.subject = S.me.plan[0]; render(); if (S.me && ls('ea_arena_auto')) join(); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  setInterval(function () { if (host.parentNode == null || !host.isConnected) mount(); }, 3000);

  window.EALiveArena = { open: function () { S.open = true; join(); render(); }, config: mergeCfg, _state: S };
})();

</script>
