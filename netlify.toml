# Netlify settings. Netlify installs the email library (package.json) and publishes the folder.
[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# The PDF invoices need pdfkit's built-in font files
[functions."invoices"]
  included_files = ["node_modules/pdfkit/js/data/**"]

# Morning summary email: every day at 11:00 UTC = 7:00 a.m. in Sint Maarten
[functions."daily-summary"]
  schedule = "0 11 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

# Keep set-up files private (they aren't pages)
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/SETUP-GUIDE.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

